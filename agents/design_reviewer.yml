# Design review: one of the independent oversight roles. It looks at the typeset pages as images, page by page: banned
# content, and whether the layout follows the design system (00D); every problem comes with an executable layout
# instruction.
# reports_to is null: independent oversight reports to no manager.
# schema: thesis-ci/spec/schemas/agent.schema.json (spec 0.2); charter in design_reviewer.md.
# can_see / cannot_see use the input names from the prompts' front matter; the prompts are in the private repository, so
# only their ids appear here.
role: design_reviewer
name: Design review
model:
  id: claude-fable-5-1
  effort: high
  fallbacks: default
  why: Oversight roles use the strongest model (design document default, decisions/0003); it has to read images page by page. fallbacks is default, meaning that on a refusal the server's default fallback rules apply; the model that actually answered is recorded by pipeline/llm.py. The page images (rendered_pages) are passed to the model by pipeline/llm.py as image blocks.
reports_to: null
can_see:
  - document                     # 09C: the text of 06, 07 and 08
  - visual_specs                 # 09C: layout intent for timelines, modules, branch diagrams and the like
  - report                       # 12C: the complete company report
  - cover
  - charts
  - main_visual
  - rendered_pages               # an image of every typeset page
cannot_see: []                   # the isolation table sets no extra limits for the design review
outputs:
  - design_checks
  - layout_instructions          # to the typesetter (19), passed on through 10 and 13
  - findings
  - questions
decision_rights:
  - audit                        # L1
prompts: ["09C", "12C"]
trust_managed: false
