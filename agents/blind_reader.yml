# Blind read: one of the independent oversight roles, and the core of the defense against anchoring. It reads only the new
# filings and independently answers the neutral questions HQ froze; it cannot see the thesis, the dossier or any conclusion.
# reports_to is null: independent oversight reports to no manager; its answers are compared question by question with the
# company manager's, and the divergence map goes to HQ first.
# Runs only for holdings; not for candidate companies, to control cost.
# schema: thesis-ci/spec/schemas/agent.schema.json (spec 0.2); charter in blind_reader.md.
# can_see / cannot_see use the input names from the prompts' front matter; conclusions keeps the term of the isolation
# table (C-AGENT-ISOLATION).
role: blind_reader
name: Blind read
model:
  id: claude-opus-5-5
  effort: high
  fallbacks: default
  why: "Every role runs on Claude Opus 5.5, the owner's choice (decisions/0025). The blind read must answer independently of the drafting role; with one model for all roles, that independence rests on what it may see (never the thesis) and on a separate call with no shared context. fallbacks is default: on a refusal (API backend only) the server's default fallback rules apply, and pipeline/llm.py records the model that actually answered."
reports_to: null
can_see:
  - filings                      # the new filings of this earnings event (earnings release, 10-Q or 6-K, call transcript), with source tags
  - question_list_stripped       # the question list after the pipeline removed the mapping from questions to thesis pillars and shuffled the order
cannot_see:
  - thesis
  - dossier
  - update                       # the company manager's draft update
  - draft_outputs                # all outputs of the 03 draft
  - question_list                # the question list with the mapping
  - question_answers             # the company manager's answers, question by question
  - qualitative_verdicts
  - prereg
  - valuation
  - conclusions                  # any conclusion
outputs:
  - blind_answers
  - unprompted_observations
decision_rights:
  - blind_read                   # L1
prompts: ["14A"]
trust_managed: false
