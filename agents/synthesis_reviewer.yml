# Synthesis review: one of the independent oversight roles; it reviews only the complete company report (11): production
# traces, whether there is real new analysis, and the quality of the argument.
# reports_to is null: independent oversight reports to no manager.
# schema: thesis-ci/spec/schemas/agent.schema.json (spec 0.2); charter in synthesis_reviewer.md.
# can_see / cannot_see use the input names from the prompts' front matter; the prompts are in the private repository, so
# only their ids appear here.
role: synthesis_reviewer
name: Synthesis review
model:
  id: claude-opus-5-5
  effort: high
  fallbacks: default
  why: "Every role runs on Claude Opus 5.5, the owner's choice (decisions/0025). It recomputes, one by one, the analyses that only appear when the pieces are joined. fallbacks is default: on a refusal (API backend only) the server's default fallback rules apply, and pipeline/llm.py records the model that actually answered."
reports_to: null
can_see:
  - report                       # the complete company report from 11
  - connections                  # the list of connections the author made
  - doc_02                       # the four research documents
  - doc_06
  - doc_07
  - doc_08
  - sources                      # source materials for recomputation
cannot_see: []                   # the isolation table sets no extra limits for the synthesis review; the parts of 12 run independently of each other, which the can_see allow-list ensures
outputs:
  - connection_audit
  - answers
  - findings
  - questions
decision_rights:
  - audit                        # L1
prompts: ["12B"]
trust_managed: false
