# Red team: one of the independent oversight roles (Munger: invert). It takes the side of someone about to write a short
# report and writes the inversion list of "how we could lose money permanently".
# reports_to is null: independent oversight reports to no manager; the inversion list is attached to the PR unchanged,
# and the company manager accepts or rejects its test proposals one by one.
# schema: thesis-ci/spec/schemas/agent.schema.json (spec 0.2); charter in red_team.md.
# can_see / cannot_see use the input names from the prompts' front matter. 04B and 09B are called in two passes: the
# first pass cannot see the product's own counter-arguments, and only the second gets them. This ordering is guaranteed
# by the prompts' inputs_pass1 / inputs_pass2 (the pipeline hands over material pass by pass), which a flat list cannot
# express; so product_counter_section and document_counter_section are listed only in can_see (the second pass needs
# them), and cannot_see lists the full products, the dossier and thesis.yml, which no pass receives.
role: red_team
name: Red team
model:
  id: claude-fable-5-1
  effort: high
  fallbacks: default
  why: Oversight roles use the strongest model (design document default, decisions/0003); a model that is different from and stronger than the drafting model reduces shared bias. fallbacks is default, meaning that on a refusal the server's default fallback rules apply; the model that actually answered is recorded by pipeline/llm.py.
reports_to: null
can_see:
  # First pass (04B, 09B) and 04B-lite
  - product_without_counter      # the research report without section 7; the dossier without parts 9 and 12
  - document_without_counter     # 07 without its "competitive ecosystem" overview, 08 without its "invert" section
  - thesis_without_loss_paths    # thesis.yml without permanent_loss_paths
  - dossier_without_9_12
  - update                       # 04B-lite: the draft update from 03
  - filings                      # 04B-lite: this event's filings
  - prior_inversion_list         # 04B-lite: last quarter's inversion list
  # Second pass: its own first-pass output, plus the counter-argument content removed in the first pass (given only in the second pass)
  - pass1
  - product_counter_section
  - document_counter_section
cannot_see:                      # not given in any pass
  - product                      # the full product with its counter-argument content
  - document
  - dossier                      # the full dossier, including part 9, "bear case", and part 12, "thesis breakers"
  - thesis                       # the full thesis.yml, including permanent_loss_paths
  - findings_04A                 # independent oversight roles answer separately: it cannot see the fact audit's conclusions
  - blind_answers                # nor the blind read's answers
outputs:
  - bear_case                    # 04B
  - inversion_list               # 04B, 04B-lite
  - test_proposals               # 04B, 04B-lite: effective only going forward
  - weakest_sentence             # 04B
  - counter_case                 # 09B
  - misleading_sentence          # 09B
  - findings
  - questions
decision_rights:
  - audit                        # L1; it only offers opinions and test proposals, and changes no archive or test itself
prompts: ["04B", "04B-lite", "09B"]
trust_managed: false
