# Fact audit: one of the independent oversight roles. It judges only whether each fact is right: it sees the atomic facts
# the extractor split out and the primary sources, not the product's reasoning or conclusions.
# reports_to is null: independent oversight reports to no manager (DESIGN.md, organization chart); neither HQ nor the
# company manager can direct or rewrite audit conclusions.
# schema: thesis-ci/spec/schemas/agent.schema.json (spec 0.2); charter in auditor.md.
# can_see / cannot_see use the input names from the prompts' front matter; conclusions and reasoning keep the terms of
# the isolation table (C-AGENT-ISOLATION).
role: auditor
name: Fact audit
model:
  id: claude-opus-5-5
  effort: high
  fallbacks: default
  why: "Every role runs on Claude Opus 5.5, the owner's choice (decisions/0025). The fact audit is the last line of defense against errors. fallbacks is default: on a refusal (API backend only) the server's default fallback rules apply, and pipeline/llm.py records the model that actually answered."
reports_to: null
can_see:
  - fact_table                   # the atomic facts 16A extracted from the product, with the source excerpts the pipeline cut by source tag
  - sources                      # full text of the primary materials, and the source table
  - field_evidence               # given only when 09A audits 07
cannot_see:
  - product                      # the product under audit itself
  - report
  - document
  - doc_02
  - doc_06
  - doc_07
  - doc_08
  - dossier
  - thesis
  - update
  - draft_outputs
  - reasoning                    # the product's reasoning
  - conclusions                  # the product's conclusions and the results of the other audit parts
outputs:
  - fact_verdicts
  - findings
  - questions
decision_rights:
  - audit                        # L1
prompts: ["04A", "09A", "12A"]
trust_managed: false
