# Typesetter: sets finalized content and layout intent into a PDF following the design system (00D); the content is
# frozen, and it changes no words or numbers.
# schema: thesis-ci/spec/schemas/agent.schema.json (spec 0.2); charter in typesetter.md.
# can_see / cannot_see use the input names from the prompts' front matter; the prompts are in the private repository, so
# only their ids appear here.
role: typesetter
name: Typesetter
model:
  id: claude-sonnet-5
  effort: high
  why: Typesetting is production to a specification, not judgment, so it uses the mid-tier model (design document default, decisions/0003); the product still goes through the design review (09C, 12C).
reports_to: hq_capital_allocator # a production step shared by all companies; layout problems that can only be solved by changing content go to HQ in questions
can_see:
  - content
  - cover
  - charts
  - visual_specs
  - main_visual
  - layout_instructions
  - wordmark
  - reference_designs
  - series
cannot_see: []                   # the isolation table sets no extra limits for the typesetter
outputs:
  - pdf
  - rendered_pages               # an image of every page, for the design review and the revision steps to re-check
  - layout_selfcheck
  - questions
decision_rights:
  - draft                        # L1: typesetting is filed under draft
prompts: ["19"]
trust_managed: false
