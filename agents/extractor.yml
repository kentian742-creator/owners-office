# Extractor: serves the isolation of the fact audit, and the metrics that have to be read from the text of filings. It
# only extracts; it does not judge.
# schema: thesis-ci/spec/schemas/agent.schema.json (spec 0.2); charter in extractor.md.
# can_see / cannot_see use the input names from the prompts' front matter; the prompts are in the private repository, so
# only their ids appear here.
role: extractor
name: Extractor
model:
  id: claude-sonnet-5
  effort: high
  why: Extraction means splitting and reading off the source text, not judging, so it uses the mid-tier drafting model (the design document's split of "mid-tier model for drafting, strongest model for oversight", decisions/0003).
reports_to: null                 # its output goes unchanged to the fact audit and the pipeline, and it takes no direction from the product's author (the company manager)
can_see:
  - product                      # 16A: the product to be audited and its source table; the product itself is what gets extracted, and it can be any product
  - filings                      # 16B: full text of this period's filings
  - metric_definitions           # 16B
  - prior_values                 # 16B: last period's readings, used only to check the basis
cannot_see:                      # apart from 16A's product itself, no thesis, dossier or drafts are given as background; 16B sees none of them at all
  - thesis
  - dossier
  - update
  - draft_outputs
outputs:
  - fact_table                   # 16A, to the fact audit (04A, 09A, 12A)
  - metric_values                # 16B, to the pipeline for judging tests, and to the settler
decision_rights:
  - parse                        # L1: extraction is filed under parse
prompts: ["16A", "16B"]
trust_managed: false
