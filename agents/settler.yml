# Settler: one of the independent oversight roles. It settles pre-registration and say-do ledger items that have come due,
# against the resolution criteria written in advance; it cannot see probabilities, authors or the owner's overrides.
# reports_to is null: independent oversight reports to no manager; ambiguities go to HQ for a ruling.
# schema: thesis-ci/spec/schemas/agent.schema.json (spec 0.2); charter in settler.md.
# can_see / cannot_see use the input names from the prompts' front matter; the prompts are in the private repository, so
# only their ids appear here.
role: settler
name: Settler
model:
  id: claude-opus-5-5
  effort: high
  fallbacks: default
  why: "Every role runs on Claude Opus 5.5, the owner's choice (decisions/0025). Settlement results go into the calibration record, the raw data for measuring the circle of competence. fallbacks is default: on a refusal (API backend only) the server's default fallback rules apply, and pipeline/llm.py records the model that actually answered."
reports_to: null
can_see:
  - event
  - items_blind                  # due pre-registration items, with only id, statement, criterion, data_source and horizon
  - filings
  - metric_values                # values fetched by the pipeline (XBRL and 16B), each with its source
  - ledger_due                   # due ledger items: side removed, marked with settle_as instead
cannot_see:
  - prereg                       # carries probabilities and authors; the owner's overrides are a separate file and are not given either
  - prereg_due                   # carries the probabilities of the time
  - ledger                       # the full ledger carries side, which shows who wrote a forecast
  - thesis
  - dossier
  - update
outputs:
  - prereg_settlement            # to 03 for the quarterly update, and to the pipeline to update the calibration record
  - ledger_settlement
  - questions
decision_rights:
  - test                         # L1: rulings against criteria written in advance; the decision-rights configuration has no separate "settle" action
prompts: ["15B"]
trust_managed: false
