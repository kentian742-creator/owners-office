# HQ: capital allocator. Guards the release gate, rules on questions, turns money matters into one-page memos for the
# owner, and compares across companies.
# schema: thesis-ci/spec/schemas/agent.schema.json (spec 0.2); charter in hq_capital_allocator.md.
# can_see / cannot_see use the input names from the prompts' front matter; the prompts are in the private repository, so
# only their ids appear here.
role: hq_capital_allocator
name: "HQ: capital allocator"
model:
  id: claude-opus-5-5
  effort: high
  fallbacks: default
  why: "Every role runs on Claude Opus 5.5, the owner's choice (decisions/0025). Question lists, divergence maps, memos and letters to the owner. fallbacks is default: on a refusal (API backend only) the server's default fallback rules apply, and pipeline/llm.py records the model that actually answered."
reports_to: owner                # the owner (chairman)
can_see:
  # The isolation table sets no limits for HQ, which can see everything; the list below gives the inputs its parts (14Q, 14B, 17A–17D, 18) actually receive
  - run_date
  - schema
  - constitution
  - decision_rights
  - gate_rules
  - dossier
  - thesis
  - filings
  - update
  - update_outputs
  - updates
  - merged_updates_list
  - question_list
  - question_answers
  - blind_answers
  - unprompted_observations
  - divergence_map
  - findings_04A
  - inversion_list
  - ci_results
  - trust_level
  - trust_changes
  - questions
  - questions_open
  - valuation
  - valuation_input_notes
  - series_roster
  - anchors
  - calibration
  - holdings
  - ranking
  - escalation
  - memo_requests
  - price_alert
  - memo_log
  - memos
  - month_events
  - owner_letter_items
  - l2_report
  - rulings
  - budget
  - failures
  - phase_status
  - prereg_activity
  - mistakes
cannot_see: []
outputs:
  - question_list                # 14Q, frozen before the earnings event
  - divergence_map               # 14B
  - gate_decision                # 17A
  - returns
  - rulings
  - owner_letter_items
  - memo                         # 17B, private; only when needed
  - reply
  - ranking                      # 17C, private
  - candidate_rotation
  - memo_requests
  - reaudit_pick                 # 17D
  - letter                       # 18, public
  - private_appendix             # 18, private
  - l2_report
  - questions
decision_rights:
  - draft                        # L1: question lists, divergence maps, letters, memo drafts
  - routine_merge                # L1: updates at trust level 1 are merged after item-by-item review
  - publish                      # L2: updates at trust levels 1 and 2 are published after review
  - candidate_rotation           # L2
  - model_selection              # L2
  - prompt_change                # L2: limited to 00 §F, §G and the non-owner clauses of the prompts
prompts: ["14Q", "14B", "17A", "17B", "17C", "17D", "18"]
trust_managed: false
