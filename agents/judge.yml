# Judge: one of the independent oversight roles. Qualitative tests go to an independent judge rather than to the author of
# the archive: it rules on a few yes-or-no questions against criteria written in advance.
# reports_to is null: independent oversight reports to no manager; the company manager can only dispose of a ruling, not
# overturn it.
# Runs only for holdings; the qualitative tests of candidate companies are recorded as undetermined.
# schema: thesis-ci/spec/schemas/agent.schema.json (spec 0.2); charter in judge.md.
# can_see / cannot_see use the input names from the prompts' front matter; the prompts are in the private repository, so
# only their ids appear here.
role: judge
name: Judge
model:
  id: claude-opus-5-5
  effort: high
  fallbacks: default
  why: "Every role runs on Claude Opus 5.5, the owner's choice (decisions/0025). Its rulings are published with the PR, so it must apply the criteria written in advance literally and consistently. fallbacks is default: on a refusal (API backend only) the server's default fallback rules apply, and pipeline/llm.py records the model that actually answered."
reports_to: null
can_see:
  - event                        # the period and close date of this earnings event
  - qualitative_tests            # only id, question, fail_if, warn_if, baseline and judge_notes; claim and note, which carry thesis wording, are not given
  - where_documents              # the documents named in the test's where, covering the lookback periods
cannot_see:
  - thesis
  - dossier
  - update
  - draft_outputs
outputs:
  - qualitative_verdicts         # to the company manager for disposition (03), and published with the PR
decision_rights:
  - test                         # L1: rulings on qualitative tests
prompts: ["14T"]
trust_managed: false
