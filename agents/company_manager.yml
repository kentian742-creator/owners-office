# Company manager: the equivalent of a Berkshire subsidiary CEO, one per company (holdings and candidates).
# schema: thesis-ci/spec/schemas/agent.schema.json (spec 0.2); charter in company_manager.md.
# can_see / cannot_see use the input names from the prompts' front matter (optional inputs without the trailing ?); the
# prompts are in the private repository, so only their ids appear here.
role: company_manager
name: Company manager
model:
  id: claude-opus-5-5
  effort: high
  fallbacks: default
  why: "Every role runs on Claude Opus 5.5, the owner's choice (decisions/0025). It drafts and revises archives, updates and reports; everything it produces goes through the fact audit and the red team. fallbacks is default: on a refusal (API backend only) the server's default fallback rules apply, and pipeline/llm.py records the model that actually answered."
reports_to: hq_capital_allocator
can_see:
  # Run parameters and rules
  - run_date
  - schema
  - constitution
  - sources
  # Archive and system files
  - dossier
  - existing_dossier
  - existing_system_files
  - thesis
  - ledger
  - lynch_template
  - metrics_registry
  - industries
  # New filings and data
  - filings
  - latest_filings
  - xbrl_facts
  - historical_records
  - field_evidence
  - event
  - release_history
  - calibration
  # Valuation (private)
  - valuation
  - series_roster
  - price_reference
  - holdings_marks              # a valuation: the listed equity portfolio of the latest 13F, marked at the price-reference date
  - year_end_closes
  - anchors
  - valuation_input_notes
  # Results of tests, independent rulings and settlements; the question list HQ froze
  - ci_results
  - qualitative_verdicts
  - prereg_settlement
  - prereg_due
  - ledger_settlement
  - question_list
  # Content handed back by other steps, waiting to be merged or finalized
  - pending_archive_patch
  - pending_test_proposals
  - pending_ledger_entries
  - prereg_candidates
  - archive_patch_draft
  - test_proposals_draft
  - prereg_candidates_draft
  - ledger_entries_draft
  - patches_02
  - patches_06_08
  - draft_outputs
  # Audit findings and HQ's returns
  - findings_04A
  - hq_rulings                   # 01A round 2: HQ's rulings on the archive's fact audit, incl. the owner's decisions
  - requested_documents          # 01A round 2, 01C, 02: the filings HQ asked the pipeline to supply (supply.yml)
  - findings_04B
  - findings_04C
  - bear_case_04B
  - weakest_sentence_04B
  - test_proposals_04B_lite
  - findings_09A
  - findings_09B
  - findings_09C
  - counter_case_09B
  - misleading_sentence_09B
  - layout_instructions_09C
  - findings_12V
  - findings_12A
  - findings_12B
  - findings_12C
  - connection_audit_12B
  - answers_12B
  - layout_instructions_12C
  - returns_17A
  # Products and layout
  - report
  - cover
  - charts
  - main_visual
  - connections
  - document
  - visual_specs
  - rendered_pages
  - wordmark
  - doc_02
  - doc_06
  - doc_07
  - doc_08
  # The owner's notes: leads only; facts go back to the primary materials to be verified
  - owner_notes
cannot_see:
  - blind_answers                # 14A's answers: not visible before it hands in its own question_answers, or the divergence map loses its point (00 §G6); none of the later parts takes them as input either
  - unprompted_observations      # same as above
outputs:
  # Archive, system files and valuation (01, 02, 05)
  - dossier
  - thesis
  - story
  - ledger
  - valuation_md
  - valuation_yml
  # Research reports, deep cognition and the complete company report (02, 05, 06–08, 10, 11, 13)
  - report
  - revised_report
  - cover
  - charts
  - document
  - revised_document
  - visual_specs
  - main_visual
  - connections
  - revised_connections
  # Quarterly update (03, 03R, 03P)
  - update
  - question_answers
  - dossier_changes
  - patch_decisions
  - reviewed_sections
  - pr_body
  - mistakes_entry
  - escalation                   # private; handed to HQ only when one of R6's four causes inside the business is touched
  # Pre-registration (15A)
  - prereg
  # Handoff channels (00 §F7)
  - archive_patch
  - archive_patch_draft
  - test_proposals
  - test_proposals_draft
  - prereg_candidates
  - prereg_candidates_draft
  - ledger_entries
  - ledger_entries_draft
  - patches_02
  - patches_06_08
  - layout_instructions
  - valuation_input_notes
  - revision_notes
  - sources_additions
  - l2_report
  - questions
decision_rights:
  - draft                        # L1
  - fact_revision                # L1
  - routine_merge                # L1; merging and publishing are routed by trust.routing
  - prereg_content               # L2 (15A)
  - scenario_probability         # L2 (08)
  - test_warning_disposition     # L2 (03)
  - publish                      # L2, only with a clean audit
prompts: ["01", "02", "03", "05", "06", "07", "08", "10", "11", "13", "15A"]
trust_managed: true
