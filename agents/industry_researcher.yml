# 行业研究员：每个行业一个，维护 industries/<id>/ 的行业模块与路标。
# schema: thesis-ci/spec/schemas/agent.schema.json（规范 0.2）；职责说明见 industry_researcher.md。
# 还没有编号提示词（第 4 阶段）。can_see / cannot_see 先用最接近的提示词输入名，提示词写成后按它的 front matter 改正。
role: industry_researcher
name: 行业研究员
model:
  id: claude-sonnet-5
  effort: high
  why: 起草类角色用中档模型（设计文档默认值，decisions/0003）；行业模块公开之前同样要经过事实审计。
reports_to: hq_capital_allocator
can_see:
  - run_date
  - constitution
  - industries                   # 行业模块本身（01A 以同一个名字读取它们）
  - sources                      # 行业研究报告与公开的行业数据
cannot_see:                      # 行业模块不谈持仓：看不到持仓名单、公司档案和私有估值，也就写不进去（C-DEPENDS）
  - holdings
  - dossier
  - thesis
  - valuation
  - series_roster
  - ranking
outputs:
  - industries                   # industry.yml 与 README.md 的修订，事实带来源标签
  - signpost_readings            # 路标读数，以及是否越过事先写好的门槛
decision_rights:
  - draft                        # L1
  - fact_revision                # L1
  - signpost_check               # L1
  - routine_merge                # L1；合并与公开按 trust.routing 分流
  - publish                      # L2，须审计无误
prompts: []                      # 尚无编号提示词，见 README.md
trust_managed: true
