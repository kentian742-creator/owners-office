# Industry researcher: one per industry; maintains the industry module and signposts in industries/<id>/.
# schema: thesis-ci/spec/schemas/agent.schema.json (spec 0.2); charter in industry_researcher.md.
# No numbered prompt yet (phase 4). For now can_see / cannot_see use the closest prompt input names; they will be
# corrected from the prompt's front matter once it is written.
role: industry_researcher
name: Industry researcher
model:
  id: claude-opus-5-5
  effort: high
  fallbacks: default
  why: "Every role runs on Claude Opus 5.5, the owner's choice (decisions/0025). Industry modules also go through the fact audit before they are published. fallbacks is default: on a refusal (API backend only) the server's default fallback rules apply, and pipeline/llm.py records the model that actually answered."
reports_to: hq_capital_allocator
can_see:
  - run_date
  - constitution
  - industries                   # the industry modules themselves (01A reads them under the same name)
  - sources                      # industry research reports and public industry data
cannot_see:                      # industry modules do not discuss holdings: the role cannot see the holdings list, company archives or private valuations, so it cannot write them in (C-DEPENDS)
  - holdings
  - dossier
  - thesis
  - valuation
  - series_roster
  - ranking
outputs:
  - industries                   # revisions of industry.yml and README.md, with facts carrying source tags
  - signpost_readings            # signpost readings, and whether a threshold written in advance was crossed
decision_rights:
  - draft                        # L1
  - fact_revision                # L1
  - signpost_check               # L1
  - routine_merge                # L1; merging and publishing are routed by trust.routing
  - publish                      # L2, only with a clean audit
prompts: []                      # no numbered prompt yet; see README.md
trust_managed: true
