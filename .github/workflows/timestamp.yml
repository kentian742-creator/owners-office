# Timestamps for pre-registrations (docs/decisions/0018; thesis-ci SPEC §2.1, C-PREREG-IMMUTABLE).
#
# - Once pre-registration items files (companies/*/prereg/<period>.yml and <period>-owner.yml) are merged into main,
#   stamp them with OpenTimestamps right away and commit <file>.ots back to main. Files whose deadline has passed are
#   not stamped; a file that already has a proof but whose content has changed is refused (pipeline/timestamp.py),
#   and the run ends in failure for a person to handle.
# - Every 6 hours: upgrade pending proofs to Bitcoin-confirmed proofs and commit them; files that could not be stamped
#   in the previous run because the calendars were unreachable are stamped now.
#
# Permissions: read-only by default; only the one job below has contents: write (to push proofs), and it runs only
# on main.
# No secrets needed: the push uses the GITHUB_TOKEN that GitHub issues for this run.
# No loops: (1) commits pushed with GITHUB_TOKEN trigger no workflow (GitHub's rule); (2) only *.ots files are
# committed here, and they don't match the paths below; (3) nothing is committed when no proof was newly stamped or
# upgraded.
name: timestamp

"on":
  push:
    branches: [main]
    paths:
      - "companies/*/prereg/*.yml"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timestamp
  cancel-in-progress: false

jobs:
  proofs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the OpenTimestamps client (version from requirements.txt)
        run: pip install -c requirements.txt opentimestamps-client pyyaml
      - name: Stamp, upgrade proofs, commit back to main
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            rc=0
            python -m pipeline.timestamp stamp --prereg || rc=1
            python -m pipeline.timestamp upgrade --prereg || rc=1
            git ls-files -z --others --modified --exclude-standard -- 'companies/*/prereg/*.ots' \
              | xargs -0 -r git add --
            if git diff --cached --quiet; then
              echo "No proof newly stamped or upgraded."
              exit "$rc"
            fi
            proofs=$(git diff --cached --name-only)
            base=$(git rev-parse HEAD)
            git commit -q -m "prereg: timestamp proofs (stamped or upgraded)" -m "$proofs" \
              -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
            if git push -q origin HEAD:main; then
              exit "$rc"
            fi
            git fetch -q origin main
            if [ "$(git rev-parse origin/main)" = "$base" ]; then
              echo "Push rejected although main has not moved: not a concurrent run; stopping." >&2
              exit 1
            fi
            echo "main has moved on: dropping this commit and redoing it from the new main (attempt $attempt)."
            git reset -q --hard origin/main
          done
          echo "Three pushes in a row failed." >&2
          exit 1
