# CI for the public repository: thesis-ci lint + pipeline unit tests.
#
# Note: this CI cannot check the private repository owners-office-private. The public repository's CI has no
# permission to read the private repository, and it should not have one. Cross-repository checks (the private
# repository's lint with --counterpart, the acceptance script scripts/accept.py) run in the private repository's
# own CI and locally.
#
# This workflow needs no secrets: neither lint nor the tests call a model (the tests use a fake client).
name: lint

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  thesis-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install thesis-ci (see docs/decisions/0007)
        run: pip install -r requirements-lint.txt
      # With ots on the PATH, C-PREREG-IMMUTABLE verifies pre-registration proofs with ots verify; without it, the
      # check only warns (docs/decisions/0018).
      # The version comes from requirements.txt (-c only borrows its version constraints; nothing else is installed).
      - name: Install the OpenTimestamps client
        run: pip install -c requirements.txt opentimestamps-client
      - name: thesis-ci lint
        run: thesis-ci lint .

  pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: pytest
        run: python -m pytest -q tests
