    statement: "只要每一美元留存收益大概率为股东创造一美元以上的市值，伯克希尔就不派现金股息；董事会每年复核这一政策（2025 年致股东信）[src:BRK-LTR-2025#p7]。"
    made_at: 2026-02-28
    due: "2026"
    source: BRK-LTR-2025#p7
