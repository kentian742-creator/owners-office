    statement: "BNSF 与业内最优者的营业利润率差距仍然过大；若未来几年没有大幅改善，管理层会感到失望（2025 年致股东信）。2025 年 BNSF 营业利润率 34.5%，2024 年为 32.0% [src:BRK-LTR-2025#p12]。"
