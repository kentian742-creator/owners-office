    note: "“未来几年”没有给年限；本档案按三年、以 FY2028 年报中 BNSF 的营业利润率及其与最优同业的差距结算，是事先写下的操作化。报告估计这一差距约为营运比率的 5.5 个百分点 [src:BRK-RPT1-2026-09-18#p7]。对照题见 thesis.yml 的 BRK-L1。"

  - id: BRK-M2
    side: management
