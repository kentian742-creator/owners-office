# BRK two-way say-do ledger (thesis-ci spec §2; schema: spec/schemas/ledger.schema.json)
# When the archive was set up, the management side first recorded the two operating commitments that BRK-L1 checks against
# (BRK-M1, BRK-M2), and two statements of shareholder constraints by the current CEO and the board (BRK-M3, BRK-M4);
# wherever the original words give no time frame, the year in `due` is a settlement point this archive wrote down in
# advance, explained in each entry's note.
# Other commitments, and the system's and the owner's expectations, are recorded one by one from phase 1 on, as financial reports come out.
company: BRK
entries:
  - id: BRK-M1
    side: management
    kind: other
    statement: "The gap between BNSF's operating margin and that of the best in the industry is still too wide; management will be disappointed if it does not improve substantially over the next few years (2025 letter to shareholders). BNSF's operating margin was 34.5% in 2025 and 32.0% in 2024 [src:BRK-LTR-2025#p12]."
    made_at: 2026-02-28
    due: "2028"
    source: BRK-LTR-2025#p12
    status: pending
    note: "“The next few years” gives no number of years; this archive settles the commitment over three years, on BNSF's operating margin and its gap to the best peer in the FY2028 annual report, an operationalisation written down in advance. The report estimates the gap at about 5.5 percentage points of operating ratio [src:BRK-RPT1-2026-09-18#p7]. The matching question is BRK-L1 in thesis.yml."

  - id: BRK-M2
    side: management
    kind: other
    statement: "GEICO's broad price increases of recent years restored its margins, at the cost of lower customer retention; restoring retention while keeping underwriting discipline will take time (2025 letter to shareholders) [src:BRK-LTR-2025#p10]."
    made_at: 2026-02-28
    due: "2027"
    source: BRK-LTR-2025#p10
    status: pending
    note: "The letter gives no deadline; this archive settles the commitment over two years, on GEICO's year-on-year change in policies in force and its combined ratio in the FY2027 annual report, an operationalisation written down in advance; in between, BRK-Q10 tracks it every quarter. In Q1 2026 policies in force were +2% year on year, against +11% at Progressive over the same period [src:BRK-RPT1-2026-09-18#p6]. The matching question is BRK-L1 in thesis.yml."

  - id: BRK-M3
    side: management
    kind: other
    statement: "The current CEO has committed to put his entire after-tax salary into Berkshire Class A shares every year while in office [src:BRK-RPT1-2026-09-18#p8]; on 4 March 2026 he bought 21 Class A shares, at the prices shown in the Form 4 [src:BRK-4-2026-03-05#TableII]."
    made_at: 2026-03-13
    due: "2027"
    source: BRK-RPT1-2026-09-18#p8
    status: pending
    note: "The report gives the 2026 proxy statement and the Form 4 as its sources [src:BRK-RPT1-2026-09-18#p8]; made_at takes the date of the proxy statement [src:BRK-RPT1-2026-09-18#p17], an inference by this archive, to be checked once EDGAR is reachable. The purchase for 2026 has been made; this entry settles on the 2027 Form 4, and one entry will be recorded for each year after that."

  - id: BRK-M4
    side: management
    kind: other
    statement: "As long as each dollar of retained earnings is likely to create more than a dollar of market value for shareholders, Berkshire will not pay a cash dividend; the board reviews this policy every year (2025 letter to shareholders) [src:BRK-LTR-2025#p7]."
    made_at: 2026-02-28
    due: "2026"
    source: BRK-LTR-2025#p7
    status: pending
    note: "A standing policy, settled yearly: the FY2026 annual report confirms that no cash dividend was declared or paid that year, and one entry will be recorded for each year after that; every quarter, breaker BRK-Q15 judges it. In 1965–2024 shareholders received a cash dividend only once, on 1967-01-03 [src:BRK-LTR-2024#p6]."
