    made_at: 2026-02-28
    due: "2027"
    source: BRK-LTR-2025#p10
    status: pending
    note: "信里没有给期限；本档案按两年、以 FY2027 年报中 GEICO 的有效保单数同比与综合成本率结算，是事先写下的操作化，期间由 BRK-Q10 逐季跟踪。2026 年一季度保单数同比 +2%，同期 Progressive +11% [src:BRK-RPT1-2026-09-18#p6]。对照题见 thesis.yml 的 BRK-L1。"

  - id: BRK-M3
    side: management
    kind: other
    statement: "现任 CEO 承诺任职期间每年把全部税后薪水买成伯克希尔 A 股 [src:BRK-RPT1-2026-09-18#p8]；2026 年 3 月 4 日买入 21 股 A 类股，价格见 Form 4 [src:BRK-4-2026-03-05#TableII]。"
    made_at: 2026-03-13
    due: "2027"
    source: BRK-RPT1-2026-09-18#p8
    status: pending
    note: "报告注明出处为 2026 年委托书与 Form 4 [src:BRK-RPT1-2026-09-18#p8]；made_at 取委托书日期 [src:BRK-RPT1-2026-09-18#p17]，是本档案的推断，EDGAR 可达后核对。2026 年这一次已经做到；本条以 2027 年的 Form 4 结算，此后每年登记一条。"

  - id: BRK-M4
