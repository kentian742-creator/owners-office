# BRK two-way say-do ledger (thesis-ci spec §2; schema: spec/schemas/ledger.schema.json)
# When the archive was set up, the management side first recorded the two operating commitments that BRK-L1 checks against
# (BRK-M1, BRK-M2), and two statements of shareholder constraints by the current CEO and the board (BRK-M3, BRK-M4);
# wherever the original words give no time frame, the year in `due` is a settlement point this archive wrote down in
# advance, explained in each entry's note.
# Other commitments, and the system's and the owner's expectations, are recorded one by one from phase 1 on, as financial reports come out.
company: BRK
entries:
  - id: BRK-M1
    side: management
    kind: other
    statement: "The gap between BNSF's operating margin and that of the best in the industry is still too wide; management will be disappointed if it does not improve substantially over the next few years (2025 letter to shareholders). BNSF's operating margin was 34.5% in 2025 and 32.0% in 2024 [src:BRK-LTR-2025#p12]."
    made_at: 2026-02-28
    due: "2028"
    source: BRK-LTR-2025#p12
    status: pending
    note: "“The next few years” gives no number of years; this archive settles the commitment over three years, on BNSF's operating margin and its gap to the best peer in the FY2028 annual report, an operationalisation written down in advance. In 2025 the gap to the best peer was about 5.7 percentage points of operating ratio: BNSF 65.5% on Berkshire's segment basis [src:BRK-10K-FY2025#pK-42] against 59.8% at Union Pacific [src:UNP-10K-FY2025#Item7], the lowest reported ratio among the six Class I railroads (this archive's computation, see the note of BRK-L1 in thesis.yml); the report put the gap at about 5.5 points [src:BRK-RPT1-2026-09-18#p7]. At the letter's $230 million of operating cash flow for each percentage point of margin, the gap is worth about $1.3 billion a year (this archive's computation) [src:BRK-LTR-2025#p12]. The matching question is BRK-L1 in thesis.yml."

  - id: BRK-M2
    side: management
    kind: other
    statement: "GEICO's broad price increases of recent years restored its margins, at the cost of lower customer retention; restoring retention while keeping underwriting discipline will take time (2025 letter to shareholders) [src:BRK-LTR-2025#p10]."
    made_at: 2026-02-28
    due: "2027"
    source: BRK-LTR-2025#p10
    status: pending
    note: "The letter gives no deadline; this archive settles the commitment over two years, on GEICO's year-on-year change in policies in force and its combined ratio in the FY2027 annual report, an operationalisation written down in advance (since FY2025 the 10-K has given only the direction of the change in policies in force) [src:BRK-10K-FY2025#pK-36]; in between, BRK-Q10 tracks it every quarter. GEICO's policies in force at 2026-03-31 were about 2% above a year earlier, as the CEO said at the annual meeting of 2026-05-02 (evidence level L2: third-party accounts of the meeting, not in any filing) [src:BRK-NEWS-2026-05-04-CARRIERMANAGEMENT] [src:BRK-RPT1-2026-09-18#p6], against 10.9% for Progressive's personal auto policies in force (9% for all its personal lines policies) [src:PGR-10Q-FY2026Q1#p23] [src:PGR-10Q-FY2026Q1#p33]. The matching question is BRK-L1 in thesis.yml."

  - id: BRK-M3
    side: management
    kind: other
    statement: "On 2026-03-05, in an interview on CNBC's “Squawk Box”, the CEO committed to put his entire after-tax salary into Berkshire shares every year while he is CEO (stated in the interview, not in any filing) [src:BRK-NEWS-2026-03-05-CNBC]. His salary is $25 million a year from 2026-01-01 [src:BRK-8KA-2026-01-06#Item5.02]; on 2026-03-04 he bought 21 Class A shares for about $15.3 million, at the prices shown in the Form 4 [src:BRK-4-2026-03-05#TableII]."
    made_at: 2026-03-05
    due: "2027"
    source: BRK-NEWS-2026-03-05-CNBC
    status: pending
    note: "The commitment's only record is the interview, which CNBC published as an unofficial transcript (evidence level L2); the 2026 proxy statement, which the report names as its source [src:BRK-RPT1-2026-09-18#p8], contains neither the commitment nor the 2026 salary [src:BRK-DEF14A-2026-03-13]. The first purchase is on the Form 4, dated 2026-03-04, the day before the interview [src:BRK-4-2026-03-05#TableII]. Abel said each later purchase follows the filing of the 10-K and the letter and a 48-hour cooling-off period [src:BRK-NEWS-2026-03-05-CNBC], so the first check of the promise is a Form 4 in early March 2027; this entry settles on it, and one entry will be recorded for each year after that."

  - id: BRK-M4
    side: management
    kind: other
    statement: "As long as each dollar of retained earnings is likely to create more than a dollar of market value for shareholders, Berkshire will not pay a cash dividend; the board reviews this policy every year (2025 letter to shareholders) [src:BRK-LTR-2025#p7]."
    made_at: 2026-02-28
    due: "2026"
    source: BRK-LTR-2025#p7
    status: pending
    note: "A standing policy, settled yearly: the FY2026 annual report confirms that no cash dividend was declared or paid that year, and one entry will be recorded for each year after that; every quarter, breaker BRK-Q15 judges it. In 1965–2024 shareholders received a cash dividend only once, on 1967-01-03 [src:BRK-LTR-2024#p6]."
