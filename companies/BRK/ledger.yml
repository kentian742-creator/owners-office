    note: "长期政策，按年结算：以 FY2026 年报确认当年没有宣布或派发现金股息，此后每年登记一条；逐季由破坏信号 BRK-Q15 判定。1965–2024 年股东只收到过一次现金股息，在 1967-01-03 [src:BRK-LTR-2024#p6]。"
