  - tag: BRK-4-2026-03-05
    kind: filing
    title: Form 4 of Gregory E. Abel (purchase of Berkshire Class A shares, trade date 2026-03-04)
    issuer_cik: "0001067983"
    form: "4"
    accession: 0001193125-26-092556
    filed: 2026-03-05
    url: https://www.sec.gov/Archives/edgar/data/1067983/000119312526092556/0001193125-26-092556-index.htm
    primary: true
    note: The current CEO bought Class A shares through his revocable trust; Class A shares are convertible into Class B shares, so each purchase is listed in Table II (derivative securities). Ledger entry BRK-M3 cites it.

  - tag: BHE-10Q-FY2026Q2
    kind: filing
    title: Berkshire Hathaway Energy Company quarterly report for Q2 2026 (Form 10-Q)
    issuer_cik: "0001081316"
    form: 10-Q
    period: FY2026Q2
    accession: 0001081316-26-000017
