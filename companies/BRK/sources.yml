    note: The report uses it for the breakdown of operating earnings, the segment tables, the combined ratio, and the statement that the parent company does not guarantee the borrowings of BHE, BNSF and their subsidiaries; the shareholder letter attached to the annual report is registered separately (BRK-LTR-2025).

