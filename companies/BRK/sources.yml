    primary: true
    note: A combined filing by BHE and seven subsidiaries, PacifiCorp among them, under one accession number. The report uses it for PacifiCorp's wildfire loss accruals and the progress of the litigation; judging BRK-L2 and BRK-L4 requires reading it.

