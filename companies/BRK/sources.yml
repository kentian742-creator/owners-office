    note: The shareholder letter attached to the company's 2025 annual report, in the owner's annotated copy; the year in the tag is the fiscal year the letter covers.

  - tag: BRK-LTR-2024
    kind: letter
    title: Letter to Berkshire shareholders (for 2024, signed by Warren Buffett, 2025-02-22)
    date: 2025-02-22
    location: private:reports/2024Warren.pdf
    primary: true
    note: The shareholder letter attached to the company's 2024 annual report; the year in the tag is the fiscal year the letter covers. This archive uses it for 2024 after-tax operating earnings by segment (p5, the baseline of BRK-Q1), the one and only cash dividend, in 1967 (p6; P4, BRK-L3, BRK-Q15 and ledger entry BRK-M4), and to check a statement about a share issue (p4; see the todo in thesis.yml).
