# BRK source tags (public; thesis-ci spec §3; schema: spec/schemas/sources.schema.json)
# Locator convention: N in BRK-RPT1-2026-09-18#pN, BRK-LTR-2025#pN and BRK-LTR-2024#pN is the physical PDF page number,
# matching the ===== [page N] ===== markers of the text extraction (see docs/decisions/0006). For filings, #pN is the
# page number printed in the filing (#pK-34 for page K-34 of a Berkshire 10-K); #ItemN names a part of a filing.
# The entries after BHE-10K-FY2025 were added in the revision after the first fact audit (2026-09-27); every EDGAR entry
# was checked that day against its filing index page on EDGAR (form, filing date, period of report, accession), and
# every web document against the publisher's own page.
sources:
  - tag: BRK-RPT1-2026-09-18
    kind: report
    title: "Berkshire Hathaway: a machine that cannot be run on, and the money it has nowhere to put (company report, September 2026) (in Chinese)"
    date: 2026-09-18
    location: private:reports/BRK.pdf
    primary: false
    note: The owner's 02 research report, twelve sections plus appendices. Balance-sheet data as of 2026-06-30 (the Q2 2026 10-Q), income-statement and segment data for fiscal 2025, front-line readings and legal developments read up to 2026-09-18. The report's footer prints only “September 2026”, with no day; the report date here is the reading cut-off date stated on the cover. The full text is kept only in the private repository; the public archive cites page numbers only.

  - tag: BRK-10Q-FY2026Q2
    kind: filing
    title: Berkshire Hathaway Inc. quarterly report for Q2 2026 (Form 10-Q, period ended 2026-06-30)
    issuer_cik: "0001067983"
    form: 10-Q
    period: FY2026Q2
    accession: 0001193125-26-341032
    filed: 2026-08-10
    url: https://www.sec.gov/Archives/edgar/data/1067983/000119312526341032/0001193125-26-341032-index.htm
    primary: true
    note: The 2026-08-08 (a Saturday) given in the report's appendix is the date of the earnings press release (BRK-8K-2026-08-11, Item 2.02), of the 10-Q's signatures and of its posting on berkshirehathaway.com; EDGAR accepted the 10-Q on Monday 2026-08-10 at 06:01:51 ET, which is its filing date. The report uses it for the balance sheet, segment earnings, float, buybacks, share count and the Taylor Morrison timeline; the cover gives the shares outstanding at 2026-07-29 (#cover).

