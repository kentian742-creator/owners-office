    pillar: P2
    metric_def:
      id: geico_policies_in_force_yoy
      description: GEICO 自愿车险有效保单数（voluntary auto policies-in-force）同比变化；季度读数取季末对上年同季末，年度读数取年末对上年末
      unit: "%"
      frequency: quarter
      data: filing_text
      where: 10-Q／10-K 的 MD&A 中 GEICO 一节（有效保单数及其同比变化）
      formula: policies_in_force_t / policies_in_force_{t-4q} - 1
    params: {segment: GEICO}
