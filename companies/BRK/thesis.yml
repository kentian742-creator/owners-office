tests:
  # ---------- Lynch stalwart template (three quantitative metrics and L-guidance replaced by this archive; reasons in each note) + book value per share and idle cash from the secondary category asset_play ----------
  - id: BRK-Q1
    type: quantitative
    claim: Non-insurance earnings that depend on operating skill are still growing, and growth has not slipped out of the stalwart range
    origin: manual
    severity: watch
    covers: [growth]
    pillar: P6
    metric_def:
      id: non_insurance_operating_earnings_yoy
      description: Year-on-year growth of the trailing-four-quarter sum of after-tax operating earnings of the non-insurance operating businesses (the three blocks BNSF, BHE and manufacturing/service/retailing); company segment basis, excluding investment gains and losses and impairments
      unit: "%"
      frequency: quarter
      data: filing_text
      where: The table of after-tax earnings by segment in the MD&A of the 10-Q or 10-K (the BNSF, Berkshire Hathaway Energy (“BHE”) and Manufacturing, service and retailing lines; the last is one after-tax line, which the filings split into manufacturing and service and retailing only before tax)
      formula: sum_4q(bnsf + bhe + msr)_t / sum_4q(bnsf + bhe + msr)_{t-4q} - 1
    fail_if: Below 5% for 4 consecutive quarters
    rule: {op: "<", threshold: 5, unit: "%", consecutive: 4, period: quarter}
    warn_if: Below 8% for 2 consecutive quarters
    warn_rule: {op: "<", threshold: 8, unit: "%", consecutive: 2, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline:
      value: 5.8
      unit: "%"
      period: FY2025
      as_of: 2025-12-31
      source: BRK-10K-FY2025#pK-34
      note: "This archive's computation from one table, the after-tax earnings by segment in the FY2025 10-K: BNSF $5,476 million, BHE $3,979 million and manufacturing, service and retailing $13,647 million in 2025, $23,102 million in total, against $5,031 million, $3,730 million and $13,072 million in 2024, $21,833 million in total: +5.8% (5.81%) [src:BRK-10K-FY2025#pK-34]. The 2024 figures match the 2024 letter, where manufacturing, service and retailing appears as Other controlled businesses [src:BRK-LTR-2024#p5]."
    note: "Replaces Q-growth (revenue_yoy) of the stalwart template: the $214.3 billion of 2025 revenue of manufacturing, service and retailing [src:BRK-10K-FY2025#pK-46] includes truck stops, food distribution and car dealerships (McLane, Berkshire Hathaway Automotive, Pilot) [src:BRK-10K-FY2025#pK-21] [src:BRK-10K-FY2025#pK-22] [src:BRK-10K-FY2025#pK-23], so the size of revenue says nothing about profit; and insurance premiums are deliberately cut back when prices are inadequate [src:BRK-LTR-2025#p9], which the report regards as discipline rather than lost customers [src:BRK-RPT1-2026-09-18#p6]. Revenue growth therefore cannot show whether the business is getting better or worse. The test looks instead at the earnings of the three non-insurance blocks that depend on operating skill, with the template's default thresholds. Underwriting and insurance investment income each have their own tests: BRK-Q6 and BRK-Q10 track underwriting, and BRK-Q12 tracks insurance investment income."

  - id: BRK-Q2
    type: quantitative
    claim: Book value per share is growing
    origin: template:asset_play
    severity: watch
    covers: [returns_on_capital]
    pillar: P3
    metric: book_value_per_share_yoy
    fail_if: Declines for 2 consecutive years
    rule: {op: "<", threshold: 0, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: 2027-02
    baseline:
      value: 10.5
      unit: "%"
      period: FY2025
      as_of: 2025-12-31
      source: BRK-10K-FY2025#pK-67
      note: "This archive's computation: book value per Class A share rose from $451,507 at 2024-12-31 to $498,823 at 2025-12-31, +10.5% (10.48%), from Berkshire shareholders' equity of $649,368 million and $717,419 million over 1,438,223 Class A equivalent shares at both dates [src:BRK-10K-FY2025#pK-67] [src:BRK-10K-FY2025#pK-102]; it was $522,396 at 2026-06-30 [src:BRK-10Q-FY2026Q2#p3] [src:BRK-10Q-FY2026Q2#p22]. The calculation is written out in baseline_facts F7; the company no longer publishes book value per share."
    note: "Replaces Q-returns (roic) of the stalwart template: about two-thirds of Berkshire's value is measured at market prices [src:BRK-RPT1-2026-09-18#p2], so a return on invested capital with “equity plus interest-bearing debt minus cash” as its denominator would mix the yields of Treasury bills and the equity portfolio into the return of the operating businesses and could not measure the return on capital. The book-value-per-share test of the secondary category's template (asset play) is used instead, with the template's default threshold. Book value per share includes swings in the market value of the stocks [src:BRK-RPT1-2026-09-18#p11], so only the direction over two consecutive years counts. The calculation uses Class A equivalent shares (the report's basis) [src:BRK-RPT1-2026-09-18#p4]; the XBRL concept is still to be verified (see todo)."

  - id: BRK-Q14
    type: quantitative
    claim: "Idle cash has not become a drag: cash and Treasury bills as a share of total assets have not stayed high year after year"
    origin: template:asset_play
    severity: watch
    covers: [capital_allocation]
    pillar: P3
    metric: cash_and_tbills_to_total_assets
    fail_if: Above 30% for 2 consecutive years
    rule: {op: ">", threshold: 30, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: 2027-02
    baseline:
      value: 30.5
      unit: "%"
      period: FY2025
      as_of: 2025-12-31
      source: BRK-10K-FY2025#pK-66
      note: "This archive's computation on the registered metric (cash and cash equivalents plus short-term Treasury bills, over total assets): $47,719 million of insurance and other cash, $4,158 million of railroad, utilities and energy cash and $321,434 million of Treasury bills, $373,311 million, were 30.5% of total assets of $1,222,176 million at 2025-12-31 [src:BRK-10K-FY2025#pK-66]; net of $167 million of unsettled Treasury bill purchases the sum is $373,144 million, also 30.5% [src:BRK-10K-FY2025#pK-67]. At 2026-06-30 the same readings were $365,514 million gross and $364,743 million net, both 28.9% of total assets of $1,263,071 million [src:BRK-10Q-FY2026Q2#p2] [src:BRK-10Q-FY2026Q2#p3]. The company's own figures cover only the insurance and other businesses, net of unsettled purchases: $369.0 billion and $359.2 billion [src:BRK-10K-FY2025#pK-55] [src:BRK-10Q-FY2026Q2#p48]. The FY2025 reading is already above the fail_if line; the threshold is unchanged, and any change after the review provided for in the note below would apply only to later periods (§G7)."
    note: "Q-cash-drag of the secondary category's template (asset play), taken over as it is, with the template's default threshold. It is the price-free counterpart of breaker BRK-Q7: BRK-Q7's denominator is market value, and the public pipeline cannot read prices; this test's denominator is total assets, which can be read directly from the 10-K, so while BRK-Q7 cannot be judged, this test and BRK-Q13 give the readings on whether cash is piling up. An insurance group's total assets include a large amount of invested assets that correspond to float, so whether the template threshold suits Berkshire is to be reviewed once, after the total-assets readings have been backfilled; the conclusion and date of that review go into this note, so that the test stays written down in advance. Berkshire shows US Treasury bills as a separate line on its balance sheet, and in XBRL they may not fall under the ShortTermInvestments concept; if they cannot be retrieved, change data to filing_text (see todo)."

  - id: BRK-Q3
    type: quantitative
    claim: Buybacks are genuinely shrinking the share count, and the share count has not grown through acquisitions paid in stock
    origin: template:stalwart
    severity: watch
    covers: [capital_allocation]
    pillar: P4
    metric: diluted_shares_yoy
    fail_if: Above 0 for 2 consecutive years
    rule: {op: ">", threshold: 0, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: 2027-02
    baseline:
      value: null
      unit: "%"
      period: FY2025
      source: BRK-10K-FY2025#pK-70
      note: "Buybacks cost $47.0 billion in cash in 2021–2025: $27,061 million in 2021, $7,854 million in 2022 [src:BRK-10K-FY2022#Item8], $9,171 million in 2023, $2,918 million in 2024 and nothing in 2025 [src:BRK-10K-FY2025#pK-70] [src:BRK-10K-FY2025#pK-55]; treasury stock bought in the first half of 2026 cost $4.76 billion ($4,762 million) [src:BRK-10Q-FY2026Q2#p3] [src:BRK-10Q-FY2026Q2#p48]. In 2021–2025 Berkshire sold no shares for cash; its only share issue was 2,291,631 Class B shares from treasury in 2024, as part of the price of the last 2.12% of BHE (see BRK-L3) [src:BRK-10K-FY2025#pK-115]. The year-on-year change in the average share count is to be backfilled from the annual reports."
    note: "The template's default threshold is used. Berkshire has no stock-based compensation: the proxy statement says Berkshire never intends to use its stock to pay employees [src:BRK-DEF14A-2026-03-13#p7], so the share count only falls through buybacks and only rises through acquisitions paid in stock; of three large stock-paid deals in its history (Dexter Shoe in 1993, General Re in 1998, BNSF in 2010), management itself has called two big mistakes [src:BRK-RPT1-2026-09-18#p9] [src:BRK-LTR-2014#p26] [src:BRK-LTR-2016#p3]; for General Re the mistake was paying in shares, since the letters praise the business itself [src:BRK-LTR-2013#p8] [src:BRK-LTR-2015#p11]. Whether a share-for-share deal “gives away more intrinsic value than it receives” is judged by breaker BRK-L3."

  - id: BRK-Q4
    type: quantitative
    claim: Free cash flow is growing rather than being steadily eaten up by capital expenditure
    origin: manual
    severity: watch
    covers: [free_cash_flow]
    pillar: P6
    metric: free_cash_flow_yoy
    fail_if: Declines for 2 consecutive years
    rule: {op: "<", threshold: 0, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: 2027-02
    baseline:
      value: null
      unit: "%"
      period: FY2025
      source: BRK-LTR-2025#p9
      note: "Operating cash flow was $46 billion in 2025 and averaged more than $40 billion over five years, as the company puts it [src:BRK-LTR-2025#p9]: $45,969 million in 2025 and an average of $40.5 billion over 2021–2025 on the cash-flow statements (this archive's computation) [src:BRK-10K-FY2025#pK-70] [src:BRK-10K-FY2023#Item8]. The report estimates full-year 2026 capital expenditure at about $21 billion and depreciation and amortisation at about $13.7 billion [src:BRK-RPT1-2026-09-18#p5]. Capital expenditure for FY2024 and FY2025 is to be backfilled from the annual reports."
    note: "Replaces Q-fcf (fcf_conversion, free cash flow divided by GAAP net income) of the stalwart template: since 2018 accounting rules have required unrealised investment gains and losses to be included in net income, and from that year the company has used operating earnings as its main basis [src:BRK-RPT1-2026-09-18#p4] [src:BRK-LTR-2017#p2] [src:BRK-LTR-2018#p2], so this ratio means nothing for Berkshire. The touchstone of rule 2 of the constitution is growing free cash flow, so the test looks instead at whether it declines two years in a row; the template has no default threshold for this metric, and “declines two years in a row” follows the template's usual two-year window, a standard this archive wrote down in advance. BNSF and BHE accounted for 62.9% of segment capital expenditure in the first half of 2026 ($6,689 million of $10,631 million, this archive's computation) [src:BRK-10Q-FY2026Q2#p32], and BHE's growth spending on data centres will depress free cash flow first, which is exactly what this test should prompt a review of. The test is computed mechanically from XBRL, without adjustments: operating cash flow swings with the taxes paid on large stock sales and with changes in float; this archive accepts that noise, and when the test fails, the review states in its conclusion whether the failure comes from these two items."

  - id: BRK-L1
    type: qualitative
    claim: Management is candid and does what it says; it has not quietly abandoned operating commitments it made in public
    origin: manual
    severity: watch
    covers: [management]
    pillar: P4
    question: "Does this period's annual report or letter to shareholders withdraw, water down or stop mentioning either of the two operating commitments recorded in ledger.yml (BRK-M1: BNSF substantially improving its operating margin over the next few years; BRK-M2: GEICO restoring customer retention while keeping underwriting discipline) without giving a reason? “Watering down” means no longer giving an equally checkable statement, for example dropping wording that can be pinned to numbers, such as “improve substantially” or “restore retention”, in favour of vaguer language."
    fail_if: "Yes"
    judge: independent_model
    evidence: required
    where: The annual letter to shareholders (it opens Berkshire's annual report to shareholders, filed on EDGAR as form ARS and posted on berkshirehathaway.com; it is not part of the Form 10-K) and the MD&A of the 10-K
    lookback: 2
    judge_notes:
      - Judge only the two commitments listed in the question; the list is closed, and other commitments or statements in this period's filings are outside this question.
      - The annual meeting Q&A is not a filing and is no basis for the judgement.
    effective_from: FY2026Q3
    first_readable: 2027-02
    baseline:
      value: The 2025 letter to shareholders says the gap between BNSF's operating margin and the best in the industry is still too wide and that management will be disappointed if it does not improve substantially over the next few years; the same letter acknowledges that GEICO's price increases restored its margins at the cost of lower retention, and that restoring retention will take time
      source: BRK-LTR-2025#p10-p12
      note: "The BNSF statements are on p12 of the letter and the GEICO statements on p10 [src:BRK-LTR-2025#p12] [src:BRK-LTR-2025#p10]; BNSF's operating margin was 34.5% in 2025 and 32.0% in 2024 [src:BRK-LTR-2025#p12]. Both commitments are recorded in ledger.yml (BRK-M1, BRK-M2), and the ledger settles them when they fall due."
    note: "Replaces L-guidance of the stalwart template: Berkshire gives no earnings guidance [src:BRK-WEB-2026-09-27-1#p4] and, by the report's account, holds no quarterly calls [src:BRK-RPT1-2026-09-18#p3] (the Owner's Manual names the annual report, quarterly reports and the annual meeting as its channels), so there are no medium-term financial targets to cut; the equivalent test is whether operating commitments made in public have “quietly disappeared” (the fourth grade of the say-do ledger). The question lists only the two commitments recorded in the ledger; a new commitment is first recorded in ledger.yml, and then this question is changed. The report reads the current CEO's volunteering at the 2026-05-02 annual meeting as the costliest and hardest-to-fake signal of candour [src:BRK-RPT1-2026-09-18#p8]: he set GEICO's policies in force, up about 2% in the year to 2026-03-31, next to Progressive's personal auto policies, up 11% [src:BRK-NEWS-2026-05-04-CARRIERMANAGEMENT] [src:PGR-10Q-FY2026Q1#p23], and ranked BNSF's operating margin fifth of the six Class I railroads, which fits their FY2025 reported margins: Union Pacific 40.2%, CN 38.1%, CPKC 37.2%, Norfolk Southern 35.8%, BNSF 34.5% and CSX 32.1% (this archive's computation from each railroad's annual filing) [src:UNP-10K-FY2025#Item7] [src:CNI-6K-2026-02-04] [src:CP-10K-FY2025] [src:NSC-10K-FY2025] [src:BRK-LTR-2025#p12] [src:CSX-10K-FY2025]. The annual meeting Q&A is not a filing: its remarks reach this archive through third-party accounts and serve only as background."

  # ---------- Report section 10: thesis breakers (if any one of them holds, the report's thesis is void) ----------
  - id: BRK-Q5
    type: quantitative
    claim: "GEICO's low-cost direct-selling moat is intact: policies in force are not shrinking persistently, and underwriting is not losing money"
    origin: report:breaker
    severity: breaker
    covers: [moat, pricing_power, competition]
    pillar: P2
    metric_def:
      id: geico_policies_in_force_yoy
      description: Year-on-year change in GEICO's voluntary auto policies-in-force; the quarterly reading compares the quarter-end with the same quarter-end a year earlier, the annual reading the year-end with the previous year-end
      unit: "%"
      frequency: quarter
      data: filing_text
      where: "GEICO's policies in force are not a number the current filings give: since FY2025 the 10-K and 10-Q MD&A state only the direction of the change (the FY2025 10-K and the Q3 2025 10-Q: premiums rose because policies in force increased; the 2026 10-Qs: nothing), and the last number in a filing is 2024's -0.5%. A number may appear in the annual letter to shareholders or in the company's releases on berkshirehathaway.com, which are read each period; until FY2024 the GEICO section of the MD&A of the 10-Q or 10-K gave the year-on-year change in policies in force"
      formula: policies_in_force_t / policies_in_force_{t-4q} - 1
    params: {segment: GEICO}
    fail_if: GEICO's policies in force decline for two consecutive years, and its combined ratio is above 100%
    rule:
      all_of:
        - {metric: geico_policies_in_force_yoy, op: "<", threshold: 0, unit: "%", consecutive: 2, period: year}
        - {metric: combined_ratio, op: ">", threshold: 100, unit: "%", consecutive: 1, period: year}
      note: Both items are judged for the same year; policies in force use the year-end year-on-year change for two consecutive years, and the combined ratio uses GEICO's full-year reading for the second year (params.segment).
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2027-02
    baseline:
      value: null
      unit: "%"
      period: FY2025
      as_of: 2025-12-31
      source: BRK-10K-FY2025#pK-36
      note: "No primary reading: the FY2025 10-K says only that GEICO's policies in force increased in 2025 and gives no number; the last number in a filing is 2024's 0.5% decrease [src:BRK-10K-FY2025#pK-36]; the Q3 2025 10-Q likewise gives only the direction [src:BRK-10Q-FY2025Q3]. GEICO's full-year combined ratio was 84.7% in 2025 ($37,657 million of losses and expenses over $44,481 million of premiums earned) [src:BRK-10K-FY2025#pK-36]. The latest policy figure is not from a filing: the CEO said at the annual meeting of 2026-05-02 that policies in force at 2026-03-31 were about 2% above a year earlier, a Q1 2026 figure that the report's section 10 table prints in the second-quarter cell (evidence level L2: third-party accounts of the meeting) [src:BRK-RPT1-2026-09-18#p15] [src:BRK-NEWS-2026-05-04-CARRIERMANAGEMENT]; Progressive's personal auto policies in force grew 10.9% in the same year and 8.8% in the year to 2026-06-30 [src:PGR-10Q-FY2026Q1#p33] [src:PGR-10Q-FY2026Q2#p37]. GEICO's combined ratio was 91.2% in the second quarter of 2026 and 89.3% in the first half, against 81.7% a year earlier [src:BRK-10Q-FY2026Q2#p34]."
    note: "Report section 10, breaker #1. Once the condition holds, the low-cost moat is lost and normalised underwriting profit has to be cut to below $3 billion, which by the report's formula four means about $3.7 billion less in after-tax earnings a year, 8%–9% of operating earnings [src:BRK-RPT1-2026-09-18#p14]. Policies in force rose in 2025 [src:BRK-10K-FY2025#pK-36], so two consecutive years of decline can be complete at the earliest with the FY2027 annual report. A year for which no primary document gives a policy count is recorded as undetermined for the policy branch; the combined ratio is read from the 10-K each year."

  - id: BRK-Q6
    type: quantitative
    claim: "Float still has a negative cost: the group's property-casualty underwriting as a whole does not lose money"
    origin: report:breaker
    severity: breaker
    covers: [moat, pricing_power, returns_on_capital]
    pillar: P1
    metric: combined_ratio
    params: {segment: all of the group's property and casualty businesses combined (excluding retroactive reinsurance)}
    fail_if: Consolidated combined ratio (excluding retroactive reinsurance) above 100% for two consecutive years
    rule: {op: ">", threshold: 100, unit: "%", consecutive: 2, period: year}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2027-02
    baseline:
      value: 87.1
      unit: "%"
      period: FY2025
      as_of: 2025-12-31
      source: BRK-LTR-2025#p9
      note: "The company's figure, retroactive reinsurance excluded, with a five-year (2021–2025) average of 90.7% and ten-year and twenty-year averages of 93.0% and 92.2% [src:BRK-LTR-2025#p9]; recomputed from the 10-K's underwriting tables, 2025 is also 87.1% (this archive's computation, baseline_facts F6) [src:BRK-10K-FY2025#pK-36]."
    note: "Report section 10, breaker #2. Once the condition holds, float turns from negative to positive cost, and the premise of section 2, “under what conditions this decision holds”, no longer holds [src:BRK-RPT1-2026-09-18#p14]. The reading preferably uses the company's own measure as given in the letter to shareholders; when the letter does not give it, it is computed from the insurance segment tables of the 10-K, weighting each property-casualty business by earned premiums and excluding retroactive reinsurance."

  - id: BRK-Q7
    type: quantitative
    claim: "Cash is an option, not a drag: cash and Treasury bills are not piling up for long without being deployed"
    origin: report:breaker
    severity: breaker
    covers: [capital_allocation, free_cash_flow]
    pillar: P3
    metric_def:
      id: cash_drag
      description: "Whether cash and Treasury bills are piling up at year-end without being deployed, judged by two components at the same year-end: whether the year-end balance is above the breaker line registered in the private valuation file, and capital deployed over two years as a share of operating cash flow over the same period"
      unit: "%"
      frequency: year
      data: mixed
      formula: "above_private_line = (cash_and_equivalents + us_treasury_bills)_year_end > private_line_year_end; capital_deployed_to_operating_cash_flow_2y = sum_2y(acquisitions_net_of_cash_acquired + equity_purchases - equity_sales) / sum_2y(operating_cash_flow)"
      components:
        above_private_line:
          description: The year-end sum of cash, cash equivalents and US Treasury bills is above the breaker line registered in the private valuation file (valuation.yml); the line takes the year-end price as an input, so under §H4 its threshold and readings are recorded only in the private repository, and the public side records only whether the balance is above it
          unit: event
          where: The balance is cash, cash equivalents and US Treasury bills from the 10-K balance sheet and notes; whether it is above the breaker line is judged on the private side. The public pipeline does not fetch share prices, and the private repository holds only one reference price, for value-range alerts, and no year-end price, so this branch currently has no data source. The private side could use a price line computed from filings (cash and Treasury bills ÷ Class A equivalent shares ÷ the ratio threshold registered in the private file) and record only whether the year-end price is below that line; whether to do so, and whether the uses allowed by hard rule 2 need widening, awaits HQ's decision (see todo)
        capital_deployed_to_operating_cash_flow_2y:
          description: Capital deployed over two years ÷ total operating cash flow over the same period; deployed = cash paid for acquisitions of businesses (net of cash acquired) + net purchases of stocks (purchases minus sales), excluding buybacks and capital expenditure
          unit: "%"
          where: The consolidated cash flow statement of the 10-K (acquisitions, purchases and sales of stocks, operating cash flow)
    fail_if: Cash and Treasury bills above the breaker line registered in the private valuation file at two consecutive year-ends, and capital deployed over the two years below half of operating cash flow over the same period
    rule:
      all_of:
        - {metric: cash_drag.above_private_line, op: event, threshold: Year-end cash and Treasury bills above the breaker line registered in the private valuation file, consecutive: 2, period: year}
        - {metric: cash_drag.capital_deployed_to_operating_cash_flow_2y, op: "<", threshold: 50, unit: "%", consecutive: 1, period: year}
      note: Both items are judged at the same year-end; the two-year window of the second item is the same two years as those of the first.
    data: mixed
    effective_from: FY2026Q3
    first_readable: 2027-02
    baseline:
      value: null
      unit: "%"
      as_of: 2026-06-30
      source: BRK-10Q-FY2026Q2#p2
      note: "The reading as a share of market value is derived from price and is recorded only in the private repository (hard rule 4). On the numerator side: cash, cash equivalents and Treasury bills were $364.7 billion at 2026-06-30 (consolidated, net of unsettled purchases, this archive's sum in baseline_facts F2) [src:BRK-10Q-FY2026Q2#p2]; net purchases of equity securities were $19.8 billion in the second quarter of 2026 ($23,467 million bought and $3,693 million sold, this archive's computation from the year-to-date cash-flow statements) [src:BRK-10Q-FY2026Q2#p7] [src:BRK-10Q-FY2026Q1#p6], ending fourteen consecutive quarters of net selling, from the fourth quarter of 2022 to the first quarter of 2026 [src:BRK-RPT1-2026-09-18#p8]."
    note: "Report section 10, breaker #3. Once the condition holds, “cash is an option” becomes “cash is a drag” [src:BRK-RPT1-2026-09-18#p14]. In the report's own wording the first branch uses year-end market value as its denominator, so both the threshold and the current reading take price as an input; under §H4 they are recorded only in the private valuation file, and this file says only “above the breaker line registered in the private valuation file”. The report gives no price-free wording with the same meaning: converting the line into a dollar amount or a share of total assets would first require fixing the market value on some date, after which the line would no longer move with market value and the meaning would change; the price-free reading as a share of total assets is already tracked by BRK-Q14. The report does not define what counts as “deployed”; this archive excludes buybacks, following the distinction in section 10 watch indicator #4 that “buybacks are a return of capital, not an allocation to assets”, and also leaves out capital expenditure, because this test asks how headquarters allocates new cash. The first branch needs a year-end price and is recorded as undeterminable until HQ settles on an approach (see todo); in the meantime the price-free readings come from BRK-Q14 (cash and Treasury bills as a share of total assets) and BRK-Q13 (the change in the balance after taking out buybacks)."

  - id: BRK-Q8
    type: quantitative
    claim: "Buyback discipline is unchanged: buybacks happen only when the price is below a conservative estimate of intrinsic value, and the company does not sit idle for long when the quarter-end price falls below the breaker line registered in the private valuation file [src:BRK-RPT1-2026-09-18#p14]"
    origin: report:breaker
    severity: breaker
    covers: [capital_allocation, management]
    pillar: P4
    metric_def:
      id: buyback_avg_price_to_book
      description: The highest of the monthly average repurchase prices in the quarter ÷ book value per Class A share at the previous quarter-end (Class B shares converted to Class A equivalents); not computed when there are no buybacks in the quarter
      unit: x
      frequency: quarter
      data: mixed
      where: The issuer repurchase table in Part II, Item 2 of each 10-Q and in Part II, Item 5 of the 10-K (shares purchased and average price per share, by month and class; the 10-K table covers the fourth quarter only, so a first-half or annual average needs each quarter's table), and shareholders' equity and Class A equivalent shares from the previous period's balance sheet and common stock note
      formula: max_month(avg_repurchase_price_per_A_equivalent_share) / book_value_per_A_share_prior_quarter_end
      components:
        below_private_line:
          description: The quarter-end price is below the breaker line registered in the private valuation file (valuation.yml); the line comes from comparing the quarter-end price with book value per Class A share, so under §H4 its threshold and readings are recorded only in the private repository, and the public side records only whether the price is below it
          unit: event
          where: Book value per Class A share comes from the shareholders' equity and Class A equivalent shares in the 10-Q; whether the price is below the breaker line is judged on the private side. The quarter-end price has no data source either (for the reasons given under BRK-Q7). The private side could use a price line computed from filings (quarter-end book value per Class A share × the multiple threshold registered in the private file) and record only whether the quarter-end price is below that line; whether to do so awaits HQ's decision (see todo)
    fail_if: Buybacks at more than 1.8 times book value; or zero buybacks for four consecutive quarters while the quarter-end price is below the breaker line registered in the private valuation file
    rule:
      any_of:
        - {metric: buyback_avg_price_to_book, op: ">", threshold: 1.8, unit: x, consecutive: 1, period: quarter}
        - all_of:
            - {metric: buyback_avg_price_to_book.below_private_line, op: event, threshold: Quarter-end price below the breaker line registered in the private valuation file}
            - {metric: buyback_amount, op: "==", threshold: 0, unit: USD}
          consecutive: 4
          period: quarter
          note: Both items must hold in the same quarter, for four consecutive quarters.
    data: mixed
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline:
      value: 1.40
      unit: x
      period: 1H26 (report basis)
      as_of: 2026-06-30
      source: BRK-10Q-FY2026Q2#p51
      note: "This is the report's reading [src:BRK-RPT1-2026-09-18#p14], not a reading on this metric's basis: the first-half average repurchase price of $486.12 per Class B equivalent share ($4,762 million for 511 Class A and 9,029,655 Class B shares, 9,796,155 Class B equivalents) [src:BRK-10Q-FY2026Q1#p46] [src:BRK-10Q-FY2026Q2#p51] over book value per Class B share of $348.26 at 2026-06-30 [src:BRK-10Q-FY2026Q2#p3] [src:BRK-10Q-FY2026Q2#p22] is 1.40 (1.396, this archive's computation), while this metric divides the highest single-month average price in the quarter by book value at the previous quarter-end. This metric's readings for 2026Q1 and 2026Q2 are to be backfilled (see todo). Berkshire bought back no shares from June 2024 through February 2026: the last purchase before the pause was 100 Class A shares in May 2024 [src:BRK-10Q-FY2024Q2#p49], and buying resumed on 2026-03-04 [src:BRK-8K-2026-03-05]. Buybacks then cost $235 million in March and $4,527 million in the second quarter (May and June), $4,762 million in the first half [src:BRK-10Q-FY2026Q2#p6] [src:BRK-10Q-FY2026Q2#p51]."
    note: "Report section 10, breaker #4. Once the condition holds, buyback discipline has changed, and the anchor that “management's buyback price is a floor for intrinsic value” no longer works [src:BRK-RPT1-2026-09-18#p14]. The first branch divides the average repurchase price the company itself discloses by book value; the average repurchase price is a fact about the company (§H2 item 3), so it stays public as usual and can be read directly from the repurchase table of the 10-Q. In the report's own wording the second branch is conditioned on the quarter-end price as a multiple of book value, so both its threshold and its current reading take price as an input; under §H4 they are recorded only in the private valuation file, and this file says only “below the breaker line registered in the private valuation file”; the threshold itself is unchanged. The second branch needs a quarter-end price: the public pipeline does not fetch share prices (hard rule 2), and the private repository has no quarter-end price either, so it is recorded as undeterminable until HQ settles on an approach (see todo)."

  - id: BRK-L2
    type: qualitative
    claim: "The regulated subsidiaries are insulated from the rest of the group: neither Berkshire's parent company nor its subsidiaries outside the BHE group guarantee or put money into PacifiCorp"
    origin: report:breaker
    severity: breaker
    covers: [balance_sheet, regulation, capital_allocation]
    pillar: P5
    question: Do this period's filings disclose that the Berkshire Hathaway parent company (Berkshire Hathaway Inc.), or any of its subsidiaries outside the BHE group (including the insurance subsidiaries and the finance subsidiary BHFC), has guaranteed PacifiCorp's borrowings or wildfire damages, or has put money into PacifiCorp through capital injections, loans, or subscriptions to its newly issued debt or equity (including funds injected into BHE first and then passed on by BHE to PacifiCorp)?
    fail_if: "Yes"
    judge: independent_model
    evidence: required
    where: The notes on debt, guarantees and commitments and on related parties in Berkshire's 10-Q or 10-K, and its 8-Ks; the 10-Q or 10-K of BHE and PacifiCorp
    lookback: 1
    judge_notes:
      - Only new guarantees or funding directed at PacifiCorp count; existing guarantees and loans do not, including the parent's guarantee of the borrowings of the finance subsidiary BHFC, its guarantees of other subsidiaries' debt, and the insurance subsidiaries' loan to Pilot.
      - BHE investing its own retained earnings in PacifiCorp does not count.
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline:
      value: "Has not happened. Berkshire does not guarantee any debt, borrowings or lines of credit of BHE, BNSF or their subsidiaries [src:BRK-10Q-FY2026Q2#p20], and no filing shows a guarantee of, or funding for, PacifiCorp by the parent or its other subsidiaries. The existing arrangements are the parent's full and unconditional guarantee of the borrowings of its wholly owned finance subsidiary BHFC, plus guarantees of about $1.7 billion of other subsidiaries' debt at 2026-06-30 [src:BRK-10Q-FY2026Q2#p19]; in March 2024 insurance subsidiaries lent Pilot $5.7 billion to repay its third-party borrowings [src:BRK-10K-FY2025#pK-53]. Berkshire has put money into its energy group before, as equity rather than a guarantee: in October 2020 Berkshire subsidiaries bought $3.75 billion of BHE's 4.00% perpetual preferred stock to fund the GT&S and Q-Pipe acquisitions, and the last $481 million was redeemed in February 2025 [src:BHE-10K-FY2020#p190] [src:BHE-10K-FY2025#p194]; it has not funded PacifiCorp directly."
      source: BRK-10Q-FY2026Q2#p20
    note: "Report section 10, breaker #5. Once the condition holds, the practice of “not guaranteeing the borrowings of regulated subsidiaries” is broken, and the financing costs of every regulated subsidiary and headquarters' negotiating position all have to be repriced [src:BRK-RPT1-2026-09-18#p14]. Section 10 itself says only “the parent provides a guarantee or capital injection for PacifiCorp” [src:BRK-RPT1-2026-09-18#p14]; loans, subscriptions to debt or equity, funding passed through BHE, and funding by non-BHE subsidiaries other than the parent are this archive's extension. On page 8 the report lists the insurance subsidiaries' $5.7 billion loan to Pilot as something Berkshire has done, so the entity putting up the money should be understood as the group, not only the parent as a legal entity [src:BRK-RPT1-2026-09-18#p8]. The same page says Berkshire has never put money into a regulated subsidiary, which the filings contradict: the 2020 purchase of BHE preferred stock by Berkshire subsidiaries, redeemed by February 2025, funded a BHE acquisition, not PacifiCorp [src:BHE-10K-FY2020#p112] [src:BHE-10K-FY2025#p194]. The test therefore reads only new guarantees of, or new funding for, PacifiCorp as the event, as its question and judge notes already say."

  - id: BRK-L3
    type: qualitative
    claim: "Berkshire's shareholder constraints still hold: in share-for-share deals it gives away no more intrinsic value than it receives, and headquarters sets no performance targets for subsidiaries"
    origin: report:breaker
    severity: breaker
    covers: [capital_allocation, governance, culture, management]
    pillar: P4
    question: "Do this period's filings disclose either of the following: (b) Berkshire pays the consideration for an acquisition or investment by issuing its own shares, and either of these conditions is met: the shares issued exceed 1% of the Class A equivalent shares outstanding before the issue, while the issue price per Class A equivalent share is no higher than the average repurchase price of the previous four quarters (when there were no buybacks in the previous four quarters, 1.2 times book value per Class A share at the previous quarter-end is used instead); or the filings or management's explanations acknowledge that the intrinsic value of the shares issued exceeds the value received; (c) Berkshire's headquarters begins setting performance targets (earnings, growth or other financial metrics) for subsidiaries?"
    fail_if: Yes (either item holds)
    judge: independent_model
    evidence: required
    where: 8-Ks; the 10-Q or 10-K (statement of changes in shareholders' equity, business combination notes, the repurchase table in Part II, Item 2); the proxy statement; the annual letter to shareholders
    lookback: 5
    judge_notes:
      - (c) looks only at whether headquarters sets targets for subsidiaries; budgets are not targets, and headquarters creating a new management layer or position does not count either.
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline:
      value: "Has not happened. In 2021–2025 Berkshire sold no shares for cash; its only share issue was 2,291,631 Class B shares reissued from treasury in September and October 2024, valued at $1.045 billion (about 1,528 Class A equivalents), for the remaining 2.12% of BHE, while BHE bought back another 5.85% for $2.9 billion in cash [src:BRK-10K-FY2025#pK-102] [src:BRK-10K-FY2025#pK-115]; the report's statement that no new shares were issued in 2021–2025 [src:BRK-RPT1-2026-09-18#p9] is wrong. The 2025 letter to shareholders says Berkshire sets no allocated goals or targets for its 51 non-insurance operating businesses [src:BRK-LTR-2025#p11]."
      source: BRK-10K-FY2025#pK-115
      note: "The current reading in section 10 is “has not happened” [src:BRK-RPT1-2026-09-18#p14]. The 2024 letter says the BHE minority stake (about $3.9 billion) was paid $2.9 billion in cash and the rest in Class B shares [src:BRK-LTR-2024#p4], which the FY2025 10-K confirms: 2,291,631 Class B shares valued at $1.045 billion [src:BRK-10K-FY2025#pK-115]."
    note: "The last two items of report section 10, breaker #6; the first item (starting to pay a cash dividend) is split out and judged by the quantitative test BRK-Q15, because candidate companies run only quantitative tests and a dividend can be read directly from filings. Once the condition holds, the placement in section 6 as “excellent business × excellent management” no longer holds [src:BRK-RPT1-2026-09-18#p14]. The report calls its five constraints “unbroken for sixty years” [src:BRK-RPT1-2026-09-18#p14], but only the no-dividend record comes close: after present management took control in 1965 [src:BRK-LTR-2024#p5], Berkshire paid its one cash dividend on 1967-01-03 and none since [src:BRK-LTR-2024#p6]. The principle of issuing shares only for as much business value as is received was set down in 1983 [src:BRK-WEB-2026-09-27-1#p1] [src:BRK-WEB-2026-09-27-1#p3]; the 1993 purchase of Dexter Shoe, paid in Berkshire stock, is the case Buffett called his most gruesome mistake [src:BRK-LTR-2014#p26]; the 1998 acquisition of General Re issued about 272,200 Class A equivalent shares, diluting shareholders by 22.1% (this archive's computation) [src:BRK-10K-FY1998#p34], which Buffett later called a terrible mistake [src:BRK-LTR-2016#p3]; and the 2010 acquisition of BNSF added about $10.6 billion of equity through new shares [src:BRK-10K-FY2010#p44], about 95,000 Class A equivalents, 6.1% of those outstanding [src:BRK-LTR-2009#p15]. The buyback rule in its present form (below intrinsic value, conservatively determined) dates from the amendment of 2018-07-17 [src:BRK-8K-2018-07-19]. The real form of (b) is therefore “the intrinsic value given away must not exceed the value received”, not “no shares are issued”. “Clearly more than” cannot be observed beforehand, so this archive writes down an observable trigger in advance: an issue larger than one per cent of the shares outstanding, at an issue price no higher than the company's own recent average repurchase price, because by buying back at that price management has signalled that it is below a conservative estimate of intrinsic value [src:BRK-10Q-FY2026Q2#p51]; when there are no buybacks to compare with, 1.2 times book value per Class A share at the previous quarter-end is used instead [src:BRK-RPT1-2026-09-18#p14]. The issue size and the price line are both this archive's criteria, not the report's words; the 2024 issue for BHE was about 0.1% of the shares outstanding (about 1,528 of 1,438,223 Class A equivalents, this archive's computation) [src:BRK-10K-FY2025#pK-102]. (c) does not count budgets or headquarters adding layers as setting targets, because page 9 of the report treats “no budgets” and “no targets” separately [src:BRK-RPT1-2026-09-18#p9]; in December 2025 headquarters created the posts of president of the consumer products, service and retailing businesses and of general counsel, a new position [src:BRK-8K-2025-12-11#EX-99.1], which the report sees as leaning towards pulling power back to headquarters [src:BRK-RPT1-2026-09-18#p8]."

  - id: BRK-Q15
    type: quantitative
    claim: "The no-cash-dividend constraint still holds: all earnings are retained and allocated by headquarters"
    origin: report:breaker
    severity: breaker
    covers: [capital_allocation, governance]
    pillar: P4
    metric_def:
      id: common_cash_dividends_declared_or_paid
      description: Amount of common-stock cash dividends declared or paid in the period (each dividend counted once); recorded as 0 when the cash flow statement, the statement of changes in shareholders' equity and the 8-Ks have no record of a dividend
      unit: USD
      frequency: quarter
      data: filing_text
      where: The consolidated cash flow statement (financing activities) and the statement of changes in shareholders' equity of the 10-Q or 10-K; dividend announcements in 8-Ks
      formula: "max(dividends_declared_t, dividends_paid_t); 0 if none recorded"
    fail_if: Any common-stock cash dividend declared or paid
    rule: {op: ">", threshold: 0, unit: USD, consecutive: 1, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline:
      value: 0
      unit: USD
      period: 1H26
      as_of: 2026-06-30
      source: BRK-10Q-FY2026Q2#p6
      note: "The current reading in section 10 is “has not happened” [src:BRK-RPT1-2026-09-18#p14]. In 1965–2024 shareholders received a cash dividend only once: 10 cents per Class A share on 1967-01-03, $101,755 in total [src:BRK-LTR-2024#p6]; the 2025 letter to shareholders reaffirms that no dividend will be paid as long as each dollar of retained earnings is likely to create more than a dollar of market value, and that the board reviews this policy every year [src:BRK-LTR-2025#p7]."
    note: "The first item of report section 10, breaker #6 (starting to pay a cash dividend) [src:BRK-RPT1-2026-09-18#p14], split out of the qualitative test BRK-L3: candidate companies run only quantitative tests (the cost rule in DESIGN.md), and whether a dividend has been declared or paid can be read directly from filings. It uses filing_text rather than XBRL because Berkshire pays no dividends (none declared since 1967) [src:BRK-10K-FY2025#pK-32], and a dividend concept missing from XBRL cannot be taken as zero. Once the condition holds, the placement in section 6 as “excellent business × excellent management” no longer holds [src:BRK-RPT1-2026-09-18#p14]; the corresponding policy statement is recorded in ledger.yml as BRK-M4."

  - id: BRK-Q9
    type: quantitative
    claim: "The current CEO's large capital deployments have not been proven wrong: no large acquisition or stock investment made during his tenure has been heavily written down within a few years of completion"
    origin: report:breaker
    severity: breaker
    covers: [capital_allocation, returns_on_capital, management]
    pillar: P3
    metric_def:
      id: large_deal_impairment_3y
      description: For each acquisition or stock investment during the current CEO's tenure (signed, or first bought, from params.tenure_start on) larger than params.min_deal_size_usd, the cumulative loss within params.window_years years of reaching that size as a share of initial cost; the largest of these. For acquisitions and equity-method investments, count the goodwill, intangible-asset or investment impairments recorded; stock investments measured at fair value are not impaired separately in the accounts, so count only realised losses, or unrealised losses against cost that exist at two consecutive year-ends (taking the smaller of the two year-ends); for stock in the same issuer, whether the single-deal size is reached is judged on the cumulative purchase cost during the tenure. Not computed when there is no qualifying deal
      unit: "%"
      frequency: event
      data: filing_text
      where: 8-Ks and the 10-Q or 10-K notes on business combinations (consideration), goodwill and intangible-asset impairments, equity-method investments and investments in equity securities; Berkshire's Form 13F-HR filings (shares held, by issuer); and the cost-basis tables in the annual letter to shareholders, which show cost and market value only for the issuers management chooses to list (nine in the 2025 letter)
      formula: max_over_qualifying_deals(cumulative_loss_within_window / initial_cost)
    params: {min_deal_size_usd: 30000000000, window_years: 3, tenure_start: "2026-01-01"}
    fail_if: A single acquisition or stock investment of more than $30 billion written down by more than 30% within three years
    rule: {op: ">", threshold: 30, unit: "%", consecutive: 1, period: event}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline:
      value: No qualifying deal confirmed; the Alphabet position may qualify, and its cost is read from the holdings table of the annual letter for 2026
      source: BRK-13FHR-FY2026Q2
      note: "A stock investment is the position in one issuer bought during the current CEO's tenure, at cost (metric_def). By transaction, nothing since 2026-01-01 exceeded $30 billion: the largest were the $10 billion Alphabet placement agreed on 2026-06-01 [src:GOOGL-8K-2026-06-04#Item8.01], the OxyChem acquisition (agreed at $9.7 billion [src:OXY-8K-2025-10-03#Item1.01], about $9.4 billion paid after post-closing adjustments, closed 2026-01-02) and Taylor Morrison (about $6.8 billion, closed 2026-07-24) [src:BRK-10Q-FY2026Q2#p8]. By position, Berkshire's Alphabet holding rose from 17,846,142 Class A shares at 2025-12-31 [src:BRK-13FHR-FY2025Q4] to 78,791,167 Class A and 27,188,433 Class C shares at 2026-06-30 [src:BRK-13FHR-FY2026Q2], about 88 million shares added in the first half, the placement's 28,571,691 shares among them [src:GOOGL-8K-2026-06-04#Item8.01]. The cost of the whole addition is not disclosed, so whether it passes the size threshold cannot be confirmed; the 2025 letter's cost tables list nine issuers and not Alphabet [src:BRK-LTR-2025#p15] [src:BRK-LTR-2025#p16]. If the letter for 2026 does not list Alphabet, the cost stays undisclosed and the reading undetermined. No share price enters this reading."
    note: "Report section 10, breaker #7. Once the condition holds, the current CEO's rating as a capital allocator changes from “yet to be proven” to “disproven” [src:BRK-RPT1-2026-09-18#p15]. The following three points are this archive's operationalisation, not the report's words: (1) the breaker is about the current CEO, so only deals during his tenure count, with the tenure starting on 2026-01-01 [src:BRK-8K-2025-12-11#EX-99.1]; (2) stocks are often bought over several quarters, as Berkshire's Alphabet position was in 2026 [src:BRK-13FHR-FY2025Q4] [src:BRK-13FHR-FY2026Q2], so for the same issuer the single-deal size is judged on the cumulative purchase cost during the tenure; (3) stock investments measured at fair value are not impaired in the accounts [src:BRK-10K-FY2025#pK-72], so only realised losses count, or unrealised losses still present at two consecutive year-ends, so that a single market fall does not trigger the breaker. For acquisitions, goodwill, intangible assets and equity-method investments, the impairments recorded count, as in the report."

  # ---------- Report section 10: watch indicators read every quarter (the order is the conclusion: execution first, then price discipline in deployment, and the cash share last) ----------
  - id: BRK-Q10
    type: quantitative
    claim: "GEICO's recovery is real: policies in force return to mid-single-digit growth while the combined ratio does not worsen"
    origin: report:watch
    severity: watch
    covers: [moat, pricing_power, competition]
    pillar: P2
    metric_def:
      id: geico_policies_in_force_yoy
      description: Year-on-year change in GEICO's voluntary auto policies-in-force; the quarterly reading compares the quarter-end with the same quarter-end a year earlier, the annual reading the year-end with the previous year-end
      unit: "%"
      frequency: quarter
      data: filing_text
      where: "GEICO's policies in force are not a number the current filings give: since FY2025 the 10-K and 10-Q MD&A state only the direction of the change (the FY2025 10-K and the Q3 2025 10-Q: premiums rose because policies in force increased; the 2026 10-Qs: nothing), and the last number in a filing is 2024's -0.5%. A number may appear in the annual letter to shareholders or in the company's releases on berkshirehathaway.com, which are read each period; until FY2024 the GEICO section of the MD&A of the 10-Q or 10-K gave the year-on-year change in policies in force"
      formula: policies_in_force_t / policies_in_force_{t-4q} - 1
    params: {segment: GEICO}
    fail_if: Policies in force below 4% year on year (not back to mid-single digits), or the quarter's combined ratio worse than in the same quarter a year earlier
    rule:
      any_of:
        - {metric: geico_policies_in_force_yoy, op: "<", threshold: 4, unit: "%", consecutive: 1, period: quarter}
        - {metric: combined_ratio, op: increase, threshold: 0, unit: pp, consecutive: 1, period: quarter}
      note: The combined ratio is GEICO's reading for the quarter (params.segment), compared with the same quarter a year earlier.
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline:
      value: 91.2
      unit: "%"
      period: 2026Q2
      as_of: 2026-06-30
      source: BRK-10Q-FY2026Q2#p34
      note: "This is the reading of the combined-ratio branch: GEICO's losses and expenses were 91.2% of premiums earned in Q2 2026, against 83.5% in the same quarter a year earlier [src:BRK-10Q-FY2026Q2#p34]. The policy branch has no primary reading: the 2026 10-Qs give no GEICO policy count [src:BRK-10Q-FY2026Q1#p31] [src:BRK-10Q-FY2026Q2#p35]. The CEO said at the annual meeting of 2026-05-02 that policies in force at 2026-03-31 were about 2% above a year earlier (evidence level L2: third-party accounts of the meeting, not in any filing) [src:BRK-NEWS-2026-05-04-CARRIERMANAGEMENT], a Q1 2026 figure that the report's section 10 table prints in the second-quarter cell without a period [src:BRK-RPT1-2026-09-18#p15]; Progressive's personal auto policies in force grew 10.9% in the same year (9% for all its personal lines policies) [src:PGR-10Q-FY2026Q1#p23] [src:PGR-10Q-FY2026Q1#p33]."
    note: "Report section 10, watch indicator #1: policies must return to mid-single digits and the combined ratio must not worsen, both at once; the former alone would show growth bought with price [src:BRK-RPT1-2026-09-18#p15]. The report gives no number for “mid-single digits”; the line in fail_if takes the lower end of the mid-single-digit range, an operationalisation this archive wrote down in advance. The combined-ratio branch already meets the fail condition on the Q2 2026 reading, and the policy growth the CEO gave for Q1 2026 (about 2%) would meet the other, so the test was already failing (at watch level, i.e. a warning) when the archive was set up, consistent with the report's judgement that this moat is “weakening” [src:BRK-RPT1-2026-09-18#p6]. A quarter for which no primary document gives a policy count leaves the policy branch undetermined; the combined-ratio branch is still judged, and under any_of it decides the test when it fails. Section 5 gives a way to tell the two paths apart: if policies recover first and the combined ratio falls afterwards, the problem lies in people and processes; if policies stay flat while the combined ratio keeps rising, the problem lies in pricing technology [src:BRK-RPT1-2026-09-18#p9]."

  - id: BRK-Q11
    type: quantitative
    claim: "New deployments keep price discipline: the initial pre-tax yield of large new acquisitions is no lower than the level used for the test event in section 9 of the report"
    origin: report:watch
    severity: watch
    covers: [capital_allocation, returns_on_capital]
    pillar: P3
    metric_def:
      id: new_acquisition_initial_pretax_yield
      description: For each acquisition completed in the period (wholly owned or controlling) whose consideration (including assumed debt) is at least params.min_deal_size_usd, initial pre-tax yield = pre-tax earnings of the acquired business in its last full year before the acquisition ÷ purchase consideration (including assumed debt); the lowest of these. When the target's pre-acquisition pre-tax earnings are not public, that deal is recorded as undeterminable; not computed when no acquisition of that size was completed in the period
      unit: "%"
      frequency: event
      data: filing_text
      where: Berkshire's 8-Ks and the business combination notes of its 10-Q or 10-K (consideration and assumed debt); the annual reports and segment notes of the target or the seller (pre-tax earnings)
      formula: min_over_qualifying_deals(target_pretax_income_last_full_year / (purchase_consideration + assumed_debt))
    params: {min_deal_size_usd: 5000000000}
    fail_if: A new acquisition of qualifying size completed in the period with an initial pre-tax yield below 9%
    rule: {op: "<", threshold: 9, unit: "%", consecutive: 1, period: event}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline:
      value: null
      source: BRK-RPT1-2026-09-18#p15
      note: "The report does not give the initial pre-tax yields of the two 2026 acquisitions, OxyChem and Taylor Morrison [src:BRK-RPT1-2026-09-18#p15]; on the buyback side, the current reading is an average repurchase price of about 1.40 times book value in the first half of 2026 (this archive's computation, see BRK-Q8) [src:BRK-10Q-FY2026Q2#p51] [src:BRK-10Q-FY2026Q2#p22]."
    note: "Report section 10, watch indicator #2 only says to look at what multiple of book value buybacks happen at and what initial pre-tax yield new acquisitions have; it gives no threshold. The line comes from the test event in section 9: the report treats the next large deployment that lands at a pre-tax return of 9% or more as the observation point for telling the two readings apart [src:BRK-RPT1-2026-09-18#p13]; this is a criterion this archive wrote down in advance, not a threshold in the report's words. The size threshold is also this archive's: the report says Berkshire needs single opportunities in the ten-billion-dollar class to move the needle [src:BRK-RPT1-2026-09-18#p6], and the threshold is half of that, so that both 2026 deals enter the test, while occasional small bolt-on acquisitions do not: OxyChem, agreed at $9.7 billion [src:OXY-8K-2025-10-03#Item1.01], of which about $9.4 billion was paid after post-closing adjustments (the price its initial pre-tax yield uses), and Taylor Morrison, with an equity value of about $6.8 billion [src:BRK-10Q-FY2026Q2#p8]. The buyback multiple is judged by BRK-Q8 against the breaker threshold; large stock purchases have no matching price-discipline test yet, see todo."

  - id: BRK-Q12
    type: quantitative
    claim: "Insurance investment income, one of the two largest lines of after-tax earnings, moves with interest rates and has no duration-positioning problem: after rate rises, insurance investment income turns positive year on year"
    origin: report:watch
    severity: watch
    covers: [balance_sheet, returns_on_capital]
    pillar: P1
    metric_def:
      id: insurance_investment_income_yoy_when_rates_up
      description: Year-on-year growth g_inc of insurance investment income (after tax, company segment basis). Taken only when the quarterly average of the midpoint of the federal funds target range is higher than in the same quarter a year earlier, otherwise not computed; in such a quarter, if investment income fell year on year while the quarterly average balance of cash and Treasury bills (the average of the start and end of the quarter) fell even more (g_bal < g_inc < 0), the fall can be explained by cash being deployed, and the metric is not computed either
      unit: "%"
      frequency: quarter
      data: mixed
      where: The Insurance—investment income line in the table of after-tax earnings by segment in the MD&A of the 10-Q or 10-K; the cash and Treasury bill balances from the balance sheet and notes; the rate condition from the target range published in FOMC statements (not a filing)
      formula: "g_inc = insurance_investment_income_t / insurance_investment_income_{t-4q} - 1; g_bal = avg_bal(cash_tbills)_t / avg_bal(cash_tbills)_{t-4q} - 1; value = g_inc if avg(fed_funds_target_mid)_t > avg(fed_funds_target_mid)_{t-4q} and not (g_bal < g_inc < 0), else not computed"
      components:
        insurance_investment_income:
          description: Insurance investment income (after tax, company segment basis)
          unit: USD
          where: The Insurance—investment income line in the table of after-tax earnings by segment in the MD&A of the 10-Q or 10-K
        cash_tbills:
          description: Balance of cash, cash equivalents and US Treasury bills (the quarterly average is the average of the start and end of the quarter)
          unit: USD
          where: The balance sheet and notes of the 10-Q or 10-K
        fed_funds_target_mid:
          description: Midpoint of the federal funds target range (quarterly average)
          unit: "%"
          where: The target range published in FOMC statements (not a filing)
    fail_if: In a quarter when short-term rates are up year on year, insurance investment income still falls year on year, and the fall cannot be explained by a decrease in the cash and Treasury bill balance
    rule: {op: "<", threshold: 0, unit: "%", consecutive: 1, period: quarter}
    data: mixed
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline:
      value: -7.4
      unit: "%"
      period: 2026Q1
      as_of: 2026-03-31
      source: BRK-10Q-FY2026Q1#p29
      note: "After-tax insurance investment income was $2,679 million in Q1 2026 against $2,893 million in Q1 2025, down 7.4% [src:BRK-10Q-FY2026Q1#p29]. The report's −10.3% is the pre-tax interest and other investment income line alone ($2,260 million against $2,519 million, dividends excluded) [src:BRK-10Q-FY2026Q1#p34] [src:BRK-RPT1-2026-09-18#p5]. In Q2 2026 after-tax insurance investment income was $3,059 million against $3,367 million, down 9.1%, and in the first half $5,738 million against $6,260 million, down 8.3% (this archive's computations) [src:BRK-10Q-FY2026Q2#p33]. In both quarters the federal funds target range was lower than a year earlier (4.25%–4.50% in the first half of 2025, 3.50%–3.75% in the first half of 2026), so under this test's definition the metric is not computed for them [src:FED-OPENMARKET-2026-09-27]. On the same after-tax table, insurance investment income was the largest line in 2024 ($13,670 million against $13,072 million for manufacturing, service and retailing) and the second largest in 2025 ($12,513 million against $13,647 million) and in the first half of 2026 ($5,738 million against $7,669 million) [src:BRK-10K-FY2025#pK-34] [src:BRK-10Q-FY2026Q2#p33]; before tax it was the largest single segment in 2025 ($15,261 million against $12,571 million for manufacturing) [src:BRK-10K-FY2025#pK-40] [src:BRK-10K-FY2025#pK-46]. It holds only the insurance businesses' investment income: the interest on the parent's own Treasury bills is in “Other” ($3,566 million of after-tax investment income in 2025) [src:BRK-10K-FY2025#pK-54]."
    note: "Report section 10, watch indicator #3: a rate rise should push it back into positive territory, and if it still falls, duration positioning has gone wrong [src:BRK-RPT1-2026-09-18#p15]. On 2026-09-16 the FOMC raised the target range by 25 basis points to 3.75%–4.00%, the first rise since 2023 [src:FED-FOMC-2026-09-16] [src:FED-OPENMARKET-2026-09-27]. The report gives no number of periods, so here the test is judged quarter by quarter, subject to the rate condition. Deploying cash also depresses investment income, and that is exactly what pillar P3 hopes to see, so the metric's definition excludes quarters in which “investment income fell while the average balance of cash and Treasury bills fell even more”, leaving only falls that a smaller balance cannot explain. The 2025 cuts took effect on 2025-09-18, 2025-10-30 and 2025-12-11 and the rise on 2026-09-17 [src:FED-OPENMARKET-2026-09-27]: on the range in force at 2026-09-27, the quarterly average of the midpoint is 3.66% in Q3 2026 against 4.34% a year earlier and 3.88% in Q4 2026 against 3.90% (this archive's computation), so the 2026-11 reading and the Q4 2026 reading are “not computed”, and the first quarter the metric can be computed is Q1 2027, unless the range rises again during Q4 2026."

  - id: BRK-Q13
    type: quantitative
    claim: "Cash is not piling up again: after taking out buybacks, cash and Treasury bills have not gone back to rising"
    origin: report:watch
    severity: watch
    covers: [capital_allocation]
    pillar: P3
    metric_def:
      id: cash_tbills_change_ex_buybacks
      description: Quarter-on-quarter change in the quarter-end balance of cash, cash equivalents and US Treasury bills, with the quarter's buybacks added back (that is, the change after taking out buybacks; positive means cash is piling up again)
      unit: USD
      frequency: quarter
      data: filing_text
      where: The 10-Q balance sheet and notes (cash, cash equivalents and US Treasury bills); the statement of changes in shareholders' equity or Part II, Item 2 (the quarter's buybacks)
      formula: (cash_tbills_t - cash_tbills_{t-1q}) + buybacks_t
    fail_if: After taking out buybacks, cash and Treasury bills rise for two consecutive quarters
    rule: {op: ">", threshold: 0, unit: USD, consecutive: 2, period: quarter}
    warn_if: After taking out buybacks, cash and Treasury bills did not fall in the latest quarter
    warn_rule: {op: ">=", threshold: 0, unit: USD, consecutive: 1, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline:
      value: -10900000000
      unit: USD
      period: 2026Q2
      as_of: 2026-06-30
      source: BRK-10Q-FY2026Q2#p2
      note: "−$10.9 billion (−$10,884 million, this archive's computation): cash, cash equivalents and Treasury bills fell from $380,154 million at 2026-03-31 to $364,743 million at 2026-06-30 (consolidated, net of unsettled Treasury bill purchases, as in baseline_facts F2) [src:BRK-10Q-FY2026Q1#p2] [src:BRK-10Q-FY2026Q2#p2], and the second quarter's buybacks of $4,527 million at cost are added back [src:BRK-10Q-FY2026Q2#p6]. Counting the buybacks as cash paid in the quarter ($4,209 million) gives −$11.2 billion [src:BRK-10Q-FY2026Q2#p7] [src:BRK-10Q-FY2026Q1#p6]. The 10-Qs' own figures for the insurance and other businesses alone are $373.5 billion and $359.2 billion [src:BRK-10Q-FY2026Q1#p44] [src:BRK-10Q-FY2026Q2#p48]. A negative value means the balance is still falling after taking out buybacks; the sign is what the test reads."
    note: "Report section 10, watch indicator #4 looks at the direction of cash and Treasury bills as a share of market value; that reading takes price as an input and, under §H4, is recorded only in the private valuation file. The report's own counting rule looks at the balance on the balance sheet: a fall counts only if it lasts two consecutive quarters and remains after taking out the buyback amount, because buybacks are a return of capital, not an allocation to assets [src:BRK-RPT1-2026-09-18#p15]. So this test reads no price (hard rule 2) and judges the direction from the change in the balance after taking out buybacks, which matches the meaning of the report's counting rule: no fall in the latest quarter after taking out buybacks is a warning, and a rise for two consecutive quarters is a failure; the report's good signal (a fall for two consecutive quarters) is recorded separately at review. The year-end cash breaker line is judged by BRK-Q7 (threshold and readings in the private valuation file); for the price-free reading as a share of total assets see BRK-Q14. The report also warns that in some future ten-year period a falling cash balance may reflect absorbing the selling pressure from the founder's estate rather than buying assets [src:BRK-RPT1-2026-09-18#p15]."

  - id: BRK-L4
    type: qualitative
    claim: The legal path of the PacifiCorp wildfire litigation has not reversed
    origin: report:watch
    severity: watch
    covers: [regulation, balance_sheet]
    pillar: P5
    question: "Do this period's filings by BHE or PacifiCorp show any of the following: (a) the Oregon Supreme Court has reinstated the original James class-action judgment (reversing the Court of Appeals' decision); (b) the remaining damages trials, previously stayed, have resumed; (c) the waived appeal bond requirement has been reimposed?"
    fail_if: Yes (any of the three items holds)
    warn_if: Cumulative wildfire loss accruals higher than in the previous period, or a state regulator has rejected a PacifiCorp rate application
    judge: independent_model
    evidence: required
    where: The contingencies notes in the 10-Q or 10-K of BHE and PacifiCorp; rulings of the Oregon Supreme Court; rate decisions of the state utility commissions
    lookback: 2
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline:
      value: "On 2026-04-08 the Oregon Court of Appeals reversed the James class-action Phase I liability verdict over an erroneous jury instruction and remanded the case, naming PacifiCorp the prevailing party; the opinion does not itself order a new trial, and it notes that the trial court may reconsider class certification on remand [src:OR-COA-A183140-2026-04-08#p2] [src:OR-COA-A183140-2026-04-08#p3] [src:OR-COA-A183140-2026-04-08#p41]. In May 2026 the trial court stayed the remaining damages trials and, when it let limited judgments be entered on the damages trials already completed, waived the bonding requirement on those new judgments; the $719 million of bonds already posted for judgments entered earlier (129 plaintiffs) stayed in place, and PacifiCorp's May 2026 motion to discharge them was still pending when BHE's Q2 10-Q was filed on 2026-08-10 [src:BHE-10Q-FY2026Q2#p24] [src:BHE-10Q-FY2026Q2#p25]. On 2026-06-25 the Oregon Supreme Court allowed the plaintiffs' petition for review, with oral argument set for 2026-11-03 [src:OR-SC-S072933-2026-06-25#p2]. At 2026-06-30 cumulative wildfire loss accruals were $2,853 million and payments $2,281 million, with no new accrual in the first half [src:BHE-10Q-FY2026Q2#p25]."
      source: BHE-10Q-FY2026Q2#p25
      note: "The owner's report says S&P downgraded PacifiCorp to BBB−, one notch above non-investment grade, in November 2025 [src:BRK-RPT1-2026-09-18#p7]; the rating agency's own release could not be read and was not checked. BHE's filings confirm that PacifiCorp's credit ratings have declined and that its issuer credit ratings for senior unsecured debt were investment grade at 2025-12-31 and 2026-06-30 [src:BHE-10K-FY2025#p208] [src:BHE-10Q-FY2026Q2#p84]."
    note: "Report section 10, watch indicator #5: whether the class judgment is reinstated, when the stayed trials resume, and whether the bond requirement is reimposed. The report holds that the worst case depends on whether the Supreme Court reinstates the original judgment, and that no amount can be put on it yet [src:BRK-RPT1-2026-09-18#p8]; PacifiCorp says it cannot reasonably estimate a range of possible additional losses [src:BHE-10Q-FY2026Q2#p26]. The two items of warn_if come from the body of the report [src:BRK-RPT1-2026-09-18#p6]: cumulative accruals were unchanged at $2,853 million from 2025-12-31 to 2026-06-30 [src:BHE-10K-FY2025#p190] [src:BHE-10Q-FY2026Q2#p25], and in May 2026 the Oregon commission denied PacifiCorp's request for interim rates [src:BHE-10Q-FY2026Q2#p45]. Whether the parent puts in money is judged by breaker BRK-L2."

  # ---------- Watch tests this archive added on the basis of sections 7 and 12 of the report (the report did not put these two matters on the monitoring list in section 10) ----------
  - id: BRK-Q16
    type: quantitative
    claim: In a downturn, cash is swapped for other companies' equity rather than used mainly for lending and for buying back Berkshire's own shares
    origin: manual
    severity: watch
    covers: [capital_allocation, management]
    pillar: P3
    metric_def:
      id: downturn_equity_deployment_share
      description: "Over the four quarters around the trigger quarter (the quarter before, the trigger quarter and the two after), capital put into other companies' equity as a share of all uses of capital. Put into other companies' equity = net stock purchases (0 if negative) + cash paid for acquisitions; all uses of capital = capital put into other companies' equity + new loans and debt-like investments such as preferred stock with warrants or fixed dividends + buybacks. Trigger quarter: the 10-Q shows an investment loss on the equity portfolio in the quarter of at least params.trigger_loss_pct of fair value at the start of the quarter. Not computed when there is no trigger quarter or the denominator is zero"
      unit: "%"
      frequency: event
      data: filing_text
      where: The notes on investment gains and losses and on investments in equity securities in the 10-Q or 10-K (the quarter's loss and fair value at the start of the quarter); the consolidated cash flow statement (acquisitions, purchases and sales of stocks, loans and fixed-income investments); the repurchase table in Part II, Item 2
      formula: "(max(0, equity_purchases - equity_sales) + acquisitions_cash) / (max(0, equity_purchases - equity_sales) + acquisitions_cash + new_loans_and_preferreds + buybacks), summed over quarters t-1 .. t+2 around the trigger quarter t"
    params: {trigger_loss_pct: 15, window_quarters: [-1, 2]}
    fail_if: In the four quarters after the trigger, capital put into other companies' equity is less than half of all uses of capital
    rule: {op: "<", threshold: 50, unit: "%", consecutive: 1, period: event}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline:
      value: "The latest downturn (2020): Berkshire bought $30.2 billion of equities and sold $38.8 billion, net sales of $8.6 billion; outside Treasury bills its largest use of cash was $24.7 billion of share repurchases (capital expenditure $13.0 billion, acquisitions $2.5 billion), while net purchases of Treasury bills and fixed maturities were $26.8 billion [src:BRK-10K-FY2020#Item8]"
      source: BRK-10K-FY2020#Item8
      note: "Of the four downturns the report lists [src:BRK-RPT1-2026-09-18#p10], it counts only Q1 2022 as a clean example of “swapping cash on a large scale for other companies' equity in a downturn” [src:BRK-RPT1-2026-09-18#p16]: that quarter Berkshire bought $51.1 billion of stocks, $41.4 billion net of sales, and agreed to buy Alleghany for about $11.6 billion in cash [src:BRK-10Q-FY2022Q1#CashFlows]. In 2008 the deployment was mainly lending: in the fourth quarter $14.5 billion went into Wrigley notes and preferred stock and into Goldman Sachs and General Electric preferred stock with warrants [src:BRK-10K-FY2008#Item7]; the roughly $20 billion of Q3 2011 ($19.7 billion on the cash-flow statements, this archive's computation) included the Lubrizol acquisition and $5 billion of Bank of America preferred stock [src:BRK-10Q-FY2011Q3#CashFlows] [src:BRK-10Q-FY2011Q2#CashFlows]."
    note: "The first item of “where it is most likely wrong” in section 12 of the report: if, in the next systemic downturn without a policy backstop, it still mainly lends and buys back shares, the case for treating this cash as an option no longer holds [src:BRK-RPT1-2026-09-18#p16]. The report did not put this on the monitoring list in section 10; this test is the executable version this archive added. The trigger line is the −15% scenario for equity investments (Investments in equity securities on the 10-Q balance sheet, measured at fair value [src:BRK-10Q-FY2026Q2#p2] [src:BRK-10K-FY2025#pK-72]) in the sensitivity table of section 9 [src:BRK-RPT1-2026-09-18#p12]; the window starts one quarter before the trigger, because the report says Berkshire tends to act in the early-to-middle stage of a downturn rather than at the bottom [src:BRK-RPT1-2026-09-18#p10]; the “half” line is also a standard this archive wrote down in advance. The trigger line looks at losses on Berkshire's own equity portfolio and reads no share price. “Without a policy backstop” and “systemic” cannot be read from Berkshire's filings; when the test fails, the review states in its conclusion whether there was a policy backstop at the time; the report regards 2020 as a test that policy pre-empted [src:BRK-RPT1-2026-09-18#p10]."

  - id: BRK-L5
    type: qualitative
    claim: Pricing judgement on catastrophe and very large single risks has not broken off with the departure of one person
    origin: manual
    severity: watch
    covers: [management, governance]
    pillar: P1
    question: Does this period's 8-K (Item 5.02), proxy statement or letter to shareholders disclose that the vice chairman of insurance operations (Ajit, in the 2025 letter to shareholders) has left or is about to leave, without stating at the same time who takes over the pricing of catastrophe and very large single risks?
    fail_if: "Yes"
    warn_if: A departure is disclosed together with the succession arrangements
    judge: independent_model
    evidence: required
    where: Item 5.02 of 8-Ks, the annual proxy statement, the annual letter to shareholders
    lookback: 1
    judge_notes:
      - The test can be judged as soon as a departure is disclosed; there is no need to wait for succession arrangements to be announced separately.
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline:
      value: "Has not happened: no filing through 2026-09-27 discloses a departure, and he was re-elected a director at the annual meeting of 2026-05-02 [src:BRK-8K-2026-05-07#Item5.07]. The proxy statement says the board discusses succession planning extensively at each of its meetings [src:BRK-DEF14A-2026-03-13#p5]. Asked at the 2026 annual meeting about the succession arrangements for him and for the CEO, Abel answered that the board has plans and discusses them, without disclosing their content (the report's account of the meeting Q&A, which CNBC streams, not in any filing) [src:BRK-RPT1-2026-09-18#p10]."
      source: BRK-DEF14A-2026-03-13#p5
      note: "Ajit Jain was 74 at the 2026 proxy statement (2026-03-13); he joined Berkshire's insurance group in 1986, has managed its reinsurance operations for 39 years and has been Vice Chairman – Insurance Operations since 2018 [src:BRK-DEF14A-2026-03-13#p4]. The 2025 letter says his rigour in managing and pricing risk sets the standard in insurance and credits him with nearly four decades of underwriting judgement [src:BRK-LTR-2025#p7] [src:BRK-LTR-2025#p9]. On 2026-05-04 the Wall Street Journal reported, citing people familiar with the matter, that Gen Re chairman Charlie Shamieh had been chosen to succeed him; Berkshire has not confirmed it, and no 8-K under Item 5.02 on Jain had been filed through 2026-09-27 (evidence level L2: a third-party report, not in any filing) [src:BRK-NEWS-2026-05-05-INSURANCEJOURNAL]."
    note: "The third bear-case argument in section 7 of the report: the core of insurance pricing is one vice chairman (74 at the March 2026 proxy statement [src:BRK-DEF14A-2026-03-13#p4]); there is no hedge, and all one can do is wait for a name in each year's proxy statement and at each annual meeting [src:BRK-RPT1-2026-09-18#p10] [src:BRK-RPT1-2026-09-18#p11]. The report estimates that if normalised underwriting falls from $5 billion to $3 billion after he leaves, after-tax earnings drop by about $2 billion a year, about 4.5% of 2025 operating earnings [src:BRK-RPT1-2026-09-18#p10]; the report holds that this does not overturn its conclusion, so this test is a watch rather than a breaker. He is a director and a named executive officer [src:BRK-DEF14A-2026-03-13#p8], so a departure is disclosed under Item 5.02 of an 8-K [src:SEC-FORM8K] and is an event that can be judged directly. Candidate companies do not run qualitative tests, so this test will not be judged before Berkshire becomes a holding (see todo)."

