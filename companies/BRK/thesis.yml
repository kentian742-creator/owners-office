  - id: BRK-S3
    type: staleness
    claim: “Where it is most likely wrong” is re-examined every two quarters
    origin: template:stalwart
    severity: watch
    covers: [other]
    pillar: P3
    section: bear_case
    max_age_quarters: 2
    effective_from: FY2026Q3
    note: "Section 12 of the report holds that the thinnest point is “whether it will turn cash into equity in a downturn”, with only one clean example in four downturns [src:BRK-RPT1-2026-09-18#p16], to be judged by BRK-Q16 in the next downturn; next comes a judgement among the valuation inputs (in the private repository); and then the fact that the front-line readings are only a snapshot as of 2026-09-18, not a time series [src:BRK-RPT1-2026-09-18#p16]."

todo:
  - "The accession numbers and filing dates of the primary filings, and BHE's CIK, are in sources.yml, checked against EDGAR. Berkshire furnishes its quarterly results under Item 2.02 of an 8-K [src:SEC-FORM8K], filing the 10-Q or 10-K first and the 8-K after it (for example the Q2 2026 10-Q on 2026-08-10 and the results 8-K on 2026-08-11) [src:BRK-10Q-FY2026Q2] [src:BRK-8K-2026-08-11]; filer.earnings_form is filled in by the pipeline (§G8). The baselines of the breakers now cite the primary filings; BRK-Q5's policy branch has no primary reading (see its note)."
  - "The report's footer prints only “September 2026”, with no day; reviewed and the source date use the reading cut-off date stated on the cover, 2026-09-18. This is this archive's choice, pending confirmation by HQ in a decision record; it is neither a money matter nor a constitutional amendment, so the owner need not be asked."
  - "Independent judging of qualitative tests runs only for holdings; Berkshire is archived, and the archive is refreshed once a year with the annual report (docs/decisions/0008), so none of the qualitative tests BRK-L1 to BRK-L5 will be judged, including the two breakers BRK-L2 (PacifiCorp) and BRK-L3 (share-for-share deals, headquarters targets). The dividend item, which can be read directly, has already been split out as the quantitative breaker BRK-Q15. HQ to decide whether to run BRK-L2 and BRK-L3 for the archived Berkshire too (one yes/no question per 10-Q or 8-K, at very small cost), or to accept the gap and state it in a decision record."
  - "The first branch of BRK-Q7 (the year-end cash breaker line) and the second branch of BRK-Q8 (the breaker line on the quarter-end price against book value) both need a period-end price, and under §H4 the thresholds and readings of both lines are recorded only in the private valuation file; but hard rule 2 says price is used only for alerts when a value range is crossed, and the private repository holds only one reference price; the original idea of “the private side reads the period-end price and the public side records only the result” itself goes beyond hard rule 2. A possible approach: rewrite the two conditions as price lines computed from filings (for BRK-Q7, cash and Treasury bills ÷ Class A equivalent shares ÷ the ratio threshold registered in the private valuation file; for BRK-Q8, quarter-end book value per Class A share × the multiple threshold registered in the private valuation file), have the private side's range alerts record only whether the period-end price is below these two lines, and have the public side read only the “below or not” status. This amounts to widening the uses allowed by hard rule 2 and needs a decision record by HQ; if HQ considers the rule to be set by the owner, the owner must confirm as well. Until this is settled, both branches are recorded as undeterminable, and the price-free readings come from BRK-Q13 and BRK-Q14."
  - "The report does not define “deployed” for BRK-Q7; this archive counts cash paid for acquisitions plus net stock purchases, excluding buybacks and capital expenditure; to be reviewed at the next update."
  - "BRK-Q5 and BRK-Q10: since FY2025 the 10-K and 10-Q give only the direction of GEICO's policies in force, no number (FY2025: an increase; FY2024: −0.5%) [src:BRK-10K-FY2025#pK-36]. Each period, check the annual letter and the company's releases for a number; without a primary number the policy reading is recorded as undetermined, and the combined ratio is still read. Whether to add a test on what the filings do carry (for example GEICO's premiums earned together with its combined ratio) is a forward change under §G7 for a later update."
  - "The report gives no number for BRK-Q10's “mid-single digits”; fail_if operationalises it as the lower end of the mid-single-digit range, to be reviewed at the next update. The Q2 2026 10-Q gives no GEICO policy count [src:BRK-10Q-FY2026Q2#p35]."
  - "BRK-Q11 needs the initial pre-tax yields of the 2026 OxyChem and Taylor Morrison acquisitions, which the report does not give; to be backfilled from Occidental's segment reporting and Taylor Morrison's earlier filings and from Berkshire's business combination notes (OxyChem at the price paid, about $9.4 billion) [src:BRK-10Q-FY2026Q2#p8]. Large stock purchases have no matching price-discipline test, for example the $19.8 billion of net stock purchases in Q2 2026 [src:BRK-10Q-FY2026Q2#p7] and the $10 billion Alphabet placement [src:GOOGL-8K-2026-06-04#Item8.01]; a watch test on the look-through earnings yield of large new holdings could be added, basis to be decided."
  - "BRK-Q8's baseline is on the report's basis (first-half average repurchase price ÷ book value on 2026-06-30), not on this metric's basis; the metric's readings for 2026Q1 and 2026Q2 are to be backfilled from the repurchase tables of the two 10-Qs (monthly average prices) and book value at the preceding quarter-ends."
  - "BRK-Q1's and BRK-Q2's baselines are now computed from the exact figures of the FY2025 10-K, and BRK-Q14's was backfilled from it (30.5%, above the 30% line of fail_if); the baselines of BRK-Q3 and BRK-Q4 are still to be backfilled (year-on-year change in the average share count; capital expenditure for FY2024 and FY2025). The thresholds of BRK-Q1, BRK-Q4 and BRK-Q14 are to be reviewed once against the actual levels and volatility after the series have been backfilled; any change applies only to later periods (§G7)."
  - "Replacing template tests (BRK-Q1 for Q-growth, BRK-Q2 for Q-returns, BRK-Q4 for Q-fcf, BRK-L1 for L-guidance) was this archive's own choice: the template README only says that thresholds may be rewritten, not that metrics may be replaced. Whether replacement is allowed, and whether a replacement's origin is recorded as manual or template:stalwart (when the category changes, the template tests are found through origin), awaits confirmation by the spec or HQ; for now this archive follows the AXP and PDD archives, recording manual and stating in the note which test is replaced."
  - "BRK-Q2 uses book value per share in place of return on capital, which includes swings in the market value of the equity portfolio, carried at fair value [src:BRK-10K-FY2025#pK-72]; a price-free return test could be added (for example after-tax earnings of the non-insurance segments ÷ the capital the segments employ), to be decided once the basis for segment capital has been verified from the 10-K."
  - "Verify the concepts Berkshire actually uses in XBRL: that the share count is in Class A equivalent shares with no dilutive securities (BRK-Q2, BRK-Q3), the capital expenditure tag (BRK-Q4), and whether US Treasury bills fall under ShortTermInvestments (BRK-Q14); where they cannot be retrieved, change the test's data to filing_text."
  - "Constructs awaiting confirmation by the spec: BRK-Q8 puts consecutive on an all_of node, whose meaning the SPEC does not define; geico_policies_in_force_yoy is defined in place in two tests, BRK-Q5 and BRK-Q10, and could be registered in spec/metrics.yml."
  - "Warren Buffett's shares were about 13.7% of Berkshire's economic interest at the 2026-03-04 record date [src:BRK-DEF14A-2026-03-13#p5] [src:BRK-DEF14A-2026-03-13#p11]. On 2026-07-14 he converted 8,000 Class A shares and gave the resulting 12 million Class B shares away, leaving 188,290 Class A shares [src:BRK-4-2026-07-15], about 13.2% on the 2026-06-30 count of 1,431,693 Class A equivalents (this archive's computation) [src:BRK-10Q-FY2026Q2#p22]. He is stepping up his lifetime gifts [src:BRK-WEB-2025-11-10-1#p5]; after his death his three children are to distribute his Berkshire holdings [src:BRK-WEB-2024-11-25-1#p1], and he has pledged that the proceeds of all his Berkshire shares will be spent on philanthropy at the latest ten years after his estate is settled [src:BRK-WEB-2026-09-27-2]. Once large sales from the estate or the foundations begin, BRK-Q13's readings must flag separately the buybacks that absorb those shares."
  - "The front-line readings (employee reviews of GEICO, BNSF and NetJets, and customer reviews of GEICO) are only a snapshot of the current period: the platforms give no history [src:BRK-RPT1-2026-09-18#p16], and the company does not disclose GEICO's renewal rate (the 10-K and the 2026 10-Qs give none) [src:BRK-10K-FY2025#pK-36] [src:BRK-10Q-FY2026Q2#p34]; this archive sets no test on them and will add one once a reproducible series exists."
  - "depends_on is empty for now. Reassessment condition written down in advance: if any single holding that belongs to an industry module already built (payments-card-networks, non-alcoholic-rtd-beverages, semiconductor-foundry) has a market value at some year-end above one-tenth of Berkshire's shareholders' equity at that year-end (read from the equity-investments note of the 10-K, the holdings table in the letter to shareholders and the balance sheet), the next update declares a dependency on that module, or states in a note why it does not."
  - "BRK-Q9: read the cost of the Alphabet position bought since 2026-01-01 from the cost tables of the letter for 2026 (early 2027); if Alphabet is not listed there, the cost stays undisclosed and the reading undetermined."
