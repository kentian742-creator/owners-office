    note: "报告第十节破坏信号 #1。条件一旦成立，低成本护城河已失，正常化承保利润要下调到 30 亿美元以下，按报告算式四每年税后少约 37 亿美元、占经营利润的 8%–9% [src:BRK-RPT1-2026-09-18#p14]。报告没有给出 2025 年全年的保单数同比：若它为负，最早在 FY2026 年报就可能失败，否则最早是 FY2027 年报；待回填（见 todo）。"

