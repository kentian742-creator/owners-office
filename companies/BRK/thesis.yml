  - id: BRK-S2
    type: staleness
    claim: The management judgement goes no more than four quarters without review
    origin: template:stalwart
    severity: watch
    covers: [management]
    pillar: P4
    section: management
    max_age_quarters: 4
    effective_from: FY2026Q3
