  - "The first branch of BRK-Q7 (the year-end cash breaker line) and the second branch of BRK-Q8 (the breaker line on the quarter-end price against book value) both need a period-end price, and under §H4 the thresholds and readings of both lines are recorded only in the private valuation file; but hard rule 2 says price is used only for alerts when a value range is crossed, and the private repository holds only one reference price; the original idea of “the private side reads the period-end price and the public side records only the result” itself goes beyond hard rule 2. A possible approach: rewrite the two conditions as price lines computed from filings (for BRK-Q7, cash and Treasury bills ÷ Class A equivalent shares ÷ the ratio threshold registered in the private valuation file; for BRK-Q8, quarter-end book value per Class A share × the multiple threshold registered in the private valuation file), have the private side's range alerts record only whether the period-end price is below these two lines, and have the public side read only the “below or not” status. This amounts to widening the uses allowed by hard rule 2 and needs a decision record by HQ; if HQ considers the rule to be set by the owner, the owner must confirm as well. Until this is settled, both branches are recorded as undeterminable, and the price-free readings come from BRK-Q13 and BRK-Q14."
  - "The report does not define “deployed” for BRK-Q7; this archive counts cash paid for acquisitions plus net stock purchases, excluding buybacks and capital expenditure; to be reviewed at the next update."
