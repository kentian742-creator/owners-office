tests:
  # ---------- 林奇 stalwart 模板（三条定量指标与 L-guidance 由本档案替换，理由见各条 note）+ 次类 asset_play 的每股账面与闲置现金 ----------
  - id: BRK-Q1
    type: quantitative
    claim: 需要经营能力的非保险利润仍在增长，增长没有滑出稳定增长型的区间
    origin: manual
    severity: watch
    covers: [growth]
    pillar: P6
    metric_def:
      id: non_insurance_operating_earnings_yoy
      description: 非保险经营业务（BNSF、BHE、制造／服务／零售三块）税后经营利润之和的滚动四季度同比增速；公司分部口径，剔除投资损益与减值
      unit: "%"
      frequency: quarter
      data: filing_text
      where: 10-Q／10-K 的 MD&A 中按分部列示的税后利润表（BNSF、BHE、Manufacturing、Service and retailing 各行）
      formula: sum_4q(bnsf + bhe + msr)_t / sum_4q(bnsf + bhe + msr)_{t-4q} - 1
    fail_if: 连续 4 个季度低于 5%
    rule: {op: "<", threshold: 5, unit: "%", consecutive: 4, period: quarter}
    warn_if: 连续 2 个季度低于 8%
    warn_rule: {op: "<", threshold: 8, unit: "%", consecutive: 2, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline:
      value: 5.8
      unit: "%"
      period: FY2025
      as_of: 2025-12-31
      source: BRK-RPT1-2026-09-18#p3
      note: "本档案按两处带出处的读数计算，报告与股东信都没有直接给出：2025 年三块税后经营利润约为 BNSF 55 亿、BHE 40 亿、制造／服务／零售 136 亿美元，合计约 231 亿美元 [src:BRK-RPT1-2026-09-18#p3]；2024 年分别为 5,031、3,730、13,072 百万美元，合计 21,833 百万美元 [src:BRK-LTR-2024#p5]。股东信的 Other controlled businesses 一行对应报告的制造／服务／零售，Non-controlled businesses 与 Other 两行对应报告的“其他” [src:BRK-LTR-2024#p5] [src:BRK-RPT1-2026-09-18#p3]。报告的 2025 年数字四舍五入到 1 亿美元，同比读数因此约在 5.1%–6.5% 之间，这里取中间值 [src:BRK-RPT1-2026-09-18#p3] [src:BRK-LTR-2024#p5]；待从 FY2025 年报取精确数复算（见 todo）。"
    note: "替代模板 stalwart 的 Q-growth（revenue_yoy）：伯克希尔约 2,150 亿美元的制造／服务／零售收入里包括卡车休息站、食品分销与汽车经销 [src:BRK-RPT1-2026-09-18#p3]，收入规模说明不了利润；保险保费又会在软市场里主动缩量，报告认为那是纪律而不是失去客户 [src:BRK-RPT1-2026-09-18#p6]。收入增速因此说明不了生意在变好还是变坏。改看需要经营能力的三块非保险利润，门槛沿用模板默认值。承保与保险投资收益各有专门的测试：承保由 BRK-Q6、BRK-Q10 跟踪，保险投资收益由 BRK-Q12 跟踪。"

