    note: "替代模板 stalwart 的 Q-returns（roic）：伯克希尔约三分之二的价值按市价计量 [src:BRK-RPT1-2026-09-18#p2]，以“权益加有息负债减现金”为分母的投入资本回报，会把国库券与股票组合的收益率混进经营业务的回报里，衡量不出资本回报。改用次类资产富裕型模板的每股账面测试，门槛沿用模板默认值。每股账面含股票市值波动 [src:BRK-RPT1-2026-09-18#p11]，所以只看连续两年的方向。计算按 A 股等价股数（报告口径）[src:BRK-RPT1-2026-09-18#p4]，XBRL 概念待核实（见 todo）。"

