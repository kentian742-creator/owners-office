# BRK thesis file (public; thesis-ci spec §4; schema: spec/schemas/thesis.schema.json)
# How it was built: first the Lynch stalwart template and the _common staleness tests. Three quantitative metrics and one
# qualitative question of the template that mean nothing for Berkshire (Q-growth, Q-returns, Q-fcf, L-guidance) were
# replaced by this archive with equivalent tests, for the reasons given in each test's note; the template README only says
# that thresholds may be rewritten, not that metrics may be replaced, so whether replacement is allowed, and how origin is
# recorded, awaits confirmation by the spec or HQ (see todo). Of these, the book-value-per-share test is borrowed from the
# template of the secondary category, asset_play, and that category's idle-cash test is taken over as it is. Then the thesis
# breakers of section 10 of the 02 report (severity: breaker) and its quarterly watch indicators (severity: watch) were
# added one by one, and last the two watch tests this archive added on the basis of sections 7 and 12 of the report
# (BRK-Q16, BRK-L5).
# Thresholds follow the report's own words; where the report gives no threshold or basis, the test's note states the
# operationalisation this archive wrote down in advance.
# Everything to do with price (the reference price, ranges, expected returns, the grade on price, and readings derived from
# price such as "share of market value") is only in the private repository, in
# owners-office-private/companies/BRK/valuation.yml.
schema_version: "0.2"
company: BRK
name: Berkshire Hathaway Inc.
exchange: NYSE
status: holding
filer:
  cik: "0001067983"
  type: domestic
  fiscal_year_end: "12-31"
  annual_form: 10-K
category: stalwart
category_secondary: asset_play
category_rationale: "Large and steady, making its money through durability: from 2015 to 2025, after-tax operating earnings on the company's basis grew from $17.4 billion (net earnings of $24,083 million less $6,725 million of investment and derivative gains, this archive's computation) [src:BRK-10K-FY2015#p32] to $44.5 billion [src:BRK-LTR-2025#p8] [src:BRK-10K-FY2025#pK-34], and book value per Class A share from $155,501 [src:BRK-10K-FY2015#p31] to $498,823 ($717,419 million over 1,438,223 Class A equivalent shares, this archive's computation) [src:BRK-10K-FY2025#pK-67] [src:BRK-10K-FY2025#pK-102]; the risks are growth quietly slowing and expensive capital deployment made for the sake of growth, exactly the two things the stalwart template watches. The secondary category is asset play: at 2026-06-30 it held $364.7 billion of cash, cash equivalents and Treasury bills (consolidated and net of unsettled Treasury bill purchases, this archive's sum in F2) and a $323.8 billion equity portfolio [src:BRK-10Q-FY2026Q2#p2]; the key is whether these assets are preserved and deployed at an adequate return."
domain: insurance_conglomerate
# No industry dependency is declared: American Express and Coca-Cola are both among the five largest holdings of the equity
# portfolio at 2026-06-30 (BRK-10Q-FY2026Q2, Note 4) and at 2025-12-31, but the report treats the whole equity portfolio as
# one sensitivity line in the valuation, and the thesis pillars (the cost of float, the operating businesses, the
# deployment of cash) do not depend on the industry economics of card networks or ready-to-drink beverages.
# The trigger for reassessing this is written down in advance in the last todo item (a single holding's year-end market
# value as a share of shareholders' equity).
depends_on: []
trust_level: 1
as_of: 2026-09-24

# Last review dates of the archive's twelve parts and of the supplementary list munger = the date of the 02 report (the
# report has all twelve sections, and the Munger matrix is in section 6; the footer prints only the month, so the reading
# cut-off date on the cover is used, see todo)
reviewed:
  business: 2026-09-18
  economics: 2026-09-18
  moat: 2026-09-18
  capital_allocation: 2026-09-18
  management: 2026-09-18
  culture: 2026-09-18
  runway: 2026-09-18
  valuation: 2026-09-18
  bear_case: 2026-09-18
  monitoring: 2026-09-18
  thesis: 2026-09-18
  breakers: 2026-09-18
  munger: 2026-09-18

# Ratings from section 1 of the report: the business row is on PDF page 2 and the management, capital allocation and
# culture rows are on page 3, so source is written as p2-p3; the row on price is only in the private repository
ratings:
  business: A
  management: A−
  capital_allocation: B+
  culture: A
  source: BRK-RPT1-2026-09-18#p2-p3

thesis:
  summary: "Berkshire pools the premiums its insurance customers pay in advance and the earnings of its operating subsidiaries at headquarters, which allocates them centrally [src:BRK-10K-FY2025#pK-1] [src:BRK-LTR-2025#p11]: float was about $177.5 billion at 2026-06-30 [src:BRK-10Q-FY2026Q2#p38], and the combined ratio of the property and casualty businesses was 87.1% in 2025, retroactive reinsurance excluded [src:BRK-LTR-2025#p9]. After-tax operating earnings on the company's basis were $44.5 billion in 2025: underwriting $7.3 billion, insurance investment income $12.5 billion, BNSF $5.5 billion, BHE $4.0 billion, manufacturing, service and retailing $13.6 billion, and $1.6 billion of other items (investment income not allocated to the operating businesses, equity-method earnings, foreign-exchange results on non-dollar debt, goodwill impairments and acquisition accounting) [src:BRK-10K-FY2025#pK-34] [src:BRK-10K-FY2025#pK-54]. Today's problem is not that this machine will break, but that $364.7 billion of cash, cash equivalents and Treasury bills at 2026-06-30 (more than the $323.8 billion equity portfolio) [src:BRK-10Q-FY2026Q2#p2] earns only a Treasury-bill yield: 13-week bills yielded about 3.8% at 2026-06-30 and 4.2% at 2026-09-24 [src:UST-BILLRATES-2026-09-24]. The thesis stands on two legs: underwriting continues not to lose money, and the new CEO can turn cash into productive assets with high enough returns in a downturn; the latter is the point with the thinnest evidence in the whole judgement [src:BRK-RPT1-2026-09-18#p16]."
  pillars:
    - id: P1
      claim: "If underwriting does not lose money, float is negative-cost money with no maturity date, no covenants and no risk of a run: float was about $177.5 billion at 2026-06-30 [src:BRK-10Q-FY2026Q2#p38], and underwriting has been profitable in each of the past three years (pre-tax underwriting earnings of $6,913 million, $11,405 million and $9,460 million in 2023–2025) [src:BRK-10K-FY2025#pK-35]; the report holds that the 1967 decision that produced today's shape, the purchase of National Indemnity [src:BRK-LTR-2025#p1], rests on the premise that underwriting does not lose money, and once that condition fails, float turns from negative-cost into positive-cost money and what remains is an ordinary conglomerate that holds a lot of securities [src:BRK-RPT1-2026-09-18#p4]."
      source: BRK-RPT1-2026-09-18#p4
    - id: P2
      claim: "GEICO's low-cost direct selling is still a moat: the current loss of share and the rising combined ratio can still be reversed, along the path of “stabilise retention first, policies in force recover first, the combined ratio falls afterwards” (the problem lies in people and processes), rather than the adverse-selection spiral in which competitors with finer risk segmentation pick off the low-risk customers and GEICO can only raise prices again and again; the report warns that catching up on pricing technology alone will not stop that spiral [src:BRK-RPT1-2026-09-18#p7] [src:BRK-RPT1-2026-09-18#p9]. Of the four moats it is the only one that hard data show weakening [src:BRK-RPT1-2026-09-18#p6]: GEICO's combined ratio was 89.3% in the first half of 2026 against 81.7% a year earlier [src:BRK-10Q-FY2026Q2#p34]; its policies in force grew about 2% in the year to 2026-03-31, as the CEO said at the annual meeting of 2026-05-02 (third-party accounts, not in any filing) [src:BRK-RPT1-2026-09-18#p8] [src:BRK-NEWS-2026-05-04-CARRIERMANAGEMENT], against 10.9% for Progressive's personal auto policies in force (9% for all its personal lines policies) [src:PGR-10Q-FY2026Q1#p23] [src:PGR-10Q-FY2026Q1#p33]. The loss of share is inferred from this relative growth, not from a disclosed market share."
      source: BRK-RPT1-2026-09-18#p7
    - id: P3
      claim: "Cash is an option, not a drag: the $364.7 billion of cash and Treasury bills held at 2026-06-30 [src:BRK-10Q-FY2026Q2#p2] will be put into productive assets returning 8% a year or more, in a downturn or on privately negotiated terms, rather than earning only coupon interest for years [src:BRK-RPT1-2026-09-18#p11]; of four downturns, only one is a clean example of cash being swapped on a large scale for other companies' equity, which makes this the pillar with the thinnest evidence in the whole judgement [src:BRK-RPT1-2026-09-18#p16]."
      source: BRK-RPT1-2026-09-18#p16
    - id: P4
      claim: "Berkshire's shareholder constraints carry over to the new CEO, though they are of different ages [src:BRK-RPT1-2026-09-18#p8] [src:BRK-RPT1-2026-09-18#p14]: no cash dividend has been paid since the only one, on 1967-01-03, and the board reviews the policy every year [src:BRK-LTR-2024#p6] [src:BRK-LTR-2025#p7]; the principle of issuing shares only for as much business value as is received was set down in 1983 [src:BRK-WEB-2026-09-27-1#p1] [src:BRK-WEB-2026-09-27-1#p3], and the 1993 purchase of Dexter Shoe, paid in Berkshire stock, is the mistake Buffett called his most gruesome [src:BRK-LTR-2014#p26]; buying back shares only below intrinsic value, conservatively determined, is the rule as amended on 2018-07-17 (in 2015 the limit was a 20% premium over book value) [src:BRK-8K-2018-07-19] [src:BRK-10K-FY2015#p30]; and Berkshire sets no allocated goals or targets for its non-insurance businesses [src:BRK-LTR-2025#p11]. Abel resumed buybacks on 2026-03-04, after none from June 2024 through February 2026 [src:BRK-8K-2026-03-05] [src:BRK-10Q-FY2024Q2#p49] [src:BRK-10Q-FY2026Q1#p46], and repurchased $4.76 billion at cost in the first half of 2026 [src:BRK-10Q-FY2026Q2#p3] [src:BRK-10Q-FY2026Q2#p48], at an average of about $486 per Class B equivalent share, 1.40 times book value per Class B share at 2026-06-30 (this archive's computation, see BRK-Q8) [src:BRK-10Q-FY2026Q2#p51] [src:BRK-10Q-FY2026Q2#p22]."
      source: BRK-RPT1-2026-09-18#p14
    - id: P5
      claim: "The regulated subsidiaries are insulated from the parent: Berkshire does not guarantee the borrowings of BHE, BNSF or their subsidiaries and has no other financial commitments to them [src:BRK-10K-FY2025#pK-71] [src:BRK-10Q-FY2026Q2#p20], so the parent's economic loss from the PacifiCorp wildfires is limited to its equity in PacifiCorp (this archive's reading, not a disclosed cap) [src:BRK-RPT1-2026-09-18#p8]. Berkshire has put money into its energy group before, as equity rather than a guarantee: in October 2020 Berkshire subsidiaries bought $3.75 billion of BHE's 4.00% perpetual preferred stock to fund the GT&S and Q-Pipe gas pipeline acquisitions, and the last $481 million was redeemed in February 2025 [src:BHE-10K-FY2020#p190] [src:BHE-10K-FY2025#p194]; it has not funded PacifiCorp directly. At 2026-06-30 cumulative wildfire loss accruals were $2,853 million and payments $2,281 million, with no new accrual in the first half [src:BHE-10Q-FY2026Q2#p25] [src:BHE-10K-FY2025#p190]."
      source: BRK-RPT1-2026-09-18#p8
    - id: P6
      claim: "The 51 non-insurance operating businesses (the count in the 2025 letter) keep producing profit and cash without layers of management or goals set by headquarters [src:BRK-LTR-2025#p11]: in 2025 after-tax earnings were $5.5 billion at BNSF, $4.0 billion at BHE and $13.6 billion in manufacturing, service and retailing [src:BRK-10K-FY2025#pK-34], and the group's operating cash flow was $46 billion [src:BRK-LTR-2025#p9]; BHE's data-centre capital expenditure is a new growth runway, but management has set conditions on it: infrastructure built for hyperscalers and data centres must be paid for by those customers, and growth will not come at the expense of affordability or reliability for households, small businesses and industrial users [src:BRK-LTR-2025#p12] [src:BRK-LTR-2025#p13]; the report reads this as no increase in existing customers' electricity rates [src:BRK-RPT1-2026-09-18#p6]."
      source: BRK-RPT1-2026-09-18#p3
  # Munger inversion list: how a permanent loss could happen (taken from the bear case in section 7 of the report and from
  # “where it is most likely wrong” in section 12)
  permanent_loss_paths:
    - "Doing too much: speeding up and loosening price discipline to prove itself [src:BRK-RPT1-2026-09-18#p11]; if the $364.7 billion of cash and Treasury bills held at 2026-06-30 [src:BRK-10Q-FY2026Q2#p2] is deployed at returns of 7%–8%, Berkshire permanently becomes a middling-return conglomerate [src:BRK-RPT1-2026-09-18#p10]; insurance acquisitions are especially dangerous, because what is bought is the seller's estimate of future claims: General Re, bought in December 1998 for about $22 billion in Berkshire stock [src:BRK-10K-FY1998#p34], lost $1,184 million, $1,254 million and $3,671 million on underwriting before tax in 1999–2001 (all of Berkshire's insurance lost $4,067 million in 2001) [src:BRK-10K-FY2001#p20] [src:BRK-10K-FY2001#p18]."
    - "Doing too little: if, in the next systemic downturn without a policy backstop, it still mainly lends and buys back its own shares rather than swapping cash on a large scale for other companies' equity, the money earns only Treasury-bill interest for years [src:BRK-RPT1-2026-09-18#p16]; for the owner, that is an opportunity cost that does not come back."
    - "Underwriting reversal: if the consolidated combined ratio stays above 100% for a long time [src:BRK-RPT1-2026-09-18#p14], float turns from negative-cost into positive-cost money and the leverage advantage disappears [src:BRK-RPT1-2026-09-18#p4]; the pricing of catastrophe and very large single risks is still led by one person, Ajit Jain, Vice Chairman – Insurance Operations, 74 at the 2026 proxy statement, who oversees the assessment and pricing of many of the largest and most complex risks [src:BRK-DEF14A-2026-03-13#p4]; the 2025 letter credits him and the team he built [src:BRK-LTR-2025#p9], and no filing has named a successor [src:BRK-10K-FY2025#pK-25] [src:BRK-DEF14A-2026-03-13#p5]."
    - "GEICO caught in an adverse-selection spiral: competitors with finer risk segmentation pick off the low-risk customers, the average risk of the customers left behind rises, GEICO can only raise prices again, and the price rises drive away more good customers [src:BRK-RPT1-2026-09-18#p7]; if GEICO's combined ratio goes from 89.3% (first half of 2026, against 81.7% a year earlier, and 91.2% in the second quarter) [src:BRK-10Q-FY2026Q2#p34] to 100%, after-tax earnings fall by about $3.7 billion a year, about 8%–9% of 2025 operating earnings (the report's estimate) [src:BRK-RPT1-2026-09-18#p7]."
    - "Risk from the regulated assets spilling over to the parent: if the Oregon Supreme Court reinstates the James class verdict, PacifiCorp says it cannot yet estimate a range of further losses [src:BHE-10Q-FY2026Q2#p26] [src:BRK-RPT1-2026-09-18#p8]; the bigger loss would be the parent guaranteeing PacifiCorp's debt or funding PacifiCorp, which it has not done (Berkshire has never guaranteed BHE's or BNSF's debt, and the $3.75 billion of BHE preferred stock its subsidiaries bought in 2020 to fund a pipeline acquisition was redeemed by February 2025) [src:BRK-10Q-FY2026Q2#p20] [src:BHE-10K-FY2020#p190] [src:BHE-10K-FY2025#p194], after which the financing costs of every regulated subsidiary and headquarters' negotiating position would all have to be repriced [src:BRK-RPT1-2026-09-18#p14]."

