    note: "替代模板 stalwart 的 Q-fcf（fcf_conversion，自由现金流除以 GAAP 净利润）：2018 年起会计准则要求把未实现投资损益计入净利润，公司从那年起改以经营利润为主口径 [src:BRK-RPT1-2026-09-18#p4]，这个比率对伯克希尔没有意义。宪法第 2 条的试金石是不断增长的自由现金流，所以改看它是否连续两年下降；模板没有这项指标的默认门槛，“连续两年下降”沿用模板一贯的两年窗口，是本档案事先写下的标准。资本开支的六成在铁路与电力 [src:BRK-RPT1-2026-09-18#p5]，BHE 数据中心的增长性开支会先压低自由现金流，这正是本条要提醒复核的地方。本条按 XBRL 机械计算，不做调整：经营现金流会随大额出售股票所缴的税款与浮存金的变动摆动，这一噪声本档案接受，失败时由复核在结论里说明是否来自这两项。"

  - id: BRK-L1
    type: qualitative
    claim: 管理层坦率、说到做到，没有悄然放弃公开过的经营承诺
    origin: manual
    severity: watch
    covers: [management]
    pillar: P4
    question: 本期年报或致股东信对 ledger.yml 登记的两条经营承诺——BRK-M1（BNSF 在未来几年大幅改善营业利润率）与 BRK-M2（GEICO 在保持承保纪律的前提下恢复客户留存）——是否撤回、淡化或不再提及，且没有说明原因？“淡化”指不再给出同样可以核对的表述，例如去掉“大幅改善”“恢复留存”这类能落到数字上的说法、改用更笼统的措辞。
    fail_if: 是
    judge: independent_model
    evidence: required
    where: 年度致股东信（10-K 附件）与 10-K 的 MD&A
    lookback: 2
    judge_notes:
      - 只判定题中列出的两条承诺，清单封闭；本期文件里的其他承诺或表态不在本题之内。
      - 年会问答不是申报文件，不作判定依据。
    effective_from: FY2026Q3
    first_readable: 2027-02
    baseline:
      value: 2025 年致股东信称 BNSF 与业内最优者的营业利润率差距仍然过大，若未来几年没有大幅改善会感到失望；同一封信承认 GEICO 的提价恢复了利润率，但以留存下降为代价，恢复留存需要时间
      source: BRK-LTR-2025#p12
      note: "GEICO 的表述见 [src:BRK-LTR-2025#p10]；BNSF 2025 年营业利润率 34.5%，2024 年为 32.0% [src:BRK-LTR-2025#p12]。两条承诺都已登记进 ledger.yml（BRK-M1、BRK-M2），由账本按期结算。"
    note: "替代模板 stalwart 的 L-guidance：伯克希尔不给业绩指引、不开季度电话会 [src:BRK-RPT1-2026-09-18#p3]，没有中期财务目标可以下调；等价的检验是公开说过的经营承诺有没有“悄然消失”（言行账本的第四档）。问题只列账本里登记的两条；新增承诺先登记进 ledger.yml，再改本题。报告把现任 CEO 在年会上主动把 GEICO 保单数 +2% 与对手 +11% 并列、把 BNSF 的利润率排在六家一级铁路第五，看作成本最高、最难伪装的坦率信号 [src:BRK-RPT1-2026-09-18#p8]；年会问答不是申报文件，只作背景。"

  # ---------- 报告第十节：论点破坏信号（任何一条成立，本报告的论点作废） ----------
  - id: BRK-Q5
    type: quantitative
    claim: GEICO 的低成本直销护城河还在：保单数没有持续萎缩，同时承保没有亏损
