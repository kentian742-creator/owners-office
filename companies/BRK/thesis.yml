thesis:
  summary: "Berkshire pools the premiums its insurance customers pay in advance and the earnings of its operating subsidiaries at headquarters, which allocates them centrally: on 2026-06-30 it had $177.5 billion of float, and the group's 2025 property-casualty combined ratio was 87.1% (excluding retroactive reinsurance) [src:BRK-RPT1-2026-09-18#p3]. After-tax operating earnings on the company's basis were $44.5 billion in 2025: underwriting $7.3 billion, insurance investment income $12.5 billion, BNSF $5.5 billion, BHE $4.0 billion, manufacturing/service/retailing $13.6 billion, and the remaining $1.6 billion other items such as parent-company interest, foreign exchange and the equity method [src:BRK-RPT1-2026-09-18#p3]. Today's problem is not that this machine will break, but that $364.7 billion of cash and Treasury bills (more than the $323.8 billion equity portfolio) earns only a Treasury-bill yield of about 4% [src:BRK-RPT1-2026-09-18#p1] [src:BRK-RPT1-2026-09-18#p3]. The thesis stands on two legs: underwriting continues not to lose money, and the new CEO can turn cash into productive assets with high enough returns in a downturn; the latter is the point with the thinnest evidence in the whole judgement [src:BRK-RPT1-2026-09-18#p16]."
  pillars:
    - id: P1
      claim: "If underwriting does not lose money, float is negative-cost money with no maturity date, no covenants and no risk of a run: float was $177.5 billion on 2026-06-30, and underwriting has been profitable in each of the past three years [src:BRK-RPT1-2026-09-18#p3]; the report holds that the 1967 decision that produced today's shape rests on the premise that underwriting does not lose money, and once that condition fails, float turns from negative-cost into positive-cost money and what remains is an ordinary conglomerate that holds a lot of securities [src:BRK-RPT1-2026-09-18#p4]."
      source: BRK-RPT1-2026-09-18#p4
    - id: P2
      claim: "GEICO's low-cost direct selling is still a moat: the current loss of share and the rising combined ratio can still be reversed, along the path of “stabilise retention first, policies in force recover first, the combined ratio falls afterwards” (the problem lies in people and processes), rather than the adverse-selection spiral in which competitors with finer risk segmentation pick off the low-risk customers and GEICO can only raise prices again and again; the report warns that catching up on pricing technology alone will not stop that spiral [src:BRK-RPT1-2026-09-18#p7] [src:BRK-RPT1-2026-09-18#p9]. Of the four moats it is the only one that hard data show weakening: policies in force at +2% year on year in Q1 2026 (Progressive +11%), and a first-half combined ratio of 89.3% (81.7% a year earlier) [src:BRK-RPT1-2026-09-18#p6]."
      source: BRK-RPT1-2026-09-18#p7
    - id: P3
      claim: "Cash is an option, not a drag: the $364.7 billion of cash and Treasury bills will be put into productive assets returning 8% a year or more, in a downturn or on privately negotiated terms, rather than earning only coupon interest for years [src:BRK-RPT1-2026-09-18#p11]; of four downturns, only one is a clean example of cash being swapped on a large scale for other companies' equity, which makes this the pillar with the thinnest evidence in the whole judgement [src:BRK-RPT1-2026-09-18#p16]."
      source: BRK-RPT1-2026-09-18#p16
    - id: P4
      claim: "The constraints Berkshire has long kept carry over to the new CEO: buy back shares only when the price is below a conservative estimate of intrinsic value; pay no cash dividend; in share-for-share deals, give away no more intrinsic value than is received; headquarters sets no performance targets for subsidiaries [src:BRK-RPT1-2026-09-18#p8] [src:BRK-RPT1-2026-09-18#p14]; the dividend constraint has not been broken since the one and only dividend, in 1967 [src:BRK-LTR-2024#p6]. Abel resumed buybacks after taking over, repurchasing $4.76 billion in the first half of 2026 [src:BRK-RPT1-2026-09-18#p8], at an average price of about 1.40 times book value [src:BRK-RPT1-2026-09-18#p14]."
      source: BRK-RPT1-2026-09-18#p14
    - id: P5
      claim: "The regulated subsidiaries are insulated from the parent: Berkshire does not guarantee the borrowings of BHE, BNSF or their subsidiaries, and the parent's economic loss from the PacifiCorp wildfires is capped at its equity in PacifiCorp [src:BRK-RPT1-2026-09-18#p8]; as of 2026-06-30, cumulative wildfire loss accruals were $2.853 billion and payments $2.281 billion, with no increase in the first half [src:BRK-RPT1-2026-09-18#p8]."
      source: BRK-RPT1-2026-09-18#p8
    - id: P6
      claim: "The 51 non-insurance operating businesses keep producing profit and cash without being managed by headquarters: in 2025 after-tax operating earnings were about $5.5 billion at BNSF, $4.0 billion at BHE and $13.6 billion in manufacturing/service/retailing [src:BRK-RPT1-2026-09-18#p3], and the group's operating cash flow was $46 billion [src:BRK-LTR-2025#p9]; BHE's data-centre capital expenditure is a new growth runway, but management has drawn hard constraints around it, such as hyperscale customers bearing the costs and no increase in existing customers' electricity rates [src:BRK-RPT1-2026-09-18#p6]."
      source: BRK-RPT1-2026-09-18#p3
  # Munger inversion list: how a permanent loss could happen (taken from the bear case in section 7 of the report and from
  # “where it is most likely wrong” in section 12)
  permanent_loss_paths:
    - "Doing too much: speeding up and loosening price discipline to prove itself [src:BRK-RPT1-2026-09-18#p11]; if the $364.7 billion of cash is deployed at returns of 7%–8%, Berkshire permanently becomes a middling-return conglomerate [src:BRK-RPT1-2026-09-18#p10]; insurance acquisitions are especially dangerous, because what is bought is the seller's estimate of future claims: the $22 billion all-stock acquisition of 1998 was followed by three straight years of underwriting losses, with a pre-tax underwriting loss of $3.671 billion in 2001 [src:BRK-RPT1-2026-09-18#p10]."
    - "Doing too little: if, in the next systemic downturn without a policy backstop, it still mainly lends and buys back its own shares rather than swapping cash on a large scale for other companies' equity, the money earns only Treasury-bill interest for years [src:BRK-RPT1-2026-09-18#p16]; for the owner, that is an opportunity cost that does not come back."
    - "Underwriting reversal: if the consolidated combined ratio stays above 100% for a long time [src:BRK-RPT1-2026-09-18#p14], float turns from negative-cost into positive-cost money and the leverage advantage disappears [src:BRK-RPT1-2026-09-18#p4]; the pricing of catastrophe and very large single risks also still rests on one 75-year-old vice chairman of insurance operations, and succession arrangements have not been disclosed [src:BRK-RPT1-2026-09-18#p10]."
    - "GEICO caught in an adverse-selection spiral: competitors with finer risk segmentation pick off the low-risk customers, the average risk of the customers left behind rises, GEICO can only raise prices again, and the price rises drive away more good customers [src:BRK-RPT1-2026-09-18#p7]; if GEICO's combined ratio goes from 89.3% to 100%, after-tax earnings fall by about $3.7 billion a year, about 8%–9% of 2025 operating earnings [src:BRK-RPT1-2026-09-18#p7]."
    - "Risk from the regulated assets spilling over to the parent: if the original PacifiCorp wildfire verdict is reinstated, no amount can yet be put on the worst case [src:BRK-RPT1-2026-09-18#p8]; the bigger loss would be the parent breaking precedent to put money into a regulated subsidiary, after which the financing costs of every regulated subsidiary and headquarters' negotiating position would all have to be repriced [src:BRK-RPT1-2026-09-18#p14]."

