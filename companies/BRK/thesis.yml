  - "Replacing template tests (BRK-Q1 for Q-growth, BRK-Q2 for Q-returns, BRK-Q4 for Q-fcf, BRK-L1 for L-guidance) was this archive's own choice: the template README only says that thresholds may be rewritten, not that metrics may be replaced. Whether replacement is allowed, and whether a replacement's origin is recorded as manual or template:stalwart (when the category changes, the template tests are found through origin), awaits confirmation by the spec or HQ; for now this archive follows the AXP and PDD archives, recording manual and stating in the note which test is replaced."
