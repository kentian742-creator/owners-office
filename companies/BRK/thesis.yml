    note: "照搬次类资产富裕型模板的 Q-cash-drag，门槛沿用模板默认值。它是破坏信号 BRK-Q7 的不含价格的对照：BRK-Q7 的分母是市值，公开流水线读不到价格；本条的分母是总资产，可以直接从 10-K 读出，所以在 BRK-Q7 无法判定期间，现金是否在堆积由本条与 BRK-Q13 给出读数。保险集团的总资产里有大量对应浮存金的投资资产，模板门槛是否适合伯克希尔，待总资产读数回填后复核一次，复核结论与日期写进本条 note，保持事先登记。伯克希尔在资产负债表上单列美国国库券，XBRL 里未必落在 ShortTermInvestments 概念下，取不到时把 data 改为 filing_text（见 todo）。"

  - id: BRK-Q3
