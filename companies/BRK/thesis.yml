    note: "门槛沿用模板默认值。伯克希尔没有股权激励，公司表示不以股票支付员工 [src:BRK-RPT1-2026-09-18#p8]，所以股数只会因回购减少、因以股支付收购增加；历史上三次大额以股支付里有两次被管理层自认是大错 [src:BRK-RPT1-2026-09-18#p9]。以股换股是否“发出的内在价值多于换回的”，由破坏信号 BRK-L3 判定。"

  - id: BRK-Q4
    type: quantitative
    claim: 自由现金流在增长，而不是被资本开支持续吞掉
