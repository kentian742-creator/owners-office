  - id: WMT-Q4
    type: quantitative
    claim: Profit turns into cash
    origin: template:stalwart
    severity: watch
    covers: [free_cash_flow]
    pillar: P4
    effective_from: FY2027Q3
    metric: fcf_conversion
    fail_if: below 60% for 2 consecutive years
    rule: {op: "<", threshold: 60, unit: "%", consecutive: 2, period: year}
    warn_if: below 70% for 2 consecutive years
    warn_rule: {op: "<", threshold: 70, unit: "%", consecutive: 2, period: year}
    data: xbrl
    baseline:
      value: 68
      unit: "%"
      period: FY2026
      source: WMT-10K-FY2026#Item8
      note: "FCF 14.923 / net income attributable to Walmart 21.893 ($bn) [src:WMT-10K-FY2026#Item7] [src:WMT-10K-FY2026#Item8]."
    note: "Template fail level moved to the warn level and a lower fail level added. FY2025 (12.660 / 19.436 = 65.1%) and FY2026 (68%) are both already below 70% [src:WMT-10K-FY2026#Item8] [src:WMT-10K-FY2026#Item7], because capital expenditure rose to 3.77% of net sales in FY2026 [src:WMT-10K-FY2026#Item8] and is guided to about 4.0% for FY2027 [src:WMT-8K-2026-08-20#EX-99.1]; a fail level at the template's threshold would only restate a known reading, while the warn keeps it in view and the fail catches deterioration beyond it. Net income includes fair-value changes of equity investments from FY2019 [src:WMT-10K-FY2019#p56], which can move the ratio without any change in cash. Over FY2017–FY2026 cumulative FCF was 116% of cumulative net income attributable to Walmart [src:WMT-10K-FY2019#CF] [src:WMT-10K-FY2019#IS] [src:WMT-10K-FY2021#CF] [src:WMT-10K-FY2021#IS] [src:WMT-10K-FY2023#CF] [src:WMT-10K-FY2023#IS] [src:WMT-10K-FY2025#CF] [src:WMT-10K-FY2025#IS] [src:WMT-10K-FY2026#Item8]."

  - id: WMT-L1
    type: qualitative
    claim: Management has not lowered the financial targets it published
    origin: template:stalwart
    severity: watch
    covers: [management]
    pillar: P3
    effective_from: FY2027Q3
    question: >-
      Walmart's annual report for the fiscal year ended 2026-01-31 states an objective of growing operating income
      faster than net sales [src:WMT-10K-FY2026#Item7]. On 2026-08-20 Walmart stated full-year FY2027 guidance of
      constant-currency net sales growth of 4.0%–5.0% and constant-currency adjusted operating income growth of
      7.0%–8.5%, raised from 3.5%–4.5% and 6%–8% given on 2026-02-19, and capital expenditure of about 4.0% of net sales
      [src:WMT-8K-2026-08-20#EX-99.1]. In the documents for this period and the three before it, did management lower or
      withdraw any of these published financial targets, or any later full-year or multi-year financial target that
      replaced them?
    fail_if: Yes, without giving new, testable targets at the same time
    judge: independent_model
    evidence: required
    where:
      - "Walmart earnings press releases (Form 8-K, Exhibit 99.1) for this period and the three before it"
      - "Walmart 10-Q Item 2 and 10-K Item 7 for the same periods"
    lookback: 4
    judge_notes:
      - "A target counts as lowered if the low end or the high end of a stated range is reduced, or if a stated objective that appeared in an earlier document is dropped without a replacement."
      - "A change in currency assumptions that leaves the constant-currency ranges unchanged is not a lowering."
      - "Replacing a completed fiscal year's guidance with guidance for the next fiscal year is not a withdrawal."
      - "A raise in capital expenditure guidance is not a lowering of a financial target."
    note: >-
      Guards P3, the claim that higher-margin income lifts operating income faster than sales. Earnings call transcripts
      are not yet available to the pipeline, so targets stated only on calls are not judged.

