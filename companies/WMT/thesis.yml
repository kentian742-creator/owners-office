  - id: WMT-Q13
    type: quantitative
    claim: The after-tax return on invested capital stays in its healthy range
    origin: archive:watch
    severity: watch
    covers: [returns_on_capital]
    pillar: P4
    effective_from: FY2027Q3
    metric_def:
      id: roic_after_tax_lease_adjusted
      description: >-
        After-tax return on invested capital: operating income × (1 − provision for income taxes ÷ income before income
        taxes), divided by the average of opening and closing invested capital, where invested capital = total
        shareholders' equity + short-term borrowings + long-term debt including the current portion + finance lease
        obligations (current and long-term) + operating lease obligations (current and long-term) − cash and cash
        equivalents.
      unit: "%"
      frequency: year
      data: filing_text
      formula: operating_income * (1 - income_tax / pretax_income) / avg(equity + short_term_borrowings + long_term_debt + finance_lease_obligations + operating_lease_obligations - cash)
      where: 10-K consolidated statements of income and balance sheets; debt note (Note 5); lease note (Note 6)
    fail_if: below 12.5% for a fiscal year
    rule: {op: "<", threshold: 12.5, unit: "%", consecutive: 1, period: year}
    warn_if: below 13.5% for a fiscal year
    warn_rule: {op: "<", threshold: 13.5, unit: "%", consecutive: 1, period: year}
    data: filing_text
    baseline:
      value: 14.5
      unit: "%"
      period: FY2026
      source: WMT-10K-FY2026#Item8
      note: "Inputs as in WMT-Q6 [src:WMT-10K-FY2026#Item8] [src:WMT-10K-FY2026#Note5] [src:WMT-10K-FY2026#Note6] [src:WMT-10K-FY2025#BS]."
    note: >-
      The company's own ROI is read beside it as a reported figure, not tested, because its numerator adds back
      depreciation, amortization and rent: 15.1% in FY2026 [src:WMT-10K-FY2026#Item7] and 15.4% for the twelve months
      to 2026-07-31 [src:WMT-10Q-FY2027Q2#Item2]. FY2018 (11.8%), FY2019 (11.0%) and FY2020 (11.3%) would also have failed [src:WMT-10K-FY2018#BS]
      [src:WMT-10K-FY2019#IS] [src:WMT-10K-FY2019#BS] [src:WMT-10K-FY2021#IS] [src:WMT-10K-FY2021#BS]. Operating lease
      obligations appear on the balance sheet only from the FY2020 year-end, so on this definition those readings would
      be lower still. FY2021 (10.8%) and FY2023 (10.1%) would have failed, both on tax rates
      inflated by items below operating income [src:WMT-10K-FY2021#Item7] [src:WMT-10K-FY2023#p41]. The FY2027 reading
      is raised by about $2.9bn of tariff refunds [src:WMT-10Q-FY2027Q2#Note5] and states the refund amount beside the
      reported figure.

