      description: Walmart U.S. calendar comparable sales including fuel, fiscal year, as stated by the company
      unit: "%"
      frequency: year
      data: filing_text
      where: 10-K Item 7 'Growth' comparable sales table (Walmart U.S., with fuel)
    fail_if: negative in each of two consecutive fiscal years
    rule: {op: "<", threshold: 0, unit: "%", consecutive: 2, period: year}
    data: filing_text
    baseline:
      value: 4.3
      unit: "%"
      period: FY2026
      source: WMT-10K-FY2026#Item7

  - id: WMT-Q8
    type: quantitative
    claim: Free cash flow covers the dividend over a three-year span
    origin: archive:breaker
    severity: breaker
    covers: [free_cash_flow, capital_allocation, balance_sheet]
    pillar: P4
    effective_from: FY2027Q3
    metric_def:
      id: fcf_to_dividends_3y
      description: >-
        Cumulative free cash flow (net cash provided by operating activities − payments for property and equipment) over
        three consecutive fiscal years ÷ cumulative dividends paid over the same three years. A reading below 1.0 means
        cumulative free cash flow fell below cumulative dividends paid.
      unit: x
      frequency: year
      data: xbrl
      xbrl: [us-gaap:NetCashProvidedByUsedInOperatingActivities, us-gaap:PaymentsToAcquirePropertyPlantAndEquipment, us-gaap:PaymentsOfDividendsCommonStock, us-gaap:PaymentsOfDividends]
      formula: sum_3y(operating_cash_flow - capex) / sum_3y(dividends)
    fail_if: cumulative FCF below cumulative dividends paid over any three consecutive fiscal years (ratio below 1.0)
    rule: {op: "<", threshold: 1.0, unit: x, consecutive: 1, period: year}
    data: xbrl
    baseline:
      value: 2.10
      unit: x
      period: FY2024-FY2026
      source: WMT-10K-FY2026#Item8
      note: "Cumulative FCF 15.120 + 12.660 + 14.923 = 42.703 over dividends paid 6.140 + 6.688 + 7.507 = 20.335 ($bn) [src:WMT-10K-FY2025#CF] [src:WMT-10K-FY2026#Item8] [src:WMT-10K-FY2026#Item7]."
    note: Decided from the 10-K consolidated statements of cash flows; the ratio form is equivalent to the dossier's statement of the breaker.

