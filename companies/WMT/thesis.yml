      value: 3.77
      unit: "%"
      period: FY2026
      source: WMT-10K-FY2026#Item8
      note: "26.642 / 706.413 ($bn) [src:WMT-10K-FY2026#Item8]."
    note: FY2027 guidance was raised on 2026-08-20 from about 3.5% to about 4.0% of net sales [src:WMT-8K-2026-08-20#EX-99.1].

  - id: WMT-Q15
    type: quantitative
    claim: Shareholder returns are funded by free cash flow, not by borrowing
    origin: archive:watch
    severity: watch
    covers: [capital_allocation, free_cash_flow, balance_sheet]
    pillar: P4
    effective_from: FY2027Q3
    metric_def:
      id: shareholder_return_to_fcf_3y
      description: >-
        (Dividends paid + share repurchases) over three consecutive fiscal years ÷ cumulative free cash flow (net cash
        provided by operating activities − payments for property and equipment) over the same three years
      unit: "%"
      frequency: year
      data: xbrl
      xbrl: [us-gaap:PaymentsOfDividendsCommonStock, us-gaap:PaymentsOfDividends, us-gaap:PaymentsForRepurchaseOfCommonStock, us-gaap:NetCashProvidedByUsedInOperatingActivities, us-gaap:PaymentsToAcquirePropertyPlantAndEquipment]
      formula: (sum_3y(dividends) + sum_3y(buybacks)) / sum_3y(operating_cash_flow - capex)
    fail_if: above 120% (three fiscal years rolling)
    rule: {op: ">", threshold: 120, unit: "%", consecutive: 1, period: year}
    warn_if: above 100% (three fiscal years rolling)
    warn_rule: {op: ">", threshold: 100, unit: "%", consecutive: 1, period: year}
    data: xbrl
    baseline:
      value: 83.6
      unit: "%"
      period: FY2024-FY2026
      source: WMT-10K-FY2026#Item8
      note: "Dividends paid plus repurchases 35.696 over cumulative FCF 42.703 ($bn) [src:WMT-10K-FY2025#CF] [src:WMT-10K-FY2026#Item8] [src:WMT-10K-FY2026#Item7]."
    note: >-
      FY2022–FY2024 (107.1%) would have warned [src:WMT-10K-FY2023#CF] [src:WMT-10K-FY2025#CF]. In FY2027 H1 dividends
      and repurchases of $9.049bn were 164% of FCF of $5.529bn, with the gap funded by new borrowing
      [src:WMT-10Q-FY2027Q2#Item1].

