thesis:
  summary: >-
    Walmart's U.S. stores, distribution network and purchasing volume give it a cost-to-serve advantage in grocery-led
    mass retail that lets it hold its price gap and still earn a Walmart U.S. segment margin of 5.2% in FY2025 and FY2026
    [src:WMT-10K-FY2026#Item7], with inventory more than fully funded by suppliers (accounts payable $63.1bn against
    inventories $58.9bn at 2026-01-31) [src:WMT-10K-FY2026#Item8]. The same stores have become the fulfillment network
    for U.S. online retail, and the traffic they carry is now sold as advertising and membership, income lines that can
    lift operating income faster than sales. Owning it is a bet that capital expenditure, which rose from an average of
    2.07% of total revenues in FY2017–FY2019 to 3.47% in FY2024–FY2026 [src:WMT-10K-FY2019#IS] [src:WMT-10K-FY2019#CF]
    [src:WMT-10K-FY2025#IS] [src:WMT-10K-FY2025#CF] [src:WMT-10K-FY2026#Item8], converts into higher free cash flow per
    share, which it has not yet done: free cash flow per diluted share averaged $2.08 in FY2017–FY2019 and $1.76 in
    FY2024–FY2026 [src:WMT-10K-FY2019#IS] [src:WMT-10K-FY2019#CF] [src:WMT-10K-FY2021#IS] [src:WMT-10K-FY2021#CF]
    [src:WMT-10K-FY2025#p58] [src:WMT-10K-FY2026#Item8]. The case fails if the U.S. margin or the after-tax return on
    invested capital (14.5% in FY2026, computed from [src:WMT-10K-FY2026#Item8] [src:WMT-10K-FY2026#Note5]
    [src:WMT-10K-FY2026#Note6] [src:WMT-10K-FY2025#BS]) falls materially, or if free cash flow cannot cover the dividend.
  pillars:
    - id: P1
      claim: >-
        The U.S. cost advantage holds: the Walmart U.S. segment margin stays at or above 5% (5.2% in FY2026, 5.0% in
        FY2024) and Walmart U.S. comparable sales stay positive (4.3% in FY2026) [src:WMT-10K-FY2026#Item7].
      source: WMT-10K-FY2026#Item7
    - id: P2
      claim: >-
        Stores serve as the fulfillment network for online orders: eCommerce keeps growing with improving economics;
        eCommerce net sales were 21.3% of FY2026 net sales and grew 24.4% over FY2025 [src:WMT-10K-FY2026#Note11],
        while eCommerce profit or loss is not disclosed.
      source: WMT-10K-FY2026#Note11
    - id: P3
      claim: >-
        Higher-margin income (advertising, membership, marketplace) lifts consolidated operating income above the band
        of 3.3%–4.7% of total revenues it held in FY2017–FY2026 [src:WMT-10K-FY2019#IS] [src:WMT-10K-FY2025#IS]
        [src:WMT-10K-FY2026#Item8]; membership fee revenue rose from $3.1bn in FY2024 to $4.4bn in FY2026
        [src:WMT-10K-FY2026#Note1].
      source: WMT-10K-FY2026#Note1
    - id: P4
      claim: >-
        The capital expenditure earns at least the current return, an after-tax return on invested capital of about 14%
        or more (14.5% in FY2026, computed from [src:WMT-10K-FY2026#Item8] [src:WMT-10K-FY2026#Note5]
        [src:WMT-10K-FY2026#Note6] [src:WMT-10K-FY2025#BS]), and free cash flow per share resumes growth.
      source: WMT-10K-FY2026#Item8
  permanent_loss_paths:
    - >-
      The capex program does not earn its return: capital expenditure stays near the guided 4.0% of net sales
      [src:WMT-8K-2026-08-20#EX-99.1] while the operating margin stays inside the band of 3.3%–4.7% of total revenues of
      FY2017–FY2026 [src:WMT-10K-FY2019#IS] [src:WMT-10K-FY2025#IS] [src:WMT-10K-FY2026#Item8], so free cash flow per
      share keeps falling, as it did from an average of $2.08 in FY2017–FY2019 to $1.76 in FY2024–FY2026
      [src:WMT-10K-FY2019#CF] [src:WMT-10K-FY2021#CF] [src:WMT-10K-FY2025#p58] [src:WMT-10K-FY2026#Item8].
    - >-
      Costs outrun a thin margin: wages, associate healthcare, self-insured liability claims, pharmacy price regulation
      and tariffs act on an operating margin of 4.2% of FY2026 net sales [src:WMT-10K-FY2026#Item7], where one point of
      gross margin equals about 24% of FY2026 operating income [src:WMT-10K-FY2026#Item8]; operating expenses already grew
      faster than net sales in FY2025, FY2026 and the first half of FY2027 [src:WMT-10K-FY2026#Item7]
      [src:WMT-10Q-FY2027Q2#Item2].
    - >-
      AI-enabled and agentic shopping platforms take over product search, discovery and purchasing, which the company
      names as a risk to traffic in its stores and clubs [src:WMT-10K-FY2026#Item1A], removing the traffic on which
      advertising and membership income depend.
    - >-
      Regulators restrict the supplier terms that fund inventory (accounts payable 107% of inventories at 2026-01-31)
      [src:WMT-10K-FY2026#Item8], building on the 2024-12 Mexican competition ruling on supplier contributions and the
      pending final order of the Competition Commission of India against Flipkart subsidiaries [src:WMT-10Q-FY2027Q2#Note5].
    - >-
      Capital is misallocated without outside correction: Walmart International earned segment operating income equal to
      5.9% of its FY2026 year-end segment assets, which include $23.6bn of goodwill [src:WMT-10K-FY2026#Note11]
      [src:WMT-10K-FY2026#Note1]; dividends and repurchases exceeded free cash flow in the first half of FY2027, with the
      gap funded by new borrowing [src:WMT-10Q-FY2027Q2#Item1]; and one family vehicle votes 44.11% of the shares
      [src:WMT-DEF14A-2026-04-23#p98].
tests:
  # ---------- Template tests (stalwart, plus _common) ----------
  - id: WMT-Q1
    type: quantitative
    claim: Growth has not slipped out of the range of Walmart's own record
    origin: template:stalwart
    severity: watch
    covers: [growth]
    pillar: P1
    effective_from: FY2027Q3
    metric: revenue_yoy
    fail_if: below 2% for 4 consecutive quarters
    rule: {op: "<", threshold: 2, unit: "%", consecutive: 4, period: quarter}
    warn_if: below 3% for 2 consecutive quarters
    warn_rule: {op: "<", threshold: 3, unit: "%", consecutive: 2, period: quarter}
    data: xbrl
    baseline:
      value: 4.7
      unit: "%"
      period: FY2026
      source: WMT-10K-FY2026#Item8
      note: "Annual total revenues 713.163 / 680.985 − 1 [src:WMT-10K-FY2026#Item8]; quarterly readings are taken by the pipeline."
    note: "Template thresholds rewritten. Reported total revenue growth was below 5% in five of the nine fiscal years FY2018–FY2026: 3.0%, 2.8%, 1.9%, 2.4% and 4.7% in FY2018, FY2019, FY2020, FY2022 and FY2026, computed from total revenues of 485.873, 500.343, 514.405, 523.964, 559.151, 572.754, 680.985 and 713.163 ($bn) [src:WMT-10K-FY2019#IS] [src:WMT-10K-FY2021#IS] [src:WMT-10K-FY2023#IS] [src:WMT-10K-FY2025#IS] [src:WMT-10K-FY2026#Item8], so the template would flag ordinary years. The new fail level sits below every annual reading of FY2018–FY2026 except FY2020 (1.9%), which followed the sale of 80% of Walmart Brazil in FY2019 [src:WMT-10K-FY2021#Item7]. It sits above all four readings of FY2014–FY2017: 1.6% in FY2014, 2.0% in FY2015 (1.96%), −0.7% in FY2016 and 0.8% in FY2017, when currency reduced net sales by $11.0bn (2.3%) [src:WMT-10K-FY2018#Item6] [src:WMT-10K-FY2018#Item7]. Readings are reported, including currency and portfolio changes; International operations other than Canada are consolidated with a one-month lag [src:WMT-10K-FY2026#Note1]. A breach in a period affected by a divestiture is a basis question to be handled under §G3."

  - id: WMT-Q2
    type: quantitative
    claim: Return on invested capital (registry basis) holds at the level of an excellent business
    origin: template:stalwart
    severity: watch
    covers: [returns_on_capital, moat]
    pillar: P4
    effective_from: FY2027Q3
    metric: roic
    fail_if: below 12% for 2 consecutive years
    rule: {op: "<", threshold: 12, unit: "%", consecutive: 2, period: year}
    data: xbrl
    note: >-
      Kept from the template as an automatic cross-check of WMT-Q6 and WMT-Q13. The registry measure (equity + debt −
      cash) leaves out finance and operating lease obligations, which were 6.761 and 15.572 ($bn) at 2026-01-31
      [src:WMT-10K-FY2026#Note6], so it reads higher than the lease-inclusive measure the thesis rests on. No baseline on
      the registry basis was computed in this run.

  - id: WMT-Q3
    type: quantitative
    claim: Buybacks really shrink the share count instead of offsetting stock-based compensation
    origin: template:stalwart
    severity: watch
    covers: [capital_allocation]
    pillar: P4
    effective_from: FY2027Q3
    metric: diluted_shares_yoy
    fail_if: above 0 for 2 consecutive years
    rule: {op: ">", threshold: 0, unit: "%", consecutive: 2, period: year}
    data: xbrl
    baseline:
      value: -0.7
      unit: "%"
      period: FY2026
      source: WMT-10K-FY2026#Item8
      note: "Weighted-average diluted shares 8,022m in FY2026 against 8,081m in FY2025 [src:WMT-10K-FY2026#Item8]."
    note: >-
      Diluted shares fell 14.1% from FY2017 (9,336m, converted from 3,112m as filed) to FY2026 (8,022m)
