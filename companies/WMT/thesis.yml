  # ---------- Thesis breakers (dossier part 12) ----------
  - id: WMT-Q5
    type: quantitative
    claim: The Walmart U.S. cost advantage still earns a viable segment margin
    origin: archive:breaker
    severity: breaker
    covers: [moat, pricing_power, unit_economics]
    pillar: P1
    effective_from: FY2027Q3
    metric: segment_operating_margin
    params: {segment: "Walmart U.S.", basis: "company-stated segment operating income ÷ segment net sales, 10-K Item 7 'Walmart U.S. Segment' table"}
    fail_if: below 4.0% in each of two consecutive fiscal years
    rule: {op: "<", threshold: 4.0, unit: "%", consecutive: 2, period: year}
    data: filing_text
    baseline:
      value: 5.2
      unit: "%"
      period: FY2026
      source: WMT-10K-FY2026#Item7
    note: >-
      Read on the segment allocation basis in force for the year read; Walmart changed how it allocates certain corporate
      overhead to segments from 2026-02 and revised prior periods [src:WMT-10Q-FY2027Q2#Note6]. FY2027 includes about
      $2.9bn of tariff refunds recorded as a reduction of cost of sales, primarily in Walmart U.S.
      [src:WMT-10Q-FY2027Q2#Note5]; the FY2027 reading states the refund amount beside the reported figure.

  - id: WMT-Q6
    type: quantitative
    claim: The capital base still earns an acceptable after-tax return
    origin: archive:breaker
    severity: breaker
    covers: [returns_on_capital, capital_allocation]
    pillar: P4
    effective_from: FY2027Q3
    metric_def:
      id: roic_after_tax_lease_adjusted
      description: >-
        After-tax return on invested capital: operating income × (1 − provision for income taxes ÷ income before income
        taxes), divided by the average of opening and closing invested capital, where invested capital = total
        shareholders' equity + short-term borrowings + long-term debt including the current portion + finance lease
        obligations (current and long-term) + operating lease obligations (current and long-term) − cash and cash
        equivalents.
      unit: "%"
      frequency: year
      data: filing_text
      formula: operating_income * (1 - income_tax / pretax_income) / avg(equity + short_term_borrowings + long_term_debt + finance_lease_obligations + operating_lease_obligations - cash)
      where: 10-K consolidated statements of income and balance sheets; debt note (Note 5); lease note (Note 6)
    fail_if: below 11.0% in each of two consecutive fiscal years
    rule: {op: "<", threshold: 11.0, unit: "%", consecutive: 2, period: year}
    data: filing_text
    baseline:
      value: 14.5
      unit: "%"
      period: FY2026
      source: WMT-10K-FY2026#Item8
      note: "NOPAT 29.825 × (1 − 7.199 / 29.469) = 22.539 over average invested capital (148.498 + 162.255) / 2 = 155.377 ($bn) [src:WMT-10K-FY2026#Item8] [src:WMT-10K-FY2026#Note5] [src:WMT-10K-FY2026#Note6] [src:WMT-10K-FY2025#BS]."
    note: "In the record, FY2021 (10.8%) and FY2023 (10.1%) were depressed by effective tax rates of 33.3% and 33.6% inflated by items below operating income, and FY2023 operating income carried $4.1bn of legal and restructuring charges [src:WMT-10K-FY2021#IS] [src:WMT-10K-FY2021#BS] [src:WMT-10K-FY2023#IS] [src:WMT-10K-FY2023#BS] [src:WMT-10K-FY2023#p40]; no two consecutive years have been below the fail level. The FY2027 reading is raised by about $2.9bn of tariff refunds [src:WMT-10Q-FY2027Q2#Note5] and states the refund amount beside the reported figure."

  - id: WMT-Q7
    type: quantitative
    claim: Walmart U.S. keeps growing its comparable business
    origin: archive:breaker
    severity: breaker
    covers: [moat, growth, competition]
    pillar: P1
    effective_from: FY2027Q3
    metric_def:
