    pillar: P1
    falsifies_thesis: false
    reference: "This company's own record. Ratings non-transaction revenue grew 9.5% in 1H26 and 7.6% in FY2026Q2, $593 million against $551 million (this computation) [src:SPGI-10Q-FY2026Q2#p48]. It fell 1.9% in the 2022 issuance drought [src:SPGI-10K-FY2022#p49]. Starting point 0.75 (judgment), from the 2026 run-rate. Lowered to 0.7 for two reasons: growth slowed from the first half to Q2, and part of the growth comes from RES activity [src:SPGI-10Q-FY2026Q2#p48], which is transaction-linked by nature (judgment) and would weaken if issuance turns down."
