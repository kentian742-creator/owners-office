  - tag: NAIC-BRIEF-2026-03
    kind: other
    title: "National Association of Insurance Commissioners, How Insurance Regulators Ensure Insurers Have Enough Money to Pay Claims: Leveraging Credit Ratings for Regulatory Use (issue brief, March 2026)"
    date: null
    url: https://content.naic.org/sites/default/files/svo-discretion-issue-brief.pdf
    primary: true
    note: "Dated March 2026 (no day given). “The NAIC cannot unilaterally reject or override a rating” (#p1); the review process: the SVO Credit Committee may place a filing-exempt security under review, and if its own designation differs from the filing-exempt one by at least three notches the SVO may ask for the rating's removal from filing exemption, which an investment review group of regulators decides; the SVO will publish an anonymized summary within 45 days of each removal, and the SVO Director summarizes the year's actions at each Spring National Meeting (#p2). Read on 2026-09-27 (the NAIC site refuses scripted requests; a copy is in the workspace cache)."

