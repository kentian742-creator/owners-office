  # The three entries below are non-SEC primary sources listed in the report's appendix. Since 2026-09-27 each points to the original document read.
  # They are the starting points for judging SPGI-L2, SPGI-L4 and SPGI-L5; new documents read during a judgment are registered separately, one by one.
  - tag: NAIC-SVO-2026
    kind: other
    title: "NAIC Valuation of Securities (E) Task Force (the Securities Valuation Office is its staff), minutes of the meeting of 2025-12-10 (draft pending adoption): staff report on the filing-exemption discretion project"
    date: 2025-12-10
    url: https://content.naic.org/sites/default/files/national_meeting/27_Minutes-VOSTF_0.pdf
    primary: true
    note: "Source 24 in the report's appendix (2026, primary / secondary), which the report relies on for the power to challenge filing-exempt ratings from 2026-01-01. These minutes are the NAIC record found: NAIC staff stated that the authority granted as part of the discretion project becomes effective 2026-01-01, that the systems and data agreements needed to run the process were still being built, and that regulators make the final decision on whether a rating keeps filing-exemption eligibility (#p5, the minutes' printed page). The Task Force was replaced on 2026-01-01 by the Invested Assets (E) Task Force and its working groups. Read on 2026-09-27 (the NAIC site refuses scripted requests; a copy is in the workspace cache). The NAIC's issue brief is registered as NAIC-BRIEF-2026-03; the amendment of the Purposes and Procedures Manual itself and the NAIC analysis behind the report's “97% of 109” have not been obtained."

  - tag: ACER-LNG-2025
    kind: web
    title: "EU Agency for the Cooperation of Energy Regulators (ACER), LNG Price Assessment/Benchmarks (web page)"
    date: null
    url: https://www.acer.europa.eu/gas/lng-price-assessment
    primary: true
    note: "Source 21 in the report's appendix (2023; 2025, primary); the report relies on it for the LNG benchmark being published daily, being made permanent and being available for voluntary use without, so far, replacing Platts (the last is the report's own judgment). The page, which prints no date, says ACER has published an LNG price assessment every weekday since 2023-01-13 and an LNG benchmark since 2023-03-31, that since 2025-01-01, after Regulation (EU) 2022/2576 expired, it has collected the data under REMIT Articles 7a–7e, and that “Stakeholders may use the LNG benchmark voluntarily”. Read on 2026-09-27. The legal basis is registered as EU-REG-2024-1106."

  - tag: VANGUARD-2012-10-02
