  - tag: SEC-PR-2015-10
    kind: press_release
    title: "U.S. Securities and Exchange Commission press release 2015-10: SEC Announces Charges Against Standard & Poor's for Fraudulent Ratings Misconduct"
    date: 2015-01-21
    url: https://www.sec.gov/news/pressrelease/2015-10.html
    primary: true
    note: "S&P agreed to pay more than $58 million to settle the SEC's charges, plus $19 million to the New York ($12 million) and Massachusetts ($7 million) attorneys general; in the order on its 2011 conduit fusion CMBS methodology, in which S&P made certain admissions, it agreed to take a one-year timeout from rating conduit fusion CMBS. Read on 2026-09-27."

  - tag: SEC-PR-2022-205
    kind: press_release
    title: "U.S. Securities and Exchange Commission press release 2022-205: SEC Charges S&P Global Ratings with Conflict of Interest Violations"
    date: 2022-11-14
    url: https://www.sec.gov/newsroom/press-releases/2022-205
    primary: true
    note: "The settled order (Exchange Act Release No. 96308, Administrative Proceeding File No. 3-21240, https://www.sec.gov/files/litigation/admin/2022/34-96308.pdf) finds that in August 2017 S&P commercial employees became participants in rating a jumbo RMBS transaction, in violation of the NRSRO conflict-of-interest rules; S&P had self-reported the conduct and, without admitting or denying the findings, paid a $2.5 million penalty and agreed to a cease-and-desist order, a censure and undertakings. Read on 2026-09-27."

