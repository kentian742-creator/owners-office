# SPGI source tag table (thesis-ci spec §3; schema: spec/schemas/sources.schema.json)
# Locator convention: N in SPGI-RPT1-2026-09-18#pN is the report's physical PDF page number (matching the page markers of the text extraction; see decisions/0006).
# For 10-K and 10-Q filings #pN is the filing's printed page; an earnings release is located as #EX99.1-pN (its own page) or #EX99.1-Exh7 (its schedule "Exhibit 7").
# Added 2026-09-27 after the first fact audit (16A → 04A), under HQ rulings S1–S2: the primary documents the corrected facts rest on.
# Every EDGAR entry was checked on 2026-09-27 against its EDGAR filing index page (form, filing date, acceptance time, period of report,
# filer, CIK, items, exhibit); pages outside EDGAR were read on the dates their notes give.
sources:
  - tag: SPGI-RPT1-2026-09-18
    kind: report
    title: "Its moat was dug by regulators and third parties; this time it has to dig for itself (S&P Global complete company report, September 2026) (in Chinese)"
    date: 2026-09-18
    location: private:reports/SPGI.pdf
    primary: false
    note: The owner's 02 research report, in twelve sections plus an appendix; financial data through Q2 2026 (2026-06-30) and the fiscal 2025 annual report. The full text is kept only in the private repository; the public archive cites PDF page numbers only. Since 2026-09-27 the archive cites it only for its own views, estimates, scenarios and thresholds, and for facts that no primary document carries (labelled where used).

  - tag: SPGI-10K-FY2025
