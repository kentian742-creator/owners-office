  - tag: SPGI-CALL-FY2026Q2
    kind: transcript
    title: "S&P Global Inc. Q2 2026 earnings call of 2026-07-28, as carried by two third-party transcripts"
    date: 2026-07-28
    url: null
    primary: false
    note: "The earnings call listed as source 6 in the report's appendix. S&P posts no transcript: its event page (https://investor.spglobal.com/investor-presentations/event-details/2026/Earnings-Announcement--SP-Globals-Second-Quarter-2026-Earnings-Announcement-Conference-Call-on-July-28th/) offers only a webcast replay, which needs registration (https://events.q4inc.com/attendee/701230512). The two carriers are the Investing.com transcript (https://www.investing.com/news/transcripts/earnings-call-transcript-sp-global-q2-2026-profit-miss-weighs-on-shares-93CH-4817134, published 2026-07-28) and the Equibles transcript (https://equibles.com/stocks/spgi/calls/2026-q2), both read on 2026-09-27. They agree on the statements the archive uses: private markets ratings revenue up 60% year on year in Q2 2026; about $169 billion of first-half billed issuance from the hyperscalers against an initial full-year assumption of about $200 billion; a full-year hyperscaler assumption of $250 billion to $300 billion; asset-linked fees' fourth consecutive record quarter; second-half adjusted free cash flow of $2.9 billion to $3.1 billion excluding Mobility; and about $2 billion of additional debt in the second half to fund buybacks. They differ in wording and speaker attribution in places (Investing.com prints “build issuance” for “billed issuance”). Statements resting only on them are labelled wherever used and stay out of test baselines (HQ ruling S2; APP ruling H1)."

