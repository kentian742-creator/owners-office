    date: 2012-10-02
    url: null
    primary: true
    note: "Source 25 in the report's appendix (primary); the precedent for switching a broad-market index, used for SPGI-L4. The release is not on vanguard.com, and third-party copies are secondary, so it has not been obtained; the fund count and assets it is reported to give (22 funds, about $537 billion) are L2 only. Vanguard's own prospectus supplements filed on EDGAR the same day stand in for it (VANGUARD-497-2012-10-02 and following): each fund announced a board-approved change of target index and withheld the timing of the transition."

