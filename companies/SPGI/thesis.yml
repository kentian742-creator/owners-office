    fail_if: 净流入连续两季为负
    rule: {op: "<", threshold: 0, unit: USD, consecutive: 2, period: quarter}
    data: external
    effective_from: FY2026Q3
    first_readable: "2026-10"
    note: "报告第 11 节前瞻指标（三），读业绩幻灯片 [src:SPGI-RPT1-2026-09-18#p19]。报告没有给当期净流入读数，基线待从 2026 年二季度业绩幻灯片回填；同期资产挂钩费 +22%、连续第四个创纪录季度 [src:SPGI-RPT1-2026-09-18#p7]，被动流入的绝对量在创纪录 [src:SPGI-RPT1-2026-09-18#p16]。"

  - id: SPGI-Q9
    type: quantitative
    claim: 现金转换守在健康水平，调整后利润能变成现金
    origin: report:watch
    severity: watch
    covers: [free_cash_flow]
    pillar: P4
    metric_def:
      id: adj_fcf_to_adj_net_income
      description: 公司口径的调整后自由现金流（已扣少数股东分配）÷ 调整后净利润
      unit: "%"
      frequency: year
      data: filing_text
      where: 年度业绩新闻稿的非 GAAP 调节表（Adjusted free cash flow、Adjusted net income）
      formula: adjusted_free_cash_flow / adjusted_net_income
    fail_if: 连续两年低于 90%
    rule: {op: "<", threshold: 90, unit: "%", consecutive: 2, period: year}
    warn_if: 低于健康线 95%
    warn_rule: {op: "<", threshold: 95, unit: "%", consecutive: 1, period: year}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: "2027-02"
    baseline:
      value: 101
      unit: "%"
      period: FY2025
      as_of: 2025-12-31
      source: SPGI-RPT1-2026-09-18#p19
    note: "报告第 11 节前瞻指标（四）；健康线 95%，低于它记警告 [src:SPGI-RPT1-2026-09-18#p19]。本条是判断现金转换的主测试，用公司口径的调整后数字；模板 stalwart 的 Q-fcf 保留为 SPGI-Q13（GAAP 口径、XBRL 自动计算），作本条与 SPGI-Q5 的后备。SPGI 的 GAAP 净利润扣除了 FY2025 的 11.09 亿美元并购无形资产摊销，远低于现金盈利 [src:SPGI-RPT1-2026-09-18#p5]，所以两种口径的读数不能直接比较。FY2026 读数的口径断裂见 SPGI-Q5。"

  - id: SPGI-Q10
    type: quantitative
    claim: 每股收益的增长没有被资产负债表买单，股东返还不长期超过自由现金流
    origin: report:watch
    severity: watch
    covers: [capital_allocation, balance_sheet, governance]
    pillar: P6
    metric_def:
      id: shareholder_return_to_adj_fcf
      description: （回购 + 分红）÷ 公司口径的调整后自由现金流（已扣少数股东分配）
      unit: "%"
      frequency: year
      data: filing_text
      where: 10-K 现金流量表（回购、分红）；年度业绩新闻稿的非 GAAP 调节表（调整后自由现金流）
      formula: (buybacks + dividends) / adjusted_free_cash_flow
    fail_if: 连续两年高于 130%
    rule: {op: ">", threshold: 130, unit: "%", consecutive: 2, period: year}
    warn_if: 落在健康区间 85%–110% 之外
    warn_rule: {op: outside, threshold: [85, 110], unit: "%", consecutive: 1, period: year}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: "2027-02"
    baseline:
      value: 113
      unit: "%"
      period: FY2025
      as_of: 2025-12-31
      source: SPGI-RPT1-2026-09-18#p19
      note: "FY2025 回购 50.01 亿美元、分红 11.70 亿美元 [src:SPGI-RPT1-2026-09-18#p8]；2026 年指引隐含约 160% [src:SPGI-RPT1-2026-09-18#p19]。"
    note: "报告第 11 节前瞻指标（五）：连续两年高于 130%，意味着每股收益的增长靠资产负债表撑着 [src:SPGI-RPT1-2026-09-18#p19]；而按委托书的薪酬概述，长期激励唯一的量化指标正是调整后每股收益 [src:SPGI-RPT1-2026-09-18#p19] [src:SPGI-RPT1-2026-09-18#p9]。健康区间 85%–110%，落在区间外记警告 [src:SPGI-RPT1-2026-09-18#p19]；FY2025 读数 113% 已在区间外，建档即处于警告状态 [src:SPGI-RPT1-2026-09-18#p19]。2026 年超出自由现金流的约 32 亿美元来自出售 OSTTRA 合资权益的 15 亿美元现金、上半年处置所得 3.61 亿美元与新发债 [src:SPGI-RPT1-2026-09-18#p9]；公司自己的政策是返还调整后自由现金流的 85% 或以上 [src:SPGI-RPT1-2026-09-18#p9]。FY2026 的读数有口径断裂：全年的回购与分红按报表口径发生，而报告的约 163% 用的是分拆后的调整后自由现金流约 50 亿美元 [src:SPGI-RPT1-2026-09-18#p9]。本条在首次读数之前写定：分子分母都用报表口径，分母含 Mobility 上半年的现金流，与 SPGI-Q5 的同口径要求一致；公司只披露不含 Mobility 的 FY2026 调整后自由现金流时，FY2026 记为无法判定，连续计数从 FY2027 开始。"

  # ---------- 报告第 11 节：岔路口中标明可读时点的两条 ----------
  - id: SPGI-Q11
    type: quantitative
    claim: 指数的收费基数没有被 ETF 外壳里不需要授权的部分侵蚀
    origin: report:watch
    severity: watch
    covers: [moat, pricing_power]
    pillar: P2
    metric_def:
      id: asset_linked_fee_growth_minus_us_etf_aum_growth
      description: 指数分部资产挂钩费同比增速减去美国 ETF 总资产同比增速
      unit: pp
      frequency: quarter
      data: mixed
      formula: yoy(asset_linked_fees) - yoy(us_etf_total_assets)
      components:
        asset_linked_fees:
          description: 指数分部资产挂钩费
          unit: USD
          where: 季度业绩新闻稿附表或 10-Q 收入分解
        us_etf_total_assets:
          description: 美国 ETF 总资产
          unit: USD
          where: 行业统计（不是申报文件）
    fail_if: 资产挂钩费增速持续落后于美国 ETF 总资产增速（差值持续为负，本档案按连续 4 个季度计）
    rule: {op: "<", threshold: 0, unit: pp, consecutive: 4, period: quarter}
    data: mixed
    effective_from: FY2026Q3
    first_readable: "2026-10"
    note: "报告第 11 节岔路口 #7，每季度可读，当前偏主干 [src:SPGI-RPT1-2026-09-18#p18]；持续为负即侵蚀路径 C（ETF 外壳里不需要授权的那部分变大）的第 4 步兑现 [src:SPGI-RPT1-2026-09-18#p18] [src:SPGI-RPT1-2026-09-18#p7]。报告说这条路径真正要看的一步，就是资产挂钩费增速持续落后 ETF 行业资产增速，今天还没有出现，并为指数只留这一个季度指标 [src:SPGI-RPT1-2026-09-18#p16]。报告只写“持续为负”，没有给期数；本档案按连续 4 个季度计，是事先写下的操作化，不是报告原文门槛。当前读数只有一半：2026 年二季度资产挂钩费同比 +22% [src:SPGI-RPT1-2026-09-18#p7]，同期美国 ETF 总资产增速报告未给，差值待回填。报告对这条腿的量级估算：资产挂钩费增速连续三年落后 ETF 行业资产增速 5 个百分点，按 73% 的归属比例约合每股 −0.32 美元，约为市场情报那条的四分之一 [src:SPGI-RPT1-2026-09-18#p16]。"

  - id: SPGI-Q12
    type: quantitative
    claim: 市场情报的利润率杠杆真实存在，管理层能把它做上去
    origin: report:watch
    severity: watch
    covers: [management, unit_economics]
    pillar: P3
    metric_def:
      id: mi_adjusted_operating_margin_fy
      description: 市场情报分部全年调整后营业利润率（公司口径）
      unit: "%"
      frequency: year
      data: filing_text
      where: 第四季度业绩新闻稿附表或 10-K 分部附注中市场情报的调整后营业利润与收入
      formula: mi_adjusted_operating_profit_fy / mi_revenue_fy
    params: {segment: Market Intelligence, segment_zh: 市场情报, basis: 调整后营业利润率（公司口径）}
    fail_if: 到 FY2028，市场情报调整后营业利润率低于 35%（仍在 34% 一线，杠杆不存在）
    rule: {op: "<", threshold: 35, unit: "%", consecutive: 1, period: year, evaluate_on: [FY2028], note: 只在 FY2028 年报判定一次；此前各年只记录读数、不判定；FY2028 判定之后本条退役。}
    warn_if: 到 FY2028 介于 35% 与 38% 之间（没有“走对”，也不在 34% 一线）
    warn_rule: {op: "<", threshold: 38, unit: "%", consecutive: 1, period: year, evaluate_on: [FY2028], note: 只在 FY2028 年报判定一次；读数同时低于失败线时按失败处理。}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: "2029-02"
    baseline:
      value: 33
      unit: "%"
      period: FY2025
      as_of: 2025-12-31
      source: SPGI-RPT1-2026-09-18#p4
      note: "重铸口径；2026 年二季度为 34% [src:SPGI-RPT1-2026-09-18#p17]。"
    note: "报告第 11 节岔路口 #2：到 FY2028，34% → 38% 以上算走对，仍在 34% 一线说明杠杆不存在，当前偏平庸 [src:SPGI-RPT1-2026-09-18#p18]。本条按报告的三段来判：38% 以上通过，低于 35% 失败，两者之间记警告，其中 35% 这条线是本档案对“34% 一线”的事先操作化，报告没有给 [src:SPGI-RPT1-2026-09-18#p18]。只在 FY2028 判定一次，写在 rule 与 warn_rule 的 evaluate_on 里。指标就地定义为全年口径，因为登记表的 segment_operating_margin 是季度指标，而本条按年判定。这是集团内部最大的利润率杠杆：市场情报利润率每提高 5 个百分点约合每股 +0.62 美元，而两次重组之后仍在 34% 一线 [src:SPGI-RPT1-2026-09-18#p11] [src:SPGI-RPT1-2026-09-18#p12]。报告把管理层从“普通”移到“优秀”的条件之一，是市场情报调整后利润率在两个完整财年内升到 38% 以上 [src:SPGI-RPT1-2026-09-18#p20]。"

  # ---------- 本档案自加：永久亏损路径 #3（可信度冲击）的代理 ----------
  - id: SPGI-L7
    type: qualitative
    claim: 评级标准没有为份额让步，标普评级没有再次招来与评级标准或利益冲突有关的执法
    origin: manual
    severity: watch
    covers: [governance, regulation, culture]
    pillar: P1
    question: 本期标普的 10-Q/10-K（法律诉讼一节与承诺及或有事项附注）、任何 8-K，或美国证交会、司法部及其他评级监管机构的公告，是否在 2026-09-18 之后首次披露了针对标普全球评级的新的监管调查、执法行动、和解或业务暂停，且事由涉及评级标准或评级方法的执行、利益冲突（例如为争取业务而调整评级）或评级质量？
    fail_if: 是。只涉及记录保存或报备程序、与评级标准无关的违规不算，由公司经理记录；本期文件的法律诉讼一节没有读到时，记为无法判定
    judge: independent_model
    evidence: required
    where: 标普 10-Q/10-K 的法律诉讼一节与承诺及或有事项附注、8-K；美国证交会与司法部的执法公告；其他评级监管机构的公告
    lookback: 4
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: 报告记录的与评级标准有关的执法：2011 年它在 CMBS 评级上为争业务放宽标准并向投资者隐瞒，2015 年 1 月与证交会和解 5,800 多万美元并暂停评级一年
      source: SPGI-RPT1-2026-09-18#p10
      note: "更早的结构化融资案以约 15 亿美元和解落到利润上（2015 年司法部与各州 13.75 亿，另加州公务员退休基金 1.25 亿）[src:SPGI-RPT1-2026-09-18#p17]。"
    note: "本档案自加，对应永久亏损路径 #3（可信度冲击）与岔路口 #6（标准会不会为份额让步，不可预约、无法判定）[src:SPGI-RPT1-2026-09-18#p18]。岔路口 #6 本身没有能从申报文件回答的是非题；本条用它最早能在文件里看到的形态做代理，即与评级标准或利益冲突有关的新执法，问题与范围都在首次判定之前写下。报告把可信度冲击列为两种冲击之一：它付的是一次性现金，评级的地位没有因此被集体弃用 [src:SPGI-RPT1-2026-09-18#p17]，所以本条是 watch 而不是 breaker。报告认为今天的测试场是收入增长 60% 的私募评级，而监管刚刚拿到推翻评级的权力 [src:SPGI-RPT1-2026-09-18#p10]。"

