tests:
  # ---------- 林奇 stalwart 模板（五条全部保留：SPGI-Q1、Q2、Q3、Q13、L1） ----------
  - id: SPGI-Q1
    type: quantitative
    claim: 增长没有滑出稳定增长型的区间
    origin: template:stalwart
    severity: watch
    covers: [growth]
    pillar: P5
    metric: revenue_growth_organic_cc
    fail_if: 连续 4 个季度低于 5%
    rule: {op: "<", threshold: 5, unit: "%", consecutive: 4, period: quarter}
    warn_if: 连续 2 个季度低于 6.5%
    warn_rule: {op: "<", threshold: 6.5, unit: "%", consecutive: 2, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: 10
      unit: "%"
      period: 1H26
      as_of: 2026-06-30
      source: SPGI-RPT1-2026-09-18#p9
      note: "pro forma（不含 Mobility）有机固定汇率口径 [src:SPGI-RPT1-2026-09-18#p9]；超额完成主要来自发行量周期 [src:SPGI-RPT1-2026-09-18#p9]。"
    note: "失败线沿用模板默认值。警告线由模板的 8% 改为 6.5%：报告第 7 节的增长路径里，第 1–5 年收入增速取 6.5%、第 6–10 年取 5.0%，有意低于公司 7%–9% 的中期目标下限，理由是周期高位时定下的中期目标不该当作十年平均来用 [src:SPGI-RPT1-2026-09-18#p11]。同页的目标表把 6.5% 称作“十年平均收入增速”，与这个拆解不一致，按拆解算十年平均约 5.75% [src:SPGI-RPT1-2026-09-18#p11]；本条取第 1–5 年的 6.5% 作警告线，介于它与 7% 的目标下限之间的增速不构成对本论点的警告 [src:SPGI-RPT1-2026-09-18#p11]。指标用公司口径的有机固定汇率增速，而不是登记表的报表收入同比：收入序列在 2022 年被 IHS Markit 合并切断、2026 年又被 Mobility 分拆切断 [src:SPGI-RPT1-2026-09-18#p5]，分拆后四个季度的报表同比会混入含 Mobility 的基数。"

  - id: SPGI-Q2
    type: quantitative
    claim: 按报告口径的投入资本回报守在优秀企业的水平，2022 年为 IHS Markit 付出的价格没有变成回报的拖累
    origin: template:stalwart
    severity: watch
    covers: [returns_on_capital, capital_allocation]
    pillar: P4
    metric_def:
      id: roic_adjusted_incl_redeemable_nci
      description: 报告口径的投入资本回报 = 税后调整后营业利润 ÷ 年末投入资本；投入资本 = 股东权益 + 总债务 + 可赎回少数股东权益 − 现金；税率事先固定为 0.223、每年不变（理由见 note）
      unit: "%"
      frequency: year
      data: filing_text
      where: 年度业绩新闻稿的非 GAAP 调节表（调整后营业利润）；10-K 资产负债表（股东权益、短期与长期债务、可赎回少数股东权益、现金及现金等价物）
      formula: adjusted_operating_profit * (1 - 0.223) / (equity + total_debt + redeemable_noncontrolling_interest - cash)
    fail_if: 连续 2 年低于 12%
    rule: {op: "<", threshold: 12, unit: "%", consecutive: 2, period: year}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: "2027-02"
    baseline:
      value: 12.6
      unit: "%"
      period: FY2025
      as_of: 2025-12-31
      source: SPGI-RPT1-2026-09-18#p5
      note: "调整后营业利润 77.30 亿美元、税后 60.06 亿美元，投入资本 474.95 亿美元 = 股东权益 312.35 亿 + 总债务 130.88 亿 + 可赎回少数股东权益 49.17 亿 − 现金 17.45 亿 [src:SPGI-RPT1-2026-09-18#p5]。"
    note: "替代模板 stalwart 的 Q-returns 所用的登记表指标 roic（GAAP 营业利润、平均投入资本），门槛沿用模板默认值。理由有二：GAAP 营业利润扣除了 FY2025 的 11.09 亿美元并购无形资产摊销，报告把它当作非现金项加回 [src:SPGI-RPT1-2026-09-18#p5]；指数合资里芝加哥商品交易所持有的那 27% 以可赎回少数股东权益列示，2025 年末 49.17 亿美元，属于投入资本 [src:SPGI-RPT1-2026-09-18#p5]。所以按报告口径就地定义。这条测试量的不是生意本身的资本效率：商誉与无形资产 527.46 亿美元，等于投入资本的 111%，有形投入资本为负，读数衡量的主要是 2022 年 IHS Markit 那笔收购的对价赚回了多少 [src:SPGI-RPT1-2026-09-18#p5]；covers 因此记 capital_allocation，不记模板的 moat。税率在首次读数之前固定为 22.3%，即报告 FY2025 基线隐含的税率：调整后营业利润 77.30 亿美元、税后 60.06 亿美元 [src:SPGI-RPT1-2026-09-18#p5]。基线离 12% 的失败线只有 0.6 个百分点，税率口径足以改变结论：若改用报告在别处用的约 24.5% 实际税率，同一基线约为 12.3% [src:SPGI-RPT1-2026-09-18#p5] [src:SPGI-RPT1-2026-09-18#p13]；所以税率写死，此后每年按同一税率计算，不随当年实际税率变动。"

  - id: SPGI-Q3
    type: quantitative
    claim: 回购在真正缩减股本，而不是抵消股权激励或只追回 2022 年发行的股份
    origin: template:stalwart
    severity: watch
    covers: [capital_allocation]
    pillar: P6
    metric: diluted_shares_yoy
    fail_if: 连续 2 年大于 0
    rule: {op: ">", threshold: 0, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: "2027-02"
    note: "门槛沿用模板默认值。2022 年 IHS Markit 的对价全部以股票支付，按 0.2838 的换股比例发行 1.138 亿股 [src:SPGI-RPT1-2026-09-18#p8]；GAAP 摊薄股数从 2021 年的 2.418 亿股升到 2025 年的 3.051 亿股 [src:SPGI-RPT1-2026-09-18#p8]，2026 年二季度加权平均摊薄股数 2.955 亿股 [src:SPGI-RPT1-2026-09-18#p14]。报告没有给同比读数，基线待从 2026 年二季度 10-Q 的 XBRL 回填。2026 年回购目标超过 70 亿美元，上半年已执行 15 亿美元 [src:SPGI-RPT1-2026-09-18#p8]。"

  - id: SPGI-Q13
    type: quantitative
    claim: 利润能变成现金（GAAP 口径的后备检查）
    origin: template:stalwart
    severity: watch
    covers: [free_cash_flow]
    pillar: P4
    metric: fcf_conversion
    fail_if: 连续 2 年低于 70%
    rule: {op: "<", threshold: 70, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: "2027-02"
    note: "模板 stalwart 的 Q-fcf，门槛沿用模板默认值。它和 SPGI-Q5、SPGI-Q9 量的是同一件事，口径不同：分子是经营现金流减资本开支，分母是 GAAP 净利润，全部可以从 XBRL 直接算出，不依赖公司自己定义的“调整后”口径，也不需要调用模型，候选公司暂停模型调用时照常运行。SPGI 的 GAAP 净利润扣除了 FY2025 的 11.09 亿美元并购无形资产摊销，远低于现金盈利 [src:SPGI-RPT1-2026-09-18#p5]，所以本条读数会系统性高于 SPGI-Q5、SPGI-Q9，70% 的门槛很宽；它是后备，不替代那两条。报告没有给 GAAP 口径的读数，基线待从 FY2025 10-K 的 XBRL 回填。FY2026 的现金流含 Mobility 上半年 [src:SPGI-RPT1-2026-09-18#p5]，判定时与 SPGI-Q5 一样要求分子分母同口径，拿不到同口径数字时记为无法判定。"

  - id: SPGI-L1
    type: qualitative
    claim: 管理层没有下调已公布的中期财务目标
    origin: template:stalwart
    severity: watch
    covers: [management]
    pillar: P6
    question: 本期文件中，管理层是否下调或撤回了此前公布的中期财务目标（企业整体及评级、指数、市场情报、能源各分部的中期有机收入增长目标）？区间的上沿或下沿任一被调低即算下调。
    fail_if: 是，不论是否同时给出新的目标；只因组合变动（例如 Mobility 分拆、业务在分部之间移动）而在同口径下重述的目标不算下调
    judge: independent_model
    evidence: required
    where: 业绩 8-K 的新闻稿与附表、业绩电话会材料、投资者日材料、10-K/10-Q 的 MD&A
    lookback: 4
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: 中期有机收入增长目标：企业整体 7%–9%，指数 10%–12%，评级 6%–9%，市场情报 6%–8%，能源 6%–8%
      source: SPGI-RPT1-2026-09-18#p11
      note: "2026-07-28 分拆后把全年调整后每股收益指引重设为 17.50–17.75 美元，评级与指数分部指引各上调 [src:SPGI-RPT1-2026-09-18#p9]。"
    note: "改写了模板 stalwart 的 L-guidance 门槛。模板写的是“是，且没有同时给出可检验的新目标”：按这个写法，一次普通的下调（把目标调低、同时给出更低的新区间）会因为给出了新目标而记为通过，与 claim 不符。本条把任何下调或撤回都记为失败（watch 级），只排除纯粹因组合变动而做的同口径重述。报告第 7 节认为市场情报 6%–8% 的目标上限已高于近三年实际、按 5%–6% 处理，能源较可能落在目标区间下沿以下 [src:SPGI-RPT1-2026-09-18#p11]。本档案据此推断，若有分部目标被下调，最可能是这两个；这是本档案的推断，报告没有预测目标会被下调。"

  # ---------- 林奇 cyclical 模板（次类；Q-cycle 不适用，见文件头） ----------
  - id: SPGI-Q14
    type: quantitative
    claim: 杠杆没有在下一次发行下行之前被回购推高到危险水平
    origin: template:cyclical
    severity: watch
    covers: [balance_sheet]
    pillar: P6
    metric: net_debt_to_ebitda
    fail_if: 高于 3 倍
    rule: {op: ">", threshold: 3, unit: x, consecutive: 1, period: year}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: "2027-02"
    note: "模板 cyclical（本档案的次类）的 Q-leverage，门槛沿用模板默认值。它守的是永久亏损路径 #4 的后一半：总债务从 2021 年末约 41 亿美元升到 2025 年末 130.88 亿美元 [src:SPGI-RPT1-2026-09-18#p20]，2026 年股东返还约为分拆后调整后自由现金流的 163%，超出部分来自资产出售与新发债 [src:SPGI-RPT1-2026-09-18#p9]；而一次 2022 型发行荒会压当年利润，分母随之变小 [src:SPGI-RPT1-2026-09-18#p6]。报告没有给 EBITDA 与净负债倍数，基线待从 FY2025 10-K 的 XBRL 回填。登记表口径的债务只取 us-gaap:LongTermDebt，而 2026 年短期债务由 7.18 亿升至 25.72 亿美元 [src:SPGI-RPT1-2026-09-18#p8]；判定按登记表口径，若它不含短期借款，公司经理在读数旁另记含短期借款的倍数，门槛不变。"

  - id: SPGI-L6
    type: qualitative
    claim: 发行周期高点没有在不说明周期假设的情况下大幅追加回购
    origin: template:cyclical
    severity: watch
    covers: [capital_allocation, balance_sheet]
    pillar: P6
    question: 本期是否同时满足以下两项：（1）发行周期处于高位，即本期 SPGI-Q7 的评级计费发行额同比高于 +15%（健康区间的上沿之外）；（2）本年度公司公布的全年回购目标，或本年度已执行的回购金额，比上一年度实际回购金额高出 25% 以上？
    fail_if: 是，且同期的业绩新闻稿、业绩电话会或 10-K/10-Q 没有说明发行量下行时回购与举债怎样调整
    judge: independent_model
    evidence: required
    where: 季度业绩新闻稿与补充披露（计费发行额、回购目标）；10-Q/10-K 的现金流量表与股东回报一节；业绩电话会
    lookback: 4
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: 2026 年回购目标超过 70 亿美元、上半年已执行 15 亿美元；FY2025 回购 50.01 亿美元
      source: SPGI-RPT1-2026-09-18#p8
      note: "2026 年二季度评级计费发行额同比 +25% [src:SPGI-10Q-FY2026Q2#MD&A]。"
    note: "改写自模板 cyclical 的 L-cycle-capalloc（模板问的是利润创新高的同时是否大幅提高资本开支或回购，失败条件是管理层没有说明周期假设）。三处改写都在首次判定之前写下。一，“利润创新高”改为评级计费发行额在健康区间上沿之外：SPGI 的周期性集中在评级交易收入，报告用计费发行额判断周期位置 [src:SPGI-RPT1-2026-09-18#p15] [src:SPGI-RPT1-2026-09-18#p19]。二，资本开支不看，它只占收入 1.3% [src:SPGI-RPT1-2026-09-18#p4]。三，“大幅”由本档案定为比上一年实际回购高出 25% 以上，2026 年超过 70 亿美元的回购目标比 FY2025 实际的 50.01 亿美元约高出四成 [src:SPGI-RPT1-2026-09-18#p8]。按报告数字，两项条件建档时都已成立，二季度计费发行额同比 +25% [src:SPGI-RPT1-2026-09-18#p19]；本条是否失败，取决于管理层有没有说明发行量下行时回购与举债怎样调整。报告把在一次真正的发行量下行周期里仍按 85% 的既定比例、而不是靠举债维持回购，列为管理层从“普通”移到“优秀”的条件之一 [src:SPGI-RPT1-2026-09-18#p20]。"

  # ---------- 报告第 11 节：论点破坏者（发生即作废，按宪法 7 天内写出结论） ----------
  - id: SPGI-Q4
    type: quantitative
    claim: 市场情报的定价权没有被界面层拆走，客户没有开始按调用量而不是席位谈续约
    origin: report:breaker
    severity: breaker
    covers: [pricing_power, moat, competition]
    pillar: P3
    metric_def:
      id: mi_subscription_revenue_yoy_change
      description: 市场情报分部订阅收入（Subscription）绝对额的同比变化（与上年同季比较）
      unit: USD
      frequency: quarter
      data: filing_text
      where: 10-Q/10-K 收入附注中按分部、按收入类型的分解（Market Intelligence 的 Subscription 一行）；无分部明细时读季度补充披露
      formula: mi_subscription_t - mi_subscription_{t-4q}
      components:
        mi_subscription_plus_recurring_variable_yoy_change:
          description: 市场情报分部订阅收入与经常性可变收入（Recurring variable revenue）合计的同比变化（与上年同季比较，按季度；(mi_subscription + mi_recurring_variable)_t - (mi_subscription + mi_recurring_variable)_{t-4q}）；为负表示经常性可变收入的增加没有补上订阅收入的下滑
          unit: USD
          where: 同上，Market Intelligence 的 Subscription 与 Recurring variable revenue 两行
        mi_organic_cc_revenue_growth_fy:
          description: 市场情报分部全年有机、固定汇率收入增速（公司口径，按年）
          unit: "%"
          where: 第四季度业绩新闻稿附表中的分部有机增速（报告所引为 Exhibit 8）
    params:
      segment: Market Intelligence
      segment_zh: 市场情报
    fail_if: 市场情报的订阅收入绝对额出现下滑，而经常性可变收入没有同步补上；或（更晚但仍成立的信号）市场情报有机固定汇率收入连续两个完整财年低于 4%
    rule:
      any_of:
        - all_of:
            - {metric: mi_subscription_revenue_yoy_change, op: "<", threshold: 0, unit: USD, consecutive: 1, period: quarter}
            - {metric: mi_subscription_revenue_yoy_change.mi_subscription_plus_recurring_variable_yoy_change, op: "<", threshold: 0, unit: USD, consecutive: 1, period: quarter}
          note: 两项须在同一季度同时成立。
        - {metric: mi_subscription_revenue_yoy_change.mi_organic_cc_revenue_growth_fy, op: "<", threshold: 4, unit: "%", consecutive: 2, period: year}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: 6
      unit: "%"
      period: 1H26
      as_of: 2026-06-30
      source: SPGI-RPT1-2026-09-18#p5
      note: "这是第二支（有机固定汇率增速）的当前读数；第一支的订阅收入绝对额同比，报告没有给出，待从 2026 年二季度 10-Q 回填。席位与企业授权订阅占该分部 96.4%，该口径含按笔数计费的经常性可变收入 [src:SPGI-RPT1-2026-09-18#p4]。"
    note: "报告第 11 节论点破坏者 #1 [src:SPGI-RPT1-2026-09-18#p19]：客户改按调用量而不是按席位谈续约，最早能在报表上看到的就是订阅收入下滑、按用量计费的收入又没补上，它领先有机增速几个季度；有机固定汇率收入连续两个完整财年低于 4% 出现得更晚，但同样算数 [src:SPGI-RPT1-2026-09-18#p19]。“下滑”报告没有写比较基准，本档案按与上年同季比较，避开季节性。并购与处置会改变绝对额，第一支的比较口径在首次读数之前写定如下。公司披露市场情报订阅收入的有机或 pro forma 口径时，用该口径。只有报表口径时：比较窗口（本季与上年同季）里只有收购的照常判定，因为收购只会抬高本季读数，例如 With Intelligence 于 2025-11-25 交割并入市场情报 [src:SPGI-RPT1-2026-09-18#p9]；窗口里有涉及市场情报的处置、而公司没有披露被处置业务收入的，该季第一支记为无法判定，第二支（全年有机增速）不受影响。企业数据管理与 thinkFolio 于 2026-01-12 出售，属于市场情报 [src:SPGI-10Q-FY2026Q2#note-2]，所以 2026 年三季度至 2027 年一季度的第一支读数按这条处置规则处理（见 todo）。领先于本条的两个岔路口不单列测试：#1 计价单位之争（2027–2029 可读）与 #3 计价权的价格信号（第三方成交库里 Capital IQ Pro 中位年合同约 32.75 万美元，仅 4 份）[src:SPGI-RPT1-2026-09-18#p18]，数据来自第三方、样本极小，由公司经理在季度更新里记录。"

  - id: SPGI-Q5
    type: quantitative
    claim: 会计利润就是现金，把并购摊销加回所有者盈利的依据仍然成立
    origin: report:breaker
    severity: breaker
    covers: [free_cash_flow]
    pillar: P4
    metric_def:
      id: adj_fcf_to_adj_net_income
      description: 公司口径的调整后自由现金流（已扣少数股东分配）÷ 调整后净利润
      unit: "%"
      frequency: year
      data: filing_text
      where: 年度业绩新闻稿的非 GAAP 调节表（Adjusted free cash flow、Adjusted net income）
      formula: adjusted_free_cash_flow / adjusted_net_income
    fail_if: 调整后自由现金流连续两年低于调整后净利润的 85%
    rule: {op: "<", threshold: 85, unit: "%", consecutive: 2, period: year}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: "2027-02"
    baseline:
      value: 101
      unit: "%"
      period: FY2025
      as_of: 2025-12-31
      source: SPGI-RPT1-2026-09-18#p5
      note: "调整后自由现金流 54.81 亿美元、调整后净利润 54.41 亿美元，FY2024 为 116% [src:SPGI-RPT1-2026-09-18#p5]。"
    note: "报告第 11 节论点破坏者 #6：一旦成立，报告把并购摊销加回所有者盈利的依据失效 [src:SPGI-RPT1-2026-09-18#p19]。FY2026 的读数有口径断裂：上半年的现金流含 Mobility，而调整后净利润按不含 Mobility 的口径，报告因此把 2026 年上半年的现金转换率留空 [src:SPGI-RPT1-2026-09-18#p5]；判定时分子分母须同口径，拿不到同口径数字时记为无法判定，连续计数从下一个干净年度开始。"

  - id: SPGI-L2
    type: qualitative
    claim: 评级在私募信用里仍被监管认可：NAIC 的收紧没有扩大到标普自己的私募评级，外部私募评级整体也没有失去豁免申报的资格
    origin: report:breaker
    severity: breaker
    covers: [regulation, moat, growth]
    pillar: P1
    question: 截至本期，是否出现以下任一情况：（a）美国保险监理官协会（NAIC）证券估值办公室对豁免申报（filing exempt）私募评级的质疑或推翻已经扩大到标普出具的私募评级，且标普所占比例“显著上升”，本档案事先定为：按 NAIC 公布的分机构数字，本期标普在被质疑或推翻评级中的占比不低于标普在全部豁免申报私募评级中的占比；NAIC 没有公布后一个占比时，改为比上一次有分机构数字的读数高出 10 个百分点以上；（b）NAIC 在 2026-09-18 之后正式通过规则，使外部机构出具的私募评级整体不再被接受为豁免申报的依据（关闭整条豁免申报通道，或规定所有私募评级都改由证券估值办公室自行评估），不论涉及哪家评级机构？只增加抽查或质疑程序、不改变外部评级整体可用性的规则不算 (b)。
    fail_if: 是（(a) 或 (b) 任一成立即失败）。两支都核对过且都不成立才记为通过；本期没有核对 where 所列的 NAIC 材料，或 NAIC 没有公布 (a) 所需的分机构数字而 (b) 又不成立时，记为无法判定，不记为通过
    judge: independent_model
    evidence: required
    where: NAIC 估值证券工作组与证券估值办公室的会议材料、决议与统计（报告附录来源 24 所列材料为起点，来源标签 NAIC-SVO-2026）；标普 10-K/10-Q 的风险因素与业绩电话会；评级机构评论
    lookback: 4
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: "早先一次比对里，109 只带私募评级的私募信用证券中有 97% 的评级高于证券估值办公室自己的评估；这个比例覆盖全部私募评级，公开材料没有按机构拆分"
      source: SPGI-RPT1-2026-09-18#p8
      note: "证券估值办公室自 2026-01-01 起有权质疑并推翻豁免申报评级 [src:SPGI-RPT1-2026-09-18#p7]。2026 年二季度私募市场评级收入同比 +60%，绝对额未披露 [src:SPGI-RPT1-2026-09-18#p8]。"
    note: "报告第 11 节论点破坏者 #2 [src:SPGI-RPT1-2026-09-18#p19]：一旦成立，评级利润中来自私募市场的那部分增量就不能再假设，报告估算的私募评级归零上限情形（每股 −0.45 至 −0.90 美元）会变成基准情形 [src:SPGI-RPT1-2026-09-18#p19]。(a) 是破坏者 #2 的原文，但报告没有给“显著上升”的门槛 [src:SPGI-RPT1-2026-09-18#p19]，公开材料也没有按机构拆分 [src:SPGI-RPT1-2026-09-18#p8]；问题里的两个门槛是本档案在首次判定之前写下的操作化，待总部记入 docs/decisions/ 确认。理由是报告认为真正的读数是被推翻的是谁的评级、不是被推翻的数量：被推翻的若主要是小机构的评级，需求会向标普集中，只有标普被质疑的比例不低于它自己的份额，才说明收紧扩大到了它身上 [src:SPGI-RPT1-2026-09-18#p8] [src:SPGI-RPT1-2026-09-18#p16]。(b) 来自岔路口 #4 的另一支：报告说若整条豁免申报通道收紧、私募信用的外部评级不再被监管接受，同一个上限情形兑现 [src:SPGI-RPT1-2026-09-18#p16] [src:SPGI-RPT1-2026-09-18#p18]；破坏者 #2 的原文只写了 (a)，(b) 是本档案按同一后果并入的。岔路口 #4（2027–2029 可读）与 #6 里“私募评级中标普被质疑或推翻的比例”的读数也并入本条 [src:SPGI-RPT1-2026-09-18#p18]。"

  - id: SPGI-L3
    type: qualitative
    claim: 发行人付费模式与评级机构的自主选择没有被立法拆除
    origin: report:breaker
    severity: breaker
    covers: [regulation, moat]
    pillar: P1
    question: 截至本期，是否有任何一个主要司法辖区（本档案事先定为美国联邦、欧盟、英国）在 2026-09-18 之后正式立法，取消信用评级的发行人付费模式，或强制评级机构轮换？“正式立法”在本条指立法机关通过并颁布的法律，或监管机构依法定授权正式发布、具有约束力的最终规则，以颁布或发布日为准、不必等到生效；征求意见稿、研究报告与提案不算。适用范围须至少覆盖企业、金融机构、结构化融资或政府评级中的一整类，只针对其中个别产品的规定不算。
    fail_if: 是。本期没有核对 where 所列的立法记录与监管公告时，记为无法判定，不记为通过
    judge: independent_model
    evidence: required
    where: 美国（国会与证交会）、欧盟与英国的立法记录，以及这三地评级监管机构的最终规则与公告；标普 10-K/10-Q 的监管一节与风险因素
    lookback: 4
    judge_notes:
      - 2026-09-18 时已经存在的法律与规则属于基线，判定只看 2026-09-18 之后新颁布的法律或新发布的最终规则。
      - 名单（美国联邦、欧盟、英国）之外的辖区立法不触发本条。
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: "多德-弗兰克法要求从联邦规则中删去对评级的引用，已经执行，但市场对评级的依赖没有明显下降；关于替代发行人付费模式的研究 2013 年之后再无进展"
      source: SPGI-RPT1-2026-09-18#p7
    note: "报告第 11 节论点破坏者 #3：它会直接打掉约占集团 43% 利润的那块来源，报告把它列为可能发生、但不是基准的情形 [src:SPGI-RPT1-2026-09-18#p19]。报告原文是“正式立法”，没有列举司法辖区，也没有说监管规则算不算 [src:SPGI-RPT1-2026-09-18#p19]。问题里的辖区名单、把有约束力的最终规则也算作正式立法、以及“至少覆盖一整类评级”的范围条件，都是本档案在首次判定之前写下的操作化，不是报告原文；其中最终规则一项超出了报告字面，待总部记入 docs/decisions/ 确认。理由：报告把强制轮换列为监管者可以直接动手的方式之一 [src:SPGI-RPT1-2026-09-18#p7]，一条有约束力的最终规则对发行人和评级机构的效力与法律相同；评级收入的分类取自报告第 1 节（企业、金融机构、结构化融资、政府、Crisil 及其他）[src:SPGI-RPT1-2026-09-18#p4]。名单之外的辖区立法由公司经理在季度更新里记录；名单只能在相关事件发生之前修改。"

  - id: SPGI-L4
    type: qualitative
    claim: 标普指数仍被写进 ETF 的授权与产品，大型发行人没有把旗舰产品换到自建或第三方指数
    origin: report:breaker
    severity: breaker
    covers: [moat, pricing_power, competition]
    pillar: P2
    question: 截至本期，是否有一家规模前三的 ETF 发行人正式宣布或完成，把一只资产超过 1,000 亿美元的旗舰产品从标普道琼斯指数切换到自建指数或第三方指数？
    fail_if: 是。本期没有核对 where 所列的 ETF 发行人公告与招募说明书变更时，记为无法判定，不记为通过
    judge: independent_model
    evidence: required
    where: ETF 发行人的公告与招募说明书变更、交易所公告；标普 10-Q/10-K 与业绩电话会
    lookback: 4
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: 2026 年二季度资产挂钩费 +22%，连续第四个创纪录季度；主动型 ETF 约拿走年内流入的 35%–39%，但一只旗舰标普 500 ETF 年内净流入超过 1,240 亿美元
      source: SPGI-RPT1-2026-09-18#p7
    note: "报告第 11 节论点破坏者 #4：一旦发生，“基准被写进授权”这个前提就被证伪了 [src:SPGI-RPT1-2026-09-18#p19]。先例是 2012 年 Vanguard 把 22 只基金（约 5,370 亿美元）从 MSCI 换到 FTSE 与 CRSP、基金名字未改 [src:SPGI-RPT1-2026-09-18#p7]。报告写的是“切换”，没有区分宣布与完成 [src:SPGI-RPT1-2026-09-18#p19]；本档案把正式宣布也算作切换，这是事先写下的操作化，不是报告原文：正式宣布即表明发行人已经作出决定，等过渡完成才判定，只会让同一个结论来得更晚。先例的一手出处（报告附录来源 25）已登记为来源标签 VANGUARD-2012-10-02，原件未取得。指数名写进产品名的基金很难换指数，名字通用的宽基产品则已经换过 [src:SPGI-RPT1-2026-09-18#p7]。"

  - id: SPGI-L5
    type: qualitative
    claim: Platts 的价格评估仍是能源合约的结算参照
    origin: report:breaker
    severity: breaker
    covers: [moat, pricing_power, competition]
    pillar: P2
    question: 截至本期，是否出现以下任一情况：（a）一家主要商品交易所（本档案事先定为 CME 集团含 NYMEX、洲际交易所 ICE、新加坡交易所 SGX）正式公告，把一只旗舰能源合约（该交易所以 Platts 评估价结算的能源合约中，上一年成交量最大的三只之一）的结算价从 Platts 评估价改为交易所自有价格；（b）欧盟能源监管合作署（ACER）的 LNG 基准被写进主流合同，即上列任一交易所上市以 ACER LNG 基准结算的合约、且其任一季度成交量达到同一交易所以 Platts 评估价结算的 LNG 合约合计成交量的 25% 以上，或者 ACER、欧盟委员会已公布的统计显示欧盟 LNG 交易中以 ACER 基准定价的比例达到 25% 以上？
    fail_if: 是（(a) 或 (b) 任一成立即失败）。(b) 中统计那一条以已公布的数字为准，没有公布相关统计时按不成立处理；两支都核对过且都不成立才记为通过，本期没有核对 where 所列外部来源、或读不到判定所需的成交量时，记为无法判定，不记为通过
    judge: independent_model
    evidence: required
    where: 上列交易所的合约规则变更公告与成交量统计；ACER 的公告与市场报告（报告附录来源 21 所列材料为起点，来源标签 ACER-LNG-2025）；欧盟委员会的相关统计；标普 10-Q/10-K 与业绩电话会
    lookback: 4
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: "ACER 的 LNG 基准 2023 年起每日发布、2025 年转为常设，市场自愿采用，目前没有取代 Platts 的迹象；能源分部 2026 年二季度调整后收入只增长 3%，咨询与会议收入下滑，还受制裁影响"
      source: SPGI-RPT1-2026-09-18#p7
    note: "报告第 11 节论点破坏者 #5 [src:SPGI-RPT1-2026-09-18#p19]。Platts 写进的是行业惯例而不是法律义务，报告判断方向为“走平偏弱” [src:SPGI-RPT1-2026-09-18#p7]。“主要商品交易所”“旗舰能源合约”“主流合同”报告都没有定义 [src:SPGI-RPT1-2026-09-18#p19]；问题里的交易所名单、成交量前三的口径、两个比例门槛与“以正式公告为准”，都是本档案在首次判定之前写下的操作化，不是报告原文，待总部记入 docs/decisions/ 确认，只能在相关事件发生之前修改。改用其他价格评估机构的价格不在报告的原文之内，出现时由公司经理在季度更新里记录。"

  # ---------- 报告第 11 节：每季度跟踪的五个前瞻指标 ----------
  - id: SPGI-Q6
    type: quantitative
    claim: 市场情报的增长没有继续失速，桌面数据的定价权没有被 AI 与客户预算压缩
    origin: report:watch
    severity: watch
    covers: [growth, pricing_power, competition]
    pillar: P3
    metric: segment_revenue_yoy
    params: {segment: Market Intelligence, segment_zh: 市场情报, basis: 有机、固定汇率（公司口径）}
    fail_if: 连续两季低于 5%
    rule: {op: "<", threshold: 5, unit: "%", consecutive: 2, period: quarter}
    warn_if: 低于健康线 6%
    warn_rule: {op: "<", threshold: 6, unit: "%", consecutive: 1, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: 6
      unit: "%"
      period: 1H26
      as_of: 2026-06-30
      source: SPGI-RPT1-2026-09-18#p19
    note: "报告第 11 节前瞻指标（一），读季度财报 Exhibit 8 [src:SPGI-RPT1-2026-09-18#p19]；报告写“连续两季 <5% 触发关注”，这里记为 watch 级失败，健康线 6% 以下记警告 [src:SPGI-RPT1-2026-09-18#p19]。2026 年上半年报表口径 +7%、有机固定汇率 +6% [src:SPGI-RPT1-2026-09-18#p4]，有机固定汇率口径下是四个分部里最低 [src:SPGI-RPT1-2026-09-18#p7]；公司中期目标 6%–8%，报告按 5%–6% 处理 [src:SPGI-RPT1-2026-09-18#p11]。"

  - id: SPGI-Q7
    type: quantitative
    claim: 发行周期没有转入 2022 型的退潮
    origin: report:watch
    severity: watch
    covers: [growth]
    pillar: P5
    metric_def:
      id: ratings_billed_issuance_yoy
      description: 评级分部计费发行额（billed issuance）的季度同比增速
      unit: "%"
      frequency: quarter
      data: filing_text
      where: 10-Q/10-K 的 MD&A 中评级分部的计费发行额表（Billed Issuance Volumes）；月度数据见公司每月 15 日发布的评级计费发行额（投资者关系网站，不是申报文件）
      formula: billed_issuance_q / billed_issuance_{q-4} - 1
    fail_if: 连续两季低于 −15%
    rule: {op: "<", threshold: -15, unit: "%", consecutive: 2, period: quarter}
    warn_if: 落在健康区间 −10% 至 +15% 之外（高于上沿说明发行处在周期高位）
    warn_rule: {op: outside, threshold: [-10, 15], unit: "%", consecutive: 1, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: 25
      unit: "%"
      period: 2026Q2
      as_of: 2026-06-30
      source: SPGI-10Q-FY2026Q2#MD&A
      note: "二季度计费发行额 1.268 万亿美元、上半年 2.498 万亿美元 [src:SPGI-10Q-FY2026Q2#MD&A]；上半年约 1,690 亿美元来自超大规模云厂商 [src:SPGI-RPT1-2026-09-18#p17]，约占上半年计费发行额的 6.8%（1,690 亿 ÷ 24,980 亿）[src:SPGI-RPT1-2026-09-18#p17] [src:SPGI-10Q-FY2026Q2#MD&A]。"
    note: "报告第 11 节前瞻指标（二），公司每月 15 日发布 [src:SPGI-RPT1-2026-09-18#p19]。健康区间有上沿：高于 +15% 说明发行处在周期高位、当期盈利仍含周期位置，报告认为这个指标正是判断“评级交易收入的水平本身是否高于趋势”的办法 [src:SPGI-RPT1-2026-09-18#p15]。建档时读数 +25% 已在健康区间之外，本条处于警告状态 [src:SPGI-RPT1-2026-09-18#p19]。公司对全年超大规模云厂商发行的工作假设是 2,500 至 3,000 亿美元 [src:SPGI-RPT1-2026-09-18#p16]；报告认为真正的风险不在这批发行人的集中度本身，而在它们退潮时引发一次 2022 型的全面收缩 [src:SPGI-RPT1-2026-09-18#p17]。"

  - id: SPGI-Q8
    type: quantitative
    claim: 指数的收费基数由资金净流入而不只是价格上涨撑起
    origin: report:watch
    severity: watch
    covers: [moat, growth]
    pillar: P2
    metric_def:
      id: index_linked_etf_net_flows
      description: 与标普道琼斯指数挂钩的 ETF 资产规模变动中来自净流入的部分（剔除市场价格变动）
