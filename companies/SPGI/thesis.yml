    baseline:
      value: 33
      unit: "%"
      period: FY2025
      as_of: 2025-12-31
      source: SPGI-8KA-2026-07-06#EX99.1-p13
      note: "Recast basis, as the company rounds it (33.0%: $1,549 million of $4,690 million) [src:SPGI-8KA-2026-07-06#EX99.1-p13]. Later readings on the same basis: 34.4% in the first half of 2026 (33.0% a year earlier) and 36.0% in Q2 2026 (34.8% a year earlier), pro forma non-GAAP adjusted [src:SPGI-8K-2026-07-28#EX99.1-Exh6] [src:SPGI-WEB-2026-07-28-1#p19]."
    note: "Fork #2 in section 11 of the report: by FY2028, going from 34% to 38% or more means it is on the right track, still around 34% means the lever does not exist, and it currently leans toward mediocre [src:SPGI-RPT1-2026-09-18#p18]. The report's 34% is the first-half 2026 reading on the recast basis, 34.4% (FY2025 was 34% before the recast and 33.0% after it, and Q2 2026 alone was 36.0%) [src:SPGI-8K-2026-07-28#EX99.1-Exh6] [src:SPGI-8K-2026-02-10#EX99-Exh5] [src:SPGI-8KA-2026-07-06#EX99.1-p13]; the failure line written in fail_if stays as registered, and the FY2025 recast baseline of 33.0% sits below it [src:SPGI-8KA-2026-07-06#EX99.1-p13]. This test judges on the report's three bands: 38% or more passes, below 35% fails, and in between is a warning, where the 35% line is this archive's advance operationalization of “around 34%”, which the report does not give [src:SPGI-RPT1-2026-09-18#p18]. It is judged only once, on FY2028, as written in the evaluate_on of rule and warn_rule. The metric is defined here on a full-year basis because the registry's segment_operating_margin is a quarterly metric, while this test is judged annually. This is the largest margin lever in the group: each 5 percentage points of Market Intelligence margin is worth about +$0.62 per share, in the report's estimate [src:SPGI-RPT1-2026-09-18#p11] [src:SPGI-RPT1-2026-09-18#p12]. The margin has moved: after company-wide restructuring plans in 2024, 2025 and 2026, which charged Market Intelligence $77 million, $56 million and $15 million [src:SPGI-10K-FY2025#Note11] [src:SPGI-10Q-FY2026Q2#Note10], and the reorganization into two business lines announced on 2026-07-06 [src:SPGI-8K-2026-07-06#EX99.1], it rose 1.4 points year on year in the first half of 2026, to 34.4% [src:SPGI-8K-2026-07-28#EX99.1-Exh6]. One of the report's conditions for moving management from “ordinary” to “excellent” is Market Intelligence's adjusted margin rising to 38% or more within two full fiscal years [src:SPGI-RPT1-2026-09-18#p20]."

  # ---------- Added by this archive: a proxy for permanent-loss path #3 (a credibility shock) ----------
  - id: SPGI-L7
    type: qualitative
    claim: Rating standards have not given way to market share, and S&P's ratings draw no new enforcement related to rating standards or conflicts of interest
    origin: manual
    severity: watch
    covers: [governance, regulation, culture]
    pillar: P1
    question: Has S&P's 10-Q/10-K for this period (the legal proceedings section and the commitments and contingencies note), any 8-K, or an announcement by the SEC, the Justice Department or another ratings regulator disclosed for the first time, after 2026-09-18, a new regulatory investigation, enforcement action, settlement or business suspension concerning S&P Global Ratings, on grounds involving the application of rating standards or methodologies, conflicts of interest (for example adjusting ratings to win business) or rating quality?
    fail_if: Yes. Violations that concern only record-keeping or reporting procedures and are unrelated to rating standards do not count and are recorded by the company manager; if the legal proceedings section of this period's filings was not read, it is recorded as undeterminable
    judge: independent_model
    evidence: required
    where: The legal proceedings section and the commitments and contingencies note of S&P's 10-Q/10-K, 8-Ks; enforcement announcements by the SEC and the Justice Department; announcements by other ratings regulators
    lookback: 4
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: "Two precedents on rating standards and conflicts of interest. In January 2015, over conduit fusion CMBS it had rated in 2011 with a methodology different from the one it disclosed, S&P settled with the SEC for more than $58 million, plus $19 million with the New York and Massachusetts attorneys general, and agreed to a one-year timeout from rating conduit fusion CMBS only [src:SEC-PR-2015-10]. In November 2022 the SEC found that S&P Global Ratings violated the NRSRO conflict-of-interest rules on one jumbo RMBS rating of 2017, after S&P reported the conduct itself; S&P paid a $2.5 million penalty and was censured, without admitting or denying the findings [src:SEC-PR-2022-205]."
      source: SEC-PR-2022-205
      note: "The earlier structured-finance case ended in settlements of about $1.5 billion agreed on 2015-02-03: $1.375 billion with the Justice Department, 19 states and the District of Columbia over 2004–2007 RMBS and CDO ratings, with no findings of violations of law, and $125 million with CalPERS over three structured investment vehicles, charged to 2014 results [src:SPGI-8K-2015-02-03#Item1.01] [src:SPGI-8K-2015-02-03#Item2.02] [src:SPGI-8K-2015-02-03#Item7.01]."
    note: "Added by this archive, for permanent-loss path #3 (a credibility shock) and fork #6 (whether standards will give way to market share; no date can be set for reading it, and it cannot be judged) [src:SPGI-RPT1-2026-09-18#p18]. Fork #6 itself has no yes-or-no question that filings can answer; this test uses as a proxy the earliest form in which it can show up in documents, namely new enforcement related to rating standards or conflicts of interest, with the question and scope written down before the first judgment. The claim was restated on 2026-09-27, before the first judgment, to look forward only: as first written it said S&P's ratings had not again drawn such enforcement, which the SEC order of November 2022 contradicts; the question already looked only at matters first disclosed after 2026-09-18 and is unchanged. The report lists a credibility shock as one of two kinds of shock: what it cost was one-time cash, and the ratings' standing was not collectively abandoned because of it [src:SPGI-RPT1-2026-09-18#p17], so this test is watch, not breaker. The report considers today's testing ground to be private ratings [src:SPGI-RPT1-2026-09-18#p10], whose revenue grew 60% year on year in Q2 2026 by the company's account on the earnings call (not in the filings, carried by third-party transcripts) [src:SPGI-CALL-FY2026Q2], just as the NAIC's Securities Valuation Office has gained the power, from 2026-01-01, to challenge the ratings that let a security bypass its own review [src:NAIC-SVO-2026#p5]."

