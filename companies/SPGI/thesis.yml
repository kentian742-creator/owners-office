#   “where this is most likely wrong” (p3) and “where the evidence is thinnest” (p21), monitoring and breakers 11 monitoring list and thesis breakers, thesis 12 conclusion.
#   The report has no separate Munger inversion list or unknowns register, so munger and unknowns are not written.
