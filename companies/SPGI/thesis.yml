thesis:
  summary: "标普全球卖的是被别人写进合同、授权和监管里的参照物：评级、指数与 Platts 是一组利润率 65%–70% 的市场收费站，评级与指数用 47% 的收入贡献了 61% 的调整后营业利润 [src:SPGI-RPT1-2026-09-18#p19] [src:SPGI-RPT1-2026-09-18#p4]。它还捆着一门占收入 34%、利润率 33% 的数据订阅生意（市场情报），这门生意的定价权正被 AI 工作流的界面层质疑 [src:SPGI-RPT1-2026-09-18#p4] [src:SPGI-RPT1-2026-09-18#p7]。生意几乎不需要再投入：FY2025 资本开支只占收入 1.3%，调整后自由现金流是调整后净利润的 101% [src:SPGI-RPT1-2026-09-18#p4] [src:SPGI-RPT1-2026-09-18#p5]；护城河的每一次加宽都是监管者或第三方替它写进自己义务的，填平也不需要它同意 [src:SPGI-RPT1-2026-09-18#p2]。论点最怕三件事：客户开始按调用量而不是席位为市场情报的数据谈价，私募信贷与监管让评级失去被认可的地位，以及把纪录高位发行量带来的周期性利润当成趋势 [src:SPGI-RPT1-2026-09-18#p16]。"
  pillars:
    - id: P1
      claim: "评级的地位由监管引用与发行人付费合同固定，而不是由产品优劣决定：2026 年上半年评级非交易收入 11.83 亿美元、同比 +10%、占该分部 45%，2022 年发行荒里只 −2% [src:SPGI-RPT1-2026-09-18#p6]；三大评级机构剔除政府证券后合计占 81.5%，小机构的份额在 2023 年停止扩张 [src:SPGI-RPT1-2026-09-18#p2]。"
      source: SPGI-RPT1-2026-09-18#p6
    - id: P2
      claim: "指数与 Platts 被第三方产品和结算写进合约：指数分部 2026 年上半年收入 +18%、利润率 72%，二季度资产挂钩费 +22%、连续第四个创纪录季度 [src:SPGI-RPT1-2026-09-18#p7]；交易所按结算引用 Platts 评估价支付版税，欧盟能源监管合作署的 LNG 基准自愿使用、未见取代 Platts [src:SPGI-RPT1-2026-09-18#p5] [src:SPGI-RPT1-2026-09-18#p7]。"
      source: SPGI-RPT1-2026-09-18#p7
    - id: P3
      claim: "市场情报的定价权没有被 AI 工作流拆走：它用 34% 的收入只贡献 22% 的利润 [src:SPGI-RPT1-2026-09-18#p4]，2026 年上半年有机固定汇率增速 +6%、是四个分部里最低 [src:SPGI-RPT1-2026-09-18#p7]；公司自己把数据接进大模型接口，是主动迁移，但一次调用值多少钱至今没有披露 [src:SPGI-RPT1-2026-09-18#p11] [src:SPGI-RPT1-2026-09-18#p12]。"
      source: SPGI-RPT1-2026-09-18#p7
    - id: P4
      claim: "会计利润就是现金，生意几乎不需要再投入：FY2025 调整后自由现金流 54.81 亿美元、调整后净利润 54.41 亿美元，比值 101% [src:SPGI-RPT1-2026-09-18#p5]；资本开支只占收入 1.3% [src:SPGI-RPT1-2026-09-18#p4]，GAAP 盈利低于现金盈利的全部原因是 FY2025 的 11.09 亿美元并购无形资产摊销 [src:SPGI-RPT1-2026-09-18#p5]。"
      source: SPGI-RPT1-2026-09-18#p5
    - id: P5
      claim: "周期压的是当年利润，不是生意本身：每 1 美元收入里约 64 美分是合同性经常收入 [src:SPGI-RPT1-2026-09-18#p4]，2022 年发行荒中评级分部收入 −26%、营业利润 −36%，非交易收入只 −2% [src:SPGI-RPT1-2026-09-18#p6]；穿过周期，增长仍落在稳定增长型的区间，公司中期有机收入目标 7%–9% [src:SPGI-RPT1-2026-09-18#p11]。"
      source: SPGI-RPT1-2026-09-18#p6
    - id: P6
      claim: "管理层的资本配置至少不毁坏价值：分拆与组合修剪方向正确、按时兑现 [src:SPGI-RPT1-2026-09-18#p9]；回购在缩减 2022 年全股票并购发行的 1.138 亿股 [src:SPGI-RPT1-2026-09-18#p8]。论点需要的是股东返还今后回到报告给的健康区间、不再靠新发债撑着，而今天的读数还不支持这一点：报告的健康区间是调整后自由现金流的 85%–110% [src:SPGI-RPT1-2026-09-18#p19]，公司自己的政策只写返还 85% 或以上，FY2025 实际为 113% [src:SPGI-RPT1-2026-09-18#p9] [src:SPGI-RPT1-2026-09-18#p8]，2026 年约为分拆后调整后自由现金流的 163%，超出部分来自资产出售与新发债 [src:SPGI-RPT1-2026-09-18#p9]；报告对“股东回报是否被新发债或增发抵消”这条标准的读数是被抵消 [src:SPGI-RPT1-2026-09-18#p20]。这一条由 SPGI-Q3、SPGI-Q10、SPGI-Q14 与 SPGI-L6 守护。"
      source: SPGI-RPT1-2026-09-18#p9
  # 芒格反向清单：怎样会永久亏损（取自报告第 9 节“不买它的最强理由”、第 3 节的侵蚀路径与“证据最薄的地方”）
  permanent_loss_paths:
    - "市场情报被拆价：AI 代理与工作流让客户不再在意数据来自谁，续约谈判的对象从“不可替代的数据”变成“可比价的输入”，计价单位从席位变成调用、单价由别人定 [src:SPGI-RPT1-2026-09-18#p7] [src:SPGI-RPT1-2026-09-18#p16]。它最先表现为老客户续约时少付，而不是客户流失：留存不变、每客户收入下降 15%，约合每股 −1.35 美元、约 −8.2% [src:SPGI-RPT1-2026-09-18#p12]，而公司不披露市场情报的留存率 [src:SPGI-RPT1-2026-09-18#p5]。"
    - "评级被绕开或失去监管认可：私募信贷约 1.7 万亿美元、预计 2028 年约 2.8 万亿美元，证券估值办公室自 2026 年起有权质疑并推翻豁免申报的私募评级 [src:SPGI-RPT1-2026-09-18#p7]。两条路的后果量级不同。若整条豁免申报通道收紧、私募信用的外部评级不再被监管接受，失去的是评级利润里来自私募市场的那部分增量，也就是报告第 3 节的私募评级归零上限情形，约为基准年每股所有者盈利的 2.7%–5.4% [src:SPGI-RPT1-2026-09-18#p16] [src:SPGI-RPT1-2026-09-18#p8]；若主要司法辖区正式立法取消发行人付费或强制评级机构轮换，被直接摧毁的是约占集团 43% 利润的那块来源 [src:SPGI-RPT1-2026-09-18#p19]。"
    - "可信度冲击：竞争压力下它放松标准有前科，2011 年它在 CMBS 评级上为争业务放宽标准且没有告诉投资者，2015 年与证交会和解，并暂停评级一年 [src:SPGI-RPT1-2026-09-18#p10]；2008 年那次最终以约 15 亿美元和解落到利润上 [src:SPGI-RPT1-2026-09-18#p17]。今天的测试场是增长 60% 的私募评级与超大规模 AI 发债人的评级 [src:SPGI-RPT1-2026-09-18#p10] [src:SPGI-RPT1-2026-09-18#p18]；若再次失守并招来监管改写发行人付费或评级引用，一次性的罚金会变成永久性的地位损失。"
    - "把周期当成趋势，再用负债去回购：评级的交易费、指数的挂钩费与市场情报受到的质疑都挂在同一个 AI 资本开支叙事上，这个叙事无论成败，四个分部都不会同时受益 [src:SPGI-RPT1-2026-09-18#p16]；一次 2022 型发行荒约压当年每股盈利 2.94 美元、约 −18% [src:SPGI-RPT1-2026-09-18#p6]，多年期发行荒或利率长期在 5% 以上时的发行，在公司的现代记录里找不到先例 [src:SPGI-RPT1-2026-09-18#p21]。与此同时 2026 年股东返还约为分拆后调整后自由现金流的 163%，超出部分来自资产出售与新发债 [src:SPGI-RPT1-2026-09-18#p9]，总债务已从 2021 年末约 41 亿美元升到 2025 年末 130.88 亿美元 [src:SPGI-RPT1-2026-09-18#p20]。"
    - "基准被第三方撤下：ETF 外壳里不需要授权的那部分在变大，主动型 ETF 约拿走年内流入的 35%–39% [src:SPGI-RPT1-2026-09-18#p16]；2012 年 Vanguard 把约 5,370 亿美元的基金从 MSCI 换到 FTSE 与 CRSP、基金名字未改 [src:SPGI-RPT1-2026-09-18#p7]。交易所若把旗舰能源合约的结算价从 Platts 改为自有价格，或 ACER 的 LNG 基准进入主流合同，Platts 靠行业惯例维持的地位就会松动 [src:SPGI-RPT1-2026-09-18#p19]。"

