  - id: SPGI-Q9
    type: quantitative
    claim: Cash conversion holds at a healthy level, and adjusted profit turns into cash
    origin: report:watch
    severity: watch
    covers: [free_cash_flow]
    pillar: P4
    metric_def:
      id: adj_fcf_to_adj_net_income
      description: Adjusted free cash flow as defined by the company (after distributions to noncontrolling interests) ÷ adjusted net income
      unit: "%"
      frequency: year
      data: filing_text
      where: The non-GAAP reconciliation in the annual earnings press release (Adjusted free cash flow, Adjusted net income)
      formula: adjusted_free_cash_flow / adjusted_net_income
    fail_if: Below 90% for two consecutive years
    rule: {op: "<", threshold: 90, unit: "%", consecutive: 2, period: year}
    warn_if: Below the healthy line of 95%
    warn_rule: {op: "<", threshold: 95, unit: "%", consecutive: 1, period: year}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: "2027-02"
    baseline:
      value: 100.7
      unit: "%"
      period: FY2025
      as_of: 2025-12-31
      source: SPGI-8K-2026-02-10#EX99-Exh7
      note: "As SPGI-Q5: $5.481 billion against $5.441 billion, as reported, numerator and denominator including Mobility (this archive's computation) [src:SPGI-8K-2026-02-10#EX99-Exh7] [src:SPGI-8K-2026-02-10#EX99-Exh5]. When the FY2026 10-K restates FY2025 to continuing operations, readings follow the latest restated basis and this note keeps the figure as originally reported."
    note: "The fourth watch indicator in section 11 of the report; the healthy line is 95%, and a reading below it is recorded as a warning [src:SPGI-RPT1-2026-09-18#p19]. This is the main test of cash conversion, using the company's adjusted figures; the stalwart template's Q-fcf is kept as SPGI-Q13 (GAAP basis, computed automatically from XBRL) as a backup for this test and SPGI-Q5. SPGI's GAAP net income is after $1.109 billion of deal-related amortization in FY2025 ($838 million after tax, while the income statement's amortization of intangibles was $1,069 million) and is far below cash earnings [src:SPGI-8K-2026-02-10#EX99-Exh5] [src:SPGI-10K-FY2025#p78], so readings on the two bases cannot be compared directly. For the break in basis in the FY2026 reading, see SPGI-Q5."

  - id: SPGI-Q10
    type: quantitative
    claim: EPS growth is not being paid for by the balance sheet, and shareholder returns do not exceed free cash flow for long
    origin: report:watch
    severity: watch
    covers: [capital_allocation, balance_sheet, governance]
    pillar: P6
    metric_def:
      id: shareholder_return_to_adj_fcf
      description: (Buybacks + dividends) ÷ adjusted free cash flow as defined by the company (after distributions to noncontrolling interests)
      unit: "%"
      frequency: year
      data: filing_text
      where: The 10-K cash flow statement (buybacks, dividends); the non-GAAP reconciliation in the annual earnings press release (adjusted free cash flow)
      formula: (buybacks + dividends) / adjusted_free_cash_flow
    fail_if: Above 130% for two consecutive years
    rule: {op: ">", threshold: 130, unit: "%", consecutive: 2, period: year}
    warn_if: Outside the healthy range of 85%–110%
    warn_rule: {op: outside, threshold: [85, 110], unit: "%", consecutive: 1, period: year}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: "2027-02"
    baseline:
      value: 112.6
      unit: "%"
      period: FY2025
      as_of: 2025-12-31
      source: SPGI-8K-2026-02-10#EX99-Exh7
      note: "FY2025 buybacks of $5.001 billion and dividends of $1.170 billion [src:SPGI-10K-FY2025#p81] against adjusted free cash flow of $5.481 billion [src:SPGI-8K-2026-02-10#EX99-Exh7]: 112.6% (this archive's computation), which the company rounds to 113% [src:SPGI-8K-2026-02-10#EX99-p1]. As reported, including Mobility. For 2026, returns of at least about $8.1 billion are about 163% of the owner's report's estimate of $5.0 billion of post-spin adjusted free cash flow and about 150% (149%–155%) of calendar-2026 adjusted free cash flow on the company's reporting basis, the second-half part of which was heard only on the Q2 call (this archive's computation, F15, not a baseline) [src:SPGI-8K-2026-07-28#EX99.1-p1] [src:SPGI-8K-2026-07-28#EX99.1-Exh8] [src:SPGI-CALL-FY2026Q2] [src:SPGI-RPT1-2026-09-18#p9]."
    note: "The fifth watch indicator in section 11 of the report: above 130% for two consecutive years means EPS growth is being propped up by the balance sheet [src:SPGI-RPT1-2026-09-18#p19]. The 2025 performance share units, the largest part of executive pay, use one metric, three-year cumulative non-GAAP ICP adjusted EPS, and the company says it does not use relative TSR as a performance measure [src:SPGI-DEF14A-2026-03-31#p64] [src:SPGI-DEF14A-2026-03-31#PayVersusPerformance]. The healthy range is 85%–110%, and a reading outside it is recorded as a warning [src:SPGI-RPT1-2026-09-18#p19]; the FY2025 reading of 112.6% is already outside the range, so the test is in a warning state from creation [src:SPGI-10K-FY2025#p81] [src:SPGI-8K-2026-02-10#EX99-Exh7]. The company's medium-term framework is to return about 85% of adjusted free cash flow [src:SPGI-8K-2025-11-13#EX99]; for 2026 it now expects to return 100% or more (April 2026) and to buy back more than $7 billion (July 2026) [src:SPGI-8K-2026-04-28#EX99-p1] [src:SPGI-8K-2026-07-28#EX99.1-p1]. On the second basis of F15, 2026 returns would exceed adjusted free cash flow by about $2.7–2.9 billion (this archive's computation) [src:SPGI-8K-2026-07-28#EX99.1-Exh8] [src:SPGI-CALL-FY2026Q2]; the excess is funded by the OSTTRA sale ($1.5 billion in cash, $1.4 billion after tax, received in October 2025) [src:SPGI-10K-FY2025#Note2], $361 million of disposal proceeds in the first half of 2026 [src:SPGI-10Q-FY2026Q2#p7] and the $1.974 billion cash distribution from Mobility Global, which Mobility Global financed with $2.0 billion of its own notes [src:SPGI-8KA-2026-07-06#EX99.2-noteb] [src:SPGI-10Q-FY2026Q2#Note4]. The FY2026 reading has a break in basis: first-half cash flow includes Mobility, the second half does not, and the company has published no full-year figure excluding Mobility [src:SPGI-10Q-FY2026Q2#Note1] [src:SPGI-8K-2026-07-28#EX99.1-Exh8]. The test is read annually, first with the FY2026 10-K: the reading uses the adjusted free cash flow the company reports for FY2026, whatever its Mobility basis, with buybacks and dividends from the same year's cash flow statement, and the basis is recorded next to the reading."

  # ---------- Section 11 of the report: the two forks with a stated time at which they can be read ----------
  - id: SPGI-Q11
    type: quantitative
    claim: The index fee base is not being eroded by the part of the ETF wrapper that needs no license
    origin: report:watch
    severity: watch
    covers: [moat, pricing_power]
    pillar: P2
    metric_def:
      id: asset_linked_fee_growth_minus_us_etf_aum_growth
      description: Year-on-year growth in the index segment's asset-linked fees minus year-on-year growth in total US ETF assets
      unit: pp
      frequency: quarter
      data: mixed
      formula: yoy(asset_linked_fees) - yoy(us_etf_total_assets)
      components:
        asset_linked_fees:
          description: Index segment asset-linked fees
          unit: USD
          where: Schedules to the quarterly earnings press release, or the 10-Q revenue breakdown
        us_etf_total_assets:
          description: Total US ETF assets
          unit: USD
          where: Industry statistics (not a filing)
    fail_if: Asset-linked fee growth persistently lags total US ETF asset growth (the difference persistently negative, counted by this archive as 4 consecutive quarters)
    rule: {op: "<", threshold: 0, unit: pp, consecutive: 4, period: quarter}
    data: mixed
    effective_from: FY2026Q3
    first_readable: "2026-10"
    note: "Fork #7 in section 11 of the report, readable every quarter and currently leaning toward the main branch [src:SPGI-RPT1-2026-09-18#p18]; a persistently negative difference means step 4 of erosion path C (the part of the ETF wrapper that needs no license growing) has materialized [src:SPGI-RPT1-2026-09-18#p18] [src:SPGI-RPT1-2026-09-18#p7]. The report says the step on this path that really needs watching is asset-linked fee growth persistently lagging ETF industry asset growth, and it keeps only this one quarterly indicator for indices [src:SPGI-RPT1-2026-09-18#p16]. US ETF industry asset growth is in no filing and has not been read yet, so whether that lag has begun is not known: in Q2 2026 asset-linked fees grew 21.7% (this archive's computation) while average assets of ETFs linked to S&P Dow Jones indices grew 38%, but the fees also cover mutual funds and insurance products [src:SPGI-8K-2026-07-28#EX99.1-Exh7] [src:SPGI-10Q-FY2026Q2#p55]. The report says only “persistently negative” and gives no number of periods; counting 4 consecutive quarters is this archive's operationalization, written down in advance, not a threshold in the report. Only half of the current reading is available: asset-linked fees rose 22% year on year in Q2 2026, as the company rounds it [src:SPGI-8K-2026-07-28#EX99.1-Exh7], and the report does not give total US ETF asset growth for the same period, so the difference is to be backfilled. The report's estimate of the size of this leg: asset-linked fee growth lagging ETF industry asset growth by 5 percentage points for three years in a row comes to about −$0.32 per share at a 73% attribution ratio, about a quarter of the Market Intelligence case [src:SPGI-RPT1-2026-09-18#p16]."

