category_rationale: "FY2025 revenue of $15.336 billion [src:SPGI-RPT1-2026-09-18#p4], a medium-term organic revenue growth target of 7%–9% against an actual +10% in the first half of 2026 [src:SPGI-RPT1-2026-09-18#p11], and the midpoint of 2026 adjusted EPS guidance up about 11.2% on a like-for-like basis [src:SPGI-RPT1-2026-09-18#p6]: a large, steady stalwart growing around 10% a year. The secondary category is cyclical: about 36 cents of every $1 of revenue moves with market volumes [src:SPGI-RPT1-2026-09-18#p4], and the 2022 issuance drought took ratings segment revenue down 26% and operating profit down 36% [src:SPGI-RPT1-2026-09-18#p6]."
