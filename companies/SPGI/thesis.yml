thesis:
  summary: "S&P Global sells reference points that others have written into contracts, mandates and regulation: ratings, indices and Platts are a set of market toll booths with margins of 65%–70%, and ratings and indices bring in 61% of adjusted operating profit on 47% of revenue [src:SPGI-RPT1-2026-09-18#p19] [src:SPGI-RPT1-2026-09-18#p4]. Bundled with them is a data subscription business (Market Intelligence) that is 34% of revenue at a 33% margin, whose pricing power is being called into question by the interface layer of AI workflows [src:SPGI-RPT1-2026-09-18#p4] [src:SPGI-RPT1-2026-09-18#p7]. The business needs almost no further investment: FY2025 capex was only 1.3% of revenue, and adjusted free cash flow was 101% of adjusted net income [src:SPGI-RPT1-2026-09-18#p4] [src:SPGI-RPT1-2026-09-18#p5]; every widening of the moat was written in by regulators or third parties, into their own obligations, on its behalf, and filling it in would not need its consent either [src:SPGI-RPT1-2026-09-18#p2]. The thesis fears three things most: customers starting to negotiate prices for Market Intelligence data by the number of calls rather than by the seat, private credit and regulation costing ratings their recognized status, and mistaking the cyclical profit from record-high issuance for a trend [src:SPGI-RPT1-2026-09-18#p16]."
  pillars:
    - id: P1
      claim: "The standing of ratings is fixed by regulatory references and issuer-pays contracts, not by product quality: ratings non-transaction revenue in the first half of 2026 was $1.183 billion, up 10% year on year and 45% of the segment, and it fell only 2% in the 2022 issuance drought [src:SPGI-RPT1-2026-09-18#p6]; excluding government securities, the three largest rating agencies hold 81.5% between them, and the smaller agencies' share stopped growing in 2023 [src:SPGI-RPT1-2026-09-18#p2]."
      source: SPGI-RPT1-2026-09-18#p6
    - id: P2
      claim: "Indices and Platts are written into contracts through third-party products and settlement: the index segment's revenue grew 18% in the first half of 2026 at a 72% margin, and asset-linked fees rose 22% in Q2, a fourth consecutive record quarter [src:SPGI-RPT1-2026-09-18#p7]; exchanges pay royalties for settling against Platts assessments, and the LNG benchmark of the EU Agency for the Cooperation of Energy Regulators is used voluntarily and has shown no sign of replacing Platts [src:SPGI-RPT1-2026-09-18#p5] [src:SPGI-RPT1-2026-09-18#p7]."
      source: SPGI-RPT1-2026-09-18#p7
    - id: P3
      claim: "Market Intelligence's pricing power has not been taken apart by AI workflows: it contributes only 22% of profit on 34% of revenue [src:SPGI-RPT1-2026-09-18#p4], and its organic constant-currency growth in the first half of 2026 was +6%, the lowest of the four segments [src:SPGI-RPT1-2026-09-18#p7]; the company is plugging its data into large-model interfaces itself, a deliberate migration, but what one call is worth has not been disclosed to date [src:SPGI-RPT1-2026-09-18#p11] [src:SPGI-RPT1-2026-09-18#p12]."
      source: SPGI-RPT1-2026-09-18#p7
    - id: P4
      claim: "Accounting profit is cash, and the business needs almost no further investment: FY2025 adjusted free cash flow was $5.481 billion and adjusted net income $5.441 billion, a ratio of 101% [src:SPGI-RPT1-2026-09-18#p5]; capex is only 1.3% of revenue [src:SPGI-RPT1-2026-09-18#p4], and the whole reason GAAP earnings are below cash earnings is the $1.109 billion of amortization of acquired intangibles in FY2025 [src:SPGI-RPT1-2026-09-18#p5]."
      source: SPGI-RPT1-2026-09-18#p5
    - id: P5
      claim: "The cycle weighs on the year's profit, not on the business itself: about 64 cents of every $1 of revenue is contractual recurring revenue [src:SPGI-RPT1-2026-09-18#p4]; in the 2022 issuance drought, ratings segment revenue fell 26% and operating profit 36%, while non-transaction revenue fell only 2% [src:SPGI-RPT1-2026-09-18#p6]; through the cycle, growth still falls within the stalwart range, and the company's medium-term organic revenue target is 7%–9% [src:SPGI-RPT1-2026-09-18#p11]."
      source: SPGI-RPT1-2026-09-18#p6
    - id: P6
      claim: "Management's capital allocation at least does not destroy value: the spin-off and portfolio pruning went in the right direction and were delivered on time [src:SPGI-RPT1-2026-09-18#p9]; buybacks are shrinking the 113.8 million shares issued in the 2022 all-stock acquisition [src:SPGI-RPT1-2026-09-18#p8]. What the thesis needs is for shareholder returns to come back into the healthy range the report gives and no longer be propped up by new debt, and today's readings do not yet support this: the report's healthy range is 85%–110% of adjusted free cash flow [src:SPGI-RPT1-2026-09-18#p19], the company's own policy only says it returns 85% or more, and the actual figure for FY2025 was 113% [src:SPGI-RPT1-2026-09-18#p9] [src:SPGI-RPT1-2026-09-18#p8]; for 2026 it is about 163% of post-spin adjusted free cash flow, the excess coming from asset sales and new debt [src:SPGI-RPT1-2026-09-18#p9]; the report's reading on the standard “are shareholder returns offset by new debt or share issuance” is that they are offset [src:SPGI-RPT1-2026-09-18#p20]. This pillar is guarded by SPGI-Q3, SPGI-Q10, SPGI-Q14 and SPGI-L6."
      source: SPGI-RPT1-2026-09-18#p9
  # Munger inversion list: how a permanent loss could happen (from section 9's “the strongest reason not to buy it”, section 3's erosion paths and “where the evidence is thinnest”)
  permanent_loss_paths:
    - "Market Intelligence's pricing is taken apart: AI agents and workflows make customers stop caring where the data comes from, the subject of renewal negotiations changes from “irreplaceable data” to “an input whose price can be compared”, and the pricing unit changes from seats to calls, with unit prices set by someone else [src:SPGI-RPT1-2026-09-18#p7] [src:SPGI-RPT1-2026-09-18#p16]. It would show up first as existing customers paying less at renewal, not as customers leaving: with retention unchanged, a 15% fall in revenue per customer comes to about −$1.35 per share, about −8.2% [src:SPGI-RPT1-2026-09-18#p12], and the company does not disclose Market Intelligence's retention rate [src:SPGI-RPT1-2026-09-18#p5]."
    - "Ratings get bypassed or lose regulatory recognition: private credit is about $1.7 trillion and expected to reach about $2.8 trillion in 2028, and from 2026 the Securities Valuation Office has the power to challenge and overturn filing-exempt private ratings [src:SPGI-RPT1-2026-09-18#p7]. The two routes differ in the size of the consequence. If the filing-exempt route as a whole tightens and external ratings of private credit are no longer accepted by regulators, what is lost is the increment of ratings profit that comes from private markets, that is, the report's section 3 upper-bound case in which private ratings go to zero, about 2.7%–5.4% of base-year owner earnings per share [src:SPGI-RPT1-2026-09-18#p16] [src:SPGI-RPT1-2026-09-18#p8]; if a major jurisdiction formally legislates away issuer-pays or mandates rotation of rating agencies, what is directly destroyed is the source of about 43% of the group's profit [src:SPGI-RPT1-2026-09-18#p19]."
    - "A credibility shock: it has a record of loosening standards under competitive pressure; in 2011 it loosened its CMBS rating standards to win business without telling investors, settled with the SEC in 2015 and was suspended from rating for a year [src:SPGI-RPT1-2026-09-18#p10]; the 2008 episode ended up hitting profit through settlements of about $1.5 billion [src:SPGI-RPT1-2026-09-18#p17]. Today's testing grounds are private ratings, growing 60%, and ratings of hyperscale AI debt issuers [src:SPGI-RPT1-2026-09-18#p10] [src:SPGI-RPT1-2026-09-18#p18]; if it slips again and invites regulators to rewrite issuer-pays or rating references, a one-time fine would become a permanent loss of standing."
    - "Mistaking the cycle for a trend, then buying back stock with debt: ratings' transaction fees, the indices' asset-linked fees and the doubts over Market Intelligence all hang on the same AI capex story, and whether that story succeeds or fails, the four segments will not all benefit at once [src:SPGI-RPT1-2026-09-18#p16]; a 2022-style issuance drought would cut that year's EPS by about $2.94, about −18% [src:SPGI-RPT1-2026-09-18#p6], and a multi-year issuance drought, or issuance with interest rates above 5% for a long time, has no precedent in the company's modern record [src:SPGI-RPT1-2026-09-18#p21]. Meanwhile, 2026 shareholder returns are about 163% of post-spin adjusted free cash flow, the excess coming from asset sales and new debt [src:SPGI-RPT1-2026-09-18#p9], and total debt has risen from about $4.1 billion at the end of 2021 to $13.088 billion at the end of 2025 [src:SPGI-RPT1-2026-09-18#p20]."
    - "Benchmarks dropped by third parties: the part of the ETF wrapper that needs no license is growing, and active ETFs are taking about 35%–39% of this year's inflows [src:SPGI-RPT1-2026-09-18#p16]; in 2012 Vanguard moved about $537 billion of funds from MSCI to FTSE and CRSP without changing the funds' names [src:SPGI-RPT1-2026-09-18#p7]. If exchanges switch the settlement price of flagship energy contracts from Platts to their own prices, or ACER's LNG benchmark makes it into mainstream contracts, Platts's position, which rests on industry practice, will loosen [src:SPGI-RPT1-2026-09-18#p19]."

