tests:
  # ---------- Lynch stalwart template (all five kept: SPGI-Q1, Q2, Q3, Q13, L1) ----------
  - id: SPGI-Q1
    type: quantitative
    claim: Growth has not slipped out of the stalwart range
    origin: template:stalwart
    severity: watch
    covers: [growth]
    pillar: P5
    metric: revenue_growth_organic_cc
    fail_if: Below 5% for 4 consecutive quarters
    rule: {op: "<", threshold: 5, unit: "%", consecutive: 4, period: quarter}
    warn_if: Below 6.5% for 2 consecutive quarters
    warn_rule: {op: "<", threshold: 6.5, unit: "%", consecutive: 2, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: 10
      unit: "%"
      period: 1H26
      as_of: 2026-06-30
      source: SPGI-RPT1-2026-09-18#p9
      note: "Pro forma (excluding Mobility), organic constant-currency basis [src:SPGI-RPT1-2026-09-18#p9]; the outperformance came mainly from the issuance cycle [src:SPGI-RPT1-2026-09-18#p9]."
    note: "The failure line is the template default. The warning line is changed from the template's 8% to 6.5%: in the growth path in section 7 of the report, revenue growth is taken as 6.5% for years 1–5 and 5.0% for years 6–10, deliberately below the bottom of the company's 7%–9% medium-term target, on the reasoning that a medium-term target set at a cyclical high should not be used as a ten-year average [src:SPGI-RPT1-2026-09-18#p11]. The target table on the same page calls 6.5% the “ten-year average revenue growth”, which is inconsistent with this breakdown, by which the ten-year average is about 5.75% [src:SPGI-RPT1-2026-09-18#p11]; this test takes the years 1–5 figure of 6.5% as its warning line, and growth between that and the 7% bottom of the target range is not a warning for this thesis [src:SPGI-RPT1-2026-09-18#p11]. The metric is organic constant-currency growth as defined by the company, not the registry's reported revenue year on year: the revenue series was broken by the IHS Markit merger in 2022 and again by the Mobility spin-off in 2026 [src:SPGI-RPT1-2026-09-18#p5], and for the four quarters after the spin-off, reported year-on-year figures would mix in a base that includes Mobility."

  - id: SPGI-Q2
    type: quantitative
    claim: Return on invested capital on the report's basis holds at the level of an excellent business, and the price paid for IHS Markit in 2022 has not become a drag on returns
    origin: template:stalwart
    severity: watch
    covers: [returns_on_capital, capital_allocation]
    pillar: P4
    metric_def:
      id: roic_adjusted_incl_redeemable_nci
      description: "Return on invested capital on the report's basis = after-tax adjusted operating profit ÷ year-end invested capital; invested capital = shareholders' equity + total debt + redeemable noncontrolling interests − cash; the tax rate is fixed in advance at 0.223 and stays the same every year (reasons in the note)"
      unit: "%"
      frequency: year
      data: filing_text
      where: The non-GAAP reconciliation in the annual earnings press release (adjusted operating profit); the 10-K balance sheet (shareholders' equity, short-term and long-term debt, redeemable noncontrolling interests, cash and cash equivalents)
      formula: adjusted_operating_profit * (1 - 0.223) / (equity + total_debt + redeemable_noncontrolling_interest - cash)
    fail_if: Below 12% for 2 consecutive years
    rule: {op: "<", threshold: 12, unit: "%", consecutive: 2, period: year}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: "2027-02"
    baseline:
      value: 12.6
      unit: "%"
      period: FY2025
      as_of: 2025-12-31
      source: SPGI-RPT1-2026-09-18#p5
      note: "Adjusted operating profit of $7.730 billion, $6.006 billion after tax, and invested capital of $47.495 billion = shareholders' equity $31.235 billion + total debt $13.088 billion + redeemable noncontrolling interests $4.917 billion − cash $1.745 billion [src:SPGI-RPT1-2026-09-18#p5]."
    note: "Replaces the registry metric roic (GAAP operating profit, average invested capital) used by the stalwart template's Q-returns; the threshold is the template default. There are two reasons. GAAP operating profit is after the $1.109 billion of amortization of acquired intangibles in FY2025, which the report adds back as a non-cash item [src:SPGI-RPT1-2026-09-18#p5]; and the 27% of the index joint venture held by CME Group is shown as redeemable noncontrolling interests, $4.917 billion at the end of 2025, and belongs in invested capital [src:SPGI-RPT1-2026-09-18#p5]. So the metric is defined here on the report's basis. This test does not measure the capital efficiency of the business itself: goodwill and intangibles of $52.746 billion equal 111% of invested capital, tangible invested capital is negative, and the reading mainly measures how much of the consideration for the 2022 IHS Markit acquisition has been earned back [src:SPGI-RPT1-2026-09-18#p5]; covers therefore records capital_allocation rather than the template's moat. The tax rate is fixed before the first reading at 22.3%, the rate implied by the report's FY2025 baseline: adjusted operating profit of $7.730 billion, $6.006 billion after tax [src:SPGI-RPT1-2026-09-18#p5]. The baseline is only 0.6 percentage points above the 12% failure line, so the choice of tax rate is enough to change the conclusion: with the effective tax rate of about 24.5% that the report uses elsewhere, the same baseline would be about 12.3% [src:SPGI-RPT1-2026-09-18#p5] [src:SPGI-RPT1-2026-09-18#p13]; the tax rate is therefore fixed, and every later year is computed at the same rate, not at that year's actual rate."

  - id: SPGI-Q3
    type: quantitative
    claim: Buybacks are truly shrinking the share count, not offsetting stock-based compensation or merely buying back the shares issued in 2022
    origin: template:stalwart
    severity: watch
    covers: [capital_allocation]
    pillar: P6
    metric: diluted_shares_yoy
    fail_if: Above 0 for 2 consecutive years
    rule: {op: ">", threshold: 0, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: "2027-02"
    note: "The threshold is the template default. The 2022 consideration for IHS Markit was paid entirely in stock, issuing 113.8 million shares at an exchange ratio of 0.2838 [src:SPGI-RPT1-2026-09-18#p8]; the GAAP diluted share count rose from 241.8 million in 2021 to 305.1 million in 2025 [src:SPGI-RPT1-2026-09-18#p8], and the weighted average diluted share count in Q2 2026 was 295.5 million [src:SPGI-RPT1-2026-09-18#p14]. The report gives no year-on-year reading; the baseline is to be backfilled from the XBRL of the Q2 2026 10-Q. The 2026 buyback target is more than $7 billion, of which $1.5 billion was executed in the first half [src:SPGI-RPT1-2026-09-18#p8]."

  - id: SPGI-Q13
    type: quantitative
    claim: Profit turns into cash (a backup check on the GAAP basis)
    origin: template:stalwart
    severity: watch
    covers: [free_cash_flow]
    pillar: P4
    metric: fcf_conversion
    fail_if: Below 70% for 2 consecutive years
    rule: {op: "<", threshold: 70, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: "2027-02"
    note: "The stalwart template's Q-fcf, with the template's default threshold. It measures the same thing as SPGI-Q5 and SPGI-Q9 on a different basis: the numerator is operating cash flow minus capex and the denominator is GAAP net income, all computable directly from XBRL, without depending on the company's own “adjusted” definitions and without calling a model, so it runs as usual while model calls are paused for candidate companies. SPGI's GAAP net income is after the $1.109 billion of amortization of acquired intangibles in FY2025 and is far below cash earnings [src:SPGI-RPT1-2026-09-18#p5], so this test's reading will be systematically higher than SPGI-Q5 and SPGI-Q9, and the 70% threshold is loose; it is a backup and does not replace those two. The report gives no reading on the GAAP basis; the baseline is to be backfilled from the XBRL of the FY2025 10-K. FY2026 cash flow includes Mobility for the first half [src:SPGI-RPT1-2026-09-18#p5]; as with SPGI-Q5, judging requires the numerator and denominator on the same basis, and when same-basis figures cannot be obtained, the result is recorded as undeterminable."

  - id: SPGI-L1
    type: qualitative
    claim: Management has not lowered its published medium-term financial targets
    origin: template:stalwart
    severity: watch
    covers: [management]
    pillar: P6
    question: In this period's documents, did management lower or withdraw the medium-term financial targets it published earlier (the medium-term organic revenue growth targets for the company as a whole and for each of the ratings, index, Market Intelligence and energy segments)? Lowering either the top or the bottom of a range counts as lowering.
    fail_if: Yes, whether or not new targets are given at the same time; targets restated on a like-for-like basis only because of portfolio changes (for example the Mobility spin-off or businesses moving between segments) do not count as lowering
    judge: independent_model
    evidence: required
    where: The earnings 8-K's press release and schedules, earnings call materials, investor day materials, the 10-K/10-Q MD&A
    lookback: 4
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: "Medium-term organic revenue growth targets: company 7%–9%, indices 10%–12%, ratings 6%–9%, Market Intelligence 6%–8%, energy 6%–8%"
      source: SPGI-RPT1-2026-09-18#p11
      note: "After the spin-off, on 2026-07-28, full-year adjusted EPS guidance was reset to $17.50–17.75, and the ratings and index segment guidance were each raised [src:SPGI-RPT1-2026-09-18#p9]."
    note: "Rewrites the threshold of the stalwart template's L-guidance. The template says “yes, and no testable new target given at the same time”: as written, an ordinary cut (lowering the target while giving a lower new range) would be recorded as a pass because a new target was given, which contradicts the claim. This test records any cut or withdrawal as a failure (watch level), excluding only like-for-like restatements made purely because of portfolio changes. Section 7 of the report considers that the top of Market Intelligence's 6%–8% target is already above the actual of the last three years and works with 5%–6%, and that energy is more likely to land below the bottom of its target range [src:SPGI-RPT1-2026-09-18#p11]. From this, this archive infers that if any segment target is cut, these two are the most likely; this is this archive's inference, and the report does not predict that targets will be cut."

  # ---------- Lynch cyclical template (secondary category; Q-cycle does not apply, see the file header) ----------
  - id: SPGI-Q14
    type: quantitative
    claim: Leverage has not been pushed to a dangerous level by buybacks before the next issuance downturn
    origin: template:cyclical
    severity: watch
    covers: [balance_sheet]
    pillar: P6
    metric: net_debt_to_ebitda
    fail_if: Above 3x
    rule: {op: ">", threshold: 3, unit: x, consecutive: 1, period: year}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: "2027-02"
    note: "The Q-leverage test of the cyclical template (this archive's secondary category), with the template's default threshold. It guards the second half of permanent-loss path #4: total debt rose from about $4.1 billion at the end of 2021 to $13.088 billion at the end of 2025 [src:SPGI-RPT1-2026-09-18#p20], and 2026 shareholder returns are about 163% of post-spin adjusted free cash flow, the excess coming from asset sales and new debt [src:SPGI-RPT1-2026-09-18#p9]; and a 2022-style issuance drought would weigh on that year's profit, shrinking the denominator [src:SPGI-RPT1-2026-09-18#p6]. The report gives no EBITDA or net debt multiple; the baseline is to be backfilled from the XBRL of the FY2025 10-K. Debt on the registry's basis takes only us-gaap:LongTermDebt, while short-term debt rose from $718 million to $2.572 billion in 2026 [src:SPGI-RPT1-2026-09-18#p8]; the test is judged on the registry's basis, and if that excludes short-term borrowings, the company manager also records, next to the reading, the multiple including short-term borrowings, with the threshold unchanged."

  - id: SPGI-L6
    type: qualitative
    claim: At the top of the issuance cycle, buybacks have not been stepped up sharply without stating the cycle assumptions
    origin: template:cyclical
    severity: watch
    covers: [capital_allocation, balance_sheet]
    pillar: P6
    question: "In this period, are both of the following true: (1) the issuance cycle is high, that is, this period's ratings billed issuance in SPGI-Q7 is up more than 15% year on year (beyond the top of the healthy range); (2) the full-year buyback target the company has announced for this year, or the amount of buybacks executed so far this year, is more than 25% above the previous year's actual buybacks?"
    fail_if: Yes, and the earnings press release, earnings call or 10-K/10-Q for the same period does not say how buybacks and borrowing will be adjusted when issuance declines
    judge: independent_model
    evidence: required
    where: Quarterly earnings press releases and supplementary disclosures (billed issuance, buyback target); the cash flow statement and shareholder returns section of the 10-Q/10-K; earnings calls
    lookback: 4
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: 2026 buyback target of more than $7 billion, $1.5 billion executed in the first half; FY2025 buybacks of $5.001 billion
      source: SPGI-RPT1-2026-09-18#p8
      note: "Ratings billed issuance in Q2 2026 was up 25% year on year [src:SPGI-10Q-FY2026Q2#MD&A]."
    note: "Rewritten from the cyclical template's L-cycle-capalloc (the template asks whether capex or buybacks were raised sharply while profit hit a record, and fails if management did not state its cycle assumptions). All three changes were written down before the first judgment. One: “profit hitting a record” becomes ratings billed issuance beyond the top of its healthy range: SPGI's cyclicality is concentrated in ratings transaction revenue, and the report uses billed issuance to judge where the cycle stands [src:SPGI-RPT1-2026-09-18#p15] [src:SPGI-RPT1-2026-09-18#p19]. Two: capex is not considered, as it is only 1.3% of revenue [src:SPGI-RPT1-2026-09-18#p4]. Three: “sharply” is set by this archive as more than 25% above the previous year's actual buybacks, and the 2026 buyback target of more than $7 billion is about 40% higher than FY2025's actual $5.001 billion [src:SPGI-RPT1-2026-09-18#p8]. On the report's numbers, both conditions already held when the archive was created, with Q2 billed issuance up 25% year on year [src:SPGI-RPT1-2026-09-18#p19]; whether this test fails depends on whether management says how buybacks and borrowing will be adjusted when issuance declines. The report lists keeping buybacks at the set ratio of 85% through a real issuance downturn, rather than sustaining them with debt, as one of the conditions for moving management from “ordinary” to “excellent” [src:SPGI-RPT1-2026-09-18#p20]."

  # ---------- Section 11 of the report: thesis breakers (the thesis is void once one occurs; under the constitution, a conclusion is written within 7 days) ----------
  - id: SPGI-Q4
    type: quantitative
    claim: Market Intelligence's pricing power has not been taken away by the interface layer, and customers have not started negotiating renewals by the number of calls rather than by the seat
    origin: report:breaker
    severity: breaker
    covers: [pricing_power, moat, competition]
    pillar: P3
    metric_def:
      id: mi_subscription_revenue_yoy_change
      description: Year-on-year change in the absolute amount of the Market Intelligence segment's subscription revenue (Subscription), compared with the same quarter a year earlier
      unit: USD
      frequency: quarter
      data: filing_text
      where: The breakdown by segment and revenue type in the 10-Q/10-K revenue note (the Subscription line for Market Intelligence); when there is no segment detail, read the quarterly supplementary disclosure
      formula: mi_subscription_t - mi_subscription_{t-4q}
      components:
        mi_subscription_plus_recurring_variable_yoy_change:
          description: "Year-on-year change in the Market Intelligence segment's subscription revenue and recurring variable revenue (Recurring variable revenue) combined (compared with the same quarter a year earlier, quarterly; (mi_subscription + mi_recurring_variable)_t - (mi_subscription + mi_recurring_variable)_{t-4q}); a negative value means the increase in recurring variable revenue has not made up for the decline in subscription revenue"
          unit: USD
          where: "Same as above: the Subscription and Recurring variable revenue lines for Market Intelligence"
        mi_organic_cc_revenue_growth_fy:
          description: Market Intelligence segment full-year organic, constant-currency revenue growth (as defined by the company, annual)
          unit: "%"
          where: Segment organic growth in the schedules to the fourth-quarter earnings press release (the report cites Exhibit 8)
    params:
      segment: Market Intelligence
      segment_zh: Market Intelligence
    fail_if: Market Intelligence subscription revenue declines in absolute terms and recurring variable revenue does not make up for it in the same period; or (a later but still valid signal) Market Intelligence organic constant-currency revenue growth below 4% for two full fiscal years in a row
    rule:
      any_of:
        - all_of:
            - {metric: mi_subscription_revenue_yoy_change, op: "<", threshold: 0, unit: USD, consecutive: 1, period: quarter}
            - {metric: mi_subscription_revenue_yoy_change.mi_subscription_plus_recurring_variable_yoy_change, op: "<", threshold: 0, unit: USD, consecutive: 1, period: quarter}
          note: Both must hold in the same quarter.
        - {metric: mi_subscription_revenue_yoy_change.mi_organic_cc_revenue_growth_fy, op: "<", threshold: 4, unit: "%", consecutive: 2, period: year}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: 6
      unit: "%"
      period: 1H26
      as_of: 2026-06-30
      source: SPGI-RPT1-2026-09-18#p5
      note: "This is the current reading of the second branch (organic constant-currency growth); the report does not give the first branch's year-on-year change in absolute subscription revenue, which is to be backfilled from the Q2 2026 10-Q. Seat and enterprise-license subscriptions make up 96.4% of the segment, on a basis that includes recurring variable revenue billed per item [src:SPGI-RPT1-2026-09-18#p4]."
    note: "Thesis breaker #1 in section 11 of the report [src:SPGI-RPT1-2026-09-18#p19]: when customers switch to negotiating renewals by the number of calls rather than by the seat, the earliest thing visible in the financial statements is subscription revenue declining without usage-based revenue making up for it, which leads organic growth by several quarters; organic constant-currency revenue below 4% for two full fiscal years in a row comes later but counts just the same [src:SPGI-RPT1-2026-09-18#p19]. The report does not say what “decline” is measured against; this archive compares with the same quarter a year earlier, to avoid seasonality. Acquisitions and disposals change the absolute amount, so the comparison basis for the first branch is fixed as follows before the first reading. When the company discloses Market Intelligence subscription revenue on an organic or pro forma basis, use that basis. When only the reported basis is available: if the comparison window (this quarter and the same quarter a year earlier) contains only acquisitions, judge as usual, since acquisitions can only raise this quarter's reading, for example With Intelligence, which closed and joined Market Intelligence on 2025-11-25 [src:SPGI-RPT1-2026-09-18#p9]; if the window contains a disposal involving Market Intelligence and the company has not disclosed the revenue of the business disposed of, the first branch is recorded as undeterminable for that quarter, and the second branch (full-year organic growth) is unaffected. Enterprise Data Management and thinkFolio were sold on 2026-01-12 and belonged to Market Intelligence [src:SPGI-10Q-FY2026Q2#note-2], so the first-branch readings from Q3 2026 to Q1 2027 are handled under this disposal rule (see todo). The two forks that lead this test are not given tests of their own: #1, the fight over the pricing unit (readable in 2027–2029), and #3, the price signal on pricing power (in a third-party transaction database, the median annual contract for Capital IQ Pro is about $327,500, from only 4 contracts) [src:SPGI-RPT1-2026-09-18#p18]; the data are third-party and the samples tiny, so the company manager records them in the quarterly updates."

  - id: SPGI-Q5
    type: quantitative
    claim: Accounting profit is cash, and the basis for adding acquisition amortization back to owner earnings still holds
    origin: report:breaker
    severity: breaker
    covers: [free_cash_flow]
    pillar: P4
    metric_def:
      id: adj_fcf_to_adj_net_income
      description: Adjusted free cash flow as defined by the company (after distributions to noncontrolling interests) ÷ adjusted net income
      unit: "%"
      frequency: year
      data: filing_text
      where: The non-GAAP reconciliation in the annual earnings press release (Adjusted free cash flow, Adjusted net income)
      formula: adjusted_free_cash_flow / adjusted_net_income
    fail_if: Adjusted free cash flow below 85% of adjusted net income for two consecutive years
    rule: {op: "<", threshold: 85, unit: "%", consecutive: 2, period: year}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: "2027-02"
    baseline:
      value: 101
      unit: "%"
      period: FY2025
      as_of: 2025-12-31
      source: SPGI-RPT1-2026-09-18#p5
      note: "Adjusted free cash flow of $5.481 billion and adjusted net income of $5.441 billion (116% in FY2024) [src:SPGI-RPT1-2026-09-18#p5]."
    note: "Thesis breaker #6 in section 11 of the report: once it holds, the report's basis for adding acquisition amortization back to owner earnings no longer holds [src:SPGI-RPT1-2026-09-18#p19]. The FY2026 reading has a break in basis: first-half cash flow includes Mobility, while adjusted net income is on a basis excluding Mobility, which is why the report leaves the cash conversion for the first half of 2026 blank [src:SPGI-RPT1-2026-09-18#p5]; judging requires the numerator and denominator on the same basis, and when same-basis figures cannot be obtained, the result is recorded as undeterminable and the consecutive count starts from the next clean year."

  - id: SPGI-L2
    type: qualitative
    claim: "Ratings are still recognized by regulators in private credit: NAIC's tightening has not extended to S&P's own private ratings, and external private ratings as a whole have not lost their eligibility for filing exemption"
    origin: report:breaker
    severity: breaker
    covers: [regulation, moat, growth]
    pillar: P1
    question: "As of this period, has either of the following happened: (a) the challenges to or overturning of filing-exempt private ratings by the Securities Valuation Office of the National Association of Insurance Commissioners (NAIC) have extended to private ratings issued by S&P, and S&P's share has “risen significantly”, which this archive defines in advance as follows: by NAIC's published figures by agency, S&P's share of the ratings challenged or overturned this period is not below S&P's share of all filing-exempt private ratings; when NAIC has not published the latter share, S&P's share is instead more than 10 percentage points above the last reading that had figures by agency; (b) after 2026-09-18, NAIC has formally adopted a rule under which private ratings from external agencies as a whole are no longer accepted as a basis for filing exemption (closing the whole filing-exempt route, or having the Securities Valuation Office assess all private ratings itself), whichever rating agencies are involved? A rule that only adds spot checks or challenge procedures, without changing the availability of external ratings as a whole, does not count as (b)."
    fail_if: Yes (it fails if either (a) or (b) holds). It is recorded as a pass only if both branches were checked and neither holds; if the NAIC materials listed in where were not checked this period, or NAIC has not published the figures by agency that (a) needs and (b) does not hold, it is recorded as undeterminable, not as a pass
    judge: independent_model
    evidence: required
    where: Meeting materials, resolutions and statistics of NAIC's Valuation of Securities Task Force and the Securities Valuation Office (starting from the materials listed as source 24 in the report's appendix, source tag NAIC-SVO-2026); S&P's 10-K/10-Q risk factors and earnings calls; rating agency commentary
    lookback: 4
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: "In an earlier comparison, 97% of 109 private credit securities with private ratings were rated higher than the Securities Valuation Office's own assessment; this share covers all private ratings, and the public materials do not break it down by agency"
      source: SPGI-RPT1-2026-09-18#p8
      note: "From 2026-01-01 the Securities Valuation Office has the power to challenge and overturn filing-exempt ratings [src:SPGI-RPT1-2026-09-18#p7]. Private markets ratings revenue rose 60% year on year in Q2 2026, with the absolute amount not disclosed [src:SPGI-RPT1-2026-09-18#p8]."
    note: "Thesis breaker #2 in section 11 of the report [src:SPGI-RPT1-2026-09-18#p19]: once it holds, the increment of ratings profit that comes from private markets can no longer be assumed, and the report's estimated upper-bound case in which private ratings go to zero (−$0.45 to −$0.90 per share) becomes the base case [src:SPGI-RPT1-2026-09-18#p19]. (a) is the report's own wording of breaker #2, but the report gives no threshold for “risen significantly” [src:SPGI-RPT1-2026-09-18#p19], and the public materials do not break the figures down by agency [src:SPGI-RPT1-2026-09-18#p8]; the two thresholds in the question are this archive's operationalization, written down before the first judgment, awaiting HQ's confirmation in docs/decisions/. The reason is that the report considers the real reading to be whose ratings are overturned, not how many: if the overturned ratings are mainly those of smaller agencies, demand will concentrate on S&P, and only if S&P's share of the challenges is not below its own share does it show that the tightening has extended to S&P [src:SPGI-RPT1-2026-09-18#p8] [src:SPGI-RPT1-2026-09-18#p16]. (b) comes from the other branch of fork #4: the report says that if the filing-exempt route as a whole tightens and external ratings of private credit are no longer accepted by regulators, the same upper-bound case materializes [src:SPGI-RPT1-2026-09-18#p16] [src:SPGI-RPT1-2026-09-18#p18]; breaker #2's wording covers only (a), and (b) is merged in by this archive because the consequence is the same. The readings of fork #4 (readable in 2027–2029) and of “S&P's share of private ratings challenged or overturned” in fork #6 are also merged into this test [src:SPGI-RPT1-2026-09-18#p18]."

  - id: SPGI-L3
    type: qualitative
    claim: The issuer-pays model and the free choice of rating agency have not been dismantled by legislation
    origin: report:breaker
    severity: breaker
    covers: [regulation, moat]
    pillar: P1
    question: As of this period, has any major jurisdiction (defined in advance by this archive as the US federal level, the EU and the UK) formally legislated after 2026-09-18 to abolish the issuer-pays model for credit ratings or to mandate the rotation of rating agencies? In this test, “formally legislated” means a law passed and enacted by a legislature, or a binding final rule formally issued by a regulator under statutory authority, dated by its enactment or issuance without waiting for it to take effect; consultation drafts, research reports and proposals do not count. The scope must cover at least one whole class of ratings among corporates, financial institutions, structured finance or governments; provisions aimed only at individual products within a class do not count.
    fail_if: Yes. If the legislative records and regulatory announcements listed in where were not checked this period, it is recorded as undeterminable, not as a pass
    judge: independent_model
    evidence: required
    where: Legislative records of the US (Congress and the SEC), the EU and the UK, and the final rules and announcements of the rating regulators in these three jurisdictions; the regulation section and risk factors of S&P's 10-K/10-Q
    lookback: 4
    judge_notes:
      - Laws and rules already in existence on 2026-09-18 are part of the baseline; the judgment looks only at laws newly enacted or final rules newly issued after 2026-09-18.
      - Legislation in jurisdictions outside the list (US federal, EU, UK) does not trigger this test.
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: "The Dodd-Frank Act required removing references to ratings from federal rules, which has been carried out, but the market's reliance on ratings has not fallen noticeably; research on alternatives to the issuer-pays model has made no progress since 2013"
      source: SPGI-RPT1-2026-09-18#p7
    note: "Thesis breaker #3 in section 11 of the report: it would directly take out the source of about 43% of the group's profit, and the report lists it as a possible case but not the base case [src:SPGI-RPT1-2026-09-18#p19]. The report's wording is “formal legislation”, without listing jurisdictions or saying whether regulatory rules count [src:SPGI-RPT1-2026-09-18#p19]. The list of jurisdictions in the question, counting binding final rules as formal legislation, and the scope condition of “covering at least one whole class of ratings” are all this archive's operationalization, written down before the first judgment, not the report's wording; of these, the final-rule item goes beyond the report's wording and awaits HQ's confirmation in docs/decisions/. The reasons: the report lists mandatory rotation as one of the ways regulators can act directly [src:SPGI-RPT1-2026-09-18#p7], and a binding final rule has the same force as a law for issuers and rating agencies; the classification of ratings revenue is taken from section 1 of the report (corporates, financial institutions, structured finance, governments, Crisil and other) [src:SPGI-RPT1-2026-09-18#p4]. Legislation in jurisdictions outside the list is recorded by the company manager in the quarterly updates; the list can be changed only before a relevant event occurs."

  - id: SPGI-L4
    type: qualitative
    claim: S&P indices are still written into ETF mandates and products, and large issuers have not moved flagship products to self-built or third-party indices
    origin: report:breaker
    severity: breaker
    covers: [moat, pricing_power, competition]
    pillar: P2
    question: As of this period, has any of the three largest ETF issuers formally announced or completed switching a flagship product with more than $100 billion in assets from an S&P Dow Jones index to a self-built or third-party index?
    fail_if: Yes. If the ETF issuer announcements and prospectus changes listed in where were not checked this period, it is recorded as undeterminable, not as a pass
    judge: independent_model
    evidence: required
    where: ETF issuers' announcements and prospectus changes, exchange announcements; S&P's 10-Q/10-K and earnings calls
    lookback: 4
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: Asset-linked fees up 22% in Q2 2026, a fourth consecutive record quarter; active ETFs are taking about 35%–39% of this year's inflows, but one flagship S&P 500 ETF has had net inflows of more than $124 billion this year
      source: SPGI-RPT1-2026-09-18#p7
    note: "Thesis breaker #4 in section 11 of the report: if it happens, the premise that “benchmarks are written into mandates” is disproved [src:SPGI-RPT1-2026-09-18#p19]. The precedent is Vanguard's move in 2012 of 22 funds (about $537 billion) from MSCI to FTSE and CRSP without changing the funds' names [src:SPGI-RPT1-2026-09-18#p7]. The report says “switch” without distinguishing announcement from completion [src:SPGI-RPT1-2026-09-18#p19]; this archive counts a formal announcement as a switch, an operationalization written down in advance, not the report's wording: a formal announcement shows that the issuer has already decided, and waiting until the transition is complete to judge would only make the same conclusion arrive later. The primary source for the precedent (source 25 in the report's appendix) is registered as source tag VANGUARD-2012-10-02; the original has not been obtained. Funds with the index name in the product name find it hard to change indices, while broad-market products with generic names have already changed [src:SPGI-RPT1-2026-09-18#p7]."

  - id: SPGI-L5
    type: qualitative
    claim: Platts price assessments are still the settlement reference for energy contracts
    origin: report:breaker
    severity: breaker
    covers: [moat, pricing_power, competition]
    pillar: P2
    question: "As of this period, has either of the following happened: (a) a major commodity exchange (defined in advance by this archive as CME Group including NYMEX, Intercontinental Exchange (ICE) and Singapore Exchange (SGX)) has formally announced that it will change the settlement price of a flagship energy contract (one of the three energy contracts with the largest trading volume in the previous year among those the exchange settles on Platts assessments) from the Platts assessment to the exchange's own price; (b) the LNG benchmark of the EU Agency for the Cooperation of Energy Regulators (ACER) has been written into mainstream contracts, meaning that any exchange listed above has listed a contract settled on the ACER LNG benchmark whose trading volume in any quarter reaches 25% or more of the combined volume of that exchange's LNG contracts settled on Platts assessments, or that statistics published by ACER or the European Commission show that 25% or more of EU LNG trades are priced on the ACER benchmark?"
    fail_if: Yes (it fails if either (a) or (b) holds). The statistics condition in (b) goes by published figures and is treated as not met when no relevant statistics have been published; it is recorded as a pass only if both branches were checked and neither holds; if the external sources listed in where were not checked this period, or the trading volumes needed for the judgment cannot be read, it is recorded as undeterminable, not as a pass
    judge: independent_model
    evidence: required
    where: Contract rule change announcements and trading volume statistics of the exchanges listed above; ACER's announcements and market reports (starting from the materials listed as source 21 in the report's appendix, source tag ACER-LNG-2025); the European Commission's relevant statistics; S&P's 10-Q/10-K and earnings calls
    lookback: 4
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: "ACER's LNG benchmark has been published daily since 2023 and was made permanent in 2025; the market adopts it voluntarily, and there is no sign so far of it replacing Platts; the energy segment's adjusted revenue grew only 3% in Q2 2026, with advisory and conference revenue declining and sanctions also weighing on it"
      source: SPGI-RPT1-2026-09-18#p7
    note: "Thesis breaker #5 in section 11 of the report [src:SPGI-RPT1-2026-09-18#p19]. What Platts is written into is industry practice, not legal obligation, and the report judges the direction as “flat, leaning weaker” [src:SPGI-RPT1-2026-09-18#p7]. The report defines none of “major commodity exchange”, “flagship energy contract” or “mainstream contracts” [src:SPGI-RPT1-2026-09-18#p19]; the list of exchanges in the question, the top-three-by-volume definition, the two percentage thresholds and “going by the formal announcement” are all this archive's operationalization, written down before the first judgment, not the report's wording; they await HQ's confirmation in docs/decisions/ and can be changed only before a relevant event occurs. A switch to prices from another price reporting agency is outside the report's wording; if it happens, the company manager records it in the quarterly update."

  # ---------- Section 11 of the report: the five watch indicators tracked every quarter ----------
  - id: SPGI-Q6
    type: quantitative
    claim: Market Intelligence's growth has not kept stalling, and the pricing power of desktop data has not been squeezed by AI and customer budgets
    origin: report:watch
    severity: watch
    covers: [growth, pricing_power, competition]
    pillar: P3
    metric: segment_revenue_yoy
    params: {segment: Market Intelligence, segment_zh: Market Intelligence, basis: "organic, constant currency (as defined by the company)"}
    fail_if: Below 5% for two consecutive quarters
    rule: {op: "<", threshold: 5, unit: "%", consecutive: 2, period: quarter}
    warn_if: Below the healthy line of 6%
    warn_rule: {op: "<", threshold: 6, unit: "%", consecutive: 1, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: 6
      unit: "%"
      period: 1H26
      as_of: 2026-06-30
      source: SPGI-RPT1-2026-09-18#p19
    note: "The first watch indicator in section 11 of the report, read from Exhibit 8 of the quarterly results [src:SPGI-RPT1-2026-09-18#p19]; the report says “two consecutive quarters <5% trigger attention”, recorded here as a watch-level failure, with a warning below the healthy line of 6% [src:SPGI-RPT1-2026-09-18#p19]. In the first half of 2026, growth was +7% on the reported basis and +6% organic in constant currency [src:SPGI-RPT1-2026-09-18#p4], the lowest of the four segments on the organic constant-currency basis [src:SPGI-RPT1-2026-09-18#p7]; the company's medium-term target is 6%–8%, and the report works with 5%–6% [src:SPGI-RPT1-2026-09-18#p11]."

  - id: SPGI-Q7
    type: quantitative
    claim: The issuance cycle has not turned into a 2022-style ebb
    origin: report:watch
    severity: watch
    covers: [growth]
    pillar: P5
    metric_def:
      id: ratings_billed_issuance_yoy
      description: Year-on-year quarterly growth in the ratings segment's billed issuance
      unit: "%"
      frequency: quarter
      data: filing_text
      where: The ratings segment's billed issuance table in the 10-Q/10-K MD&A (Billed Issuance Volumes); for monthly data, see the ratings billed issuance the company publishes on the 15th of each month (investor relations website, not a filing)
      formula: billed_issuance_q / billed_issuance_{q-4} - 1
    fail_if: Below −15% for two consecutive quarters
    rule: {op: "<", threshold: -15, unit: "%", consecutive: 2, period: quarter}
    warn_if: Outside the healthy range of −10% to +15% (above the top means issuance is at a cyclical high)
    warn_rule: {op: outside, threshold: [-10, 15], unit: "%", consecutive: 1, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: 25
      unit: "%"
      period: 2026Q2
      as_of: 2026-06-30
      source: SPGI-10Q-FY2026Q2#MD&A
      note: "Billed issuance of $1.268 trillion in Q2 and $2.498 trillion in the first half [src:SPGI-10Q-FY2026Q2#MD&A]; about $169 billion in the first half came from hyperscalers [src:SPGI-RPT1-2026-09-18#p17], about 6.8% of first-half billed issuance ($169 billion ÷ $2,498 billion) [src:SPGI-RPT1-2026-09-18#p17] [src:SPGI-10Q-FY2026Q2#MD&A]."
    note: "The second watch indicator in section 11 of the report, published by the company on the 15th of each month [src:SPGI-RPT1-2026-09-18#p19]. The healthy range has a top: above +15% means issuance is at a cyclical high and current earnings still contain the cyclical position, and the report considers this indicator exactly the way to judge “whether the level of ratings transaction revenue is itself above trend” [src:SPGI-RPT1-2026-09-18#p15]. At creation, the reading of +25% was already outside the healthy range, so this test is in a warning state [src:SPGI-RPT1-2026-09-18#p19]. The company's working assumption for full-year hyperscaler issuance is $250 billion to $300 billion [src:SPGI-RPT1-2026-09-18#p16]; the report considers that the real risk lies not in the concentration of these issuers itself but in their ebb setting off a 2022-style broad contraction [src:SPGI-RPT1-2026-09-18#p17]."

  - id: SPGI-Q8
    type: quantitative
    claim: The index fee base is supported by net inflows, not just by rising prices
    origin: report:watch
    severity: watch
    covers: [moat, growth]
    pillar: P2
    metric_def:
      id: index_linked_etf_net_flows
      description: The part of the change in the assets of ETFs linked to S&P Dow Jones indices that comes from net inflows (excluding market price changes)
      unit: USD
      frequency: quarter
      data: external
      where: The breakdown of the change in the index segment's ETF assets (net inflows and market appreciation) in the quarterly earnings slides (investor relations website, not furnished with the 8-K)
    fail_if: Net inflows negative for two consecutive quarters
    rule: {op: "<", threshold: 0, unit: USD, consecutive: 2, period: quarter}
    data: external
    effective_from: FY2026Q3
    first_readable: "2026-10"
    note: "The third watch indicator in section 11 of the report, read from the earnings slides [src:SPGI-RPT1-2026-09-18#p19]. The report gives no net inflow reading for the period; the baseline is to be backfilled from the Q2 2026 earnings slides; in the same period, asset-linked fees rose 22%, a fourth consecutive record quarter [src:SPGI-RPT1-2026-09-18#p7], and passive inflows are at record absolute levels [src:SPGI-RPT1-2026-09-18#p16]."

  - id: SPGI-Q9
    type: quantitative
    claim: Cash conversion holds at a healthy level, and adjusted profit turns into cash
    origin: report:watch
    severity: watch
    covers: [free_cash_flow]
    pillar: P4
    metric_def:
      id: adj_fcf_to_adj_net_income
      description: Adjusted free cash flow as defined by the company (after distributions to noncontrolling interests) ÷ adjusted net income
      unit: "%"
      frequency: year
      data: filing_text
      where: The non-GAAP reconciliation in the annual earnings press release (Adjusted free cash flow, Adjusted net income)
      formula: adjusted_free_cash_flow / adjusted_net_income
    fail_if: Below 90% for two consecutive years
    rule: {op: "<", threshold: 90, unit: "%", consecutive: 2, period: year}
    warn_if: Below the healthy line of 95%
    warn_rule: {op: "<", threshold: 95, unit: "%", consecutive: 1, period: year}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: "2027-02"
    baseline:
      value: 101
      unit: "%"
      period: FY2025
      as_of: 2025-12-31
      source: SPGI-RPT1-2026-09-18#p19
    note: "The fourth watch indicator in section 11 of the report; the healthy line is 95%, and a reading below it is recorded as a warning [src:SPGI-RPT1-2026-09-18#p19]. This is the main test of cash conversion, using the company's adjusted figures; the stalwart template's Q-fcf is kept as SPGI-Q13 (GAAP basis, computed automatically from XBRL) as a backup for this test and SPGI-Q5. SPGI's GAAP net income is after the $1.109 billion of amortization of acquired intangibles in FY2025 and is far below cash earnings [src:SPGI-RPT1-2026-09-18#p5], so readings on the two bases cannot be compared directly. For the break in basis in the FY2026 reading, see SPGI-Q5."

  - id: SPGI-Q10
    type: quantitative
    claim: EPS growth is not being paid for by the balance sheet, and shareholder returns do not exceed free cash flow for long
    origin: report:watch
    severity: watch
    covers: [capital_allocation, balance_sheet, governance]
    pillar: P6
    metric_def:
      id: shareholder_return_to_adj_fcf
      description: (Buybacks + dividends) ÷ adjusted free cash flow as defined by the company (after distributions to noncontrolling interests)
      unit: "%"
      frequency: year
      data: filing_text
      where: The 10-K cash flow statement (buybacks, dividends); the non-GAAP reconciliation in the annual earnings press release (adjusted free cash flow)
      formula: (buybacks + dividends) / adjusted_free_cash_flow
    fail_if: Above 130% for two consecutive years
    rule: {op: ">", threshold: 130, unit: "%", consecutive: 2, period: year}
    warn_if: Outside the healthy range of 85%–110%
    warn_rule: {op: outside, threshold: [85, 110], unit: "%", consecutive: 1, period: year}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: "2027-02"
    baseline:
      value: 113
      unit: "%"
      period: FY2025
      as_of: 2025-12-31
      source: SPGI-RPT1-2026-09-18#p19
      note: "FY2025 buybacks of $5.001 billion and dividends of $1.170 billion [src:SPGI-RPT1-2026-09-18#p8]; 2026 guidance implies about 160% [src:SPGI-RPT1-2026-09-18#p19]."
    note: "The fifth watch indicator in section 11 of the report: above 130% for two consecutive years means EPS growth is being propped up by the balance sheet [src:SPGI-RPT1-2026-09-18#p19]; and according to the compensation overview in the proxy statement, the only quantitative metric in the long-term incentives is adjusted EPS [src:SPGI-RPT1-2026-09-18#p19] [src:SPGI-RPT1-2026-09-18#p9]. The healthy range is 85%–110%, and a reading outside it is recorded as a warning [src:SPGI-RPT1-2026-09-18#p19]; the FY2025 reading of 113% is already outside the range, so the test is in a warning state from creation [src:SPGI-RPT1-2026-09-18#p19]. The roughly $3.2 billion by which 2026 returns exceed free cash flow comes from $1.5 billion of cash from selling the OSTTRA joint venture stake, $361 million of first-half disposal proceeds, and new debt [src:SPGI-RPT1-2026-09-18#p9]; the company's own policy is to return 85% or more of adjusted free cash flow [src:SPGI-RPT1-2026-09-18#p9]. The FY2026 reading has a break in basis: full-year buybacks and dividends occur on the reported basis, while the report's roughly 163% uses post-spin adjusted free cash flow of about $5 billion [src:SPGI-RPT1-2026-09-18#p9]. This test fixes the following before the first reading: numerator and denominator both on the reported basis, with the denominator including Mobility's first-half cash flow, consistent with SPGI-Q5's same-basis requirement; if the company discloses FY2026 adjusted free cash flow only excluding Mobility, FY2026 is recorded as undeterminable and the consecutive count starts from FY2027."

  # ---------- Section 11 of the report: the two forks with a stated time at which they can be read ----------
  - id: SPGI-Q11
    type: quantitative
    claim: The index fee base is not being eroded by the part of the ETF wrapper that needs no license
    origin: report:watch
    severity: watch
    covers: [moat, pricing_power]
    pillar: P2
    metric_def:
      id: asset_linked_fee_growth_minus_us_etf_aum_growth
      description: Year-on-year growth in the index segment's asset-linked fees minus year-on-year growth in total US ETF assets
      unit: pp
      frequency: quarter
      data: mixed
      formula: yoy(asset_linked_fees) - yoy(us_etf_total_assets)
      components:
        asset_linked_fees:
          description: Index segment asset-linked fees
          unit: USD
          where: Schedules to the quarterly earnings press release, or the 10-Q revenue breakdown
        us_etf_total_assets:
          description: Total US ETF assets
          unit: USD
          where: Industry statistics (not a filing)
    fail_if: Asset-linked fee growth persistently lags total US ETF asset growth (the difference persistently negative, counted by this archive as 4 consecutive quarters)
    rule: {op: "<", threshold: 0, unit: pp, consecutive: 4, period: quarter}
    data: mixed
    effective_from: FY2026Q3
    first_readable: "2026-10"
    note: "Fork #7 in section 11 of the report, readable every quarter and currently leaning toward the main branch [src:SPGI-RPT1-2026-09-18#p18]; a persistently negative difference means step 4 of erosion path C (the part of the ETF wrapper that needs no license growing) has materialized [src:SPGI-RPT1-2026-09-18#p18] [src:SPGI-RPT1-2026-09-18#p7]. The report says the step on this path that really needs watching is asset-linked fee growth persistently lagging ETF industry asset growth, which has not happened yet, and it keeps only this one quarterly indicator for indices [src:SPGI-RPT1-2026-09-18#p16]. The report says only “persistently negative” and gives no number of periods; counting 4 consecutive quarters is this archive's operationalization, written down in advance, not a threshold in the report. Only half of the current reading is available: asset-linked fees rose 22% year on year in Q2 2026 [src:SPGI-RPT1-2026-09-18#p7], and the report does not give total US ETF asset growth for the same period, so the difference is to be backfilled. The report's estimate of the size of this leg: asset-linked fee growth lagging ETF industry asset growth by 5 percentage points for three years in a row comes to about −$0.32 per share at a 73% attribution ratio, about a quarter of the Market Intelligence case [src:SPGI-RPT1-2026-09-18#p16]."

  - id: SPGI-Q12
    type: quantitative
    claim: Market Intelligence's margin lever is real, and management can raise the margin
    origin: report:watch
    severity: watch
    covers: [management, unit_economics]
    pillar: P3
    metric_def:
      id: mi_adjusted_operating_margin_fy
      description: Market Intelligence segment full-year adjusted operating margin (as defined by the company)
      unit: "%"
      frequency: year
      data: filing_text
      where: Market Intelligence's adjusted operating profit and revenue in the schedules to the fourth-quarter earnings press release or in the 10-K segment note
      formula: mi_adjusted_operating_profit_fy / mi_revenue_fy
    params: {segment: Market Intelligence, segment_zh: Market Intelligence, basis: "adjusted operating margin (as defined by the company)"}
    fail_if: By FY2028, Market Intelligence's adjusted operating margin below 35% (still around the 34% line, so the lever does not exist)
    rule: {op: "<", threshold: 35, unit: "%", consecutive: 1, period: year, evaluate_on: [FY2028], note: "Judged once, on the FY2028 annual report only; for earlier years the readings are only recorded, not judged; the test retires after the FY2028 judgment."}
    warn_if: By FY2028, between 35% and 38% (not “on the right track”, but not around 34% either)
    warn_rule: {op: "<", threshold: 38, unit: "%", consecutive: 1, period: year, evaluate_on: [FY2028], note: "Judged once, on the FY2028 annual report only; a reading that is also below the failure line counts as a failure."}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: "2029-02"
    baseline:
      value: 33
      unit: "%"
      period: FY2025
      as_of: 2025-12-31
      source: SPGI-RPT1-2026-09-18#p4
      note: "Recast basis; 34% in Q2 2026 [src:SPGI-RPT1-2026-09-18#p17]."
    note: "Fork #2 in section 11 of the report: by FY2028, going from 34% to 38% or more means it is on the right track, still around 34% means the lever does not exist, and it currently leans toward mediocre [src:SPGI-RPT1-2026-09-18#p18]. This test judges on the report's three bands: 38% or more passes, below 35% fails, and in between is a warning, where the 35% line is this archive's advance operationalization of “around 34%”, which the report does not give [src:SPGI-RPT1-2026-09-18#p18]. It is judged only once, in FY2028, as written in the evaluate_on of rule and warn_rule. The metric is defined here on a full-year basis because the registry's segment_operating_margin is a quarterly metric, while this test is judged annually. This is the largest margin lever in the group: each 5 percentage points of Market Intelligence margin is worth about +$0.62 per share, and after two restructurings the margin is still around 34% [src:SPGI-RPT1-2026-09-18#p11] [src:SPGI-RPT1-2026-09-18#p12]. One of the report's conditions for moving management from “ordinary” to “excellent” is Market Intelligence's adjusted margin rising to 38% or more within two full fiscal years [src:SPGI-RPT1-2026-09-18#p20]."

  # ---------- Added by this archive: a proxy for permanent-loss path #3 (a credibility shock) ----------
  - id: SPGI-L7
    type: qualitative
    claim: Rating standards have not given way to market share, and S&P's ratings have not again drawn enforcement related to rating standards or conflicts of interest
    origin: manual
    severity: watch
    covers: [governance, regulation, culture]
    pillar: P1
    question: Has S&P's 10-Q/10-K for this period (the legal proceedings section and the commitments and contingencies note), any 8-K, or an announcement by the SEC, the Justice Department or another ratings regulator disclosed for the first time, after 2026-09-18, a new regulatory investigation, enforcement action, settlement or business suspension concerning S&P Global Ratings, on grounds involving the application of rating standards or methodologies, conflicts of interest (for example adjusting ratings to win business) or rating quality?
    fail_if: Yes. Violations that concern only record-keeping or reporting procedures and are unrelated to rating standards do not count and are recorded by the company manager; if the legal proceedings section of this period's filings was not read, it is recorded as undeterminable
    judge: independent_model
    evidence: required
    where: The legal proceedings section and the commitments and contingencies note of S&P's 10-Q/10-K, 8-Ks; enforcement announcements by the SEC and the Justice Department; announcements by other ratings regulators
    lookback: 4
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: "Enforcement related to rating standards recorded in the report: in 2011 it loosened its CMBS rating standards to win business and concealed this from investors, and in January 2015 it settled with the SEC for more than $58 million and was suspended from rating for a year"
      source: SPGI-RPT1-2026-09-18#p10
      note: "The earlier structured finance case hit profit through settlements of about $1.5 billion (in 2015, $1.375 billion with the Justice Department and the states, plus $125 million with CalPERS) [src:SPGI-RPT1-2026-09-18#p17]."
    note: "Added by this archive, for permanent-loss path #3 (a credibility shock) and fork #6 (whether standards will give way to market share; no date can be set for reading it, and it cannot be judged) [src:SPGI-RPT1-2026-09-18#p18]. Fork #6 itself has no yes-or-no question that filings can answer; this test uses as a proxy the earliest form in which it can show up in documents, namely new enforcement related to rating standards or conflicts of interest, with the question and scope written down before the first judgment. The report lists a credibility shock as one of two kinds of shock: what it cost was one-time cash, and the ratings' standing was not collectively abandoned because of it [src:SPGI-RPT1-2026-09-18#p17], so this test is watch, not breaker. The report considers today's testing ground to be private ratings, whose revenue is growing 60%, just as regulators have gained the power to overturn ratings [src:SPGI-RPT1-2026-09-18#p10]."

