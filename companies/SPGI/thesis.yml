thesis:
  summary: "S&P Global sells reference points that others have written into contracts, mandates and regulation [src:SPGI-RPT1-2026-09-18#p2]. Ratings and indices are its market toll booths: in FY2025, on the company's recast basis without Mobility, they earned adjusted operating margins of 65% and 70% and together brought in 61.8% of the four divisions' adjusted operating profit on 47.7% of their revenue (this archive's computation, while the company rounds the parts to 43% + 18% and 34% + 13%) [src:SPGI-8KA-2026-07-06#EX99.1-p1] [src:SPGI-8KA-2026-07-06#EX99.1-p13]. Platts is the same kind of business, but the company discloses no margin for Platts alone, and the Energy division that contains it earned a 46% adjusted operating margin [src:SPGI-8KA-2026-07-06#EX99.1-p13]. Bundled with them is a data subscription business, Market Intelligence: 34% of FY2025 recast revenue at a 33% adjusted operating margin (34% in the first half of 2026 and 36% in Q2 2026), as the company rounds them [src:SPGI-8KA-2026-07-06#EX99.1-p1] [src:SPGI-8K-2026-07-28#EX99.1-Exh6], whose pricing power the interface layer of AI workflows is calling into question [src:SPGI-RPT1-2026-09-18#p7]. The business needs almost no further investment: FY2025 capex was 1.3% of revenue [src:SPGI-10K-FY2025#p81] [src:SPGI-10K-FY2025#p78], and adjusted free cash flow was 100.7% of adjusted net income (FY2025 as reported, including Mobility, this archive's computation) [src:SPGI-8K-2026-02-10#EX99-Exh7] [src:SPGI-8K-2026-02-10#EX99-Exh5]. Every widening of the moat was written in by regulators or third parties, into their own obligations, on its behalf, and filling it in would not need its consent either [src:SPGI-RPT1-2026-09-18#p2]. The thesis fears three things most: customers starting to negotiate prices for Market Intelligence data by the number of calls rather than by the seat, private credit and regulation costing ratings their recognized status, and mistaking the cyclical profit of an issuance cycle running above its healthy range for a trend [src:SPGI-RPT1-2026-09-18#p16]."
  pillars:
    - id: P1
      claim: "The standing of ratings is fixed by regulatory references and issuer-pays contracts, not by product quality [src:SPGI-RPT1-2026-09-18#p6]: in the first half of 2026 ratings non-transaction revenue was $1.183 billion, up 10% as the company rounds it (9.5%) and 44.8% of segment revenue (this archive's computation) [src:SPGI-8K-2026-07-28#EX99.1-Exh7] [src:SPGI-8K-2026-07-28#EX99.1-Exh8], and in the 2022 issuance drought it fell only 2% (1.9%) [src:SPGI-10K-FY2022#p49]. Excluding government securities, the three largest agencies held 81.5% of ratings outstanding at the end of 2022 and 78.6% at the end of 2023, a reading affected by DBRS moving ratings from the government category to asset-backed securities [src:SEC-OCR-2024-02#p25] [src:SEC-OCR-2025-01#p23] [src:SEC-OCR-2025-01#p26]; on all ratings they held 94.0% at the end of 2022, 94.15% at the end of 2023 and 93.38% at the end of 2024, so the smaller agencies' share stopped growing in 2023 and grew again in 2024 [src:SEC-OCR-2024-02#p24] [src:SEC-OCR-2025-01#p21] [src:SEC-OCR-2026-04#p18]. The claim that rating standards do not give way to market share has one recent record against it: in November 2022 the SEC found that in 2017 S&P Global Ratings let commercial staff take part in rating one jumbo RMBS transaction, in breach of the NRSRO conflict-of-interest rules, and S&P, which had reported the conduct itself, paid a $2.5 million penalty and was censured without admitting or denying the findings [src:SEC-PR-2022-205]. It shows that the separation of sales from analysis failed at least once after the 2015 settlements; it does not show a pattern, a loosening of criteria or a loss of regulatory standing."
      source: SPGI-8K-2026-07-28#EX99.1-Exh7
    - id: P2
      claim: "Indices and Platts are written into contracts through third-party products and settlement [src:SPGI-RPT1-2026-09-18#p7]: in the first half of 2026 index revenue grew 18% (18.2%) at a 72% adjusted operating margin, as the company rounds them [src:SPGI-8K-2026-07-28#EX99.1-Exh6], and in Q2 2026 asset-linked fees grew 22% (21.7%) to $348 million, a new quarterly high for the fourth quarter in a row ($303 million, $329 million, $340 million and $348 million from Q3 2025 to Q2 2026, the first and third derived from full-year and half-year figures) [src:SPGI-8K-2026-07-28#EX99.1-Exh7] [src:SPGI-8K-2026-02-10#EX99-Exh6]; the company called it a fourth consecutive record quarter on the call [src:SPGI-CALL-FY2026Q2]. Exchanges pay S&P royalties for licensing Platts price assessments, which Platts-based exchange contracts use [src:SPGI-10K-FY2025#Item1] [src:SPGI-10Q-FY2026Q2#p51]. ACER's LNG benchmark, published every weekday since 2023-03-31 and a permanent ACER task under REMIT since 2025-01-01 [src:ACER-LNG-2025] [src:EU-REG-2024-1106#Art1-10], is available for voluntary use [src:ACER-LNG-2025], and in the report's judgment it has shown no sign of replacing Platts [src:SPGI-RPT1-2026-09-18#p7]."
      source: SPGI-8K-2026-07-28#EX99.1-Exh7
    - id: P3
      claim: "Market Intelligence's pricing power has not been taken apart by AI workflows [src:SPGI-RPT1-2026-09-18#p7]: in FY2025, on the recast basis, it contributed 22% of the four divisions' adjusted operating profit on 34% of their revenue, as the company rounds them [src:SPGI-8KA-2026-07-06#EX99.1-p1], and in the first half of 2026 its organic constant-currency growth was 6% (6.4%), third of the four divisions: below Indices (18%) and Ratings (14%), above Energy (4%) [src:SPGI-8K-2026-07-28#EX99.1-Exh8]. The company is plugging its data into large-model interfaces itself, through Kensho LLM-ready APIs and MCP-connected solutions [src:SPGI-8KA-2026-07-06#EX99.1-p3], which the report reads as a deliberate migration, but it has not disclosed what one call is worth [src:SPGI-RPT1-2026-09-18#p11] [src:SPGI-RPT1-2026-09-18#p12]."
      source: SPGI-8K-2026-07-28#EX99.1-Exh8
    - id: P4
      claim: "Accounting profit is cash, and the business needs almost no further investment: FY2025 adjusted free cash flow was $5.481 billion and adjusted net income $5.441 billion, a ratio of 100.7% (116.5% in FY2024, both years as reported, including Mobility, this archive's computation) [src:SPGI-8K-2026-02-10#EX99-Exh7] [src:SPGI-8K-2026-02-10#EX99-Exh5]. FY2025 capex was 1.3% of revenue, against 0.9% in FY2024 and 0.8% in the first half of 2026 (this archive's computation) [src:SPGI-10K-FY2025#p81] [src:SPGI-10K-FY2025#p78] [src:SPGI-10Q-FY2026Q2#p7] [src:SPGI-10Q-FY2026Q2#p4]. GAAP earnings sit below cash earnings chiefly because of $1.109 billion of deal-related amortization in FY2025 (the income statement's amortization of intangibles was $1,069 million, and the rest is booked in equity income from the OSTTRA joint venture) [src:SPGI-8K-2026-02-10#EX99-Exh5] [src:SPGI-10K-FY2025#p78]."
      source: SPGI-8K-2026-02-10#EX99-Exh7
    - id: P5
      claim: "The cycle weighs on the year's profit, not on the business itself: in the first half of 2026 about 64 cents (64.1) of every $1 of pro forma revenue was subscription, ratings non-transaction or recurring variable revenue, which this archive groups as contractual recurring revenue [src:SPGI-8K-2026-07-28#EX99.1-Exh7]; in the 2022 issuance drought ratings segment revenue fell 26% and operating profit 36%, while non-transaction revenue fell only 2%, as the company rounds them (25.6%, 36.4% and 1.9%) [src:SPGI-10K-FY2022#p49]; through the cycle, growth still falls within the stalwart range, and the company's medium-term target is 7%–9% average annual organic constant-currency revenue growth, excluding Mobility and assuming issuance and market appreciation in line with historical averages [src:SPGI-8K-2025-11-13#EX99]."
      source: SPGI-10K-FY2022#p49
    - id: P6
      claim: "Management's capital allocation at least does not destroy value [src:SPGI-RPT1-2026-09-18#p9]: the Mobility spin-off, announced on 2025-04-29 for completion within 12 to 18 months, was completed on 2026-07-01 [src:SPGI-8K-2025-04-29#EX99.2] [src:SPGI-8K-2026-07-02#Item2.01], OSTTRA and the EDM and thinkFolio businesses were sold in October 2025 and January 2026 [src:SPGI-10K-FY2025#Note2] [src:SPGI-10Q-FY2026Q2#Note2], and buybacks are shrinking the 113.8 million shares issued in the 2022 all-stock acquisition of IHS Markit [src:SPGI-10K-FY2022#Note2]. What the thesis needs is for shareholder returns to come back into the healthy range the report gives and no longer depend on asset sales and borrowing, and today's readings do not yet support this [src:SPGI-RPT1-2026-09-18#p19]. The report's healthy range is 85%–110% of adjusted free cash flow [src:SPGI-RPT1-2026-09-18#p19]; the company's medium-term framework is to return about 85% [src:SPGI-8K-2025-11-13#EX99], but for 2026 it now expects to return 100% or more (April 2026) and to buy back more than $7 billion of stock (July 2026) [src:SPGI-8K-2026-04-28#EX99-p1] [src:SPGI-8K-2026-07-28#EX99.1-p1]; in FY2025 it returned 113% as the company rounds it (112.6%) [src:SPGI-8K-2026-02-10#EX99-p1] [src:SPGI-10K-FY2025#p81]. 2026 shareholder returns of at least about $8.1 billion are about 163% of the owner's report's estimate of $5.0 billion of post-spin adjusted free cash flow, which no company document states, and about 150% (149%–155%) of calendar-2026 adjusted free cash flow on the company's reporting basis: the first half's $2.36 billion including Mobility plus the $2.9–3.1 billion guided for the second half on the Q2 call, as carried by third-party transcripts (this archive's computation, F15) [src:SPGI-8K-2026-07-28#EX99.1-p1] [src:SPGI-10Q-FY2026Q2#p7] [src:SPGI-8K-2026-07-28#EX99.1-Exh8] [src:SPGI-CALL-FY2026Q2] [src:SPGI-RPT1-2026-09-18#p9]. The excess has been funded by asset sales (OSTTRA, $1.5 billion in cash in October 2025, and $361 million of disposals in the first half of 2026) and by a $1.974 billion cash distribution from Mobility Global at the spin-off, which Mobility Global financed with $2.0 billion of its own notes that left with it [src:SPGI-10K-FY2025#Note2] [src:SPGI-10Q-FY2026Q2#p7] [src:SPGI-8KA-2026-07-06#EX99.2-noteb] [src:SPGI-10Q-FY2026Q2#Note4]; S&P Global's own debt excluding those notes was $13.17 billion at 2026-06-30, about the same as the $13.088 billion at the end of 2025 [src:SPGI-WEB-2026-07-28-2#p9] [src:SPGI-10Q-FY2026Q2#Note4]. For the second half, management said on the Q2 call that it expects to issue about $2 billion of additional debt to fund further buybacks (carried by third-party transcripts, not in the filings) [src:SPGI-CALL-FY2026Q2]: a plan, not yet a record. The report's reading on the standard “are shareholder returns offset by new debt or share issuance” is that they are offset [src:SPGI-RPT1-2026-09-18#p20]. This pillar is guarded by SPGI-Q3, SPGI-Q10, SPGI-Q14 and SPGI-L6."
      source: SPGI-8K-2026-07-28#EX99.1-p1
  # Munger inversion list: how a permanent loss could happen (from section 9's “the strongest reason not to buy it”, section 3's erosion paths and “where the evidence is thinnest”)
  permanent_loss_paths:
    - "Market Intelligence's pricing is taken apart: AI agents and workflows make customers stop caring where the data comes from, the subject of renewal negotiations changes from “irreplaceable data” to “an input whose price can be compared”, and the pricing unit changes from seats to calls, with unit prices set by someone else [src:SPGI-RPT1-2026-09-18#p7] [src:SPGI-RPT1-2026-09-18#p16]. It would show up first as existing customers paying less at renewal, not as customers leaving: with retention unchanged, a 15% fall in revenue per customer comes to about −$1.35 per share, about −8.2% [src:SPGI-RPT1-2026-09-18#p12], and the company does not disclose Market Intelligence's retention rate (none in the FY2025 10-K, the Q2 2026 10-Q or the 2026 earnings releases) [src:SPGI-10K-FY2025#Item7] [src:SPGI-10Q-FY2026Q2#Item2]."
    - "Ratings get bypassed or lose regulatory recognition: private credit is about $1.7 trillion and forecast to reach about $2.8 trillion in 2028, figures the report takes without dates from Preqin, Morgan Stanley and BlackRock research (L2 only, no primary data seen) [src:SPGI-RPT1-2026-09-18#p7]. From 2026-01-01 the NAIC's Securities Valuation Office may challenge a rating used for filing exemption, the route by which a rating becomes an NAIC designation without SVO review, when it considers the rating an unreasonable assessment of investment risk [src:NAIC-SVO-2026#p5]; if its own designation differs by at least three notches it may ask for the rating's removal from filing exemption, a group of state regulators decides, and the NAIC says it cannot unilaterally reject or override a rating [src:NAIC-BRIEF-2026-03#p1] [src:NAIC-BRIEF-2026-03#p2]. The two routes differ in the size of the consequence. If the filing-exempt route as a whole tightens and external ratings of private credit are no longer accepted by regulators, what is lost is the increment of ratings profit that comes from private markets, that is, the report's section 3 upper-bound case in which private ratings go to zero, about 2.7%–5.4% of base-year owner earnings per share [src:SPGI-RPT1-2026-09-18#p16] [src:SPGI-RPT1-2026-09-18#p8]; if a major jurisdiction formally legislates away issuer-pays or mandates rotation of rating agencies, what is directly at stake is Ratings' 43% of FY2025 adjusted segment operating profit, as the company rounds it (43.4%, recast, before corporate expense) [src:SPGI-8KA-2026-07-06#EX99.1-p1] [src:SPGI-8KA-2026-07-06#EX99.1-p13]."
    - "A credibility shock: it has a record of loosening standards under competitive pressure. In 2011 it rated six conduit fusion CMBS transactions with a methodology different from the one it had disclosed, which the SEC described as loosening its criteria to obtain business and obscuring the change from investors; in January 2015 it settled for more than $58 million with the SEC, plus $19 million with the New York and Massachusetts attorneys general, and agreed to a one-year timeout from rating conduit fusion CMBS only [src:SEC-PR-2015-10]. Its ratings of 2004–2007 RMBS and CDOs ended in settlements agreed on 2015-02-03, $1.375 billion with the Justice Department, 19 states and the District of Columbia and $125 million with CalPERS over three structured investment vehicles, charged to 2014 results [src:SPGI-8K-2015-02-03#Item1.01] [src:SPGI-8K-2015-02-03#Item2.02]. In November 2022 the SEC found conflict-of-interest violations on one self-reported 2017 RMBS rating, with a $2.5 million penalty and a censure [src:SEC-PR-2022-205]: a single case, but it shows that the separation of sales from analysis can still fail. Today's testing grounds are private ratings, whose revenue grew 60% year on year in Q2 2026 by the company's account on the earnings call (amount not disclosed, not in the filings, slides or supplemental disclosure, and carried by third-party transcripts) [src:SPGI-CALL-FY2026Q2], and ratings of the hyperscalers' debt [src:SPGI-RPT1-2026-09-18#p10] [src:SPGI-RPT1-2026-09-18#p18]; if it slips again and invites regulators to rewrite issuer-pays or rating references, a one-time fine would become a permanent loss of standing."
    - "Mistaking the cycle for a trend, then buying back stock with borrowed money: ratings' transaction fees, the indices' asset-linked fees and the doubts over Market Intelligence all hang on the same AI capex story, and whether that story succeeds or fails, the four divisions will not all benefit at once [src:SPGI-RPT1-2026-09-18#p16]; a 2022-style issuance drought would cut that year's EPS by about $2.94, about −18% [src:SPGI-RPT1-2026-09-18#p6]. A multi-year drought across all issuance, or 10-year Treasury yields above 5% for years, has no precedent since 2008 [src:SPGI-RPT1-2026-09-18#p21]: the 10-year par yield closed above 5% on no trading day from 2008 through 2025 and first did so again on 2026-09-16 (5.01%), having been above 5% throughout 2000 and for weeks in 2006 and 2007 [src:UST-PARYIELD-2026-09-16]; the nearest issuance precedent is the 2008–2009 structured-finance drought, when revenue of Credit Market Services, the ratings business of the time, fell 22.5% in 2008 and 0.4% in 2009 while corporate ratings revenue rose in 2009 [src:SPGI-10K-FY2009#EX13-p44]. Meanwhile, 2026 shareholder returns of at least about $8.1 billion are about 163% of the owner's report's estimate of $5.0 billion of post-spin adjusted free cash flow and about 150% (149%–155%) of calendar-2026 adjusted free cash flow on the company's reporting basis, the second-half part of which was heard only on the Q2 call (this archive's computation, F15) [src:SPGI-8K-2026-07-28#EX99.1-p1] [src:SPGI-8K-2026-07-28#EX99.1-Exh8] [src:SPGI-CALL-FY2026Q2] [src:SPGI-RPT1-2026-09-18#p9]; the excess is funded by asset sales and by a $1.974 billion cash distribution from Mobility Global, whose $2.0 billion of notes left with it [src:SPGI-8KA-2026-07-06#EX99.2-noteb] [src:SPGI-10Q-FY2026Q2#Note4], and for the second half management said on the Q2 call that it expects to issue about $2 billion of additional debt to fund further buybacks (carried by third-party transcripts) [src:SPGI-CALL-FY2026Q2]. S&P Global's total debt rose from $4.114 billion at the end of 2021 to $13.088 billion at the end of 2025 [src:SPGI-10K-FY2022#p77] [src:SPGI-10K-FY2025#p80], and excluding the Mobility notes it was $13.17 billion at 2026-06-30 [src:SPGI-WEB-2026-07-28-2#p9]."
    - "Benchmarks dropped by third parties: the part of the ETF wrapper that needs no license is growing, and active ETFs took about 35%–39% of 2026 inflows to September, per third-party flow data (J.P. Morgan, State Street and Goldman Sachs, as cited by the owner's report, L2 only, no primary data seen) [src:SPGI-RPT1-2026-09-18#p16]; the company's own reading of the same market is that ETF assets linked to its indices rose 34% in the year to 2026-06-30, to $6.35 trillion, with $605 billion of net inflows and $1,010 billion of price appreciation [src:SPGI-WEB-2026-07-28-1#p10]. In October 2012 the boards of Vanguard's funds approved moving index funds from MSCI to FTSE and CRSP benchmarks, about $537 billion in 22 funds per the owner's report and press accounts of Vanguard's release (L2 only) [src:VANGUARD-497-2012-10-02] [src:SPGI-RPT1-2026-09-18#p7], and the funds switched during 2013 [src:VANGUARD-497-2013-01-31]. A provider's name in a product's name did not stop the switch: Vanguard Mega Cap 300 Index Fund became Vanguard Mega Cap Index Fund, and Vanguard MSCI Emerging Markets ETF became Vanguard FTSE Emerging Markets ETF [src:VANGUARD-497-2012-10-02-3] [src:VANGUARD-497-2012-10-02-2]. If exchanges switch the settlement price of flagship energy contracts from Platts to their own prices, or ACER's LNG benchmark makes it into mainstream contracts, Platts's position, which rests on industry practice, will loosen [src:SPGI-RPT1-2026-09-18#p19]."

