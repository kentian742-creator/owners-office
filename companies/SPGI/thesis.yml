# 生成方式：先套林奇 stalwart 模板与 _common 时效测试，再逐条补入 02 报告第 11 节的
# 六条论点破坏者（severity: breaker）与五个每季度前瞻指标（severity: watch）；
# 第 11 节七个岔路口里，报告明说“每季度”可读、并称为指数唯一季度指标的 #7，和到 FY2028 判定的 #2，也写成 watch。
# 门槛按报告原文；报告没给门槛的地方在测试 note 里写明本档案的操作化方式，并且都在首次判定之前写下。
# 超出报告字面的两处也在 note 里注明，待总部确认：SPGI-L2 的 (b) 支（通道整体收紧），SPGI-L3 把有约束力的最终规则算作正式立法。
# 模板 stalwart 的五条测试全部保留：Q-growth→SPGI-Q1、Q-returns→SPGI-Q2、Q-buyback→SPGI-Q3、Q-fcf→SPGI-Q13、L-guidance→SPGI-L1，改写处见各自 note。
# 次类 cyclical 模板：采用 Q-leverage（SPGI-Q14）与 L-cycle-capalloc（SPGI-L6）；Q-cycle 看信用损失拨备，SPGI 不放贷，不适用，没有采用。
# 本档案自加一条（origin: manual）：SPGI-L7，永久亏损路径 #3（可信度冲击）的代理测试。
# 与价格有关的一切（区间、参考价、对价格的评级、折现参数）只在私有仓库 owners-office-private/companies/SPGI/valuation.yml。
