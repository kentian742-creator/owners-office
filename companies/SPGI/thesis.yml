tests:
  # ---------- Lynch stalwart template (all five kept: SPGI-Q1, Q2, Q3, Q13, L1) ----------
  - id: SPGI-Q1
    type: quantitative
    claim: Growth has not slipped out of the stalwart range
    origin: template:stalwart
    severity: watch
    covers: [growth]
    pillar: P5
    metric: revenue_growth_organic_cc
    fail_if: Below 5% for 4 consecutive quarters
    rule: {op: "<", threshold: 5, unit: "%", consecutive: 4, period: quarter}
    warn_if: Below 6.5% for 2 consecutive quarters
    warn_rule: {op: "<", threshold: 6.5, unit: "%", consecutive: 2, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: 10
      unit: "%"
      period: 1H26
      as_of: 2026-06-30
      source: SPGI-8K-2026-07-28#EX99.1-Exh8
      note: "Pro forma (excluding Mobility), organic constant-currency basis, as the company rounds it (10.0% on exact figures: $7,276 million against $6,615 million) [src:SPGI-8K-2026-07-28#EX99.1-Exh8]. In the report's reading the outperformance came mainly from the issuance cycle [src:SPGI-RPT1-2026-09-18#p9]: ratings transaction revenue grew 19.8% ($1,458 million against $1,217 million), which the 10-Q attributes to strong investment-grade issuance [src:SPGI-10Q-FY2026Q2#p47] [src:SPGI-10Q-FY2026Q2#p48] [src:SPGI-8K-2026-07-28#EX99.1-Exh7]."
    note: "The failure line is the template default. The warning line is changed from the template's 8% to 6.5%: in the growth path in section 7 of the report, revenue growth is taken as 6.5% for years 1–5 and 5.0% for years 6–10, deliberately below the bottom of the company's 7%–9% medium-term target [src:SPGI-8K-2025-11-13#EX99], on the reasoning that a medium-term target set at a cyclical high should not be used as a ten-year average [src:SPGI-RPT1-2026-09-18#p11]. The target table on the same page calls 6.5% the “ten-year average revenue growth”, which is inconsistent with this breakdown, by which the ten-year average is about 5.75% [src:SPGI-RPT1-2026-09-18#p11]; this test takes the years 1–5 figure of 6.5% as its warning line, and growth between that and the 7% bottom of the target range is not a warning for this thesis [src:SPGI-RPT1-2026-09-18#p11]. The metric is organic constant-currency growth as defined by the company, not the registry's reported revenue year on year: the revenue series was broken by the IHS Markit merger in 2022 [src:SPGI-10K-FY2022#Note2] and again by the Mobility spin-off on 2026-07-01 [src:SPGI-8K-2026-07-02#Item2.01], and for the four quarters after the spin-off, reported year-on-year figures would mix in a base that includes Mobility."

  - id: SPGI-Q2
    type: quantitative
    claim: Return on invested capital on the report's basis holds at the level of an excellent business, and the price paid for IHS Markit in 2022 has not become a drag on returns
    origin: template:stalwart
    severity: watch
    covers: [returns_on_capital, capital_allocation]
    pillar: P4
    metric_def:
      id: roic_adjusted_incl_redeemable_nci
      description: "Return on invested capital on the report's basis = after-tax adjusted operating profit ÷ year-end invested capital; invested capital = shareholders' equity + total debt + redeemable noncontrolling interests − cash; the tax rate is fixed in advance at 0.223 and stays the same every year (reasons in the note)"
      unit: "%"
      frequency: year
      data: filing_text
      where: The non-GAAP reconciliation in the annual earnings press release (adjusted operating profit); the 10-K balance sheet (shareholders' equity, short-term and long-term debt, redeemable noncontrolling interests, cash and cash equivalents)
      formula: adjusted_operating_profit * (1 - 0.223) / (equity + total_debt + redeemable_noncontrolling_interest - cash)
    fail_if: Below 12% for 2 consecutive years
    rule: {op: "<", threshold: 12, unit: "%", consecutive: 2, period: year}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: "2027-02"
    baseline:
      value: 12.6
      unit: "%"
      period: FY2025
      as_of: 2025-12-31
      source: SPGI-8K-2026-02-10#EX99-Exh5
      note: "Adjusted operating profit of $7.730 billion (FY2025 as reported, including Mobility) [src:SPGI-8K-2026-02-10#EX99-Exh5], $6.006 billion after tax at 22.3%, over invested capital of $47.495 billion = total equity $31.235 billion (including $108 million of noncontrolling interests) + total debt $13.088 billion + redeemable noncontrolling interests $4.917 billion − cash $1.745 billion, all at 2025-12-31 (this archive's computation) [src:SPGI-10K-FY2025#p80]."
    note: "Replaces the registry metric roic (GAAP operating profit, average invested capital) used by the stalwart template's Q-returns; the threshold is the template default. There are two reasons. GAAP operating profit is after the $1.109 billion of deal-related amortization in FY2025 (the income statement's amortization of intangibles was $1,069 million), which the report adds back as a non-cash item [src:SPGI-8K-2026-02-10#EX99-Exh5] [src:SPGI-10K-FY2025#p78] [src:SPGI-RPT1-2026-09-18#p5]; and the 27% of S&P Dow Jones Indices held by CME Group is shown as redeemable noncontrolling interests, $4.917 billion at the end of 2025, and belongs in invested capital [src:SPGI-10K-FY2025#Note9] [src:SPGI-10K-FY2025#p80]. So the metric is defined here on the report's basis. This test does not measure the capital efficiency of the business itself: at 2025-12-31 goodwill and other intangible assets of $52.746 billion equal 111% of invested capital, so tangible invested capital is negative (about −$5.3 billion, this archive's computation) [src:SPGI-10K-FY2025#p80], and the reading mainly measures how much of the consideration for IHS Markit, acquired on 2022-02-28 [src:SPGI-10K-FY2022#Note2], has been earned back [src:SPGI-RPT1-2026-09-18#p5]; covers therefore records capital_allocation rather than the template's moat. The tax rate is fixed before the first reading at 22.3%, the rate implied by the report's FY2025 baseline and the company's FY2025 adjusted effective tax rate: adjusted operating profit of $7.730 billion, $6.006 billion after tax [src:SPGI-8K-2026-02-10#EX99-Exh5] [src:SPGI-RPT1-2026-09-18#p5]. The baseline is only 0.6 percentage points above the 12% failure line, so the choice of tax rate is enough to change the conclusion: with the effective tax rate of about 24.5% that the report uses elsewhere, the same baseline would be about 12.3% [src:SPGI-RPT1-2026-09-18#p5] [src:SPGI-RPT1-2026-09-18#p13]; the tax rate is therefore fixed, and every later year is computed at the same rate, not at that year's actual rate."

  - id: SPGI-Q3
    type: quantitative
    claim: Buybacks are truly shrinking the share count, not offsetting stock-based compensation or merely buying back the shares issued in 2022
    origin: template:stalwart
    severity: watch
    covers: [capital_allocation]
    pillar: P6
    metric: diluted_shares_yoy
    fail_if: Above 0 for 2 consecutive years
    rule: {op: ">", threshold: 0, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: "2027-02"
    note: "The threshold is the template default. The 2022 consideration for IHS Markit was paid in stock, with cash only in lieu of fractional shares: 113.8 million shares at an exchange ratio of 0.2838, issued when the merger closed on 2022-02-28 [src:SPGI-10K-FY2022#Note2]; the GAAP diluted weighted-average share count rose from 241.8 million in 2021 [src:SPGI-10K-FY2022#Note10] to 305.1 million in 2025 [src:SPGI-10K-FY2025#Note10], and was 295.5 million in Q2 2026 [src:SPGI-10Q-FY2026Q2#Note9]. The report gives no year-on-year reading; the baseline is to be backfilled from the XBRL of the Q2 2026 10-Q. The 2026 buyback target is more than $7 billion, of which $1.5 billion was executed in the first half [src:SPGI-8K-2026-07-28#EX99.1-p1] [src:SPGI-10Q-FY2026Q2#p7]."

  - id: SPGI-Q13
    type: quantitative
    claim: Profit turns into cash (a backup check on the GAAP basis)
    origin: template:stalwart
    severity: watch
    covers: [free_cash_flow]
    pillar: P4
    metric: fcf_conversion
    fail_if: Below 70% for 2 consecutive years
    rule: {op: "<", threshold: 70, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: "2027-02"
    note: "The stalwart template's Q-fcf, with the template's default threshold. It measures the same thing as SPGI-Q5 and SPGI-Q9 on a different basis: the numerator is operating cash flow minus capex and the denominator is GAAP net income, all computable directly from XBRL, without depending on the company's own “adjusted” definitions and without calling a model, so it runs as usual while model calls are paused for candidate companies. SPGI's GAAP net income is after $1.069 billion of amortization of intangibles in FY2025 ($1.109 billion of deal-related amortization on the company's adjusted basis) and is far below cash earnings [src:SPGI-10K-FY2025#p78] [src:SPGI-8K-2026-02-10#EX99-Exh5], so this test's reading will be systematically higher than SPGI-Q5 and SPGI-Q9, and the 70% threshold is loose; it is a backup and does not replace those two. The report gives no reading on the GAAP basis; the baseline is to be backfilled from the XBRL of the FY2025 10-K. FY2026 cash flow includes Mobility for the first half [src:SPGI-10Q-FY2026Q2#Note1]; as with SPGI-Q5, judging requires the numerator and denominator on the same basis, and when same-basis figures cannot be obtained, the result is recorded as undeterminable."

  - id: SPGI-L1
    type: qualitative
    claim: Management has not lowered its published medium-term financial targets
    origin: template:stalwart
    severity: watch
    covers: [management]
    pillar: P6
    question: In this period's documents, did management lower or withdraw the medium-term financial targets it published earlier (the medium-term organic revenue growth targets for the company as a whole and for each of the ratings, index, Market Intelligence and energy segments)? Lowering either the top or the bottom of a range counts as lowering.
    fail_if: Yes, whether or not new targets are given at the same time; targets restated on a like-for-like basis only because of portfolio changes (for example the Mobility spin-off or businesses moving between segments) do not count as lowering
    judge: independent_model
    evidence: required
    where: The earnings 8-K's press release and schedules, earnings call materials, investor day materials, the 10-K/10-Q MD&A
    lookback: 4
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: "Medium-term targets for organic constant-currency revenue growth, average annual, excluding Mobility, set at the 2025-11-13 Investor Day and assuming issuance (for Ratings) and market appreciation (for Indices) in line with historical annual averages: company 7%–9%, indices 10%–12%, ratings 6%–9%, Market Intelligence 6%–8%, energy 6%–8% [src:SPGI-8K-2025-11-13#EX99]"
      source: SPGI-8K-2025-11-13#EX99
      note: "The division targets were set before the July 2026 recast moved 451 Research and Maritime & Trade from Market Intelligence to Energy [src:SPGI-8K-2026-07-28#EX99.1-Exh6]; none of the later filings read for this archive restates them: the releases of 2026-02-10, 2026-04-28 and 2026-07-28, the 8-Ks of 2026-05-07, 2026-05-12 and 2026-07-06, the 8-K/A of 2026-07-06 and the Q2 2026 10-Q [src:SPGI-8K-2026-02-10#EX99-Outlook] [src:SPGI-8K-2026-04-28#EX99-Outlook] [src:SPGI-8K-2026-05-07#EX99.1] [src:SPGI-8K-2026-05-12#EX99.1] [src:SPGI-8K-2026-07-06#EX99.1] [src:SPGI-8KA-2026-07-06#EX99.1-p1] [src:SPGI-10Q-FY2026Q2#Item2]. After the spin-off, on 2026-07-28, full-year 2026 adjusted EPS guidance was reset to $17.50–17.75, excluding Mobility [src:SPGI-8K-2026-07-28#EX99.1-p3], and the 2026 guidance for organic constant-currency growth was raised for Ratings from 4%–7% to 5%–8% and for Indices from 10%–12% to 12%–14% [src:SPGI-WEB-2026-07-28-2#p18]."
    note: "Rewrites the threshold of the stalwart template's L-guidance. The template says “yes, and no testable new target given at the same time”: as written, an ordinary cut (lowering the target while giving a lower new range) would be recorded as a pass because a new target was given, which contradicts the claim. This test records any cut or withdrawal as a failure (watch level), excluding only like-for-like restatements made purely because of portfolio changes. Section 7 of the report considers that the top of Market Intelligence's 6%–8% target is already above the actual of the last three years and works with 5%–6%, and that energy is more likely to land below the bottom of its target range [src:SPGI-RPT1-2026-09-18#p11]; on the definition before the recast, Market Intelligence grew 6.7% in FY2023 (pro forma), 6.1% in FY2024 (as reported) and 6.2% in FY2025 (organic constant currency) (this archive's computation) [src:SPGI-8K-2024-02-08#EX99-Exh5] [src:SPGI-10K-FY2025#p50] [src:SPGI-8K-2026-02-10#EX99-Exh7]. From this, this archive infers that if any segment target is cut, these two are the most likely; this is this archive's inference, and the report does not predict that targets will be cut."

  # ---------- Lynch cyclical template (secondary category; Q-cycle does not apply, see the file header) ----------
  - id: SPGI-Q14
    type: quantitative
    claim: Leverage has not been pushed to a dangerous level by buybacks before the next issuance downturn
    origin: template:cyclical
    severity: watch
    covers: [balance_sheet]
    pillar: P6
    metric: net_debt_to_ebitda
    fail_if: Above 3x
    rule: {op: ">", threshold: 3, unit: x, consecutive: 1, period: year}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: "2027-02"
    note: "The Q-leverage test of the cyclical template (this archive's secondary category), with the template's default threshold. It guards the second half of permanent-loss path #4. Total debt rose from $4.114 billion at the end of 2021 to $13.088 billion at the end of 2025 [src:SPGI-10K-FY2022#p77] [src:SPGI-10K-FY2025#p80]. 2026 shareholder returns of at least about $8.1 billion are about 163% of the owner's report's estimate of $5.0 billion of post-spin adjusted free cash flow and about 150% (149%–155%) of calendar-2026 adjusted free cash flow on the company's reporting basis, the second-half part of which was heard only on the Q2 call (this archive's computation, F15) [src:SPGI-8K-2026-07-28#EX99.1-p1] [src:SPGI-8K-2026-07-28#EX99.1-Exh8] [src:SPGI-CALL-FY2026Q2] [src:SPGI-RPT1-2026-09-18#p9]. The excess is funded by asset sales (OSTTRA, $1.5 billion received in October 2025 [src:SPGI-10K-FY2025#Note2]; $361 million in the first half of 2026 [src:SPGI-10Q-FY2026Q2#p7]) and by the $1.974 billion cash distribution S&P Global received from Mobility Global at the spin-off [src:SPGI-8KA-2026-07-06#EX99.2-noteb], which Mobility Global financed with $2.0 billion of notes that are now its sole obligation [src:SPGI-10Q-FY2026Q2#Note4]; S&P Global's own debt excluding those notes was $13.17 billion at 2026-06-30, about the same as at the end of 2025, and the company put its adjusted net debt at 1.9 times adjusted EBITDA [src:SPGI-WEB-2026-07-28-2#p9]; for the second half, management said on the Q2 call that it expects to issue about $2 billion of additional debt to fund further buybacks (carried by third-party transcripts, not in the filings) [src:SPGI-CALL-FY2026Q2]. A 2022-style issuance drought would weigh on that year's profit, shrinking the denominator [src:SPGI-RPT1-2026-09-18#p6]. The report gives no EBITDA or net debt multiple; the baseline is to be backfilled from the XBRL of the FY2025 10-K. Debt on the registry's basis takes only us-gaap:LongTermDebt, while short-term debt including current maturities rose from $718 million at 2025-12-31 to $2.572 billion at 2026-06-30, mostly because $1.747 billion of notes due in 2027 moved into current maturities (commercial paper rose $110 million) [src:SPGI-10Q-FY2026Q2#Note4]; the test is judged on the registry's basis, and if that excludes short-term borrowings, the company manager also records, next to the reading, the multiple including short-term borrowings, with the threshold unchanged."

  - id: SPGI-L6
    type: qualitative
    claim: At the top of the issuance cycle, buybacks have not been stepped up sharply without stating the cycle assumptions
    origin: template:cyclical
    severity: watch
    covers: [capital_allocation, balance_sheet]
    pillar: P6
    question: "In this period, are both of the following true: (1) the issuance cycle is high, that is, this period's ratings billed issuance in SPGI-Q7 is up more than 15% year on year (beyond the top of the healthy range); (2) the full-year buyback target the company has announced for this year, or the amount of buybacks executed so far this year, is more than 25% above the previous year's actual buybacks?"
    fail_if: Yes, and the earnings press release, earnings call or 10-K/10-Q for the same period does not say how buybacks and borrowing will be adjusted when issuance declines
    judge: independent_model
    evidence: required
    where: Quarterly earnings press releases and supplementary disclosures (billed issuance, buyback target); the cash flow statement and shareholder returns section of the 10-Q/10-K; earnings calls
    lookback: 4
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: "2026 buyback target of more than $7 billion, $1.5 billion executed in the first half; FY2025 buybacks of $5.001 billion [src:SPGI-8K-2026-07-28#EX99.1-p1] [src:SPGI-10Q-FY2026Q2#p7] [src:SPGI-10K-FY2025#p81]"
      source: SPGI-8K-2026-07-28#EX99.1-p1
      note: "Ratings billed issuance in Q2 2026 was up 25% year on year, as the company rounds it (24.7%: $1,268 billion against $1,017 billion) [src:SPGI-10Q-FY2026Q2#p49]."
    note: "Rewritten from the cyclical template's L-cycle-capalloc (the template asks whether capex or buybacks were raised sharply while profit hit a record, and fails if management did not state its cycle assumptions). All three changes were written down before the first judgment. One: “profit hitting a record” becomes ratings billed issuance beyond the top of its healthy range: SPGI's cyclicality is concentrated in ratings transaction revenue, which fell 45% in 2022 while non-transaction revenue fell 2% [src:SPGI-10K-FY2022#p49], and the report uses billed issuance to judge where the cycle stands [src:SPGI-RPT1-2026-09-18#p15] [src:SPGI-RPT1-2026-09-18#p19]. Two: capex is not considered, as it was 1.3% of revenue in FY2025 ($195 million of $15.336 billion, against 0.9% in FY2024) [src:SPGI-10K-FY2025#p81] [src:SPGI-10K-FY2025#p78]. Three: “sharply” is set by this archive as more than 25% above the previous year's actual buybacks, and the 2026 buyback target of more than $7 billion is at least 40% higher than FY2025's actual $5.001 billion (this archive's computation) [src:SPGI-8K-2026-07-28#EX99.1-p1] [src:SPGI-10K-FY2025#p81]. On the filings, both conditions already held when the archive was created, with Q2 2026 billed issuance up 25% year on year [src:SPGI-10Q-FY2026Q2#p49]; whether this test fails depends on whether management says how buybacks and borrowing will be adjusted when issuance declines. The report lists keeping buybacks at the set ratio of 85% through a real issuance downturn, rather than sustaining them with debt, as one of the conditions for moving management from “ordinary” to “excellent” [src:SPGI-RPT1-2026-09-18#p20]; 85% is the company's medium-term framework (returning about 85% of adjusted free cash flow) [src:SPGI-8K-2025-11-13#EX99], while for 2026 the company expects to return 100% or more [src:SPGI-8K-2026-04-28#EX99-p1]."

  # ---------- Section 11 of the report: thesis breakers (the thesis is void once one occurs; under the constitution, a conclusion is written within 7 days) ----------
  - id: SPGI-Q4
    type: quantitative
    claim: Market Intelligence's pricing power has not been taken away by the interface layer, and customers have not started negotiating renewals by the number of calls rather than by the seat
    origin: report:breaker
    severity: breaker
    covers: [pricing_power, moat, competition]
    pillar: P3
    metric_def:
      id: mi_subscription_revenue_yoy_change
      description: Year-on-year change in the absolute amount of the Market Intelligence segment's subscription revenue (Subscription), compared with the same quarter a year earlier
      unit: USD
      frequency: quarter
      data: filing_text
      where: The breakdown by segment and revenue type in the 10-Q/10-K revenue note (the Subscription line for Market Intelligence); when there is no segment detail, read the quarterly supplementary disclosure
      formula: mi_subscription_t - mi_subscription_{t-4q}
      components:
        mi_subscription_plus_recurring_variable_yoy_change:
          description: "Year-on-year change in the Market Intelligence segment's subscription revenue and recurring variable revenue (Recurring variable revenue) combined (compared with the same quarter a year earlier, quarterly; (mi_subscription + mi_recurring_variable)_t - (mi_subscription + mi_recurring_variable)_{t-4q}); a negative value means the increase in recurring variable revenue has not made up for the decline in subscription revenue"
          unit: USD
          where: "Same as above: the Subscription and Recurring variable revenue lines for Market Intelligence"
        mi_organic_cc_revenue_growth_fy:
          description: Market Intelligence segment full-year organic, constant-currency revenue growth (as defined by the company, annual)
          unit: "%"
          where: "The schedule of Market Intelligence organic, constant currency revenue in the fourth-quarter earnings press release (“Market Intelligence Organic, Constant Currency Revenue” in Exhibit 7 of the Q4 2025 release; after the spin-off the schedule is “Market Intelligence Adjusted (As Recast) Organic, Constant Currency Revenue”, Exhibit 8 of the Q2 2026 release)"
    params:
      segment: Market Intelligence
      segment_zh: Market Intelligence
    fail_if: Market Intelligence subscription revenue declines in absolute terms and recurring variable revenue does not make up for it in the same period; or (a later but still valid signal) Market Intelligence organic constant-currency revenue growth below 4% for two full fiscal years in a row
    rule:
      any_of:
        - all_of:
            - {metric: mi_subscription_revenue_yoy_change, op: "<", threshold: 0, unit: USD, consecutive: 1, period: quarter}
            - {metric: mi_subscription_revenue_yoy_change.mi_subscription_plus_recurring_variable_yoy_change, op: "<", threshold: 0, unit: USD, consecutive: 1, period: quarter}
          note: Both must hold in the same quarter.
        - {metric: mi_subscription_revenue_yoy_change.mi_organic_cc_revenue_growth_fy, op: "<", threshold: 4, unit: "%", consecutive: 2, period: year}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: 6
      unit: "%"
      period: 1H26
      as_of: 2026-06-30
      source: SPGI-8K-2026-07-28#EX99.1-Exh8
      note: "This is the current reading of the second branch: 6% as the company rounds it (6.4% on exact figures, $2,380 million against $2,237 million), on the adjusted (as recast) Market Intelligence definition of 2026-07-06, after 451 Research and Maritime & Trade moved to Energy [src:SPGI-8K-2026-07-28#EX99.1-Exh8] [src:SPGI-8K-2026-07-28#EX99.1-Exh6]; FY2025's 6% (6.2%) is on the earlier definition [src:SPGI-8K-2026-02-10#EX99-Exh7]. The report does not give the first branch's year-on-year change in absolute subscription revenue, which is to be backfilled from the Q2 2026 10-Q. Recurring revenue (subscription plus recurring variable revenue) was 96.4% of Market Intelligence revenue in Q4 2025 on the segment definition before the recast [src:SPGI-WEB-2026-02-10-1#p12], and 97.0% in Q2 2026 and 96.3% in the first half of 2026 on the recast basis [src:SPGI-WEB-2026-07-28-2#p14] [src:SPGI-8K-2026-07-28#EX99.1-Exh7]."
    note: "Thesis breaker #1 in section 11 of the report [src:SPGI-RPT1-2026-09-18#p19]: when customers switch to negotiating renewals by the number of calls rather than by the seat, the earliest thing visible in the financial statements is subscription revenue declining without usage-based revenue making up for it, which leads organic growth by several quarters; organic constant-currency revenue below 4% for two full fiscal years in a row comes later but counts just the same [src:SPGI-RPT1-2026-09-18#p19]. The report does not say what “decline” is measured against; this archive compares with the same quarter a year earlier, to avoid seasonality. Acquisitions and disposals change the absolute amount, so the comparison basis for the first branch is fixed as follows before the first reading. When the company discloses Market Intelligence subscription revenue on an organic or pro forma basis, use that basis. When only the reported basis is available: if the comparison window (this quarter and the same quarter a year earlier) contains only acquisitions, judge as usual, since acquisitions can only raise this quarter's reading, for example With Intelligence, which was acquired for $1.8 billion and joined Market Intelligence on 2025-11-25 [src:SPGI-10K-FY2025#Note2]; if the window contains a disposal involving Market Intelligence and the company has not disclosed the revenue of the business disposed of, the first branch is recorded as undeterminable for that quarter, and the second branch (full-year organic growth) is unaffected. Enterprise Data Management and thinkFolio were sold on 2026-01-12 and belonged to Market Intelligence [src:SPGI-10Q-FY2026Q2#Note2], so the first-branch readings from Q3 2026 to Q1 2027 are handled under this disposal rule (see todo). The two forks that lead this test are not given tests of their own: #1, the fight over the pricing unit (readable in 2027–2029), and #3, the price signal on pricing power (in a third-party transaction database, the median annual contract for Capital IQ Pro is about $327,500, from only 4 contracts, as retrieved by the report in September 2026, L2 only, no primary data seen) [src:SPGI-RPT1-2026-09-18#p18]; the data are third-party and the samples tiny, so the company manager records them in the quarterly updates."

  - id: SPGI-Q5
    type: quantitative
    claim: Accounting profit is cash, and the basis for adding acquisition amortization back to owner earnings still holds
    origin: report:breaker
    severity: breaker
    covers: [free_cash_flow]
    pillar: P4
    metric_def:
      id: adj_fcf_to_adj_net_income
      description: Adjusted free cash flow as defined by the company (after distributions to noncontrolling interests) ÷ adjusted net income
      unit: "%"
      frequency: year
      data: filing_text
      where: The non-GAAP reconciliation in the annual earnings press release (Adjusted free cash flow, Adjusted net income)
      formula: adjusted_free_cash_flow / adjusted_net_income
    fail_if: Adjusted free cash flow below 85% of adjusted net income for two consecutive years
    rule: {op: "<", threshold: 85, unit: "%", consecutive: 2, period: year}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: "2027-02"
    baseline:
      value: 100.7
      unit: "%"
      period: FY2025
      as_of: 2025-12-31
      source: SPGI-8K-2026-02-10#EX99-Exh7
      note: "Adjusted free cash flow of $5.481 billion against adjusted net income of $5.441 billion, and 116.5% in FY2024 ($5.704 billion against $4.898 billion) (this archive's computation) [src:SPGI-8K-2026-02-10#EX99-Exh7] [src:SPGI-8K-2026-02-10#EX99-Exh5]. Both years as reported on 2026-02-10, numerator and denominator including Mobility. When the FY2026 10-K restates FY2025 to continuing operations, readings follow the latest restated basis and this note keeps the figure as originally reported."
    note: "Thesis breaker #6 in section 11 of the report: once it holds, the report's basis for adding acquisition amortization back to owner earnings no longer holds [src:SPGI-RPT1-2026-09-18#p19]. The FY2026 reading has a break in basis: first-half cash flow includes Mobility [src:SPGI-10Q-FY2026Q2#Note1], while the Q2 2026 release presents adjusted net income pro forma, excluding Mobility [src:SPGI-8K-2026-07-28#EX99.1-Exh6], which is why the report leaves the cash conversion for the first half of 2026 blank [src:SPGI-RPT1-2026-09-18#p5]; judging requires the numerator and denominator on the same basis, and when same-basis figures cannot be obtained, the result is recorded as undeterminable and the consecutive count starts from the next clean year."

  - id: SPGI-L2
    type: qualitative
    claim: "Ratings are still recognized by regulators in private credit: NAIC's tightening has not extended to S&P's own private ratings, and external private ratings as a whole have not lost their eligibility for filing exemption"
    origin: report:breaker
    severity: breaker
    covers: [regulation, moat, growth]
    pillar: P1
    question: "As of this period, has either of the following happened: (a) the challenges to or overturning of filing-exempt private ratings by the Securities Valuation Office of the National Association of Insurance Commissioners (NAIC) have extended to private ratings issued by S&P, and S&P's share has “risen significantly”, which this archive defines in advance as follows: by NAIC's published figures by agency, S&P's share of the ratings challenged or overturned this period is not below S&P's share of all filing-exempt private ratings; when NAIC has not published the latter share, S&P's share is instead more than 10 percentage points above the last reading that had figures by agency; (b) after 2026-09-18, NAIC has formally adopted a rule under which private ratings from external agencies as a whole are no longer accepted as a basis for filing exemption (closing the whole filing-exempt route, or having the Securities Valuation Office assess all private ratings itself), whichever rating agencies are involved? A rule that only adds spot checks or challenge procedures, without changing the availability of external ratings as a whole, does not count as (b)."
    fail_if: Yes (it fails if either (a) or (b) holds). It is recorded as a pass only if both branches were checked and neither holds; if the NAIC materials listed in where were not checked this period, or NAIC has not published the figures by agency that (a) needs and (b) does not hold, it is recorded as undeterminable, not as a pass
    judge: independent_model
    evidence: required
    where: Meeting materials, resolutions and statistics of NAIC's Valuation of Securities Task Force and the Securities Valuation Office (starting from the materials listed as source 24 in the report's appendix, source tag NAIC-SVO-2026); S&P's 10-K/10-Q risk factors and earnings calls; rating agency commentary
    lookback: 4
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: "The SVO's authority to challenge ratings used for filing exemption took effect on 2026-01-01, but at the NAIC's December 2025 meeting the systems and data agreements needed to run the process were still being built [src:NAIC-SVO-2026#p5]. Under the process the NAIC describes, the SVO may ask for a rating's removal from filing exemption only when its own designation differs by at least three notches, a group of state regulators decides, and the SVO is to publish an anonymized summary within 45 days of each removal and an annual summary at each Spring National Meeting [src:NAIC-BRIEF-2026-03#p2]. No challenge or removal statistics, by agency or otherwise, were found in the NAIC materials read for this archive."
      as_of: 2026-09-18
      source: NAIC-BRIEF-2026-03#p2
      note: "L2 only, no primary data seen: in an NAIC staff analysis the report cites, 97% of 109 private-credit securities with private letter ratings were rated higher than the SVO's own assessment [src:SPGI-RPT1-2026-09-18#p8]; the analysis split results by provider size, not by agency, and trade-press accounts report that the NAIC withdrew it [src:SPGI-RPT1-2026-09-18#p8]. Private markets ratings revenue rose 60% year on year in Q2 2026, amount not disclosed, by the company's account on the earnings call (not in the filings, slides or supplemental disclosure, and carried by third-party transcripts) [src:SPGI-CALL-FY2026Q2]."
    note: "Thesis breaker #2 in section 11 of the report [src:SPGI-RPT1-2026-09-18#p19]: once it holds, the increment of ratings profit that comes from private markets can no longer be assumed, and the report's estimated upper-bound case in which private ratings go to zero (−$0.45 to −$0.90 per share) becomes the base case [src:SPGI-RPT1-2026-09-18#p19]. (a) is the report's own wording of breaker #2, but the report gives no threshold for “risen significantly” [src:SPGI-RPT1-2026-09-18#p19], and no challenge or removal statistics have been published so far, so none by agency; the NAIC plans an anonymized summary of each removal and an annual summary, and whether these name the rating agency is not stated [src:NAIC-BRIEF-2026-03#p2]. The two thresholds in the question are this archive's operationalization, written down before the first judgment, awaiting HQ's confirmation in docs/decisions/. The reason is that the report considers the real reading to be whose ratings are challenged or removed from filing exemption, not how many: if they are mainly those of smaller agencies, demand will concentrate on S&P, and only if S&P's share of the challenges is not below its own share does it show that the tightening has extended to S&P [src:SPGI-RPT1-2026-09-18#p8] [src:SPGI-RPT1-2026-09-18#p16]. The SVO cannot override a rating: what the question calls overturning is the removal of a rating from filing exemption, which a group of state regulators decides after an SVO challenge [src:NAIC-BRIEF-2026-03#p1] [src:NAIC-BRIEF-2026-03#p2]. (b) comes from the other branch of fork #4: the report says that if the filing-exempt route as a whole tightens and external ratings of private credit are no longer accepted by regulators, the same upper-bound case materializes [src:SPGI-RPT1-2026-09-18#p16] [src:SPGI-RPT1-2026-09-18#p18]; breaker #2's wording covers only (a), and (b) is merged in by this archive because the consequence is the same. The readings of fork #4 (readable in 2027–2029) and of “S&P's share of private ratings challenged or overturned” in fork #6 are also merged into this test [src:SPGI-RPT1-2026-09-18#p18]. The claim rests on the NAIC documents registered as NAIC-SVO-2026 and NAIC-BRIEF-2026-03."

  - id: SPGI-L3
    type: qualitative
    claim: The issuer-pays model and the free choice of rating agency have not been dismantled by legislation
    origin: report:breaker
    severity: breaker
    covers: [regulation, moat]
    pillar: P1
    question: As of this period, has any major jurisdiction (defined in advance by this archive as the US federal level, the EU and the UK) formally legislated after 2026-09-18 to abolish the issuer-pays model for credit ratings or to mandate the rotation of rating agencies? In this test, “formally legislated” means a law passed and enacted by a legislature, or a binding final rule formally issued by a regulator under statutory authority, dated by its enactment or issuance without waiting for it to take effect; consultation drafts, research reports and proposals do not count. The scope must cover at least one whole class of ratings among corporates, financial institutions, structured finance or governments; provisions aimed only at individual products within a class do not count.
    fail_if: Yes. If the legislative records and regulatory announcements listed in where were not checked this period, it is recorded as undeterminable, not as a pass
    judge: independent_model
    evidence: required
    where: Legislative records of the US (Congress and the SEC), the EU and the UK, and the final rules and announcements of the rating regulators in these three jurisdictions; the regulation section and risk factors of S&P's 10-K/10-Q
    lookback: 4
    judge_notes:
      - Laws and rules already in existence on 2026-09-18 are part of the baseline; the judgment looks only at laws newly enacted or final rules newly issued after 2026-09-18.
      - Legislation in jurisdictions outside the list (US federal, EU, UK) does not trigger this test.
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: "Section 939A of the Dodd-Frank Act required federal agencies to remove references to credit ratings from their rules; the SEC finished its part on 2023-06-07 [src:SEC-STMT-2023-06-07]. No jurisdiction on the list has abolished issuer-pays; the EU already requires rotation of rating agencies for ratings of resecuritizations, a rule aimed at one product type [src:SPGI-10K-FY2025#p55]. In the report's judgment the market's reliance on ratings has not fallen noticeably, and research on alternatives to the issuer-pays model has made no progress since 2013 [src:SPGI-RPT1-2026-09-18#p7]; the last formal SEC steps found on alternatives are its report to Congress on assigned credit ratings under section 939F (December 2012) and its credit ratings roundtable of 2013-05-14 [src:SEC-939F-2012-12] [src:SEC-RT-2013-05-14]."
      source: SPGI-10K-FY2025#p55
      note: "One reading of reliance: ratings non-transaction revenue, mostly surveillance and annual fees, grew 10% in the first half of 2026 as the company rounds it (9.5%) [src:SPGI-8K-2026-07-28#EX99.1-Exh7]."
    note: "Thesis breaker #3 in section 11 of the report: it would directly take out the source of 43% of FY2025 adjusted segment operating profit, as the company rounds it (43.4%, recast, before corporate expense, and 44% for the twelve months to 2026-06-30) [src:SPGI-8KA-2026-07-06#EX99.1-p1] [src:SPGI-WEB-2026-07-28-1#p7], and the report lists it as a possible case but not the base case [src:SPGI-RPT1-2026-09-18#p19]. The report's wording is “formal legislation”, without listing jurisdictions or saying whether regulatory rules count [src:SPGI-RPT1-2026-09-18#p19]. The list of jurisdictions in the question, counting binding final rules as formal legislation, and the scope condition of “covering at least one whole class of ratings” are all this archive's operationalization, written down before the first judgment, not the report's wording; of these, the final-rule item goes beyond the report's wording and awaits HQ's confirmation in docs/decisions/. The reasons: the report lists mandatory rotation as one of the ways regulators can act directly [src:SPGI-RPT1-2026-09-18#p7], and a binding final rule has the same force as a law for issuers and rating agencies; the classes of ratings revenue are those the company reports (corporates 53% of 2025 division revenue, financials 16%, structured finance 13%, governments 7%, Crisil and other 12%) [src:SPGI-8KA-2026-07-06#EX99.1-p2]. Legislation in jurisdictions outside the list is recorded by the company manager in the quarterly updates; the list can be changed only before a relevant event occurs."

  - id: SPGI-L4
    type: qualitative
    claim: S&P indices are still written into ETF mandates and products, and large issuers have not moved flagship products to self-built or third-party indices
    origin: report:breaker
    severity: breaker
    covers: [moat, pricing_power, competition]
    pillar: P2
    question: As of this period, has any of the three largest ETF issuers formally announced or completed switching a flagship product with more than $100 billion in assets from an S&P Dow Jones index to a self-built or third-party index?
    fail_if: Yes. If the ETF issuer announcements and prospectus changes listed in where were not checked this period, it is recorded as undeterminable, not as a pass
    judge: independent_model
    evidence: required
    where: ETF issuers' announcements and prospectus changes, exchange announcements; S&P's 10-Q/10-K and earnings calls
    lookback: 4
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: "ETF assets linked to S&P Dow Jones indices were $6.35 trillion at 2026-06-30, up 34% in a year, with $605 billion of net inflows and $1,010 billion of price appreciation; the company says it remains the largest index provider by ETF-linked assets and that in June a single ETF based on the S&P 500 reached $1 trillion in assets [src:SPGI-WEB-2026-07-28-1#p10]. Asset-linked fees grew 22% in Q2 2026, as the company rounds it (21.7%), a new quarterly high for the fourth quarter in a row [src:SPGI-8K-2026-07-28#EX99.1-Exh7]."
      as_of: 2026-06-30
      source: SPGI-WEB-2026-07-28-1#p10
      note: "L2 only, no primary data seen: active ETFs took about 35%–39% of 2026 inflows to September, and one flagship S&P 500 ETF, which the report does not name, had net inflows of more than $124 billion in 2026 to September, per third-party flow data (J.P. Morgan, State Street and Goldman Sachs, appendix item 20 of the owner's report) [src:SPGI-RPT1-2026-09-18#p7] [src:SPGI-RPT1-2026-09-18#p16]."
    note: "Thesis breaker #4 in section 11 of the report: if it happens, the premise that “benchmarks are written into mandates” is disproved [src:SPGI-RPT1-2026-09-18#p19]. The precedent is Vanguard: in October 2012 its fund boards approved moving index funds from MSCI to FTSE and CRSP benchmarks, about $537 billion in 22 funds per the owner's report and press accounts of Vanguard's release (L2 only) [src:SPGI-RPT1-2026-09-18#p7], and the funds switched during 2013 [src:VANGUARD-497-2012-10-02] [src:VANGUARD-497-2013-01-31]. The report says “switch” without distinguishing announcement from completion [src:SPGI-RPT1-2026-09-18#p19]; this archive counts a formal announcement as a switch, an operationalization written down in advance, not the report's wording: a formal announcement shows that the issuer has already decided, and waiting until the transition is complete to judge would only make the same conclusion arrive later. Vanguard's own filings bear this out: each fund announced a board-approved change of target index in a prospectus supplement and withheld the exact timing of the transition to protect the fund from front running [src:VANGUARD-497-2012-10-02]. The report infers that funds with the index name in the product name find it hard to change indices, while broad-market products with generic names have already changed [src:SPGI-RPT1-2026-09-18#p7]; the Vanguard precedent bears out the second half but not the first: Vanguard MSCI Emerging Markets ETF was renamed Vanguard FTSE Emerging Markets ETF, and Vanguard Mega Cap 300 Index Fund dropped the “300” [src:VANGUARD-497-2012-10-02-2] [src:VANGUARD-497-2012-10-02-3]. The report's source 25 (Vanguard's release of 2012-10-02) is registered as VANGUARD-2012-10-02; the release itself has not been obtained, and the prospectus supplements filed the same day stand in for it."

  - id: SPGI-L5
    type: qualitative
    claim: Platts price assessments are still the settlement reference for energy contracts
    origin: report:breaker
    severity: breaker
    covers: [moat, pricing_power, competition]
    pillar: P2
    question: "As of this period, has either of the following happened: (a) a major commodity exchange (defined in advance by this archive as CME Group including NYMEX, Intercontinental Exchange (ICE) and Singapore Exchange (SGX)) has formally announced that it will change the settlement price of a flagship energy contract (one of the three energy contracts with the largest trading volume in the previous year among those the exchange settles on Platts assessments) from the Platts assessment to the exchange's own price; (b) the LNG benchmark of the EU Agency for the Cooperation of Energy Regulators (ACER) has been written into mainstream contracts, meaning that any exchange listed above has listed a contract settled on the ACER LNG benchmark whose trading volume in any quarter reaches 25% or more of the combined volume of that exchange's LNG contracts settled on Platts assessments, or that statistics published by ACER or the European Commission show that 25% or more of EU LNG trades are priced on the ACER benchmark?"
    fail_if: Yes (it fails if either (a) or (b) holds). The statistics condition in (b) goes by published figures and is treated as not met when no relevant statistics have been published; it is recorded as a pass only if both branches were checked and neither holds; if the external sources listed in where were not checked this period, or the trading volumes needed for the judgment cannot be read, it is recorded as undeterminable, not as a pass
    judge: independent_model
    evidence: required
    where: Contract rule change announcements and trading volume statistics of the exchanges listed above; ACER's announcements and market reports (starting from the materials listed as source 21 in the report's appendix, source tag ACER-LNG-2025); the European Commission's relevant statistics; S&P's 10-Q/10-K and earnings calls
    lookback: 4
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: "ACER has published an LNG price assessment every weekday since 2023-01-13 and an LNG benchmark since 2023-03-31; since 2025-01-01, after the temporary Regulation (EU) 2022/2576 expired, it has done so under REMIT Articles 7a–7e, which Regulation (EU) 2024/1106 inserted as a permanent task [src:ACER-LNG-2025] [src:EU-REG-2024-1106#Art1-10]; stakeholders may use the benchmark voluntarily [src:ACER-LNG-2025]. In the report's judgment there is no sign so far of it replacing Platts [src:SPGI-RPT1-2026-09-18#p7]. Energy's sales usage-based royalties, from licensing Platts price assessments to commodity exchanges, fell 9% in Q2 2026 on lower trading volumes of Platts-based contracts and rose 9% in the first half, as the company rounds them [src:SPGI-8K-2026-07-28#EX99.1-Exh7] [src:SPGI-10Q-FY2026Q2#p51]. Energy's adjusted (as recast) revenue grew 3% in Q2 2026, as the company rounds it (2.6%), with Advisory & Transactional Services revenue lower on those royalties, event timing and event cancellations [src:SPGI-8K-2026-07-28#EX99.1-Exh8] [src:SPGI-10Q-FY2026Q2#p51], and the company lists geopolitical and sanction uncertainty among the factors weighing on Energy's growth [src:SPGI-WEB-2026-07-28-1#p11]."
      as_of: 2026-06-30
      source: ACER-LNG-2025
    note: "Thesis breaker #5 in section 11 of the report [src:SPGI-RPT1-2026-09-18#p19]. What Platts is written into is industry practice, not legal obligation, and the report judges the direction as “flat, leaning weaker” [src:SPGI-RPT1-2026-09-18#p7]. The report defines none of “major commodity exchange”, “flagship energy contract” or “mainstream contracts” [src:SPGI-RPT1-2026-09-18#p19]; the list of exchanges in the question, the top-three-by-volume definition, the two percentage thresholds and “going by the formal announcement” are all this archive's operationalization, written down before the first judgment, not the report's wording; they await HQ's confirmation in docs/decisions/ and can be changed only before a relevant event occurs. A switch to prices from another price reporting agency is outside the report's wording; if it happens, the company manager records it in the quarterly update."

  # ---------- Section 11 of the report: the five watch indicators tracked every quarter ----------
  - id: SPGI-Q6
    type: quantitative
    claim: Market Intelligence's growth has not kept stalling, and the pricing power of desktop data has not been squeezed by AI and customer budgets
    origin: report:watch
    severity: watch
    covers: [growth, pricing_power, competition]
    pillar: P3
    metric: segment_revenue_yoy
    params: {segment: Market Intelligence, segment_zh: Market Intelligence, basis: "organic, constant currency (as defined by the company)"}
    fail_if: Below 5% for two consecutive quarters
    rule: {op: "<", threshold: 5, unit: "%", consecutive: 2, period: quarter}
    warn_if: Below the healthy line of 6%
    warn_rule: {op: "<", threshold: 6, unit: "%", consecutive: 1, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: 6
      unit: "%"
      period: 2026Q2
      as_of: 2026-06-30
      source: SPGI-8K-2026-07-28#EX99.1-Exh8
      note: "The Q2 2026 quarter, the metric's own frequency: 6% as the company rounds it (6.2% on exact figures, $1,206 million against $1,136 million), adjusted (as recast) Market Intelligence, and the first half of 2026 was also 6% (6.4%) [src:SPGI-8K-2026-07-28#EX99.1-Exh8]."
    note: "The first watch indicator in section 11 of the report, read from the Market Intelligence organic, constant currency revenue schedule of the quarterly results (Exhibit 8 of the Q2 2026 release) [src:SPGI-RPT1-2026-09-18#p19] [src:SPGI-8K-2026-07-28#EX99.1-Exh8]; the report says “two consecutive quarters <5% trigger attention”, recorded here as a watch-level failure, with a warning below the healthy line of 6% [src:SPGI-RPT1-2026-09-18#p19]. In the first half of 2026 Market Intelligence grew 7% on the reported basis and 6% organic in constant currency (6.4%), third of the four divisions on that basis: Energy was lowest at 4% (4.3%), Ratings grew 14% (13.6%) and Indices 18% (17.7%), as the company rounds them [src:SPGI-8K-2026-07-28#EX99.1-Exh8] [src:SPGI-8K-2026-07-28#EX99.1-Exh6]. The company's medium-term target for Market Intelligence, 6%–8% average annual organic constant-currency growth, was set at the 2025-11-13 Investor Day, before the July 2026 recast [src:SPGI-8K-2025-11-13#EX99], and the report works with 5%–6% [src:SPGI-RPT1-2026-09-18#p11]."

  - id: SPGI-Q7
    type: quantitative
    claim: The issuance cycle has not turned into a 2022-style ebb
    origin: report:watch
    severity: watch
    covers: [growth]
    pillar: P5
    metric_def:
      id: ratings_billed_issuance_yoy
      description: Year-on-year quarterly growth in the ratings segment's billed issuance
      unit: "%"
      frequency: quarter
      data: filing_text
      where: The ratings segment's billed issuance table in the 10-Q/10-K MD&A (Billed Issuance Volumes); for monthly data, see the ratings billed issuance the company publishes on the 15th of each month (investor relations website, not a filing)
      formula: billed_issuance_q / billed_issuance_{q-4} - 1
    fail_if: Below −15% for two consecutive quarters
    rule: {op: "<", threshold: -15, unit: "%", consecutive: 2, period: quarter}
    warn_if: Outside the healthy range of −10% to +15% (above the top means issuance is at a cyclical high)
    warn_rule: {op: outside, threshold: [-10, 15], unit: "%", consecutive: 1, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: "2026-10"
    baseline:
      value: 25
      unit: "%"
      period: 2026Q2
      as_of: 2026-06-30
      source: SPGI-10Q-FY2026Q2#p49
      note: "25% as the company rounds it (24.7% on exact figures): billed issuance of $1.268 trillion in Q2 2026 against $1.017 trillion a year earlier, and $2.498 trillion in the first half [src:SPGI-10Q-FY2026Q2#p49]. Hyperscaler-related billed issuance (the company counts Alphabet, Amazon, Meta, Microsoft and Oracle) was $169 billion in the first half [src:SPGI-WEB-2026-07-28-1#p8], about 6.8% of first-half billed issuance (this archive's computation, $169 billion ÷ $2,498 billion) [src:SPGI-WEB-2026-07-28-1#p8] [src:SPGI-10Q-FY2026Q2#p49]. The 10-Q's own $169 billion is a different figure, Q2 2026 high-yield billed issuance [src:SPGI-10Q-FY2026Q2#p49]."
    note: "The second watch indicator in section 11 of the report [src:SPGI-RPT1-2026-09-18#p19]; the company publishes billed issuance on the 15th of each month, one month in arrears [src:SPGI-8K-2026-02-10#EX99-Outlook]. The healthy range has a top: above +15% means issuance is at a cyclical high and current earnings still contain the cyclical position, and the report considers this indicator exactly the way to judge “whether the level of ratings transaction revenue is itself above trend” [src:SPGI-RPT1-2026-09-18#p15]. At creation, the Q2 2026 reading of +25% (24.7%) was already outside the healthy range, so this test is in a warning state [src:SPGI-10Q-FY2026Q2#p49]. By the company's account on the Q2 call, it now assumes $250 billion to $300 billion of hyperscaler issuance for the full year, against about $200 billion at the start of the year (carried by third-party transcripts, not in the filings) [src:SPGI-CALL-FY2026Q2]; its slides say only that hyperscaler issuance is outpacing its full-year estimate [src:SPGI-WEB-2026-07-28-1#p8]. The report considers that the real risk lies not in the concentration of these issuers itself but in their ebb setting off a 2022-style broad contraction [src:SPGI-RPT1-2026-09-18#p17]."

