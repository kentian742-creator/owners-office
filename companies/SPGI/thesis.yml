# SPGI thesis file (public; thesis-ci spec §4; schema: spec/schemas/thesis.schema.json)
# How it was made: first the Lynch stalwart template and the _common staleness tests, then, one by one, the
# six thesis breakers (severity: breaker) and five quarterly watch indicators (severity: watch) from section 11 of the 02 report;
# of the seven forks in section 11, #7, which the report explicitly says can be read “every quarter” and calls the only quarterly indicator for indices, and #2, judged by FY2028, are also written as watch.
# Thresholds follow the report's text; where the report gives no threshold, the test's note says how this archive operationalizes it, always written down before the first judgment.
# The two places that go beyond the report's wording are also marked in the notes, for HQ to confirm: branch (b) of SPGI-L2 (the route as a whole tightening), and SPGI-L3 counting binding final rules as formal legislation.
# All five tests of the stalwart template are kept: Q-growth→SPGI-Q1, Q-returns→SPGI-Q2, Q-buyback→SPGI-Q3, Q-fcf→SPGI-Q13, L-guidance→SPGI-L1; the changes are explained in each note.
# Secondary category, cyclical template: Q-leverage (SPGI-Q14) and L-cycle-capalloc (SPGI-L6) are adopted; Q-cycle looks at credit loss provisions, and SPGI does not lend, so it does not apply and is not adopted.
# One test is this archive's own addition (origin: manual): SPGI-L7, a proxy test for permanent-loss path #3 (a credibility shock).
# Everything price-related (ranges, reference price, the rating on price, discounting parameters) is only in the private repository, owners-office-private/companies/SPGI/valuation.yml.
# Revised 2026-09-27 after the first fact audit of the archive (16A → 04A), under HQ rulings S1–S12: facts re-cited to the primary
#   documents; baselines corrected where the audit found them wrong or on the wrong basis or period (SPGI-Q5, SPGI-Q9, SPGI-Q10,
#   SPGI-L2, SPGI-L4 and SPGI-L7, and the period of SPGI-Q6); SPGI-L7's claim made forward-looking (ruling S5). No test's rule,
#   fail_if, warn_rule, warn_if, threshold or direction changed.
# Labels: "this archive's computation" = computed from a primary document's exact figures (shares, ratios and growth rates to one
#   decimal); "as the company rounds it" = the rounded figure the company prints; "L2 only; no primary data seen" = rests on
#   secondary sources and enters no baseline value. S&P posts no transcript of its earnings calls (webcast replay only), so a
#   statement heard only on a call is labelled as carried by third-party transcripts (SPGI-CALL-FY2026Q2) and stays out of baselines.
# Bases: "recast" = the four-division structure without Mobility that the company introduced on 2026-07-06; "pro forma" = excluding
#   Mobility; "as reported" = the figures published before the spin-off, including Mobility.
# Locators: SPGI-RPT1-2026-09-18#pN is the report's PDF page; for 10-K and 10-Q filings #pN is the filing's printed page; an
#   earnings release is located as #EX99.1-pN (its own page) or #EX99.1-Exh7 (its schedule "Exhibit 7").
