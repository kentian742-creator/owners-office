  - "SPGI-Q4：10-Q 的分部信息附注按分部、按收入类型分列了市场情报的收入，2026 年二季度订阅（Subscription）10.76 亿美元、经常性可变收入（Recurring variable revenue）1.73 亿美元 [src:SPGI-10Q-FY2026Q2#note-11]，第一支直接读这张表，不需要改读季度补充披露。企业数据管理与 thinkFolio 于 2026-01-12 出售，属于市场情报 [src:SPGI-10Q-FY2026Q2#note-2]，所以 FY2026Q3 至 FY2027Q1 的第一支读数按 SPGI-Q4 note 写定的处置规则处理：公司既没有披露被出售业务的收入、也没有披露市场情报订阅收入的有机或 pro forma 口径的季度，第一支记为无法判定，第二支不受影响。"
  - "SPGI-Q8 的 ETF 净流入拆分只在业绩幻灯片里（投资者关系网站；业绩 8-K 只附新闻稿），SPGI-Q11 的美国 ETF 总资产来自行业统计，都不是 SEC 申报文件，分别标 data: external 与 mixed；SPGI-Q7 的季度计费发行额在 10-Q/10-K 的 MD&A 里有表 [src:SPGI-10Q-FY2026Q2#MD&A] [src:SPGI-10K-FY2025#MD&A]，仍为 filing_text。SPGI-L2 至 SPGI-L5 所读的 NAIC 材料、立法记录与监管规则、ETF 发行人公告、交易所公告与 ACER 公告同样不是 SEC 申报文件；它们在本期没有核对外部来源时记为无法判定、不记为通过，已写进各自的 fail_if；判定时读到的每份外部文件逐份登记来源标签。报告附录里这几条路径已知的一手来源已登记为 NAIC-SVO-2026、ACER-LNG-2025 与 VANGUARD-2012-10-02，原件都未取得。"
  - "上半年约 1,690 亿美元的超大规模云厂商计费发行额，以及公司对全年的工作假设 2,500 至 3,000 亿美元，只有报告的数字 [src:SPGI-RPT1-2026-09-18#p16] [src:SPGI-RPT1-2026-09-18#p17]，报告把它们归于二季度业绩会（附录来源 6）；10-Q 与业绩 8-K 都没有这两个数，10-Q 里的 1,690 亿美元是二季度高收益债的计费发行额 [src:SPGI-10Q-FY2026Q2#MD&A]。取得 SPGI-CALL-FY2026Q2 的纪要后核对；在此之前，SPGI-Q7 基线 note 与 depends_on 条目里 6.8% 的占比，分子仍是报告的数字。"
  - "SPGI-L2 的 (a) 支需要按机构拆分的被质疑或推翻评级数字，而报告说公开材料没有拆分 [src:SPGI-RPT1-2026-09-18#p8]；首次判定之前核实 NAIC 是否公布分机构数字，没有公布时 (a) 支持续记为无法判定，整条的结论取决于 (b) 支。"
  - SPGI 是候选公司，按 DESIGN 的成本规则只跑定量测试和公司经理草稿（decisions/0002）：六条论点破坏者里只有 SPGI-Q4、SPGI-Q5 会运行，SPGI-L1 至 SPGI-L7 在转为持仓之前都不运行。需要总部决定 severity 为 breaker 的定性测试（SPGI-L2 至 SPGI-L5）是否豁免这条规则。
  - 报告没有定义的判定用语，已在首次判定之前写下本档案的操作化：SPGI-L2 的“显著上升”与 (b) 支，SPGI-L3 的“主要司法辖区”“正式立法”（含有约束力的最终规则，超出报告字面）与范围条件，SPGI-L4 的“正式宣布算作切换”，SPGI-L5 的“主要商品交易所”“旗舰能源合约”“主流合同”，SPGI-L6 的“大幅”，SPGI-Q12 的失败线。待总部记入 docs/decisions/ 确认或修改；修改只能在相关事件发生之前做。
  - "SPGI-Q5、SPGI-Q9、SPGI-Q10 与 SPGI-Q13 的 FY2026 读数有口径断裂（上半年现金流含 Mobility）[src:SPGI-RPT1-2026-09-18#p5]；FY2026 年报发布时确认公司给出的调整后自由现金流是含 Mobility 上半年的报表口径，还是只有不含 Mobility 的口径，再按各测试 note 写定的同口径规则判定。"
  - "公司不披露市场情报的客户留存率，而它是唯一能区分“主动剥离后会加速”与“定价权被 AI 与客户预算压缩”这两种解释的指标 [src:SPGI-RPT1-2026-09-18#p5]；公司一旦披露，补一条留存测试。"
  - "公司不披露任何人力指标（留存率、内部晋升率、敬业度），企业文化维度暂时写不出定量测试；FY2025 公司层面的高管团队过渡成本 4,100 万美元 [src:SPGI-RPT1-2026-09-18#p10]。SPGI-L7 覆盖的只是其中可信度（与评级标准有关的执法）的一面。"
  - 激励结构：报告只读了 2026 年委托书的薪酬概述，没有读完整的薪酬讨论与分析，无法排除相对股东总回报修正器之类的安排；读完 SPGI-DEF14A-2026-03-31 全文后，决定是否增加一条“长期激励含资本回报指标”的管理层测试（报告把它列为管理层从“普通”移到“优秀”的条件之一）。
  - "私募市场评级收入 2026 年二季度同比 +60%、绝对额未披露 [src:SPGI-RPT1-2026-09-18#p8]；报告按占评级收入 5%–10% 做量级估算，这个占比没有出处 [src:SPGI-RPT1-2026-09-18#p8]。公司若披露绝对额即回填。"
  - 报告第 7 节中期目标表的来源脚注写作“10”，而附录来源 10 是司法部与证交会的和解文件，疑为编号错误；中期目标的一手出处（投资者日材料）待登记来源标签，SPGI-L1 的基线届时改指一手文件。
  - 报告自述未能核实的事项：公司历史倍数序列、1928 年协议所引价格是否为 Platts 公布价、CFO Aboaf 的到任日期、2023 年回购金额。
  - "depends_on 为空：现有三个行业模块（支付与卡组织、非酒精即饮饮料、半导体代工）都不描述 SPGI 依赖的经济，即信用发行周期、ETF 资产规模与金融基准的监管引用；超大规模云厂商的 AI 资本开支发债约占上半年计费发行额的 6.8%（约 1,690 亿 ÷ 24,980 亿美元）[src:SPGI-RPT1-2026-09-18#p17] [src:SPGI-10Q-FY2026Q2#MD&A]，与半导体代工同受 AI 资本开支驱动，但那是需求叙事，不是代工经济。建议日后增设“信用评级与金融基准”或“资本市场发行周期”行业模块，再建立依赖；模块的路标应当包含 SPGI-L2 至 SPGI-L5 的可观测量（NAIC 对私募评级的规则与统计、评级相关立法、大型 ETF 的换指数、交易所结算价与 ACER 基准的采用），路标触发时 CI 才会自动重跑这几条定性测试。"
  - "岔路口 #5（第三方引用的累积）是期权而非失败条件，在 SPGI-S1 的复核里处理；#6（标准会不会为份额让步）没有能从申报文件直接回答的是非题，改用 SPGI-L7（与评级标准或利益冲突有关的新执法）做代理，其余部分在 SPGI-S3 的复核里处理；#6 中“私募评级里标普被质疑或推翻的比例”那一半已并入 SPGI-L2。"
  - 本文件带有报告自己算出的若干每股敏感度（永久亏损路径第一、四条，SPGI-L2、SPGI-Q11、SPGI-Q12 的 note）与 ROIC 拆解（SPGI-Q2）；非 MSFT 公司的公开 thesis.yml 可以带多少报告自己的计算，DESIGN 的默认是完整档案只公开 MSFT，待总部写决策记录定下界线，再决定这些数字留在公开侧、改为只引页码，还是移到私有仓库。
