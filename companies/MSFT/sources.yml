  - tag: MSFT-CALL-FY2026Q3
    kind: transcript
    title: Microsoft FY26 Q3 earnings call transcript (2026-04-29)
    date: 2026-04-29
    url: https://www.microsoft.com/en-us/investor/events/fy-2026/earnings-fy-2026-q3
    primary: true
    note: "The company hosts the full transcript on the investor-relations event page above (read 2026-09-25 and 2026-09-27); citations point to it. The CFO's calendar-2026 capex expectation of about $190 billion was given on this call (not on the FY26 Q4 call); report footnote [28]: the CFO expects headcount to decrease year over year in FY2027 (say-do ledger MSFT-MGT-05); commercial RPO growth excluding OpenAI of 26%; quarterly capex of $31.9 billion (company definition); the CFO's remark that the revenue share from OpenAI exists through 2030 under the amended agreement."

  - tag: MSFT-CALL-FY2026Q4
    kind: transcript
    title: Microsoft FY26 Q4 earnings call transcript (2026-07-29)
    date: 2026-07-29
    url: https://www.microsoft.com/en-us/investor/events/fy-2026/earnings-fy-2026-q4
    primary: true
    note: "The call and webcast took place on 2026-07-29 at 14:30 US Pacific time (17:30 Eastern), with the replay available until 2027-07-29; the earnings press release says forward-looking guidance is given on this call and webcast (the Business Outlook and Webcast Details paragraphs of Exhibit 99.1 of MSFT-8K-2026-07-29). The company hosts the full transcript on the investor-relations event page above (read 2026-09-25 and 2026-09-27); citations point to it. Report footnotes [4] and [7]: Copilot paid seats and usage, the statements on demand and capacity, the useful-life change and the calendar-2026 capex figure of about $175 billion. The FY2027 full-year guidance for Windows OEM and Devices (revenue to decline in the high teens) and the XBOX outlook also come from this call (say-do ledger MSFT-MGT-03, MSFT-MGT-04); for XBOX the call gave only FY27 Q1 guidance (content and services revenue to decline in the mid-single digits; hardware revenue to decline) and the CEO's expectation of a return to growth in fiscal 2027, with no full-year FY2027 figure. The FY27 Q1 M365 commercial cloud guidance was first given here (about 15% in constant currency), and the 8-K of 2026-09-02 mechanically adjusted it to about 17% on the new segment basis, the figure the report and the say-do ledger's MSFT-MGT-02 use."

