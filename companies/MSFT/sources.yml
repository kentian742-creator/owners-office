  - tag: MSFT-WEB-2025-10-28-1
    kind: web
    title: "The Official Microsoft Blog: “The next chapter of the Microsoft–OpenAI partnership” (2025-10-28)"
    date: 2025-10-28
    url: https://blogs.microsoft.com/blog/2025/10/28/the-next-chapter-of-the-microsoft-openai-partnership/
    primary: true
    note: "Company-hosted; also furnished as Exhibit 99.2 of MSFT-8K-2025-10-29, which the public archive cites. Read on 2026-09-25."

  - tag: MSFT-WEB-2026-04-27-1
    kind: web
    title: "The Official Microsoft Blog: “The next phase of the Microsoft-OpenAI partnership” (2026-04-27)"
    date: 2026-04-27
    url: https://blogs.microsoft.com/blog/2026/04/27/the-next-phase-of-the-microsoft-openai-partnership/
    primary: true
    note: "Company-hosted; read on 2026-09-27. The amended agreement: Microsoft remains OpenAI's primary cloud partner and OpenAI products ship first on Azure unless Microsoft cannot and chooses not to support them; OpenAI can serve all its products through any cloud provider; Microsoft's license to OpenAI IP for models and products runs through 2032 and is now non-exclusive; Microsoft no longer pays a revenue share to OpenAI; revenue-share payments from OpenAI to Microsoft continue through 2030, independent of OpenAI's technology progress, at the same percentage but subject to a total cap. It does not mention the $250 billion Azure commitment. The FY2026 10-K refers to the October 2025 and April 2026 extensions of the partnership."

