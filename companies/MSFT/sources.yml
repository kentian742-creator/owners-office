# MSFT source tag table (public; thesis-ci spec §3; schema: spec/schemas/sources.schema.json)
# Locator convention: N in MSFT-RPT1-2026-09-17#pN is the report's PDF page number, matching the page markers of the inputs/text extracted text
# (the page numbers printed in the report's header are one lower than the PDF page numbers: printed page 10 = PDF page 11).
# The archive's numbers currently all cite report pages; the primary documents registered below are the ones the report says it is based on, and the numbers are still to be checked against them one by one.
# The report cites no Microsoft 10-Q (its appendix cites only one Amazon 10-Q): the FY2026 10-K already covers the period to 2026-06-30,
# and Microsoft's first 10-Q on the new basis is for FY27 Q1 (around the end of October 2026), to be registered then.
# The accession numbers, filing dates, and 8-K item and exhibit numbers below were checked against EDGAR; the other notes come from the report's appendix.
sources:
  - tag: MSFT-RPT1-2026-09-17
    kind: report
    title: "After fifty-one years of collecting rent, buying property for the first time: the annuity is still there, and the question is when it pays back (Microsoft company report · a long-term holder's view, September 2026) (in Chinese)"
    date: 2026-09-17
    location: private:reports/MSFT.pdf
    primary: false
    note: The owner's 02 research report, in twelve sections; financial data as of FY2026 (through 2026-06-30). The report says its financial data follow the Form 10-K, 8-K and official call transcripts, that citations of others' analysis are marked as secondary, and that secondary sources never support a rating on their own. The full text is kept only in the private repository; the public archive cites page numbers only.

