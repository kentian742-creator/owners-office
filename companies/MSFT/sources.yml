  - tag: MSFT-CALL-FY2026Q4
    kind: transcript
    title: Microsoft FY26 Q4 earnings call transcript (2026-07-29)
    date: 2026-07-29
    url: http://www.microsoft.com/en-us/investor
    primary: true
    note: "The call and webcast took place on 2026-07-29 at 14:30 US Pacific time (17:30 Eastern), accessed through the investor relations URL above, with the replay available until 2027-07-29; the earnings press release says forward-looking guidance is given on this call and webcast (the Business Outlook and Webcast Details paragraphs of Exhibit 99.1 of MSFT-8K-2026-07-29). This archive does not have the full transcript of the call; citations add the report page that relays it. Report footnotes [4] and [7]: Copilot paid seats and usage intensity, the statements on demand and capacity, and the change in the capex definition. The FY2027 guidance for Windows OEM and Devices and for Xbox also comes from this call (say-do ledger MSFT-MGT-03, MSFT-MGT-04). The FY27 Q1 M365 commercial cloud guidance was first given here (about 15% in constant currency), and the 8-K of 2026-09-02 mechanically adjusted it to about 17% on the new segment basis, the figure the report and the say-do ledger's MSFT-MGT-02 use."
