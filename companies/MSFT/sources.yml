  - tag: MSFT-8K-2026-07-29
    kind: filing
    title: Microsoft Corporation FY26 Q4 earnings 8-K (Exhibit 99.1 is the earnings press release)
    issuer_cik: "0000789019"
    form: 8-K
    period: FY2026Q4
    accession: "0001193125-26-323632"
    filed: 2026-07-29
    date: 2026-07-29
    url: https://www.sec.gov/Archives/edgar/data/789019/000119312526323632/0001193125-26-323632-index.htm
    primary: true
    note: Items 2.02 and 9.01; apart from the XBRL files it has only Exhibit 99.1 (the FY26 Q4 earnings press release), and the “8-K segment history exhibit” named in the report's appendix is not in this 8-K. The report uses it for the fourth-quarter and full-year results and Xbox content and services revenue; footnote [1] in section two of the report cites both the FY2026 10-K and this press release, covering the FY2026 segment figures and the FY2027 guidance for Windows OEM and Xbox. The press release's Business Outlook paragraph says forward-looking guidance is given on the call and webcast, and the 10-K does not contain these two pieces of guidance either, so this archive records them under MSFT-CALL-FY2026Q4.

  - tag: MSFT-8K-2026-09-02
    kind: filing
    title: Microsoft Corporation 8-K and Exhibit 99.1, “FY27 Segments and Investor Metrics”
    issuer_cik: "0000789019"
    form: 8-K
    period: FY2027
    accession: "0001193125-26-380280"
    filed: 2026-09-02
    date: 2026-09-02
    url: https://www.sec.gov/Archives/edgar/data/789019/000119312526380280/0001193125-26-380280-index.htm
    primary: true
    note: "Items 7.01 and 9.01 (Reg FD, not an earnings 8-K). From FY2027 the reportable segments go from three to two (Agents and Infra, Devices and Consumer), Azure's definition narrows and its dollar revenue is disclosed quarterly for the first time, M365 commercial seats include paid GitHub seats, and FY2026 is restated. All of this archive's watch indicators and thesis breakers are judged on this new basis. Slide 21 of Exhibit 99.1 (FY27 Q1 Outlook Detail) only mechanically adjusts the FY27 Q1 guidance given on 2026-07-29 to the new segment basis: M365 commercial cloud moves from about 15% to about 17% in constant currency; this figure of about 17% is what section four of the report footnotes to this document (footnote [9]), and the say-do ledger's MSFT-MGT-02 cites it."

