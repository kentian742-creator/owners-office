    fail_if: In the FY2028 annual report, the conversion of free cash flow to non-GAAP net income is below 45%
    rule: {op: "<", threshold: 45, unit: "%", consecutive: 1, period: year, evaluate_on: [FY2028], note: "Judged on the FY2028 annual report only; the FY2027 annual report and those for FY2029 and later do not apply."}
    data: filing_text
    effective_from: FY2027Q1
    first_readable: 2028-07
