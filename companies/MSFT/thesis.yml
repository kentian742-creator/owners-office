tests:
  # ---------- Lynch stalwart template (all five kept; MSFT-Q4 changes the metric and rewrites the threshold, MSFT-L1 rewrites the question; reasons in each note) ----------
  - id: MSFT-Q1
    type: quantitative
    claim: Growth has not slipped out of the stalwart range
    origin: template:stalwart
    severity: watch
    covers: [growth]
    pillar: P1
    metric: revenue_yoy
    fail_if: Below 5% for 4 consecutive quarters
    rule: {op: "<", threshold: 5, unit: "%", consecutive: 4, period: quarter}
    warn_if: Below 8% for 2 consecutive quarters
    warn_rule: {op: "<", threshold: 8, unit: "%", consecutive: 2, period: quarter}
    data: xbrl
    effective_from: FY2027Q1
    first_readable: 2026-10
    baseline:
      value: 17.8
      unit: "%"
      period: FY2026
      as_of: 2026-06-30
      source: MSFT-10K-FY2026#p50
      note: "Revenue rose from $281.7 billion in FY2025 to $331.8 billion in FY2026, +17.8% (the company rounds it to 18%) [src:MSFT-10K-FY2026#p50] [src:MSFT-10K-FY2026#p37]."
    note: "The thresholds are the template defaults. They are far from FY2026's growth rate, so this test is only a floor: the early signals of slowing growth are in the segment tests, namely Azure growth (MSFT-Q10's warning line and MSFT-Q5), Microsoft 365 commercial cloud and seat growth (MSFT-Q12's warning line), and whether seats are falling (MSFT-Q9). The report treats the More Personal Computing business (Windows OEM, Xbox, search advertising) as background, not as part of the thesis [src:MSFT-RPT1-2026-09-17#p3], and the company's FY2027 guidance is for Windows OEM and Devices revenue to decline in the high teens [src:MSFT-CALL-FY2026Q4]; when company-wide growth slows, check the tests above first to see which business is slowing."

  - id: MSFT-Q2
    type: quantitative
    claim: Return on invested capital holds at the level of an excellent business
    origin: template:stalwart
    severity: watch
    covers: [returns_on_capital, moat]
    pillar: P3
    metric: roic
    fail_if: Below 12% for 2 consecutive years
    rule: {op: "<", threshold: 12, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2027Q1
    first_readable: 2027-07
    note: "Both the claim and the threshold are the template defaults. The report gives no company-wide return on invested capital, so the baseline is to be backfilled from the XBRL of the FY2026 annual report. This test cannot see the data centers' drag on returns: invested capital in the registry's roic is equity plus interest-bearing debt minus cash, excluding lease liabilities, and most of the datacenter capacity Microsoft has committed to but not yet received comes through leases: $329.1 billion of leases not yet commenced, primarily datacenters, against $34.6 billion of construction commitments at 2026-06-30 [src:MSFT-10K-FY2026#p78] [src:MSFT-10K-FY2026#p69]. The existing base is mixed: finance-lease assets were $82.7 billion of $431.8 billion of property and equipment at cost [src:MSFT-10K-FY2026#p78] [src:MSFT-10K-FY2026#p69]. Lease obligations including imputed interest were $443.5 billion at 2026-06-30 [src:MSFT-10K-FY2026#p44], against long-term debt principal of $46.1 billion at the same date [src:MSFT-10K-FY2026#p72]. From FY2027 Microsoft extended the estimated useful lives of datacenters and office buildings from 15 to 25 years, so more of its future datacenter leases will be classified as operating rather than finance leases; finance leases count in the company's capex and operating leases do not [src:MSFT-CALL-FY2026Q4]. The annuity's high returns will also mask the returns on new investment for many years, so this test is a floor, not an early signal; for early signals, see MSFT-Q5 and MSFT-Q7. An incremental measure: company-wide, the FY2023–FY2026 increase in after-tax operating income equals 23.7% of FY2024–FY2026 cash capex, or 38.9% of FY2023–FY2025 cash capex with a one-year lag (this archive's calculation, with method and inputs in F29) [src:MSFT-10K-FY2026#p50] [src:MSFT-10K-FY2025#Item8] [src:MSFT-10K-FY2026#p53]. The report's own range of 13% to 39% was calculated on two bases, the whole company and Intelligent Cloud [src:MSFT-RPT1-2026-09-17#p13]; Intelligent Cloud's history was recast in FY2025 (FY2024 operating income $49,584 million as first reported, $37,813 million as recast) and the segment is not reported from FY2027, so any figure built on it spans bases [src:MSFT-10K-FY2024#Item8] [src:MSFT-10K-FY2026#Note18] [src:MSFT-8K-2026-09-02#EX-99.1-slide15]. One condition for raising the capital allocation rating to B+ is a three-year incremental after-tax return reading above 20% [src:MSFT-RPT1-2026-09-17#p3]; it is read against F29's method."

  - id: MSFT-Q3
    type: quantitative
    claim: Buybacks are truly shrinking the share count, not offsetting stock-based compensation
    origin: template:stalwart
    severity: watch
    covers: [capital_allocation]
    pillar: P6
    metric: diluted_shares_yoy
    fail_if: Above 0 for 2 consecutive years
    rule: {op: ">", threshold: 0, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2027Q1
    first_readable: 2027-07
    baseline:
      value: null
      unit: "%"
      period: FY2026 (year on year)
      as_of: 2026-06-30
      source: MSFT-10K-FY2026
      note: "The year-on-year reading is to be backfilled from the XBRL of the FY2026 annual report. Five-year readings for FY2022–FY2026: buybacks of $112.9 billion, of which $24.8 billion were repurchases for tax withholding, and stock-based compensation expense of $52.2 billion, equal to 46% of the buyback cash [src:MSFT-10K-FY2026#p53] [src:MSFT-10K-FY2024#Item8] [src:MSFT-10K-FY2026#Note15] [src:MSFT-10K-FY2024#Note16] [src:MSFT-10K-FY2023#Note16]. How much of the 263 million repurchased shares truly reduced the count depends on the basis: on diluted weighted-average shares (7,608 million in FY2021 to 7,453 million in FY2026, −2.0%) about 59%, and on period-end shares outstanding (−92 million, −1.2%) about 35%, the other 65% being offset by 171 million shares issued under employee stock plans (this archive's calculation) [src:MSFT-10K-FY2023#Item8] [src:MSFT-10K-FY2026#p50] [src:MSFT-10K-FY2026#Note15] [src:MSFT-10K-FY2024#Note16]."
    note: "The threshold is the template default. Standard two in section six of the report asks whether shareholder returns were offset by new debt or equity: on a net basis they were not, since net debt repayment over FY2022–FY2026 was $23.2 billion and shares outstanding fell by 92 million [src:MSFT-10K-FY2026#p53] [src:MSFT-10K-FY2025#Item8] [src:MSFT-10K-FY2024#Item8] [src:MSFT-10K-FY2026#Note15] [src:MSFT-10K-FY2024#Note16]. This test watches a different question, how much of the buybacks truly reduced the share count: between about 35% and 59% by basis, as the baseline note shows [src:MSFT-10K-FY2026#Note15] [src:MSFT-10K-FY2026#p50]."

  - id: MSFT-Q4
    type: quantitative
    claim: "Profit turns back into cash: the conversion of free cash flow to non-GAAP net income recovers from its ten-year low"
    origin: template:stalwart
    severity: watch
    covers: [free_cash_flow]
    pillar: P4
    metric: fcf_to_non_gaap_net_income
    fail_if: From FY2027, not above FY2026's 52% for 2 consecutive fiscal years
    rule: {op: "<=", threshold: 52, unit: "%", consecutive: 2, period: year, evaluate_from: FY2027, note: "Counted from the FY2027 annual report; FY2026 itself does not count toward the consecutive periods."}
    warn_if: From FY2027, any fiscal year not above 52% (no recovery)
    warn_rule: {op: "<=", threshold: 52, unit: "%", consecutive: 1, period: year, evaluate_from: FY2027, note: "Counted from the FY2027 annual report; FY2026 itself does not count."}
    data: filing_text
    effective_from: FY2027Q1
    first_readable: 2027-07
    baseline:
      value: 52.0
      unit: "%"
      period: FY2026
      as_of: 2026-06-30
      source: MSFT-10K-FY2026#p42
      note: "FY2026: free cash flow of $66,987 million ÷ adjusted net income of $128,786 million [src:MSFT-10K-FY2026#p53] [src:MSFT-10K-FY2026#p42]. On the current definition, which excludes OpenAI gains and losses and which the company has recast only back to FY2024: FY2024 83.0%, FY2025 67.9% (as originally reported, when neither year had non-GAAP adjustments: 84.0% and 70.3%) [src:MSFT-10K-FY2026#p42] [src:MSFT-10K-FY2024#Item7] [src:MSFT-10K-FY2025#Item7]. On each year's own reported definition, not recast: FY2021 92.5%, FY2022 93.8%, FY2023 81.1% (F28) [src:MSFT-10K-FY2022#Item7] [src:MSFT-10K-FY2023#Item7] [src:MSFT-10K-FY2023#Item8]. The two sets are not one series. FY2026 is the lowest reading since at least FY2016 on any basis (FY2016–FY2020: 97.5%–194.6% of GAAP net income) [src:MSFT-10K-FY2018#Item8] [src:MSFT-10K-FY2021#Item8]."
    note: "Rewritten template: not only the threshold but also the metric was changed, which goes beyond the template README's permission to change thresholds only; the integration step is to record this in a decision record (see todo). The template's default is the registry's fcf_conversion (GAAP net income basis, computable from XBRL), failing after 2 consecutive years below the normal line; on the current non-GAAP definition, FY2025's 67.9% and FY2026's 52.0% are already two consecutive years below that normal line [src:MSFT-10K-FY2026#p42] [src:MSFT-10K-FY2026#p53], so judged as written, the test would fail on creation and bring no new information. Two changes are made here, both taken from the report. One: the metric becomes free cash flow ÷ non-GAAP net income as used throughout the report (capex excluding finance leases), the same number MSFT-Q6 reads [src:MSFT-RPT1-2026-09-17#p4]; the cost is that the denominator is defined by the company, has to be extracted from the reconciliation table of the earnings release or the 10-K [src:MSFT-8K-2026-07-29#EX-99.1] [src:MSFT-10K-FY2026#p42], and changes over time: the FY2021–FY2023 definitions excluded other items, and the current one, which excludes OpenAI gains and losses, is recast only back to FY2024 (F11, F28). Each year is read on the definition in force for that year, and the update that records the reading names it; this archive no longer has a cash conversion test computable directly from XBRL. Two: the threshold becomes the healthy line of section ten's watch indicator #4, “recovery after FY2027”, with FY2026's 52.0% as the base [src:MSFT-10K-FY2026#p42] [src:MSFT-RPT1-2026-09-17#p11]. The template's normal line has a counterpart in the report: conversion returning above 70% once capacity runs full is explanation A, a new normal of 50–65% is explanation B, and the two cannot be separated before FY2028 [src:MSFT-RPT1-2026-09-17#p5]; review this test once the FY2028 annual report is out. Watch indicator #4's trigger line is breaker two; see MSFT-Q6."

  - id: MSFT-L1
    type: qualitative
    claim: Management has not withdrawn, or revised in an unfavorable direction, any outlook it has given that has not yet come due
    origin: template:stalwart
    severity: watch
    covers: [management]
    pillar: P6
    question: "In this period's earnings press release, call materials or 10-Q/10-K, did management withdraw an outlook or guidance given earlier that has not yet come due, or revise the outlook for the same period in an unfavorable direction, that is, lower the expected growth of revenue, operating profit or a segment (Azure, M365 commercial cloud, Windows OEM and Devices, Xbox) (for a line already expected to decline, a larger expected decline), or lower the expected operating margin? Figures rewritten only because of a change in accounting basis, segment basis or how leases are booked do not count; changes to capex plans are outside this question and are tracked by MSFT-Q5 and MSFT-Q13."
    fail_if: An outlook or guidance not yet due was withdrawn, and no testable replacement figure was given at the same time
    warn_if: The outlook for the same period was revised in an unfavorable direction (with new figures given at the same time)
    judge: independent_model
    evidence: required
    where: The earnings 8-K's press release, the earnings call transcript and investor materials, the 10-Q/10-K MD&A
    lookback: 4
    effective_from: FY2027Q1
    first_readable: 2026-10
    baseline:
      value: "FY27 Q1 guidance: Microsoft 365 commercial cloud revenue growth of about 17% in constant currency (FY27 new basis, mechanically adjusted to the new segment basis from the roughly 15% given on 2026-07-29)"
      source: MSFT-8K-2026-09-02#EX-99.1-slide21
      note: "Other guidance given on the FY26 Q4 earnings call of 2026-07-29 [src:MSFT-CALL-FY2026Q4]: for FY2027, Windows OEM and Devices revenue to decline in the high teens; for XBOX, only FY27 Q1 guidance (content and services revenue to decline in the mid-single digits, hardware revenue to decline), together with the CEO's statement that the company expects “to return the business to growth in fiscal 2027” [src:MSFT-CALL-FY2026Q4]. The “seat growth of about 7% on the new basis” that the report writes next to that quarter's guidance is FY2026 seat growth restated on the new basis [src:MSFT-8K-2026-09-02#EX-99.1-slide18]; the FY27 Q1 outlook has no seat-growth item [src:MSFT-8K-2026-09-02#EX-99.1-slide21], and the FY26 Q4 call gives no seat guidance [src:MSFT-CALL-FY2026Q4]. The calendar-2026 capex expectation moved from about $190 billion [src:MSFT-CALL-FY2026Q3] to about $175 billion [src:MSFT-CALL-FY2026Q4] because, from FY2027, the company extended the estimated useful lives of datacenters and office buildings from 15 to 25 years, so more of its future datacenter leases shift from finance to operating leases, which its capex figure excludes; the company says its investment expectation is otherwise unchanged, so this is a change in how leases are booked, not a revision [src:MSFT-CALL-FY2026Q4]."
    note: "Rewritten template: the template asks about published medium-term financial targets; the report does not mention Microsoft publishing medium-term targets and records only guidance already given (see baseline), so here “targets” is read as the outlook and guidance management has given that has not yet come due. “Microsoft gives next-quarter guidance only on each quarterly call and its full-year outlook on the fourth-quarter call” is this archive's working assumption, not stated in the report, to be checked against the call transcripts (see todo). fail_if keeps the template's meaning (withdrawn with no testable replacement figure); an unfavorable revision is recorded as a warning, a level this archive added. Capex is kept out of this question: raising capex is not an unkept promise but capital allocation, and lowering it is exactly the direction pillar P4 wants; both are tracked by MSFT-Q5 and MSFT-Q13 as a share of revenue."

  # ---------- Section ten of the report: thesis breakers (if any one holds, the investment thesis is void, not merely downgraded) ----------
  - id: MSFT-Q5
    type: quantitative
    claim: "The compute spending is buying growth: while capex is still high, Azure growth has not dropped"
    origin: report:breaker
    severity: breaker
    covers: [growth, returns_on_capital, capital_allocation]
    pillar: P3
    metric_def:
      id: azure_growth_vs_capex_intensity
      description: Azure revenue growth year on year and cash capex as a share of revenue in the same quarter (both judged in the same quarter)
      unit: "%"
      frequency: quarter
      data: mixed
      components:
        azure_revenue_yoy: {description: "Azure revenue growth year on year (FY27 new basis, restated in the 8-K of 2026-09-02; constant currency), as defined by the company", unit: "%", where: segment note or earnings press release}
        capex_to_revenue: {description: "Cash capex ÷ revenue (excluding finance leases), defined as in the registry's capex_to_revenue", unit: "%", xbrl: ["us-gaap:PaymentsToAcquirePropertyPlantAndEquipment"]}
    fail_if: Azure constant-currency growth below 20% for two consecutive quarters while cash capex in the same period is still above 25% of revenue (capex excluding finance leases)
    rule:
      all_of:
        - {metric: azure_growth_vs_capex_intensity.azure_revenue_yoy, op: "<", threshold: 20, unit: "%"}
        - {metric: azure_growth_vs_capex_intensity.capex_to_revenue, op: ">", threshold: 25, unit: "%"}
      consecutive: 2
      period: quarter
      note: Both must hold in the same quarter, for two consecutive quarters; Azure on the new basis in constant currency, capex taken as cash capex from the cash flow statement.
    data: mixed
    effective_from: FY2027Q1
    first_readable: 2026-10
    baseline:
      value: 42
      unit: "%"
      period: FY2026Q4 (June quarter, new basis, constant currency)
      as_of: 2026-06-30
      source: MSFT-8K-2026-09-02#EX-99.1-slide18
      note: "June-quarter Azure revenue of $29,417 million on the FY2027 definition [src:MSFT-8K-2026-09-02#EX-99.1-slide17]; FY2026 full-year cash capex was 34.9% of revenue [src:MSFT-10K-FY2026#p53] [src:MSFT-10K-FY2026#p50]."
    note: "Breaker one in section ten of the report. Azure's history on the FY2027 definition is restated in the 8-K of 2026-09-02 [src:MSFT-8K-2026-09-02#EX-99.1-slide17]. The second condition uses the registry's capex_to_revenue definition (xbrl), consistent with the report's “cash capex always excludes finance leases, and section ten's thresholds are written on this basis” [src:MSFT-RPT1-2026-09-17#p4]; the company's own capex figure includes finance leases (about $145 billion in FY2026, see F9) [src:MSFT-CALL-FY2026Q4]. An earlier-stage alarm is watch indicator #1, two consecutive quarters below 25% (see MSFT-Q10) [src:MSFT-RPT1-2026-09-17#p11]."

  - id: MSFT-Q6
    type: quantitative
    claim: "The capex cycle has not pushed the cash content of profit through the thesis invalidation line: in the FY2028 annual report, the conversion of free cash flow to non-GAAP net income is not below 45% [src:MSFT-RPT1-2026-09-17#p11]"
    origin: report:breaker
    severity: breaker
    covers: [free_cash_flow, returns_on_capital]
    pillar: P4
    metric: fcf_to_non_gaap_net_income
    fail_if: In the FY2028 annual report, the conversion of free cash flow to non-GAAP net income is below 45%
    rule: {op: "<", threshold: 45, unit: "%", consecutive: 1, period: year, evaluate_on: [FY2028], note: "Judged on the FY2028 annual report only; the FY2027 annual report and those for FY2029 and later do not apply."}
    data: filing_text
    effective_from: FY2027Q1
    first_readable: 2028-07
    baseline:
      value: 52.0
      unit: "%"
      period: FY2026
      as_of: 2026-06-30
      source: MSFT-10K-FY2026#p42
      note: "Free cash flow of $66,987 million ÷ adjusted net income of $128,786 million, on the current definition, which excludes OpenAI gains and losses [src:MSFT-10K-FY2026#p53] [src:MSFT-10K-FY2026#p42]."
    note: "Breaker two in section ten of the report, and also watch indicator #4's trigger line. The FY2028 reading is taken on the non-GAAP definition in force for FY2028, as the company reports it; if that definition differs from FY2026's, the update names both. This line is looser than “conversion stops falling”: as long as FY2028 is not below 45%, it does not trigger even if it is lower than FY2026's 52.0% [src:MSFT-RPT1-2026-09-17#p11] [src:MSFT-10K-FY2026#p42]; a continued decline that does not break the line is recorded by MSFT-Q4's warning and failure lines. The report keeps this line separate from the depreciation curve: depreciation is a non-cash charge that weighs on profit, not on conversion; what really weighs on conversion is the cash outlay of capex, and whether conversion recovers depends on when capex comes down [src:MSFT-RPT1-2026-09-17#p4]. Both lines can first be read in the annual report of July 2028, but they cannot corroborate each other [src:MSFT-RPT1-2026-09-17#p4]. For years after FY2028, the threshold will be rewritten in the update at that time."

