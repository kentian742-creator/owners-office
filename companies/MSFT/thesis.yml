    note: "报告第七节列出、2028 年之前就能改写判断的三个读数之一：7,438 亿美元合同义务这张会变重的表 [src:MSFT-RPT1-2026-09-17#p8]，是三条利率传导路径里唯一直接落在这家公司身上的一条，在 FY2027 每一季的 10-Q 里都能读到 [src:MSFT-RPT1-2026-09-17#p9]。另外两个读数：利率只进估值（私有仓库），OpenAI 的 8-K 由 MSFT-L3、MSFT-L5 跟踪。门槛（一年内到期的承诺超过一年的经营现金流）是本档案事先写下的，报告没有给，待本人确认（见 todo）；10-Q 若不按到期年份披露采购承诺，这条只能按 10-K 每年读一次。报告同时提醒，2026 年 9 月之后新签的租赁，定价基准已从一年前约 4.2% 的 10 年期变成 5.0% 以上 [src:MSFT-RPT1-2026-09-17#p9]，这一项在更新里记录，不设门槛。"

