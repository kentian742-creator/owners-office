    rule: {op: "<", threshold: 10, unit: "%", consecutive: 1, period: quarter}
    warn_if: 低于 15%（离开健康区间）
    warn_rule: {op: "<", threshold: 15, unit: "%", consecutive: 1, period: quarter}
    data: filing_text
    effective_from: FY2027Q1
    first_readable: 2026-10
    baseline:
      value: 25
      unit: "%"
      period: FY2026Q4
      as_of: 2026-06-30
      source: MSFT-RPT1-2026-09-17#p11
    note: "报告第十节前瞻指标 #2：健康区间不低于 15%，低于 10% 触发关注 [src:MSFT-RPT1-2026-09-17#p11]。报告提醒，剔除 OpenAI 的余额里分不开 neocloud 与真实企业，所以即便这条健康，集中度本身仍在 [src:MSFT-RPT1-2026-09-17#p8]。"

  - id: MSFT-Q12
    type: quantitative
    claim: Copilot 加购层在续约：M365 商业云增速与席位增速之间的缺口没有收窄
    origin: report:watch
    severity: watch
    covers: [pricing_power, moat, unit_economics]
    pillar: P2
    metric_def:
      id: m365_cloud_minus_seat_growth
      description: M365 商业云收入同比增速减去 M365 商业席位同比增速（新口径），即每席位收入的增长
      unit: pp
      frequency: quarter
      data: filing_text
      where: 业绩新闻稿与电话会纪要；10-Q/10-K MD&A
      formula: m365_commercial_cloud_revenue_yoy - m365_commercial_seats_yoy
      components:
        m365_commercial_cloud_revenue_yoy:
          description: Microsoft 365 商业云收入同比增速（固定汇率），公司口径
          unit: "%"
          where: 业绩新闻稿与电话会纪要；10-Q/10-K MD&A
        m365_commercial_seats_yoy:
          description: Microsoft 365 商业席位同比增速（FY27 新口径，含 GitHub 付费席位），公司口径
          unit: "%"
          where: 业绩新闻稿与电话会纪要；10-Q/10-K MD&A 中的 Microsoft 365 commercial seat growth
    fail_if: 缺口收窄到 5 个百分点以内
    rule: {op: "<=", threshold: 5, unit: pp, consecutive: 1, period: quarter}
    warn_if: M365 商业云增速低于 12%，或席位增速低于 4%（离开健康区间）
    warn_rule:
      any_of:
        - {metric: m365_cloud_minus_seat_growth.m365_commercial_cloud_revenue_yoy, op: "<", threshold: 12, unit: "%", consecutive: 1, period: quarter}
        - {metric: m365_cloud_minus_seat_growth.m365_commercial_seats_yoy, op: "<", threshold: 4, unit: "%", consecutive: 1, period: quarter}
    data: filing_text
    effective_from: FY2027Q1
    first_readable: 2026-10
    baseline:
      value: 10
      unit: pp
      period: FY2026（商业云 16% − 席位 6%，旧口径）
      as_of: 2026-06-30
      source: MSFT-RPT1-2026-09-17#p11
      note: "FY27 第一季度公司给 Microsoft 365 商业云的指引是固定汇率约 17%（FY27 新口径）[src:MSFT-8K-2026-09-02#EX-99.1-slide21]；报告写在它旁边的“新口径席位增速约 7%”，是 FY2026 按新口径重述后的读数 [src:MSFT-RPT1-2026-09-17#p11]，公司是否另给了席位增速的指引待核对（见 todo）。"
    note: "报告第十节前瞻指标 #5。算式：约 3,000 万付费席位 × 每席位每月 30 美元 × 12 ≈ 每年约 108 亿美元的 Copilot 年化收入，占 M365 商业云 1,020 亿美元的 10.6%，几乎解释了商业云增速与席位增速之间约 10 个百分点的缺口 [src:MSFT-RPT1-2026-09-17#p6]；三个输入都有限定（全球席位、标价而非实收、美国面板的活跃率）[src:MSFT-RPT1-2026-09-17#p6]。若其中约 69 亿美元买了没怎么用的席位在一年内流失，缺口会收窄到约 4 个百分点 [src:MSFT-RPT1-2026-09-17#p6]；缺口仍在 10 个百分点上下说明加购层在续，收窄到 5 个百分点以内说明那 69 亿美元正在流失 [src:MSFT-RPT1-2026-09-17#p6]。健康区间“≥12% / ≥4%”按商业云增速与席位增速分别理解 [src:MSFT-RPT1-2026-09-17#p11]。"

  # ---------- 本档案自加（origin: manual）：报告第七节里有分界、但没有列进第十节的两个读数 ----------
  - id: MSFT-Q13
    type: quantitative
    claim: 资本开支周期会回落，而不是停在算力生意的高位上
    origin: manual
    severity: watch
    covers: [capital_allocation, free_cash_flow]
    pillar: P4
    metric: capex_to_revenue
    fail_if: FY2028 之后的财年，现金资本开支占收入仍高于 30%（反方论点一成立）
    rule: {op: ">", threshold: 30, unit: "%", consecutive: 1, period: year, evaluate_from: FY2029, note: "从 FY2029 年报起按财年判定，FY2028 及以前不计。"}
    warn_if: FY2028 之后的财年，现金资本开支占收入没有回到 20% 以下
    warn_rule: {op: ">=", threshold: 20, unit: "%", consecutive: 1, period: year, evaluate_from: FY2029, note: "从 FY2029 年报起按财年判定，FY2028 及以前不计。"}
    data: xbrl
    effective_from: FY2027Q1
    first_readable: 2029-07
    baseline:
      value: 34.9
      unit: "%"
      period: FY2026
      as_of: 2026-06-30
      source: MSFT-RPT1-2026-09-17#p5
      note: "FY2021 为 12.3%、FY2024 为 18.1%、FY2025 为 22.9% [src:MSFT-RPT1-2026-09-17#p5]。"
    note: "报告第七节反方论点一的分界变量：资本开支在 FY2028 后回到收入的 20% 以下，折旧曲线会在 FY2030 前后触顶、转换率回到 70% [src:MSFT-RPT1-2026-09-17#p8]；继续在 30% 以上，反方是对的 [src:MSFT-RPT1-2026-09-17#p8]。报告没有把它列进第十节的论点破坏信号，所以这里只记 watch；门槛取自报告，“FY2028 后”读作从 FY2029 年报起，是本档案的读法（见 todo）。口径同第十节：现金资本开支不含融资租赁 [src:MSFT-RPT1-2026-09-17#p4]。这是支柱 P4 里“资本开支周期会回落”那一半的直接测试，另一半（转换率）由 MSFT-Q4、MSFT-Q6 跟踪。"

  - id: MSFT-Q14
    type: quantitative
    claim: 固定承诺没有压过经营现金流：一年内到期的采购承诺不超过最近一年的经营现金流
    origin: manual
    severity: watch
    covers: [balance_sheet, capital_allocation]
