thesis:
  summary: "Microsoft is two businesses stuck together. One rents Microsoft 365 (with the cloud portion of Windows Commercial), Dynamics and LinkedIn's Talent and Sales Solutions to businesses by the seat [src:MSFT-10K-FY2026#p5]; the Productivity and Business Processes segment had FY2026 revenue of $140.0 billion at an operating margin of 59.9% [src:MSFT-10K-FY2026#p38]. The other is Azure computing power, whose revenue passed $100 billion for the first time in FY2026 [src:MSFT-8K-2026-07-29#EX-99.1]. What glues the two together is one customer directory and one identity and compliance system; the switching costs sit in the layer of file formats, the identity directory (Entra) and compliance auditing (Purview) [src:MSFT-RPT1-2026-09-17#p3] [src:MSFT-WEB-2026-09-25-2] [src:MSFT-WEB-2026-09-25-3], while the Copilot add-on, listed at $30 per user per month on an annual subscription [src:MSFT-WEB-2026-09-25-1], has almost no switching costs of its own [src:MSFT-RPT1-2026-09-17#p3]. For the first time, it is putting the annuity's cash into data centers on a large scale: FY2026 cash capex was $115.9 billion, 34.9% of revenue [src:MSFT-10K-FY2026#p53], and free cash flow fell to 52.0% of non-GAAP net income in FY2026, from 83.0% in FY2024 on the same definition, which excludes OpenAI gains and losses [src:MSFT-10K-FY2026#p42] [src:MSFT-10K-FY2026#p53]; in FY2021–FY2023 it ran at 81.1%–93.8% on each year's own definition (F11 and F28 give the calculations) [src:MSFT-10K-FY2022#Item7] [src:MSFT-10K-FY2023#Item7] [src:MSFT-10K-FY2023#Item8]. For the thesis to hold, the base has to keep collecting rent in the agent era, compute growth has to be profitable and the capex cycle has to come down, and the $678 billion of commercial RPO at 2026-06-30 [src:MSFT-10K-FY2026#p77] has to rest on more than OpenAI alone, whose share was about 45% at the only disclosure (FY26 Q2, of $625 billion at 2025-12-31) [src:MSFT-CALL-FY2026Q2] [src:MSFT-8K-2026-01-28#EX-99.1]."
  pillars:
    - id: P1
      claim: "The annuity base is still getting stronger: the switching costs sit in the layer of file formats, the identity directory and compliance auditing [src:MSFT-RPT1-2026-09-17#p3], and the Productivity and Business Processes segment's operating margin was 59.9% in FY2026 [src:MSFT-10K-FY2026#p38]; the segment is not reported from FY2027, and its successor, Agents and Infra, had a restated FY2026 operating margin of 50.9% [src:MSFT-8K-2026-09-02#EX-99.1-slide15]. In FY2026 Microsoft 365 Commercial cloud revenue grew 17% (14% in constant currency, and 18% and 15% on the FY2027 definition) while commercial seats grew 6% (7% on the FY2027 definition) [src:MSFT-10K-FY2026#p38] [src:MSFT-8K-2026-09-02#EX-99.1-slide18]. The company does not disclose Microsoft 365 Commercial cloud revenue in dollars; the line that contains it, Microsoft 365 Commercial products and cloud services, also includes on-premises licences and was $102.0 billion in FY2026, up 16% [src:MSFT-10K-FY2026#Note18] [src:MSFT-10K-FY2026#p38]."
      source: MSFT-10K-FY2026#p38
    - id: P2
      claim: "The thesis needs the base to keep its pricing power in the agent era, and the report says this is exactly the biggest issue for this business today: if the entry point to daily work shifts from opening an app to talking to an agent, the file and identity layer stays, but pricing power flows to whoever owns that interface [src:MSFT-RPT1-2026-09-17#p4]. The add-on layer itself has almost no switching costs: in a vendor panel of U.S. paid users (Recon Analytics, more than 150,000 respondents, July 2025 to January 2026), which is L2 only with no primary data seen, only 8% chose Copilot when three tools were available, and 35.8% of those with workplace access to Copilot actively used it [src:MSFT-WEB-2026-02-03-1]; so the base has to carry the renewals, and agent or usage revenue has to take over before seats peak [src:MSFT-RPT1-2026-09-17#p6]. This pillar is tested by MSFT-Q12 (whether the add-on layer renews) and MSFT-Q9 (whether agent or usage revenue catches the fall when seats decline)."
      source: MSFT-RPT1-2026-09-17#p4
    - id: P3
      claim: "The compute business's growth is profitable: Azure revenue passed $100 billion for the first time in FY2026, up 41% (old basis) [src:MSFT-8K-2026-07-29#EX-99.1] [src:MSFT-10K-FY2026#p39], and Microsoft Cloud gross margin was 66% for FY2026 and 65% in the fourth quarter, on the FY2026 definition [src:MSFT-10K-FY2026#p37] [src:MSFT-CALL-FY2026Q4]; the company says customer demand continues to exceed available capacity [src:MSFT-CALL-FY2026Q4]. Company-wide, the increase in after-tax operating income from FY2023 to FY2026 ($53.4 billion) equals 23.7% of FY2024–FY2026 cash capex, or 38.9% of FY2023–FY2025 cash capex with a one-year lag (this archive's calculation, F29) [src:MSFT-10K-FY2026#p50] [src:MSFT-10K-FY2025#Item8] [src:MSFT-10K-FY2026#p53]; the report's own range of 13% to 39% was calculated on two bases, the whole company and Intelligent Cloud [src:MSFT-RPT1-2026-09-17#p13]."
      source: MSFT-10K-FY2026#p39
    - id: P4
      claim: "The capex cycle will come down and profit will turn back into cash: FY2026 cash capex was 34.9% of revenue [src:MSFT-10K-FY2026#p53], and free cash flow was 52.0% of non-GAAP net income in FY2026, against 83.0% in FY2024 on the same current definition and 81.1%–93.8% in FY2021–FY2023 on each year's own definition (F11, F28) [src:MSFT-10K-FY2026#p42] [src:MSFT-10K-FY2022#Item7] [src:MSFT-10K-FY2023#Item7]; whether conversion recovers depends on when capex comes down [src:MSFT-RPT1-2026-09-17#p4]. The healthy line written in section ten of the report is a recovery after FY2027 (MSFT-Q4), and the thesis invalidation line is below 45% in the FY2028 annual report, read on the non-GAAP definition in force for FY2028 (MSFT-Q6) [src:MSFT-RPT1-2026-09-17#p11]; whether capex comes down, by section seven's dividing line (back below 20% of revenue after FY2028, or still above 30%), is tracked by MSFT-Q13 [src:MSFT-RPT1-2026-09-17#p8]. Where conversion settles is a separate question: explanation A says it returns above 70% once capacity runs full, explanation B says the new normal is 50–65%, and the two cannot be told apart before FY2028 [src:MSFT-RPT1-2026-09-17#p5]; this difference falls on the valuation (only in the private repository), not on the thesis invalidation line."
      source: MSFT-10K-FY2026#p42
    - id: P5
      claim: "The demand behind the RPO comes from more than one customer: commercial RPO was $678 billion at 2026-06-30 [src:MSFT-10K-FY2026#p77], and the only disclosed single-customer share is about 45% from OpenAI (FY26 Q2, of $625 billion at 2025-12-31) [src:MSFT-CALL-FY2026Q2]; excluding OpenAI, commercial RPO grew 25% year on year at FY2026Q4, and all of that quarter's sequential increase came from customers outside frontier-model companies [src:MSFT-CALL-FY2026Q4]."
      source: MSFT-CALL-FY2026Q4
    - id: P6
      claim: "Management allocates capital like owners: all three CEOs have been insiders: Gates hired Ballmer in 1980, and Nadella joined in 1992 [src:MSFT-WEB-2026-09-25-4] [src:MSFT-10K-FY2026#p12], and the six executive officers average 25.0 years of tenure, counted to calendar 2026 from the year each joined [src:MSFT-10K-FY2026#p12]. In FY2022–FY2026, $110.2 billion of dividends plus $112.9 billion of buybacks went back to shareholders [src:MSFT-10K-FY2026#p53] [src:MSFT-10K-FY2025#Item8] [src:MSFT-10K-FY2024#Item8]; no equity was sold to raise capital, but employee stock plans issued 171 million shares (cash proceeds $9.8 billion) against 263 million repurchased, and diluted weighted-average shares fell only about 2%, from 7,608 million in FY2021 to 7,453 million in FY2026 [src:MSFT-10K-FY2026#Note15] [src:MSFT-10K-FY2024#Note16] [src:MSFT-10K-FY2023#Item8] [src:MSFT-10K-FY2026#p50]. The weak spot is the yardstick: the FY2025 performance stock awards have four core metrics, all revenue growth (Azure and other cloud services 35%, Microsoft Cloud excluding Azure 35%, Consumer Services 15%, Xbox content and services 15%), three-year relative TSR against the S&P 500 only modifies the payout (75%–150%), and none is a return-on-capital measure [src:MSFT-DEF14A-2025-10-21#p39] [src:MSFT-DEF14A-2025-10-21#p40], while the data centers are the largest capital allocation in its history [src:MSFT-RPT1-2026-09-17#p3]."
      source: MSFT-DEF14A-2025-10-21#p39
  # Munger inversion list: how a permanent loss could happen (from section seven's strongest bear argument, section four's erosion paths and section twelve's “where this is most likely wrong”)
  permanent_loss_paths:
    - "Compute becomes a heavy asset that eats the annuity's cash: capacity from the four hyperscalers plus the neoclouds comes online at the same time, and today's queue becomes tomorrow's discount [src:MSFT-RPT1-2026-09-17#p6]; the report estimates that FY2028 depreciation and amortization is highly likely to be more than $22 billion above FY2026, and that covering it takes about $32 billion of new revenue [src:MSFT-RPT1-2026-09-17#p4]; if cash capex is still above 30% of revenue after FY2028, the bear case is right, and the cash the annuity piled up has been permanently swapped for machines with mediocre returns [src:MSFT-RPT1-2026-09-17#p8]."
    - "The reflexive chain around a single customer breaks: OpenAI has contracted to buy an incremental $250 billion of Azure services [src:MSFT-8K-2025-10-29#EX-99.2]; if consumed over five years (an assumption, since no term is disclosed), that is about $50 billion a year, about half of Azure's FY2026 revenue of $101.9 billion on the FY2027 definition [src:MSFT-8K-2026-09-02#EX-99.1-slide17]. On Microsoft's side, at 2026-06-30, lease obligations including imputed interest ($443.5 billion, of which $329.1 billion are leases not yet commenced, some subject to contractual conditions) and purchase commitments ($194.1 billion, including open purchase orders and take-or-pay contracts) total $637.6 billion, equal to 9.5 years of FY2026 free cash flow [src:MSFT-10K-FY2026#p44] [src:MSFT-10K-FY2026#p78] [src:MSFT-10K-FY2026#p53]; OpenAI's valuation, funding and purchases and Microsoft's RPO and capex vouch for one another, so when the chain breaks, it will not break in just one place [src:MSFT-RPT1-2026-09-17#p9]."
    - "The annuity is taken apart by its own agents: the entry point to daily work moves out to the interfaces of model companies or phone makers, Office shrinks to a file format and a back end, and pricing power flows to the owners of the interface [src:MSFT-RPT1-2026-09-17#p6]. At list price, the Copilot add-on layer is about $10.8 billion a year: over 30 million paid seats [src:MSFT-8K-2026-07-29#EX-99.1] × the $30 Enterprise list price per user per month [src:MSFT-WEB-2026-09-25-1] × 12 (this archive's estimate, see F30), while Microsoft discloses no Copilot revenue and the report notes the realized price is lower than list [src:MSFT-RPT1-2026-09-17#p6]. If the 35.8% active-use rate of a U.S. vendor panel held for all paid seats (L2 only, no primary data seen) [src:MSFT-WEB-2026-02-03-1], about $6.9 billion of it would be seats bought but little used, held up by the stickiness of the base [src:MSFT-RPT1-2026-09-17#p6]; once seats start to fall and agent or usage revenue fails to take over, it is the base itself that bleeds."
    - "Cash conversion never gets back to a rent collector's level (where section twelve of the report thinks this judgment is most likely wrong): in FY2021–FY2023 cash capex never exceeded 14% of revenue (at most 13.3%, in FY2023) [src:MSFT-10K-FY2023#Item8], and free cash flow ran at 81.1%–93.8% of non-GAAP net income on each year's own definition (82.2%–91.6% of GAAP net income) [src:MSFT-10K-FY2022#Item7] [src:MSFT-10K-FY2023#Item7] [src:MSFT-10K-FY2023#Item8]; in FY2024 cash capex was already 18.1% of revenue and conversion was still 83.0% on the current definition (84.0% as originally reported) [src:MSFT-10K-FY2026#p42] [src:MSFT-10K-FY2026#p53] [src:MSFT-10K-FY2024#Item7]; conversion fell in the two years when cash capex exceeded 20% of revenue, to 67.9% in FY2025 (70.3% as originally reported) and 52.0% in FY2026 [src:MSFT-10K-FY2026#p42] [src:MSFT-10K-FY2026#p53] [src:MSFT-10K-FY2025#Item7]. The report says that if the property buyer cannot get back to the rent collector's conversion rate, the stickiness of the annuity, management's record and the concentration arithmetic cannot save it even if they are all right [src:MSFT-RPT1-2026-09-17#p13]; what this rewrites first is the valuation (only in the private repository); the thesis's own invalidation line is below 45% in FY2028, read on the non-GAAP definition in force for that year (MSFT-Q6) [src:MSFT-RPT1-2026-09-17#p11]."
    - "Capital allocation mistakes magnified by scale: the aQuantive and Nokia acquisitions are confirmed failures, with about $13.7 billion written off between them [src:MSFT-10K-FY2012#Item8] [src:MSFT-10K-FY2015#Item7]. That is $6.2 billion of Online Services Division goodwill in FY2012, mostly from aQuantive [src:MSFT-8K-2012-07-02#EX-99.1] [src:MSFT-10K-FY2012#Item8], and $7.5 billion of Phone Hardware goodwill and asset impairments in FY2015, against about $7.6 billion announced in the 8-K of July 2015 [src:MSFT-10K-FY2015#Item7] [src:MSFT-8K-2015-07-08#EX-99.1]. The $75.4 billion Activision deal is still under observation [src:MSFT-10K-FY2026#p69], and the data centers are the fourth such bet and the largest [src:MSFT-RPT1-2026-09-17#p3]; and the yardstick to measure it is not yet installed: the long-term performance stock awards reward Azure revenue growth, not the capex spent to get it [src:MSFT-DEF14A-2025-10-21#p39]."

