  - id: MSFT-Q9
    type: quantitative
    claim: The seat base has not shrunk in the agent era, or the shrinkage is caught by growing agent and usage revenue
    origin: report:breaker
    severity: breaker
    covers: [moat, pricing_power, competition]
    pillar: P1
    metric_def:
      id: m365_commercial_seats_yoy
      description: Microsoft 365 commercial seat growth year on year (FY27 new basis, including paid GitHub seats), as defined by the company
      unit: "%"
      frequency: quarter
      data: filing_text
      where: Earnings press releases and call transcripts; Microsoft 365 commercial seat growth in the 10-Q/10-K MD&A
      formula: seats_t / seats_{t-4q} - 1
    fail_if: M365 commercial seats decline year on year on the new basis, and the company does not separately disclose growing agent or usage revenue
    rule:
      all_of:
        - {metric: m365_commercial_seats_yoy, op: "<", threshold: 0, unit: "%", consecutive: 1, period: quarter}
        - {op: event, threshold: "The company does not separately disclose growing agent or usage revenue", period: quarter}
      note: "Both must hold in the same quarter; when the first does not hold, the second need not be judged. The second is an event judgment: an independent model judges it against the quarter's earnings press release, call materials and 10-Q/10-K, with sources and a verbatim excerpt of no more than one sentence; “growing” means that the agent or usage revenue (amount or growth rate) the company discloses separately in the same period's materials is higher than a year earlier."
    data: filing_text
    effective_from: FY2027Q1
    first_readable: 2026-10
    baseline:
      value: 7
      unit: "%"
      period: FY2026 (restated on the new basis)
      as_of: 2026-06-30
      source: MSFT-8K-2026-09-02#EX-99.1-slide18
      note: "6% on the old basis [src:MSFT-10K-FY2026#p38]; the FY2027 definition adds paid GitHub seats [src:MSFT-8K-2026-09-02#EX-99.1-slide11]. Two months after launch, Agent 365 had nearly 40 million agents registered across tens of thousands of companies (company-reported), with no figure for how many are active [src:MSFT-CALL-FY2026Q4]."
    note: "Breaker five in section ten of the report, for the erosion path of the entry point moving elsewhere. The pillar is P1: the first leg looks at whether the seat base itself is shrinking; it also tests the half of P2 about “agent or usage revenue taking over before seats peak”. The source and excerpt requirement for the event leg is written only in the rule's note; the schema does not enforce it (see todo). Microsoft is adding usage-based billing alongside per-seat licensing: GitHub Copilot from June 2026, with Business and Enterprise seats still growing, and Cowork from July 2026; the CEO describes the model as moving “beyond per-seat to per-seat-plus-consumption” [src:MSFT-CALL-FY2026Q4]. The report reads the move to usage-based pricing as a sign that the seat ceiling is in sight [src:MSFT-RPT1-2026-09-17#p6]; since seats are being kept, the change alone does not show that. Whether the company starts disclosing agent or usage revenue separately is another signal on this path [src:MSFT-RPT1-2026-09-17#p6]."

  - id: MSFT-L2
    type: qualitative
    claim: "The key operators and the yardstick that measures them are both in place: there is an arrangement for the CEO handover, and while capex is high, incentives include a return on capital"
    origin: report:breaker
    severity: breaker
    covers: [management, governance, capital_allocation]
    pillar: P6
    question: "As of this period, has either of the following happened: (a) Nadella has left and the company has disclosed no succession arrangement; (b) in the 2027 proxy statement (DEF 14A), the executives' long-term incentive metrics still include no return-on-capital metric (such as return on invested capital, incremental return on capital or free cash flow return), while cash capex (excluding finance leases) for the latest full fiscal year (FY2027) is above $150 billion?"
    fail_if: "Yes ((a) or (b) holds; the two conditions in (b) must both hold)"
    judge: independent_model
    evidence: required
    where: 8-K Item 5.02, the Compensation Discussion and Analysis in the proxy statement (DEF 14A), the 10-K cash flow statement, company press releases
    lookback: 4
    judge_notes:
      - "An announced departure that has not yet taken place does not satisfy (a)."
      - "(b) is judged on the 2027 proxy statement; (a) can be read at any time; the October 2026 proxy statement is only a supplementary observation, not a trigger."
    effective_from: FY2027Q1
    first_readable: 2026-10
    baseline:
      value: "Nadella joined Microsoft in 1992 and became CEO in February 2014; the FY2025 performance stock awards have four core metrics, all revenue growth: Azure and Other Cloud Services 35%, Microsoft Cloud excluding Azure and Other Cloud Services 35%, Consumer Services 15%, Xbox Content and Services 15%; three-year total shareholder return relative to the S&P 500 only modifies the payout (75% to 150%); none of the four is a return-on-capital measure"
      source: MSFT-DEF14A-2025-10-21#p39
      note: "Nadella's dates [src:MSFT-10K-FY2026#p12]; the metrics, weights and modifier [src:MSFT-DEF14A-2025-10-21#p39] [src:MSFT-DEF14A-2025-10-21#p40]. Incentive Plan Revenue is a measure of the annual cash incentive, not of the performance stock awards [src:MSFT-DEF14A-2025-10-21#p37]."
    note: "Breaker six in section ten of the report. (a) Per the report's text, it counts only if Nadella has already left without a disclosed succession arrangement; an announced departure is recorded in that period's update [src:MSFT-RPT1-2026-09-17#p12]. The report's reasoning: in FY2026, an Azure increase of about $29.3 billion on the FY2027 definition [src:MSFT-8K-2026-09-02#EX-99.1-slide17] consumed $115.9 billion of cash capex [src:MSFT-10K-FY2026#p53], and the incentive plan rewards the former, not the latter [src:MSFT-RPT1-2026-09-17#p7] [src:MSFT-DEF14A-2025-10-21#p39]. The October 2026 proxy statement is the first point at which one can see whether this yardstick has been installed (a supplementary observation, not a trigger) [src:MSFT-RPT1-2026-09-17#p11]. The report does not say which period the $150 billion refers to, so here it is judged on cash capex for the latest full fiscal year when the proxy is published (FY2027), on the same basis as section ten, excluding finance leases [src:MSFT-RPT1-2026-09-17#p12] [src:MSFT-RPT1-2026-09-17#p4]; this reading awaits the owner's confirmation (see todo)."

  - id: MSFT-L3
    type: qualitative
    claim: The commitment of its largest customer, OpenAI, and Microsoft's stake in OpenAI have not turned into losses
    origin: report:breaker
    severity: breaker
    covers: [customer_concentration, balance_sheet, capital_allocation]
    pillar: P5
    question: "As of this period, has Microsoft's 10-Q/10-K/8-K, or OpenAI's public filings (including the S-1) or announcements, disclosed either of the following: (a) an impairment of Microsoft's equity investment in OpenAI; (b) OpenAI being unable to raise money for its compute purchase commitments, for example a payment default or deferral, a request, citing insufficient funds, to cut or restructure its commitments to Microsoft or other cloud providers, or Microsoft recording credit losses on OpenAI-related receivables?"
    fail_if: "Yes ((a) or (b) holds)"
    judge: independent_model
    evidence: required
    where: "Microsoft's 10-Q/10-K notes on equity-method investments and credit losses, and its 8-Ks; OpenAI's S-1 and financing announcements; filings and announcements of other parties to OpenAI's compute commitments: Amazon's 10-Q and 8-Ks, which name OpenAI, and for Oracle, whose filings do not name OpenAI, the parties' own announcements"
    lookback: 4
    effective_from: FY2027Q1
    first_readable: 2026-10
    baseline:
      value: "OpenAI has contracted to purchase an incremental $250 billion of Azure services (Microsoft, 2025-10-28); Amazon committed $50 billion to OpenAI ($15 billion of Series C preferred stock plus a $35 billion equity commitment, 2026-02-27) and had funded all of it by its 10-Q of 2026-07-31 ($13.7 billion of the commitment in Q2 2026 and the remaining $21.3 billion after 2026-06-30); OpenAI announced on 2026-06-08 that it had recently submitted a confidential draft S-1"
      source: MSFT-8K-2025-10-29#EX-99.2
      note: "Sources: the $250 billion [src:MSFT-8K-2025-10-29#EX-99.2]; Amazon's commitment terms [src:AMZN-8K-2026-02-27#Item1.01] and funding [src:AMZN-10Q-FY2026Q2]; the S-1 announcement [src:OPENAI-WEB-2026-06-08-1]. Microsoft held about 25% of OpenAI on an as-converted basis at 2026-06-30, down from about 27% after the October 2025 recapitalization [src:MSFT-10K-FY2026#p60] [src:MSFT-8K-2025-10-29#EX-99.2]; it accounts for the stake under the equity method (HLBV) and records its share of changes in OpenAI's net assets, chiefly dilution gains when OpenAI raises capital ($6.5 billion of net gains in FY2026, mainly from the recapitalization) [src:MSFT-10K-FY2026#p60] [src:MSFT-10K-FY2026#p41]. Third-party report of OpenAI documents, not in any filing: OpenAI's Q1 2026 revenue of $5.7 billion and cash burn of $3.7 billion, and Q2 2026 revenue of $6.7 billion, as relayed by the owner's report from press reports [src:MSFT-RPT1-2026-09-17#p8]; background only, not part of this baseline."
    note: "Breaker seven in section ten of the report. The reflexive chain: OpenAI's valuation supports its funding, its funding supports its purchases from Microsoft, those purchases support Microsoft's RPO and Azure growth, that growth supports Microsoft's capex, and outside money decides how long the chain can hold [src:MSFT-RPT1-2026-09-17#p9]. Other parties: Amazon's Q2 2026 10-Q names OpenAI and the AWS commitment ($38.0 billion, expanded by $100.0 billion over eight years) [src:AMZN-10Q-FY2026Q2]; Oracle's 10-Q for the quarter to 2026-08-31 does not name OpenAI [src:ORCL-10Q-FY2027Q1], and the OpenAI–Oracle agreement (up to 4.5 gigawatts, described as “a partnership that exceeds $300 billion” over five years) is in the joint announcement of OpenAI, Oracle and SoftBank [src:SBG-WEB-2025-09-24-1]. Complements MSFT-L5: that test looks at the commitment itself, this one at the equity stake and the counterparty's ability to raise money."

  - id: MSFT-L4
    type: qualitative
    claim: The EU's sovereignty framework has not shut US providers out of Level 3
    origin: report:breaker
    severity: breaker
    covers: [regulation, moat]
    pillar: P2
    question: "Has the EU Cloud and AI Development Act (CADA) taken effect (entered into force and begun to apply), and is its Level 3 third-country recognition route closed to US cloud providers in practice? Any of the following counts as closed in practice: (a) the final text or implementing rules make it legally impossible for providers subject to the US CLOUD Act to obtain recognition; (b) the EU formally decides not to grant the US third-country recognition, or formally rejects a US provider's application for recognition on the grounds that it is subject to the US CLOUD Act (a rejection for reasons specific to an individual provider does not count); (c) 12 months after the Act takes effect, no US-jurisdiction cloud provider has obtained Level 3 recognition through this route, and there is no pending application for recognition or recognition decision."
    fail_if: Yes (the Act has taken effect, and any of (a), (b) or (c) holds)
    warn_if: The Act has taken effect and (a), (b) and (c) are not yet met, but as of this period no US-jurisdiction cloud provider has obtained Level 3 recognition (no evidence yet on whether the route is open in practice)
    judge: independent_model
    evidence: required
    where: The final legal text and implementing rules in the Official Journal of the EU, the European Commission's recognition decisions and the status of applications, the risk factors and regulation sections of Microsoft's 10-K/10-Q
    lookback: 4
    effective_from: FY2027Q1
    first_readable: 2027-01
    baseline:
      value: "The European Commission proposed the Cloud and AI Development Act (COM(2026) 502) on 2026-06-03, setting up four Union assurance levels; the top level requires providers that are not subject to the control of a third country, which, read literally, would exclude providers subject to the US CLOUD Act; for Level 3 the Commission can recognise third countries whose providers may be audited against the Level 3 criteria, under six cumulative conditions in Article 18"
      source: EC-CADA-2026-06-03
      note: "Levels in Annex II, the recognition route in Article 18 [src:EC-CADA-2026-06-03]. The text does not name the US CLOUD Act; the exclusion is the report's reading, consistent with the text [src:MSFT-RPT1-2026-09-17#p6] [src:EC-CADA-2026-06-03]. Industry view as relayed by the owner's report (L2 only, no primary data seen): no major technology country can meet the Article 18 criteria today [src:MSFT-RPT1-2026-09-17#p6]."
    note: "Breaker eight in section ten of the report, for the sovereignty-fragmentation erosion path; the signal the report gives is whether Level 3's recognition route is open to US providers in practice, readable progressively over 2027–2029 [src:MSFT-RPT1-2026-09-17#p6]. The three cases of “closed in practice” are this archive's reading, written down in advance: (a) and (b) are closure in law, (c) is closure in fact, since the industry view relayed by the report (L2 only) is that no major technology country can meet the Article 18 criteria today, in which case the route exists only on paper [src:MSFT-RPT1-2026-09-17#p6]. Neither the time limit in (c) nor the warn_if level comes from the report; both await the owner's confirmation (see todo). first_readable is the start of the report's 2027–2029 readable window. Scale: Level 4 (defense), by a Financial Times measure the report relays without identifying the article, is about 1% of the public procurement market, and the real battleground is Level 3 [src:MSFT-RPT1-2026-09-17#p6]; that measure is L2 only, with no primary data seen, and the Commission's text gives neither a defence scope for Level 4 nor a procurement share [src:EC-CADA-2026-06-03]."

  - id: MSFT-L5
    type: qualitative
    claim: The incremental purchase commitment of its largest customer, OpenAI, has not been restructured or impaired
    origin: report:breaker
    severity: breaker
    covers: [customer_concentration, growth]
    pillar: P5
    question: "As of this period, has Microsoft's 8-K, 10-Q/10-K or earnings call materials, or OpenAI's public filings (including the S-1), disclosed that the contract under which OpenAI committed to buy an incremental $250 billion of Azure services has been restructured (the committed amount or payment obligations cut, or terms rewritten beyond a mere extension) or impaired? A mere extension of the term, with the amount and customer concentration unchanged, is not a restructuring and is recorded under warn_if."
    fail_if: Yes (the commitment was restructured or impaired)
    warn_if: The commitment was only extended, with the amount and concentration unchanged (the report records this as a worsening of duration, watched separately)
    judge: independent_model
    evidence: required
    where: Microsoft's 8-Ks, the remaining performance obligation and material contract disclosures in the 10-Q/10-K revenue note, earnings call transcripts; OpenAI's S-1 and announcements
    lookback: 4
    effective_from: FY2027Q1
    first_readable: 2026-10
    baseline:
      value: "OpenAI has contracted to purchase an incremental $250 billion of Azure services (Microsoft, 2025-10-28); consumed over five years, that would be about $50 billion a year, about half of Azure's FY2026 revenue ($101.9 billion on the FY2027 definition)"
      source: MSFT-8K-2025-10-29#EX-99.2
      note: "The commitment [src:MSFT-8K-2025-10-29#EX-99.2]; Azure's restated FY2026 revenue [src:MSFT-8K-2026-09-02#EX-99.1-slide17]; the five-year consumption period is the report's assumption, and no term is disclosed [src:MSFT-RPT1-2026-09-17#p8]. The amended partnership agreement of 2026-04-27 (Microsoft's IP license now non-exclusive, OpenAI free to serve its products through any cloud provider, the revenue share paid to Microsoft capped and running through 2030) does not mention the $250 billion commitment [src:MSFT-WEB-2026-04-27-1]."
    note: "The second condition of breaker four in section ten of the report, split out from MSFT-Q8 and joined to it by “or”; the report records an extension with unchanged concentration as a worsening of duration, watched separately, which is written here as warn_if [src:MSFT-RPT1-2026-09-17#p11]. The answer often shows up first not in the financial statements but in an 8-K: OpenAI's IPO pricing and any restructuring or impairment of the commitment can appear as an 8-K at any time [src:MSFT-RPT1-2026-09-17#p8], so the test is judged each time a relevant 8-K appears. Complements MSFT-L3: this test looks at the commitment itself, that one at Microsoft's equity stake and OpenAI's ability to raise money."

  # ---------- Section ten of the report: watch indicators read every quarter (#1, #2, #5; #3 and #4 are merged into MSFT-Q7 and MSFT-Q4/Q6) ----------
  - id: MSFT-Q10
    type: quantitative
    claim: Azure growth stays in the healthy range
    origin: report:watch
    severity: watch
    covers: [growth, competition]
    pillar: P3
    metric: segment_revenue_yoy
    params: {segment: Azure, basis: "FY27 new basis (restated in the 8-K of 2026-09-02)", currency: constant currency}
    fail_if: Below 25% for two consecutive quarters
    rule: {op: "<", threshold: 25, unit: "%", consecutive: 2, period: quarter}
    warn_if: Below 30% in a single quarter (leaving the healthy range)
    warn_rule: {op: "<", threshold: 30, unit: "%", consecutive: 1, period: quarter}
    data: filing_text
    effective_from: FY2027Q1
    first_readable: 2026-10
    baseline:
      value: 42
      unit: "%"
      period: FY2026Q4 (June quarter, new basis, constant currency)
      as_of: 2026-06-30
      source: MSFT-8K-2026-09-02#EX-99.1-slide18
      note: "June-quarter revenue of $29,417 million on the FY2027 definition [src:MSFT-8K-2026-09-02#EX-99.1-slide17]; full-year FY2026 growth of 41% on the old basis (40% in constant currency) [src:MSFT-10K-FY2026#p39] [src:MSFT-8K-2026-09-02#EX-99.1-slide18]."
    note: "Watch indicator #1 in section ten of the report: the healthy range is not below 30%, and two consecutive quarters below 25% trigger attention [src:MSFT-RPT1-2026-09-17#p11]. The FY2027 Azure definition, restated in the 8-K of 2026-09-02, moves GitHub and other developer cloud services and Security Copilot to Microsoft 365 commercial cloud and Healthcare and Life Sciences cloud to Industry solutions cloud [src:MSFT-8K-2026-09-02#EX-99.1-slide11]. Before FY27 Q1, the growth rates the cloud providers report do not share the same numerator (both definitions and periods differ), so they cannot be used to infer market share [src:MSFT-RPT1-2026-09-17#p6]."

  - id: MSFT-Q11
    type: quantitative
    claim: Demand excluding OpenAI is still growing fairly fast
    origin: report:watch
    severity: watch
    covers: [customer_concentration, growth]
    pillar: P5
    metric_def:
      id: commercial_rpo_ex_openai_yoy
      description: Year-on-year growth of commercial remaining performance obligation (commercial RPO, the balance of commercial contracts still to be performed) excluding OpenAI, as defined by the company
      unit: "%"
      frequency: quarter
      data: filing_text
      where: Commercial RPO disclosures in earnings press releases and call transcripts; remaining performance obligations in the 10-Q/10-K revenue note
      formula: rpo_ex_openai_t / rpo_ex_openai_{t-4q} - 1
    fail_if: Below 10%
    rule: {op: "<", threshold: 10, unit: "%", consecutive: 1, period: quarter}
    warn_if: Below 15% (leaving the healthy range)
    warn_rule: {op: "<", threshold: 15, unit: "%", consecutive: 1, period: quarter}
    data: filing_text
    effective_from: FY2027Q1
    first_readable: 2026-10
    baseline:
      value: 25
      unit: "%"
      period: FY2026Q4
      as_of: 2026-06-30
      source: MSFT-CALL-FY2026Q4
      note: "Given as a single total on the FY26 Q4 call; 26% at FY2026Q3 [src:MSFT-CALL-FY2026Q4] [src:MSFT-CALL-FY2026Q3]."
    note: "Watch indicator #2 in section ten of the report: the healthy range is not below 15%, and below 10% triggers attention [src:MSFT-RPT1-2026-09-17#p11]. The report warns that the balance excluding OpenAI cannot separate neoclouds from real enterprises, so even if this reading is healthy, the concentration itself remains [src:MSFT-RPT1-2026-09-17#p8]."

  - id: MSFT-Q12
    type: quantitative
    claim: "The Copilot add-on layer is renewing: the gap between M365 commercial cloud growth and seat growth has not narrowed"
    origin: report:watch
    severity: watch
    covers: [pricing_power, moat, unit_economics]
    pillar: P2
    metric_def:
      id: m365_cloud_minus_seat_growth
      description: M365 commercial cloud revenue growth year on year minus M365 commercial seat growth year on year (new basis), that is, the growth in revenue per seat
      unit: pp
      frequency: quarter
      data: filing_text
      where: Earnings press releases and call transcripts; 10-Q/10-K MD&A
      formula: m365_commercial_cloud_revenue_yoy - m365_commercial_seats_yoy
      components:
        m365_commercial_cloud_revenue_yoy:
          description: Microsoft 365 commercial cloud revenue growth year on year (constant currency), as defined by the company
          unit: "%"
          where: Earnings press releases and call transcripts; 10-Q/10-K MD&A
        m365_commercial_seats_yoy:
          description: Microsoft 365 commercial seat growth year on year (FY27 new basis, including paid GitHub seats), as defined by the company
          unit: "%"
          where: Earnings press releases and call transcripts; Microsoft 365 commercial seat growth in the 10-Q/10-K MD&A
    fail_if: The gap narrows to 5 percentage points or less
    rule: {op: "<=", threshold: 5, unit: pp, consecutive: 1, period: quarter}
    warn_if: M365 commercial cloud growth below 12%, or seat growth below 4% (leaving the healthy range)
    warn_rule:
      any_of:
        - {metric: m365_cloud_minus_seat_growth.m365_commercial_cloud_revenue_yoy, op: "<", threshold: 12, unit: "%", consecutive: 1, period: quarter}
        - {metric: m365_cloud_minus_seat_growth.m365_commercial_seats_yoy, op: "<", threshold: 4, unit: "%", consecutive: 1, period: quarter}
    data: filing_text
    effective_from: FY2027Q1
    first_readable: 2026-10
    baseline:
      value: 8
      unit: pp
      period: "FY2026 (Microsoft 365 commercial cloud growth 15% in constant currency − seat growth 7%, both restated on the FY2027 definition)"
      as_of: 2026-06-30
      source: MSFT-8K-2026-09-02#EX-99.1-slide18
      note: "On the metric's own definition: constant currency, both components on the FY2027 basis [src:MSFT-8K-2026-09-02#EX-99.1-slide18]. In reported currency the gap is 11 percentage points on either basis: 18% − 7% restated, and 17% − 6% as first reported, where 17% is the growth of Microsoft 365 Commercial cloud [src:MSFT-8K-2026-09-02#EX-99.1-slide18] [src:MSFT-10K-FY2026#p38]; in constant currency on the old basis it is 8 (14% − 6%) [src:MSFT-8K-2026-09-02#EX-99.1-slide18]. The gaps are taken from the company's whole-percent growth rates. The company's FY27 Q1 guidance for Microsoft 365 commercial cloud, about 17% in constant currency, is on the same basis as the metric [src:MSFT-8K-2026-09-02#EX-99.1-slide21]; the “seat growth of about 7% on the new basis” the report writes next to it is FY2026's restated reading [src:MSFT-8K-2026-09-02#EX-99.1-slide18], and the FY27 Q1 outlook has no seat item [src:MSFT-8K-2026-09-02#EX-99.1-slide21]. The first reading comes with the FY27 Q1 results in late October 2026."
    note: "Watch indicator #5 in section ten of the report. The report sized the add-on layer this way: over 30 million paid Microsoft 365 Copilot seats at FY2026Q4 [src:MSFT-8K-2026-07-29#EX-99.1] × $30 per seat per month, the Enterprise list price (Microsoft 365 Copilot Business lists at $21) [src:MSFT-WEB-2026-09-25-1] × 12 ≈ $10.8 billion a year at list price (a floor on seats and a ceiling on price, as F30 notes), 10.6% of the $102.0 billion FY2026 revenue of Microsoft 365 Commercial products and cloud services, a line that also contains on-premises products because Microsoft discloses no Microsoft 365 Commercial cloud revenue in dollars [src:MSFT-10K-FY2026#Note18]. The report put the gap between commercial cloud growth and seat growth at about 10 percentage points and read the add-on layer as almost explaining it [src:MSFT-RPT1-2026-09-17#p6]; on the company's figures the FY2026 gap is 8 points on the metric's definition (11 in reported currency), so the baseline sits three points above the fail line of 5, not five. The inputs come with caveats: seats are global, $30 is a list price rather than the realized price, and the active-use rate comes from a U.S. vendor panel [src:MSFT-RPT1-2026-09-17#p6]. In the report's scenario, if the roughly $6.9 billion of it that is seats bought but little used churns within a year, the gap narrows from its 10 points to about 4 [src:MSFT-RPT1-2026-09-17#p6]; that $6.9 billion applies the 35.8% active-use rate of Recon Analytics' U.S. panel to global seats (L2 only, no primary data seen) [src:MSFT-WEB-2026-02-03-1]. The report reads a gap that holds as the add-on layer renewing, and a gap narrowing to within 5 percentage points as that $6.9 billion churning [src:MSFT-RPT1-2026-09-17#p6]. The healthy range “≥12% / ≥4%” is read as applying to commercial cloud growth and seat growth respectively [src:MSFT-RPT1-2026-09-17#p11]."

  # ---------- Added by this archive (origin: manual): two readings that have a dividing line in section seven of the report but are not listed in section ten ----------
  - id: MSFT-Q13
    type: quantitative
    claim: The capex cycle comes down rather than staying at the high level of a compute business
    origin: manual
    severity: watch
    covers: [capital_allocation, free_cash_flow]
    pillar: P4
