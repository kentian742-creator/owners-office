      note: "66% for full-year FY2026 [src:MSFT-10K-FY2026#p37]. Both readings are on the FY2026 Microsoft Cloud definition, which also counted the commercial portion of LinkedIn and Dynamics 365 [src:MSFT-10K-FY2026#p36]; the FY2027 definition covers Azure, Microsoft 365 commercial cloud and Industry solutions cloud, the company does not list it among the metrics with material changes and has not restated the gross margin, so the first FY2027 readings are on the new definition without a restated comparative [src:MSFT-8K-2026-09-02#EX-99.1-slide13]."
    note: "Breaker three in section ten of the report. Watch indicator #3's healthy range is not below 62%, and its trigger line is this breaker line [src:MSFT-RPT1-2026-09-17#p11], so it is merged into this test: below 62% is recorded as a warning. Section four of the report reads it this way: a break below 64% is the first reading in the bad direction, 62% is the second, and only two consecutive quarters below 58% is a thesis breaker [src:MSFT-RPT1-2026-09-17#p6]; that 64% directional line is only recorded in updates, with no threshold of its own [src:MSFT-RPT1-2026-09-17#p6]. This is the signal for the compute-commoditization erosion path; the other line is Azure dollar revenue, disclosed quarterly for the first time from FY27 [src:MSFT-8K-2026-09-02#EX-99.1-slide17] [src:MSFT-RPT1-2026-09-17#p6]."

