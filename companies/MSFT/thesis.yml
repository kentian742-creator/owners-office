tests:
  # ---------- 林奇 stalwart 模板（五条都在；MSFT-Q4 换了指标并改写门槛，MSFT-L1 改写问法，理由见各自的 note） ----------
  - id: MSFT-Q1
    type: quantitative
    claim: 增长没有滑出稳定增长型的区间
    origin: template:stalwart
    severity: watch
    covers: [growth]
    pillar: P1
    metric: revenue_yoy
    fail_if: 连续 4 个季度低于 5%
    rule: {op: "<", threshold: 5, unit: "%", consecutive: 4, period: quarter}
    warn_if: 连续 2 个季度低于 8%
    warn_rule: {op: "<", threshold: 8, unit: "%", consecutive: 2, period: quarter}
    data: xbrl
    effective_from: FY2027Q1
    first_readable: 2026-10
    baseline:
      value: 18
      unit: "%"
      period: FY2026
      as_of: 2026-06-30
      source: MSFT-RPT1-2026-09-17#p7
      note: "收入从 FY2025 的 2,817 亿美元增至 FY2026 的 3,318 亿美元 [src:MSFT-RPT1-2026-09-17#p5]。"
    note: "门槛沿用模板默认值。它们离 FY2026 的增速很远，所以这条只是底线：增速放慢的早期信号在分部测试里——Azure 增速（MSFT-Q10 的警告线与 MSFT-Q5）、M365 商业云与席位增速（MSFT-Q12 的警告线）、席位是否下降（MSFT-Q9）。个人计算这一块（Windows OEM、Xbox、搜索广告）报告当作背景而不是论点，公司对 FY2027 的指引是 Windows OEM 与设备下滑 high teens [src:MSFT-RPT1-2026-09-17#p3]；全公司增速放慢时，先对照上面几条，看放慢的是哪一门。"

  - id: MSFT-Q2
    type: quantitative
    claim: 投入资本回报守在优秀企业的水平
    origin: template:stalwart
    severity: watch
    covers: [returns_on_capital, moat]
    pillar: P3
    metric: roic
    fail_if: 连续 2 年低于 12%
    rule: {op: "<", threshold: 12, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2027Q1
    first_readable: 2027-07
    note: "claim 与门槛都沿用模板默认值。报告没有给全公司投入资本回报的读数，基线待从 FY2026 年报的 XBRL 回填。这条看不见数据中心对回报的拖累：登记表 roic 的投入资本是权益加有息负债减现金，不含租赁负债，而数据中心大量靠租赁取得——FY2026 年末含推定利息的租赁义务 4,435 亿美元 [src:MSFT-RPT1-2026-09-17#p8]，长期债务本金只有 461 亿美元 [src:MSFT-RPT1-2026-09-17#p9]，FY2027 起数据中心租赁多以经营租赁入账 [src:MSFT-RPT1-2026-09-17#p4]。年金的高回报也会在很多年里盖住新投入的回报，所以这条是底线而不是早期信号，早期信号看 MSFT-Q5 与 MSFT-Q7。报告给的是增量口径：正文按全公司税后营业利润增量对三年资本开支的比值，税后增量回报在 13% 到 39% 之间，公开数据无法收窄 [src:MSFT-RPT1-2026-09-17#p4]，附录说区间是按全公司与智能云两种口径算的 [src:MSFT-RPT1-2026-09-17#p13]；资本配置评级升到 B+ 的条件之一，是三年增量税后回报读数到 20% 以上 [src:MSFT-RPT1-2026-09-17#p3]。"

  - id: MSFT-Q3
    type: quantitative
    claim: 回购在真正缩减股本，而不是抵消股权激励
    origin: template:stalwart
    severity: watch
    covers: [capital_allocation]
    pillar: P6
    metric: diluted_shares_yoy
    fail_if: 连续 2 年大于 0
    rule: {op: ">", threshold: 0, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2027Q1
    first_readable: 2027-07
    baseline:
      value: null
      unit: "%"
      period: FY2026（同比）
      as_of: 2026-06-30
      source: MSFT-10K-FY2026
      note: "同比读数待从 FY2026 年报的 XBRL 回填。报告只给了五年累计：FY2022–FY2026 稀释后股数下降约 2%（见 F22）[src:MSFT-RPT1-2026-09-17#p8]；同期回购 1,129 亿美元，而五年股权激励费用约 522 亿美元、另有 248 亿美元税务代扣回购，回购现金流里约一半的效果被新增股份吃掉 [src:MSFT-RPT1-2026-09-17#p8]。"
    note: "门槛沿用模板默认值。报告第六节的标准二问的是股东回报有没有被新发债务或股权抵消（答案是没有），没有问回购里有多少是真正的减股（答案是一半）；这条测试盯的是后一个问题。"

  - id: MSFT-Q4
    type: quantitative
    claim: 利润能重新变成现金：自由现金流对非 GAAP 净利润的转换率从十年低点回升
    origin: template:stalwart
    severity: watch
    covers: [free_cash_flow]
    pillar: P4
    metric: fcf_to_non_gaap_net_income
    fail_if: 从 FY2027 起，连续 2 个财年不高于 FY2026 的 52%
    rule: {op: "<=", threshold: 52, unit: "%", consecutive: 2, period: year, evaluate_from: FY2027, note: "从 FY2027 年报起算，FY2026 本身不计入连续期数。"}
    warn_if: 从 FY2027 起，任一财年不高于 52%（没有回升）
    warn_rule: {op: "<=", threshold: 52, unit: "%", consecutive: 1, period: year, evaluate_from: FY2027, note: "从 FY2027 年报起算，FY2026 本身不计。"}
    data: filing_text
    effective_from: FY2027Q1
    first_readable: 2027-07
    baseline:
      value: 52.0
      unit: "%"
      period: FY2026
      as_of: 2026-06-30
      source: MSFT-RPT1-2026-09-17#p5
      note: "FY2021 91.5%、FY2022 89.6%、FY2023 82.2%、FY2024 84.0%、FY2025 67.9% [src:MSFT-RPT1-2026-09-17#p5]。"
    note: "改写模板：不只改了门槛，也换了指标，超出模板 README 只许改门槛的范围，待集成步骤写进决策记录（见 todo）。模板默认用登记表的 fcf_conversion（GAAP 净利润口径、XBRL 可算）、连续 2 年低于常态线即失败；按报告口径，FY2025 的 67.9% 与 FY2026 的 52.0% 已经连续两年低于那条常态线 [src:MSFT-RPT1-2026-09-17#p5]，原样判定建档即失败，不带来新信息。这里改两处，都取自报告：一，指标改为报告全篇使用的自由现金流 ÷ 非 GAAP 净利润（资本开支不含融资租赁），与 MSFT-Q6 读同一个数 [src:MSFT-RPT1-2026-09-17#p4]，代价是分母由公司自己定义、要从新闻稿的调节表里抽取，这份档案里不再有 XBRL 可直接计算的现金转换测试；二，门槛改为第十节前瞻指标 #4 的健康线“FY2027 后回升”，以 FY2026 的 52% 为基准 [src:MSFT-RPT1-2026-09-17#p11]。模板的常态线在报告里有对应物：产能满负荷后转换率回到 70% 以上是解释 A，50–65% 的新常态是解释 B，两者在 FY2028 之前分不开 [src:MSFT-RPT1-2026-09-17#p5]，FY2028 年报出来后复核这条测试。前瞻指标 #4 的触发线就是破坏信号二，见 MSFT-Q6。"

  - id: MSFT-L1
    type: qualitative
    claim: 管理层没有撤回、也没有朝不利方向改写已经给出且尚未到期的展望
    origin: template:stalwart
    severity: watch
    covers: [management]
    pillar: P6
    question: "本期业绩新闻稿、电话会材料或 10-Q/10-K 中，管理层是否撤回了此前给出、尚未到期的展望或指引，或者把同一期间的展望朝不利方向修改——收入、营业利润或分部（Azure、M365 商业云、Windows OEM 与设备、Xbox）的增长预期调低（原本预期下滑的，下滑幅度加大），或营业利润率预期调低？只因会计口径、分部口径或租赁入账方式变化而改写的数字不算；资本开支计划的变化不在本题，由 MSFT-Q5、MSFT-Q13 跟踪。"
    fail_if: 撤回了尚未到期的展望或指引，且没有同时给出可检验的替代数字
    warn_if: 同一期间的展望被朝不利方向修改（同时给出了新数字）
    judge: independent_model
    evidence: required
    where: 业绩 8-K 的新闻稿、业绩电话会纪要与投资者材料、10-Q/10-K 的 MD&A
    lookback: 4
    effective_from: FY2027Q1
    first_readable: 2026-10
    baseline:
      value: FY27 第一季度指引：Microsoft 365 商业云收入按固定汇率增长约 17%（FY27 新口径，由 2026-07-29 给出的约 15% 按新分部口径机械调整而来）
      source: MSFT-8K-2026-09-02#EX-99.1-slide21
      note: "另一项已给出的指引：FY2027 Windows OEM 与设备下滑 high teens、Xbox 在重置后预计恢复增长，在 2026-07-29 的 FY26 第四季度业绩电话会上给出 [src:MSFT-CALL-FY2026Q4]；本档案没有电话会纪要全文，措辞取自转述它的报告页 [src:MSFT-RPT1-2026-09-17#p3]。报告在该季指引旁写的“新口径席位增速约 7%”，是 FY2026 按新口径重述后的席位增速 [src:MSFT-RPT1-2026-09-17#p11]，这里不当作指引，除非电话会纪要或 8-K 显示公司确实给了席位增速的指引（见 todo）。日历 2026 年的资本开支口径从约 1,900 亿美元改为约 1,750 亿美元，原因是数据中心租赁自 FY2027 起多以经营租赁而非融资租赁入账，这是入账方式变化，不算改写 [src:MSFT-RPT1-2026-09-17#p4]。"
    note: "改写模板：模板问的是已公布的中期财务目标；报告没有提到微软公布中期目标，只记录了已给出的指引（见 baseline），所以这里把“目标”读作管理层已给出、尚未到期的展望与指引。“微软只在每季电话会给下一季指引、在第四季度电话会给全年展望”是本档案的工作假设，报告没有写，待以 FY26 Q4 电话会纪要与 8-K 核对（见 todo）。fail_if 沿用模板的语义（撤回且没有可检验的替代数字）；朝不利方向的修改记为警告，这一级是本档案加的。资本开支不放进本题：调高资本开支不是没兑现的承诺而是资本配置，调低正是支柱 P4 希望的方向，两者都由 MSFT-Q5、MSFT-Q13 按占收入的比例跟踪。"

  # ---------- 报告第十节：论点破坏信号（任一条成立，投资论点作废，而不只是评级下调） ----------
  - id: MSFT-Q5
    type: quantitative
    claim: 算力投入换来的是增长：资本开支还在高位时，Azure 增速没有掉下来
    origin: report:breaker
    severity: breaker
    covers: [growth, returns_on_capital, capital_allocation]
    pillar: P3
    metric_def:
      id: azure_growth_vs_capex_intensity
      description: Azure 收入同比增速与同季现金资本开支占收入（两项同季判定）
      unit: "%"
      frequency: quarter
      data: mixed
      components:
        azure_revenue_yoy: {description: "Azure 收入同比增速（FY27 新口径，2026-09-02 的 8-K 重述；固定汇率），公司口径", unit: "%", where: 分部附注或业绩新闻稿}
        capex_to_revenue: {description: "现金资本开支 ÷ 收入（不含融资租赁），口径同登记表 capex_to_revenue", unit: "%", xbrl: ["us-gaap:PaymentsToAcquirePropertyPlantAndEquipment"]}
    fail_if: Azure 固定汇率增速连续两个季度低于 20%，而同期现金资本开支占收入仍高于 25%（资本开支不含融资租赁）
    rule:
      all_of:
        - {metric: azure_growth_vs_capex_intensity.azure_revenue_yoy, op: "<", threshold: 20, unit: "%"}
        - {metric: azure_growth_vs_capex_intensity.capex_to_revenue, op: ">", threshold: 25, unit: "%"}
      consecutive: 2
      period: quarter
      note: 两项须在同一季度同时成立，并且连续两个季度；Azure 按新口径、固定汇率，资本开支取现金流量表的现金资本开支。
    data: mixed
    effective_from: FY2027Q1
    first_readable: 2026-10
    baseline:
      value: 42
      unit: "%"
      period: FY2026Q4（6 月季，新口径、固定汇率）
      as_of: 2026-06-30
      source: MSFT-RPT1-2026-09-17#p11
      note: "6 月季 Azure 收入 294.2 亿美元 [src:MSFT-RPT1-2026-09-17#p11]；FY2026 全年现金资本开支占收入 34.9% [src:MSFT-RPT1-2026-09-17#p5]。"
    note: "报告第十节破坏信号一。第二个条件按登记表 capex_to_revenue 的口径（xbrl），与报告“现金资本开支均不含融资租赁、第十节阈值按这个口径写”一致 [src:MSFT-RPT1-2026-09-17#p4]。更早一级的警报是前瞻指标 #1 的连续两季低于 25%，见 MSFT-Q10 [src:MSFT-RPT1-2026-09-17#p11]。"

  - id: MSFT-Q6
    type: quantitative
    claim: "资本开支周期没有把利润的现金含量压穿论点作废线：FY2028 年报的自由现金流对非 GAAP 净利润的转换率不低于 45% [src:MSFT-RPT1-2026-09-17#p11]"
    origin: report:breaker
    severity: breaker
    covers: [free_cash_flow, returns_on_capital]
    pillar: P4
    metric: fcf_to_non_gaap_net_income
    fail_if: FY2028 年报的自由现金流对非 GAAP 净利润的转换率低于 45%
    rule: {op: "<", threshold: 45, unit: "%", consecutive: 1, period: year, evaluate_on: [FY2028], note: "只按 FY2028 年报判定；FY2027 与 FY2029 及以后的年报不适用。"}
    data: filing_text
    effective_from: FY2027Q1
    first_readable: 2028-07
    baseline:
      value: 52.0
      unit: "%"
      period: FY2026
      as_of: 2026-06-30
      source: MSFT-RPT1-2026-09-17#p5
    note: "报告第十节破坏信号二，也是前瞻指标 #4 的触发线。这条线比“转换率不再下降”宽：FY2028 只要不低于 45%，即便比 FY2026 的 52.0% 更低也不触发 [src:MSFT-RPT1-2026-09-17#p11] [src:MSFT-RPT1-2026-09-17#p5]；继续下降而没有跌破的情形，由 MSFT-Q4 的警告线与失败线记录。报告把这条线与折旧曲线分开：折旧是非现金费用，压的是利润而不是转换率；真正压转换率的是资本开支这笔现金支出，转换率能不能回升由资本开支什么时候回落决定 [src:MSFT-RPT1-2026-09-17#p4]。两条线都在 2028 年 7 月的年报里第一次能读到答案，但不能互相佐证 [src:MSFT-RPT1-2026-09-17#p4]。FY2028 之后的年份，在届时的更新里重新写门槛。"

