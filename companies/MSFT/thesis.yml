    fail_if: 是（承诺被重组或减值）
    warn_if: 承诺仅被展期，金额与集中度不变（报告记为久期恶化，单独观察）
    judge: independent_model
    evidence: required
    where: 微软 8-K、10-Q/10-K 收入附注中的剩余履约义务与重大合同披露、业绩电话会纪要；OpenAI 的 S-1 与公告
