  - id: F29
    label: After-tax incremental return on cash capex, whole company, FY2023 to FY2026
    value: [23.7, 38.9]
    unit: "%"
    period: FY2023–FY2026 (same window / one-year lag)
    source: MSFT-10K-FY2026#p50
    note: "This archive's calculation. Method: the increase in after-tax operating income over the window ÷ the cash capex of the window. After-tax operating income = operating income × (1 − the year's effective tax rate): FY2023 $88,523 million × (1 − $16,950 million ÷ $89,311 million) = $71,723 million [src:MSFT-10K-FY2025#Item8]; FY2026 $155,237 million × (1 − $32,185 million ÷ $165,934 million) = $125,127 million [src:MSFT-10K-FY2026#p50], an increase of $53,404 million. Same window: ÷ FY2024–FY2026 cash capex of $224,976 million ($44,477 million + $64,551 million + $115,948 million) = 23.7% [src:MSFT-10K-FY2026#p53]. One-year lag: ÷ FY2023–FY2025 cash capex of $137,135 million ($28,107 million + $44,477 million + $64,551 million) = 38.9% [src:MSFT-10K-FY2025#Item8] [src:MSFT-10K-FY2026#p53]. Cash capex excludes finance leases, as elsewhere in this archive. The report's 13%–39% is its own calculation on two bases, the whole company and Intelligent Cloud [src:MSFT-RPT1-2026-09-17#p13]; the capital-allocation rating's upgrade condition (a reading above 20%) [src:MSFT-RPT1-2026-09-17#p3] is read against this method."
