thesis:
  summary: "微软是两门贴在一起的生意：一门按席位把 Microsoft 365、Windows 商业授权、Dynamics 与 LinkedIn 租给企业，生产力与业务流程分部 FY2026 收入 1,400 亿美元、营业利润率 59.9% [src:MSFT-RPT1-2026-09-17#p3]，另一门是 Azure 算力，全年收入首次超过 1,000 亿美元 [src:MSFT-RPT1-2026-09-17#p3]。把两门粘在一起的是同一个客户目录和同一套身份与合规系统，转换成本存在于文件格式、身份目录（Entra）与合规审计（Purview）这一层，而每席位 30 美元的 Copilot 加购几乎没有自己的转换成本 [src:MSFT-RPT1-2026-09-17#p3]。它第一次把年金的现金大规模投进数据中心：FY2026 现金资本开支 1,159 亿美元、占收入 34.9%，自由现金流对非 GAAP 净利润的转换率从 FY2021 的 91.5% 降到 52.0% [src:MSFT-RPT1-2026-09-17#p5]。论点要成立，需要底座在 agent 时代继续收租、算力的增长有利润且资本开支周期会回落、6,780 亿美元的商业履约余额不只靠 OpenAI 一家（最近一次披露是 FY26 Q2 的 45%，对应当时 6,250 亿美元口径）[src:MSFT-RPT1-2026-09-17#p8]。"
  pillars:
    - id: P1
      claim: "年金底座仍在变强：转换成本存在于文件格式、身份目录与合规审计这一层，生产力与业务流程分部营业利润率 59.9% [src:MSFT-RPT1-2026-09-17#p3]；M365 商业云 FY2026 收入 1,020 亿美元、增长 16%，商业席位增长 6%（新口径 7%）[src:MSFT-RPT1-2026-09-17#p5]。"
      source: MSFT-RPT1-2026-09-17#p5
    - id: P2
      claim: "论点需要底座在 agent 时代仍握着定价权，而报告说这正是这门生意今天最大的问题：如果日常工作的入口从打开应用变成对 agent 说话，文件与身份这一层还在，但定价权会流向拥有那个界面的人 [src:MSFT-RPT1-2026-09-17#p4]。加购层本身几乎没有转换成本——三家可选时只有 8% 的人选 Copilot，有权限者的活跃率 35.8% [src:MSFT-RPT1-2026-09-17#p6]；所以要靠底座兜住续约，并在席位见顶之前接上 agent 或用量收入 [src:MSFT-RPT1-2026-09-17#p6]。这一条由 MSFT-Q12（加购层是否续约）与 MSFT-Q9（席位下降时有没有 agent 或用量收入接住）检验。"
      source: MSFT-RPT1-2026-09-17#p4
    - id: P3
      claim: "算力这门生意的增长有利润：Azure FY2026 收入首次超过 1,000 亿美元、增长 41%（旧口径）[src:MSFT-RPT1-2026-09-17#p3]，微软云毛利率全年 66%、第四季度 65% [src:MSFT-RPT1-2026-09-17#p11]；公司称需求持续超过可得容量 [src:MSFT-RPT1-2026-09-17#p4]。报告正文按全公司税后营业利润增量对三年资本开支的比值，给出税后增量回报 13% 到 39%，公开数据无法收窄 [src:MSFT-RPT1-2026-09-17#p4]；附录说这个区间是按全公司与智能云两种口径算的，两端各取哪种口径没有写明 [src:MSFT-RPT1-2026-09-17#p13]。"
      source: MSFT-RPT1-2026-09-17#p4
    - id: P4
      claim: "资本开支周期会回落，利润会重新变成现金：FY2026 现金资本开支占收入 34.9%，自由现金流对非 GAAP 净利润的转换率从 FY2021 的 91.5% 降到 52.0% [src:MSFT-RPT1-2026-09-17#p5]；转换率能不能回升，由资本开支什么时候回落决定 [src:MSFT-RPT1-2026-09-17#p4]。报告第十节写下的健康线是 FY2027 后回升（MSFT-Q4），论点作废线是 FY2028 年报低于 45%（MSFT-Q6）[src:MSFT-RPT1-2026-09-17#p11]；资本开支是否回落，按第七节的分界——FY2028 后回到收入的 20% 以下，还是继续在 30% 以上——由 MSFT-Q13 跟踪 [src:MSFT-RPT1-2026-09-17#p8]。回到哪里是另一个问题：解释 A 说产能满负荷后回到 70% 以上，解释 B 说新常态在 50–65%，两者在 FY2028 之前无法区分 [src:MSFT-RPT1-2026-09-17#p5]；这个差别落在估值上（只在私有仓库），不是论点的作废线。"
      source: MSFT-RPT1-2026-09-17#p5
    - id: P5
      claim: "履约余额背后的需求不只来自一个客户：商业履约余额 6,780 亿美元，最近一次披露来自 OpenAI 的比例是 45%（FY26 Q2，对应当时 6,250 亿美元口径）[src:MSFT-RPT1-2026-09-17#p8]；剔除 OpenAI 后仍增长 25%，最近一季的环比增量全部来自前沿模型公司以外的客户 [src:MSFT-RPT1-2026-09-17#p8]。"
      source: MSFT-RPT1-2026-09-17#p8
    - id: P6
      claim: "管理层像所有者一样配置资本：三任 CEO 均为内部人，六名执行官平均司龄 25.0 年 [src:MSFT-RPT1-2026-09-17#p7]；FY2022–FY2026 分红 1,102 亿美元加回购 1,129 亿美元回到股东手里，没有股权发行 [src:MSFT-RPT1-2026-09-17#p8]；短板是长期激励四项里三项是收入、一项是相对股价，没有资本回报项 [src:MSFT-RPT1-2026-09-17#p7]，而数据中心是它历史上最大的一笔资本配置 [src:MSFT-RPT1-2026-09-17#p3]。"
      source: MSFT-RPT1-2026-09-17#p8
  # 芒格反向清单：怎样会永久亏损（取自报告第七节反方最强论点、第四节侵蚀路径与第十二节“最可能错在哪”）
  permanent_loss_paths:
    - "算力变成吃掉年金现金的重资产：四家超大规模厂商加 neocloud 的产能同时上线，今天的排队变成明天的折扣 [src:MSFT-RPT1-2026-09-17#p6]；FY2028 的折旧摊销大概率比 FY2026 高出 220 亿美元以上，盖住它需要约 320 亿美元新增收入 [src:MSFT-RPT1-2026-09-17#p4]；若资本开支在 FY2028 之后仍占收入 30% 以上，反方就是对的，年金攒下的现金被永久换成了回报平庸的机器 [src:MSFT-RPT1-2026-09-17#p8]。"
    - "单一客户的反身性链条断裂：OpenAI 承诺增量采购 2,500 亿美元的 Azure 服务，按五年消耗每年约 500 亿美元，相当于 Azure FY2026 全年收入的一半 [src:MSFT-RPT1-2026-09-17#p8]；微软这一侧不可撤销的租赁与采购承诺合计 6,376 亿美元，相当于 9.5 年的 FY2026 自由现金流 [src:MSFT-RPT1-2026-09-17#p8]；OpenAI 的估值、融资、采购与微软的履约余额、资本开支互相作证，断的时候不会只断一处 [src:MSFT-RPT1-2026-09-17#p9]。"
    - "年金被自己的 agent 拆掉：日常工作的入口外移到模型公司或手机厂商的界面，Office 退化成文件格式与后端，定价权流向界面所有者 [src:MSFT-RPT1-2026-09-17#p6]；约 108 亿美元年化的 Copilot 加购层里约 69 亿美元是买了没怎么用的席位，靠底座的粘性兜着 [src:MSFT-RPT1-2026-09-17#p6]，一旦席位开始下降而 agent 或用量收入接不上，失血的就是底座本身。"
    - "现金转换率回不到收租者的水平（报告第十二节认为这份判断最可能错的地方）：FY2021–FY2023 资本开支从未超过收入 14% [src:MSFT-RPT1-2026-09-17#p4]，转换率在 82.2% 到 91.5% 之间 [src:MSFT-RPT1-2026-09-17#p5]；FY2024 资本开支已占收入 18.1%，转换率仍有 84.0% [src:MSFT-RPT1-2026-09-17#p5]，第十二节把 FY2024 也算进资本开支不到收入 14% 的年代，与第三节的正文和表格不一致（见 todo）[src:MSFT-RPT1-2026-09-17#p12]；转换率掉下来的是资本开支超过收入 20% 的两年，FY2025 只有 67.9%、FY2026 只有 52.0% [src:MSFT-RPT1-2026-09-17#p12]。报告说，如果置业者回不到收租者的转换率，年金的粘性、管理层的记录与集中度的算术即便全对也救不回来 [src:MSFT-RPT1-2026-09-17#p13]；这一条首先改写的是估值（只在私有仓库），论点本身的作废线是 FY2028 低于 45%（MSFT-Q6）[src:MSFT-RPT1-2026-09-17#p11]。"
    - "资本配置失误被规模放大：aQuantive 与 Nokia 两笔收购已确认失败、合计减记约 138 亿美元，Activision 的 754 亿美元仍在观察中，数据中心是第四笔、也是最大的一笔 [src:MSFT-RPT1-2026-09-17#p3]；而衡量它的尺子还没装上——长期激励奖励 Azure 的收入增量，不奖励为此花掉的资本开支 [src:MSFT-RPT1-2026-09-17#p7]。"

