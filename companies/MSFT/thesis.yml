  - id: MSFT-L2
    type: qualitative
    claim: "The key operators and the yardstick that measures them are both in place: there is an arrangement for the CEO handover, and while capex is high, incentives include a return on capital"
    origin: report:breaker
    severity: breaker
    covers: [management, governance, capital_allocation]
    pillar: P6
    question: "As of this period, has either of the following happened: (a) Nadella has left and the company has disclosed no succession arrangement; (b) in the 2027 proxy statement (DEF 14A), the executives' long-term incentive metrics still include no return-on-capital metric (such as return on invested capital, incremental return on capital or free cash flow return), while cash capex (excluding finance leases) for the latest full fiscal year (FY2027) is above $150 billion?"
    fail_if: "Yes ((a) or (b) holds; the two conditions in (b) must both hold)"
    judge: independent_model
    evidence: required
    where: 8-K Item 5.02, the Compensation Discussion and Analysis in the proxy statement (DEF 14A), the 10-K cash flow statement, company press releases
    lookback: 4
    judge_notes:
      - "An announced departure that has not yet taken place does not satisfy (a)."
      - "(b) is judged on the 2027 proxy statement; (a) can be read at any time; the October 2026 proxy statement is only a supplementary observation, not a trigger."
    effective_from: FY2027Q1
    first_readable: 2026-10
    baseline:
      value: "Nadella joined in 1992 and became CEO in 2014; the long-term performance stock metrics in the FY2025 proxy are incentive-plan revenue 35%, Microsoft Cloud revenue 35%, Azure and other cloud services revenue 15%, and three-year total shareholder return relative to the S&P 500 15%; none of the four is a return-on-capital measure"
      source: MSFT-RPT1-2026-09-17#p7
    note: "Breaker six in section ten of the report. (a) Per the report's text, it counts only if Nadella has already left without a disclosed succession arrangement; an announced departure is recorded in that period's update [src:MSFT-RPT1-2026-09-17#p12]. The report's reasoning: in FY2026, an Azure increase of about $29 billion consumed $115.9 billion of cash capex, and the incentive plan rewards the former, not the latter [src:MSFT-RPT1-2026-09-17#p7]. The October 2026 proxy statement is the first point at which one can see whether this yardstick has been installed (a supplementary observation, not a trigger) [src:MSFT-RPT1-2026-09-17#p11]. The report does not say which period the $150 billion refers to, so here it is judged on cash capex for the latest full fiscal year when the proxy is published (FY2027), on the same basis as section ten, excluding finance leases [src:MSFT-RPT1-2026-09-17#p12] [src:MSFT-RPT1-2026-09-17#p4]; this reading awaits the owner's confirmation (see todo)."

