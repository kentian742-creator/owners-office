tests:
  # ---------- Lynch stalwart template (all five kept; MSFT-Q4 changes the metric and rewrites the threshold, MSFT-L1 rewrites the question; reasons in each note) ----------
  - id: MSFT-Q1
    type: quantitative
    claim: Growth has not slipped out of the stalwart range
    origin: template:stalwart
    severity: watch
    covers: [growth]
    pillar: P1
    metric: revenue_yoy
    fail_if: Below 5% for 4 consecutive quarters
    rule: {op: "<", threshold: 5, unit: "%", consecutive: 4, period: quarter}
    warn_if: Below 8% for 2 consecutive quarters
    warn_rule: {op: "<", threshold: 8, unit: "%", consecutive: 2, period: quarter}
    data: xbrl
    effective_from: FY2027Q1
    first_readable: 2026-10
    baseline:
      value: 18
      unit: "%"
      period: FY2026
      as_of: 2026-06-30
      source: MSFT-RPT1-2026-09-17#p7
      note: "Revenue rose from $281.7 billion in FY2025 to $331.8 billion in FY2026 [src:MSFT-RPT1-2026-09-17#p5]."
    note: "The thresholds are the template defaults. They are far from FY2026's growth rate, so this test is only a floor: the early signals of slowing growth are in the segment tests, namely Azure growth (MSFT-Q10's warning line and MSFT-Q5), M365 commercial cloud and seat growth (MSFT-Q12's warning line), and whether seats are falling (MSFT-Q9). The report treats the More Personal Computing business (Windows OEM, Xbox, search advertising) as background, not as part of the thesis, and the company's FY2027 guidance is for Windows OEM and Devices to decline in the high teens [src:MSFT-RPT1-2026-09-17#p3]; when company-wide growth slows, check the tests above first to see which business is slowing."

  - id: MSFT-Q2
    type: quantitative
    claim: Return on invested capital holds at the level of an excellent business
    origin: template:stalwart
    severity: watch
    covers: [returns_on_capital, moat]
    pillar: P3
    metric: roic
    fail_if: Below 12% for 2 consecutive years
    rule: {op: "<", threshold: 12, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2027Q1
    first_readable: 2027-07
    note: "Both the claim and the threshold are the template defaults. The report gives no company-wide return on invested capital, so the baseline is to be backfilled from the XBRL of the FY2026 annual report. This test cannot see the data centers' drag on returns: invested capital in the registry's roic is equity plus interest-bearing debt minus cash, excluding lease liabilities, and the data centers are largely obtained through leases: lease obligations including imputed interest were $443.5 billion at the end of FY2026 [src:MSFT-RPT1-2026-09-17#p8], against long-term debt principal of only $46.1 billion [src:MSFT-RPT1-2026-09-17#p9], and from FY2027 most data center leases are booked as operating leases [src:MSFT-RPT1-2026-09-17#p4]. The annuity's high returns will also mask the returns on new investment for many years, so this test is a floor, not an early signal; for early signals, see MSFT-Q5 and MSFT-Q7. The report gives an incremental measure: its main text takes the company-wide increase in after-tax operating profit over three years of capex, for an after-tax incremental return between 13% and 39% that public data cannot narrow [src:MSFT-RPT1-2026-09-17#p4], and the appendix says the range was calculated on two bases, the whole company and Intelligent Cloud [src:MSFT-RPT1-2026-09-17#p13]; one condition for raising the capital allocation rating to B+ is a three-year incremental after-tax return reading above 20% [src:MSFT-RPT1-2026-09-17#p3]."

  - id: MSFT-Q3
