# MSFT thesis file (public; thesis-ci spec §4; schema: spec/schemas/thesis.schema.json)
# The public, complete example archive. How it was made: first the Lynch stalwart template and the _common staleness tests,
# then, one by one, the eight thesis breakers (severity: breaker) and five quarterly watch indicators (severity: watch) from section ten of the 02 report.
# Thresholds follow the report's text: the same numbers, the same number of consecutive periods; wherever a template threshold or metric is changed, the test's note gives the reason.
# The trigger lines of watch indicators #3 (Microsoft Cloud gross margin) and #4 (cash conversion) are breakers three and two:
#   #3's healthy line is written as MSFT-Q7's warn_rule; #4's healthy line goes into the rewritten template test MSFT-Q4, and its trigger line is MSFT-Q6.
# Breaker four is two conditions joined by "or", split into MSFT-Q8 (the number) and MSFT-L5 (the commitment restructured or impaired, judged by an independent model with sources).
# Two more watch tests are this archive's own additions (origin: manual), taken from section seven of the report: MSFT-Q13 (whether capex comes down) and MSFT-Q14 (purchase commitments due within a year).
# Section ten of the report: from FY2027 the segments and definitions are restated per the 8-K of 2026-09-02; every metric below is judged on the new basis.
# Everything price-related (ranges, reference price, the rating on price) is only in the private repository, owners-office-private/companies/MSFT/valuation.yml.
schema_version: "0.2"
company: MSFT
name: Microsoft Corporation
exchange: NASDAQ
status: candidate
filer:
  cik: "0000789019"
  type: domestic
  fiscal_year_end: "06-30"
  earnings_form: 8-K
  annual_form: 10-K
category: stalwart
category_secondary: fast_grower
category_rationale: "FY2026 revenue of $331.8 billion and an operating margin of 46.8% [src:MSFT-RPT1-2026-09-17#p3], with revenue up 18% in a year [src:MSFT-RPT1-2026-09-17#p7]: a large, steady stalwart that keeps earning from the annuity of seats it rents out, and its risk falls exactly on what this template watches, “expensive allocation made for growth”: FY2026 cash capex of $115.9 billion, 34.9% of revenue [src:MSFT-RPT1-2026-09-17#p5]. The secondary category is fast grower, because Azure within it grew 41% for the full year (old basis) and passed $100 billion of revenue for the first time [src:MSFT-RPT1-2026-09-17#p3]."
domain: enterprise_software
# Depends on the semiconductor foundry module. The report itself does not analyze the foundry industry; this dependency is a monitoring link added by this archive (set on 2026-09-24; the owner may withdraw it, see todo).
# Two of the module's signposts are relevant: FOUNDRY-SP2 (the leading foundry's gross margin floor and AI demand: TSMC cutting its capex guidance, the HPC share stalling;
# its implication column says hyperscalers slow their capex) maps to MSFT-Q5, MSFT-Q7, MSFT-Q10, MSFT-Q13 and pillars P3 and P4;
# FOUNDRY-SP5 (tariffs, capacity moving abroad and production in Taiwan) changes the capex cost and the availability of each unit of compute, mapping to pillars P3 and P4.
# The other signposts relate only weakly to this thesis, so the review when they trigger can be short.
depends_on: [industries/semiconductor-foundry]
trust_level: 1
as_of: 2026-09-24

