    note: "Breaker two in section ten of the report, and also watch indicator #4's trigger line. This line is looser than “conversion stops falling”: as long as FY2028 is not below 45%, it does not trigger even if it is lower than FY2026's 52.0% [src:MSFT-RPT1-2026-09-17#p11] [src:MSFT-RPT1-2026-09-17#p5]; a continued decline that does not break the line is recorded by MSFT-Q4's warning and failure lines. The report keeps this line separate from the depreciation curve: depreciation is a non-cash charge that weighs on profit, not on conversion; what really weighs on conversion is the cash outlay of capex, and whether conversion recovers depends on when capex comes down [src:MSFT-RPT1-2026-09-17#p4]. Both lines can first be read in the annual report of July 2028, but they cannot corroborate each other [src:MSFT-RPT1-2026-09-17#p4]. For years after FY2028, the threshold will be rewritten in the update at that time."

  - id: MSFT-Q7
    type: quantitative
