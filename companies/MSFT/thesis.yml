      note: "Purchase commitments of $194.1 billion at 2026-06-30, of which $169.0 billion are due in FY2027 [src:MSFT-10K-FY2026#p44]; FY2026 operating cash flow of $182.9 billion [src:MSFT-10K-FY2026#p53]; $169,008 million ÷ $182,935 million = 92.4% (this archive's calculation) [src:MSFT-10K-FY2026#p44] [src:MSFT-10K-FY2026#p53]."
    note: "One of the three readings listed in section seven of the report that can change the judgment before 2028: the $743.8 billion table of contractual obligations at 2026-06-30 [src:MSFT-10K-FY2026#p44], which the report expects to get heavier [src:MSFT-RPT1-2026-09-17#p8], is the only one of the three interest-rate transmission paths that lands directly on this company, and it can be read in every 10-Q of FY2027 [src:MSFT-RPT1-2026-09-17#p9]. The other two readings: interest rates go only into the valuation (private repository), and OpenAI's 8-Ks are tracked by MSFT-L3 and MSFT-L5. The threshold (commitments due within a year exceeding a year's operating cash flow) was written down in advance by this archive; the report gives none, and it awaits the owner's confirmation (see todo); if the 10-Q does not disclose purchase commitments by year due, this test can only be read once a year from the 10-K. The report also notes that for leases signed after September 2026 the pricing benchmark has moved [src:MSFT-RPT1-2026-09-17#p9]: the 10-year Treasury par yield was 4.16% on 2025-09-24 and 5.18% on 2026-09-24 [src:UST-PARYIELD-2025-09-24] [src:UST-PARYIELD-2026-09-24], though it was below 5.0% on some days in between, such as 4.94% on 2026-09-17 [src:UST-PARYIELD-2026-09-24]; this is recorded in updates, with no threshold."

