  - id: MSFT-L4
    type: qualitative
    claim: The EU's sovereignty framework has not shut US providers out of Level 3
    origin: report:breaker
    severity: breaker
    covers: [regulation, moat]
    pillar: P2
    question: "Has the EU Cloud and AI Development Act (CADA) taken effect (entered into force and begun to apply), and is its Level 3 third-country recognition route closed to US cloud providers in practice? Any of the following counts as closed in practice: (a) the final text or implementing rules make it legally impossible for providers subject to the US CLOUD Act to obtain recognition; (b) the EU formally decides not to grant the US third-country recognition, or formally rejects a US provider's application for recognition on the grounds that it is subject to the US CLOUD Act (a rejection for reasons specific to an individual provider does not count); (c) 12 months after the Act takes effect, no US-jurisdiction cloud provider has obtained Level 3 recognition through this route, and there is no pending application for recognition or recognition decision."
    fail_if: Yes (the Act has taken effect, and any of (a), (b) or (c) holds)
    warn_if: The Act has taken effect and (a), (b) and (c) are not yet met, but as of this period no US-jurisdiction cloud provider has obtained Level 3 recognition (no evidence yet on whether the route is open in practice)
    judge: independent_model
    evidence: required
    where: The final legal text and implementing rules in the Official Journal of the EU, the European Commission's recognition decisions and the status of applications, the risk factors and regulation sections of Microsoft's 10-K/10-Q
    lookback: 4
    effective_from: FY2027Q1
    first_readable: 2027-01
    baseline:
      value: "The European Commission proposed the Cloud and AI Development Act on 2026-06-03, setting up a four-level sovereignty framework whose top level, read literally, would exclude providers subject to the US CLOUD Act; the Commission says Level 3 has a third-country recognition route, and industry says no major technology country can meet the Article 18 criteria today"
      source: MSFT-RPT1-2026-09-17#p6
    note: "Breaker eight in section ten of the report, for the sovereignty-fragmentation erosion path; the signal the report gives is whether Level 3's recognition route is open to US providers in practice, readable progressively over 2027–2029 [src:MSFT-RPT1-2026-09-17#p6]. The three cases of “closed in practice” are this archive's reading, written down in advance: (a) and (b) are closure in law, (c) is closure in fact, since industry says no major technology country can meet the Article 18 criteria today and the route may exist only on paper [src:MSFT-RPT1-2026-09-17#p6]. Neither the time limit in (c) nor the warn_if level comes from the report; both await the owner's confirmation (see todo). first_readable is the start of the report's 2027–2029 readable window. Scale: Level 4 (defense), by the Financial Times' measure, is about 1% of the public procurement market (secondary), and the real battleground is Level 3 [src:MSFT-RPT1-2026-09-17#p6]."

  - id: MSFT-L5
    type: qualitative
    claim: The incremental purchase commitment of its largest customer, OpenAI, has not been restructured or impaired
    origin: report:breaker
    severity: breaker
    covers: [customer_concentration, growth]
    pillar: P5
    question: "As of this period, has Microsoft's 8-K, 10-Q/10-K or earnings call materials, or OpenAI's public filings (including the S-1), disclosed that the contract under which OpenAI committed to buy an incremental $250 billion of Azure services has been restructured (the committed amount or payment obligations cut, or terms rewritten beyond a mere extension) or impaired? A mere extension of the term, with the amount and customer concentration unchanged, is not a restructuring and is recorded under warn_if."
    fail_if: Yes (the commitment was restructured or impaired)
    warn_if: The commitment was only extended, with the amount and concentration unchanged (the report records this as a worsening of duration, watched separately)
    judge: independent_model
    evidence: required
    where: Microsoft's 8-Ks, the remaining performance obligation and material contract disclosures in the 10-Q/10-K revenue note, earnings call transcripts; OpenAI's S-1 and announcements
    lookback: 4
    effective_from: FY2027Q1
    first_readable: 2026-10
    baseline:
      value: OpenAI has committed to buy an incremental $250 billion of Azure services, which, consumed over five years, is about $50 billion a year, half of Azure's full-year FY2026 revenue
      source: MSFT-RPT1-2026-09-17#p8
    note: "The second condition of breaker four in section ten of the report, split out from MSFT-Q8 and joined to it by “or”; the report records an extension with unchanged concentration as a worsening of duration, watched separately, which is written here as warn_if [src:MSFT-RPT1-2026-09-17#p11]. The answer often shows up first not in the financial statements but in an 8-K: OpenAI's IPO pricing and any restructuring or impairment of the commitment can appear as an 8-K at any time [src:MSFT-RPT1-2026-09-17#p8], so the test is judged each time a relevant 8-K appears. Complements MSFT-L3: this test looks at the commitment itself, that one at Microsoft's equity stake and OpenAI's ability to raise money."

  # ---------- Section ten of the report: watch indicators read every quarter (#1, #2, #5; #3 and #4 are merged into MSFT-Q7 and MSFT-Q4/Q6) ----------
  - id: MSFT-Q10
    type: quantitative
    claim: Azure growth stays in the healthy range
    origin: report:watch
    severity: watch
    covers: [growth, competition]
    pillar: P3
    metric: segment_revenue_yoy
    params: {segment: Azure, basis: "FY27 new basis (restated in the 8-K of 2026-09-02)", currency: constant currency}
    fail_if: Below 25% for two consecutive quarters
    rule: {op: "<", threshold: 25, unit: "%", consecutive: 2, period: quarter}
    warn_if: Below 30% in a single quarter (leaving the healthy range)
    warn_rule: {op: "<", threshold: 30, unit: "%", consecutive: 1, period: quarter}
    data: filing_text
    effective_from: FY2027Q1
    first_readable: 2026-10
    baseline:
      value: 42
      unit: "%"
      period: FY2026Q4 (June quarter, new basis, constant currency)
      as_of: 2026-06-30
      source: MSFT-RPT1-2026-09-17#p11
      note: "June-quarter revenue of $29.42 billion [src:MSFT-RPT1-2026-09-17#p11]; full-year FY2026 growth of 41% on the old basis [src:MSFT-RPT1-2026-09-17#p3]."
    note: "Watch indicator #1 in section ten of the report: the healthy range is not below 30%, and two consecutive quarters below 25% trigger attention [src:MSFT-RPT1-2026-09-17#p11]. Before FY27 Q1, the growth rates the cloud providers report do not share the same numerator (both definitions and periods differ), so they cannot be used to infer market share [src:MSFT-RPT1-2026-09-17#p6]."

  - id: MSFT-Q11
    type: quantitative
    claim: Demand excluding OpenAI is still growing fairly fast
    origin: report:watch
    severity: watch
    covers: [customer_concentration, growth]
    pillar: P5
    metric_def:
      id: commercial_rpo_ex_openai_yoy
      description: Year-on-year growth of commercial remaining performance obligation (commercial RPO, the balance of commercial contracts still to be performed) excluding OpenAI, as defined by the company
      unit: "%"
      frequency: quarter
      data: filing_text
      where: Commercial RPO disclosures in earnings press releases and call transcripts; remaining performance obligations in the 10-Q/10-K revenue note
      formula: rpo_ex_openai_t / rpo_ex_openai_{t-4q} - 1
    fail_if: Below 10%
    rule: {op: "<", threshold: 10, unit: "%", consecutive: 1, period: quarter}
    warn_if: Below 15% (leaving the healthy range)
    warn_rule: {op: "<", threshold: 15, unit: "%", consecutive: 1, period: quarter}
    data: filing_text
    effective_from: FY2027Q1
    first_readable: 2026-10
    baseline:
      value: 25
      unit: "%"
      period: FY2026Q4
      as_of: 2026-06-30
      source: MSFT-RPT1-2026-09-17#p11
    note: "Watch indicator #2 in section ten of the report: the healthy range is not below 15%, and below 10% triggers attention [src:MSFT-RPT1-2026-09-17#p11]. The report warns that the balance excluding OpenAI cannot separate neoclouds from real enterprises, so even if this reading is healthy, the concentration itself remains [src:MSFT-RPT1-2026-09-17#p8]."

  - id: MSFT-Q12
    type: quantitative
    claim: "The Copilot add-on layer is renewing: the gap between M365 commercial cloud growth and seat growth has not narrowed"
    origin: report:watch
    severity: watch
    covers: [pricing_power, moat, unit_economics]
    pillar: P2
    metric_def:
      id: m365_cloud_minus_seat_growth
      description: M365 commercial cloud revenue growth year on year minus M365 commercial seat growth year on year (new basis), that is, the growth in revenue per seat
      unit: pp
      frequency: quarter
      data: filing_text
      where: Earnings press releases and call transcripts; 10-Q/10-K MD&A
      formula: m365_commercial_cloud_revenue_yoy - m365_commercial_seats_yoy
      components:
        m365_commercial_cloud_revenue_yoy:
          description: Microsoft 365 commercial cloud revenue growth year on year (constant currency), as defined by the company
          unit: "%"
          where: Earnings press releases and call transcripts; 10-Q/10-K MD&A
        m365_commercial_seats_yoy:
          description: Microsoft 365 commercial seat growth year on year (FY27 new basis, including paid GitHub seats), as defined by the company
          unit: "%"
          where: Earnings press releases and call transcripts; Microsoft 365 commercial seat growth in the 10-Q/10-K MD&A
    fail_if: The gap narrows to 5 percentage points or less
    rule: {op: "<=", threshold: 5, unit: pp, consecutive: 1, period: quarter}
    warn_if: M365 commercial cloud growth below 12%, or seat growth below 4% (leaving the healthy range)
    warn_rule:
      any_of:
        - {metric: m365_cloud_minus_seat_growth.m365_commercial_cloud_revenue_yoy, op: "<", threshold: 12, unit: "%", consecutive: 1, period: quarter}
        - {metric: m365_cloud_minus_seat_growth.m365_commercial_seats_yoy, op: "<", threshold: 4, unit: "%", consecutive: 1, period: quarter}
    data: filing_text
    effective_from: FY2027Q1
    first_readable: 2026-10
    baseline:
      value: 10
      unit: pp
      period: FY2026 (commercial cloud 16% − seats 6%, old basis)
      as_of: 2026-06-30
      source: MSFT-RPT1-2026-09-17#p11
      note: "The company's FY27 Q1 guidance for Microsoft 365 commercial cloud is about 17% in constant currency (FY27 new basis) [src:MSFT-8K-2026-09-02#EX-99.1-slide21]; the “seat growth of about 7% on the new basis” that the report writes next to it is FY2026's reading restated on the new basis [src:MSFT-RPT1-2026-09-17#p11]; whether the company also guided seat growth is still to be checked (see todo)."
    note: "Watch indicator #5 in section ten of the report. The arithmetic: about 30 million paid seats × $30 per seat per month × 12 ≈ about $10.8 billion a year of annualized Copilot revenue, 10.6% of M365 commercial cloud's $102 billion, which almost explains the gap of about 10 percentage points between commercial cloud growth and seat growth [src:MSFT-RPT1-2026-09-17#p6]; all three inputs come with caveats (global seats, list price rather than realized price, active-use rates from a US panel) [src:MSFT-RPT1-2026-09-17#p6]. If the roughly $6.9 billion of it that is seats bought but little used churns within a year, the gap narrows to about 4 percentage points [src:MSFT-RPT1-2026-09-17#p6]; a gap still around 10 percentage points means the add-on layer is renewing, and a gap narrowing to within 5 percentage points means that $6.9 billion is churning [src:MSFT-RPT1-2026-09-17#p6]. The healthy range “≥12% / ≥4%” is read as applying to commercial cloud growth and seat growth respectively [src:MSFT-RPT1-2026-09-17#p11]."

  # ---------- Added by this archive (origin: manual): two readings that have a dividing line in section seven of the report but are not listed in section ten ----------
  - id: MSFT-Q13
    type: quantitative
    claim: The capex cycle comes down rather than staying at the high level of a compute business
    origin: manual
    severity: watch
    covers: [capital_allocation, free_cash_flow]
    pillar: P4
    metric: capex_to_revenue
    fail_if: In a fiscal year after FY2028, cash capex is still above 30% of revenue (bear argument one holds)
    rule: {op: ">", threshold: 30, unit: "%", consecutive: 1, period: year, evaluate_from: FY2029, note: "Judged by fiscal year from the FY2029 annual report; FY2028 and earlier do not count."}
    warn_if: In a fiscal year after FY2028, cash capex has not returned below 20% of revenue
    warn_rule: {op: ">=", threshold: 20, unit: "%", consecutive: 1, period: year, evaluate_from: FY2029, note: "Judged by fiscal year from the FY2029 annual report; FY2028 and earlier do not count."}
    data: xbrl
    effective_from: FY2027Q1
    first_readable: 2029-07
    baseline:
      value: 34.9
      unit: "%"
      period: FY2026
      as_of: 2026-06-30
      source: MSFT-RPT1-2026-09-17#p5
      note: "12.3% in FY2021, 18.1% in FY2024 and 22.9% in FY2025 [src:MSFT-RPT1-2026-09-17#p5]."
    note: "The dividing variable of bear argument one in section seven of the report: if capex returns below 20% of revenue after FY2028, the depreciation curve peaks around FY2030 and conversion returns to 70% [src:MSFT-RPT1-2026-09-17#p8]; if it stays above 30%, the bear case is right [src:MSFT-RPT1-2026-09-17#p8]. The report does not list it among section ten's thesis breakers, so it is recorded here only as watch; the thresholds come from the report, and reading “after FY2028” as starting from the FY2029 annual report is this archive's reading (see todo). Same basis as section ten: cash capex excluding finance leases [src:MSFT-RPT1-2026-09-17#p4]. This is the direct test of the “capex cycle comes down” half of pillar P4; the other half (conversion) is tracked by MSFT-Q4 and MSFT-Q6."

  - id: MSFT-Q14
    type: quantitative
    claim: "Fixed commitments have not outweighed operating cash flow: purchase commitments due within a year do not exceed the latest year's operating cash flow"
    origin: manual
    severity: watch
    covers: [balance_sheet, capital_allocation]
    pillar: P4
    metric_def:
      id: purchase_commitments_due_12m_to_ocf
      description: Purchase commitments due within the next 12 months ÷ operating cash flow over the latest four quarters, as defined by the company
      unit: "%"
      frequency: quarter
      data: filing_text
      where: The contractual obligations table in the 10-K MD&A (purchase commitments by year due) and the commitments disclosure in the 10-Q; operating cash flow from the cash flow statement
      formula: purchase_commitments_due_within_12m / operating_cash_flow_ttm
    fail_if: Above 100%
    rule: {op: ">", threshold: 100, unit: "%", consecutive: 1, period: quarter}
    data: filing_text
    effective_from: FY2027Q1
    first_readable: 2026-10
    baseline:
      value: 92
      unit: "%"
      period: FY2026 (purchase commitments due in FY2027 ÷ FY2026 operating cash flow)
      as_of: 2026-06-30
      source: MSFT-RPT1-2026-09-17#p8
      note: "Purchase commitments of $194.1 billion, of which $169 billion are due in FY2027 [src:MSFT-RPT1-2026-09-17#p8]; FY2026 operating cash flow of $182.9 billion [src:MSFT-RPT1-2026-09-17#p8]."
    note: "One of the three readings listed in section seven of the report that can change the judgment before 2028: the $743.8 billion table of contractual obligations, which will get heavier [src:MSFT-RPT1-2026-09-17#p8], is the only one of the three interest-rate transmission paths that lands directly on this company, and it can be read in every 10-Q of FY2027 [src:MSFT-RPT1-2026-09-17#p9]. The other two readings: interest rates go only into the valuation (private repository), and OpenAI's 8-Ks are tracked by MSFT-L3 and MSFT-L5. The threshold (commitments due within a year exceeding a year's operating cash flow) was written down in advance by this archive; the report gives none, and it awaits the owner's confirmation (see todo); if the 10-Q does not disclose purchase commitments by year due, this test can only be read once a year from the 10-K. The report also notes that for leases signed after September 2026, the pricing benchmark has moved from a 10-year yield of about 4.2% a year earlier to above 5.0% [src:MSFT-RPT1-2026-09-17#p9]; this is recorded in updates, with no threshold."

