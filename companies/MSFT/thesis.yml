      note: "The year-on-year reading is to be backfilled from the XBRL of the FY2026 annual report. The report gives only the five-year total: the diluted share count fell about 2% over FY2022–FY2026 (see F22) [src:MSFT-RPT1-2026-09-17#p8]; buybacks over the same period were $112.9 billion, while five years of stock-based compensation expense came to about $52.2 billion, plus $24.8 billion of repurchases for tax withholding, so new shares ate about half the effect of the buyback cash [src:MSFT-RPT1-2026-09-17#p8]."
    note: "The threshold is the template default. Standard two in section six of the report asks whether shareholder returns were offset by new debt or equity (the answer is no), not how much of the buybacks truly reduced the share count (the answer is half); this test watches the second question."

  - id: MSFT-Q4
    type: quantitative
    claim: "Profit turns back into cash: the conversion of free cash flow to non-GAAP net income recovers from its ten-year low"
    origin: template:stalwart
    severity: watch
    covers: [free_cash_flow]
    pillar: P4
    metric: fcf_to_non_gaap_net_income
    fail_if: From FY2027, not above FY2026's 52% for 2 consecutive fiscal years
    rule: {op: "<=", threshold: 52, unit: "%", consecutive: 2, period: year, evaluate_from: FY2027, note: "Counted from the FY2027 annual report; FY2026 itself does not count toward the consecutive periods."}
    warn_if: From FY2027, any fiscal year not above 52% (no recovery)
    warn_rule: {op: "<=", threshold: 52, unit: "%", consecutive: 1, period: year, evaluate_from: FY2027, note: "Counted from the FY2027 annual report; FY2026 itself does not count."}
    data: filing_text
    effective_from: FY2027Q1
    first_readable: 2027-07
    baseline:
      value: 52.0
      unit: "%"
      period: FY2026
      as_of: 2026-06-30
      source: MSFT-RPT1-2026-09-17#p5
      note: "FY2021 91.5%, FY2022 89.6%, FY2023 82.2%, FY2024 84.0%, FY2025 67.9% [src:MSFT-RPT1-2026-09-17#p5]."
    note: "Rewritten template: not only the threshold but also the metric was changed, which goes beyond the template README's permission to change thresholds only; the integration step is to record this in a decision record (see todo). The template's default is the registry's fcf_conversion (GAAP net income basis, computable from XBRL), failing after 2 consecutive years below the normal line; on the report's basis, FY2025's 67.9% and FY2026's 52.0% are already two consecutive years below that normal line [src:MSFT-RPT1-2026-09-17#p5], so judged as written, the test would fail on creation and bring no new information. Two changes are made here, both taken from the report. One: the metric becomes free cash flow ÷ non-GAAP net income as used throughout the report (capex excluding finance leases), the same number MSFT-Q6 reads [src:MSFT-RPT1-2026-09-17#p4]; the cost is that the denominator is defined by the company and has to be extracted from the press release's reconciliation table, so this archive no longer has a cash conversion test computable directly from XBRL. Two: the threshold becomes the healthy line of section ten's watch indicator #4, “recovery after FY2027”, with FY2026's 52% as the base [src:MSFT-RPT1-2026-09-17#p11]. The template's normal line has a counterpart in the report: conversion returning above 70% once capacity runs full is explanation A, a new normal of 50–65% is explanation B, and the two cannot be separated before FY2028 [src:MSFT-RPT1-2026-09-17#p5]; review this test once the FY2028 annual report is out. Watch indicator #4's trigger line is breaker two; see MSFT-Q6."

  - id: MSFT-L1
    type: qualitative
    claim: Management has not withdrawn, or revised in an unfavorable direction, any outlook it has given that has not yet come due
    origin: template:stalwart
    severity: watch
    covers: [management]
    pillar: P6
    question: "In this period's earnings press release, call materials or 10-Q/10-K, did management withdraw an outlook or guidance given earlier that has not yet come due, or revise the outlook for the same period in an unfavorable direction, that is, lower the expected growth of revenue, operating profit or a segment (Azure, M365 commercial cloud, Windows OEM and Devices, Xbox) (for a line already expected to decline, a larger expected decline), or lower the expected operating margin? Figures rewritten only because of a change in accounting basis, segment basis or how leases are booked do not count; changes to capex plans are outside this question and are tracked by MSFT-Q5 and MSFT-Q13."
    fail_if: An outlook or guidance not yet due was withdrawn, and no testable replacement figure was given at the same time
    warn_if: The outlook for the same period was revised in an unfavorable direction (with new figures given at the same time)
    judge: independent_model
    evidence: required
    where: The earnings 8-K's press release, the earnings call transcript and investor materials, the 10-Q/10-K MD&A
    lookback: 4
    effective_from: FY2027Q1
    first_readable: 2026-10
    baseline:
      value: "FY27 Q1 guidance: Microsoft 365 commercial cloud revenue growth of about 17% in constant currency (FY27 new basis, mechanically adjusted to the new segment basis from the roughly 15% given on 2026-07-29)"
      source: MSFT-8K-2026-09-02#EX-99.1-slide21
      note: "Other guidance already given: FY2027 Windows OEM and Devices to decline in the high teens, and Xbox expected to return to growth after its reset, given on the FY26 Q4 earnings call of 2026-07-29 [src:MSFT-CALL-FY2026Q4]; this archive does not have the full call transcript, and the wording is taken from the report page that relays it [src:MSFT-RPT1-2026-09-17#p3]. The “seat growth of about 7% on the new basis” that the report writes next to that quarter's guidance is FY2026 seat growth restated on the new basis [src:MSFT-RPT1-2026-09-17#p11]; it is not treated as guidance here unless the call transcript or an 8-K shows that the company really did guide seat growth (see todo). The calendar 2026 capex figure changed from about $190 billion to about $175 billion because, from FY2027, data center leases are mostly booked as operating rather than finance leases, which is a change in how they are booked, not a revision [src:MSFT-RPT1-2026-09-17#p4]."
    note: "Rewritten template: the template asks about published medium-term financial targets; the report does not mention Microsoft publishing medium-term targets and records only guidance already given (see baseline), so here “targets” is read as the outlook and guidance management has given that has not yet come due. “Microsoft gives next-quarter guidance only on each quarterly call and its full-year outlook on the fourth-quarter call” is this archive's working assumption, not stated in the report, to be checked against the FY26 Q4 call transcript and the 8-K (see todo). fail_if keeps the template's meaning (withdrawn with no testable replacement figure); an unfavorable revision is recorded as a warning, a level this archive added. Capex is kept out of this question: raising capex is not an unkept promise but capital allocation, and lowering it is exactly the direction pillar P4 wants; both are tracked by MSFT-Q5 and MSFT-Q13 as a share of revenue."

  # ---------- Section ten of the report: thesis breakers (if any one holds, the investment thesis is void, not merely downgraded) ----------
  - id: MSFT-Q5
    type: quantitative
    claim: "The compute spending is buying growth: while capex is still high, Azure growth has not dropped"
    origin: report:breaker
    severity: breaker
    covers: [growth, returns_on_capital, capital_allocation]
    pillar: P3
    metric_def:
      id: azure_growth_vs_capex_intensity
      description: Azure revenue growth year on year and cash capex as a share of revenue in the same quarter (both judged in the same quarter)
      unit: "%"
      frequency: quarter
      data: mixed
      components:
        azure_revenue_yoy: {description: "Azure revenue growth year on year (FY27 new basis, restated in the 8-K of 2026-09-02; constant currency), as defined by the company", unit: "%", where: segment note or earnings press release}
        capex_to_revenue: {description: "Cash capex ÷ revenue (excluding finance leases), defined as in the registry's capex_to_revenue", unit: "%", xbrl: ["us-gaap:PaymentsToAcquirePropertyPlantAndEquipment"]}
    fail_if: Azure constant-currency growth below 20% for two consecutive quarters while cash capex in the same period is still above 25% of revenue (capex excluding finance leases)
    rule:
      all_of:
        - {metric: azure_growth_vs_capex_intensity.azure_revenue_yoy, op: "<", threshold: 20, unit: "%"}
        - {metric: azure_growth_vs_capex_intensity.capex_to_revenue, op: ">", threshold: 25, unit: "%"}
      consecutive: 2
      period: quarter
      note: Both must hold in the same quarter, for two consecutive quarters; Azure on the new basis in constant currency, capex taken as cash capex from the cash flow statement.
    data: mixed
    effective_from: FY2027Q1
    first_readable: 2026-10
    baseline:
      value: 42
      unit: "%"
      period: FY2026Q4 (June quarter, new basis, constant currency)
      as_of: 2026-06-30
      source: MSFT-RPT1-2026-09-17#p11
      note: "June-quarter Azure revenue of $29.42 billion [src:MSFT-RPT1-2026-09-17#p11]; FY2026 full-year cash capex was 34.9% of revenue [src:MSFT-RPT1-2026-09-17#p5]."
    note: "Breaker one in section ten of the report. The second condition uses the registry's capex_to_revenue definition (xbrl), consistent with the report's “cash capex always excludes finance leases, and section ten's thresholds are written on this basis” [src:MSFT-RPT1-2026-09-17#p4]. An earlier-stage alarm is watch indicator #1, two consecutive quarters below 25% (see MSFT-Q10) [src:MSFT-RPT1-2026-09-17#p11]."

  - id: MSFT-Q6
    type: quantitative
    claim: "The capex cycle has not pushed the cash content of profit through the thesis invalidation line: in the FY2028 annual report, the conversion of free cash flow to non-GAAP net income is not below 45% [src:MSFT-RPT1-2026-09-17#p11]"
    origin: report:breaker
