  - id: MSFT-L4
    type: qualitative
    claim: 欧盟的主权框架没有把美国厂商挡在 Level 3 之外
    origin: report:breaker
    severity: breaker
    covers: [regulation, moat]
    pillar: P2
    question: "欧盟《云与 AI 发展法案》（CADA）是否已经落地（生效并开始适用），并且其 Level 3 的第三国认可通道对美国云厂商实际关闭？下列任一情形算实际关闭：（a）最终文本或实施细则使受美国《云法案》管辖的厂商在法律上无法获得认可；（b）欧盟正式决定不给予美国第三国认可，或以受美国《云法案》管辖为由正式拒绝美国厂商的认可申请（因单个厂商自身的原因被拒不算）；（c）法案落地满 12 个月，仍没有任何受美国管辖的云厂商通过这条通道获得 Level 3 认可，也没有待决的认可申请或认可决定。"
    fail_if: 是（法案已落地，且 (a)、(b)、(c) 任一成立）
    warn_if: 法案已落地，还不满足 (a)、(b)、(c)，但截至本期没有任何受美国管辖的云厂商获得 Level 3 认可（通道是否实际开放尚无证据）
    judge: independent_model
    evidence: required
    where: 欧盟官方公报中的最终法律文本与实施细则、欧盟委员会的认可决定与申请状态、微软 10-K/10-Q 的风险因素与监管一节
    lookback: 4
    effective_from: FY2027Q1
    first_readable: 2027-01
    baseline:
      value: 欧盟委员会 2026-06-03 提出《云与 AI 发展法案》，设四级主权框架，最高一级按字面会排除受美国《云法案》管辖的厂商；委员会说 Level 3 有第三国认可通道，产业界说第 18 条的标准今天没有任何主要技术国家能满足
      source: MSFT-RPT1-2026-09-17#p6
    note: "报告第十节破坏信号八，对应主权分裂这条侵蚀路径；报告给的信号是 Level 3 的认可通道对美国厂商是否实际开放，2027–2029 年陆续可读 [src:MSFT-RPT1-2026-09-17#p6]。“实际关闭”的三种情形是本档案事先写下的读法：(a)、(b) 是法律上的关闭，(c) 是事实上的关闭——产业界说第 18 条的标准今天没有任何主要技术国家能满足，通道可能只在纸面上存在 [src:MSFT-RPT1-2026-09-17#p6]。(c) 的期限与 warn_if 这一级都不是报告写的，待本人确认（见 todo）。first_readable 取报告 2027–2029 年可读窗口的起点。量级：Level 4（国防）按《金融时报》口径约占公共采购市场的 1%（二手），真正的战场是 Level 3 [src:MSFT-RPT1-2026-09-17#p6]。"

  - id: MSFT-L5
    type: qualitative
    claim: 最大客户 OpenAI 的增量采购承诺没有被重组或减值
