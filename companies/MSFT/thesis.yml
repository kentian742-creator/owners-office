    note: "Breaker three in section ten of the report. Watch indicator #3's healthy range is not below 62%, and its trigger line is this breaker line [src:MSFT-RPT1-2026-09-17#p11], so it is merged into this test: below 62% is recorded as a warning. Section four of the report reads it this way: a break below 64% is the first reading in the bad direction, 62% is the second, and only two consecutive quarters below 58% is a thesis breaker [src:MSFT-RPT1-2026-09-17#p6]; that 64% directional line is only recorded in updates, with no threshold of its own [src:MSFT-RPT1-2026-09-17#p6]. This is the signal for the compute-commoditization erosion path; the other line is Azure dollar revenue, disclosed quarterly for the first time from FY27 [src:MSFT-RPT1-2026-09-17#p6]."

