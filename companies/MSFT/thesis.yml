  - id: MSFT-L2
    type: qualitative
    claim: 关键经营者和衡量他们的尺子都在：CEO 交接有安排，资本开支高位时激励里有资本回报
    origin: report:breaker
    severity: breaker
    covers: [management, governance, capital_allocation]
    pillar: P6
    question: "截至本期，是否出现以下任一情况：（a）Nadella 已离任，且公司没有披露继任安排；（b）2027 年的委托书（DEF 14A）中，高管长期激励指标里仍没有任何资本回报类指标（如投入资本回报、增量资本回报、自由现金流回报），同时最近一个完整财年（FY2027）的现金资本开支（不含融资租赁）高于 1,500 亿美元？"
    fail_if: "是（(a) 或 (b) 任一成立；(b) 中的两个条件须同时成立）"
    judge: independent_model
    evidence: required
    where: 8-K 第 5.02 项、委托书（DEF 14A）的薪酬讨论与分析、10-K 现金流量表、公司新闻稿
    lookback: 4
    judge_notes:
      - "只宣布将要离任、尚未离任的，不满足 (a)。"
      - "(b) 按 2027 年的委托书判定，(a) 随时可读；2026 年 10 月的委托书只作补充观察，不作触发。"
    effective_from: FY2027Q1
    first_readable: 2026-10
    baseline:
      value: Nadella 1992 年入职、2014 年任 CEO；FY2025 委托书的长期绩效股票指标为激励计划收入 35%、微软云收入 35%、Azure 及其他云收入 15%、三年期相对标普 500 股东总回报 15%，四项里没有资本回报项
      source: MSFT-RPT1-2026-09-17#p7
    note: "报告第十节破坏信号六。(a) 按报告原文，Nadella 已经离任而没有已披露的继任安排才算；只宣布将要离任的，在当期更新里记录 [src:MSFT-RPT1-2026-09-17#p12]。报告的理由：FY2026 约 290 亿美元的 Azure 增量花掉了 1,159 亿美元的现金资本开支，激励计划奖励的是前者而不是后者 [src:MSFT-RPT1-2026-09-17#p7]。2026 年 10 月的委托书是第一次能看到这把尺子装没装上的时点（补充观察项，不作触发）[src:MSFT-RPT1-2026-09-17#p11]。报告没有写 1,500 亿美元对应哪个期间，这里按委托书发布时最近一个完整财年（FY2027）的现金资本开支判定，口径与第十节一致、不含融资租赁 [src:MSFT-RPT1-2026-09-17#p12] [src:MSFT-RPT1-2026-09-17#p4]；这个读法待本人确认（见 todo）。"

