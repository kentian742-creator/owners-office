  - tag: STRIPE-NEWS-2025-09-29
    kind: press_release
    title: "Stripe press release: powering Instant Checkout in ChatGPT and releasing the Agentic Commerce Protocol co-developed with OpenAI"
    date: 2025-09-29
    url: https://stripe.com/newsroom/news/stripe-openai-instant-checkout
    primary: true
    note: "Original English title: Stripe powers Instant Checkout in ChatGPT and releases Agentic Commerce Protocol co-developed with OpenAI; primary from the publisher, read on 2026-09-25. ChatGPT users in the US can buy from Etsy sellers within a conversation (with Shopify merchants joining later), and the protocol is an open standard. OpenAI's own page returned 403 to this environment and could not be read."

