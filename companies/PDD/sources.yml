# PDD source tag table (public)
# Locator conventions: PDD-RPT1-2026-09-16#pN = page N of the report PDF (matching the page markers in inputs/text);
#             PDD-20F-FY2025#pN = page N of the local 20-F PDF; other 20-Fs use the Item or the financial statement page (e.g. #Item5.A, #F-9),
#             6-Ks use the exhibit number (e.g. #EX-99.1); regulator documents, press releases and web pages take no locator.
# The 6-K entries were pre-registered from appendix I of the 02 report on purpose: the three from 2026 are the sources for backfilling historical data before the first reading (see todo in thesis.yml),
# and the other three are primary filings cited by the report (docs/decisions/0006). After the first fact audit (04A), the archive's citations were repointed from report pages to the originals,
# and the primary documents the audit used were registered at the end of this table: earlier 20-Fs and 6-Ks, filings by others about the company, peers' 6-Ks, earnings-call replay pages,
# regulator documents, European Commission press releases, official exchange rates and EDGAR's insider filing index.
