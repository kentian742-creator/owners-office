#             PDD-20F-FY2025#pN = 20-F 本地 PDF 第 N 页；其他 20-F 用 Item 或财务报表页码（如 #Item5.A、#F-9），
#             6-K 用附件号（如 #EX-99.1）；监管机构文件、新闻稿与网页不加定位符。
# 6-K 条目按 02 报告附录一预先登记，是有意为之：2026 年的三份是首次读数前补录历史数据的来源（见 thesis.yml 的 todo），
# 其余三份是报告引用的一手文件（docs/decisions/0006）。首次事实审计（04A）之后，档案的引用已从报告页码改指原件，
# 审计用到的一手文件一并补登在本表末尾：早年的 20-F 与 6-K、他方对本公司的申报、同业的 6-K、电话会回放页、
