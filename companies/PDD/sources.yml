  - tag: SAMR-CF-2026-22
    kind: other
    title: "State Administration for Market Regulation (SAMR) administrative penalty decision Guo Shi Jian Chu Fa [2026] No. 22, party: Shanghai Xunmeng Information Technology Co., Ltd. (in Chinese)"
    title_original: 国家市场监督管理总局行政处罚决定书-国市监处罚〔2026〕22号
    date: 2026-04-17
    url: https://www.samr.gov.cn/cms_files/filemanager/1647978232/attach/20264/290e3581cfe24f9aba1a9647631d512d.docx
    primary: true
    note: "An attachment to SAMR's announcement of 2026-04-17 (administrative penalties in the “ghost takeaway” series of cases against 7 e-commerce platforms, https://www.samr.gov.cn/xw/zj/art/2026/art_9714ee2bef9244819134ef4ffdd14017.html), read on 2026-09-25. The party is the operating entity of the Pinduoduo platform; total penalties of RMB 1,521,930,222.91 (confiscated illegal gains of RMB 5,850,222.91, fines of RMB 1,514,080,000 and RMB 2,000,000), and an order to suspend new cake stores (other than prepackaged) for 9 months; the decision records that during the investigation the party repeatedly refused without good reason to provide materials and information, or provided false materials and information, and even used violence, soft resistance and other means to obstruct regulatory enforcement."

  - tag: EC-IP-24-5622
    kind: press_release
    title: "European Commission press release IP/24/5622: formal proceedings opened against Temu under the Digital Services Act"
    date: 2024-10-31
    url: https://ec.europa.eu/commission/presscorner/detail/en/ip_24_5622
    primary: true
    note: "Original English title: Commission opens formal proceedings against Temu under the Digital Services Act; read on 2026-09-25."

  - tag: EC-IP-26-1178
    kind: press_release
    title: "European Commission press release IP/26/1178: Temu fined €200 million under the Digital Services Act"
    date: 2026-05-28
    url: https://ec.europa.eu/commission/presscorner/detail/en/ip_26_1178
    primary: true
    note: "Original English title: Commission fines Temu €200 million for breaching the Digital Services Act; read on 2026-09-25. The non-compliance decision concerns Temu's failure to diligently identify, analyze and assess the systemic risks of illegal products on its platform; Temu must submit an action plan under Article 75 of the DSA by 2026-08-28, the European Board for Digital Services gives its opinion within one month of receiving the plan, and the Commission then takes a final decision within one month; non-compliance can bring periodic penalty payments."

