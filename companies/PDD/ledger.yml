# PDD two-way say-do ledger (thesis-ci spec §2; schema: spec/schemas/ledger.schema.json)
# At creation, the management statements that PDD-L1 judges against are registered first, together with the August 2024 statement on buybacks and dividends. All three were made on earnings calls:
# the company publishes no transcripts, and the call webcast is available as a replay on its investor relations website (source points to the replay page, not transcribed or checked in this round); the wording of all three
# is as reported by third parties and not in the filings, so they are secondary records and do not support a rating on their own. Other commitments and the system's / the owner's expectations are registered one by one from phase 1 on, as earnings events arrive.
company: PDD
entries:
  - id: PDD-M1
    side: management
    kind: other
    statement: "The platform's underlying mechanism of openness and fairness to third-party merchants will not change (Q2 2026 earnings call)"
    made_at: 2026-08-24
    due: 2026-Q3
    source: PDD-CALL-FY2026Q2
    status: pending
    note: "Earnings-call remark as reported by third parties, not in the filings [src:PDD-RPT1-2026-09-16#p13]: the report's source [24] is third-party write-ups and coverage of the call, which the report lists as secondary [src:PDD-RPT1-2026-09-16#p30]. The call was held on 2026-08-24, with the webcast and replay on the company's investor relations website [src:PDD-6K-2026-08-25#EX-99.1]; the management quotes in the same day's press release do not contain this sentence. The report records the sentence in the context of Xinpinmu competing with the third-party merchants who pay for traffic, and says it can be verified quarter by quarter, the signals being the inventory line, the self-operated gross margin and changes in the exposure given to third-party unbranded goods [src:PDD-RPT1-2026-09-16#p13]. The first check is the Q3 2026 results, then every quarter; the matching question is PDD-L1 in thesis.yml."

  - id: PDD-M2
    side: management
    kind: other
    statement: "Short-term profitability will come under pressure, and quarter-to-quarter swings in margins will become the norm (Q2 2026 earnings call)"
    made_at: 2026-08-24
    due: 2026-Q3
    source: PDD-CALL-FY2026Q2
    status: pending
    note: "Earnings-call remark as reported by third parties, not in the filings [src:PDD-RPT1-2026-09-16#p15] [src:PDD-RPT1-2026-09-16#p30]; in the same day's press release, Jun Liu says only that ecosystem investment was stepped up in the second quarter [src:PDD-6K-2026-08-25#EX-99.1]. The report lists it as the second profit warning, of August 2026, to be verified by the third-quarter results [src:PDD-RPT1-2026-09-16#p3], and considers it of the same kind as the warning of August 2024 [src:PDD-RPT1-2026-09-16#p15]; written statements on the impact on profits are in the earnings press releases of 2024-08-26 and 2026-03-25 [src:PDD-6K-2024-08-26#EX-99.1] [src:PDD-6K-2026-03-26#EX-99.1]. The matching question is PDD-L1 in thesis.yml."

  - id: PDD-M3
    side: management
    kind: buyback
    statement: "Buybacks or dividends are not appropriate now, and there is no need for them in the next few years that management can foresee (Q&A on the Q2 2024 earnings call)"
    made_at: 2024-08-26
    due: "2028"
    source: PDD-CALL-FY2024Q2
    status: pending
    note: "Earnings-call remark as reported by third parties, not in the filings: the report records the sentence from a full transcript of that day and several press reports, and lists it as secondary [src:PDD-RPT1-2026-09-16#p14] [src:PDD-RPT1-2026-09-16#p30]. The call was held on 2024-08-26, with the webcast and replay on the company's investor relations website [src:PDD-6K-2024-08-26#EX-99.1]. The dividend half has a primary statement: the 20-F says there is no present plan to pay cash dividends in the foreseeable future [src:PDD-20F-FY2025#p126]; the buyback half has none. On this basis the report considers that the returns switch will give no information before 2028, and due is registered accordingly [src:PDD-RPT1-2026-09-16#p24]; in the two years since, there have been zero buybacks and zero dividends [src:PDD-20F-FY2025#p140] [src:PDD-20F-FY2025#p157] [src:PDD-6K-2026-08-25#EX-99.1]. The first return is recorded as not kept, and at the same time triggers PDD-Q18 in thesis.yml (a positive trigger)."
