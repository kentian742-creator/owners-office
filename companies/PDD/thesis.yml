    where: 6-K 公告；20-F Item 8.A 法律程序与风险因素；市场监管总局等境内外监管机构的处罚决定书与公告
    lookback: 1
    judge_notes: 暂停商家入驻（如 2026 年 4 月处罚中暂停新蛋糕商家入驻 [src:PDD-20F-FY2025#p28]）属于类目准入限制，不计为修改流量分配或定价规则。
    effective_from: FY2026Q3
