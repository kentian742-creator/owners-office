  # ———— 报告第 09 节：每季必看的五个前瞻指标（watch）————
  - id: PDD-Q5
    type: quantitative
    claim: 定价权没有见顶：国内在线营销收入保持正增长
    origin: report:watch
    severity: watch
    covers: [pricing_power, moat]
    pillar: P2
    metric: segment_revenue_yoy
    params: {segment: Online marketing services and others, segment_zh: 在线营销服务及其他, basis: 报表口径}
    fail_if: 连续两个季度 ≤ 0%
    rule: {op: "<=", threshold: 0, unit: "%", consecutive: 2, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 3.5, unit: "%", period: 2026Q2, source: PDD-RPT1-2026-09-16#p25}
    note: "前瞻指标第 1 号。与阿里巴巴同口径客户管理收入对照读（同季剔除冲减后 +1% [src:PDD-RPT1-2026-09-16#p25]）：两家同向说明是行业性让利；只有拼多多不回升，主动让利的解释被削弱。"

  - id: PDD-Q6
    type: quantitative
    claim: 让利是阶段性投入，而不是新的常态成本结构
    origin: report:watch
    severity: watch
    covers: [pricing_power, unit_economics]
    pillar: P2
    metric_def:
      id: operating_margin_ttm
      description: 营业利润率，过去四个季度营业利润合计 ÷ 收入合计；若损益表重新出现「商品销售」一行，按平台业务单独读（剔除商品销售收入及其成本）
      unit: "%"
      frequency: quarter
      data: filing_text
      formula: sum(operating_profit, 4q) / sum(revenue, 4q)
      where: 季度 6-K 附件 99.1 的未经审计合并损益表，逐季相加
    fail_if: 连续两个季度 < 18%
    rule: {op: "<", threshold: 18, unit: "%", consecutive: 2, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 22.2, unit: "%", period: TTM 至 2026Q2, source: PDD-RPT1-2026-09-16#p25}
    note: 前瞻指标第 2 号；指标表的当前值为 TTM，故按 TTM 读。各季数字取公司自己在业绩 6-K（或 20-F）中列示的数字，同比的上年数取本期文件列示的比较数，与经审计的 20-F 不一致时照用公司数字并在读数说明里记下差额（例如 2025 年四季度营业利润的业绩公告数字未含 2026 年 4 月的罚款，见 F9）。operating_margin_ttm 另被 PDD-Q13 引用（照录于其 metric_def.components），两处定义须同步修改。

  - id: PDD-Q7
    type: quantitative
    claim: 商家浮存（公司停止披露 GMV 后交易额的公开代理）没有收缩
    origin: report:watch
    severity: watch
    covers: [moat, returns_on_capital]
    pillar: P1
    metric_def:
      id: merchant_float
      description: 商家浮存 = 应付商家 + 商家保证金（季末余额）
      unit: 亿元
      frequency: quarter
      data: filing_text
      formula: payable_to_merchants + merchant_deposits
      where: 季度 6-K 附件 99.1 的未经审计合并资产负债表（Payable to merchants、Merchant deposits）
    fail_if: 连续两个季度同比下降
    rule: {op: decrease, threshold: 0, unit: "%", consecutive: 2, period: quarter, note: 对上年同期季末余额的同比变化}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 1285, unit: 亿元, as_of: 2026-06-30, source: PDD-RPT1-2026-09-16#p25}
    note: 前瞻指标第 3 号。下降有两种读法：交易额萎缩，或账期、保证金规则被监管拉平；两者都要同时查当期是否有新规。同比需要上年同期季末余额，补录清单见 todo。

  - id: PDD-Q8
    type: quantitative
    claim: 自营投入的节奏与资本密集度可控，重资产没有吃掉平台的利润率
    origin: report:watch
    severity: watch
    covers: [capital_allocation, returns_on_capital]
    pillar: P5
    metric_def:
      id: ppe_plus_inventory
      description: 物业设备及软件净值 + 存货（如出现）；自营品牌投入节奏与资本密集度的读数
      unit: 亿元
      frequency: quarter
      data: filing_text
      formula: ppe_and_software_net + inventory
      where: 季度 6-K 附件 99.1 的未经审计合并资产负债表
      components:
        platform_op_margin_ttm_yoy_pp:
          description: 平台业务营业利润率（过去四个季度营业利润合计 ÷ 收入合计）的同比变化，即本季末的 TTM 值减去上年同季末的 TTM 值，单位为百分点；损益表出现「商品销售」一行时剔除商品销售收入及其成本（经营费用无法拆分时全部计入平台口径），未出现时即合并口径
          unit: pp
          where: 季度 6-K 附件 99.1 的未经审计合并损益表，逐季相加
    fail_if: 合计 > 500 亿元而平台业务营业利润率未同步改善（与上年同季末的 TTM 值相比）
    rule:
      all_of:
        - {metric: ppe_plus_inventory, op: ">", threshold: 500, unit: 亿元, period: quarter}
        - {metric: ppe_plus_inventory.platform_op_margin_ttm_yoy_pp, op: "<=", threshold: 0, unit: pp, period: quarter, note: 未同步改善即平台业务 TTM 营业利润率不高于上年同季末}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 47.5, unit: 亿元, as_of: 2026-06-30, source: PDD-RPT1-2026-09-16#p26, note: 尚无存货科目}
    note: 前瞻指标第 4 号。存货科目是否出现，是新拼姆属于自营还是外贸综服模块的第一个判据。报告未写明「未同步改善」的比较基期，登记时定为同比（平台业务 TTM 营业利润率对上年同季末），如需改动须在对应季度的业绩公告发布之前合并。各季数字取公司自己在业绩 6-K（或 20-F）中列示的数字，同比的上年数取本期文件列示的比较数，与经审计的 20-F 不一致时照用公司数字并在读数说明里记下差额（例如 2025 年四季度营业利润的业绩公告数字未含 2026 年 4 月的罚款，见 F9）。ppe_plus_inventory 另被 PDD-Q13 引用（照录于其 metric_def.components），两处定义须同步修改。

  - id: PDD-Q9
    type: quantitative
    claim: 报表可读：营业外项目不会淹没经营利润
    origin: report:watch
    severity: watch
    covers: [governance]
    pillar: P4
    metric_def:
      id: nonop_total_to_op
      description: 营业外三项合计（利息与投资净收益 + 汇兑损益 + 其他收入／损失净额）的绝对值 ÷ 当季营业利润
      unit: "%"
      frequency: quarter
      data: filing_text
      formula: abs(interest_and_investment_income + fx_gain_loss + other_income_net) / operating_profit_q
      where: 季度 6-K 附件 99.1 的未经审计合并损益表与附注
    fail_if: 单季营业外三项合计的绝对值 > 当季营业利润的 50%
    rule: {op: ">", threshold: 50, unit: "%", consecutive: 1, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: null, unit: "%", period: 2026Q2, source: PDD-RPT1-2026-09-16#p26, note: "登记时算不出本指标的单季比例。报告指标表的当前值是 2026 年上半年三项合计 +27.40 亿元，是带符号的半年金额，不是本指标的读数 [src:PDD-RPT1-2026-09-16#p26]。上半年利息与投资净收益 +128.73 亿元、汇兑损失 −7.03 亿元、其他收入／损失净额 −94.30 亿元，二季度单季利息与投资净收益 +135.05 亿元、其他收入／损失净额约 −73.99 亿元，单季汇兑与单季营业利润金额报告未给出 [src:PDD-RPT1-2026-09-16#p8]"}
    note: "前瞻指标第 5 号的第一个分支；「连续两年不披露构成」的分支见 PDD-L8，两条任一失败即第 5 号指标触发。同时观察 2 亿欧元 DSA 罚款是否在其中落地 [src:PDD-RPT1-2026-09-16#p26]。营业外的大额损失消耗现金，本条也与支柱 P3 相关。"

  - id: PDD-L8
    type: qualitative
    claim: 报表可读：「其他收入／损失净额」的构成有披露
    origin: report:watch
    severity: watch
    covers: [governance]
    pillar: P4
    question: 本期年报（20-F）是否披露了「其他收入／损失净额」（Other income, net）的构成，即主要项目及其金额？
    fail_if: 否，且上一财年的年报同样未披露（即连续两年不披露构成）
    judge: independent_model
    evidence: required
    where: 本期与上一财年 20-F 的合并损益表、财务报表附注与 Item 5 经营回顾；季度 6-K 中的相关说明作参考
    lookback: 5
    effective_from: FY2026Q3
    first_readable: 2027-04
    baseline: {value: FY2025 20-F 的经营回顾只列其他收入净额的金额，未说明构成, source: PDD-20F-FY2025#p105, note: "2026 年上半年该科目为 −94.30 亿元，公司只归因为海外非经营项目 [src:PDD-RPT1-2026-09-16#p8]"}
    note: 前瞻指标第 5 号的第二个分支（原为 PDD-Q9 的事件条件，改为定性测试以便独立判定并附出处）。PDD-Q16（论点破坏者第 10 条）的「仍不披露构成」一腿取本条对当年年报的判定。

  # ———— 报告第 09 节：论点破坏者（breaker；触发即论点作废，进入 7 天内的结论流程）————
  - id: PDD-Q10
    type: quantitative
    claim: 国内变现能力没有被市场夺走
    origin: report:breaker
    severity: breaker
    covers: [pricing_power, moat, competition]
    pillar: P2
    metric: segment_revenue_yoy
    params: {segment: Online marketing services and others, segment_zh: 在线营销服务及其他, basis: 报表口径}
    fail_if: 在线营销服务收入连续四个季度同比为负
    rule: {op: "<", threshold: 0, unit: "%", consecutive: 4, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 3.5, unit: "%", period: 2026Q2, source: PDD-RPT1-2026-09-16#p25}
    note: 论点破坏者第 1 条。

  - id: PDD-Q11
    type: quantitative
    claim: 营业利润率守在论点所依赖的盈利水平之上
    origin: report:breaker
    severity: breaker
    covers: [unit_economics, pricing_power]
    pillar: P2
    metric_def:
      id: operating_margin_6k
      description: 单季营业利润率（营业利润 ÷ 收入）；外国私人发行人季度口径。若损益表出现「商品销售」一行，以平台业务口径判定（剔除商品销售收入及其成本，与 PDD-Q6 相同），合并口径并列
      unit: "%"
      frequency: quarter
      data: filing_text
      formula: operating_profit_q / revenue_q
      where: 季度 6-K 附件 99.1 的未经审计合并损益表
    fail_if: 营业利润率连续四个季度低于 15%
    rule: {op: "<", threshold: 15, unit: "%", consecutive: 4, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 24.7, unit: "%", period: 2026Q2, source: PDD-RPT1-2026-09-16#p19}
    note: "论点破坏者第 2 条。报告未写明单季还是 TTM，登记时定为单季读：四个季度单季都低于 15% 时，第 08 节估值起点所用的 TTM 营业利润率必然也低于 15%，满足「起点作废」，且比按 TTM 连续四个季度读更早触发 [src:PDD-RPT1-2026-09-16#p26]；TTM 口径的提前警告由 PDD-Q6 承担。若「商品销售」一行出现，以平台业务口径判定：报告提醒自营若按总额法确认会把合并利润率压低，期权的成功不能被误读成论点作废 [src:PDD-RPT1-2026-09-16#p25]。这两处读法如需改动，须在对应季度的业绩公告发布之前合并。各季数字取公司自己在业绩 6-K（或 20-F）中列示的数字，同比的上年数取本期文件列示的比较数，与经审计的 20-F 不一致时照用公司数字并在读数说明里记下差额（例如 2025 年四季度营业利润的业绩公告数字未含 2026 年 4 月的罚款，见 F9）。"

  - id: PDD-Q12
    type: quantitative
    claim: 负投入资本的引擎没有反向运转
    origin: report:breaker
    severity: breaker
    covers: [moat, returns_on_capital]
    pillar: P1
    metric_def:
      id: merchant_float
      description: 商家浮存 = 应付商家 + 商家保证金（季末余额）
      unit: 亿元
      frequency: quarter
      data: filing_text
      formula: payable_to_merchants + merchant_deposits
      where: 季度 6-K 附件 99.1 的未经审计合并资产负债表（Payable to merchants、Merchant deposits）
    fail_if: 商家浮存连续四个季度同比下降
    rule: {op: decrease, threshold: 0, unit: "%", consecutive: 4, period: quarter, note: 对上年同期季末余额的同比变化}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 1285, unit: 亿元, as_of: 2026-06-30, source: PDD-RPT1-2026-09-16#p25}
    note: 论点破坏者第 3 条；与 PDD-Q7 同一指标，门槛更严。metric_def 与 PDD-Q7 逐字相同，改动须两处同步。

  - id: PDD-Q13
    type: quantitative
    claim: 现金没有被大额收购或低回报的自营重资产消耗
    origin: report:breaker
    severity: breaker
    covers: [capital_allocation, returns_on_capital]
    pillar: P5
    metric_def:
      id: cash_acquisition_amount
      description: 公司宣布的现金收购金额（单笔，或一年内累计）；外币以公司披露的人民币金额为准，未披露时按宣布日中国人民银行公布的人民币汇率中间价折算
      unit: 亿元
      frequency: event
      data: filing_text
      where: 6-K 公告、20-F Item 4 与 Item 5、现金流量表投资活动
      components:
        acquisition_amount:
          description: 公司宣布的单笔收购的对价总额，不论以现金、股份还是混合方式支付；外币折算规则同 cash_acquisition_amount
          unit: 亿元
          where: 6-K 公告、20-F Item 4 与 Item 5
        ppe_plus_inventory:
          description: 物业设备及软件净值 + 存货（如出现）；自营品牌投入节奏与资本密集度的读数
          unit: 亿元
          where: 季度 6-K 附件 99.1 的未经审计合并资产负债表
        operating_margin_ttm:
          description: 营业利润率，过去四个季度营业利润合计 ÷ 收入合计；若损益表重新出现「商品销售」一行，按平台业务单独读（剔除商品销售收入及其成本）
          unit: "%"
          where: 季度 6-K 附件 99.1 的未经审计合并损益表，逐季相加
    fail_if: 公司宣布单笔或一年内累计超过 1,500 亿元人民币的现金收购，或自营品牌相关的存货＋物业设备合计超过 1,000 亿元而平台业务营业利润率未回到 20% 以上
    rule:
      any_of:
        - {metric: cash_acquisition_amount, op: ">", threshold: 1500, unit: 亿元, period: event, note: 单笔或一年内累计}
        - all_of:
            - {metric: cash_acquisition_amount.ppe_plus_inventory, op: ">", threshold: 1000, unit: 亿元, period: quarter, note: 公司不做分部披露，以合并口径的存货加物业设备代读}
            - {metric: cash_acquisition_amount.operating_margin_ttm, op: "<", threshold: 20, unit: "%", period: quarter, note: 按平台业务单独读}
    warn_if: 单笔超过 500 亿元人民币的收购，不论支付方式（报告列为现金可得性的反向信号）
    warn_rule: {metric: cash_acquisition_amount.acquisition_amount, op: ">", threshold: 500, unit: 亿元, period: event, note: 单笔，按对价总额}
    data: filing_text
    effective_from: FY2026Q3
    baseline: {value: 上市以来无重大并购, source: PDD-RPT1-2026-09-16#p3}
    note: "论点破坏者第 4 条。警告门槛取自第 09 节正面破坏者一段的反向信号，报告写的是「收购」而不限现金，故警告按对价总额读；破坏者的现金收购一腿按报告原文限于现金 [src:PDD-RPT1-2026-09-16#p26]。报告提醒，利润率判据必须按平台业务单独读，否则自营期权的成功会被误读成论点作废 [src:PDD-RPT1-2026-09-16#p25]。规则引用的 ppe_plus_inventory、operating_margin_ttm 在 metric_def.components 中照录 PDD-Q8、PDD-Q6 的定义，改动须同步。大额收购与重资产消耗的都是现金，本条也守护支柱 P3。"

  - id: PDD-L2
    type: qualitative
    claim: 审计检查不再中断，ADS 不面临《外国公司问责法》下的交易禁令
    origin: report:breaker
    severity: breaker
    covers: [regulation, governance]
    pillar: P4
    question: 本期文件是否披露：PCAOB 重新认定无法完整检查或调查中国内地或香港的会计师事务所，且公司已连续两年被 SEC 列为 Commission-Identified Issuer？
    fail_if: 是
    judge: independent_model
    evidence: required
    where: 20-F Item 3.D 风险因素与 Item 16I；6-K 公告；SEC 的 Commission-Identified Issuer 名单
    lookback: 1
    effective_from: FY2026Q3
    baseline: {value: PCAOB 已于 2022-12-15 撤销此前的认定，截至 20-F 日期没有新认定；公司预计提交 FY2025 20-F 后不会被列为 Commission-Identified Issuer（2022 年 5 月曾被列入）, source: PDD-20F-FY2025#p12}
    note: 论点破坏者第 5 条。

  - id: PDD-L3
    type: qualitative
    claim: VIE 合约安排保持有效，外部股东对境内经营实体的经济权益没有被切断
    origin: report:breaker
    severity: breaker
    covers: [regulation, governance]
    pillar: P4
    question: 本期文件或监管公告是否披露：中国监管机构认定公司的 VIE 合约安排无效，或要求拆除该结构？
    fail_if: 是
    judge: independent_model
    evidence: required
    where: 20-F Item 3 与 Item 4.C（VIE 结构与风险因素）；6-K 公告
    lookback: 1
    effective_from: FY2026Q3
    baseline: {value: 合约安排的合法性与可执行性整体上尚未经中国法院检验, source: PDD-20F-FY2025#p9, note: "VIE 及其子公司贡献 2025 年总收入的 13.1% [src:PDD-20F-FY2025#p8]"}
    note: 论点破坏者第 6 条。

  - id: PDD-Q14
    type: quantitative
    claim: 与监管的冲突停留在可以从利润里付掉的罚单层面
    origin: report:breaker
    severity: breaker
    covers: [regulation, management]
    pillar: P4
    metric_def:
      id: regulatory_fines_to_prior_op
      description: 一个财年内截至判定日累计、因价格行为、平台规则、食品安全或反垄断被处罚没的金额合计 ÷ 上一财年营业利润。罚没含罚款与没收违法所得，也含境外监管机构的罚款（欧盟《数字服务法》下的罚款按平台规则计入），与报告读数的算法一致；外币金额以公司文件披露的人民币金额为准，未披露时按处罚决定日中国人民银行公布的人民币汇率中间价折算；分母取上一财年 20-F 合并损益表的营业利润
      unit: "%"
      frequency: event
      data: mixed
      formula: sum(fines_fiscal_year_to_date) / operating_profit_{t-1y}
      where: 监管机构处罚公告；6-K 公告；20-F Item 8.A 法律程序；上一财年营业利润取 20-F 合并损益表
      components:
        fines_fiscal_year_to_date:
          description: 一个财年内截至判定日累计的罚没金额合计，口径与外币折算规则见上
          unit: 亿元
          where: 监管机构处罚公告；6-K 公告；20-F Item 8.A 法律程序
        operating_profit_prior_year:
          description: 上一财年营业利润（公式中的 operating_profit_{t-1y}）
          unit: 亿元
          where: 上一财年 20-F 合并损益表
    fail_if: 一个财年内因价格行为、平台规则、食品安全或反垄断被处以超过上一年度营业利润 5% 的罚款
    rule: {op: ">", threshold: 5, unit: "%", period: event, note: 财年内累计，每出现一笔新处罚即重算}
    data: mixed
    effective_from: FY2026Q3
    baseline: {value: 3.3, unit: "%", period: 2026 年 4–5 月, source: PDD-RPT1-2026-09-16#p26, note: "境内罚没 15.22 亿元与欧盟 DSA 约 16 亿元，合计约 31 亿元 [src:PDD-RPT1-2026-09-16#p22]；已达触发线的三分之二 [src:PDD-RPT1-2026-09-16#p26]；报告的欧元折算按约 7.9 元／欧元，仅作量级参考 [src:PDD-RPT1-2026-09-16#p30]，首次判定时按 metric_def 的折算规则重算"}
    note: "论点破坏者第 7 条的第一个分支；「被责令修改流量分配与定价规则」的分支见 PDD-L6，两条任一失败即第 7 条触发。报告称本条已有实测读数。口径（罚没与境外罚款都计入、外币折算、按财年累计并在每笔新处罚后重算）在登记时写下，如需改动须在下一笔处罚公布之前合并。罚没消耗现金，本条也与支柱 P3 相关。"

  - id: PDD-L6
    type: qualitative
    claim: 与监管的冲突没有伤及流量分配与定价规则
    origin: report:breaker
    severity: breaker
    covers: [regulation, pricing_power]
    pillar: P4
    question: 本期文件或监管公告是否披露：监管机构因价格行为、平台规则、食品安全或反垄断，以处罚决定、责令改正或整改要求的形式，责令公司修改其流量分配规则或定价规则？只计针对本公司的要求；对全行业生效的新规不算，除非监管机构据此向本公司单独下达整改要求。
    fail_if: 是
    judge: independent_model
    evidence: required
    where: 6-K 公告；20-F Item 8.A 法律程序与风险因素；市场监管总局等境内外监管机构的处罚决定书与公告
    lookback: 1
    judge_notes: 暂停商家入驻（如 2026 年 4 月处罚中暂停新蛋糕商家入驻）属于类目准入限制，不计为修改流量分配或定价规则。
    effective_from: FY2026Q3
    baseline: {value: 2026 年 4 月的处罚为罚款约 15 亿元，并暂停新蛋糕商家（预包装蛋糕除外）入驻九个月, source: PDD-20F-FY2025#p28, note: "报告只以罚单金额读第 7 条，没有认定这一分支已经触发 [src:PDD-RPT1-2026-09-16#p26]"}
    note: 论点破坏者第 7 条的第二个分支（原为 PDD-Q14 的事件条件，改为定性测试以便独立判定并附出处），与 PDD-Q14 任一失败即第 7 条触发。

  - id: PDD-Q15
    type: quantitative
    claim: 两位自 2021 年以来股数未动的大股东没有开始离场
    origin: report:breaker
    severity: breaker
    covers: [governance, management]
    pillar: P4
    metric_def:
      id: major_holder_shares
      description: 黄峥关联实体、腾讯关联实体的实益持股数（两组分别读）
      unit: 股
      frequency: year
      data: filing_text
      where: 腾讯一组以腾讯提交的 Schedule 13D/A 修订为主要数据源（20-F 受益所有权表对腾讯照录其 13D/A）；黄峥一组以 20-F Item 6.E／Item 7.A 受益所有权表为主，并查 Schedule 13D／13G 修订
    params: {holders: [Entities affiliated with Zheng Huang, Entities affiliated with Tencent]}
    fail_if: 黄峥或腾讯关联实体的持股在任一年度减少超过 20%
    rule: {op: decrease, threshold: 20, unit: "%", consecutive: 1, period: year, note: 对 params.holders 中每一组分别计算同比降幅，任一组触发即失败}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2027-04
    baseline: {value: [1409744080, 783468116], unit: 股, as_of: 2026-03-18, source: PDD-20F-FY2025#p121, note: "报告称两组自 2021 年以来股数未变 [src:PDD-RPT1-2026-09-16#p15]；但 20-F 对腾讯一组照录 2021-03-24 的 Schedule 13D/A [src:PDD-20F-FY2025#p122]，腾讯的「未变」部分是申报口径的结果；2026-09-24 查 EDGAR 本公司申报索引（含以本公司为标的的他人申报，筛选表格名含 13D 的申报），腾讯 2021-03-24 那份 13D/A（0000950103-21-004487）之后没有新的 13D 修订 [src:PDD-WEB-2026-09-24-2]。黄峥另为 Quantum Dot（由 Qubit Partners 全资持有）的唯一董事 [src:PDD-20F-FY2025#p122]，该部分不在本条口径内"}
    note: 论点破坏者第 8 条。只读年度 20-F 可能漏掉腾讯的变化：13D/A 修订随时可能出现，出现即读，与一年前的读数比较。

  - id: PDD-L4
    type: qualitative
    claim: Temu 在美国与欧盟的经营不被监管切断
    origin: report:breaker
    severity: breaker
    covers: [regulation, growth]
    pillar: P5
    question: 本期文件或监管公告是否披露：Temu 在美国或欧盟任一市场被禁止运营、被要求本地化持股，或欧盟委员会否决其 DSA 整改方案并启动按期罚款？
    fail_if: 是
    judge: independent_model
    evidence: required
    where: 6-K 公告；20-F 风险因素与法律程序；欧盟委员会就 Temu《数字服务法》案件（正式程序 2024-10-31 启动）发布的新闻稿与决定；美国政府针对 Temu 的禁令或本地化持股要求的官方文件。后两类在公司文件之外，判定时作为附加输入提供，首次引用时登记进 sources.yml
    lookback: 1
    effective_from: FY2026Q3
    baseline: {value: 欧盟委员会 2026-05-28 依《数字服务法》对 Temu 罚款，整改方案须于 2026-08-28 前提交, source: PDD-RPT1-2026-09-16#p11, note: "罚款金额为 2 亿欧元 [src:PDD-RPT1-2026-09-16#p11]"}
    note: 论点破坏者第 9 条；报告预计 DSA 最终决定在 2026 年末前后。

  - id: PDD-Q16
    type: quantitative
    claim: 其他收入／损失不会长期大到让利润失去可解释性
    origin: report:breaker
    severity: breaker
    covers: [governance]
    pillar: P4
    metric_def:
      id: other_income_to_op_year
      description: 其他收入／损失净额（Other income, net）的绝对值 ÷ 当年营业利润
      unit: "%"
      frequency: year
      data: filing_text
      formula: abs(other_income_net) / operating_profit
      where: 20-F 合并损益表与附注；季度 6-K 用于中期跟踪
    fail_if: 连续两个财年「其他收入／损失净额」的绝对值超过当年营业利润的 20%，且公司仍不披露其构成
    rule:
      all_of:
        - {metric: other_income_to_op_year, op: ">", threshold: 20, unit: "%", consecutive: 2, period: year}
        - {op: event, threshold: 当年年报仍未披露其他收入／损失净额的构成（取 PDD-L8 对当年年报的判定）, period: year}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2027-04
    baseline: {value: [5.0, 2.9, 2.9], unit: "%", period: FY2023–FY2025, source: PDD-20F-FY2025#p103, note: "其他收入净额的绝对值 ÷ 当年营业利润（本档案计算）[src:PDD-20F-FY2025#p103]；FY2025 为 2,726,933 千元对 93,102,131 千元 [src:PDD-20F-FY2025#p103]。2026 年上半年该科目为 −94.30 亿元，公司只归因为海外非经营项目 [src:PDD-RPT1-2026-09-16#p8]"}
    note: 论点破坏者第 10 条。两腿须同时成立；事件腿由 PDD-L8 的独立判定提供，须附出处与原文摘录。未解释的大额损失消耗现金，本条也与支柱 P3 相关。

  - id: PDD-L5
    type: qualitative
    claim: 排序权不外移：购物代理兴起时，拼多多的商品目录仍在主流协议之内
    origin: report:breaker
    severity: breaker
    covers: [moat, competition]
    pillar: P2
    question: 微信、淘宝、抖音三个国内入口中，是否已有任一入口接入代理购物协议；若有，拼多多的商品目录是否不能经该协议被读取（被排除或自我封闭），而淘宝／天猫、京东、抖音电商中至少一家的目录可以被读取？三个入口都还没有接入任何代理购物协议时，答「否」。
    fail_if: 是（判据是协议接入名单）
    judge: independent_model
    evidence: required
    where: 三个入口官方发布的代理购物协议接入公告，以及所接入协议公开的商户／平台接入名单；公司公告与 6-K。此项证据多在公司文件之外，首次引用时登记进 sources.yml
    lookback: 1
    effective_from: FY2026Q3
    baseline: {value: 海外代理商务协议已上线，发现与比价已进入代理、交易执行尚未, source: PDD-RPT1-2026-09-16#p13, note: "报告预计国内入口的接入在 2027–2028 年可读 [src:PDD-RPT1-2026-09-16#p27]"}
    note: 论点破坏者第 11 条，即排序权外移的第一步。报告写作「微信、淘宝、抖音等」；本条登记时把入口封闭为这三个，把同业定为淘宝／天猫、京东、抖音电商（报告第 07 节的同业加内容电商），改动须在判定之前写下。

  - id: PDD-Q17
    type: quantitative
    claim: 新拼姆若确为自营，其存货不会以大额减值收场
    origin: report:breaker
    severity: breaker
    covers: [capital_allocation, management]
    pillar: P5
    metric_def:
      id: selfop_inventory_impairment
      description: 新拼姆自营相关存货的累计减值
      unit: 亿元
      frequency: year
      data: filing_text
      where: 20-F 存货附注与合并损益表；6-K 公告
    fail_if: 新拼姆三年验收（2028 年报）时，自营相关存货减值超过首期注资 150 亿元的一半
    rule: {metric: selfop_inventory_impairment, op: ">", threshold: 75, unit: 亿元, period: year, evaluate_on: [FY2027], note: "首期注资 150 亿元 [src:PDD-RPT1-2026-09-16#p5] 的一半"}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2028-04
    baseline: {value: null, unit: 亿元, as_of: 2026-06-30, source: PDD-RPT1-2026-09-16#p26, note: "2026-06-30 资产负债表尚无存货科目，本指标尚无读数 [src:PDD-RPT1-2026-09-16#p26]；门槛所依的首期现金出资为 150 亿元，三年计划投入 1,000 亿元 [src:PDD-RPT1-2026-09-16#p5]"}
    note: "论点破坏者第 12 条的第一个分支；「无声退出」的分支见 PDD-L7，两条任一失败即第 12 条触发。「2028 年报」登记时读作 2028 年 4 月前后发布的 FY2027 20-F：报告的时间轴把它排在 2027-04 的年报与 2028-07 之间 [src:PDD-RPT1-2026-09-16#p3]，并按发布时间称呼年报（如「2027 年 4 月的年报」）[src:PDD-RPT1-2026-09-16#p25]。新拼姆是自营还是外贸综服模块尚无法区分 [src:PDD-RPT1-2026-09-16#p6]；若始终没有存货科目，本条无读数。"

  - id: PDD-L7
    type: qualitative
    claim: 新拼姆若确为自营，不会像 2021 年的「商品销售」一样无声退出
    origin: report:breaker
    severity: breaker
    covers: [capital_allocation, management]
    pillar: P5
    question: 本期 20-F 或 6-K 是否显示新拼姆的自营业务已经停止（例如损益表的「商品销售」一行或资产负债表的存货科目在出现后消失，或业务被关停、改为纯服务模块），而公司在文件中没有解释原因？新拼姆从未以自营方式运营（从未出现存货科目或商品销售收入）时，答「否」。
    fail_if: 是
    judge: independent_model
    evidence: required
    where: 三年验收时点的 20-F（登记时读作 2028 年 4 月前后发布的 FY2027 20-F，理由见 PDD-Q17）及此前的 6-K；合并损益表、资产负债表与业务概览
    lookback: 6
    effective_from: FY2026Q3
    first_readable: 2028-04
    baseline: {value: 2026-06-30 资产负债表尚无存货科目，新拼姆是自营还是外贸综服模块尚无法区分, source: PDD-RPT1-2026-09-16#p6}
    note: "论点破坏者第 12 条的第二个分支（原为 PDD-Q17 的事件条件，改为定性测试以便独立判定并附出处），与 PDD-Q17 任一失败即第 12 条触发。先例：2021 年的商品销售为 72.5 亿元，2022 年归零，公司从未解释 [src:PDD-RPT1-2026-09-16#p5]。"

  # ———— 报告第 09 节：唯一的正面破坏者（向上改结论）————
  - id: PDD-Q18
    type: quantitative
    claim: 股东返还仍为零，现行结论以现金不能全额到达股东为前提；出现首笔返还即推翻这一前提，论点须上修
    origin: report:breaker
    severity: breaker
    covers: [capital_allocation, management]
    pillar: P3
    metric_def:
      id: shareholder_return_quarter
      description: 季度融资活动现金流中的股东返还（普通股或 ADS 回购 + 现金分红）；不含可转债的偿还或回购（现金流量表 Repayment or repurchase of convertible bonds 一行不算）
      unit: 元
      frequency: quarter
      data: filing_text
      formula: share_repurchases + dividends_paid
      where: 季度 6-K 附件 99.1 的现金流数据（融资活动）；年度用 20-F 合并现金流量表核对
    fail_if: 季度融资活动现金流中出现任何非零的股东返还
    rule: {op: ">", threshold: 0, unit: 元, consecutive: 1, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 0, unit: 元, period: FY2025, source: PDD-20F-FY2025#p157, note: "FY2025 融资活动为可转债偿还 5,228,716 千元与其他 1,363 千元，无回购或分红 [src:PDD-20F-FY2025#p157]；报告称上市以来股东返还为零 [src:PDD-RPT1-2026-09-16#p3]"}
    note: "正面触发，不是恶化。报告称这是全篇唯一能在单季内把结论向上改的事件 [src:PDD-RPT1-2026-09-16#p26]。规范的 severity 只有 breaker 与 watch，这里暂用 breaker，以保留 7 天内写结论的节奏；结论方向是上修，不计入恶化统计（待 thesis-ci 规范增加正面触发的写法，见 todo）。管理层 2024 年 8 月曾表示可预见的几年内不做回购或分红（二手记录，言行账本 PDD-M3）[src:PDD-RPT1-2026-09-16#p14]。"

  # ———— 审计后补充：报告里有信号、此前没有测试盯住的两条（手工）————
  - id: PDD-Q19
    type: quantitative
    claim: Temu 的第二形态在关税重置与 DSA 之下自持：交易服务收入没有掉到个位数增长
    origin: manual
    severity: watch
    covers: [growth, competition]
    pillar: P5
    metric: segment_revenue_yoy
    params: {segment: Transaction services, segment_zh: 交易服务, basis: 报表口径}
    fail_if: 交易服务收入同比增速转为个位数（低于 10%）
    rule: {op: "<", threshold: 10, unit: "%", consecutive: 1, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 13.3, unit: "%", period: 2026Q2, source: PDD-RPT1-2026-09-16#p4, note: "2026 年上半年为 +16.6% [src:PDD-RPT1-2026-09-16#p4]；二季度含关税前的抢运，无法剥离 [src:PDD-RPT1-2026-09-16#p11]"}
    note: "设计审计指出，支柱 P5 除总收入（PDD-Q1）与禁令破坏者（PDD-L4）外没有直接读数。判据取自报告：关税路径的信号是交易服务收入增速 [src:PDD-RPT1-2026-09-16#p13]，岔路口①的偏平庸分支是交易服务转个位数 [src:PDD-RPT1-2026-09-16#p27]。交易服务里装着 Temu 的履约链条，也含国内的佣金与服务费，读数不等同于 Temu [src:PDD-RPT1-2026-09-16#p4]。"

  - id: PDD-L9
    type: qualitative
    claim: 执法现场的姿态不再恶化：没有再一次「阻碍执法」的官方认定
    origin: manual
    severity: watch
    covers: [regulation, management, culture]
    pillar: P4
    question: 本期文件或监管机构公告中，是否有监管机构在正式文书（行政处罚决定书、通报或新闻稿）里认定公司或其子公司拒绝提供材料、提供虚假材料，或以其他方式阻碍监管执法？只计 2026-04-17 那份决定书之后作出的新认定。
    fail_if: 是
    judge: independent_model
    evidence: required
    where: 6-K 公告；20-F Item 8.A 法律程序与风险因素；市场监管总局等境内外监管机构的处罚决定书、通报与新闻稿
    lookback: 1
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 国市监处罚〔2026〕22 号决定书（2026-04-17）记载当事人多次无正当理由拒绝提供材料或提供虚假材料，甚至以暴力、软对抗等手段阻碍执法, source: PDD-RPT1-2026-09-16#p15}
    note: "设计审计指出，支柱 P4 与第五条永久亏损路径都依赖执法姿态不再恶化，此前没有测试盯住。报告把这份决定书里的记载当作全书最硬的一条记录 [src:PDD-RPT1-2026-09-16#p29]，把再一次「阻碍执法」的官方认定列为岔路口⑧的偏平庸分支 [src:PDD-RPT1-2026-09-16#p27]，并说明执法姿态按规则不进折现率，进论点破坏者第 7 条与「情节严重」档次的观察 [src:PDD-RPT1-2026-09-16#p22]。报告没有把它列为论点破坏者，本条因此为 watch；失败时公司经理须在结论里说明是否按破坏者处理。"

