  # ———— 报告第 09 节：每季必看的五个前瞻指标（watch）————
  - id: PDD-Q5
    type: quantitative
    claim: 定价权没有见顶：国内在线营销收入保持正增长
    origin: report:watch
    severity: watch
    covers: [pricing_power, moat]
    pillar: P2
    metric: segment_revenue_yoy
    params: {segment: Online marketing services and others, segment_zh: 在线营销服务及其他, basis: 报表口径}
    fail_if: 连续两个季度 ≤ 0%
    rule: {op: "<=", threshold: 0, unit: "%", consecutive: 2, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 3.5, unit: "%", period: FY2026Q2, source: PDD-6K-2026-08-25#EX-99.1, note: "收入附注 57,637 ÷ 55,703 − 1＝3.47%（百万元，本档案计算）[src:PDD-6K-2026-08-25#EX-99.1]"}
    note: "前瞻指标第 1 号。与阿里巴巴同口径客户管理收入对照读（同一自然季，即阿里财年 FY2027 第一季度：客户管理收入同比 −7%，剔除新业务发展计划的收入冲减后同口径 +1% [src:BABA-6K-2026-08-20#EX-99.1]）：两家同向说明是行业性让利；只有拼多多不回升，主动让利的解释被削弱。"

  - id: PDD-Q6
    type: quantitative
    claim: 让利是阶段性投入，而不是新的常态成本结构
    origin: report:watch
    severity: watch
    covers: [pricing_power, unit_economics]
    pillar: P2
    metric_def:
      id: operating_margin_ttm
      description: 营业利润率，过去四个季度营业利润合计 ÷ 收入合计；若损益表重新出现「商品销售」一行，按平台业务单独读（剔除商品销售收入及其成本）
      unit: "%"
      frequency: quarter
      data: filing_text
      formula: sum(operating_profit, 4q) / sum(revenue, 4q)
      where: 季度 6-K 附件 99.1 的未经审计合并损益表，逐季相加
    fail_if: 连续两个季度 < 18%
    rule: {op: "<", threshold: 18, unit: "%", consecutive: 2, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 21.9, unit: "%", period: TTM 至 FY2026Q2, source: PDD-20F-FY2025#p103, note: "同 F7：20-F 口径（2025Q3＋2025Q4 由 20-F 全年数减 2025 年上半年的公告数得出，含 2026 年 4 月的境内罚没，2026Q1＋2026Q2 取公告数）为 98,553.1 ÷ 450,775.7＝21.9%（百万元，本档案计算）[src:PDD-20F-FY2025#p103] [src:PDD-6K-2026-08-25#EX-99.1]；业绩公告逐季相加（2025Q4 取罚没计入之前的公告数）为 22.2% [src:PDD-6K-2026-03-26#EX-99.1]，报告指标表的当前值即此数 [src:PDD-RPT1-2026-09-16#p25]"}
    note: 前瞻指标第 2 号；指标表的当前值为 TTM，故按 TTM 读。各季数字取公司自己在业绩 6-K（或 20-F）中列示的数字，同比的上年数取本期文件列示的比较数，与经审计的 20-F 不一致时照用公司数字并在读数说明里记下差额（例如 2025 年四季度营业利润的业绩公告数字未含 2026 年 4 月的罚款，见 F9）。罚款在本条的比率里按入账财年计，不按处罚决定日：境内罚没随 20-F 计入 FY2025（本档案据差额推断，见 F9），不计入 FY2026 的任何一季；2025 年四季度只有业绩公告列示的单季数，读数按上一句的规则取公告数，并记下与 20-F 的差额 1,521,930 千元 [src:PDD-20F-FY2025#p153] [src:PDD-6K-2026-03-26#EX-99.1]。operating_margin_ttm 另被 PDD-Q13 引用（照录于其 metric_def.components），两处定义须同步修改。

  - id: PDD-Q7
    type: quantitative
    claim: 商家浮存（公司停止披露 GMV 后交易额的公开代理）没有收缩
    origin: report:watch
    severity: watch
    covers: [moat, returns_on_capital]
    pillar: P1
    metric_def:
      id: merchant_float
      description: 商家浮存 = 应付商家 + 商家保证金（季末余额）
      unit: 亿元
      frequency: quarter
      data: filing_text
      formula: payable_to_merchants + merchant_deposits
      where: 季度 6-K 附件 99.1 的未经审计合并资产负债表（Payable to merchants、Merchant deposits）
    fail_if: 连续两个季度同比下降
    rule: {op: decrease, threshold: 0, unit: "%", consecutive: 2, period: quarter, note: 对上年同期季末余额的同比变化}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 1285, unit: 亿元, as_of: 2026-06-30, source: PDD-6K-2026-08-25#EX-99.1, note: "应付商家 109,924＋商家保证金 18,545＝128,469 百万元（本档案计算）[src:PDD-6K-2026-08-25#EX-99.1]"}
    note: "前瞻指标第 3 号。公司最后一次披露 GMV 是 2021 年全年（2022-03-21 的业绩公告）[src:PDD-6K-2022-03-22#EX-99.1]，此后以商家浮存作交易额的公开代理。下降有两种读法：交易额萎缩，或账期、保证金规则被监管拉平；两者都要同时查当期是否有新规。同比需要上年同期季末余额，补录清单见 todo。"

  - id: PDD-Q8
    type: quantitative
    claim: 自营投入的节奏与资本密集度可控，重资产没有吃掉平台的利润率
    origin: report:watch
    severity: watch
    covers: [capital_allocation, returns_on_capital]
    pillar: P5
    metric_def:
      id: ppe_plus_inventory
      description: 物业设备及软件净值 + 存货（如出现）；自营品牌投入节奏与资本密集度的读数
      unit: 亿元
      frequency: quarter
      data: filing_text
      formula: ppe_and_software_net + inventory
      where: 季度 6-K 附件 99.1 的未经审计合并资产负债表
      components:
        platform_op_margin_ttm_yoy_pp:
          description: 平台业务营业利润率（过去四个季度营业利润合计 ÷ 收入合计）的同比变化，即本季末的 TTM 值减去上年同季末的 TTM 值，单位为百分点；损益表出现「商品销售」一行时剔除商品销售收入及其成本（经营费用无法拆分时全部计入平台口径），未出现时即合并口径
          unit: pp
          where: 季度 6-K 附件 99.1 的未经审计合并损益表，逐季相加
    fail_if: 合计 > 500 亿元而平台业务营业利润率未同步改善（与上年同季末的 TTM 值相比）
    rule:
      all_of:
        - {metric: ppe_plus_inventory, op: ">", threshold: 500, unit: 亿元, period: quarter}
        - {metric: ppe_plus_inventory.platform_op_margin_ttm_yoy_pp, op: "<=", threshold: 0, unit: pp, period: quarter, note: 未同步改善即平台业务 TTM 营业利润率不高于上年同季末}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 47.5, unit: 亿元, as_of: 2026-06-30, source: PDD-6K-2026-08-25#EX-99.1, note: "物业设备及软件净值 4,752 百万元，资产负债表尚无存货科目 [src:PDD-6K-2026-08-25#EX-99.1]"}
    note: 前瞻指标第 4 号。存货科目是否出现，是新拼姆属于自营还是外贸综服模块的第一个判据。报告未写明「未同步改善」的比较基期，登记时定为同比（平台业务 TTM 营业利润率对上年同季末），如需改动须在对应季度的业绩公告发布之前合并。各季数字取公司自己在业绩 6-K（或 20-F）中列示的数字，同比的上年数取本期文件列示的比较数，与经审计的 20-F 不一致时照用公司数字并在读数说明里记下差额（例如 2025 年四季度营业利润的业绩公告数字未含 2026 年 4 月的罚款，见 F9）。罚款在平台业务营业利润率里按入账财年计，不按处罚决定日：境内罚没随 20-F 计入 FY2025（本档案据差额推断，见 F9），不计入 FY2026 的任何一季。ppe_plus_inventory 另被 PDD-Q13 引用（照录于其 metric_def.components），两处定义须同步修改。

  - id: PDD-Q9
    type: quantitative
    claim: 报表可读：营业外项目不会淹没经营利润
    origin: report:watch
    severity: watch
    covers: [governance]
    pillar: P4
    metric_def:
      id: nonop_total_to_op
      description: 营业外三项合计（利息与投资净收益 + 汇兑损益 + 其他收入／损失净额）的绝对值 ÷ 当季营业利润
      unit: "%"
      frequency: quarter
      data: filing_text
      formula: abs(interest_and_investment_income + fx_gain_loss + other_income_net) / operating_profit_q
      where: 季度 6-K 附件 99.1 的未经审计合并损益表与附注
    fail_if: 单季营业外三项合计的绝对值 > 当季营业利润的 50%
    rule: {op: ">", threshold: 50, unit: "%", consecutive: 1, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 20.0, unit: "%", period: FY2026Q2, source: PDD-6K-2026-08-25#EX-99.1, note: "损益表三个月栏：利息与投资净收益 13,505、汇兑损失 (558)、其他收入／损失净额 (7,399)，合计 +5,548 百万元，为当季营业利润 27,764 百万元的 20.0%（本档案计算）[src:PDD-6K-2026-08-25#EX-99.1]；一季度（六个月栏减三个月栏）为 −632 − 145 − 2,031＝−2,808 百万元，绝对值为当季营业利润 19,566 百万元的 14.4% [src:PDD-6K-2026-08-25#EX-99.1] [src:PDD-6K-2026-05-28#EX-99.1]。二季度其他收入／损失净额 −73.99 亿元是公司直接列示的单季数 [src:PDD-6K-2026-08-25#EX-99.1]。报告指标表的当前值是 2026 年上半年三项合计 +27.40 亿元（12,873 − 703 − 9,430 百万元），是带符号的半年金额，不是本指标的读数 [src:PDD-RPT1-2026-09-16#p26] [src:PDD-6K-2026-08-25#EX-99.1]"}
    note: "前瞻指标第 5 号的第一个分支；「连续两年不披露构成」的分支见 PDD-L8，两条任一失败即第 5 号指标触发。罚款在本条按入账的季度计，不按处罚决定日；同时观察欧盟委员会 2026-05-28 的 2 亿欧元 DSA 罚款是否在其中落地 [src:EC-IP-26-1178]。营业外的大额损失消耗现金，本条也与支柱 P3 相关。"

  - id: PDD-L8
    type: qualitative
    claim: 报表可读：「其他收入／损失净额」的构成有披露
    origin: report:watch
    severity: watch
    covers: [governance]
    pillar: P4
    question: 本期年报（20-F）是否披露了「其他收入／损失净额」（Other income, net）的构成，即主要项目及其金额？
    fail_if: 否，且上一财年的年报同样未披露（即连续两年不披露构成）
    judge: independent_model
    evidence: required
    where: 本期与上一财年 20-F 的合并损益表、财务报表附注与 Item 5 经营回顾；季度 6-K 中的相关说明作参考
    lookback: 5
    effective_from: FY2026Q3
    first_readable: 2027-04
    baseline: {value: FY2025 20-F 的经营回顾只列其他收入净额的金额，未说明构成, source: PDD-20F-FY2025#p105, note: "2026 年上半年该科目为 −94.30 亿元，其中二季度 −73.99 亿元 [src:PDD-6K-2026-08-25#EX-99.1]；6-K 附件 99.1 只列金额，没有说明构成或原因 [src:PDD-6K-2026-08-25#EX-99.1]。报告称公司把它归因为海外非经营项目 [src:PDD-RPT1-2026-09-16#p8]，报告该句未注出处，申报文件未载，只见于第三方转述（仅 L2），不作基线"}
    note: 前瞻指标第 5 号的第二个分支（原为 PDD-Q9 的事件条件，改为定性测试以便独立判定并附出处）。PDD-Q16（论点破坏者第 10 条）的「仍不披露构成」一腿取本条对当年年报的判定。

  # ———— 报告第 09 节：论点破坏者（breaker；触发即论点作废，进入 7 天内的结论流程）————
