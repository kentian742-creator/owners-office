  - id: PDD-Q14
    type: quantitative
    claim: 与监管的冲突停留在可以从利润里付掉的罚单层面
    origin: report:breaker
    severity: breaker
    covers: [regulation, management]
    pillar: P4
    metric_def:
      id: regulatory_fines_to_prior_op
      description: 一个财年内截至判定日累计、因价格行为、平台规则、食品安全或反垄断被处罚没的金额合计 ÷ 上一财年营业利润。罚没含罚款与没收违法所得，也含境外监管机构的罚款（欧盟《数字服务法》下的罚款按平台规则计入），与报告读数的算法一致；外币金额以公司文件披露的人民币金额为准，未披露时按处罚决定日中国人民银行公布的人民币汇率中间价折算；分母取上一财年 20-F 合并损益表的营业利润
      unit: "%"
      frequency: event
      data: mixed
      formula: sum(fines_fiscal_year_to_date) / operating_profit_{t-1y}
      where: 监管机构处罚公告；6-K 公告；20-F Item 8.A 法律程序；上一财年营业利润取 20-F 合并损益表
      components:
        fines_fiscal_year_to_date:
          description: 一个财年内截至判定日累计的罚没金额合计，口径与外币折算规则见上
          unit: 亿元
          where: 监管机构处罚公告；6-K 公告；20-F Item 8.A 法律程序
        operating_profit_prior_year:
          description: 上一财年营业利润（公式中的 operating_profit_{t-1y}）
          unit: 亿元
          where: 上一财年 20-F 合并损益表
    fail_if: 一个财年内因价格行为、平台规则、食品安全或反垄断被处以超过上一年度营业利润 5% 的罚款
    rule: {op: ">", threshold: 5, unit: "%", period: event, note: 财年内累计，每出现一笔新处罚即重算}
    data: mixed
    effective_from: FY2026Q3
    baseline: {value: 3.3, unit: "%", period: 2026 年 4–5 月, source: SAMR-CF-2026-22, note: "按处罚决定日计入 FY2026：境内罚没合计 1,521,930,222.91 元（2026-04-17）[src:SAMR-CF-2026-22]，欧盟委员会罚款 2 亿欧元（2026-05-28）[src:EC-IP-26-1178]，按决定日的人民币汇率中间价 7.9121 元／欧元折合 15.82 亿元 [src:CFETS-CCPR-2026-05-28]；合计 31.04 亿元，除以 FY2025 20-F 的营业利润 931.02 亿元为 3.33%（本档案计算）[src:PDD-20F-FY2025#p103]，若按业绩公告的 946.24 亿元为 3.28% [src:PDD-6K-2026-03-26#EX-99.1]；已达触发线的三分之二 [src:PDD-RPT1-2026-09-16#p26]。境内一笔另有两处佐证：20-F 记为约 15 亿元 [src:PDD-20F-FY2025#p28]，也等于 20-F 与业绩公告的 2025 年一般及行政费用差额 1,521,930 千元 [src:PDD-20F-FY2025#p153] [src:PDD-6K-2026-03-26#EX-99.1]。报告的欧元折算按约 7.9 元／欧元，仅作量级参考 [src:PDD-RPT1-2026-09-16#p30]"}
    note: "论点破坏者第 7 条的第一个分支；「被责令修改流量分配与定价规则」的分支见 PDD-L6，两条任一失败即第 7 条触发。报告称本条已有实测读数 [src:PDD-RPT1-2026-09-16#p26]。口径（罚没与境外罚款都计入、外币折算、按财年累计并在每笔新处罚后重算）在登记时写下，如需改动须在下一笔处罚公布之前合并。本条按处罚决定日把罚单计入财年，不按入账年度：2026-04-17 与 2026-05-28 的两笔都计入 FY2026，分母为 FY2025 的营业利润；境内一笔在财务报表上随 20-F 计入 FY2025（本档案据差额推断，见 F9），不影响本条的计数。罚没消耗现金，本条也与支柱 P3 相关。"

  - id: PDD-L6
    type: qualitative
    claim: 与监管的冲突没有伤及流量分配与定价规则
    origin: report:breaker
    severity: breaker
    covers: [regulation, pricing_power]
    pillar: P4
    question: 本期文件或监管公告是否披露：监管机构因价格行为、平台规则、食品安全或反垄断，以处罚决定、责令改正或整改要求的形式，责令公司修改其流量分配规则或定价规则？只计针对本公司的要求；对全行业生效的新规不算，除非监管机构据此向本公司单独下达整改要求。
    fail_if: 是
