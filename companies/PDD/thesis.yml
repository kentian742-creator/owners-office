    effective_from: FY2026Q3
    baseline: {value: 欧盟委员会 2026-05-28 依《数字服务法》对 Temu 作出不合规决定并罚款，Temu 须于 2026-08-28 前提交整改方案（action plan）, source: EC-IP-26-1178, note: "罚款金额为 2 亿欧元，针对 Temu 未能尽职识别、分析和评估其平台上非法产品的系统性风险 [src:EC-IP-26-1178]。按新闻稿，欧洲数字服务委员会在收到方案后一个月内出具意见，欧委会再于一个月内作出最终决定，不遵守可被处以按期罚款 [src:EC-IP-26-1178]。按本档案的 as_of（2026-09-24），8 月 28 日的期限已过；公司 2026-08-25 的二季度业绩公告没有提到这一决定或整改方案 [src:PDD-6K-2026-08-25#EX-99.1]，提交情况与欧委会的后续决定待判定时补读"}
    note: 论点破坏者第 9 条；报告预计 DSA 最终决定在 2026 年末前后 [src:PDD-RPT1-2026-09-16#p27]。

  - id: PDD-Q16
    type: quantitative
    claim: 其他收入／损失不会长期大到让利润失去可解释性
    origin: report:breaker
    severity: breaker
    covers: [governance]
    pillar: P4
    metric_def:
      id: other_income_to_op_year
      description: 其他收入／损失净额（Other income, net）的绝对值 ÷ 当年营业利润
      unit: "%"
      frequency: year
      data: filing_text
      formula: abs(other_income_net) / operating_profit
      where: 20-F 合并损益表与附注；季度 6-K 用于中期跟踪
    fail_if: 连续两个财年「其他收入／损失净额」的绝对值超过当年营业利润的 20%，且公司仍不披露其构成
    rule:
      all_of:
        - {metric: other_income_to_op_year, op: ">", threshold: 20, unit: "%", consecutive: 2, period: year}
        - {op: event, threshold: 当年年报仍未披露其他收入／损失净额的构成（取 PDD-L8 对当年年报的判定）, period: year}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2027-04
    baseline: {value: [5.0, 2.9, 2.9], unit: "%", period: FY2023–FY2025, source: PDD-20F-FY2025#p103, note: "其他收入净额的绝对值 ÷ 当年营业利润（本档案计算）[src:PDD-20F-FY2025#p103]；FY2025 为 2,726,933 千元对 93,102,131 千元 [src:PDD-20F-FY2025#p103]。2026 年上半年该科目为 −94.30 亿元 [src:PDD-6K-2026-08-25#EX-99.1]，公司没有在业绩公告中说明构成；报告称公司把它归因为海外非经营项目 [src:PDD-RPT1-2026-09-16#p8]，这一说法申报文件未载，只见于第三方转述（仅 L2）"}
    note: 论点破坏者第 10 条。两腿须同时成立；事件腿由 PDD-L8 的独立判定提供，须附出处与原文摘录。罚款在本条的比率里按入账财年计，不按处罚决定日。未解释的大额损失消耗现金，本条也与支柱 P3 相关。

  - id: PDD-L5
    type: qualitative
    claim: 排序权不外移：购物代理兴起时，拼多多的商品目录仍在主流协议之内
    origin: report:breaker
    severity: breaker
    covers: [moat, competition]
    pillar: P2
    question: 微信、淘宝、抖音三个国内入口中，是否已有任一入口接入代理购物协议；若有，拼多多的商品目录是否不能经该协议被读取（被排除或自我封闭），而淘宝／天猫、京东、抖音电商中至少一家的目录可以被读取？三个入口都还没有接入任何代理购物协议时，答「否」。
    fail_if: 是（判据是协议接入名单）
    judge: independent_model
    evidence: required
    where: 三个入口官方发布的代理购物协议接入公告，以及所接入协议公开的商户／平台接入名单；公司公告与 6-K。此项证据多在公司文件之外，首次引用时登记进 sources.yml
    lookback: 1
    effective_from: FY2026Q3
    baseline: {value: 海外已有代理商务协议：Stripe 与 OpenAI 共同开发的开放标准 Agentic Commerce Protocol 于 2025-09-29 发布，ChatGPT 内的 Instant Checkout 同日在美国上线, source: STRIPE-NEWS-2025-09-29, note: "报告称在海外，发现与比价已进入代理、交易执行尚未 [src:PDD-RPT1-2026-09-16#p13]；这一句的出处 [27] 被报告列为二手 [src:PDD-RPT1-2026-09-16#p30]，仅 L2，未见一手数据，不作基线判据（OpenAI 自己的页面未能读取）。报告预计国内入口的接入在 2027–2028 年可读 [src:PDD-RPT1-2026-09-16#p27]"}
    note: 论点破坏者第 11 条，即排序权外移的第一步。报告写作「微信、淘宝、抖音等」；本条登记时把入口封闭为这三个，把同业定为淘宝／天猫、京东、抖音电商（报告第 07 节的同业加内容电商），改动须在判定之前写下。

  - id: PDD-Q17
    type: quantitative
    claim: 新拼姆若确为自营，其存货不会以大额减值收场
    origin: report:breaker
    severity: breaker
    covers: [capital_allocation, management]
    pillar: P5
    metric_def:
      id: selfop_inventory_impairment
      description: 新拼姆自营相关存货的累计减值
      unit: 亿元
      frequency: year
      data: filing_text
      where: 20-F 存货附注与合并损益表；6-K 公告
    fail_if: 新拼姆三年验收（2028 年报）时，自营相关存货减值超过首期注资 150 亿元的一半
    rule: {metric: selfop_inventory_impairment, op: ">", threshold: 75, unit: 亿元, period: year, evaluate_on: [FY2027], note: "首期注资 150 亿元 [src:PDD-RPT1-2026-09-16#p5] 的一半"}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2028-04
    baseline: {value: null, unit: 亿元, as_of: 2026-06-30, source: PDD-6K-2026-08-25#EX-99.1, note: "2026-06-30 资产负债表的资产方没有存货科目，本指标尚无读数 [src:PDD-6K-2026-08-25#EX-99.1]。门槛所依的首期现金出资 150 亿元与三年计划投入 1,000 亿元只见于媒体报道（据报道是公司 2026-03-25 官宣的口径），SEC 文件没有披露金额，仅 L2，未见一手数据 [src:PDD-RPT1-2026-09-16#p5]；一季报只写将投入大量资源建设自有品牌业务，没有金额 [src:PDD-6K-2026-05-28#EX-99.1]"}
    note: "论点破坏者第 12 条的第一个分支；「无声退出」的分支见 PDD-L7，两条任一失败即第 12 条触发。「2028 年报」登记时读作 2028 年 4 月前后发布的 FY2027 20-F：报告的时间轴把它排在 2027-04 的年报与 2028-07 之间 [src:PDD-RPT1-2026-09-16#p3]，并按发布时间称呼年报（如「2027 年 4 月的年报」）[src:PDD-RPT1-2026-09-16#p25]。规则 note 中的首期注资 150 亿元同样仅 L2（SEC 文件未披露）[src:PDD-RPT1-2026-09-16#p5]；门槛已登记，本期不改，日后一手文件给出不同的首期注资额时，以新的 effective_from 另行登记。新拼姆是自营还是外贸综服模块尚无法区分 [src:PDD-RPT1-2026-09-16#p6]：公司在 2026-05-27 的一季报中称将投入大量资源建设自有品牌（first-party brand）业务 [src:PDD-6K-2026-05-28#EX-99.1]，但没有点名新拼姆，也没有披露模式与会计处理，截至 2026-06-30 资产负债表仍无存货科目 [src:PDD-6K-2026-08-25#EX-99.1]；两种读法的判据是三季报起资产负债表是否出现存货、损益表是否重现商品销售收入。若始终没有存货科目，本条无读数。"

  - id: PDD-L7
    type: qualitative
    claim: 新拼姆若确为自营，不会像 2021 年的「商品销售」那样收缩后不再单列、且公司不说明原因
    origin: report:breaker
    severity: breaker
    covers: [capital_allocation, management]
    pillar: P5
    question: 本期 20-F 或 6-K 是否显示新拼姆的自营业务已经停止（例如损益表的「商品销售」一行或资产负债表的存货科目在出现后消失，或业务被关停、改为纯服务模块），而公司在文件中没有解释原因？新拼姆从未以自营方式运营（从未出现存货科目或商品销售收入）时，答「否」。
    fail_if: 是
    judge: independent_model
    evidence: required
    where: 三年验收时点的 20-F（登记时读作 2028 年 4 月前后发布的 FY2027 20-F，理由见 PDD-Q17）及此前的 6-K；合并损益表、资产负债表与业务概览
    lookback: 6
    effective_from: FY2026Q3
    first_readable: 2028-04
    baseline: {value: 2026-06-30 资产负债表尚无存货科目，新拼姆是自营还是外贸综服模块尚无法区分, source: PDD-6K-2026-08-25#EX-99.1, note: "报告判为无法区分 [src:PDD-RPT1-2026-09-16#p6]；公司 2026-05-27 的一季报称将投入大量资源建设自有品牌业务，没有点名新拼姆 [src:PDD-6K-2026-05-28#EX-99.1]"}
    note: "论点破坏者第 12 条的第二个分支（原为 PDD-Q17 的事件条件，改为定性测试以便独立判定并附出处），与 PDD-Q17 任一失败即第 12 条触发。先例：2021 年的商品销售收入为 72.5 亿元 [src:PDD-6K-2022-03-22#EX-99.1]，2022 年降至 2.09 亿元，FY2022 20-F 只用一句「主动收缩了这部分业务」（as we scaled down this aspect of our business）解释下降，没有说明收缩的理由 [src:PDD-20F-FY2022#Item5.A]；自 FY2023 20-F 起这一行并入「在线营销服务及其他」，不再单列 [src:PDD-20F-FY2023#Item5.A]。claim 的先例描述已在本条生效（FY2026Q3）之前按首次事实审计更正（04A-4-03，2026-09-25）：原措辞「无声退出」与一手文件不符；判定仍以 question 的定义为准：自营业务停止，而公司在文件中没有解释原因。"

  # ———— 报告第 09 节：唯一的正面破坏者（向上改结论）————
  - id: PDD-Q18
    type: quantitative
    claim: 股东返还仍为零，现行结论以现金不能全额到达股东为前提；出现首笔返还即推翻这一前提，论点须上修
    origin: report:breaker
    severity: breaker
    covers: [capital_allocation, management]
    pillar: P3
    metric_def:
      id: shareholder_return_quarter
      description: 季度融资活动现金流中的股东返还（普通股或 ADS 回购 + 现金分红）；不含可转债的偿还或回购（现金流量表 Repayment or repurchase of convertible bonds 一行不算）
      unit: 元
      frequency: quarter
      data: filing_text
      formula: share_repurchases + dividends_paid
      where: 季度 6-K 附件 99.1 的现金流数据（融资活动）；年度用 20-F 合并现金流量表核对
    fail_if: 季度融资活动现金流中出现任何非零的股东返还
    rule: {op: ">", threshold: 0, unit: 元, consecutive: 1, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 0, unit: 元, period: FY2025, source: PDD-20F-FY2025#p157, note: "FY2025 融资活动为可转债偿还 5,228,716 千元与其他 1,363 千元，无回购或分红 [src:PDD-20F-FY2025#p157]。上市以来股东返还为零：20-F 称 PDD Holdings Inc. 没有宣派或支付过现金股利 [src:PDD-20F-FY2025#p17]，Item 16E 为 Not applicable [src:PDD-20F-FY2025#p140]；2018–2025 年的合并现金流量表融资活动都没有回购或股利行 [src:PDD-20F-FY2020#Item18] [src:PDD-20F-FY2022#F-11] [src:PDD-20F-FY2025#p157]，XBRL 汇总数据中的普通股回购只有上市前 2017 年一笔 [src:PDD-WEB-2026-09-24-1]；2026 年上半年融资活动现金流的绝对值不足 100 万元 [src:PDD-6K-2026-08-25#EX-99.1]。报告同 [src:PDD-RPT1-2026-09-16#p3]"}
    note: "正面触发，不是恶化。报告称这是全篇唯一能在单季内把结论向上改的事件 [src:PDD-RPT1-2026-09-16#p26]。规范的 severity 只有 breaker 与 watch，这里暂用 breaker，以保留 7 天内写结论的节奏；结论方向是上修，不计入恶化统计（待 thesis-ci 规范增加正面触发的写法，见 todo）。2024-08-26 的二季度电话会上，管理层表示当前做回购或分红不合适、可预见的未来几年也没有必要（言行账本 PDD-M3，电话会发言，据第三方整理转述，申报文件未载）[src:PDD-RPT1-2026-09-16#p14]；其中分红的一半有一手表述：20-F 称目前没有在可预见的将来派发现金股利的计划 [src:PDD-20F-FY2025#p17]。"

