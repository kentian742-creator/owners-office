category_rationale: "Already large, with growth now slightly below the typical stalwart range written in the stalwart template: 2025 revenue was RMB 431.8 billion, up 9.7% year on year [src:PDD-20F-FY2025#p101] [src:PDD-20F-FY2025#p104], and Q2 2026 revenue was up 8.1% year on year (112,358 ÷ 103,985 RMB million, this archive's calculation, rounded to 8% in the company's press release) [src:PDD-6K-2026-08-25#EX-99.1], not yet at the warning or failure thresholds of PDD-Q1. The report itself makes no Lynch classification, and the category is the company manager's judgment; the secondary category is asset play, because net financial assets were $73.9 billion as of 2026-06-30 (this archive's calculation from balance-sheet line items, see F3) with zero interest-bearing debt [src:PDD-6K-2026-08-25#EX-99.1], so a large part of the thesis depends on whether this cash can reach shareholders."
