    note: 论点破坏者第 1 条。

  - id: PDD-Q11
    type: quantitative
    claim: 营业利润率守在论点所依赖的盈利水平之上
    origin: report:breaker
    severity: breaker
    covers: [unit_economics, pricing_power]
    pillar: P2
    metric_def:
      id: operating_margin_6k
      description: 单季营业利润率（营业利润 ÷ 收入）；外国私人发行人季度口径。若损益表出现「商品销售」一行，以平台业务口径判定（剔除商品销售收入及其成本，与 PDD-Q6 相同），合并口径并列
      unit: "%"
      frequency: quarter
      data: filing_text
      formula: operating_profit_q / revenue_q
      where: 季度 6-K 附件 99.1 的未经审计合并损益表
    fail_if: 营业利润率连续四个季度低于 15%
    rule: {op: "<", threshold: 15, unit: "%", consecutive: 4, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 24.7, unit: "%", period: FY2026Q2, source: PDD-6K-2026-08-25#EX-99.1, note: "27,764 ÷ 112,358（百万元，本档案计算）[src:PDD-6K-2026-08-25#EX-99.1]"}
    note: "论点破坏者第 2 条。报告未写明单季还是 TTM，登记时定为单季读：四个季度单季都低于 15% 时，第 08 节估值起点所用的 TTM 营业利润率必然也低于 15%，满足「起点作废」，且比按 TTM 连续四个季度读更早触发 [src:PDD-RPT1-2026-09-16#p26]；TTM 口径的提前警告由 PDD-Q6 承担。若「商品销售」一行出现，以平台业务口径判定：报告提醒自营若按总额法确认会把合并利润率压低，期权的成功不能被误读成论点作废 [src:PDD-RPT1-2026-09-16#p25]。这两处读法如需改动，须在对应季度的业绩公告发布之前合并。各季数字取公司自己在业绩 6-K（或 20-F）中列示的数字，同比的上年数取本期文件列示的比较数，与经审计的 20-F 不一致时照用公司数字并在读数说明里记下差额（例如 2025 年四季度营业利润的业绩公告数字未含 2026 年 4 月的罚款，见 F9）。罚款在本条的利润率里按入账财年计，不按处罚决定日：境内罚没随 20-F 计入 FY2025（本档案据差额推断，见 F9），不计入 FY2026 的任何一季。"

  - id: PDD-Q12
    type: quantitative
    claim: 负投入资本的引擎没有反向运转
    origin: report:breaker
    severity: breaker
    covers: [moat, returns_on_capital]
    pillar: P1
    metric_def:
      id: merchant_float
      description: 商家浮存 = 应付商家 + 商家保证金（季末余额）
      unit: 亿元
      frequency: quarter
      data: filing_text
      formula: payable_to_merchants + merchant_deposits
      where: 季度 6-K 附件 99.1 的未经审计合并资产负债表（Payable to merchants、Merchant deposits）
    fail_if: 商家浮存连续四个季度同比下降
    rule: {op: decrease, threshold: 0, unit: "%", consecutive: 4, period: quarter, note: 对上年同期季末余额的同比变化}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 1285, unit: 亿元, as_of: 2026-06-30, source: PDD-6K-2026-08-25#EX-99.1, note: "应付商家 109,924＋商家保证金 18,545＝128,469 百万元（本档案计算）[src:PDD-6K-2026-08-25#EX-99.1]"}
    note: 论点破坏者第 3 条；与 PDD-Q7 同一指标，门槛更严。metric_def 与 PDD-Q7 逐字相同，改动须两处同步。

  - id: PDD-Q13
    type: quantitative
    claim: 现金没有被大额收购或低回报的自营重资产消耗
    origin: report:breaker
    severity: breaker
    covers: [capital_allocation, returns_on_capital]
    pillar: P5
    metric_def:
      id: cash_acquisition_amount
      description: 公司宣布的现金收购金额（单笔，或一年内累计）；外币以公司披露的人民币金额为准，未披露时按宣布日中国人民银行公布的人民币汇率中间价折算
      unit: 亿元
      frequency: event
      data: filing_text
      where: 6-K 公告、20-F Item 4 与 Item 5、现金流量表投资活动
      components:
        acquisition_amount:
          description: 公司宣布的单笔收购的对价总额，不论以现金、股份还是混合方式支付；外币折算规则同 cash_acquisition_amount
          unit: 亿元
          where: 6-K 公告、20-F Item 4 与 Item 5
        ppe_plus_inventory:
          description: 物业设备及软件净值 + 存货（如出现）；自营品牌投入节奏与资本密集度的读数
          unit: 亿元
          where: 季度 6-K 附件 99.1 的未经审计合并资产负债表
        operating_margin_ttm:
          description: 营业利润率，过去四个季度营业利润合计 ÷ 收入合计；若损益表重新出现「商品销售」一行，按平台业务单独读（剔除商品销售收入及其成本）
          unit: "%"
          where: 季度 6-K 附件 99.1 的未经审计合并损益表，逐季相加
    fail_if: 公司宣布单笔或一年内累计超过 1,500 亿元人民币的现金收购，或自营品牌相关的存货＋物业设备合计超过 1,000 亿元而平台业务营业利润率未回到 20% 以上
    rule:
      any_of:
        - {metric: cash_acquisition_amount, op: ">", threshold: 1500, unit: 亿元, period: event, note: 单笔或一年内累计}
        - all_of:
            - {metric: cash_acquisition_amount.ppe_plus_inventory, op: ">", threshold: 1000, unit: 亿元, period: quarter, note: 公司不做分部披露，以合并口径的存货加物业设备代读}
            - {metric: cash_acquisition_amount.operating_margin_ttm, op: "<", threshold: 20, unit: "%", period: quarter, note: 按平台业务单独读}
    warn_if: 单笔超过 500 亿元人民币的收购，不论支付方式（报告列为现金可得性的反向信号）
    warn_rule: {metric: cash_acquisition_amount.acquisition_amount, op: ">", threshold: 500, unit: 亿元, period: event, note: 单笔，按对价总额}
    data: filing_text
    effective_from: FY2026Q3
    baseline: {value: 上市以来无重大并购, source: PDD-20F-FY2025#p72, note: "20-F Item 4.A 的沿革中上市后没有收购，只有 2016 年的集团内整合 [src:PDD-20F-FY2025#p72]；2023–2025 年投资活动现金流没有收购子公司或业务一行 [src:PDD-20F-FY2025#p157]；报告同 [src:PDD-RPT1-2026-09-16#p3]"}
    note: "论点破坏者第 4 条。警告门槛取自第 09 节正面破坏者一段的反向信号，报告写的是「收购」而不限现金，故警告按对价总额读；破坏者的现金收购一腿按报告原文限于现金 [src:PDD-RPT1-2026-09-16#p26]。报告提醒，利润率判据必须按平台业务单独读，否则自营期权的成功会被误读成论点作废 [src:PDD-RPT1-2026-09-16#p25]。规则里「公司不做分部披露」一句的准确说法是：公司只有一个经营与报告分部（电子商务服务），不按业务或地区拆分披露 [src:PDD-20F-FY2025#p167]，所以自营部分只能以合并口径的存货加物业设备代读。规则引用的 ppe_plus_inventory、operating_margin_ttm 在 metric_def.components 中照录 PDD-Q8、PDD-Q6 的定义，改动须同步。大额收购与重资产消耗的都是现金，本条也守护支柱 P3。"

