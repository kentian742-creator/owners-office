  - "言行账本已登记 PDD-L1 要对照的两条表态与 2024 年 8 月的回购分红表态（PDD-M1 至 PDD-M3，都是电话会发言，据第三方整理转述，申报文件未载）。电话会的一手载体是公司网站的回放，已登记为 PDD-CALL-FY2026Q2、PDD-CALL-FY2024Q2，本轮没有转写核对；取得回放原话后改引，PDD-L1 的基线在此之前按 §G3 视为待核。新拼姆三年 1,000 亿元的投入计划 [src:PDD-RPT1-2026-09-16#p5] 只见于媒体报道（据报道是公司 2026-03-25 官宣的口径），仅 L2，未见一手数据，待查明公司自己的表态日期与出处后登记：首期出资在合并报表上不可见，SEC 文件也未披露 [src:PDD-RPT1-2026-09-16#p15]。"
