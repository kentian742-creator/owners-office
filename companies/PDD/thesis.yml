# 报告的破坏者与前瞻指标里需要判断的事件分支，单独写成定性测试（PDD-L6、PDD-L7、PDD-L8），交独立模型判定并附出处；与原测试任一失败即该条触发。
# 副类 asset_play 的模板测试逐条不套用：Q-cash-drag 登记时就会因商家浮存与留存现金而失败，测不出新信息；
# Q-book 的下降最可能来自首笔大额返还（正面事件，见 PDD-Q18）或大额亏损，而侵蚀现金的具体路径已由 PDD-Q13、PDD-Q9、PDD-Q14、PDD-Q16 分别盯住；
# L-dissipation 大体由 PDD-Q13 覆盖。支柱 P3 的相关测试见各条 note（pillar 字段只能填一个）。
