tests:
  # ———— 林奇模板：stalwart（含 _common 时效测试）————
  - id: PDD-Q1
    type: quantitative
    claim: 增长没有滑出稳定增长型的区间
    origin: template:stalwart
    severity: watch
    covers: [growth]
    pillar: P5
    metric_def:
      id: revenue_yoy_6k
      description: 总收入同比增速；外国私人发行人的季度数据只在 6-K 业绩公告中，没有 XBRL
      unit: "%"
      frequency: quarter
      data: filing_text
      formula: revenue_t / revenue_{t-4q} - 1
      where: 季度 6-K 附件 99.1 的未经审计合并损益表（Total revenues）；年度可用 20-F XBRL 核对
    fail_if: 连续 4 个季度低于 5%
    rule: {op: "<", threshold: 5, unit: "%", consecutive: 4, period: quarter}
    warn_if: 连续 2 个季度低于 8%
    warn_rule: {op: "<", threshold: 8, unit: "%", consecutive: 2, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 8.0, unit: "%", period: 2026Q2, source: PDD-RPT1-2026-09-16#p19}
    note: 门槛沿用模板；只把数据口径从 XBRL 改为 6-K 正文，因为 PDD 为外国私人发行人。报告称总增速几乎全部来自海外，增长读数应与 PDD-Q5、PDD-Q19 并读。

  - id: PDD-Q2
    type: quantitative
    claim: 经营性投入资本保持为负，增长继续由商家的钱而不是股东的钱驱动
    origin: manual
    severity: watch
    covers: [returns_on_capital, moat]
    pillar: P1
    metric_def:
      id: operating_invested_capital
      description: 经营性投入资本 = 经营性应收与预付 + 物业设备及软件净值 + 使用权资产 + 存货（如出现）− 经营性应付（应付商家、商家保证金、应计费用及其他经营性负债等）− 租赁负债；科目归类沿用 02 报告
      unit: 亿元
      frequency: quarter
      data: filing_text
      formula: operating_receivables_prepayments + ppe_rou (+ inventory) - operating_payables - lease_liabilities
      where: 季度 6-K 附件 99.1 的未经审计合并资产负债表
    fail_if: 经营性投入资本转为正值，连续 2 个季度
    rule: {op: ">", threshold: 0, unit: 亿元, consecutive: 2, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: -1829, unit: 亿元, as_of: 2026-06-30, source: PDD-RPT1-2026-09-16#p6, note: "报告独立计算的口径，公司未披露 [src:PDD-RPT1-2026-09-16#p30]"}
    note: "替代模板 Q-returns（ROIC 连续 2 年低于 12%）：投入资本为负时常规 ROIC 没有数学意义 [src:PDD-RPT1-2026-09-16#p6]。改测负投入资本是否翻正。报告的测算以新拼姆三年 1,000 亿元全额计入投入资本为前提（−1,829＋1,000＝−829 亿元），在此之上翻正还需浮存再降 64.5% [src:PDD-RPT1-2026-09-16#p7]。按 2026-06-30 的资产负债表、其他科目不变，浮存降到零投入资本也仍为负（−1,829＋1,285＝−544 亿元，本档案按报告数字计算）[src:PDD-RPT1-2026-09-16#p6]，单靠浮存下降不会翻正。连续期数沿用模板的 2 期，频率改为季度。若转正，恢复模板的 ROIC 测试。"

  - id: PDD-Q3
    type: quantitative
    claim: 股本没有被股权激励持续摊薄（公司不回购，模板的回购检验在这里改读摊薄）
    origin: template:stalwart
    severity: watch
    covers: [capital_allocation]
    pillar: P3
    metric: diluted_shares_yoy
    fail_if: 连续 2 年大于 0
    rule: {op: ">", threshold: 0, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: 2027-04
    baseline: {value: [1.32, 0.22], unit: "%", period: FY2024–FY2025, source: PDD-20F-FY2025#p183, note: "由 F14 的加权平均摊薄股数计算的同比变化（本档案计算）[src:PDD-20F-FY2025#p183]；FY2023、FY2024 的摊薄股数另含可转债转股假设（36,300／16,273 千股）[src:PDD-20F-FY2025#p183]；报告另记 2025Q2 到 2026Q2 加权摊薄股数由 59.28 亿降到 58.94 亿 [src:PDD-RPT1-2026-09-16#p14]"}
    note: "门槛沿用模板，只改 claim：公司上市以来零回购，模板原句「回购在真正缩减股本」在这里无从成立，改为检验股权激励的摊薄是否持续推高股本。股本的来源：2019–2020 年有增发 ADS 与定向增发 [src:PDD-RPT1-2026-09-16#p29]，2021–2025 年股权发行只来自股份支付 [src:PDD-RPT1-2026-09-16#p17]。登记时的已知状态（写在首次运行之前）：FY2024、FY2025 两年摊薄股数都上升，按规则已为失败（watch）。处置意见：这是股权激励的摊薄且在放缓，不改变论点；FY2026 若股数同比下降，本条转为通过，只说明摊薄停止，不代表出现回购，回购与分红由 PDD-Q18 读。年度数据取 20-F 的 XBRL。"

  - id: PDD-Q4
    type: quantitative
    claim: 利润能变成现金
    origin: template:stalwart
    severity: watch
    covers: [free_cash_flow]
    pillar: P1
    metric_def:
      id: fcf_conversion_20f
      description: 自由现金流 ÷ 净利润（GAAP），算法同登记表的 fcf_conversion；自由现金流 = 经营活动现金流净额 − 购置物业、设备、软件及无形资产
      unit: "%"
      frequency: year
      data: filing_text
      formula: (operating_cash_flow - capex) / net_income
      where: 20-F 合并现金流量表（Consolidated Statements of Cash Flows）的三行：Net cash generated from operating activities、Purchase of property, equipment and software and intangible assets（资本开支，FY2025 为 1,145,077 千元 [src:PDD-20F-FY2025#p157]）、Net income；季度业绩 6-K 的简明现金流量表没有资本开支一行
    fail_if: 连续 2 年低于 70%
    rule: {op: "<", threshold: 70, unit: "%", consecutive: 2, period: year}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2027-04
    baseline: {value: [155.9, 107.6, 108.1], unit: "%", period: FY2023–FY2025, source: PDD-20F-FY2025#p157, note: "自由现金流 ÷ 净利润，由 20-F 合并现金流量表的经营活动现金流、购置物业设备软件及无形资产与净利润计算（本档案计算）[src:PDD-20F-FY2025#p157]。报告用的是经营现金流 ÷ 净利润：2023 年 1.57 倍、2024 年 1.08 倍、2025 年 1.08 倍 [src:PDD-RPT1-2026-09-16#p8]；按 20-F 数字计算 2025 年为 1.09 倍 [src:PDD-20F-FY2025#p157]，差异来自 20-F 计入 2025 年的罚款，见 F13"}
    note: "门槛沿用模板；数据口径从 XBRL 改为 20-F 正文：资本开支一行自 FY2021 的 20-F 起不再用 us-gaap:PaymentsToAcquirePropertyPlantAndEquipment 标注，EDGAR 的 XBRL 汇总数据里这一概念最后一期是 FY2020 [src:PDD-WEB-2026-09-24-1]；FY2025 20-F 把这一行标为公司扩展概念 pdd:PaymentsToAcquirePropertyEquipmentAndSoftwareAndIntangibleAssets [src:PDD-20F-FY2025#p157]，按登记表 fcf_conversion 的 us-gaap 概念取数会缺资本开支。报告提醒：浮存增长在高增长年份贡献巨大，增长放缓后经营现金流对净利润回落到 1 倍附近 [src:PDD-RPT1-2026-09-16#p8]。"

  - id: PDD-L1
    type: qualitative
    claim: 管理层说过的可检验表态与后来发生的事一致
    origin: manual
    severity: watch
    covers: [management]
    pillar: P4
    question: 管理层在 2026-08-24 的二季度电话会上有两条可检验表态（言行账本 PDD-M1、PDD-M2）：①平台对第三方商家开放、公平的底层机制不会改变；②短期盈利会承压，未来各季利润率的起伏将成常态。本期 6-K 业绩公告或 20-F 中，是否出现与其中任一条相反的事实，而管理层没有作出说明？
    fail_if: 是
    judge: independent_model
    evidence: required
    where: 本期 6-K 附件 99.1 与 20-F。两条表态的文字已写在问题里，出自电话会的第三方整理（公司不发布问答实录，属二手记录），见 ledger.yml 的 PDD-M1、PDD-M2
    lookback: 1
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 2026Q2 电话会上管理层承诺平台开放公平的底层机制不变，并预告短期盈利承压、利润率起伏为常态（均为二手记录）, source: PDD-RPT1-2026-09-16#p13, note: "第二条表态见 [src:PDD-RPT1-2026-09-16#p15]"}
    note: "替代模板 L-guidance：报告与 FY2025 20-F 中都未见公司公布的中期财务目标，原测试无从判定（待以季度 6-K 复核，见 todo）。问题只列两条已登记的表态，清单封闭；新增表态须先登记进 ledger.yml、再改本题，并在下一份业绩公告发布之前合并。2024 年 8 月「几年内不回购不分红」的表态（PDD-M3）不列入：出现返还时由 PDD-Q18 作为正面触发处理。报告第 04 节以说过的话与后来发生的事评估管理层，2026 年 8 月的第二次利润预告待三季报验证 [src:PDD-RPT1-2026-09-16#p3]。"

