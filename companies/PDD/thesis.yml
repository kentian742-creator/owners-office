# PDD thesis file (public). Everything related to valuation and price is only in the private repository.
# Where the tests come from: the Lynch stalwart template (with the _common staleness tests) → the quarterly watch indicators (watch) and thesis breakers (breaker) in section 09 of the 02 report → manual tests added after the audit (PDD-Q19, PDD-L9).
# Event branches in the report's breakers and watch indicators that need judgment are written as separate qualitative tests (PDD-L6, PDD-L7, PDD-L8), judged by an independent model with citations; if either the qualitative test or the original test fails, that item is triggered.
# The template tests of the secondary category asset_play are not applied, item by item: Q-cash-drag would already fail at registration because of the merchant float and retained cash, so it would reveal nothing new;
# a fall in Q-book would most likely come from a first large return of capital (a positive event, see PDD-Q18) or a large loss, and the specific ways cash could be eroded are already watched by PDD-Q13, PDD-Q9, PDD-Q14 and PDD-Q16;
# L-dissipation is largely covered by PDD-Q13. For the tests related to pillar P3, see each note (the pillar field takes only one value).
# The report is PDD-RPT1-2026-09-16, and #pN is its PDF page number; the locators of other sources are explained in the header of sources.yml.
# Labels: "this archive's calculation" = computed from the original figures of primary filings (growth rates to one decimal); "company's rounding" = the rounded figure as printed in the company's press release;
# "earnings-call remark as reported by third parties, not in the filings" = found only in third-party write-ups of the earnings call (secondary, not used as a reading in a test baseline);
# FY2025 figures follow the audited 20-F, and where the earnings-release basis differs, both are given (the April 2026 domestic penalty, see F9).
