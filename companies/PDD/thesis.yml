    where: 6-K 公告；20-F 风险因素与法律程序；欧盟委员会就 Temu《数字服务法》案件（正式程序 2024-10-31 启动 [src:EC-IP-24-5622]）发布的新闻稿与决定；美国政府针对 Temu 的禁令或本地化持股要求的官方文件。后两类在公司文件之外，判定时作为附加输入提供，首次引用时登记进 sources.yml（欧委会的 IP/24/5622、IP/26/1178 已登记）
