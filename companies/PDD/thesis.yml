thesis:
  summary: "拼多多与 Temu 是同一套机制在国内外的两份复制：聚合需求、把大订单交给中国工厂、以低价换规模，平台不持有存货，靠商家的钱运转——经营性投入资本为负 1,829 亿元 [src:PDD-RPT1-2026-09-16#p6]，零有息负债 [src:PDD-RPT1-2026-09-16#p7]。生意本身的证据充分，决定所有者结果的三个变量却都不在生意里：排序权能否保住、现金能否到达股东、与监管的姿态往哪边走 [src:PDD-RPT1-2026-09-16#p3]。国内在线营销收入二季度只增长 3.5%，增长主要来自海外，而海外正同时面对关税重置与 DSA 罚款 [src:PDD-RPT1-2026-09-16#p11]。上市以来股东返还为零 [src:PDD-RPT1-2026-09-16#p3]；第一笔回购或分红会上修论点，排序权与制度两条线的恶化会推翻它。"
  pillars:
    - id: P1
      claim: "生意不占股东资本：应付商家加保证金形成 1,285 亿元浮存，经营性投入资本为负 1,829 亿元 [src:PDD-RPT1-2026-09-16#p6]，增长靠商家的钱而不是股东的钱。"
      source: PDD-RPT1-2026-09-16#p6
    - id: P2
      claim: "排序权与定价权仍在：国内在线营销收入没有被内容电商和购物代理夺走，利润率下行是让利而不是定价权见顶；当前读数为在线营销 +3.5%、营业利润率 TTM 22.2% [src:PDD-RPT1-2026-09-16#p10]。"
      source: PDD-RPT1-2026-09-16#p10
    - id: P3
      claim: "净金融资产 5,016 亿元（739 亿美元）不会被毁灭，并终将有通道到达外部股东 [src:PDD-RPT1-2026-09-16#p7]；这是证据最弱的一条：2023–2025 年没有任何子公司向上市主体分配，受限净资产 1,259 亿元 [src:PDD-RPT1-2026-09-16#p18]。"
      source: PDD-RPT1-2026-09-16#p18
    - id: P4
      claim: "经营者能干且与监管的关系不走向二元性失效：销售费用率从 69.2% 降到 29.0% 的同时收入做到 7.3 倍 [src:PDD-RPT1-2026-09-16#p3]；VIE、审计检查与平台规则都没有断裂，执法现场的姿态不再恶化。"
      source: PDD-RPT1-2026-09-16#p3
    - id: P5
      claim: "第二曲线不毁掉资本回报：Temu 能在关税重置与 DSA 之下自持，新拼姆三年计划投入 1,000 亿元 [src:PDD-RPT1-2026-09-16#p5]（是自营还是外贸综服模块，报告判为无法区分 [src:PDD-RPT1-2026-09-16#p6]）不把公司拖成低回报的重资产零售商。"
      source: PDD-RPT1-2026-09-16#p5
  permanent_loss_paths:
    - "现金永远到不了外部股东：上市主体 2025 年末自身的现金类资产只有 4,599 万元，受限净资产 1,259 亿元 [src:PDD-RPT1-2026-09-16#p18]；若制度或意愿让净金融资产永久留在境内并被低回报地消耗，外部股东拥有的只是一台不向所有者分配的机器。"
    - "排序权外移：内容电商把发现、购物代理把比价搬出平台，国内在线营销收入由停滞转为持续负增长 [src:PDD-RPT1-2026-09-16#p19]；租金来源离开它的地盘，结局不是倒闭，而是被绕开、变得无关紧要。"
    - "制度的二元性失效：VIE 被认定无效、审计检查再度中断导致退市，或平台与价格规则被严格执行、营业利润率被压到制度收口路径的终点 13% 左右 [src:PDD-RPT1-2026-09-16#p22]；利润原本由监管许可而非护城河给出。"
    - "重资产迷失：若新拼姆确为自营，它把高毛利的广告生意换成利润率接近京东（1%–5%）的自营线，并与付广告费的第三方商家直接竞争 [src:PDD-RPT1-2026-09-16#p13]，最终以库存减值或无声退出收场，资本被永久消耗；报告判断这条路径只在新拼姆是买断包销的自营时成立 [src:PDD-RPT1-2026-09-16#p6]。"
    - "执法姿态恶化：2026 年处罚决定书记载了阻碍执法的行为 [src:PDD-RPT1-2026-09-16#p15]；若在下一次监管边界移动时重演，代价不再是一张罚单，而是能否以现有形态继续经营。"

