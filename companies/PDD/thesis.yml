  - "新拼姆的业务性质（自营还是外贸综服模块）目前无法区分，2026 年三季度 6-K 是否出现存货科目是第一个判据 [src:PDD-RPT1-2026-09-16#p6]。公司 2026-05-27 的一季报称将投入大量资源建设自有品牌（first-party brand）业务 [src:PDD-6K-2026-05-28#EX-99.1]，没有点名新拼姆，也没有披露模式与会计处理；两种读法各自的判据是三季报起资产负债表是否出现存货、损益表是否重现商品销售收入。登记时已定下的读法（PDD-Q8 按同比、PDD-Q11 按单季并在出现「商品销售」时以平台口径判定、PDD-Q14 的罚没口径、PDD-Q17 与 PDD-L7 读 FY2027 20-F）如需改动，须在对应文件发布之前合并。"
  - "2026 年上半年其他收入／损失净额 −94.30 亿元的构成未披露 [src:PDD-6K-2026-08-25#EX-99.1]。境内罚没 15.22 亿元已计提在经审计的 FY2025 报表中（本档案据差额推断：20-F 的 2025 年一般及行政费用、营业利润、净利润与 2025-12-31 的应计费用及其他负债、留存收益，都与 2026-03-25 的未经审计公告恰好相差 1,521,930 千元，等于决定书的罚没合计）[src:PDD-20F-FY2025#p153] [src:PDD-6K-2026-03-26#EX-99.1] [src:SAMR-CF-2026-22]，所以不在 2026 年上半年的其他收入／损失里；只有欧盟委员会的 2 亿欧元罚款是否计提、计入哪一科目仍无法确认 [src:EC-IP-26-1178]。"
