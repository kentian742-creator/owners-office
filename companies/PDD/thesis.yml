tests:
  # ---------- Lynch template: stalwart (with the _common staleness tests) ----------
  - id: PDD-Q1
    type: quantitative
    claim: "Growth has not slipped out of the stalwart range"
    origin: template:stalwart
    severity: watch
    covers: [growth]
    pillar: P5
    metric_def:
      id: revenue_yoy_6k
      description: "Total revenue growth, year on year; a foreign private issuer's quarterly figures are only in the 6-K earnings release, with no XBRL"
      unit: "%"
      frequency: quarter
      data: filing_text
      formula: revenue_t / revenue_{t-4q} - 1
      where: "The Revenues line of the unaudited condensed consolidated statements of income in Exhibit 99.1 of the quarterly 6-K (the press release text calls it Total revenues, and the total line of the revenue note is Total); annual figures can be checked against the 20-F XBRL"
    fail_if: "below 5% for 4 consecutive quarters"
    rule: {op: "<", threshold: 5, unit: "%", consecutive: 4, period: quarter}
    warn_if: "below 8% for 2 consecutive quarters"
    warn_rule: {op: "<", threshold: 8, unit: "%", consecutive: 2, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 8.1, unit: "%", period: FY2026Q2, source: PDD-6K-2026-08-25#EX-99.1, note: "Income statement Revenues 112,358 ÷ 103,985 − 1 = 8.05%, or 8.1% to one decimal (RMB million, this archive's calculation) [src:PDD-6K-2026-08-25#EX-99.1]; the company's press release says an increase of 8% (company's rounding) [src:PDD-6K-2026-08-25#EX-99.1]"}
    note: "Thresholds follow the template; only the data source changes from XBRL to the 6-K text, because PDD is a foreign private issuer. Read the growth reading together with PDD-Q5 and PDD-Q19: of the Q2 2026 revenue increase of RMB 8,373 million, transaction services contributed RMB 6,439 million (about three quarters) and online marketing services and others RMB 1,934 million (23%, this archive's calculation) [src:PDD-6K-2026-08-25#EX-99.1]; the company does not disclose a regional split, and from the growth of transaction services the report infers that almost all of the total growth came from overseas [src:PDD-RPT1-2026-09-16#p11]."

  - id: PDD-Q2
    type: quantitative
    claim: "Operating invested capital stays negative, and growth continues to be driven by merchants' money rather than shareholders'"
    origin: manual
    severity: watch
    covers: [returns_on_capital, moat]
    pillar: P1
    metric_def:
      id: operating_invested_capital
      description: "Operating invested capital = operating receivables and prepayments + property, equipment and software, net + right-of-use assets + inventory (if any) − operating payables (payable to merchants, merchant deposits, accrued expenses and other operating liabilities, etc.) − lease liabilities; line items classified as in the 02 report"
      unit: RMB 100 million
      frequency: quarter
      data: filing_text
      formula: operating_receivables_prepayments + ppe_rou (+ inventory) - operating_payables - lease_liabilities
      where: "The unaudited consolidated balance sheet in Exhibit 99.1 of the quarterly 6-K"
    fail_if: "operating invested capital turns positive, for 2 consecutive quarters"
    rule: {op: ">", threshold: 0, unit: RMB 100 million, consecutive: 2, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: -1829, unit: RMB 100 million, as_of: 2026-06-30, source: PDD-6K-2026-08-25#EX-99.1, note: "This archive's calculation from balance-sheet line items, formula in F1; the definition is the report's own, and the company does not disclose it [src:PDD-RPT1-2026-09-16#p30]"}
    note: "Replaces the template's Q-returns (ROIC below 12% for 2 consecutive years): with negative invested capital, conventional ROIC has no mathematical meaning [src:PDD-RPT1-2026-09-16#p6]. The test instead checks whether negative invested capital turns positive. The report's estimate assumes that Xinpinmu's three-year RMB 100 billion is added in full to invested capital (−1,829 + 1,000 = −RMB 82.9 billion), and on top of that the float would have to fall a further 64.5% for invested capital to turn positive [src:PDD-RPT1-2026-09-16#p7]; the RMB 100 billion appears only in media reports (L2 only, no primary data seen) and is used here only as an assumption [src:PDD-RPT1-2026-09-16#p5], and whether it is the same money as the three-year RMB 100 billion of “hundred-billion support” mentioned elsewhere in the report is not distinguished by its secondary sources [src:PDD-RPT1-2026-09-16#p8]. On the 2026-06-30 balance sheet with other line items unchanged, invested capital would still be negative even if the float fell to zero (−182,943 + 128,469 = −RMB 54,474 million, about −RMB 54.5 billion, this archive's calculation) [src:PDD-6K-2026-08-25#EX-99.1], so a fall in the float alone would not turn it positive. The number of consecutive periods follows the template's 2, with the frequency changed to quarterly. If it turns positive, the template's ROIC test is restored."

  - id: PDD-Q3
    type: quantitative
    claim: "The share count is not being steadily diluted by equity incentives (the company does not buy back shares, so the template's buyback check reads dilution here)"
    origin: template:stalwart
    severity: watch
    covers: [capital_allocation]
    pillar: P3
    metric: diluted_shares_yoy
    fail_if: "above 0 for 2 consecutive years"
    rule: {op: ">", threshold: 0, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: 2027-04
    baseline: {value: [1.32, 0.22], unit: "%", period: FY2024–FY2025, source: PDD-20F-FY2025#p183, note: "Year-on-year change calculated from the weighted average diluted shares in F14 (this archive's calculation) [src:PDD-20F-FY2025#p183]; diluted shares in FY2023 and FY2024 also include the assumed conversion of convertible bonds (36,300 / 16,273 thousand shares) [src:PDD-20F-FY2025#p183]; on a quarterly basis, weighted average diluted shares fell from 5,928 million in Q2 2025 to 5,894 million in Q2 2026 [src:PDD-6K-2026-08-25#EX-99.1]"}
    note: "Thresholds follow the template; only the claim changes: the company has made zero buybacks since listing [src:PDD-20F-FY2025#p140] [src:PDD-20F-FY2025#p157] [src:PDD-20F-FY2022#F-11] [src:PDD-WEB-2026-09-24-1], so the template's original wording “buybacks are genuinely shrinking the share count” cannot hold here, and the test instead checks whether dilution from equity incentives keeps pushing the share count up. Where the shares came from: in 2019–2020 there were follow-on ADS offerings and private placements [src:PDD-20F-FY2025#p73] [src:PDD-RPT1-2026-09-16#p29], and in 2021–2025 new shares came from share-based compensation settlements and conversions of convertible bonds (62,732,708 shares in 2021, 12,642,752 in 2023, 8,594,700 in 2024), with no issuance for cash and no buybacks [src:PDD-20F-FY2025#p154] [src:PDD-20F-FY2025#p155] [src:PDD-20F-FY2022#F-9]. Known status at registration (written before the first run): diluted shares rose in both FY2024 and FY2025, so by the rule this is already a failure (watch). Disposition: this is dilution from equity incentives and it is slowing, which does not change the thesis (shares from convertible bond conversions were already counted in diluted shares under the assumed conversion before they converted); about 0.28 percentage points of the slowdown in dilution in 2025 come from the assumed-conversion shares of the convertible bonds falling to zero (this archive's calculation) [src:PDD-20F-FY2025#p183]. If the share count falls year on year in FY2026, this test turns to a pass, which only means dilution has stopped, not that buybacks have started; buybacks and dividends are read by PDD-Q18. Annual data come from the 20-F XBRL."

  - id: PDD-Q4
    type: quantitative
    claim: "Profits turn into cash"
    origin: template:stalwart
    severity: watch
    covers: [free_cash_flow]
    pillar: P1
    metric_def:
      id: fcf_conversion_20f
      description: "Free cash flow ÷ net income (GAAP), computed as fcf_conversion in the registry; free cash flow = net cash from operating activities − purchase of property, equipment and software and intangible assets"
      unit: "%"
      frequency: year
      data: filing_text
      formula: (operating_cash_flow - capex) / net_income
      where: "Three lines of the 20-F Consolidated Statements of Cash Flows: Net cash generated from operating activities, Purchase of property, equipment and software and intangible assets (capital expenditure, RMB 1,145,077 thousand in FY2025 [src:PDD-20F-FY2025#p157]) and Net income; the condensed cash flow statement in the quarterly earnings 6-K has no capital expenditure line"
    fail_if: "below 70% for 2 consecutive years"
    rule: {op: "<", threshold: 70, unit: "%", consecutive: 2, period: year}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2027-04
    baseline: {value: [155.9, 107.6, 108.1], unit: "%", period: FY2023–FY2025, source: PDD-20F-FY2025#p157, note: "Free cash flow ÷ net income, calculated from operating cash flow, purchase of property, equipment and software and intangible assets, and net income in the 20-F consolidated statements of cash flows (this archive's calculation) [src:PDD-20F-FY2025#p157]. The report uses operating cash flow ÷ net income: 1.57x in 2023, 1.08x in 2024 and 1.08x in 2025 [src:PDD-RPT1-2026-09-16#p8], and the first two recompute the same from the 20-F [src:PDD-20F-FY2025#p157], while the 2025 figure of 1.08x uses the earnings release's net income as the denominator [src:PDD-6K-2026-03-26#EX-99.1]; on the 20-F figures, 2025 is 1.09x [src:PDD-20F-FY2025#p157], the difference coming from the penalty the 20-F booked in FY2025 (this archive's inference from the difference), see F13"}
    note: "Thresholds follow the template; the data source changes from XBRL to the 20-F text: from the FY2021 20-F on, the capital expenditure line is no longer tagged us-gaap:PaymentsToAcquirePropertyPlantAndEquipment, and the last period of this concept in EDGAR's XBRL summary data is FY2020 [src:PDD-WEB-2026-09-24-1]; the FY2025 20-F tags this line with the company extension concept pdd:PaymentsToAcquirePropertyEquipmentAndSoftwareAndIntangibleAssets [src:PDD-20F-FY2025#p157], so pulling the us-gaap concept of the registry's fcf_conversion would miss capital expenditure. The report notes that float growth contributed hugely in the high-growth years, and that after growth slowed, operating cash flow fell back to about 1x net income [src:PDD-RPT1-2026-09-16#p8]; the primary figures only partly support this: of 2020 operating cash flow of RMB 28.197 billion, the increase in payable to merchants and merchant deposits was RMB 27.020 billion [src:PDD-20F-FY2022#F-11]; in 2023 operating cash flow exceeded net income by RMB 34.136 billion, the largest source being an increase of RMB 34.258 billion in accrued expenses and other liabilities, while payable to merchants and merchant deposits rose only RMB 13.444 billion, and in 2024 and 2025 the latter rose RMB 16.467 billion and RMB 16.575 billion, without falling back as growth slowed [src:PDD-20F-FY2025#p157]. The ratio returned to 1.08–1.09x mainly because the increase in accrued expenses and other liabilities narrowed from RMB 34.258 billion in 2023 to RMB 13.781 billion and RMB 12.360 billion in 2024 and 2025 [src:PDD-20F-FY2025#p157], so a falling ratio cannot be read directly as a slowdown in the float."

  - id: PDD-L1
    type: qualitative
    claim: "Management's testable statements are consistent with what happened afterward"
    origin: manual
    severity: watch
    covers: [management]
    pillar: P4
    question: "On the Q2 earnings call of 2026-08-24, management made two testable statements (say-do ledger PDD-M1 and PDD-M2, earnings-call remarks as reported by third parties, not in the filings [src:PDD-RPT1-2026-09-16#p13] [src:PDD-RPT1-2026-09-16#p15]): (a) the platform's underlying mechanism of openness and fairness to third-party merchants will not change; (b) short-term profitability will come under pressure, and quarter-to-quarter swings in margins will become the norm. Does this period's 6-K earnings release or 20-F show a fact contrary to either statement that management has not explained?"
    fail_if: "yes"
    judge: independent_model
    evidence: required
    where: "This period's 6-K Exhibit 99.1 and 20-F. The wording of the two statements is in the question; see PDD-M1 and PDD-M2 in ledger.yml. The company does not publish transcripts and offers only a webcast and replay of the call on its investor relations website [src:PDD-6K-2026-08-25#EX-99.1]; the replay is registered as PDD-CALL-FY2026Q2 and was not transcribed in this round, so the two statements currently rest only on third-party write-ups (secondary)"
    lookback: 1
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: "The management quotes in the Q2 earnings release say only that ecosystem investment was stepped up in the second quarter and that the current priority is helping merchants grow and strengthening the industry ecosystem (Jun Liu), and that compliance is the fundamental priority in building a trustworthy platform (Lei Chen, Jiazhen Zhao); the two statements to be verified are not in the filings", source: PDD-6K-2026-08-25#EX-99.1, note: "Both statements are earnings-call remarks as reported by third parties, not in the filings: (a) the platform's underlying mechanism of openness and fairness to third-party merchants will not change [src:PDD-RPT1-2026-09-16#p13]; (b) short-term profitability is under pressure, and quarter-to-quarter swings in margins are the norm [src:PDD-RPT1-2026-09-16#p15]; the report lists its source [24] (third-party write-ups and coverage of the call) as secondary [src:PDD-RPT1-2026-09-16#p30]. The primary record of the call is the replay on the company's website (PDD-CALL-FY2026Q2), which was not transcribed and checked in this round; until it is checked, the two statements have only secondary support and are treated as pending verification under §G3."}
    note: "Replaces the template's L-guidance: neither the report nor the FY2025 20-F shows medium-term financial targets published by the company [src:PDD-20F-FY2025], so the original test cannot be judged (to be rechecked against the quarterly 6-Ks, see todo). The question lists only the two registered statements, and the list is closed; a new statement must first be registered in ledger.yml, then the question amended, and the change merged before the next earnings release is published. The August 2024 statement that “buybacks or dividends are not appropriate now, nor necessary in the foreseeable next few years” (PDD-M3, earnings-call remark as reported by third parties, not in the filings [src:PDD-RPT1-2026-09-16#p14]) is not included: if a return occurs, PDD-Q18 handles it as a positive trigger; of that statement, the dividend half has a primary statement, as the 20-F says there is no present plan to pay cash dividends in the foreseeable future [src:PDD-20F-FY2025#p126], while the buyback half has none. Section 04 of the report assesses management by what it said and what happened afterward [src:PDD-RPT1-2026-09-16#p3]; written statements that profits will be affected by the investment are in the earnings press releases of 2024-08-26 and 2026-03-25 [src:PDD-6K-2024-08-26#EX-99.1] [src:PDD-6K-2026-03-26#EX-99.1], and the profit-pressure statement on the August 2026 call (PDD-M2) awaits verification in the third-quarter results."

