    note: "Thesis breaker No. 6."

  - id: PDD-Q14
    type: quantitative
    claim: "Conflict with regulators stays at the level of fines that can be paid out of profits"
    origin: report:breaker
    severity: breaker
    covers: [regulation, management]
    pillar: P4
    metric_def:
      id: regulatory_fines_to_prior_op
      description: "Total penalties imposed within a fiscal year up to the judgment date for pricing conduct, platform rules, food safety or antitrust ÷ the previous fiscal year's operating profit. Penalties include fines and confiscated illegal gains, and also fines by regulators outside China (fines under the EU Digital Services Act count as platform rules), consistent with how the report computes its reading; foreign-currency amounts use the RMB amount disclosed in the company's filings, or if none is disclosed, are converted at the RMB central parity rate published by the People's Bank of China on the decision date; the denominator is operating profit in the consolidated statements of income of the previous fiscal year's 20-F"
      unit: "%"
      frequency: event
      data: mixed
      formula: sum(fines_fiscal_year_to_date) / operating_profit_{t-1y}
      where: "Regulators' penalty announcements; 6-K announcements; 20-F Item 8.A legal proceedings; the previous fiscal year's operating profit from the 20-F consolidated statements of income"
      components:
        fines_fiscal_year_to_date:
          description: "Total penalties within a fiscal year up to the judgment date; basis and foreign-currency conversion as above"
          unit: RMB 100 million
          where: "Regulators' penalty announcements; 6-K announcements; 20-F Item 8.A legal proceedings"
        operating_profit_prior_year:
          description: "Operating profit of the previous fiscal year (operating_profit_{t-1y} in the formula)"
          unit: RMB 100 million
          where: "The consolidated statements of income in the previous fiscal year's 20-F"
    fail_if: "fines within one fiscal year for pricing conduct, platform rules, food safety or antitrust exceeding 5% of the previous year's operating profit"
    rule: {op: ">", threshold: 5, unit: "%", period: event, note: "cumulative within the fiscal year, recomputed at each new penalty"}
    data: mixed
    effective_from: FY2026Q3
    baseline: {value: 3.3, unit: "%", period: April–May 2026, source: SAMR-CF-2026-22, note: "Counted in FY2026 by decision date: the domestic penalty totals RMB 1,521,930,222.91 (2026-04-17) [src:SAMR-CF-2026-22], and the European Commission's fine is €200 million (2026-05-28) [src:EC-IP-26-1178], which at the RMB central parity rate on the decision date, RMB 7.9121 per euro, is RMB 1.582 billion [src:CFETS-CCPR-2026-05-28]; the total of RMB 3.104 billion divided by operating profit in the FY2025 20-F of RMB 93.102 billion is 3.33% (this archive's calculation) [src:PDD-20F-FY2025#p103], or 3.28% using the earnings release's RMB 94.624 billion [src:PDD-6K-2026-03-26#EX-99.1]; this is already two-thirds of the trigger line [src:PDD-RPT1-2026-09-16#p26]. The domestic penalty is corroborated in two more places: the 20-F records it as about RMB 1.5 billion [src:PDD-20F-FY2025#p28], and it equals the difference in 2025 general and administrative expenses between the 20-F and the earnings release, RMB 1,521,930 thousand [src:PDD-20F-FY2025#p153] [src:PDD-6K-2026-03-26#EX-99.1]. The report converts at about RMB 7.9 per euro, for an order of magnitude only [src:PDD-RPT1-2026-09-16#p30]"}
    note: "The first branch of thesis breaker No. 7; the branch “ordered to change traffic allocation and pricing rules” is PDD-L6, and if either fails, No. 7 is triggered. The report says this test already has a measured reading [src:PDD-RPT1-2026-09-16#p26]. The basis (penalties and fines outside China both counted, foreign-currency conversion, cumulative within the fiscal year and recomputed after each new penalty) was written down at registration, and any change must be merged before the next penalty is announced. This test assigns a fine to a fiscal year by its decision date, not by the year it is booked: the two fines of 2026-04-17 and 2026-05-28 both count in FY2026, with FY2025 operating profit as the denominator; that the domestic penalty is booked in FY2025 in the financial statements, with the 20-F (this archive's inference from the difference, see F9), does not affect this test's count. Penalties consume cash, so this test also bears on pillar P3."

  - id: PDD-L6
    type: qualitative
    claim: "Conflict with regulators has not reached traffic allocation and pricing rules"
    origin: report:breaker
    severity: breaker
    covers: [regulation, pricing_power]
    pillar: P4
    question: "Does this period's filing or a regulatory announcement disclose that a regulator, over pricing conduct, platform rules, food safety or antitrust, has ordered the company, by a penalty decision, an order to correct or a rectification requirement, to change its traffic allocation rules or pricing rules? Only requirements directed at this company count; new rules that apply to the whole industry do not, unless a regulator issues a separate rectification requirement to this company under them."
    fail_if: "yes"
    judge: independent_model
    evidence: required
    where: "6-K announcements; 20-F Item 8.A legal proceedings and risk factors; penalty decisions and announcements of SAMR and other regulators in and outside China"
    lookback: 1
    judge_notes: "A suspension of merchant onboarding (such as the suspension of new cake merchants in the April 2026 penalty [src:PDD-20F-FY2025#p28]) is a restriction on access to a category and does not count as a change to traffic allocation or pricing rules."
    effective_from: FY2026Q3
    baseline: {value: "The April 2026 penalty was a fine of about RMB 1.5 billion and a nine-month suspension of new cake merchants (other than prepackaged cakes)", source: PDD-20F-FY2025#p28, note: "The text of the decision: total penalties of RMB 1,521,930,222.91, an order to suspend new cake stores (other than prepackaged) for 9 months, and an order to correct the violations involved in qualification review and order transfers [src:SAMR-CF-2026-22]; the report reads No. 7 only by the amount of the fine and does not find that this branch has been triggered [src:PDD-RPT1-2026-09-16#p26]"}
    note: "The second branch of thesis breaker No. 7 (originally an event condition of PDD-Q14, turned into a qualitative test so that it is judged independently with citations); if either this test or PDD-Q14 fails, No. 7 is triggered."

  - id: PDD-Q15
    type: quantitative
    claim: "The two major shareholders whose holdings have not changed since 2021 have not started to exit"
    origin: report:breaker
    severity: breaker
    covers: [governance, management]
    pillar: P4
    metric_def:
      id: major_holder_shares
      description: "Shares beneficially owned by entities affiliated with Zheng Huang and by entities affiliated with Tencent (each group read separately)"
      unit: shares
      frequency: year
      data: filing_text
      where: "For the Tencent group, the main source is the Schedule 13D/A amendments filed by Tencent (the 20-F beneficial ownership table copies its 13D/A for Tencent [src:PDD-20F-FY2025#p122]); for the Zheng Huang group, mainly the 20-F Item 6.E / Item 7.A beneficial ownership table, also checking Schedule 13D / 13G amendments"
    params: {holders: [Entities affiliated with Zheng Huang, Entities affiliated with Tencent]}
    fail_if: "holdings of entities affiliated with Zheng Huang or with Tencent fall by more than 20% in any year"
    rule: {op: decrease, threshold: 20, unit: "%", consecutive: 1, period: year, note: "the year-on-year decline is computed separately for each group in params.holders, and the test fails if either group triggers"}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2027-04
    baseline: {value: [1409744080, 783468116], unit: shares, as_of: 2026-03-18, source: PDD-20F-FY2025#p121, note: "Both groups' share counts are the same as in the March 2021 filings: Zheng Huang's Schedule 13G/A Amendment No. 2 (event date 2021-03-17) reports 1,409,744,080 shares [src:PDD-SC13GA-2021-03-18], and Tencent's Schedule 13D/A Amendment No. 4 (2021-03-24) reports 783,468,116 shares [src:PDD-SC13DA-2021-03-24]; before that, the FY2020 20-F listed 783,217,772 shares for the Tencent group, per its 13D/A of November 2020 [src:PDD-20F-FY2020#Item6.E]. A check on 2026-09-24 of EDGAR's filing index for the company (including filings by others with the company as subject) shows no new 13D amendment after Tencent's 13D/A of 2021-03-24, and no new 13D or 13G filing by the Zheng Huang side after 2021-03-18 [src:PDD-WEB-2026-09-24-2]. The 20-F copies the 13D/A of 2021-03-24 for the Tencent group [src:PDD-20F-FY2025#p122], so the “unchanged” part for Tencent is a result of the filing basis. The report says both groups' share counts have not changed since 2021 [src:PDD-RPT1-2026-09-16#p15]. Zheng Huang is also the sole director of Quantum Dot (wholly owned by Qubit Partners) [src:PDD-20F-FY2025#p122], which is outside the scope of this test"}
    note: "Thesis breaker No. 8. Reading only the annual 20-F could miss a change at Tencent: a 13D/A amendment can appear at any time, and is read when it appears and compared with the reading a year earlier."

  - id: PDD-L4
    type: qualitative
    claim: "Temu's operations in the US and the EU are not cut off by regulators"
    origin: report:breaker
    severity: breaker
    covers: [regulation, growth]
    pillar: P5
    question: "Does this period's filing or a regulatory announcement disclose that Temu has been barred from operating in either the US or the EU, or required to localize its ownership, or that the European Commission has rejected its DSA action plan and started periodic penalty payments?"
    fail_if: "yes"
    judge: independent_model
    evidence: required
    where: "6-K announcements; 20-F risk factors and legal proceedings; press releases and decisions of the European Commission in the Temu Digital Services Act case (formal proceedings opened on 2024-10-31 [src:EC-IP-24-5622]); official US government documents on a ban on Temu or a requirement to localize its ownership. The last two are outside the company's filings; they are supplied as additional inputs at judgment and registered in sources.yml when first cited (the Commission's IP/24/5622 and IP/26/1178 are already registered)"
    lookback: 1
    effective_from: FY2026Q3
    baseline: {value: "On 2026-05-28 the European Commission adopted a non-compliance decision against Temu under the Digital Services Act and fined it, and Temu must submit an action plan by 2026-08-28", source: EC-IP-26-1178, note: "The fine is €200 million, for Temu's failure to diligently identify, analyze and assess the systemic risks of illegal products on its platform [src:EC-IP-26-1178]. According to the press release, the European Board for Digital Services gives its opinion within one month of receiving the plan, and the Commission then takes a final decision within one month; non-compliance can bring periodic penalty payments [src:EC-IP-26-1178]. As of this archive's as_of (2026-09-24), the 28 August deadline has passed; the company's Q2 earnings release of 2026-08-25 does not mention the decision or the action plan [src:PDD-6K-2026-08-25#EX-99.1], and whether the plan was submitted, and the Commission's subsequent decision, are to be read at judgment"}
    note: "Thesis breaker No. 9; the report expects the final DSA decision around the end of 2026 [src:PDD-RPT1-2026-09-16#p27]."

  - id: PDD-Q16
    type: quantitative
    claim: "Other income/(loss) does not stay so large for so long that profits can no longer be explained"
    origin: report:breaker
    severity: breaker
    covers: [governance]
    pillar: P4
    metric_def:
      id: other_income_to_op_year
      description: "Absolute value of other income/(loss), net (Other income, net) ÷ the year's operating profit"
      unit: "%"
      frequency: year
      data: filing_text
      formula: abs(other_income_net) / operating_profit
      where: "20-F consolidated statements of income and notes; quarterly 6-Ks for interim tracking"
    fail_if: "for two consecutive fiscal years, the absolute value of “other income/(loss), net” exceeds 20% of that year's operating profit, and the company still does not disclose its composition"
    rule:
      all_of:
        - {metric: other_income_to_op_year, op: ">", threshold: 20, unit: "%", consecutive: 2, period: year}
        - {op: event, threshold: "that year's annual report still does not disclose the composition of other income/(loss), net (taken from PDD-L8's judgment on that year's annual report)", period: year}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2027-04
    baseline: {value: [5.0, 2.9, 2.9], unit: "%", period: FY2023–FY2025, source: PDD-20F-FY2025#p103, note: "Absolute value of other income, net ÷ the year's operating profit (this archive's calculation) [src:PDD-20F-FY2025#p103]; FY2025 is RMB 2,726,933 thousand against RMB 93,102,131 thousand [src:PDD-20F-FY2025#p103]. This line was −RMB 9.430 billion in the first half of 2026 [src:PDD-6K-2026-08-25#EX-99.1], and the company did not explain its composition in the earnings release; the report says the company attributes it to overseas non-operating items [src:PDD-RPT1-2026-09-16#p8], a claim that is not in the filings and appears only in third-party accounts (L2 only)"}
    note: "Thesis breaker No. 10. Both legs must hold; the event leg comes from PDD-L8's independent judgment, which must cite its source with an excerpt of the original text. In this test's ratio, a fine counts in the fiscal year in which it is booked, not by its decision date. Large unexplained losses consume cash, so this test also bears on pillar P3."

  - id: PDD-L5
    type: qualitative
    claim: "Ranking power does not move elsewhere: as shopping agents rise, Pinduoduo's product catalog stays within the mainstream protocols"
    origin: report:breaker
    severity: breaker
    covers: [moat, competition]
    pillar: P2
    question: "Among the three domestic gateways WeChat, Taobao and Douyin, has any one adopted an agentic shopping protocol; and if so, is Pinduoduo's product catalog unreadable through that protocol (excluded or self-closed) while the catalog of at least one of Taobao/Tmall, JD.com and Douyin E-commerce can be read? If none of the three gateways has yet adopted any agentic shopping protocol, answer “no”."
    fail_if: "yes (the criterion is the protocol's list of participants)"
    judge: independent_model
    evidence: required
    where: "Official announcements by the three gateways that they have adopted an agentic shopping protocol, and the public lists of merchants/platforms connected to the protocol adopted; company announcements and 6-Ks. Most of this evidence is outside the company's filings and is registered in sources.yml when first cited"
    lookback: 1
    effective_from: FY2026Q3
    baseline: {value: "Agentic commerce protocols already exist abroad: the Agentic Commerce Protocol, an open standard co-developed by Stripe and OpenAI, was released on 2025-09-29, and Instant Checkout in ChatGPT launched in the US the same day", source: STRIPE-NEWS-2025-09-29, note: "The report says that abroad, discovery and price comparison have moved into agents while transaction execution has not yet [src:PDD-RPT1-2026-09-16#p13]; the source of this sentence, [27], is listed by the report as secondary [src:PDD-RPT1-2026-09-16#p30], L2 only, no primary data seen, and it is not used as a baseline criterion (OpenAI's own page could not be read). The report expects the adoption by domestic gateways to become readable in 2027–2028 [src:PDD-RPT1-2026-09-16#p27]"}
    note: "Thesis breaker No. 11, the first step of ranking power moving elsewhere. The report writes “WeChat, Taobao, Douyin and others”; at registration this test closed the gateways to these three and set the peers as Taobao/Tmall, JD.com and Douyin E-commerce (the peers in section 07 of the report plus content commerce), and any change must be written down before judgment."

  - id: PDD-Q17
    type: quantitative
    claim: "If Xinpinmu is indeed self-operated, its inventory does not end in large write-downs"
    origin: report:breaker
    severity: breaker
    covers: [capital_allocation, management]
    pillar: P5
    metric_def:
      id: selfop_inventory_impairment
      description: "Cumulative write-downs of inventory related to Xinpinmu's self-operated business"
      unit: RMB 100 million
      frequency: year
      data: filing_text
      where: "20-F inventory note and consolidated statements of income; 6-K announcements"
    fail_if: "at Xinpinmu's three-year review (the 2028 annual report), write-downs of self-operated inventory exceed half of the initial capital injection of RMB 15 billion"
    rule: {metric: selfop_inventory_impairment, op: ">", threshold: 75, unit: RMB 100 million, period: year, evaluate_on: [FY2027], note: "half of the initial capital injection of RMB 15 billion [src:PDD-RPT1-2026-09-16#p5]"}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2028-04
    baseline: {value: null, unit: RMB 100 million, as_of: 2026-06-30, source: PDD-6K-2026-08-25#EX-99.1, note: "The asset side of the 2026-06-30 balance sheet has no inventory line, so this indicator has no reading yet [src:PDD-6K-2026-08-25#EX-99.1]. The initial cash contribution of RMB 15 billion on which the threshold rests, and the three-year planned investment of RMB 100 billion, appear only in media reports (reportedly the figures the company officially announced on 2026-03-25), and SEC filings do not disclose the amounts, L2 only, no primary data seen [src:PDD-RPT1-2026-09-16#p5]; the first-quarter release says only that significant resources will be committed to building a first-party brand business, with no amount [src:PDD-6K-2026-05-28#EX-99.1]"}
    note: "The first branch of thesis breaker No. 12; the “silent exit” branch is PDD-L7, and if either fails, No. 12 is triggered. At registration, “the 2028 annual report” was read as the FY2027 20-F published around April 2028: the report's timeline places it between the annual report of 2027-04 and 2028-07 [src:PDD-RPT1-2026-09-16#p3], and the report names annual reports by publication date (e.g. “the annual report of April 2027”) [src:PDD-RPT1-2026-09-16#p25]. The initial injection of RMB 15 billion in the rule's note is likewise L2 only (not disclosed in SEC filings) [src:PDD-RPT1-2026-09-16#p5]; the threshold is registered and is not changed this period, and if a primary filing later gives a different initial injection, it will be registered separately with a new effective_from. Whether Xinpinmu is self-operated or an integrated foreign-trade services module cannot yet be told [src:PDD-RPT1-2026-09-16#p6]: in its first-quarter release of 2026-05-27, the company said it would commit significant resources to building a first-party brand business [src:PDD-6K-2026-05-28#EX-99.1], but it did not name Xinpinmu or disclose the model or the accounting treatment, and as of 2026-06-30 the balance sheet still has no inventory line [src:PDD-6K-2026-08-25#EX-99.1]; the criteria between the two readings are whether inventory appears on the balance sheet, and whether merchandise sales revenue reappears in the income statement, from the third-quarter release on. If there is never an inventory line, this test has no reading."

  - id: PDD-L7
    type: qualitative
    claim: "If Xinpinmu is indeed self-operated, it will not, like the “merchandise sales” of 2021, be scaled down and then no longer shown separately without the company explaining why"
    origin: report:breaker
    severity: breaker
    covers: [capital_allocation, management]
    pillar: P5
    question: "Does this period's 20-F or 6-K show that Xinpinmu's self-operated business has stopped (for example, a “merchandise sales” line in the income statement or an inventory line on the balance sheet disappears after having appeared, or the business is shut down or turned into a pure services module), without the company explaining why in its filings? If Xinpinmu has never operated on a self-operated basis (no inventory line or merchandise sales revenue has ever appeared), answer “no”."
    fail_if: "yes"
    judge: independent_model
    evidence: required
    where: "The 20-F at the three-year review (read at registration as the FY2027 20-F published around April 2028, for the reasons in PDD-Q17) and the 6-Ks before it; the consolidated statements of income, balance sheet and business overview"
    lookback: 6
    effective_from: FY2026Q3
    first_readable: 2028-04
    baseline: {value: "The 2026-06-30 balance sheet has no inventory line yet, and whether Xinpinmu is self-operated or an integrated foreign-trade services module cannot yet be told", source: PDD-6K-2026-08-25#EX-99.1, note: "The report judges it impossible to tell [src:PDD-RPT1-2026-09-16#p6]; the company's first-quarter release of 2026-05-27 says it will commit significant resources to building a first-party brand business, without naming Xinpinmu [src:PDD-6K-2026-05-28#EX-99.1]"}
    note: "The second branch of thesis breaker No. 12 (originally an event condition of PDD-Q17, turned into a qualitative test so that it is judged independently with citations); if either this test or PDD-Q17 fails, No. 12 is triggered. Precedent: merchandise sales revenue was RMB 7.25 billion in 2021 [src:PDD-6K-2022-03-22#EX-99.1], fell to RMB 209 million in 2022, and the FY2022 20-F explains the decline only with one phrase, “as we scaled down this aspect of our business”, without giving the reason for scaling it down [src:PDD-20F-FY2022#Item5.A]; from the FY2023 20-F on, this line is merged into “online marketing services and others” and no longer shown separately [src:PDD-20F-FY2023#Item5.A]. The precedent described in the claim was corrected in line with the first fact audit before this test took effect (FY2026Q3) (04A-4-03, 2026-09-25): the original wording “silent exit” did not match the primary filings; the judgment still follows the definition in the question: the self-operated business stops, without the company explaining why in its filings."

  # ---------- Section 09 of the report: the only positive breaker (revises the conclusion upward) ----------
  - id: PDD-Q18
    type: quantitative
    claim: "Shareholder returns are still zero, and the current conclusion assumes that cash cannot reach shareholders in full; the first return would overturn this assumption, and the thesis would have to be revised upward"
    origin: report:breaker
    severity: breaker
    covers: [capital_allocation, management]
    pillar: P3
    metric_def:
      id: shareholder_return_quarter
      description: "Shareholder returns in quarterly financing cash flows (repurchases of ordinary shares or ADSs + cash dividends); excluding repayment or repurchase of convertible bonds (the Repayment or repurchase of convertible bonds line in the cash flow statement does not count)"
      unit: RMB
      frequency: quarter
      data: filing_text
      formula: share_repurchases + dividends_paid
      where: "Cash flow data (financing activities) in Exhibit 99.1 of the quarterly 6-K; annual figures checked against the 20-F consolidated statements of cash flows"
    fail_if: "any non-zero shareholder return appears in quarterly financing cash flows"
    rule: {op: ">", threshold: 0, unit: RMB, consecutive: 1, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 0, unit: RMB, period: FY2025, source: PDD-20F-FY2025#p157, note: "FY2025 financing activities were repayment of convertible bonds of RMB 5,228,716 thousand and other items of RMB 1,363 thousand, with no buybacks or dividends [src:PDD-20F-FY2025#p157]. Shareholder returns since listing are zero: the 20-F says PDD Holdings Inc. has never declared or paid cash dividends [src:PDD-20F-FY2025#p17], and Item 16E is Not applicable [src:PDD-20F-FY2025#p140]; the consolidated statements of cash flows for 2018–2025 have no buyback or dividend line under financing activities [src:PDD-20F-FY2020#Item18] [src:PDD-20F-FY2022#F-11] [src:PDD-20F-FY2025#p157], and the only repurchase of ordinary shares in the XBRL summary data is one in 2017, before the listing [src:PDD-WEB-2026-09-24-1]; the absolute value of financing cash flow in the first half of 2026 was less than RMB 1 million [src:PDD-6K-2026-08-25#EX-99.1]. The report says the same [src:PDD-RPT1-2026-09-16#p3]"}
    note: "A positive trigger, not a deterioration. The report says this is the only event in the whole report that can revise the conclusion upward within a single quarter [src:PDD-RPT1-2026-09-16#p26]. The spec's severity has only breaker and watch, and breaker is used here for now, to keep the rhythm of writing a conclusion within 7 days; the direction of the conclusion is an upward revision, and it does not count in the deterioration statistics (until the thesis-ci spec adds a way to write positive triggers, see todo). On the Q2 earnings call of 2024-08-26, management said that buybacks or dividends are not appropriate now, nor necessary in the foreseeable next few years (say-do ledger PDD-M3, earnings-call remark as reported by third parties, not in the filings) [src:PDD-RPT1-2026-09-16#p14]; of that statement, the dividend half has a primary statement: the 20-F says there is no present plan to pay cash dividends in the foreseeable future [src:PDD-20F-FY2025#p17]."

  # ---------- Added after the audit: two signals in the report that no test watched before (manual) ----------
  - id: PDD-Q19
    type: quantitative
    claim: "Temu's second form sustains itself under the tariff reset and the DSA: transaction services revenue has not dropped to single-digit growth"
    origin: manual
    severity: watch
    covers: [growth, competition]
    pillar: P5
    metric: segment_revenue_yoy
    params: {segment: Transaction services, segment_zh: Transaction services, basis: reported basis}
    fail_if: "transaction services revenue growth turns single-digit year on year (below 10%)"
    rule: {op: "<", threshold: 10, unit: "%", consecutive: 1, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 13.3, unit: "%", period: FY2026Q2, source: PDD-6K-2026-08-25#EX-99.1, note: "Revenue note: 54,721 ÷ 48,282 − 1 = 13.3% [src:PDD-6K-2026-08-25#EX-99.1]; first half of 2026: 111,014 ÷ 95,232 − 1 = 16.6% (RMB million, this archive's calculation) [src:PDD-6K-2026-08-25#EX-99.1]. The report infers that the second quarter includes shipments pulled forward ahead of the EU's per-item duty taking effect, which cannot be separated out [src:PDD-RPT1-2026-09-16#p11]; this is the report's inference, and the company's earnings release does not mention tariffs or pulled-forward shipments [src:PDD-6K-2026-08-25#EX-99.1]"}
    note: "The design audit pointed out that pillar P5 has no direct reading apart from total revenue (PDD-Q1) and the ban breaker (PDD-L4). The criterion comes from the report: the signal on the tariff path is the growth of transaction services revenue [src:PDD-RPT1-2026-09-16#p13], and the mediocre-leaning branch of fork ① is transaction services turning single-digit [src:PDD-RPT1-2026-09-16#p27]. Transaction services contain Temu's fulfillment chain but also domestic commissions and service fees, so the reading is not the same as Temu [src:PDD-RPT1-2026-09-16#p4]."

  - id: PDD-L9
    type: qualitative
    claim: "Conduct during enforcement does not get worse: no further official finding of “obstructing enforcement”"
    origin: manual
    severity: watch
    covers: [regulation, management, culture]
    pillar: P4
    question: "In this period's filings or regulators' announcements, has a regulator found in a formal document (an administrative penalty decision, a notice or a press release) that the company or its subsidiaries refused to provide materials, provided false materials, or otherwise obstructed regulatory enforcement? Only new findings made after the decision of 2026-04-17 (Guo Shi Jian Chu Fa [2026] No. 22 [src:SAMR-CF-2026-22]) count."
    fail_if: "yes"
    judge: independent_model
    evidence: required
    where: "6-K announcements; 20-F Item 8.A legal proceedings and risk factors; penalty decisions, notices and press releases of SAMR and other regulators in and outside China"
    lookback: 1
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: "Decision Guo Shi Jian Chu Fa [2026] No. 22 (2026-04-17) records that “the party repeatedly refused without good reason to provide relevant materials and information, or provided false materials and information, and even used violence, soft resistance and other means to obstruct regulatory enforcement”", source: SAMR-CF-2026-22, note: "The party is Shanghai Xunmeng Information Technology Co., Ltd., the operating entity of the Pinduoduo platform [src:SAMR-CF-2026-22]; the report cites the same decision [src:PDD-RPT1-2026-09-16#p15]"}
    note: "The design audit pointed out that pillar P4 and the fifth permanent-loss path both depend on enforcement conduct not getting worse, and no test watched it before. The report treats this record in the decision as the hardest piece of evidence in the whole report [src:PDD-RPT1-2026-09-16#p29], lists a further official finding of “obstructing enforcement” as the mediocre-leaning branch of fork ⑧ [src:PDD-RPT1-2026-09-16#p27], and explains that under its rules enforcement conduct does not go into the discount rate, but into thesis breaker No. 7 and the watch on the “serious circumstances” tier [src:PDD-RPT1-2026-09-16#p22]. The report does not list it as a thesis breaker, so this test is a watch; if it fails, the company manager must state in the conclusion whether to treat it as a breaker."

