  # ---------- Section 09 of the report: the five watch indicators to read every quarter (watch) ----------
  - id: PDD-Q5
    type: quantitative
    claim: "Pricing power has not peaked: domestic online marketing revenue keeps growing"
    origin: report:watch
    severity: watch
    covers: [pricing_power, moat]
    pillar: P2
    metric: segment_revenue_yoy
    params: {segment: Online marketing services and others, segment_zh: Online marketing services and others, basis: reported basis}
    fail_if: "≤ 0% for two consecutive quarters"
    rule: {op: "<=", threshold: 0, unit: "%", consecutive: 2, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 3.5, unit: "%", period: FY2026Q2, source: PDD-6K-2026-08-25#EX-99.1, note: "Revenue note: 57,637 ÷ 55,703 − 1 = 3.47% (RMB million, this archive's calculation) [src:PDD-6K-2026-08-25#EX-99.1]"}
    note: "Watch indicator No. 1. Read against Alibaba's customer management revenue on a comparable basis (the same calendar quarter, i.e. the first quarter of Alibaba's fiscal FY2027: customer management revenue −7% year on year, and +1% on a like-for-like basis excluding the revenue offset from new business development programs [src:BABA-6K-2026-08-20#EX-99.1]): if both move the same way, it is an industry-wide margin concession; if only Pinduoduo does not recover, the explanation of a deliberate margin concession is weakened."

  - id: PDD-Q6
    type: quantitative
    claim: "Margin concessions are a phase of investment, not a new permanent cost structure"
    origin: report:watch
    severity: watch
    covers: [pricing_power, unit_economics]
    pillar: P2
    metric_def:
      id: operating_margin_ttm
      description: "Operating margin: total operating profit ÷ total revenue over the trailing four quarters; if a “merchandise sales” line reappears in the income statement, read the platform business on its own (excluding merchandise sales revenue and its cost)"
      unit: "%"
      frequency: quarter
      data: filing_text
      formula: sum(operating_profit, 4q) / sum(revenue, 4q)
      where: "The unaudited consolidated statements of income in Exhibit 99.1 of the quarterly 6-K, added up quarter by quarter"
    fail_if: "< 18% for two consecutive quarters"
    rule: {op: "<", threshold: 18, unit: "%", consecutive: 2, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 21.9, unit: "%", period: TTM to FY2026Q2, source: PDD-20F-FY2025#p103, note: "As F7: on the 20-F basis (2025Q3 + 2025Q4 derived as the 20-F full-year figure less the first half of 2025 as released, including the April 2026 domestic penalty, and 2026Q1 + 2026Q2 as released), 98,553.1 ÷ 450,775.7 = 21.9% (RMB million, this archive's calculation) [src:PDD-20F-FY2025#p103] [src:PDD-6K-2026-08-25#EX-99.1]; adding up the earnings releases quarter by quarter (2025Q4 as released before the penalty was booked) gives 22.2% [src:PDD-6K-2026-03-26#EX-99.1], which is the current value in the report's indicator table [src:PDD-RPT1-2026-09-16#p25]"}
    note: "Watch indicator No. 2; the current value in the indicator table is TTM, so it is read as TTM. Quarterly figures are the ones the company itself presents in its earnings 6-K (or 20-F), and the prior-year figure for a year-on-year comparison is the comparative presented in the current filing; where they differ from the audited 20-F, the company's figures are used as they are and the difference is recorded in the reading's explanation (for example, the earnings-release figure for Q4 2025 operating profit does not include the April 2026 fine, see F9). In this test's ratio, a fine counts in the fiscal year in which it is booked, not by its decision date: the domestic penalty is in FY2025 with the 20-F (this archive's inference from the difference, see F9) and in no quarter of FY2026; for Q4 2025 only the single-quarter figure presented in the earnings release exists, so the reading takes the released figure under the rule in the previous sentence and records the difference from the 20-F of RMB 1,521,930 thousand [src:PDD-20F-FY2025#p153] [src:PDD-6K-2026-03-26#EX-99.1]. operating_margin_ttm is also referenced by PDD-Q13 (copied into its metric_def.components), and the two definitions must be changed together."

  - id: PDD-Q7
    type: quantitative
    claim: "Merchant float (the public proxy for transaction volume since the company stopped disclosing GMV) is not shrinking"
    origin: report:watch
    severity: watch
    covers: [moat, returns_on_capital]
    pillar: P1
    metric_def:
      id: merchant_float
      description: "Merchant float = payable to merchants + merchant deposits (quarter-end balances)"
      unit: RMB 100 million
      frequency: quarter
      data: filing_text
      formula: payable_to_merchants + merchant_deposits
      where: "The unaudited consolidated balance sheet in Exhibit 99.1 of the quarterly 6-K (Payable to merchants, Merchant deposits)"
    fail_if: "down year on year for two consecutive quarters"
    rule: {op: decrease, threshold: 0, unit: "%", consecutive: 2, period: quarter, note: "year-on-year change against the quarter-end balance a year earlier"}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 1285, unit: RMB 100 million, as_of: 2026-06-30, source: PDD-6K-2026-08-25#EX-99.1, note: "Payable to merchants 109,924 + merchant deposits 18,545 = RMB 128,469 million (this archive's calculation) [src:PDD-6K-2026-08-25#EX-99.1]"}
    note: "Watch indicator No. 3. The company last disclosed GMV for full-year 2021 (earnings release of 2022-03-21) [src:PDD-6K-2022-03-22#EX-99.1], and since then merchant float has served as the public proxy for transaction volume. A decline can be read two ways: shrinking transaction volume, or payment terms and deposit rules flattened by regulators; either way, check at the same time whether new rules came in that period. The year-on-year comparison needs the quarter-end balance a year earlier; the backfill list is in todo."

  - id: PDD-Q8
    type: quantitative
    claim: "The pace and capital intensity of the self-operated investment stay under control, and heavy assets do not eat into the platform's margin"
    origin: report:watch
    severity: watch
    covers: [capital_allocation, returns_on_capital]
    pillar: P5
    metric_def:
      id: ppe_plus_inventory
      description: "Property, equipment and software, net + inventory (if any); a reading of the pace and capital intensity of the investment in self-operated brands"
      unit: RMB 100 million
      frequency: quarter
      data: filing_text
      formula: ppe_and_software_net + inventory
      where: "The unaudited consolidated balance sheet in Exhibit 99.1 of the quarterly 6-K"
      components:
        platform_op_margin_ttm_yoy_pp:
          description: "Year-on-year change in the platform business's operating margin (total operating profit ÷ total revenue over the trailing four quarters), i.e. the TTM value at this quarter-end less the TTM value at the same quarter-end a year earlier, in percentage points; when a “merchandise sales” line appears in the income statement, merchandise sales revenue and its cost are excluded (operating expenses that cannot be split are all counted in the platform basis), and when it does not, this is the consolidated basis"
          unit: pp
          where: "The unaudited consolidated statements of income in Exhibit 99.1 of the quarterly 6-K, added up quarter by quarter"
    fail_if: "total > RMB 50 billion while the platform business's operating margin has not improved alongside (compared with the TTM value at the same quarter-end a year earlier)"
    rule:
      all_of:
        - {metric: ppe_plus_inventory, op: ">", threshold: 500, unit: RMB 100 million, period: quarter}
        - {metric: ppe_plus_inventory.platform_op_margin_ttm_yoy_pp, op: "<=", threshold: 0, unit: pp, period: quarter, note: "“not improved alongside” means the platform business's TTM operating margin is no higher than at the same quarter-end a year earlier"}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 47.5, unit: RMB 100 million, as_of: 2026-06-30, source: PDD-6K-2026-08-25#EX-99.1, note: "Property, equipment and software, net RMB 4,752 million, and the balance sheet has no inventory line yet [src:PDD-6K-2026-08-25#EX-99.1]"}
    note: "Watch indicator No. 4. Whether an inventory line appears is the first criterion for whether Xinpinmu is self-operated or an integrated foreign-trade services module. The report does not say what base period “not improved alongside” compares against; at registration it was set as year on year (the platform business's TTM operating margin against the same quarter-end a year earlier), and any change must be merged before the earnings release for the quarter concerned is published. Quarterly figures are the ones the company itself presents in its earnings 6-K (or 20-F), and the prior-year figure for a year-on-year comparison is the comparative presented in the current filing; where they differ from the audited 20-F, the company's figures are used as they are and the difference is recorded in the reading's explanation (for example, the earnings-release figure for Q4 2025 operating profit does not include the April 2026 fine, see F9). In the platform business's operating margin, a fine counts in the fiscal year in which it is booked, not by its decision date: the domestic penalty is in FY2025 with the 20-F (this archive's inference from the difference, see F9) and in no quarter of FY2026. ppe_plus_inventory is also referenced by PDD-Q13 (copied into its metric_def.components), and the two definitions must be changed together."

  - id: PDD-Q9
    type: quantitative
    claim: "The statements stay readable: non-operating items do not swamp operating profit"
    origin: report:watch
    severity: watch
    covers: [governance]
    pillar: P4
    metric_def:
      id: nonop_total_to_op
      description: "Absolute value of the sum of the three non-operating items (interest and investment income, net + foreign exchange gain/loss + other income/(loss), net) ÷ the quarter's operating profit"
      unit: "%"
      frequency: quarter
      data: filing_text
      formula: abs(interest_and_investment_income + fx_gain_loss + other_income_net) / operating_profit_q
      where: "The unaudited consolidated statements of income and notes in Exhibit 99.1 of the quarterly 6-K"
    fail_if: "the absolute value of the sum of the three non-operating items in a quarter > 50% of that quarter's operating profit"
    rule: {op: ">", threshold: 50, unit: "%", consecutive: 1, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 20.0, unit: "%", period: FY2026Q2, source: PDD-6K-2026-08-25#EX-99.1, note: "Three-month column of the income statement: interest and investment income, net 13,505, foreign exchange loss (558), other income/(loss), net (7,399), a total of +RMB 5,548 million, which is 20.0% of the quarter's operating profit of RMB 27,764 million (this archive's calculation) [src:PDD-6K-2026-08-25#EX-99.1]; the first quarter (six-month column less three-month column) is −632 − 145 − 2,031 = −RMB 2,808 million, whose absolute value is 14.4% of that quarter's operating profit of RMB 19,566 million [src:PDD-6K-2026-08-25#EX-99.1] [src:PDD-6K-2026-05-28#EX-99.1]. Q2 other income/(loss), net of −RMB 7.399 billion is a single-quarter figure the company presents directly [src:PDD-6K-2026-08-25#EX-99.1]. The current value in the report's indicator table is the sum of the three items for the first half of 2026, +RMB 2.740 billion (RMB 12,873 − 703 − 9,430 million), a signed half-year amount, not a reading of this indicator [src:PDD-RPT1-2026-09-16#p26] [src:PDD-6K-2026-08-25#EX-99.1]"}
    note: "The first branch of watch indicator No. 5; the branch “composition not disclosed for two consecutive years” is PDD-L8, and if either fails, indicator No. 5 is triggered. In this test, a fine counts in the quarter in which it is booked, not by its decision date; also watch whether the European Commission's €200 million DSA fine of 2026-05-28 lands in these items [src:EC-IP-26-1178]. Large non-operating losses consume cash, so this test also bears on pillar P3."

  - id: PDD-L8
    type: qualitative
    claim: "The statements stay readable: the composition of “other income/(loss), net” is disclosed"
    origin: report:watch
    severity: watch
    covers: [governance]
    pillar: P4
    question: "Does this period's annual report (20-F) disclose the composition of “other income/(loss), net” (Other income, net), that is, its main items and their amounts?"
    fail_if: "no, and the previous fiscal year's annual report did not disclose it either (i.e. the composition undisclosed for two consecutive years)"
    judge: independent_model
    evidence: required
    where: "The consolidated statements of income, the notes to the financial statements and the Item 5 operating review in this period's and the previous fiscal year's 20-F; related explanations in the quarterly 6-Ks for reference"
    lookback: 5
    effective_from: FY2026Q3
    first_readable: 2027-04
    baseline: {value: "The operating review in the FY2025 20-F gives only the amount of other income, net, without explaining its composition", source: PDD-20F-FY2025#p105, note: "This line was −RMB 9.430 billion in the first half of 2026, of which −RMB 7.399 billion in the second quarter [src:PDD-6K-2026-08-25#EX-99.1]; 6-K Exhibit 99.1 gives only the amounts, without explaining the composition or cause [src:PDD-6K-2026-08-25#EX-99.1]. The report says the company attributes it to overseas non-operating items [src:PDD-RPT1-2026-09-16#p8], but the report gives no source for that sentence, which is not in the filings and appears only in third-party accounts (L2 only), so it is not used as a baseline"}
    note: "The second branch of watch indicator No. 5 (originally an event condition of PDD-Q9, turned into a qualitative test so that it is judged independently with citations). The “still does not disclose the composition” leg of PDD-Q16 (thesis breaker No. 10) takes this test's judgment on that year's annual report."

  # ---------- Section 09 of the report: thesis breakers (breaker; if one triggers, the thesis is void and the 7-day conclusion process starts) ----------
  - id: PDD-Q10
    type: quantitative
    claim: "Domestic monetization power has not been taken away by the market"
    origin: report:breaker
    severity: breaker
    covers: [pricing_power, moat, competition]
    pillar: P2
    metric: segment_revenue_yoy
    params: {segment: Online marketing services and others, segment_zh: Online marketing services and others, basis: reported basis}
    fail_if: "online marketing services revenue down year on year for four consecutive quarters"
    rule: {op: "<", threshold: 0, unit: "%", consecutive: 4, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 3.5, unit: "%", period: FY2026Q2, source: PDD-6K-2026-08-25#EX-99.1, note: "Revenue note: 57,637 ÷ 55,703 − 1 = 3.47% (RMB million, this archive's calculation) [src:PDD-6K-2026-08-25#EX-99.1]"}
    note: "Thesis breaker No. 1."

  - id: PDD-Q11
    type: quantitative
    claim: "The operating margin holds above the level of profitability the thesis depends on"
    origin: report:breaker
    severity: breaker
    covers: [unit_economics, pricing_power]
    pillar: P2
    metric_def:
      id: operating_margin_6k
      description: "Quarterly operating margin (operating profit ÷ revenue), on the foreign private issuer's quarterly basis. If a “merchandise sales” line appears in the income statement, judge on the platform-business basis (excluding merchandise sales revenue and its cost, as in PDD-Q6), with the consolidated basis alongside"
      unit: "%"
      frequency: quarter
      data: filing_text
      formula: operating_profit_q / revenue_q
      where: "The unaudited consolidated statements of income in Exhibit 99.1 of the quarterly 6-K"
    fail_if: "operating margin below 15% for four consecutive quarters"
    rule: {op: "<", threshold: 15, unit: "%", consecutive: 4, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 24.7, unit: "%", period: FY2026Q2, source: PDD-6K-2026-08-25#EX-99.1, note: "27,764 ÷ 112,358 (RMB million, this archive's calculation) [src:PDD-6K-2026-08-25#EX-99.1]"}
    note: "Thesis breaker No. 2. The report does not say whether this is quarterly or TTM; at registration it was set to be read quarterly: when all four single quarters are below 15%, the TTM operating margin used as the starting point of the valuation in section 08 must also be below 15%, which meets “the starting point is void”, and it triggers earlier than reading TTM over four consecutive quarters [src:PDD-RPT1-2026-09-16#p26]; early warning on the TTM basis is PDD-Q6's job. If the “merchandise sales” line appears, judge on the platform-business basis: the report warns that self-operated sales recognized on a gross basis would pull the consolidated margin down, and the success of the option must not be misread as the thesis being void [src:PDD-RPT1-2026-09-16#p25]. Any change to these two readings must be merged before the earnings release for the quarter concerned is published. Quarterly figures are the ones the company itself presents in its earnings 6-K (or 20-F), and the prior-year figure for a year-on-year comparison is the comparative presented in the current filing; where they differ from the audited 20-F, the company's figures are used as they are and the difference is recorded in the reading's explanation (for example, the earnings-release figure for Q4 2025 operating profit does not include the April 2026 fine, see F9). In this test's margin, a fine counts in the fiscal year in which it is booked, not by its decision date: the domestic penalty is in FY2025 with the 20-F (this archive's inference from the difference, see F9) and in no quarter of FY2026."

  - id: PDD-Q12
    type: quantitative
    claim: "The negative-invested-capital engine is not running in reverse"
    origin: report:breaker
    severity: breaker
    covers: [moat, returns_on_capital]
    pillar: P1
    metric_def:
      id: merchant_float
      description: "Merchant float = payable to merchants + merchant deposits (quarter-end balances)"
      unit: RMB 100 million
      frequency: quarter
      data: filing_text
      formula: payable_to_merchants + merchant_deposits
      where: "The unaudited consolidated balance sheet in Exhibit 99.1 of the quarterly 6-K (Payable to merchants, Merchant deposits)"
    fail_if: "merchant float down year on year for four consecutive quarters"
    rule: {op: decrease, threshold: 0, unit: "%", consecutive: 4, period: quarter, note: "year-on-year change against the quarter-end balance a year earlier"}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline: {value: 1285, unit: RMB 100 million, as_of: 2026-06-30, source: PDD-6K-2026-08-25#EX-99.1, note: "Payable to merchants 109,924 + merchant deposits 18,545 = RMB 128,469 million (this archive's calculation) [src:PDD-6K-2026-08-25#EX-99.1]"}
    note: "Thesis breaker No. 3; the same metric as PDD-Q7, with a stricter threshold. metric_def is word for word the same as in PDD-Q7, and a change must be made in both places."

  - id: PDD-Q13
    type: quantitative
    claim: "Cash is not consumed by large acquisitions or by low-return, asset-heavy self-operated business"
    origin: report:breaker
    severity: breaker
    covers: [capital_allocation, returns_on_capital]
    pillar: P5
    metric_def:
      id: cash_acquisition_amount
      description: "Amount of cash acquisitions announced by the company (a single deal, or cumulative within a year); foreign-currency amounts use the RMB amount the company discloses, or if none is disclosed, are converted at the RMB central parity rate published by the People's Bank of China on the announcement date"
      unit: RMB 100 million
      frequency: event
      data: filing_text
      where: "6-K announcements, 20-F Item 4 and Item 5, investing activities in the cash flow statement"
      components:
        acquisition_amount:
          description: "Total consideration of a single acquisition announced by the company, whether paid in cash, shares or a mix; foreign-currency conversion as for cash_acquisition_amount"
          unit: RMB 100 million
          where: "6-K announcements, 20-F Item 4 and Item 5"
        ppe_plus_inventory:
          description: "Property, equipment and software, net + inventory (if any); a reading of the pace and capital intensity of the investment in self-operated brands"
          unit: RMB 100 million
          where: "The unaudited consolidated balance sheet in Exhibit 99.1 of the quarterly 6-K"
        operating_margin_ttm:
          description: "Operating margin: total operating profit ÷ total revenue over the trailing four quarters; if a “merchandise sales” line reappears in the income statement, read the platform business on its own (excluding merchandise sales revenue and its cost)"
          unit: "%"
          where: "The unaudited consolidated statements of income in Exhibit 99.1 of the quarterly 6-K, added up quarter by quarter"
    fail_if: "the company announces cash acquisitions of more than RMB 150 billion, in a single deal or cumulatively within a year, or inventory + property and equipment related to self-operated brands totals more than RMB 100 billion while the platform business's operating margin has not returned above 20%"
    rule:
      any_of:
        - {metric: cash_acquisition_amount, op: ">", threshold: 1500, unit: RMB 100 million, period: event, note: "single deal or cumulative within a year"}
        - all_of:
            - {metric: cash_acquisition_amount.ppe_plus_inventory, op: ">", threshold: 1000, unit: RMB 100 million, period: quarter, note: "the company gives no segment disclosure, so consolidated inventory plus property and equipment is read as a proxy"}
            - {metric: cash_acquisition_amount.operating_margin_ttm, op: "<", threshold: 20, unit: "%", period: quarter, note: "read for the platform business alone"}
    warn_if: "a single acquisition of more than RMB 50 billion, whatever the payment method (listed by the report as a negative signal for cash availability)"
    warn_rule: {metric: cash_acquisition_amount.acquisition_amount, op: ">", threshold: 500, unit: RMB 100 million, period: event, note: "single deal, by total consideration"}
    data: filing_text
    effective_from: FY2026Q3
    baseline: {value: "no major acquisitions since listing", source: PDD-20F-FY2025#p72, note: "The history in 20-F Item 4.A shows no acquisitions after listing, only an intra-group reorganization in 2016 [src:PDD-20F-FY2025#p72]; investing cash flows in 2023–2025 have no line for acquisitions of subsidiaries or businesses [src:PDD-20F-FY2025#p157]; the report says the same [src:PDD-RPT1-2026-09-16#p3]"}
    note: "Thesis breaker No. 4. The warning threshold comes from the negative signal in the paragraph on the positive breaker in section 09; the report says “acquisition” without limiting it to cash, so the warning is read by total consideration, while the breaker's cash-acquisition leg is limited to cash, as in the report's text [src:PDD-RPT1-2026-09-16#p26]. The report warns that the margin criterion must be read for the platform business alone, or the success of the self-operated option would be misread as the thesis being void [src:PDD-RPT1-2026-09-16#p25]. The precise wording of the rule's phrase “the company gives no segment disclosure” is: the company has only one operating and reportable segment (e-commerce services) and does not disclose a split by business or region [src:PDD-20F-FY2025#p167], so the self-operated part can only be read through consolidated inventory plus property and equipment as a proxy. The ppe_plus_inventory and operating_margin_ttm used by the rule copy the definitions of PDD-Q8 and PDD-Q6 into metric_def.components, and must be changed in step with them. Large acquisitions and heavy assets both consume cash, so this test also guards pillar P3."

  - id: PDD-L2
    type: qualitative
    claim: "Audit inspections are not interrupted again, and the ADSs face no trading ban under the Holding Foreign Companies Accountable Act"
