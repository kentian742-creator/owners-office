thesis:
  summary: "拼多多与 Temu 是同一套机制在国内外的两份复制：聚合需求、把大订单交给中国工厂、以低价换规模 [src:PDD-RPT1-2026-09-16#p4]，20-F 称两个平台的价值主张与运营模式相同、目前都主要服务中国商家 [src:PDD-20F-FY2025#p6]。平台不控制商家的商品 [src:PDD-20F-FY2025#p164]，截至 2026-06-30 资产负债表上没有存货科目，靠商家的钱运转：经营性投入资本为负 1,829 亿元（2026-06-30，本档案按资产负债表科目归类计算，公司未披露该口径，算式见 F1），零有息负债 [src:PDD-6K-2026-08-25#EX-99.1]。生意本身的证据充分，决定所有者结果的三个变量却都不在生意里：排序权能否保住、现金能否到达股东、与监管的姿态往哪边走 [src:PDD-RPT1-2026-09-16#p3]。在线营销服务及其他收入（集团口径，公司只有一个分部，不按平台或地区拆分 [src:PDD-20F-FY2025#p167]）2026 年二季度同比只增长 3.5% [src:PDD-6K-2026-08-25#EX-99.1]，报告把这条线读作国内平台的广告变现 [src:PDD-RPT1-2026-09-16#p4]。同季总收入的增长主要来自交易服务（公司口径）[src:PDD-6K-2026-08-25#EX-99.1]，报告据此推断增长主要来自海外，公司未披露地区拆分 [src:PDD-RPT1-2026-09-16#p11]；海外正同时面对关税重置 [src:PDD-20F-FY2025#p52] 与欧盟委员会 2026-05-28 依《数字服务法》对 Temu 开出的 2 亿欧元罚款 [src:EC-IP-26-1178]。上市以来股东返还为零 [src:PDD-20F-FY2025#p17] [src:PDD-20F-FY2025#p140] [src:PDD-WEB-2026-09-24-1] [src:PDD-6K-2026-08-25#EX-99.1]；第一笔回购或分红会上修论点，排序权与制度两条线的恶化会推翻它。"
  pillars:
    - id: P1
      claim: "生意不占股东资本：截至 2026-06-30，应付商家加保证金形成 1,285 亿元浮存，经营性投入资本为负 1,829 亿元（本档案按资产负债表科目归类计算）[src:PDD-6K-2026-08-25#EX-99.1]，增长靠商家的钱而不是股东的钱。"
      source: PDD-RPT1-2026-09-16#p6
    - id: P2
      claim: "排序权与定价权仍在：国内的广告变现没有被内容电商和购物代理夺走（公司只披露集团口径的在线营销服务及其他收入）。营业利润率在 2025 年从 27.5% 降到 21.6%（20-F）[src:PDD-20F-FY2025#p103]，2026 年上半年同比略升至 21.7%（上年同期 21.0%，本档案计算）[src:PDD-6K-2026-08-25#EX-99.1]，这是让利而不是定价权见顶；当前读数为在线营销服务及其他收入 2026 年二季度同比 +3.5% [src:PDD-6K-2026-08-25#EX-99.1]，营业利润率 TTM（至 2026 年二季度）21.9%（20-F 口径，业绩公告逐季相加为 22.2%，不含 2026 年 4 月的罚没，见 F7）[src:PDD-20F-FY2025#p103] [src:PDD-6K-2026-03-26#EX-99.1]。"
      source: PDD-RPT1-2026-09-16#p10
    - id: P3
      claim: "净金融资产 5,016 亿元（739 亿美元，2026-06-30，本档案按资产负债表科目计算，见 F3）[src:PDD-6K-2026-08-25#EX-99.1] 不会被毁灭，并终将有通道到达外部股东 [src:PDD-RPT1-2026-09-16#p7]；这是证据最弱的一条：2023–2025 年没有任何子公司向上市主体分红或作其他分配，上市主体与子公司之间的资金只以贷款与还款的形式往来（三年里子公司向上市主体还款 105.7 亿、4.7 亿、336.6 亿元，上市主体向子公司放贷 17.5 亿、4.2 亿、284.8 亿元）[src:PDD-20F-FY2025#p16]；截至 2025-12-31，境内子公司、VIE 及其子公司的受限净资产为 1,259 亿元（基准日与上面的 5,016 亿元不同）[src:PDD-20F-FY2025#p16]。论点落在「子公司不分配、股东无返还」，不是「现金上不去」。"
      source: PDD-RPT1-2026-09-16#p18
    - id: P4
      claim: "经营者能干且与监管的关系不走向二元性失效：2020→2025 年，销售费用率从 69.2% 降到 29.0%，收入同期做到原来的 7.3 倍（本档案计算）[src:PDD-6K-2022-03-22#EX-99.1] [src:PDD-20F-FY2025#p153]；VIE、审计检查与平台规则都没有断裂，执法现场的姿态不再恶化。"
      source: PDD-RPT1-2026-09-16#p3
    - id: P5
      claim: "第二曲线不毁掉资本回报：Temu 能在关税重置与 DSA 之下自持，新拼姆不把公司拖成低回报的重资产零售商。公司在 2026-05-27 的一季报中称将投入大量资源建设自有品牌（first-party brand）业务 [src:PDD-6K-2026-05-28#EX-99.1]，但没有点名新拼姆，也没有披露金额与会计处理；新拼姆三年计划投入 1,000 亿元只见于媒体报道（仅 L2，未见一手数据）[src:PDD-RPT1-2026-09-16#p5]。新拼姆是否就是这项业务的载体、是否买断持货，报告判为无法区分 [src:PDD-RPT1-2026-09-16#p6]，要看 2026 年三季报起资产负债表是否出现存货科目。"
      source: PDD-RPT1-2026-09-16#p5
  permanent_loss_paths:
    - "现金永远到不了外部股东：截至 2025-12-31，上市主体（PDD Holdings Inc.）自身的现金、现金等价物、受限资金与短期投资只有 4,599 万元 [src:PDD-20F-FY2025#p18]，境内子公司、VIE 及其子公司的受限净资产为 1,259 亿元 [src:PDD-20F-FY2025#p16]；2023–2025 年子公司没有向上市主体分红或作其他分配，资金只以贷款与还款的形式往来（2025 年子公司向上市主体还款 336.6 亿元，上市主体向子公司放贷 284.8 亿元）[src:PDD-20F-FY2025#p16]，上市以来也没有任何股东返还 [src:PDD-20F-FY2025#p17]；若制度或意愿让净金融资产永久留在境内并被低回报地消耗，外部股东拥有的只是一台不向所有者分配的机器。"
    - "排序权外移：内容电商把发现、购物代理把比价搬出平台，国内在线营销收入由停滞转为持续负增长 [src:PDD-RPT1-2026-09-16#p19]；租金来源离开它的地盘，结局不是倒闭，而是被绕开、变得无关紧要。"
    - "制度的二元性失效：VIE 被认定无效、审计检查再度中断导致退市，或平台与价格规则被严格执行、营业利润率被压到制度收口路径的终点 13% 左右 [src:PDD-RPT1-2026-09-16#p22]；利润原本由监管许可而非护城河给出。"
    - "重资产迷失：若新拼姆确为自营，它把高毛利的广告生意换成利润率接近京东的自营线（京东 2026 年二季度集团营业利润率 1.3%、京东零售经营利润率 4.6%，京东不单独披露自营利润率 [src:JD-6K-2026-08-13#EX-99.1]），并与付广告费的第三方商家直接竞争 [src:PDD-RPT1-2026-09-16#p13]，最终以库存减值或无声退出收场，资本被永久消耗；报告判断这条路径只在新拼姆是买断包销的自营时成立 [src:PDD-RPT1-2026-09-16#p6]。"
    - "执法姿态恶化：市场监管总局 2026-04-17 的处罚决定书（国市监处罚〔2026〕22 号）记载，当事人在调查中多次无正当理由拒绝提供材料、信息或提供虚假材料、信息，甚至采用暴力、软对抗等手段阻碍监管执法 [src:SAMR-CF-2026-22]；若在下一次监管边界移动时重演，代价不再是一张罚单，而是能否以现有形态继续经营。"

