ratings:
  business: A−
  management: A−
  source: PDD-RPT1-2026-09-16#p3

thesis:
  summary: "Pinduoduo and Temu are two copies of the same mechanism, at home and abroad: aggregate demand, hand large orders to Chinese factories, and trade low prices for scale [src:PDD-RPT1-2026-09-16#p4], and the 20-F says the two platforms have the same value proposition and operating model and both currently serve mainly Chinese merchants [src:PDD-20F-FY2025#p6]. The platform does not control merchants' goods [src:PDD-20F-FY2025#p164], and as of 2026-06-30 its balance sheet had no inventory line, so it runs on merchants' money: operating invested capital was negative RMB 182.9 billion (2026-06-30, this archive's calculation by classifying balance-sheet line items, a measure the company does not disclose, formula in F1), with zero interest-bearing debt [src:PDD-6K-2026-08-25#EX-99.1]. The evidence on the business itself is ample, yet the three variables that decide the owner's outcome all lie outside the business: whether ranking power can be kept, whether cash can reach shareholders, and which way its stance toward regulators goes [src:PDD-RPT1-2026-09-16#p3]. Online marketing services and others revenue (group level: the company has only one segment and does not split it by platform or region [src:PDD-20F-FY2025#p167]) grew only 3.5% year on year in Q2 2026 [src:PDD-6K-2026-08-25#EX-99.1], and the report reads this line as the domestic platform's advertising monetization [src:PDD-RPT1-2026-09-16#p4]. In the same quarter, total revenue growth came mainly from transaction services (the company's wording) [src:PDD-6K-2026-08-25#EX-99.1], from which the report infers that growth came mainly from overseas, though the company does not disclose a regional split [src:PDD-RPT1-2026-09-16#p11]; overseas, it faces at the same time a tariff reset [src:PDD-20F-FY2025#p52] and the €200 million fine the European Commission imposed on Temu under the Digital Services Act on 2026-05-28 [src:EC-IP-26-1178]. Shareholder returns since listing have been zero [src:PDD-20F-FY2025#p17] [src:PDD-20F-FY2025#p140] [src:PDD-WEB-2026-09-24-1] [src:PDD-6K-2026-08-25#EX-99.1]; the first buyback or dividend would revise the thesis upward, and deterioration on the ranking-power line or the institutional line would overturn it."
  pillars:
    - id: P1
      claim: "The business ties up no shareholder capital: as of 2026-06-30, payables to merchants plus merchant deposits formed a float of RMB 128.5 billion, and operating invested capital was negative RMB 182.9 billion (this archive's calculation by classifying balance-sheet line items) [src:PDD-6K-2026-08-25#EX-99.1], so growth runs on merchants' money rather than shareholders'."
      source: PDD-RPT1-2026-09-16#p6
    - id: P2
      claim: "Ranking power and pricing power are intact: domestic advertising monetization has not been taken away by content commerce and shopping agents (the company discloses online marketing services and others revenue only at group level). The operating margin fell from 27.5% to 21.6% in 2025 (20-F) [src:PDD-20F-FY2025#p103] and rose slightly year on year to 21.7% in the first half of 2026 (21.0% a year earlier, this archive's calculation) [src:PDD-6K-2026-08-25#EX-99.1], which is a margin concession, not a peak in pricing power; the current readings are online marketing services and others revenue +3.5% year on year in Q2 2026 [src:PDD-6K-2026-08-25#EX-99.1], and a TTM operating margin (to Q2 2026) of 21.9% (20-F basis, or 22.2% adding up the earnings releases quarter by quarter, which excludes the April 2026 penalty, see F7) [src:PDD-20F-FY2025#p103] [src:PDD-6K-2026-03-26#EX-99.1]."
      source: PDD-RPT1-2026-09-16#p10
    - id: P3
      claim: "Net financial assets of RMB 501.6 billion ($73.9 billion, 2026-06-30, this archive's calculation from balance-sheet line items, see F3) [src:PDD-6K-2026-08-25#EX-99.1] will not be destroyed and will eventually have a channel to reach outside shareholders [src:PDD-RPT1-2026-09-16#p7]; this is the pillar with the weakest evidence: in 2023–2025 no subsidiary paid dividends or made other distributions to the listed entity, and funds between the listed entity and its subsidiaries moved only as loans and repayments (over the three years, subsidiaries repaid RMB 10.57 billion, RMB 470 million and RMB 33.66 billion to the listed entity, and the listed entity lent RMB 1.75 billion, RMB 420 million and RMB 28.48 billion to subsidiaries) [src:PDD-20F-FY2025#p16]; as of 2025-12-31, the restricted net assets of the PRC subsidiaries, the VIE and its subsidiaries were RMB 125.9 billion (a different reference date from the RMB 501.6 billion above) [src:PDD-20F-FY2025#p16]. The thesis rests on “subsidiaries do not distribute, shareholders get no returns”, not on “cash cannot move up”."
      source: PDD-RPT1-2026-09-16#p18
    - id: P4
      claim: "The operators are capable, and the relationship with regulators does not head toward a binary failure: from 2020 to 2025, the sales and marketing expense ratio fell from 69.2% to 29.0% while revenue grew 7.3-fold over the same period (this archive's calculation) [src:PDD-6K-2022-03-22#EX-99.1] [src:PDD-20F-FY2025#p153]; the VIE, audit inspections and platform rules have not broken, and the company's conduct during enforcement does not get worse."
      source: PDD-RPT1-2026-09-16#p3
    - id: P5
      claim: "The second curve does not destroy returns on capital: Temu can sustain itself under the tariff reset and the DSA, and Xinpinmu does not drag the company into becoming a low-return, asset-heavy retailer. In its first-quarter earnings release of 2026-05-27, the company said it would commit significant resources to building a first-party brand business [src:PDD-6K-2026-05-28#EX-99.1], but it did not name Xinpinmu or disclose an amount or the accounting treatment; the three-year RMB 100 billion investment plan for Xinpinmu appears only in media reports (L2 only, no primary data seen) [src:PDD-RPT1-2026-09-16#p5]. Whether Xinpinmu is the vehicle for this business, and whether it buys and holds inventory outright, the report judges impossible to tell [src:PDD-RPT1-2026-09-16#p6], and the test is whether an inventory line appears on the balance sheet from the Q3 2026 results on."
      source: PDD-RPT1-2026-09-16#p5
  permanent_loss_paths:
    - "Cash never reaches outside shareholders: as of 2025-12-31, the listed entity (PDD Holdings Inc.) itself held only RMB 45.99 million of cash, cash equivalents, restricted cash and short-term investments [src:PDD-20F-FY2025#p18], and the restricted net assets of the PRC subsidiaries, the VIE and its subsidiaries were RMB 125.9 billion [src:PDD-20F-FY2025#p16]; in 2023–2025 subsidiaries paid no dividends and made no other distributions to the listed entity, and funds moved only as loans and repayments (in 2025 subsidiaries repaid RMB 33.66 billion to the listed entity, and the listed entity lent RMB 28.48 billion to subsidiaries) [src:PDD-20F-FY2025#p16], and there have been no shareholder returns of any kind since listing [src:PDD-20F-FY2025#p17]; if the institutional regime or the company's own choice keeps net financial assets in China permanently, to be consumed at low returns, what outside shareholders own is only a machine that does not distribute to its owners."
    - "Ranking power moves elsewhere: content commerce takes discovery, and shopping agents take price comparison, off the platform, and domestic online marketing revenue turns from stagnation to sustained decline [src:PDD-RPT1-2026-09-16#p19]; the source of the rent leaves its territory, and the end is not bankruptcy but being bypassed and becoming irrelevant."
    - "Binary institutional failure: the VIE is ruled invalid, audit inspections break down again and lead to delisting, or platform and pricing rules are strictly enforced and the operating margin is pushed down to about 13%, the end point of the institutional tightening path [src:PDD-RPT1-2026-09-16#p22]; the profits were granted by regulatory permission rather than by a moat in the first place."
    - "Lost in heavy assets: if Xinpinmu is indeed self-operated, it swaps a high-gross-margin advertising business for a self-operated line with margins close to JD.com's (in Q2 2026 JD's group operating margin was 1.3% and JD Retail's operating margin 4.6%, and JD does not disclose a separate self-operated margin [src:JD-6K-2026-08-13#EX-99.1]), and competes directly with the third-party merchants who pay it advertising fees [src:PDD-RPT1-2026-09-16#p13], ending in inventory write-downs or a silent exit, with capital permanently consumed; the report judges that this path holds only if Xinpinmu is a self-operated business that buys goods outright and bears the sales risk [src:PDD-RPT1-2026-09-16#p6]."
    - "Enforcement conduct gets worse: the penalty decision of the State Administration for Market Regulation (SAMR) of 2026-04-17 (Guo Shi Jian Chu Fa [2026] No. 22) records that during the investigation the party repeatedly refused without good reason to provide materials and information, or provided false materials and information, and even used violence, soft resistance and other means to obstruct regulatory enforcement [src:SAMR-CF-2026-22]; if this recurs the next time the regulatory boundary moves, the cost will no longer be a fine but whether the company can go on operating in its present form."

