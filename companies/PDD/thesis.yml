  - "报告附录登记的其他未知项：价格行为规则中平台统一定价除外条款对 Temu 全托管的适用范围、千亿扶持的实际支出与会计科目、Temu 收入按总额法还是净额法确认、雄安单位的并表状态、「其他子公司」持有的现金类资产中境内与境外的比例 [src:PDD-RPT1-2026-09-16#p30]；截至 2025-12-31，「其他子公司」持有的现金、现金等价物、受限资金与短期投资为 3,249 亿元 [src:PDD-20F-FY2025#p18]。"
