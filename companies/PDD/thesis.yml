  - id: PDD-Q15
    type: quantitative
    claim: 两位自 2021 年以来股数未动的大股东没有开始离场
    origin: report:breaker
    severity: breaker
    covers: [governance, management]
    pillar: P4
    metric_def:
      id: major_holder_shares
      description: 黄峥关联实体、腾讯关联实体的实益持股数（两组分别读）
      unit: 股
      frequency: year
      data: filing_text
      where: 腾讯一组以腾讯提交的 Schedule 13D/A 修订为主要数据源（20-F 受益所有权表对腾讯照录其 13D/A [src:PDD-20F-FY2025#p122]）；黄峥一组以 20-F Item 6.E／Item 7.A 受益所有权表为主，并查 Schedule 13D／13G 修订
    params: {holders: [Entities affiliated with Zheng Huang, Entities affiliated with Tencent]}
    fail_if: 黄峥或腾讯关联实体的持股在任一年度减少超过 20%
    rule: {op: decrease, threshold: 20, unit: "%", consecutive: 1, period: year, note: 对 params.holders 中每一组分别计算同比降幅，任一组触发即失败}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2027-04
    baseline: {value: [1409744080, 783468116], unit: 股, as_of: 2026-03-18, source: PDD-20F-FY2025#p121, note: "两组股数与 2021 年 3 月的申报相同：黄峥的 Schedule 13G/A 第 2 号（事件日 2021-03-17）为 1,409,744,080 股 [src:PDD-SC13GA-2021-03-18]，腾讯的 Schedule 13D/A 第 4 号（2021-03-24）为 783,468,116 股 [src:PDD-SC13DA-2021-03-24]；在此之前，FY2020 20-F 对腾讯一组按其 2020 年 11 月的 13D/A 列 783,217,772 股 [src:PDD-20F-FY2020#Item6.E]。2026-09-24 查 EDGAR 本公司申报索引（含以本公司为标的的他人申报），腾讯 2021-03-24 那份 13D/A 之后没有新的 13D 修订，黄峥一方 2021-03-18 之后也没有新的 13D 或 13G 申报 [src:PDD-WEB-2026-09-24-2]。20-F 对腾讯一组照录 2021-03-24 的 13D/A [src:PDD-20F-FY2025#p122]，腾讯的「未变」部分是申报口径的结果。报告称两组自 2021 年以来股数未变 [src:PDD-RPT1-2026-09-16#p15]。黄峥另为 Quantum Dot（由 Qubit Partners 全资持有）的唯一董事 [src:PDD-20F-FY2025#p122]，该部分不在本条口径内"}
    note: 论点破坏者第 8 条。只读年度 20-F 可能漏掉腾讯的变化：13D/A 修订随时可能出现，出现即读，与一年前的读数比较。

  - id: PDD-L4
    type: qualitative
    claim: Temu 在美国与欧盟的经营不被监管切断
