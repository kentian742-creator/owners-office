  made_at: '2026-09-29'
  due: '2028'
  source: MCD-10K-FY2025#p14
  status: pending
  note: 'From the dossier''s runway part. Settlement: arithmetic mean of the company-reported constant-currency
    systemwide sales growth for FY2026, FY2027 and FY2028 in the 10-K MD&A ''Systemwide sales'' table; 4.0% or higher
    is kept. Basis: FY2025 +5% [src:MCD-10K-FY2025#p14], FY2026Q1–Q2 +5% [src:MCD-10Q-FY2026Q2#p25], about 2.5 points
    from net units guided for FY2026 [src:MCD-10K-FY2025#p11].'
