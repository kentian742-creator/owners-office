  - id: MCD-Q5
    type: quantitative
    claim: "Total-company comparable sales do not decline for two fiscal years in a row"
    origin: "archive:breaker"
    severity: breaker
    covers: [moat, growth]
    pillar: P2
    effective_from: FY2026Q3
    metric_def:
