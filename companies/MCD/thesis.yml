thesis:
  summary: "McDonald's collects rent, royalties and fees on the sales of franchised restaurants, which were about 95% of its restaurants and about 93% of FY2025 systemwide sales of $139.4B [src:MCD-10K-FY2025#p3][src:MCD-10K-FY2025#p8][src:MCD-10K-FY2025#p15][src:MCD-10K-FY2025#p39], and about 90% of its restaurant margin comes from franchised sites [src:MCD-10K-FY2025#p15]. Value compounds through net unit growth of about 4% (4.3% in the twelve months to 2026-06-30 [src:MCD-10Q-FY2026Q2#p9]), mostly funded by licensees [src:MCD-10Q-FY2026Q2#p31], plus check-led comparable sales [src:MCD-10Q-FY2026Q2#p19], and most free cash flow goes to a dividend paid for 50 consecutive years and increased every year [src:MCD-10K-FY2025#p21] and to repurchases. The holding case requires three things: the U.S. value proposition must restore traffic before franchisee restaurant margins erode further; the enlarged development program must earn returns near the historical level on incremental capital (20.9% pre-tax FY2019–FY2025, calc from operating income [src:MCD-10K-FY2020#p38][src:MCD-10K-FY2025#p39] and capex and equity-method purchases [src:MCD-10K-FY2020#p41][src:MCD-10K-FY2022#p39][src:MCD-10K-FY2025#p42]); and shareholder returns must stay funded by free cash flow rather than by rising leverage."
  pillars:
    - id: P1
      claim: "The franchisor model concentrates profit in rent and royalties: franchised margin was $13,930M of $15,351M total restaurant margin in FY2025 [src:MCD-10K-FY2025#p15], and U.S. franchised revenue held at 14.2% of U.S. franchised sales in FY2025 against 13.8% in FY2015 while U.S. unit volumes grew (calc from [src:MCD-10K-FY2025#p14][src:MCD-10K-FY2025#p15][src:MCD-10K-FY2015#p18][src:MCD-10K-FY2015#p19])."
      source: MCD-10K-FY2025#p15
    - id: P2
      claim: "Growth is internally generated: constant-currency systemwide sales grew 5% in FY2025 [src:MCD-10K-FY2025#p14] and 5% in FY2026Q1–Q2 [src:MCD-10Q-FY2026Q2#p25], net restaurant growth was 4.3% in FY2025 (calc from [src:MCD-10K-FY2025#p20]), and more than 1,800 of about 2,600 FY2026 openings are funded by developmental licensees and affiliates [src:MCD-10K-FY2025#p11]."
      source: MCD-10K-FY2025#p14
    - id: P3
      claim: "The U.S. value proposition must restore traffic before franchisee economics erode further: U.S. comparable guest counts were negative in FY2026Q2 [src:MCD-10Q-FY2026Q2#p19], and the U.S. company-operated margin, the nearest disclosed proxy for franchisee restaurant economics, fell from 15.2% in FY2023 to 10.0% in FY2026Q1–Q2 (calc from [src:MCD-10K-FY2025#p14][src:MCD-10K-FY2025#p15][src:MCD-10Q-FY2026Q2#p24][src:MCD-10Q-FY2026Q2#p27])."
      source: MCD-10Q-FY2026Q2#p27
    - id: P4
      claim: "The enlarged development program must earn returns near the historical level: the pre-tax incremental return on capital was 20.9% over FY2019–FY2025 but 9.4% over FY2023–FY2025 (calc from operating income [src:MCD-10K-FY2020#p38][src:MCD-10K-FY2025#p39] and capex and equity-method purchases [src:MCD-10K-FY2020#p41][src:MCD-10K-FY2022#p39][src:MCD-10K-FY2025#p42]), and company-reported ROIC fell from 25.2% in FY2023 to 20.3% in FY2025 [src:MCD-10K-FY2025#p22]."
      source: MCD-10K-FY2025#p22
    - id: P5
      claim: "Shareholder returns stay funded by free cash flow, not rising leverage: FY2021–FY2025 dividends and repurchases were 104.7% of free cash flow (calc from [src:MCD-10K-FY2023#p41][src:MCD-10K-FY2024#p43][src:MCD-10K-FY2025#p42]), debt obligations were $40.0B at 2025-12-31 and the long-term debt ratings were BBB+ (S&P) and Baa1 (Moody's) [src:MCD-10K-FY2025#p22]."
      source: MCD-10K-FY2025#p22
  permanent_loss_paths:
    - "U.S. growth stays check-only while traffic falls (U.S. comparable guest counts negative in FY2026Q2 [src:MCD-10Q-FY2026Q2#p19]), franchisee restaurant margins keep compressing and franchisees stop funding remodels and new-unit equipment, so the rent and royalty base in the most profitable market stops growing or shrinks."
    - "New capital earns structurally less than the existing base: the FY2023–FY2025 pre-tax incremental return was 9.4% (calc from [src:MCD-10K-FY2025#p39][src:MCD-10K-FY2025#p42]), and growth shifts to licensed markets where McDonald's records about 5 cents of revenue per franchised sales dollar against 14–17 cents in the U.S. and IOM (FY2025, calc from [src:MCD-10K-FY2025#p14][src:MCD-10K-FY2025#p15])."
    - "Leverage absorbs a downturn instead of equity: equity was −$1,791M at 2025-12-31 [src:MCD-10K-FY2025#p41] against $40.0B of debt obligations [src:MCD-10K-FY2025#p22] and $14.8B of lease liabilities [src:MCD-10K-FY2025#p55], so a sustained fall in franchisee sales combined with returns above free cash flow would force a dividend cut or a lower credit rating."
    - "Law or regulation treats the franchisor as joint employer of franchisee staff, which the company lists as a risk to the franchise model [src:MCD-10K-FY2025#p31], making McDonald's answerable for the over two million people who work in franchised restaurants [src:MCD-10K-FY2025#p4]."
    - "Demand shifts away from the format: weight-loss medication, named by the company among changes in consumer behavior [src:MCD-10K-FY2025#p28], and delivery platforms, whose orders carry lower profitability by the company's own account [src:MCD-10Q-FY2026Q2#p33], erode traffic and the direct customer relationship."
tests:
  - id: MCD-Q1
    type: quantitative
    claim: "Growth of the sales base on which rent and royalties are charged has not slipped out of the stalwart range"
    origin: "template:stalwart"
    severity: watch
    covers: [growth]
    pillar: P2
    effective_from: FY2026Q3
    metric_def:
      id: systemwide_sales_growth_cc
      description: "Year-on-year growth of systemwide sales (sales at all company-operated and franchised restaurants) excluding currency translation, as reported by the company"
      unit: "%"
      frequency: quarter
      data: filing_text
      where: "10-Q / 10-K MD&A 'Systemwide sales' table (constant-currency column); quarterly figure from the earnings release 8-K Exhibit 99.1"
    fail_if: "below 3% for 4 consecutive quarters"
    rule: {op: "<", threshold: 3, unit: "%", consecutive: 4, period: quarter}
    warn_if: "below 4% for 2 consecutive quarters"
    warn_rule: {op: "<", threshold: 4, unit: "%", consecutive: 2, period: quarter}
    data: filing_text
    baseline: {value: 5, unit: "%", period: "FY2026Q1-Q2", source: "MCD-10Q-FY2026Q2#p25"}
    note: "Replaces the template's revenue_yoy. Reported revenue mixes company-operated sales with rent and royalties, moved with refranchising (company-operated restaurants 6,444 at FY2015 year-end [src:MCD-10K-FY2015#p13] against 2,039 at FY2025 year-end [src:MCD-10K-FY2025#p44]) and with currency (FY2026Q1–Q2 revenue +6%, +3% in constant currency [src:MCD-10Q-FY2026Q2#p24]); constant-currency systemwide sales is the base the company's fees are charged on. Thresholds are set below the template's 5% and 8% because this franchisor grows sales about 5% (FY2025 +5% [src:MCD-10K-FY2025#p14]), with about 2.5 points from net units [src:MCD-10K-FY2025#p11], at the slow end of the stalwart range. The annual reading from the dossier's dashboard is MCD-Q12."
  - id: MCD-Q2
    type: quantitative
    claim: "Return on invested capital holds at the level of an excellent business"
    origin: "template:stalwart"
    severity: watch
    covers: [returns_on_capital, moat]
    pillar: P4
    effective_from: FY2026Q3
    metric: roic
    fail_if: "below 12% for 2 consecutive years"
    rule: {op: "<", threshold: 12, unit: "%", consecutive: 2, period: year}
    data: xbrl
    note: "Registry basis: equity + interest-bearing debt − cash, without lease liabilities. Equity is negative (−$1,791M at 2025-12-31 [src:MCD-10K-FY2025#p41]) but invested capital on this basis stays positive, so the ratio is defined; the dossier's own FY2025 reading is about 25.9% on this basis and 18.6% with lease liabilities included (calc from [src:MCD-10K-FY2025#p19][src:MCD-10K-FY2025#p39][src:MCD-10K-FY2025#p41][src:MCD-10K-FY2025#p55][src:MCD-10K-FY2025#p61]). The company-reported ROIC is tested in MCD-Q7 and MCD-Q15."
  - id: MCD-Q3
    type: quantitative
    claim: "Buybacks really shrink the share count instead of offsetting stock-based compensation"
    origin: "template:stalwart"
    severity: watch
    covers: [capital_allocation]
    pillar: P5
    effective_from: FY2026Q3
    metric: diluted_shares_yoy
    fail_if: "above 0 for 2 consecutive years"
    rule: {op: ">", threshold: 0, unit: "%", consecutive: 2, period: year}
    data: xbrl
    note: "Diluted weighted shares fell from 944.6M in FY2015 to 716.4M in FY2025 [src:MCD-10K-FY2015#p17][src:MCD-10K-FY2025#p39]. The pipeline's XBRL summary records diluted share counts in units through FY2020 and in millions from FY2021; readings that span that boundary must be put on one unit before comparison."
  - id: MCD-Q4
    type: quantitative
    claim: "Profit turns into cash"
    origin: "template:stalwart"
    severity: watch
    covers: [free_cash_flow]
    pillar: P5
    effective_from: FY2026Q3
    metric: fcf_conversion
    fail_if: "below 70% for 2 consecutive years"
    rule: {op: "<", threshold: 70, unit: "%", consecutive: 2, period: year}
    data: xbrl
    note: "Same definition as the company's (free cash flow ÷ net income); company-reported 81% in FY2024 and 84% in FY2025 [src:MCD-10K-FY2025#p19]. The dossier's single-year threshold is tested in MCD-Q14."
  - id: MCD-L1
    type: qualitative
    claim: "Management has not lowered the medium-term targets it published"
    origin: "template:stalwart"
    severity: watch
    covers: [management]
    pillar: P2
    effective_from: FY2026Q3
    question: "As of the 10-Q for FY2026Q2, filed 2026-08-07, McDonald's had published these targets: 50,000 global restaurants in 2028 [src:MCD-10Q-FY2026Q2#p31]; 250 million 90-day active loyalty users by the end of 2027 [src:MCD-10K-FY2025#p9]; 30% of systemwide delivery sales originating in the company's own app by the end of 2027 [src:MCD-10K-FY2025#p9]; about 2,100 net restaurant additions in FY2026 [src:MCD-10K-FY2025#p11]; free cash flow conversion in the low-to-mid 80% range for FY2026 [src:MCD-10Q-FY2026Q2#p31]. In the documents provided that were filed after 2026-08-07, did the company lower, postpone or withdraw any of these targets? If so, name the target, quote the new wording, and state whether the same document gave a replacement target with a specific number and date."
    fail_if: "Yes, and the same document gave no replacement target with a specific number and date"
    judge: independent_model
    evidence: required
    where: ["earnings release 8-K Exhibits 99.1 and 99.2 of this period and the three before", "10-Q / 10-K MD&A outlook and strategy sections of this period and the three before"]
    lookback: 4
    judge_notes:
      - "Moving a target to a later date counts as postponing."
      - "Only documents filed after 2026-08-07 count; earlier documents are context."
      - "A target restated with the same number and the same or an earlier date is not lowered."
      - "A target that stops being mentioned in all provided documents is reported as 'not mentioned', not as withdrawn."
    note: "The move of the 50,000-restaurant target from the end of 2027 [src:MCD-10K-FY2025#p11] into 2028 [src:MCD-10Q-FY2026Q2#p31] happened before this test takes effect and is recorded in the ledger. Earnings call transcripts and investor-day materials are not available to the pipeline, so they are not listed in where."
  - id: MCD-S1
    type: staleness
    claim: "The moat judgment goes no longer than four quarters without a review"
    origin: "template:stalwart"
    severity: watch
    covers: [moat]
    pillar: P1
    effective_from: FY2026Q3
    section: moat
    max_age_quarters: 4
  - id: MCD-S2
