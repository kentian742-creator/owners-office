    fail_if: "below 0.0% in two consecutive fiscal years"
    rule: {op: "<", threshold: 0.0, unit: "%", consecutive: 2, period: year}
    data: filing_text
    baseline: {value: 3.1, unit: "%", period: FY2025, source: "MCD-10K-FY2025#p14", note: "FY2024 was −0.1% [src:MCD-10K-FY2025#p14]"}
    note: "Thesis breaker B1 of the dossier."
  - id: MCD-Q6
    type: quantitative
    claim: "The share of U.S. franchised sales that McDonald's keeps as rent, royalties and fees holds"
    origin: "archive:breaker"
    severity: breaker
    covers: [pricing_power, moat, unit_economics]
    pillar: P1
    effective_from: FY2026Q3
    metric_def:
      id: us_franchised_take_rate
      description: "U.S. revenues from franchised restaurants ÷ U.S. franchised sales, fiscal year"
      unit: "%"
      frequency: year
      data: filing_text
      formula: "us_franchised_revenue / us_franchised_sales"
      where: "10-K MD&A 'Revenues' table (U.S. franchised revenues) and 'Franchised sales' table (U.S.)"
      components:
        us_franchised_revenue:
          description: "U.S. revenues from franchised restaurants"
          unit: USD
          where: "10-K MD&A 'Revenues' table"
        us_franchised_sales:
          description: "U.S. franchised sales"
          unit: USD
          where: "10-K MD&A 'Franchised sales' table"
    fail_if: "below 13.0% in any fiscal year"
    rule: {op: "<", threshold: 13.0, unit: "%", consecutive: 1, period: year}
    data: filing_text
    baseline: {value: 14.2, unit: "%", period: FY2025, source: "MCD-10K-FY2025#p14", note: "$7,371M [src:MCD-10K-FY2025#p14] ÷ $51,946M [src:MCD-10K-FY2025#p15]"}
    note: "Thesis breaker B2 of the dossier. FY2015 reading 13.8% ($4,361M ÷ $31,639M [src:MCD-10K-FY2015#p18][src:MCD-10K-FY2015#p19])."
  - id: MCD-Q7
    type: quantitative
