    fail_if: "below 15.0% in two consecutive fiscal years"
    rule: {op: "<", threshold: 15.0, unit: "%", consecutive: 2, period: year}
    data: filing_text
    baseline: {value: 20.3, unit: "%", period: FY2025, source: "MCD-10K-FY2025#p22", note: "25.2% in FY2023 and 21.8% in FY2024 [src:MCD-10K-FY2025#p22]"}
    note: "Thesis breaker B3 of the dossier. The calculation basis sits in Exhibit 99.1, which has not been seen (see todo); a change of basis by the company is a candidate for a false trigger and must be shown with primary evidence."
