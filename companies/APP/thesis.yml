tests:
  # ── 林奇快速增长型模板（spec/templates/lynch/fast_grower.yml）──
  - id: APP-Q1
    type: quantitative
    claim: 增长仍在快速增长型的区间
    origin: template:fast_grower
    severity: watch
    covers: [growth]
    pillar: P2
    effective_from: FY2026Q3
    metric: revenue_yoy
    fail_if: 连续 2 个季度低于 15%
    rule: {op: "<", threshold: 15, unit: "%", consecutive: 2, period: quarter}
    data: xbrl
    first_readable: 2026-11
    baseline: {value: 53, unit: "%", period: 2026Q2, as_of: 2026-06-30, source: APP-RPT1-2026-09-23#p3}
    note: "失败时复核林奇分类（可能转为稳定增长型）。同比用最新文件里的持续经营口径：出售应用业务后，2025 年各季收入已按持续经营重述。"

  - id: APP-Q2
    type: quantitative
    claim: 扩张没有吃掉单位经济
    origin: template:fast_grower
    severity: watch
    covers: [unit_economics, pricing_power]
    pillar: P1
    effective_from: FY2026Q3
    metric: operating_margin
    fail_if: 同比下降超过 5 个百分点，连续 2 个季度
    rule: {op: "decrease", threshold: 5, unit: pp, consecutive: 2, period: quarter}
    data: xbrl
    first_readable: 2026-11
    baseline: {value: 77.7, unit: "%", period: 2026Q2, as_of: 2026-06-30, source: APP-RPT1-2026-09-23#p1}
    note: "二季度环比的增量利润率只有 67%，低于 77.7% 的平均，环比多出的成本八成是网络基础设施与算力[src:APP-RPT1-2026-09-23#p5]。"

  - id: APP-Q3
    type: quantitative
    claim: 资产负债表撑得住扩张
    origin: template:fast_grower
    severity: watch
    covers: [balance_sheet]
    pillar: P5
    effective_from: FY2026Q3
    metric_def:
      id: net_debt_to_fcf_ttm
      description: "净负债 ÷ 过去四个季度自由现金流；净负债 = 有息负债 − 现金、现金等价物与短期投资"
      unit: x
      frequency: quarter
      data: xbrl
      xbrl: [us-gaap:LongTermDebt, us-gaap:LongTermDebtNoncurrent, us-gaap:CashAndCashEquivalentsAtCarryingValue, us-gaap:ShortTermInvestments, us-gaap:NetCashProvidedByUsedInOperatingActivities, us-gaap:PaymentsToAcquirePropertyPlantAndEquipment]
      formula: "(debt - cash - short_term_investments) / sum_4q(operating_cash_flow - capex)"
    fail_if: 净负债超过过去四个季度的自由现金流（大于 1 倍）
    rule: {op: ">", threshold: 1, unit: x, consecutive: 1, period: quarter}
    data: xbrl
    first_readable: 2026-11
    baseline:
      value: null
      unit: x
      as_of: 2026-06-30
      source: APP-RPT1-2026-09-23#p13
      note: "报告只给出分子：净负债约 6.47 亿美元（债务本金约 37 亿 − 现金 30.53 亿）[src:APP-RPT1-2026-09-23#p13]。过去四个季度的自由现金流报告没有直接给出，比值待从 10-Q、10-K 重算后填入。"
    note: "模板默认门槛是“由净现金转为净负债”；截至 2026-06-30 公司已有约 6.47 亿美元净负债[src:APP-RPT1-2026-09-23#p13]，默认门槛当下即失败、没有区分力，所以改为净负债与一年自由现金流之比，守的仍是模板的论点。"

  - id: APP-L1
    type: qualitative
    claim: 新的扩张方向仍在公司的能力范围内
    origin: template:fast_grower
    severity: watch
    covers: [capital_allocation]
    pillar: P5
    effective_from: FY2026Q3
    question: 本期文件是否披露了进入与现有业务无关的新领域的重大投资或收购？
    fail_if: 是，且金额超过上一财年自由现金流的 25%
    judge: independent_model
    evidence: required
    where: "8-K（Item 1.01、2.01、7.01、8.01）、并购新闻稿、10-Q 与 10-K 的 MD&A 和后续事项附注"
    lookback: 5
    judge_notes: 只看本期文件披露的投资或收购；更早各期的文件只用来读上一财年的自由现金流（上一份 10-K）。
    first_readable: 2026-10
    baseline:
      value: 39.5
      unit: 亿美元
      period: FY2025
      source: APP-RPT1-2026-09-23#p6
      note: 上一财年（2025）自由现金流，即门槛的基数。
    note: "先例：2025 年 4 月，公司曾向美国政府提交收购 TikTok 中国以外全部业务的初步意向[src:APP-RPT1-2026-09-23#p9]。"

  # 所有类别共用的时效测试（spec/templates/lynch/_common.yml）
  - id: APP-S1
    type: staleness
    claim: 护城河判断不超过四个季度未复核
    origin: template:fast_grower
    severity: watch
    covers: [moat]
    pillar: P2
    effective_from: FY2026Q3
    section: moat
    max_age_quarters: 4
    note: 来自 _common.yml。

  - id: APP-S2
    type: staleness
    claim: 管理层判断不超过四个季度未复核
    origin: template:fast_grower
    severity: watch
    covers: [management]
    pillar: P5
    effective_from: FY2026Q3
    section: management
    max_age_quarters: 4
    note: 来自 _common.yml。

  - id: APP-S3
    type: staleness
    claim: "“最可能错在哪”每两个季度重新审视"
    origin: template:fast_grower
    severity: watch
    covers: [other]
    pillar: P2
    effective_from: FY2026Q3
    section: bear_case
    max_age_quarters: 2
    note: 来自 _common.yml；报告第 11 节的核心是单价为什么上涨，这一节过期就等于没人在看这个问题。

  # ── 覆盖补充（宪法第 2 条要求覆盖资本回报；快速增长型模板没有这一条）──
  - id: APP-Q4
    type: quantitative
    claim: 几乎不需要资本：投入资本回报守在优秀企业的水平
    origin: manual
    severity: watch
    covers: [returns_on_capital]
    pillar: P1
    effective_from: FY2026Q3
    metric: roic
    fail_if: 连续 2 年低于 12%
    rule: {op: "<", threshold: 12, unit: "%", consecutive: 2, period: year}
    data: xbrl
    first_readable: 2027-02
    baseline:
      value: [124, 135]
      unit: "%"
      period: TTM
      as_of: 2026-06-30
      source: APP-RPT1-2026-09-23#p6
      note: "两个税率口径：TTM 税后营业利润 41.3–45.0 亿美元 ÷ 投入资本 33.4 亿美元[src:APP-RPT1-2026-09-23#p6]。"
    note: "快速增长型模板没有资本回报测试，这里借用稳定增长型模板的默认门槛。2025 年资本开支只有 47 万美元[src:APP-RPT1-2026-09-23#p1]，这条测试防的是超大并购或自建算力把投入资本做大。"

  # ── 论点破坏信号（报告第 09 节，发生即作废）──
  - id: APP-Q5
    type: quantitative
    claim: 减速没有变成停不下来的失速
    origin: report:breaker
    severity: breaker
    covers: [growth, moat]
    pillar: P2
    effective_from: FY2026Q3
    metric_def:
      id: axon_unit_drivers_yoy
      description: "公司披露的两个收入驱动量的同比。只描述 Axon 这条产品线；归属名称 2025 年由 AppDiscovery 改为 Axon Advertising、再改为 Axon Ads Manager；四季度不单列。"
      unit: "%"
      frequency: quarter
      data: filing_text
      where: 10-Q MD&A 的关键指标；全年数在 10-K
      components:
        installs: {description: 广告带来的安装量（同比）, unit: "%"}
        net_revenue_per_install: {description: 每次安装净收入（单价，同比）, unit: "%"}
    fail_if: 任意连续两个季度，广告收入同比低于 15%，且同期安装量同比为负
    rule:
      all_of:
        - {metric: revenue_yoy, op: "<", threshold: 15, unit: "%", consecutive: 2, period: quarter}
        - {metric: axon_unit_drivers_yoy.installs, op: "<", threshold: 0, unit: "%", consecutive: 2, period: quarter}
      note: 两个条件须在同样的连续两个季度里同时成立；出售游戏后持续经营收入全部来自广告，广告收入同比即总收入同比。
    data: filing_text
    first_readable: 2026-11
    baseline:
      value: [53, -2]
      unit: "%"
      period: 2026Q2
      as_of: 2026-06-30
      source: APP-RPT1-2026-09-23#p5
      note: 依次为广告收入同比、安装量同比。
    note: 报告第 09 节破坏信号 1（增长断层）。

  - id: APP-Q6
    type: quantitative
    claim: 利润仍能变成所有者的现金
    origin: report:breaker
    severity: breaker
    covers: [free_cash_flow]
    pillar: P1
    effective_from: FY2026Q3
    metric_def:
      id: owner_fcf_margin_ttm
      description: 过去四个季度的所有者自由现金流（自由现金流减股权激励）÷ 同期收入；自由现金流按公司业绩新闻稿的口径
      unit: "%"
      frequency: quarter
      data: xbrl
      xbrl: [us-gaap:NetCashProvidedByUsedInOperatingActivities, us-gaap:PaymentsToAcquirePropertyPlantAndEquipment, us-gaap:ShareBasedCompensation, us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax, us-gaap:Revenues]
      formula: "sum_4q(operating_cash_flow - capex - stock_based_compensation) / sum_4q(revenue)"
    fail_if: TTM 所有者自由现金流（自由现金流减股权激励）占收入连续两个季度低于 45%
    rule: {op: "<", threshold: 45, unit: "%", consecutive: 2, period: quarter}
    data: xbrl
    first_readable: 2026-11
    baseline:
      value: 62
      unit: "%"
      period: TTM
      as_of: 2026-06-30
      source: APP-RPT1-2026-09-23#p6
      note: "报告写“约 62%”[src:APP-RPT1-2026-09-23#p6]。二季度单季只有约 40%，CFO 称现金税集中在二、三季度，二季度另有国际税款与利息的支付时点[src:APP-RPT1-2026-09-23#p6]。"
