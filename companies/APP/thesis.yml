tests:
  # ── Lynch fast-grower template (spec/templates/lynch/fast_grower.yml) ──
  - id: APP-Q1
    type: quantitative
    claim: Growth is still in the fast-grower range
    origin: template:fast_grower
    severity: watch
    covers: [growth]
    pillar: P2
    effective_from: FY2026Q3
    metric: revenue_yoy
    fail_if: Below 15% for 2 consecutive quarters
    rule: {op: "<", threshold: 15, unit: "%", consecutive: 2, period: quarter}
    data: xbrl
    first_readable: 2026-11
    baseline: {value: 53, unit: "%", period: 2026Q2, as_of: 2026-06-30, source: APP-RPT1-2026-09-23#p3}
    note: "On failure, review the Lynch category (it may become a stalwart). Year-on-year growth uses the continuing-operations basis of the latest filing: after the sale of the Apps business, revenue for each quarter of 2025 was restated to continuing operations."

  - id: APP-Q2
    type: quantitative
    claim: Expansion has not eaten into unit economics
    origin: template:fast_grower
    severity: watch
    covers: [unit_economics, pricing_power]
    pillar: P1
    effective_from: FY2026Q3
    metric: operating_margin
    fail_if: Down more than 5 percentage points year on year, for 2 consecutive quarters
    rule: {op: "decrease", threshold: 5, unit: pp, consecutive: 2, period: quarter}
    data: xbrl
    first_readable: 2026-11
    baseline: {value: 77.7, unit: "%", period: 2026Q2, as_of: 2026-06-30, source: APP-RPT1-2026-09-23#p1}
    note: "The incremental margin on Q2's quarter-on-quarter change was only 67%, below the 77.7% average, and eighty percent of the added cost quarter on quarter was network infrastructure and compute [src:APP-RPT1-2026-09-23#p5]."

  - id: APP-Q3
    type: quantitative
    claim: The balance sheet can carry the expansion
    origin: template:fast_grower
    severity: watch
    covers: [balance_sheet]
    pillar: P5
    effective_from: FY2026Q3
    metric_def:
      id: net_debt_to_fcf_ttm
      description: "Net debt ÷ free cash flow over the past four quarters; net debt = interest-bearing debt − cash, cash equivalents and short-term investments"
      unit: x
      frequency: quarter
      data: xbrl
      xbrl: [us-gaap:LongTermDebt, us-gaap:LongTermDebtNoncurrent, us-gaap:CashAndCashEquivalentsAtCarryingValue, us-gaap:ShortTermInvestments, us-gaap:NetCashProvidedByUsedInOperatingActivities, us-gaap:PaymentsToAcquirePropertyPlantAndEquipment]
      formula: "(debt - cash - short_term_investments) / sum_4q(operating_cash_flow - capex)"
    fail_if: Net debt exceeds free cash flow over the past four quarters (more than 1x)
    rule: {op: ">", threshold: 1, unit: x, consecutive: 1, period: quarter}
    data: xbrl
    first_readable: 2026-11
    baseline:
      value: 0.11
      unit: x
      period: TTM
      as_of: 2026-06-30
      source: APP-10K-FY2025#Note9
      note: "Net debt about $497 million: senior notes principal of $3.550 billion ($1 billion each due 2029, 2031 and 2034 and $550 million due 2054, with no borrowing and no principal repayment in the first half of 2026 and nothing drawn on the revolving credit facility) less cash and cash equivalents of $3.053 billion [src:APP-10K-FY2025#Note9][src:APP-10Q-FY2026Q2#Item1A][src:APP-10Q-FY2026Q2#Item1]; $462 million using the carrying amount of long-term debt, $3.515 billion [src:APP-10Q-FY2026Q2#Item1]. TTM (FY2025Q3–FY2026Q2) free cash flow was $4.508 billion (company definition: FY2025 $3.952 billion − first half of 2025 $1.594 billion + first half of 2026 $2.150 billion), so net debt ÷ TTM free cash flow is about 0.11x [src:APP-8K-2026-02-11#EX-99.1][src:APP-8K-2026-05-06#EX-99.1][src:APP-8K-2026-08-05#EX-99.1]. The report's net debt of about $647 million (debt principal of about $3.7 billion) does not match the primary sources [src:APP-RPT1-2026-09-23#p13]; the total debt of about $3.7 billion the CFO gave on the call does not match the filings either (per the company's earnings call) [src:APP-CALL-FY2026Q2#CFO]."
    note: "The template's default threshold is \"from net cash to net debt\"; as of 2026-06-30 the company already had net debt of about $497 million [src:APP-10K-FY2025#Note9][src:APP-10Q-FY2026Q2#Item1], so the default threshold would fail at once and has no discriminating power; it is replaced by net debt relative to one year of free cash flow, which still guards the template's thesis."

  - id: APP-L1
    type: qualitative
    claim: New directions of expansion stay within the company's competence
    origin: template:fast_grower
    severity: watch
    covers: [capital_allocation]
    pillar: P5
    effective_from: FY2026Q3
    question: Do this period's filings disclose a major investment in, or acquisition of, a new field unrelated to the existing business?
    fail_if: Yes, and the amount exceeds 25% of the previous fiscal year's free cash flow
    judge: independent_model
    evidence: required
    where: "8-K (Items 1.01, 2.01, 7.01, 8.01), M&A press releases, the MD&A and subsequent-events notes of the 10-Q and 10-K"
    lookback: 5
    judge_notes: Consider only investments or acquisitions disclosed in this period's filings; earlier periods' filings are used only to read the previous fiscal year's free cash flow (the latest prior 10-K).
    first_readable: 2026-10
    baseline:
      value: 39.5
      unit: USD 100 million
      period: FY2025
      source: APP-8K-2026-02-11#EX-99.1
      note: Free cash flow of the previous fiscal year (2025), the base of the threshold; company definition, including the cash flow of the Apps business discontinued in the first half of 2025, of which the company did not disclose the discontinued part; free cash flow from 2026 on includes continuing operations only.
    note: "Precedent: in April 2025, the company submitted to the President of the United States a preliminary proposal to acquire all of TikTok's business outside China [src:APP-8K-2025-04-03#Item8.01]."

  # Staleness tests shared by all categories (spec/templates/lynch/_common.yml)
  - id: APP-S1
    type: staleness
    claim: The moat judgment goes no more than four quarters without review
    origin: template:fast_grower
    severity: watch
    covers: [moat]
    pillar: P2
    effective_from: FY2026Q3
    section: moat
    max_age_quarters: 4
    note: From _common.yml.

  - id: APP-S2
    type: staleness
    claim: The management judgment goes no more than four quarters without review
    origin: template:fast_grower
    severity: watch
    covers: [management]
    pillar: P5
    effective_from: FY2026Q3
    section: management
    max_age_quarters: 4
    note: From _common.yml.

  - id: APP-S3
    type: staleness
    claim: "\"Where am I most likely wrong\" is re-examined every two quarters"
    origin: template:fast_grower
    severity: watch
    covers: [other]
    pillar: P2
    effective_from: FY2026Q3
    section: bear_case
    max_age_quarters: 2
    note: From _common.yml; the core of section 11 of the report is why price per install has risen, and letting this section go stale means nobody is watching that question.

  # ── Coverage supplement (constitution rule 2 requires covering returns on capital; the fast-grower template has no such test) ──
  - id: APP-Q4
    type: quantitative
    claim: "Needs almost no capital: return on invested capital stays at the level of an excellent business"
    origin: manual
    severity: watch
    covers: [returns_on_capital]
    pillar: P1
    effective_from: FY2026Q3
    metric: roic
    fail_if: Below 12% for 2 consecutive years
    rule: {op: "<", threshold: 12, unit: "%", consecutive: 2, period: year}
    data: xbrl
    first_readable: 2027-02
    baseline:
      value: [124, 135]
      unit: "%"
      period: TTM
      as_of: 2026-06-30
      source: APP-8K-2026-08-05#EX-99.1
      note: "The report's reading, which can be recomputed from primary inputs: TTM (FY2025Q3–FY2026Q2) continuing-operations operating income of $5.288 billion at tax rates of 22% and 15% gives $4.13 billion and $4.50 billion after tax, divided by invested capital of $3.335 billion at 2026-06-30 (stockholders' equity $3.163 billion + long-term debt $3.515 billion − cash $3.053 billion − equity-method investments $290 million) [src:APP-8K-2026-02-11#EX-99.1][src:APP-8K-2026-08-05#EX-99.1]; the report defines neither the two tax rates nor invested capital [src:APP-RPT1-2026-09-23#p6]."
    note: "The fast-grower template has no return-on-capital test, so this borrows the stalwart template's default threshold. In 2025, purchases of property and equipment were $470,000, plus $18.67 million of finance-lease principal (the company counts both as property and equipment needs), about $19.14 million in total, about 0.35% of revenue [src:APP-8K-2026-02-11#EX-99.1]; this test guards against an outsized acquisition or self-built compute inflating invested capital."

  # ── Thesis breakers (section 09 of the report; the thesis is void once one occurs) ──
  - id: APP-Q5
    type: quantitative
    claim: The slowdown has not turned into a stall that cannot be stopped
    origin: report:breaker
    severity: breaker
    covers: [growth, moat]
    pillar: P2
    effective_from: FY2026Q3
    metric_def:
      id: axon_unit_drivers_yoy
      description: "Year-on-year change in the two revenue drivers the company discloses (installs, net revenue per install), which describe only one product line, the demand-side AppLovin Ads (formerly Axon Ads Manager). Name under which they are reported: still AppDiscovery in the Q2 2025 10-Q, Axon Advertising in the Q3 10-Q, Axon Ads Manager in the FY2025 10-K and the Q1 2026 10-Q, and AppLovin Ads from the Q2 2026 10-Q on; the filings give no separate explanation of the renaming, and the way the two drivers are disclosed has not changed [src:APP-10Q-FY2025Q2#Item2][src:APP-10Q-FY2025Q3#Item2][src:APP-10K-FY2025#Item7][src:APP-10Q-FY2026Q1#Item2][src:APP-10Q-FY2026Q2#Item2]. Q4 is not reported separately; the annual report gives only the full year [src:APP-10K-FY2025#Item7]."
      unit: "%"
      frequency: quarter
      data: filing_text
      where: Key metrics in the 10-Q MD&A; full-year figures are in the 10-K
      components:
        installs: {description: Installs driven by ads (YoY), unit: "%"}
        net_revenue_per_install: {description: "Net revenue per install (price per install, YoY)", unit: "%"}
    fail_if: In any two consecutive quarters, advertising revenue growth below 15% year on year, and installs negative year on year in the same quarters
    rule:
      all_of:
        - {metric: revenue_yoy, op: "<", threshold: 15, unit: "%", consecutive: 2, period: quarter}
        - {metric: axon_unit_drivers_yoy.installs, op: "<", threshold: 0, unit: "%", consecutive: 2, period: quarter}
      note: Both conditions must hold together in the same two consecutive quarters; since the games were sold, all continuing-operations revenue comes from advertising, so advertising revenue growth is total revenue growth.
    data: filing_text
    first_readable: 2026-11
    baseline:
      value: [53, -2]
      unit: "%"
      period: 2026Q2
      as_of: 2026-06-30
      source: APP-RPT1-2026-09-23#p5
      note: "In order: advertising revenue YoY, installs YoY."
    note: Breaker 1 in section 09 of the report (growth break).

  - id: APP-Q6
    type: quantitative
    claim: Profit still turns into cash for the owners
    origin: report:breaker
    severity: breaker
    covers: [free_cash_flow]
    pillar: P1
    effective_from: FY2026Q3
    metric_def:
      id: owner_fcf_margin_ttm
      description: Owner free cash flow over the past four quarters (free cash flow less stock-based compensation) ÷ revenue over the same period; free cash flow as defined in the company's earnings press releases
      unit: "%"
      frequency: quarter
