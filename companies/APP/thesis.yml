  - "2026 年三季度预注册候选（报告第 04 节）：回购纪律的第一次读数是三季度纯回购不少于二季度。三季度的比较和预注册都取现金流量表的纯回购，即 Repurchases of common stock 一行、不含代扣税，与报告的口径相同[src:APP-RPT1-2026-09-23#p9]：二季度为 5.512 亿美元（上半年 15.330 亿减一季度 9.817 亿），另付的代扣税 0.196 亿不计入[src:APP-10Q-FY2026Q2#Item1-cash-flows][src:APP-10Q-FY2026Q1#Item1-cash-flows]；三季度用前三季度的这一行减上半年的 15.330 亿。股东权益变动表记的二季度回购是 5.317 亿（110.5 万股）[src:APP-10Q-FY2026Q2#Item1-equity]，业绩新闻稿的“回购与代扣合计 5.513 亿”是它加上代扣税 0.196 亿[src:APP-8K-2026-08-05#EX-99.1]，这两个数都不是本条的口径。这是一次性检验，放进预注册，不写成长期测试。"
  - "报告第 04 节的二季度回购“均价约 484 美元”不能引用[src:APP-RPT1-2026-09-23#p9]：报告自己说明它按新闻稿的股数推算、股数含代扣，即用现金流量表的回购额除以含代扣股的股数，两种口径混在一起。10-Q 的逐月回购表给出二季度回购 110.5 万股，按各月股数加权的均价约 476.8 美元（含佣金与费用）[src:APP-10Q-FY2026Q2#PartII-Item2]。APP 的任何文件都不引用 484。"
