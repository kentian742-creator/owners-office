category_rationale: "FY2026Q2 revenue was up 53% year on year, and the FY2026Q3 revenue guidance midpoint of $2.070 billion is about +47.3% on FY2025Q3's $1.405 billion, growth far above Lynch's fast-grower range [src:APP-8K-2026-08-05#EX-99.1][src:APP-8K-2025-11-05#EX-99.1]. The secondary category is cyclical: in 2022, during the first rate-hiking cycle after the IPO, total revenue grew only 0.9%, and FY2022Q3 and FY2022Q4 were −2% and −11% year on year, with the drag coming from the games business, then about 63% of revenue (−17% for the year), while the advertising business that alone remains today (then the Software Platform segment) still grew 55.7% for the year [src:APP-10K-FY2022#Item7][src:APP-10Q-FY2022Q3#note-3]. The new variable today is e-commerce advertisers, which are more procyclical and not yet tested by rate hikes [src:APP-RPT1-2026-09-23#p14], and the Fed raised rates again on 2026-09-16 [src:FED-FOMC-2026-09-16]."
