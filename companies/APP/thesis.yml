  - id: APP-L5
    type: qualitative
    claim: 供给侧的聚合层没有流失
    origin: report:breaker
    severity: breaker
    covers: [moat, competition]
    pillar: P3
    effective_from: FY2026Q3
    question: （a）最近两个季度，公司披露的 MAX 发布商收入是否都是环比下降；或者（b）最近四个季度内，是否已有三家以上头部发行商（Sensor Tower 最近一期年度游戏报告所列上一年全球手游发行商收入前 10 名或下载量前 10 名）公开表示已把旗下游戏的广告聚合从 MAX 换到其他平台？
    fail_if: 是（任一情形）
    judge: independent_model
    evidence: required
    where: 业绩新闻稿（8-K Item 2.02 附件 99.1）、10-Q MD&A、业绩电话会逐字稿；头部发行商及其母公司的新闻稿、官方博客、年报与交易所公告；Sensor Tower 最近一期年度游戏报告（2026 年版为《State of Gaming 2026》）的全球手游发行商排行
    lookback: 4
    judge_notes:
      - （a）只认公司自己的表述；公司只给方向性描述、不给数值时按方向判定；公司不再描述、无从判断方向时，（a）记为 undetermined。
      - （b）头部发行商按集团计：旗下工作室并入集团，同一集团只算一家；取不到所述排行时，（b）记为 undetermined，并写明缺什么。
      - （b）只认发行商本人或其母公司的公开表述（新闻稿、官方博客、年报或交易所公告、高管的公开发言）；只有媒体报道或其他第三方说法的不计。
      - “三家以上”含三家。
    first_readable: 2026-11
    baseline:
      value: 公司称二季度 MAX 发布商收入环比两位数增长、在竞价瀑布中的份额稳定
      source: APP-RPT1-2026-09-23#p6
    note: "报告第 09 节破坏信号 8（聚合层流失）。CloudX 由 MoPub 与 MAX 的创始人和原班团队在 2025 年 11 月创立，Meta 是首发合作方之一[src:APP-RPT1-2026-09-23#p8]。2026-09-24 改写（b）：报告原文“三家以上头部发行商公开改用其他聚合平台”没有定义头部发行商，也没有时间窗，照原写法每季都无法判定；现以 Sensor Tower 年度游戏报告的发行商收入前 10 名与下载量前 10 名界定头部，时间窗取最近四个季度，只认发行商本人或其母公司的公开表述。本条自 FY2026Q3 起生效，改写时还没有任何一期按它判定过。登记时找不到可以引用、可以冻结的头部发行商名单：报告没有列出；Sensor Tower 的公开网页（H1 2026 游戏市场指数、State of Gaming 2026 与 State of Mobile 2026 的介绍页、每月全球手游前十榜）只有游戏榜和 PC／主机发行商榜，手游发行商排行只在要申请下载的完整报告里，判定员每季打不开。所以（b）保留上面的写法，取不到排行即记为 undetermined；拿到可引用的名单后，另写一条列明名单的新测试并 supersedes 本条。"

  # ── 每季的五个指标（报告第 09 节；fail = 警戒线，warn = 未达健康线）──
  - id: APP-Q9
    type: quantitative
    claim: 模型节奏还在：收入兑现自己给的指引
    origin: report:watch
    severity: watch
    covers: [growth, management]
    pillar: P2
    effective_from: FY2026Q3
    metric_def:
      id: guidance_delivery
      description: "收入对指引的兑现。"
      unit: "% / pp（按分量）"
      frequency: quarter
      data: filing_text
      where: 本季与上一季的业绩新闻稿（8-K Item 2.02 附件 99.1）；四季度收入由 10-K 全年数减前三季
      components:
        vs_mid: {description: 当季收入 ÷ 上一季业绩新闻稿给出的本季收入指引区间中值 − 1, unit: "%"}
        q4_qoq_accel: {description: 四季度收入环比增速减三季度收入环比增速（只在四季度读）, unit: pp}
    fail_if: 连续两季低于指引中值，或同比跌破 20%
    rule:
      any_of:
        - {metric: guidance_delivery.vs_mid, op: "<", threshold: 0, unit: "%", consecutive: 2, period: quarter}
        - {metric: revenue_yoy, op: "<", threshold: 20, unit: "%", consecutive: 1, period: quarter}
    warn_if: "单季收入低于指引中值；或四季度旺季收入环比没有比三季度再加速（健康线：三季度落在 20.55–20.85 亿美元、不低于中值，四季度旺季环比再加速[src:APP-RPT1-2026-09-23#p15]）"
    warn_rule:
      any_of:
        - {metric: guidance_delivery.vs_mid, op: "<", threshold: 0, unit: "%", consecutive: 1, period: quarter}
        - {metric: guidance_delivery.q4_qoq_accel, op: "<=", threshold: 0, unit: pp, consecutive: 1, period: year}
    data: filing_text
    first_readable: 2026-11
    baseline:
      value: [19.24, 19.15, 19.45]
      unit: 亿美元
      period: 2026Q2
      as_of: 2026-06-30
      source: APP-RPT1-2026-09-23#p9
      note: 依次为二季度实际收入、指引下限、指引上限；实际低于中值。
    note: "报告第 09 节每季指标 1（收入与指引兑现）。二季度调整后 EBITDA 16.14 亿美元，也低于指引下限 16.15 亿美元，这是 2022 年改为只给季度指引以来的第一次[src:APP-RPT1-2026-09-23#p9]。"

