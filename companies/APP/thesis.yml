thesis:
  summary: "AppLovin runs both MAX, the auction house for mobile-game ads, and Axon, the model that bids for advertisers; after it sold its game studios in 2025, only the advertising business is left. FY2026Q2 revenue was $1.924 billion, +53% year on year, with a 77.7% operating margin [src:APP-8K-2026-08-05#EX-99.1]. It needs almost no capital: return on invested capital is about 124%–135% (TTM to 2026-06-30) [src:APP-RPT1-2026-09-23#p6]. But its lead is a processing advantage, not a structural one, and has to be re-earned every quarter by the model beating rivals. Year-on-year growth in price per install (net revenue per install) slowed from +93% in FY2026Q1 to +58% in FY2026Q2 [src:APP-10Q-FY2026Q1#Item2][src:APP-10Q-FY2026Q2#Item2]; in the same quarter Unity's Vector grew +23% quarter on quarter (per Unity's earnings call, not disclosed in filings) [src:U-CALL-FY2026Q2]. The report places it at \"ordinary business × excellent management\" (business and management both B+); whether it moves up depends on whether, in FY2026Q3 and FY2026Q4 with the new CTO in office, it delivers on guidance and steadies price per install or installs [src:APP-RPT1-2026-09-23#p10]."
  pillars:
    - id: P1
      claim: "A high-margin business that needs almost no capital: FY2026Q2 operating margin 77.7% [src:APP-8K-2026-08-05#EX-99.1], return on invested capital about 124%–135% (TTM to 2026-06-30) [src:APP-RPT1-2026-09-23#p6]; purchases of property and equipment in 2025 were only $470,000, and only about $19 million including finance-lease principal [src:APP-8K-2026-02-11#EX-99.1]; 2025 free cash flow was $3.95 billion (company definition, including the Apps business discontinued in the first half) [src:APP-8K-2026-02-11#EX-99.1]; TTM (to 2026-06-30) owner free cash flow was about 62% of revenue [src:APP-8K-2026-02-11#EX-99.1][src:APP-8K-2026-08-05#EX-99.1]."
      source: APP-8K-2026-08-05#EX-99.1
    - id: P2
      claim: "The lead is a processing advantage: supply and training data are both bought and only the model is built in-house, so the lead has to be re-earned every quarter by Axon beating rivals [src:APP-RPT1-2026-09-23#p6]; since the games were sold and the first-party content data lost, advertising revenue growth year on year has been +68% (FY2025Q3), +66% (FY2025Q4), +59% (FY2026Q1) and +53% (FY2026Q2), lower each quarter [src:APP-8K-2025-11-05#EX-99.1][src:APP-8K-2026-02-11#EX-99.1][src:APP-8K-2026-05-06#EX-99.1][src:APP-8K-2026-08-05#EX-99.1]."
      source: APP-RPT1-2026-09-23#p6
    - id: P3
      claim: "MAX, the supply-side aggregation layer, holds: the company says publisher revenue on MAX grew by double digits quarter on quarter in FY2026Q2 and its share of the bidding waterfall was stable (per the company's earnings call, not disclosed in filings) [src:APP-CALL-FY2026Q2#CEO]; when an outside buyer wins on MAX, APP charges the winner 5% [src:APP-RPT1-2026-09-23#p6]."
      source: APP-CALL-FY2026Q2#CEO
    - id: P4
      claim: "E-commerce and other non-gaming advertisers grow into a second growth curve: consumer advertiser spend in FY2026Q2 was 28% higher than in FY2025Q4 (per the company's earnings call, not disclosed in filings) [src:APP-CALL-FY2026Q2#CEO]; the report estimates that to complete the base-case growth path, non-gaming revenue needs to reach about 20%–30% of revenue by 2031, with the first reading in the first half of 2027 [src:APP-RPT1-2026-09-23#p14]."
      source: APP-RPT1-2026-09-23#p14
    - id: P5
      claim: "Management acts like owners, and its capital allocation can be checked: on the latest restated basis, non-core losses in 2021–2025 (discontinued-operations losses of $210 million in 2023–2025, plus at most the 2022 impairment and disposal losses of $128 million on the Apps business) are about 3.6%–5.7% of after-tax operating income over the same period (operating income of $6.938 billion × 85%) [src:APP-10K-FY2025#Item8][src:APP-10K-FY2022#Item7]; on the originally reported basis, the numerator is only the 2025 discontinued-operations loss of $99 million and operating income is $6.776 billion, about 1.7%–3.9% [src:APP-10K-FY2024#Item7][src:APP-10K-FY2025#Item8]; the games business's losses in 2021–2022 were not reported separately, so both bases are only lower bounds. New financing was about 6% of the $6.48 billion returned to shareholders in 2022–2025 [src:APP-RPT1-2026-09-23#p1]; MoPub was folded into MAX for about $1.03 billion (the audited purchase consideration, about $1.05 billion as announced) [src:APP-10K-FY2022#Note6][src:APP-8K-2022-01-05#Item2.01], and the games business was sold as a whole. Marked down for the CEO's 61.6% of the voting power (as of 2026-03-31, 66.9% in total under the voting agreement) [src:APP-DEF14A-2026-04-21#p58], incentives tied only to share price and time, FY2026Q2 revenue below the guidance midpoint, and the CTO and Chief Legal Officer transitions in the middle of 2026 [src:APP-RPT1-2026-09-23#p1]."
      source: APP-RPT1-2026-09-23#p1
    - id: P6
      claim: "The structural risk has not materialized: the auction house (MAX) and the in-house buyer (Axon) belong to one company and are built on Apple's and Google's rules, and this structure has not been broken up by regulators, courts or platform rules [src:APP-RPT1-2026-09-23#p11]; on the FY2026Q2 call the CFO said the SEC had told the company that its investigation was closed with no enforcement action recommended (per the company's earnings call, the filings do not disclose the investigation) [src:APP-CALL-FY2026Q2#CFO]."
      source: APP-RPT1-2026-09-23#p11
  permanent_loss_paths:
    - "An engine stall that does not stop: if the model cadence breaks after the CTO transition while Vector and CloudX accelerate together and Meta and Google pull budgets back into in-app bidding, growth in price per install falls below 30% without installs turning positive, and in the end advertising revenue grows less than 15% year on year for two consecutive quarters with installs negative [src:APP-RPT1-2026-09-23#p11][src:APP-RPT1-2026-09-23#p12]."
    - "The structure is taken away in one stroke: a regulator or court requires the structural separation of MAX and Axon, or Apple and Google pull device signals and in-app context into system-level interfaces; the report holds that no discount rate can cover such a loss [src:APP-RPT1-2026-09-23#p12]."
    - "Trust and data compliance: the report records three controversies in fifteen years (2019, 2021, 2025), all first discovered by outsiders; only the 2025 one has a primary record, the securities class action and shareholder derivative suits since March 2025 [src:APP-10Q-FY2026Q2#PartII-Item1], while the others, and the claim that outsiders found them first, are L2 only, no primary data seen [src:APP-RPT1-2026-09-23#p11]; if a government agency or court finds the data collection unlawful and requires changes to Axon's data inputs, the model's raw material will be rewritten."
    - "The rise in price per install is really take rate, not the model: if MAX publisher revenue keeps growing more slowly than APP's revenue, the lead is only a bigger cut taken from publishers [src:APP-RPT1-2026-09-23#p17], and aggregation layers such as CloudX get a chance to route around it; CloudX was formed by the founders of MoPub and MAX with core members of both original teams, and announced its launch on 2025-11-13 [src:APP-WEB-2025-11-13-1]."
    - "People and capital go wrong together: shrinking equity-heavy pay raises the cost of retaining core engineers and slows model iteration, a reflexive loop [src:APP-RPT1-2026-09-23#p10]; or key people leave without internal successors; or an outsized acquisition is made in search of growth (in April 2025 the company submitted to the President of the United States a preliminary proposal to acquire all of TikTok's business outside China) [src:APP-8K-2025-04-03#Item8.01]."

