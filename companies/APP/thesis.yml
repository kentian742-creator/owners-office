  - id: APP-Q11
    type: quantitative
    claim: 现金转换守在报告基准情景假设的水平上
    origin: report:watch
    severity: watch
    covers: [free_cash_flow]
    pillar: P1
    effective_from: FY2026Q3
    metric_def:
      id: owner_fcf_margin_ttm
      description: 过去四个季度的所有者自由现金流（自由现金流减股权激励）÷ 同期收入；自由现金流按公司业绩新闻稿的口径
      unit: "%"
      frequency: quarter
      data: xbrl
      xbrl: [us-gaap:NetCashProvidedByUsedInOperatingActivities, us-gaap:PaymentsToAcquirePropertyPlantAndEquipment, us-gaap:ShareBasedCompensation, us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax, us-gaap:Revenues]
      formula: "sum_4q(operating_cash_flow - capex - stock_based_compensation) / sum_4q(revenue)"
    fail_if: TTM 低于 55%
    rule: {op: "<", threshold: 55, unit: "%", consecutive: 1, period: quarter}
    warn_if: "全年（四季度末的 TTM）低于 58%（健康线：全年不低于报告基准情景的起点 58%，即下半年所有者自由现金流约 27.7 亿美元、占下半年收入约 63%[src:APP-RPT1-2026-09-23#p15]）"
    warn_rule: {op: "<", threshold: 58, unit: "%", consecutive: 1, period: year, evaluate_on: [FY2026]}
    data: xbrl
    first_readable: 2026-11
    baseline: {value: 62, unit: "%", period: TTM, as_of: 2026-06-30, source: APP-RPT1-2026-09-23#p15}
    note: "报告第 09 节每季指标 3（所有者自由现金流率）。管理层的全年自由现金流指引约为调整后 EBITDA 的 75%，按全年估计约 51 亿美元，上半年已有约 21.5 亿美元[src:APP-RPT1-2026-09-23#p6]。"

  - id: APP-Q12
    type: quantitative
    claim: 对手的加速没有持续压过 APP 自己的节奏
    origin: report:watch
    severity: watch
    covers: [competition, moat]
    pillar: P2
    effective_from: FY2026Q3
    metric_def:
      id: vector_speed_gap
      description: "APP 与 Unity Vector 的速度差。"
      unit: "% / pp（按分量）"
      frequency: quarter
      data: mixed
      where: Unity 季度业绩新闻稿与电话会；APP 本季与上一季的业绩新闻稿
      components:
        vector_qoq: {description: Vector 收入环比（Unity 口径）, unit: "%", where: Unity 季度业绩电话会与新闻稿（电话会不是 SEC 文件）}
        app_vs_mid: {description: APP 当季收入 ÷ 上一季给出的指引中值 − 1, unit: "%", where: APP 本季与上一季的业绩新闻稿（8-K Item 2.02 附件 99.1）}
        gap_change: {description: 本季速度差（Vector 环比 − APP 收入环比）减上季速度差, unit: pp}
    fail_if: Vector 环比保持两位数，同时 APP 收入环比连续两季低于指引中值
    rule:
      all_of:
        - {metric: vector_speed_gap.vector_qoq, op: ">=", threshold: 10, unit: "%", consecutive: 2, period: quarter}
        - {metric: vector_speed_gap.app_vs_mid, op: "<", threshold: 0, unit: "%", consecutive: 2, period: quarter}
      note: “保持两位数”按同样的连续两个季度都达到两位数理解。
    warn_if: 速度差没有收窄，或 APP 收入环比低于指引中值（健康线：速度差收窄；APP 收入环比不低于指引中值）
    warn_rule:
      any_of:
