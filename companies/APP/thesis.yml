thesis:
  summary: "AppLovin 同时经营手游广告的拍卖行 MAX 和替广告主出价的 Axon 模型，2025 年卖掉游戏工作室后只剩广告业务，二季度收入 19.24 亿美元、同比 +53%，营业利润率 77.7%[src:APP-RPT1-2026-09-23#p3]。它几乎不需要资本，投入资本回报约 124%–135%[src:APP-RPT1-2026-09-23#p6]；但领先是处理优势而不是结构优势，要靠模型每个季度跑赢对手重新挣回。单价（每次安装净收入）增速从一季度 +93% 放缓到二季度 +58%，同一季度 Unity 的 Vector 环比增长 23%[src:APP-RPT1-2026-09-23#p1]。报告把它放在“普通生意 × 优秀管理层”（生意、管理层均为 B+），能否升格要看新 CTO 在任的三、四季度能否兑现指引、让单价或安装量站稳[src:APP-RPT1-2026-09-23#p10]。"
  pillars:
    - id: P1
      claim: "几乎不需要资本的高利润生意：二季度营业利润率 77.7%，投入资本回报约 124%–135%，2025 年资本开支只有 47 万美元[src:APP-RPT1-2026-09-23#p1]；2025 年自由现金流 39.5 亿美元，TTM 所有者自由现金流约占收入的 62%[src:APP-RPT1-2026-09-23#p6]。"
      source: APP-RPT1-2026-09-23#p1
    - id: P2
      claim: "领先是处理优势：供给与训练数据都是买来的，只有模型是自建的，领先要靠 Axon 每个季度跑赢对手重新挣回[src:APP-RPT1-2026-09-23#p6]；卖掉游戏、失去自有内容数据之后，广告收入同比仍有 +68%、+66%、+59%、+53%，但增速逐季走低[src:APP-RPT1-2026-09-23#p3]。"
      source: APP-RPT1-2026-09-23#p6
    - id: P3
      claim: "供给侧的聚合层 MAX 稳住：公司称二季度 MAX 上发布商收入环比两位数增长、在竞价瀑布中的份额稳定，外部买家在 MAX 中标时 APP 向中标方收取 5%[src:APP-RPT1-2026-09-23#p6]。"
      source: APP-RPT1-2026-09-23#p6
    - id: P4
      claim: "电商等非游戏广告主长成第二条增长曲线：消费类广告主支出二季度比 2025 年四季度高 28%[src:APP-RPT1-2026-09-23#p7]；报告测算，要走完基准增长路径，非游戏收入到 2031 年需占约 20%–30%，第一次读数在 2027 年上半年[src:APP-RPT1-2026-09-23#p14]。"
      source: APP-RPT1-2026-09-23#p14
    - id: P5
      claim: "管理层像所有者、资本配置可以核对：非核心损失约占同期税后营业利润的 2%–4%（下限），2022–2025 年 64.8 亿美元股东回报中新增融资约占 6%，并以约 10.5 亿美元把 MoPub 并入 MAX、把游戏业务整体卖出[src:APP-RPT1-2026-09-23#p1]；扣分在 CEO 61.6% 的投票权、只看股价与时间的激励、二季度收入低于指引中值，以及 2026 年年中的 CTO 与首席法务官交接[src:APP-RPT1-2026-09-23#p1]。"
      source: APP-RPT1-2026-09-23#p1
    - id: P6
      claim: "结构风险没有兑现：拍卖行（MAX）与自营买家（Axon）同属一家、建在苹果与谷歌的规则之上，这个结构没有被监管、法院或平台规则拆开；SEC 调查已结束且未建议执法[src:APP-RPT1-2026-09-23#p11]。"
      source: APP-RPT1-2026-09-23#p11
  permanent_loss_paths:
    - "引擎失速且停不下来：CTO 交接后模型节奏断档，Vector、CloudX 与回流竞价的 Meta、谷歌同时加速，单价增速跌破 30% 而安装量不回正，最终广告收入同比连续两季低于 15% 且安装量为负[src:APP-RPT1-2026-09-23#p11]。"
    - "结构被一次拿走：监管机构或法院要求 MAX 与 Axon 结构性分离，或苹果、谷歌把设备信号与应用内上下文收进系统级接口；报告认为这种损失不是任何折现率能覆盖的[src:APP-RPT1-2026-09-23#p12]。"
    - "信任与数据合规：十五年里三次争议（2019、2021、2025）都由外部先发现；若政府机构或法院认定数据收集违规并要求更改 Axon 的数据输入，模型的原料会被改写[src:APP-RPT1-2026-09-23#p11]。"
    - "单价上涨其实是抽成而不是模型：若 MAX 发布商收入的增速持续落后于 APP 收入，领先只是从发布商那里多拿了一块，由 MAX 与 MoPub 原班人马重建的 CloudX 这类聚合层就有机会绕过它[src:APP-RPT1-2026-09-23#p17]。"
    - "人与资本一起出错：以股权为主的薪酬缩水抬高核心工程师的留任成本、拖慢模型迭代，形成反身性回路[src:APP-RPT1-2026-09-23#p10]；或关键人离场而没有内部接替，或为找增长做超大并购（2025 年 4 月曾提交收购 TikTok 中国以外业务的初步意向）[src:APP-RPT1-2026-09-23#p9]。"

