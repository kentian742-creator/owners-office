  - id: APP-L5
    type: qualitative
    claim: There is no attrition at the supply-side aggregation layer
    origin: report:breaker
    severity: breaker
    covers: [moat, competition]
    pillar: P3
    effective_from: FY2026Q3
    question: (a) In each of the last two quarters, did MAX publisher revenue as disclosed by the company fall quarter on quarter; or (b) within the last four quarters, have three or more top publishers (the top 10 global mobile game publishers by revenue or the top 10 by downloads for the previous year, as listed in Sensor Tower's latest annual gaming report) publicly said they have moved the ad mediation of their games from MAX to another platform?
    fail_if: Yes (any of the cases)
    judge: independent_model
    evidence: required
    where: Earnings press releases (8-K Item 2.02, Exhibit 99.1), 10-Q MD&A, earnings call transcripts; press releases, official blogs, annual reports and exchange announcements of the top publishers and their parent companies; the global mobile game publisher rankings in Sensor Tower's latest annual gaming report (the 2026 edition is State of Gaming 2026)
    lookback: 4
    judge_notes:
      - (a) counts only the company's own statements; when the company gives only a directional description without numbers, judge by direction; when the company stops describing it and the direction cannot be judged, record (a) as undetermined.
      - "(b) counts top publishers by group: studios are counted with their group, and one group counts once; when the ranking described cannot be obtained, record (b) as undetermined and state what is missing."
      - (b) counts only public statements by the publisher itself or its parent company (press releases, official blogs, annual reports or exchange announcements, public remarks by executives); media reports or other third-party claims alone do not count.
      - "\"Three or more\" includes three."
    first_readable: 2026-11
    baseline:
      value: The company says MAX publisher revenue grew by double digits quarter on quarter in FY2026Q2 and its share of the bidding waterfall was stable (per the company's earnings call, not disclosed in filings)
      source: APP-CALL-FY2026Q2#CEO
    note: "Breaker 8 in section 09 of the report (attrition at the aggregation layer). CloudX was formed by the founders of MoPub and MAX (Jim Payne, Dan Sack) with core members of both original teams and announced its launch on 2025-11-13; Meta is one of its launch partners (along with Liftoff and Magnite) [src:APP-WEB-2025-11-13-1]. (b) was rewritten on 2026-09-24: the report's original wording, \"three or more top publishers publicly switch to other aggregation platforms\", defined neither top publishers nor a time window, so as written it could not be judged in any quarter; top publishers are now defined by the top 10 publishers by revenue and the top 10 by downloads in Sensor Tower's annual gaming report, the time window is the last four quarters, and only public statements by the publisher itself or its parent company count. This test is in effect from FY2026Q3; no period had been judged under it when it was rewritten. At registration no citable list of top publishers that could be frozen was found: the report lists none; Sensor Tower's public web pages (the H1 2026 games market index, the landing pages of State of Gaming 2026 and State of Mobile 2026, the monthly global top-ten mobile games charts) have only game charts and PC/console publisher rankings, and the mobile game publisher rankings are only in the full reports, which require a download request and which the judge cannot open each quarter. So (b) keeps the wording above and is recorded as undetermined when the ranking cannot be obtained; once a citable list is available, write a new test that names the list and supersedes this one."

