  # ── Conditions for upgrading back (section 05 of the report: conditions for the business to return from B+ to A−) ──
  - id: APP-Q13
    type: quantitative
    claim: The model cadence is institutional and does not depend on particular people
    origin: report:watch
    severity: watch
    covers: [moat, management]
    pillar: P2
    effective_from: FY2026Q3
    metric_def:
      id: upgrade_check
      description: "The conditions for upgrading back in section 05 of the report."
      unit: "% / pp (by component)"
      frequency: quarter
      data: filing_text
      where: Earnings press releases and 10-Qs for Q3 and Q4 2026, and the FY2026 10-K; whether the CTO is in office is governed by 8-K Item 5.02
      components:
        vs_mid: {description: Quarterly revenue ÷ the guidance midpoint given in the previous quarter − 1 (read for Q3 and Q4 2026), unit: "%"}
        q4_qoq_accel: {description: Q4 revenue growth quarter on quarter minus Q3 revenue growth quarter on quarter, unit: pp}
        installs: {description: "Installs YoY (read from the Q3 10-Q; Q4 is not reported separately)", unit: "%"}
        net_revenue_per_install: {description: "Net revenue per install (price per install) YoY (read from the Q3 10-Q; Q4 is not reported separately)", unit: "%"}
    fail_if: Revenue below the guidance midpoint in either Q3 or Q4 2026 with the new CTO in office; or Q4 peak-season revenue growth quarter on quarter not re-accelerating from Q3; or installs below zero year on year with growth in price per install below 30%
    rule:
      any_of:
        - {metric: upgrade_check.vs_mid, op: "<", threshold: 0, unit: "%", consecutive: 1, period: quarter}
        - {metric: upgrade_check.q4_qoq_accel, op: "<=", threshold: 0, unit: pp, consecutive: 1, period: year}
        - all_of:
            - {metric: upgrade_check.installs, op: "<", threshold: 0, unit: "%", consecutive: 1, period: quarter}
            - {metric: upgrade_check.net_revenue_per_install, op: "<", threshold: 30, unit: "%", consecutive: 1, period: quarter}
          evaluate_on: [FY2026Q3]
      evaluate_on: [FY2026Q3, FY2026Q4]
      note: Read only Q3 and Q4 2026 (the new CTO, Giovanni Ge, in office since 2026-07-01 [src:APP-8K-2026-04-07#EX-99.1][src:APP-FORM3-2026-07-02]); the installs and price-per-install branch reads the Q3 10-Q, with the FY2026 10-K full-year figures for reference only.
    data: filing_text
    first_readable: 2026-11
    baseline:
      value: FY2026Q2 (before the new CTO took office) revenue $1.924 billion, below the guidance midpoint; installs −2% year on year, price per install +58% year on year
      source: APP-8K-2026-08-05#EX-99.1
      note: "Guidance is in the previous quarter's earnings press release [src:APP-8K-2026-05-06#EX-99.1]; installs and price per install are in the 10-Q MD&A [src:APP-10Q-FY2026Q2#Item2]."
    note: "From the conditions for upgrading back in section 05 of the report, not one of the five indicators of section 09: a pass sends the business rating for review (B+ to A−); a fail only means the business stays at B+. Section 11 of the report adds that the upgrade under this test applies only when the model reading prevails (price per install holds while the consumer share does not jump, and publisher revenue grows no slower than APP) [src:APP-RPT1-2026-09-23#p17]."

