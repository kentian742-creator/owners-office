    note: "报告第 09 节每季指标 4（与 Vector 的速度差）。公司不拆分游戏与非游戏收入，这一行用总收入代替[src:APP-RPT1-2026-09-23#p15]。Vector 的增量里有多少来自 ironSource 迁移、多少从 APP 或其他渠道抢来，现有数据无法区分[src:APP-RPT1-2026-09-23#p7]。"

  - id: APP-L6
    type: qualitative
    claim: 电商（非游戏广告主）在变成可以量化的第二条曲线
    origin: report:watch
    severity: watch
    covers: [growth]
    pillar: P4
    effective_from: FY2026Q3
    question: 最近两个季度的业绩新闻稿、10-Q 与业绩电话会中，公司是否都没有给出电商（消费类广告主）业务的任何量化读数？
    fail_if: 是（连续两季不再量化）；或 Haus 跑赢当季中位效率的比例连续两季低于 50%、且测过的品牌不再加投
    warn_if: 公司仍未披露消费类占比，或四季度旺季环比没有加速（健康线：公司开始披露消费类占比；四季度旺季环比加速）
    judge: independent_model
    evidence: required
    where: 业绩新闻稿（8-K Item 2.02 附件 99.1）、10-Q MD&A、业绩电话会逐字稿；Haus 分支读 Haus 公开的季度数据（二手、利益相关方，只作旁证）
    lookback: 2
    judge_notes: Haus 分支要两个条件同时成立：跑赢当季中位效率的比例连续两季低于 50%，且测过的品牌不再加投。
    first_readable: 2026-11
    baseline:
      value: 消费类广告主支出二季度较 2025 年四季度 +28%；Haus 跑赢当季中位效率的比例 50%
      source: APP-RPT1-2026-09-23#p15
    note: "报告第 09 节每季指标 5（电商的量化进展）。Haus 同时是公司官网案例的合作测量方，属利益相关方[src:APP-RPT1-2026-09-23#p11]。"

  # ── 升回条件（报告第 05 节：生意从 B+ 回到 A− 的条件）──
  - id: APP-Q13
    type: quantitative
    claim: 模型节奏是制度性的、不依赖特定的人
    origin: report:watch
    severity: watch
    covers: [moat, management]
    pillar: P2
    effective_from: FY2026Q3
    metric_def:
      id: upgrade_check
      description: "报告第 05 节的升回条件。"
      unit: "% / pp（按分量）"
      frequency: quarter
      data: filing_text
      where: 2026 年三、四季度的业绩新闻稿与 10-Q、FY2026 10-K；CTO 是否在任以 8-K Item 5.02 为准
      components:
        vs_mid: {description: 当季收入 ÷ 上一季给出的指引中值 − 1（读 2026 年三、四季度）, unit: "%"}
        q4_qoq_accel: {description: 四季度收入环比增速减三季度收入环比增速, unit: pp}
        installs: {description: 安装量同比（读三季度 10-Q，四季度不单列）, unit: "%"}
        net_revenue_per_install: {description: 每次安装净收入（单价）同比（读三季度 10-Q，四季度不单列）, unit: "%"}
    fail_if: 新 CTO 在任的 2026 年三、四季度中任一季收入低于指引中值；或四季度旺季收入环比没有比三季度再加速；或安装量同比低于零且单价增速低于 30%
    rule:
      any_of:
        - {metric: upgrade_check.vs_mid, op: "<", threshold: 0, unit: "%", consecutive: 1, period: quarter}
        - {metric: upgrade_check.q4_qoq_accel, op: "<=", threshold: 0, unit: pp, consecutive: 1, period: year}
        - all_of:
            - {metric: upgrade_check.installs, op: "<", threshold: 0, unit: "%", consecutive: 1, period: quarter}
            - {metric: upgrade_check.net_revenue_per_install, op: "<", threshold: 30, unit: "%", consecutive: 1, period: quarter}
          evaluate_on: [FY2026Q3]
      evaluate_on: [FY2026Q3, FY2026Q4]
      note: 只读 2026 年三、四季度（新 CTO 自 2026-07-01 在任）；安装量与单价一支读三季度 10-Q，FY2026 10-K 的全年数只作参照。
    data: filing_text
    first_readable: 2026-11
    baseline:
      value: 二季度（新 CTO 上任前）收入 19.24 亿美元，低于指引中值；安装量同比 −2%，单价同比 +58%
      source: APP-RPT1-2026-09-23#p15
    note: "来自报告第 05 节的升回条件，不是第 09 节的五个指标之一：通过即提交生意评级复核（B+ 到 A−），失败只表示生意维持 B+。报告第 11 节补充：模型读法占上风（单价稳住而消费类占比没有跳升、发布商收入增速不低于 APP）时才按这一条升格[src:APP-RPT1-2026-09-23#p17]。"

