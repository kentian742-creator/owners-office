  - id: APP-FY2026Q3-1
    statement: >-
      FY2026Q3 revenue is no lower than the midpoint of the company's own revenue guidance for the quarter
      ($2,070 million).
    probability: 0.6
    criterion: >-
      Settle on revenue for the three months ended 2026-09-30, from the "Revenue" line of the condensed
      consolidated statements of operations, in thousands of USD. The threshold is 2,070,000 thousand USD, the
      midpoint of the $2,055–2,085 million FY2026Q3 revenue guidance in the FY2026Q2 earnings press release
      [src:APP-8K-2026-08-05#EX-99.1]. Any later change to that guidance does not change the threshold.
      Happened if revenue ≥ 2,070,000 thousand USD. Equality counts as happened. Do not round before comparing.
      Source order: the FY2026Q3 10-Q XBRL fact for the duration 2026-07-01 to 2026-09-30 prevails
      (us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax, or us-gaap:Revenues if that is the concept
      tagged). If it differs from the FY2026Q3 earnings press release (8-K Item 2.02, Exhibit 99.1), write both
      and settle on the XBRL figure. Use the figure as first reported in the FY2026Q3 10-Q. A later restatement
      does not change the outcome. If the 10-Q is not filed by 2026-12-31, settle on the press-release figure.
      If neither is available by 2026-12-31, record undetermined.
    data_source: "FY2026Q3 10-Q, Item 1 condensed consolidated statements of operations (XBRL); fallback: FY2026Q3 earnings press release, 8-K Item 2.02 Exhibit 99.1"
