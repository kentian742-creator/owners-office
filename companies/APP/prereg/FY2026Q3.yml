      buybacks, and cash at 2026-06-30 was $3,053.3 million [src:APP-8K-2026-08-05#EX-99.1]. $1,756 million of
      authorization remained [src:APP-10Q-FY2026Q2#PartII-Item2]. $18.5 million of repurchases accrued at
      2026-06-30 will be paid in Q3 cash [src:APP-10Q-FY2026Q2#Item1-cash-flows]. Held below 0.8 because the CFO
      said cash taxes concentrate in Q2 and Q3 [src:APP-CALL-FY2026Q2#CFO].
  - id: APP-FY2026Q3-3
    statement: >-
      FY2027 revenue grows at least 20% over FY2026.
    probability: 0.6
    criterion: >-
      FY2027 revenue growth = revenue for the year ended 2027-12-31 ÷ revenue for the year ended 2026-12-31 − 1.
      Take both figures from the consolidated statements of operations in the FY2027 10-K, using that 10-K's
      comparative column for FY2026, so that any restatement or discontinued-operations reclassification applies
      to both years. Happened if growth ≥ 20.0% after rounding to one decimal place. 20.0% counts as happened.
      The 10-K XBRL facts for the annual durations prevail (us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax
      or us-gaap:Revenues); where they differ from the rendered statement or the FY2027Q4 earnings press release,
      write both. Use reported revenue with no pro forma adjustment, with one exception: if the FY2027 10-K
      discloses that businesses acquired after 2026-10-02 contributed more than 5% of FY2027 revenue, record
      undetermined. If the FY2027 10-K is not filed by 2028-03-31, settle on the full-year figures in the FY2027Q4
      earnings press release (8-K Item 2.02, Exhibit 99.1), compared in the same way. If neither exists by
      2028-03-31, record undetermined.
    data_source: "FY2027 10-K, Item 8 consolidated statements of operations (XBRL); fallback: FY2027Q4 earnings press release, 8-K Item 2.02 Exhibit 99.1"
    horizon: 18m
    resolves_by: '2028-02-29'
