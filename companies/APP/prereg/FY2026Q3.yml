    pillar: P5
    falsifies_thesis: false
    reference: >-
      Reference class: this company's quarter-to-quarter changes in pure repurchases. On the equity-statement basis
      the readings are FY2025Q1 $1,001.7 million, FY2025Q2 $270.1 million, FY2026Q1 $1,013.8 million and FY2026Q2
      $531.7 million [src:APP-10Q-FY2026Q2#Item1-equity]. Repurchases fell from Q1 to Q2 in both years read.
      FY2025Q3 is not in the materials, so the frequency of Q3 ≥ Q2 cannot be verified. Starting point (judgment):
      0.6, raised to 0.7 for four reasons. The CFO attributed the Q2 slowdown to low cash flow
