    falsifies_thesis: false
    reference: >-
      Reference class: this company's quarterly revenue measured against the midpoint of the guidance it gave a
      quarter earlier. The materials give one reading. FY2026Q2 revenue was $1,923.7 million against a $1,915–1,945
      million range, 0.3% below the $1,930 million midpoint [src:APP-8K-2026-08-05#EX-99.1][src:APP-8K-2026-05-06#EX-99.1].
      The frequency across earlier quarters cannot be verified from the materials. Starting point (judgment): 0.6,
      for a guidance range only ±0.7% wide. Kept at 0.6 because the evidence pulls both ways. For: the CEO said a
      larger model improvement shipped after Q2 ended [src:APP-CALL-FY2026Q2#CEO]. Against: Unity guided Vector to
      +19%–21% quarter on quarter for Q3 [src:U-CALL-FY2026Q2], and the Fed raised rates on 2026-09-16
      [src:FED-FOMC-2026-09-16].
  - id: APP-FY2026Q3-2
    statement: >-
      Pure share repurchases in FY2026Q3, measured on the cash flow statement and excluding withholding taxes, are
      no smaller than FY2026Q2's $551.2 million.
    probability: 0.7
    criterion: >-
      Q3 pure buybacks = the "Repurchases of common stock" line in financing activities of the condensed
      consolidated statement of cash flows in the FY2026Q3 10-Q, for the nine months ended 2026-09-30, in
      thousands of USD and taken as a positive outflow, minus 1,532,952 thousand USD. The 1,532,952 figure is the
      same line for the six months ended 2026-06-30 [src:APP-10Q-FY2026Q2#Item1-cash-flows], and it is used as
      registered even if a later filing revises it (note any revision). Q2 pure buybacks = 1,532,952 − 981,723 =
      551,229 thousand USD [src:APP-10Q-FY2026Q2#Item1-cash-flows][src:APP-10Q-FY2026Q1#Item1-cash-flows].
      Happened if Q3 pure buybacks ≥ 551,229 thousand USD. Equality counts as happened. None of the following is
      used: the "Payment of withholding taxes related to net share settlement" line, the statement of
      stockholders' equity, the Part II Item 2 repurchase table, or the press release's combined
      repurchase-and-withholding figure. The XBRL fact us-gaap:PaymentsForRepurchaseOfCommonStock for the
      nine-month duration prevails over the rendered text; where they differ, write both. If the nine-month line
      is relabeled or combined with withholding taxes so that pure repurchases cannot be read, record undetermined
      and state why. If the FY2026Q3 10-Q is not filed by 2026-12-31, record undetermined.
    data_source: "FY2026Q3 10-Q, Item 1 condensed consolidated statement of cash flows, financing activities (XBRL us-gaap:PaymentsForRepurchaseOfCommonStock); six-month base from the FY2026Q2 10-Q cash flow statement"
    horizon: quarter
    resolves_by: '2026-11-30'
    domain: digital_advertising
