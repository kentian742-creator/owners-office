    reference: >-
      Reference class: this company's own cash conversion. TTM to 2026-06-30 the ratio was 61.9%. In H1 2026 it
      was 52.6%: free cash flow of $2,150.1 million less stock-based compensation of $169.0 million, divided by
      revenue of $3,766.1 million [src:APP-10Q-FY2026Q2#Item2][src:APP-10Q-FY2026Q2#Item1-cash-flows]. Cash income
      taxes rose to $639.8 million in H1 2026 from $100.6 million in H1 2025
      [src:APP-10Q-FY2026Q2#Item1-cash-flows]. Own calculation: the H1 2026 adjusted EBITDA margin was 84.2%
      [src:APP-8K-2026-08-05#EX-99.1] and stock-based compensation was 4.5% of revenue. At free cash flow equal to
      75% of adjusted EBITDA, as management guides for 2026 [src:APP-CALL-FY2026Q2#CFO], the ratio is about 58.7%.
      At H1 2026's actual conversion of 67.8%, it is about 52.6%. Starting point (judgment): 0.6, lowered to 0.55
      because stock-based compensation in research and development quadrupled year on year in Q2
      [src:APP-10Q-FY2026Q2#Note8] and compute costs are rising.
  - id: APP-FY2026Q3-5
    statement: >-
      By early 2028 the company quantifies, in an SEC filing, the revenue (or share of revenue or advertiser spend)
      that comes from e-commerce or other non-gaming advertisers.
    probability: 0.25
    criterion: >-
      Scope: documents the company files on EDGAR (CIK 0001751008) from 2026-10-02 through 2028-02-29, limited to
      Forms 10-Q, 10-K and 8-K, including exhibits furnished under Items 2.02 or 7.01.
      Happened if at least one of them states a qualifying figure: a dollar amount of revenue, a percentage of
      total revenue, or a percentage of total advertiser spend, for a stated period, attributable to advertisers
      outside mobile gaming. Any label the company uses for that group counts, including e-commerce, consumer, web
      or non-gaming advertisers, and so does a revenue disaggregation by advertiser vertical in the revenue note.
      Not qualifying: growth rates without a stated base amount or share; counts of advertisers; figures that
      appear only in earnings calls, webinars, slides or letters not filed as exhibits; and third-party figures
      quoted by the company. If the scope of a label is ambiguous, judge only by the company's own definition in
      the filing. If no definition is given, record undetermined and quote the passage. Not happened if no
      qualifying statement exists in that window.
    data_source: "All Forms 10-Q, 10-K and 8-K (with exhibits) filed on EDGAR by CIK 0001751008 from 2026-10-02 through 2028-02-29"
