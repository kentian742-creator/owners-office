    falsifies_thesis: true
    reference: >-
      Reference class: this company's own growth path. Year-on-year growth fell each quarter, from +68% in FY2025Q3
      to +53% in FY2026Q2 [src:APP-8K-2025-11-05#EX-99.1][src:APP-8K-2026-08-05#EX-99.1]. Q2 revenue rose 4.4%
      quarter on quarter (1,923,686 ÷ 1,842,449 thousand USD − 1, with Q1 equal to first-half revenue of 3,766,135
      less Q2), and the Q3 guidance midpoint implies +7.6% [src:APP-8K-2026-08-05#EX-99.1]. Own calculation: if
      Q3 lands at the $2,070 million midpoint, FY2027 reaches +20% only if revenue grows about 4.3% a quarter on
      average from FY2026Q4 through FY2027Q4. The one rate-hiking cycle since the IPO (2022) left the business that
      remains today growing 55.7% for the year [src:APP-10K-FY2022#Item7]. Starting point (judgment): 0.65, lowered
      to 0.6 for two reasons. The Fed raised rates on 2026-09-16 [src:FED-FOMC-2026-09-16]. E-commerce advertisers
      are more procyclical and have not yet been tested by a hiking cycle.
  - id: APP-FY2026Q3-4
    statement: >-
      FY2027 owner free cash flow (company-defined free cash flow less stock-based compensation) is at least 55% of
      FY2027 revenue.
    probability: 0.55
    criterion: >-
      Ratio = (FY2027 Free Cash Flow − FY2027 stock-based compensation) ÷ FY2027 revenue.
      Free Cash Flow: the company's reported figure for the year ended 2027-12-31 in its Free Cash Flow
      reconciliation, defined as net cash provided by operating activities less purchases of property and
      equipment and principal payments of finance leases [src:APP-8K-2026-08-05#EX-99.1]. Take it from the FY2027
      10-K MD&A; if it is absent there, take it from the FY2027Q4 earnings press release. If the company no longer
      reports Free Cash Flow or changes its definition, compute it from the FY2027 10-K as net cash provided by
      operating activities − purchases of property and equipment − principal payments of finance leases. Deduct
      only purchases of property and equipment if finance-lease principal is not shown separately, and state the
      computation either way.
      Stock-based compensation: the "Stock-based compensation, excluding cash-settled awards" line of the FY2027
      consolidated statement of cash flows (us-gaap:ShareBasedCompensation), not the figure in the adjusted EBITDA
      reconciliation.
      Revenue: the FY2027 "Revenue" line of the consolidated statements of operations.
      Happened if the ratio ≥ 55.0% after rounding to one decimal place. Equality counts as happened. 10-K XBRL
      facts prevail over rendered text; where they differ, write both. A restatement after the 10-K is filed does
      not change the outcome. If the inputs are not available by 2028-03-31, record undetermined.
    data_source: "FY2027 10-K, Item 7 Free Cash Flow reconciliation and Item 8 consolidated statement of cash flows and statement of operations (XBRL); fallback: FY2027Q4 earnings press release, 8-K Item 2.02 Exhibit 99.1"
    horizon: 18m
