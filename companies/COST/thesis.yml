  earnings_form: 8-K
  annual_form: 10-K
category: stalwart
category_rationale: "Net sales grew about 9.9% a year from FY2016 to FY2026 [src:COST-10K-FY2018#IS] [src:COST-10K-FY2026#Item8], reaching total revenue of $303,154 m in FY2026 [src:COST-10K-FY2026#Item8], so Costco is a large, steady compounder growing at the stalwart pace rather than a fast grower."
