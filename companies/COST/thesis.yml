  - id: COST-Q13
    type: quantitative
    claim: Pretax return on capital stays at the level the funding model produces
    origin: archive:watch
    severity: watch
    covers: [returns_on_capital]
    pillar: P3
    effective_from: FY2027Q1
    metric_def:
      id: pretax_return_on_capital
      description: Operating income ÷ (total equity including noncontrolling interests + long-term debt including current portion − cash and cash equivalents), at fiscal year-end; short-term investments and leases excluded
      unit: "%"
      frequency: year
      data: xbrl
      xbrl: [us-gaap:OperatingIncomeLoss, us-gaap:StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest, us-gaap:LongTermDebtNoncurrent, us-gaap:LongTermDebtCurrent, us-gaap:CashAndCashEquivalentsAtCarryingValue]
      formula: operating_income / (total_equity + long_term_debt_noncurrent + long_term_debt_current - cash)
    fail_if: below 35% for a fiscal year
    rule: {op: "<", threshold: 35, unit: "%", consecutive: 1, period: year}
    warn_if: below 40% for a fiscal year
    warn_rule: {op: "<", threshold: 40, unit: "%", consecutive: 1, period: year}
    data: xbrl
