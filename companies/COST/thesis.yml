    warn_if: outside 3.5%–4.3% for a fiscal year
    warn_rule: {op: outside, threshold: [3.5, 4.3], unit: "%", consecutive: 1, period: year}
    data: xbrl
    baseline: {value: 3.85, unit: "%", period: FY2026, source: COST-10K-FY2026#Item8}
