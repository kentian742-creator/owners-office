    warn_rule: {op: "<", threshold: 1.5, unit: "%", consecutive: 1, period: quarter}
    data: filing_text
    baseline: {value: 3.3, unit: "%", period: FY2026Q4, source: COST-8K-2026-09-24#EX-99.2}
