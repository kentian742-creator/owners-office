    severity: watch
    covers: [growth, moat]
    pillar: P1
    effective_from: FY2027Q1
    metric_def:
      id: paid_members_yoy
      description: Year-on-year change in total paid members at quarter-end, on the same counting basis
      unit: "%"
      frequency: quarter
      data: filing_text
      where: Earnings 8-K Exhibit 99.2 membership slide; 10-K Item 1 (Membership)
    fail_if: below 2.0% at two consecutive quarter-ends
    rule: {op: "<", threshold: 2.0, unit: "%", consecutive: 2, period: quarter}
    warn_if: below 3.0% at a quarter-end
    warn_rule: {op: "<", threshold: 3.0, unit: "%", consecutive: 1, period: quarter}
    data: filing_text
    baseline: {value: 3.8, unit: "%", period: FY2026Q4, source: COST-8K-2026-09-24#EX-99.2}
