      unit: "%"
      frequency: quarter
      data: filing_text
      where: Earnings 8-K Exhibit 99.2 membership slide; 10-K Item 1 (Membership)
    fail_if: below 88.5% at any quarter-end
    rule: {op: "<", threshold: 88.5, unit: "%", consecutive: 1, period: quarter}
    warn_if: below 89.0% at a quarter-end
    warn_rule: {op: "<", threshold: 89.0, unit: "%", consecutive: 1, period: quarter}
    data: filing_text
    baseline: {value: 89.8, unit: "%", period: FY2026Q4, source: COST-10K-FY2026#Item1}
    note: "Dashboard indicator 2; reads whether members acquired online and abroad renew."
  - id: COST-Q11
    type: quantitative
    claim: Paid membership keeps growing
