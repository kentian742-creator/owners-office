    rule: {op: "<", threshold: 2.0, unit: "%", consecutive: 1, period: year}
    warn_if: below 4.0% for a fiscal year
    warn_rule: {op: "<", threshold: 4.0, unit: "%", consecutive: 1, period: year}
    data: filing_text
    baseline: {value: 6.6, unit: "%", period: FY2026, source: COST-8K-2026-09-24#EX-99.1}
