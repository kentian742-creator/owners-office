thesis:
  summary: >-
    NVIDIA sells complete, co-designed AI data-center systems together with the CUDA software base that runs on them.
    That combination let it move from Hopper HGX systems to Blackwell full-scale data-center solutions delivered as
    rack-scale systems [src:NVDA-10K-FY2026#Item7], hold GAAP gross margin at 75.0% in FY2027Q2
    [src:NVDA-8K-2026-08-26#EX-99.1], and turn 60.4% of FY2026 revenue into operating income
    [src:NVDA-10K-FY2026#Item7] while spending 2.8% of revenue on property, equipment and intangibles
    [src:NVDA-10K-FY2026#CF][src:NVDA-10K-FY2026#IS]. The central risk is that current earnings are a cyclical peak
    that NVIDIA is partly financing itself.
  pillars:
    - id: P1
      claim: >-
        The system-level advantage keeps GAAP gross margin above 70%, where it was 75.0% in FY2027Q2
        [src:NVDA-8K-2026-08-26#EX-99.1], against custom chips, including in-house designs by large cloud companies,
        and against other accelerated-computing suppliers such as AMD, Huawei and Intel [src:NVDA-10K-FY2026#Item1].
      source: "NVDA-8K-2026-08-26#EX-99.1"
    - id: P2
      claim: >-
        AI compute spending keeps widening from hyperscalers to AI clouds, enterprises, sovereign buyers and edge
        devices, so that mid-cycle revenue stays far above the pre-FY2024 level of $26,974M in FY2023
        [src:NVDA-10K-FY2023#Item7].
      source: "NVDA-10K-FY2023#Item7"
    - id: P3
      claim: >-
        Management keeps its new guarantees, customer equity stakes and capacity commitments small relative to cash
        generation, while continuing to return surplus cash.
  permanent_loss_paths:
    - >-
      Peak-cycle earnings: Data Center was 92.5% of FY2027Q2 revenue [src:NVDA-8K-2026-08-26#EX-99.2] and rides
      customers' capital-spending cycle; operating income fell 25% in FY2020 and 58% in FY2023
      [src:NVDA-10K-FY2020#Item7][src:NVDA-10K-FY2023#Item7], and mid-cycle earnings power could be a fraction of
      current earnings.
    - >-
      Self-financed demand: guarantees capped at $105B for an OpenAI affiliate's lease and power payments, $36B of
      AI-cloud agreement commitments, $20B of data-center leases for third parties [src:NVDA-10Q-FY2027Q2#Note10] and
      $99B of equity stakes [src:NVDA-10Q-FY2027Q2#Item2] mean losses on that support would arrive in the same downturn
      that cuts revenue.
    - >-
      Fixed supply against variable demand: $279B of supply and capacity commitments at 2026-07-26
      [src:NVDA-10Q-FY2027Q2#Note10] would produce inventory and purchase-obligation charges on a much larger base than
      the $4.5B H20 charge of FY2026Q1 [src:NVDA-10K-FY2026#Item7].
    - >-
      Custom silicon at the largest customers erodes pricing power: two direct customers took 22% and 14% of FY2026
      revenue [src:NVDA-10K-FY2026#Note16], and those customers build their own chips [src:NVDA-10K-FY2026#Item1].
    - >-
      Political and regulatory loss of markets: China-headquartered customers fell from 19.2% of FY2025 revenue to 9.1%
      of FY2026 revenue [src:NVDA-10K-FY2026#Note16], the company states it was effectively foreclosed from China's
      data-center compute market [src:NVDA-10K-FY2026#Item1], and export rules could widen to further products
      [src:NVDA-10Q-FY2027Q2#Item1A].
tests:
  - id: NVDA-Q1
    type: quantitative
    claim: GAAP gross margin has not collapsed
    origin: archive:breaker
    severity: breaker
    covers: [moat, pricing_power]
    pillar: P1
    effective_from: FY2027Q3
    metric: gross_margin
    fail_if: "GAAP gross margin below 60.0% in two consecutive fiscal quarters"
    rule: {op: "<", threshold: 60, unit: "%", consecutive: 2, period: quarter}
    data: xbrl
    baseline: {value: 75.0, unit: "%", period: FY2027Q2, source: "NVDA-10Q-FY2027Q2#IS"}
    note: >-
      Thesis breaker 1. Decided from the 10-Q/10-K income statement on the reported basis. FY2027Q2 reading 75.0%
      [src:NVDA-10Q-FY2027Q2#IS].

  - id: NVDA-Q2
    type: quantitative
    claim: Data Center revenue has not collapsed
    origin: archive:breaker
    severity: breaker
    covers: [growth, moat]
    pillar: P2
    effective_from: FY2027Q3
    metric: segment_revenue_yoy
    params:
      segment: Data Center
      basis: "Data Center market platform (Hyperscale plus AI Clouds, Industrial and Enterprise) in the revenue-by-market-platform table; prior-year quarter as presented in the same filing"
    fail_if: "Data Center revenue down 30% or more from the same quarter a year earlier, in two consecutive fiscal quarters"
    rule: {op: "<=", threshold: -30, unit: "%", consecutive: 2, period: quarter}
    data: filing_text
    note: >-
      Thesis breaker 2. Decided from the 10-Q/10-K revenue-by-market-platform table. FY2027Q2 reading: $89,023M against
      $41,096M, up 117% [src:NVDA-10Q-FY2027Q2#Note13][src:NVDA-8K-2026-08-26#EX-99.2]. The market platforms were
      redefined from FY2027Q1 [src:NVDA-8K-2026-05-20#EX-99.2]; compare against the prior-year figure on the basis the
      filing presents. FY2027Q4 has 14 weeks [src:NVDA-10Q-FY2027Q2#Note1], so the FY2028Q4 comparison carries one
      week less and is read as reported.

  - id: NVDA-Q3
    type: quantitative
    claim: Inventory and purchase-obligation provisions stay in line with revenue
    origin: archive:breaker
    severity: breaker
    covers: [balance_sheet, growth]
    pillar: P2
    effective_from: FY2027Q3
    metric_def:
      id: inventory_provisions_to_revenue
      description: Provisions for inventory and excess inventory purchase obligations for the fiscal year ÷ revenue for the fiscal year
      unit: "%"
      frequency: year
      data: filing_text
      where: 10-K Item 7 (MD&A), Gross Profit and Gross Margin; revenue from the 10-K income statement
      formula: provisions / revenue
      components:
        provisions:
          description: Provisions for inventory and excess inventory purchase obligations for the fiscal year, as stated in MD&A
          unit: USD
          where: 10-K Item 7, Gross Profit and Gross Margin
        revenue:
          description: Total revenue for the fiscal year
          unit: USD
          where: 10-K income statement
    fail_if: "Provisions for inventory and excess inventory purchase obligations above 10% of revenue for a fiscal year"
    rule: {op: ">", threshold: 10, unit: "%", consecutive: 1, period: year}
    data: filing_text
    note: >-
      Thesis breaker 3. FY2026 reading: $7.2B on revenue of $215.9B, or 3.3% [src:NVDA-10K-FY2026#Item7]. Provisions
      on supply bought ahead of demand drove the FY2023 decline [src:NVDA-10K-FY2023#Item7].

  - id: NVDA-Q4
    type: quantitative
    claim: NVIDIA's data-center lease guarantees have not been called
    origin: archive:breaker
    severity: breaker
    covers: [balance_sheet, capital_allocation]
    pillar: P3
    effective_from: FY2027Q3
    metric_def:
      id: lease_guarantee_calls
      description: >-
        Payments NVIDIA has made under its guarantees of data-center lease obligations (the land, power and shell
        guarantees of AI-cloud partners' leases, and the guarantees of lease and power payments at SB Energy's PORTS
        campus), cumulative since the first guarantee; and whether NVIDIA has assumed a guaranteed lease after a tenant
        default
      unit: USD
      frequency: quarter
      data: filing_text
      where: guarantees section of the commitments note of the 10-Q/10-K (Note 10 in the FY2027Q2 10-Q); any 8-K
      components:
        cumulative_payments:
          description: Cumulative payments made by NVIDIA under data-center lease guarantees, as disclosed or as summed across filings
          unit: USD
          where: commitments and guarantees note of the 10-Q/10-K; 8-K
        lease_assumed:
          description: A filing discloses that NVIDIA assumed a guaranteed lease after a tenant default
          unit: event
          where: commitments and guarantees note of the 10-Q/10-K; 8-K
    fail_if: "Cumulative payments by NVIDIA under data-center lease guarantees (SB Energy or AI-cloud guarantees) above $5B, or NVIDIA assumes a guaranteed lease after a tenant default"
    rule:
      any_of:
        - {metric: lease_guarantee_calls.cumulative_payments, op: ">", threshold: 5000000000, unit: USD, consecutive: 1, period: quarter}
        - {metric: lease_guarantee_calls.lease_assumed, op: event, period: event}
    data: filing_text
    note: >-
      Thesis breaker 4. Reading as of the FY2027Q2 10-Q: no payment disclosed; maximum gross exposure $108.5B, of which
      $105.0B is the SB Energy guarantees signed in August 2026 and $3.5B is for AI clouds
      [src:NVDA-10Q-FY2027Q2#Note10]. The SB Energy guarantees take effect only as each lease commences, the first
      phase expected in FY2029 [src:NVDA-10Q-FY2027Q2#Note10]. OpenAI's reimbursement undertaking is not netted
      against payments [src:NVDA-8K-2026-08-17#Item1.01][src:NVDA-10Q-FY2027Q2#Item1A].

  - id: NVDA-Q5
    type: quantitative
    claim: Debt stays below liquid assets
    origin: archive:breaker
    severity: breaker
    covers: [balance_sheet, capital_allocation]
    pillar: P3
    effective_from: FY2027Q3
    metric_def:
      id: debt_to_liquid_assets
      description: Total debt (net carrying amount, including the current portion) ÷ (cash and cash equivalents + marketable debt securities) at the fiscal quarter-end
      unit: x
      frequency: quarter
      data: filing_text
      where: 10-Q/10-K balance sheet and debt note
      formula: total_debt / liquid_assets
      components:
        total_debt:
          description: Total debt, net carrying amount, including the current portion
          unit: USD
          where: 10-Q/10-K debt note
        liquid_assets:
          description: Cash and cash equivalents plus marketable debt securities (excluding marketable equity securities)
          unit: USD
          where: 10-Q/10-K balance sheet
    fail_if: "Total debt above cash, cash equivalents and marketable debt securities at a fiscal quarter-end"
    rule: {op: ">", threshold: 1, unit: x, consecutive: 1, period: quarter}
    data: filing_text
    note: >-
      Thesis breaker 5. Reading as of 2026-07-26: $33.4B of debt (net carrying amount; $33.5B principal) against $56.6B
      of cash, cash equivalents and marketable debt securities [src:NVDA-10Q-FY2027Q2#Note9][src:NVDA-10Q-FY2027Q2#Item2].

  - id: NVDA-Q6
    type: quantitative
    claim: GAAP gross margin holds at the level of a system-level advantage
    origin: archive:watch
    severity: watch
    covers: [pricing_power, moat]
    pillar: P1
    effective_from: FY2027Q3
    metric: gross_margin
    fail_if: "GAAP gross margin below 65% in any quarter"
    rule: {op: "<", threshold: 65, unit: "%", consecutive: 1, period: quarter}
    warn_if: "GAAP gross margin below 70% in any quarter"
    warn_rule: {op: "<", threshold: 70, unit: "%", consecutive: 1, period: quarter}
    data: xbrl
    baseline: {value: 75.0, unit: "%", period: FY2027Q2, source: "NVDA-8K-2026-08-26#EX-99.1"}
    note: >-
      Dashboard M1. Read from the 8-K Item 2.02 EX-99.1 income statement and 10-Q Item 1. FY2027Q2 reading 75.0%
      [src:NVDA-8K-2026-08-26#EX-99.1]; FY2027Q3 outlook 74.0% plus or minus 0.5 points [src:NVDA-8K-2026-08-26#EX-99.1].

  - id: NVDA-Q7
    type: quantitative
    claim: Operating income keeps turning into free cash flow
    origin: archive:watch
    severity: watch
    covers: [free_cash_flow]
    pillar: P3
    effective_from: FY2027Q3
    metric_def:
      id: fcf_to_operating_income_ttm
      description: Free cash flow as the company defines it ÷ GAAP operating income, both summed over the trailing four fiscal quarters
      unit: "%"
      frequency: quarter
      data: filing_text
      where: 8-K Item 2.02 EX-99.1 free-cash-flow reconciliation and income statement
      formula: free_cash_flow_ttm / operating_income_ttm
      components:
        free_cash_flow_ttm:
          description: Free cash flow as reconciled by the company, sum of the trailing four fiscal quarters
          unit: USD
          where: 8-K EX-99.1 free-cash-flow reconciliation
        operating_income_ttm:
          description: GAAP operating income, sum of the trailing four fiscal quarters
          unit: USD
          where: 8-K EX-99.1 or 10-Q/10-K income statement
    fail_if: "Trailing-four-quarter free cash flow below 45% of trailing-four-quarter operating income"
    rule: {op: "<", threshold: 45, unit: "%", consecutive: 1, period: quarter}
    warn_if: "Trailing-four-quarter free cash flow below 60% of trailing-four-quarter operating income"
    warn_rule: {op: "<", threshold: 60, unit: "%", consecutive: 1, period: quarter}
    data: filing_text
    note: >-
      Dashboard M2. FY2027Q2 reading 64.2%: free cash flow of $126,886M over operating income of $197,579M for the four
      quarters to FY2027Q2 [src:NVDA-8K-2026-08-26#EX-99.1][src:NVDA-8K-2026-02-25#EX-99.1][src:NVDA-10Q-FY2027Q2#IS][src:NVDA-10K-FY2026#IS].
      The reading is depressed by receivables built under extended payment terms [src:NVDA-10Q-FY2027Q2#Item2]; the
      healthy range assumes those terms do not spread.

  - id: NVDA-Q8
    type: quantitative
    claim: Customer payment terms are not stretching cash collection
    origin: archive:watch
    severity: watch
    covers: [free_cash_flow, balance_sheet]
    pillar: P3
    effective_from: FY2027Q3
    metric_def:
      id: days_sales_outstanding
      description: Days sales outstanding at the fiscal quarter-end, as the company reports it
      unit: days
      frequency: quarter
      data: filing_text
      where: 8-K Item 2.02 EX-99.2 CFO commentary, balance sheet section
    fail_if: "Days sales outstanding above 70 days"
    rule: {op: ">", threshold: 70, unit: days, consecutive: 1, period: quarter}
    warn_if: "Days sales outstanding above 55 days"
    warn_rule: {op: ">", threshold: 55, unit: days, consecutive: 1, period: quarter}
    data: filing_text
    baseline: {value: 60, unit: days, period: FY2027Q2, as_of: "2026-07-26", source: "NVDA-8K-2026-08-26#EX-99.2"}
    note: >-
      Dashboard M3. 45 days at the end of FY2027Q1 and 60 days at the end of FY2027Q2, the rise attributed to extended
      payment terms on large, multi-quarter agreements with certain investment-grade customers
      [src:NVDA-8K-2026-05-20#EX-99.2][src:NVDA-8K-2026-08-26#EX-99.2]. The FY2027Q2 reading is already inside the warn band.

  - id: NVDA-Q9
    type: quantitative
    claim: Supply commitments do not run far ahead of revenue
    origin: archive:watch
    severity: watch
    covers: [balance_sheet, growth]
    pillar: P2
    effective_from: FY2027Q3
    metric_def:
      id: supply_commitments_to_revenue_ttm
      description: Total supply and capacity commitments at the fiscal quarter-end ÷ revenue of the trailing four fiscal quarters
      unit: x
      frequency: quarter
      data: filing_text
      where: commitments note of the 10-Q/10-K (Note 10 in the FY2027Q2 10-Q); revenue from the income statements
      formula: supply_commitments / revenue_ttm
      components:
        supply_commitments:
          description: Total supply and capacity commitments at the fiscal quarter-end
          unit: USD
          where: commitments note of the 10-Q/10-K
        revenue_ttm:
          description: Total revenue, sum of the trailing four fiscal quarters
          unit: USD
          where: 10-Q/10-K income statement
    fail_if: "Supply and capacity commitments above 1.25x trailing-four-quarter revenue"
    rule: {op: ">", threshold: 1.25, unit: x, consecutive: 1, period: quarter}
    warn_if: "Supply and capacity commitments above 1.0x trailing-four-quarter revenue"
    warn_rule: {op: ">", threshold: 1.0, unit: x, consecutive: 1, period: quarter}
    data: filing_text
    note: >-
      Dashboard M4. Reading at 2026-07-26: $279B of commitments over trailing-four-quarter revenue of $302,970M, or
      0.92x [src:NVDA-10Q-FY2027Q2#Note10][src:NVDA-10Q-FY2027Q2#IS][src:NVDA-10K-FY2026#IS]. Commitments were $119B one
      quarter earlier [src:NVDA-10Q-FY2027Q2#Note10].

  - id: NVDA-Q10
    type: quantitative
    claim: Inventory and purchase-obligation provisions do not erode gross margin
    origin: archive:watch
    severity: watch
    covers: [balance_sheet, growth]
    pillar: P2
    effective_from: FY2027Q3
    metric_def:
      id: provision_gross_margin_impact
      description: Net unfavorable impact on GAAP gross margin of provisions for inventory and excess inventory purchase obligations, in percentage points (unfavorable is positive)
      unit: pp
      frequency: quarter
      data: filing_text
      where: 10-Q Item 2, Gross Profit and Gross Margin
    fail_if: "Net gross-margin impact of inventory and purchase-obligation provisions above 4.0 points in any quarter"
    rule: {op: ">", threshold: 4.0, unit: pp, consecutive: 1, period: quarter}
    warn_if: "Net gross-margin impact above 2.0 points"
    warn_rule: {op: ">", threshold: 2.0, unit: pp, consecutive: 1, period: quarter}
    data: filing_text
    baseline: {value: 0.8, unit: pp, period: FY2027Q2, source: "NVDA-10Q-FY2027Q2#Item2"}
    note: >-
      Dashboard M5. The impact was 7.5 points in FY2023 [src:NVDA-10K-FY2023#Item7], 2.6 points in FY2026
      [src:NVDA-10K-FY2026#Item7] and 0.8 points in FY2027Q2 [src:NVDA-10Q-FY2027Q2#Item2].

  - id: NVDA-Q11
    type: quantitative
    claim: Balance-sheet support for customers stays small relative to cash generation
    origin: archive:watch
    severity: watch
    covers: [capital_allocation, balance_sheet, management]
    pillar: P3
    effective_from: FY2027Q3
    metric_def:
      id: support_exposure_to_fcf_ttm
      description: >-
        (Maximum gross exposure under data-center lease guarantees, including signed guarantees not yet effective, +
        AI-cloud agreement commitments) ÷ free cash flow as the company defines it, trailing four fiscal quarters
      unit: x
      frequency: quarter
      data: filing_text
      where: 10-Q/10-K commitments note, guarantees and additional commitments (Note 10 in the FY2027Q2 10-Q); 8-K EX-99.1 free cash flow; any 8-K signing a guarantee
      formula: (guarantee_max_exposure + ai_cloud_commitments) / free_cash_flow_ttm
      components:
        guarantee_max_exposure:
          description: Maximum gross exposure under data-center lease guarantees, including signed guarantees not yet effective
          unit: USD
          where: 10-Q/10-K commitments note; 8-K
        ai_cloud_commitments:
          description: Commitments under AI-cloud agreements
          unit: USD
          where: 10-Q/10-K commitments note
        free_cash_flow_ttm:
          description: Free cash flow as reconciled by the company, sum of the trailing four fiscal quarters
          unit: USD
          where: 8-K EX-99.1 free-cash-flow reconciliation
        guarantee_payment:
          description: Any payment made by NVIDIA under a data-center lease guarantee
          unit: event
          where: 10-Q/10-K commitments note; 8-K
    fail_if: "Ratio above 1.75x, or any payment made under a guarantee"
    rule:
      any_of:
        - {metric: support_exposure_to_fcf_ttm, op: ">", threshold: 1.75, unit: x, consecutive: 1, period: quarter}
        - {metric: support_exposure_to_fcf_ttm.guarantee_payment, op: event, period: event}
    warn_if: "Ratio above 1.25x"
    warn_rule: {op: ">", threshold: 1.25, unit: x, consecutive: 1, period: quarter}
    data: filing_text
    note: >-
      Dashboard M6. Reading on the FY2027Q2 10-Q filed 2026-08-26: ($108.5B of guarantees + $36B of AI-cloud
      commitments) over $126,886M of trailing free cash flow = 1.14x
      [src:NVDA-10Q-FY2027Q2#Note10][src:NVDA-8K-2026-02-25#EX-99.1][src:NVDA-8K-2026-08-26#EX-99.1]. The numerator
      already counts the full $105B SB Energy cap signed 2026-08-17, after the quarter end
      [src:NVDA-10Q-FY2027Q2#Note10]; on guarantees in force at 2026-07-26 alone the reading is 0.31x
      [src:NVDA-10Q-FY2027Q2#Note10][src:NVDA-8K-2026-02-25#EX-99.1][src:NVDA-8K-2026-08-26#EX-99.1]. The reading rises
      if NVIDIA exercises its option to back about 3.8 further gigawatts [src:NVDA-10Q-FY2027Q2#Note10].

  - id: NVDA-Q12
    type: quantitative
    claim: No single direct customer becomes dominant
    origin: archive:watch
    severity: watch
    covers: [customer_concentration]
    pillar: P2
    effective_from: FY2027Q3
