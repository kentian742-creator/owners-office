    data: filing_text
    baseline: {value: 16, unit: "%", period: FY2027Q2, source: "NVDA-10Q-FY2027Q2#Note13"}
    note: >-
      Dashboard M7. Read from the 10-Q segment note (Note 13) and the 10-K segment note (Note 16). 16% in FY2027Q2
      [src:NVDA-10Q-FY2027Q2#Note13]; 22% in FY2026 [src:NVDA-10K-FY2026#Note16].

  - id: NVDA-Q13
    type: quantitative
    claim: Buybacks more than offset employee issuance
    origin: archive:watch
    severity: watch
    covers: [capital_allocation]
    pillar: P3
    effective_from: FY2027Q3
    metric: diluted_shares_yoy
    fail_if: "Diluted weighted shares up more than 0.5% from the same quarter a year earlier"
    rule: {op: ">", threshold: 0.5, unit: "%", consecutive: 1, period: quarter}
    warn_if: "Diluted weighted shares up from the same quarter a year earlier"
    warn_rule: {op: ">", threshold: 0, unit: "%", consecutive: 1, period: quarter}
    data: xbrl
    baseline: {value: -1.0, unit: "%", period: FY2027Q2, source: "NVDA-10Q-FY2027Q2#Note3", note: "24,285M in FY2027Q2 against 24,532M in FY2026Q2"}
    note: >-
      Dashboard M8. Read from the 10-Q net income per share note (Note 3). In FY2026, 282M shares were repurchased while
      shares outstanding fell 173M, as 160M were issued to employees and 51M withheld for taxes
      [src:NVDA-10K-FY2026#Equity].

  - id: NVDA-Q14
    type: quantitative
    claim: The Data Center cycle has not turned into its declining stage
    origin: template:cyclical
    severity: watch
    covers: [growth]
    pillar: P2
    effective_from: FY2027Q3
    metric: segment_revenue_yoy
    params:
      segment: Data Center
      basis: "Data Center market platform (Hyperscale plus AI Clouds, Industrial and Enterprise) in the revenue-by-market-platform table; prior-year quarter as presented in the same filing"
    fail_if: "Data Center revenue down from the same quarter a year earlier, in two consecutive fiscal quarters"
    rule: {op: "<", threshold: 0, unit: "%", consecutive: 2, period: quarter}
    data: filing_text
    note: >-
      Replaces the template's provision-for-credit-losses test, which has no meaning for a company without a loan book.
      The cycle indicator the archive names is Data Center revenue through the cycle; this watch fires before thesis
      breaker NVDA-Q2 does. FY2027Q2 reading: up 117% [src:NVDA-10Q-FY2027Q2#Note13]. FY2027Q4 has 14
      weeks [src:NVDA-10Q-FY2027Q2#Note1], so the FY2028Q4 comparison carries one week less and is read as reported.

  - id: NVDA-Q15
    type: quantitative
    claim: Leverage has not risen ahead of the low point of the cycle
    origin: template:cyclical
    severity: watch
    covers: [balance_sheet]
    pillar: P3
    effective_from: FY2027Q3
    metric_def:
      id: debt_to_liquid_assets
      description: Total debt (net carrying amount, including the current portion) ÷ (cash and cash equivalents + marketable debt securities) at the fiscal quarter-end
      unit: x
      frequency: quarter
      data: filing_text
      where: 10-Q/10-K balance sheet and debt note
      formula: total_debt / liquid_assets
      components:
        total_debt:
          description: Total debt, net carrying amount, including the current portion
          unit: USD
          where: 10-Q/10-K debt note
        liquid_assets:
          description: Cash and cash equivalents plus marketable debt securities (excluding marketable equity securities)
          unit: USD
          where: 10-Q/10-K balance sheet
    fail_if: "Total debt above 0.75x cash, cash equivalents and marketable debt securities at a fiscal quarter-end"
    rule: {op: ">", threshold: 0.75, unit: x, consecutive: 1, period: quarter}
    data: filing_text
    note: >-
      Replaces the template's net debt ÷ EBITDA test: NVIDIA holds more liquid assets than debt, and the archive avoids
      EBITDA. Total debt rose from $8,468M at the end of FY2026 [src:NVDA-10K-FY2026#Note11] to $33.4B at 2026-07-26
      after $25.0B of notes issued in June 2026 [src:NVDA-10Q-FY2027Q2#Note9]; against $56.6B of liquid assets
      [src:NVDA-10Q-FY2027Q2#Item2] the reading is 0.59x. The threshold flags further borrowing well before thesis
      breaker NVDA-Q5 fires.

  - id: NVDA-Q16
    type: quantitative
    claim: Returns on operating capital stay above the worst year in the record
    origin: manual
    severity: watch
    covers: [returns_on_capital, moat]
    pillar: P1
    effective_from: FY2027Q3
    metric_def:
      id: roic_operating
      description: >-
        After-tax operating income ÷ operating invested capital at the fiscal year-end. Operating invested capital =
        shareholders' equity + total debt (current and long-term) − cash and cash equivalents − marketable securities
        (debt and equity) − equity investments (non-marketable equity securities and publicly held equity in other
        assets). After-tax operating income = operating income × (1 − effective tax rate), with a tax benefit set to 0%.
      unit: "%"
      frequency: year
      data: filing_text
      where: 10-K balance sheet, investment and debt notes, income statement and income tax note
      formula: nopat / operating_invested_capital
      components:
        nopat:
          description: Operating income × (1 − effective tax rate), with a negative effective rate set to 0%
          unit: USD
          where: 10-K income statement and income tax note
        operating_invested_capital:
          description: Equity + total debt − cash and cash equivalents − marketable securities − equity investments, at the fiscal year-end
          unit: USD
          where: 10-K balance sheet and investment and debt notes
    fail_if: "Return on operating invested capital below 20% for 2 consecutive fiscal years; if operating invested capital is zero or negative, after-tax operating income negative for 2 consecutive fiscal years"
    rule:
      any_of:
        - {metric: roic_operating, op: "<", threshold: 20, unit: "%", consecutive: 2, period: year}
        - {metric: roic_operating.nopat, op: "<", threshold: 0, unit: USD, consecutive: 2, period: year}
    data: filing_text
    note: >-
      Added for coverage of returns on capital, which the dashboard does not track. The registry roic deducts only cash
      and would understate this business, which holds large marketable securities and equity investments. FY2026
      reading 145.4%: after-tax operating income of $110,699M over operating invested capital of $76,114M
      [src:NVDA-10K-FY2026#BS][src:NVDA-10K-FY2026#Note7][src:NVDA-10K-FY2026#Note11][src:NVDA-10K-FY2026#IS][src:NVDA-10K-FY2026#Note13].
      The lowest complete-year reading in the record is 21.7% in FY2023: $4,224M over $19,459M
      [src:NVDA-10K-FY2023#Item7][src:NVDA-10K-FY2024#p52][src:NVDA-10K-FY2024#Note9]. When operating invested capital
      is zero or negative the ratio has no meaning, and the test reads after-tax operating income instead.

  - id: NVDA-L1
    type: qualitative
    claim: No expensive buybacks or capacity are added at the top of the cycle without a stated view of the cycle
    origin: template:cyclical
    severity: watch
    covers: [capital_allocation, management]
    pillar: P3
    effective_from: FY2027Q3
    question: >-
      For the most recent fiscal quarter covered by these documents: (a) was cash paid for repurchases of common stock,
      or cash paid for purchases related to property and equipment and intangible assets, at least 50% higher than in
      the same fiscal quarter a year earlier, in a quarter in which GAAP net income was higher than in each of the three
      preceding fiscal quarters? (b) If so, do the documents state management's assumption about how long current
      demand, revenue or profit levels will last?
    fail_if: "Yes to (a) and no to (b)"
    judge: independent_model
    evidence: required
    where:
      - "10-Q or 10-K of this period and the three before: statement of cash flows, income statement, MD&A (Item 2 or Item 7)"
      - "8-K Item 2.02 exhibits EX-99.1 (earnings release) and EX-99.2 (CFO commentary) of the same four periods"
    lookback: 4
    judge_notes:
      - Read quarterly amounts from the quarterly statement of cash flows in the earnings release (8-K EX-99.1); if only year-to-date figures are available, derive the quarter by subtracting the prior quarter's year-to-date figure of the same fiscal year.
      - Compare like fiscal quarters on the reported figures without adjustment; the fourth quarter of FY2027 has 14 weeks [src:NVDA-10Q-FY2027Q2#Note1].
      - For (b), a statement counts only if it addresses how long demand, revenue or margins will last, or what the company would do if demand fell. General risk-factor language that would apply to any period does not count.
      - If the answer to (a) is no, the answer to the test is no, and (b) is not judged.
    note: >-
      Template test for cyclicals. Cash buybacks were $19,732M in FY2027Q2 [src:NVDA-8K-2026-08-26#EX-99.1] against
      $9,721M in FY2026Q2 [src:NVDA-10Q-FY2027Q2#CF]. Supply and capacity commitments, NVIDIA's equivalent of new
      capacity, are tracked by NVDA-Q9; balance-sheet support of customers by NVDA-Q11.

  - id: NVDA-S1
    type: staleness
    claim: The moat judgment goes no longer than four quarters without a review
    origin: template:cyclical
    severity: watch
    covers: [moat]
    effective_from: FY2027Q3
    section: moat
    max_age_quarters: 4

  - id: NVDA-S2
