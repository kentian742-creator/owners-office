company: NVDA
name: NVIDIA Corporation
status: candidate
as_of: "2026-10-09"
category: cyclical
category_secondary: fast_grower
category_rationale: >-
  Revenue compounded about 46.6% a year from $6,910M in FY2017 to $215,938M in FY2026
  [src:NVDA-10K-FY2020#Item6][src:NVDA-10K-FY2026#IS], but operating income fell 25% in FY2020 and 58% in FY2023
  [src:NVDA-10K-FY2020#Item7][src:NVDA-10K-FY2023#Item7], and Data Center, 92.5% of FY2027Q2 revenue
  [src:NVDA-10Q-FY2027Q2#Note13], depends on customers' capital-spending cycle, so the stage of that cycle matters
  more than any one quarter's growth.
domain: semiconductors
