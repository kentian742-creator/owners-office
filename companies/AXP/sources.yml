    primary: true
    note: "Extends the permanent injunction to federal credit unions. It recounts that the February 2026 ruling was on cross-appeal at the Seventh Circuit, that the June ruling was made on remand, and that the parties had not yet re-instituted their appeal when the NCUA issued its preemption rule in June 2026. The docket shows no notice of appeal between 2026-06-01 and 2026-09-23."

