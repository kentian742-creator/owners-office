  - tag: SCOTUS-2018-06-25
    kind: other
    title: "Ohio v. American Express Co., No. 16-1454 (U.S. Supreme Court, decided 2018-06-25)"
    date: 2018-06-25
    url: https://www.supremecourt.gov/opinions/17pdf/16-1454_5h26.pdf
    primary: true
    note: "Holds that Amex's anti-steering provisions do not violate federal antitrust law. The provisions, in Amex's contracts with merchants, prohibit merchants from implying a preference for non-Amex cards, dissuading customers from using Amex cards, persuading customers to use other cards, imposing special restrictions, conditions, disadvantages or fees on Amex cards, or promoting other cards more than Amex."

  - tag: NDILL-2026-06-01
