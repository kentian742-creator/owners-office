    date: 2026-06-01
    url: https://storage.courtlistener.com/recap/gov.uscourts.ilnd.463030/gov.uscourts.ilnd.463030.223.0.pdf
    primary: true
    note: "On an interim remand from the Seventh Circuit, the court permanently enjoins Illinois from enforcing the Interchange Fee Limitation of its Interchange Fee Prohibition Act against national banks, banks chartered by other states subject to Riegle-Neal, federal savings associations and payment card networks. Docket: https://www.courtlistener.com/docket/69048225/illinois-bankers-association-v-raoul/ (RECAP copy)."

  - tag: NDILL-2026-09-22
