  - tag: AXP-WEB-2026-04-14-1
    kind: press_release
    title: "American Express press release: American Express Debuts Agentic Commerce Experiences (ACE) Developer Kit and Announces Industry-First Protection for Registered Agent Purchases"
    date: 2026-04-14
    url: https://www.americanexpress.com/en-us/newsroom/articles/innovation/american-express-debuts-agentic-commerce-experiences--ace--devel.html
    primary: true
    note: "The company introduces the ACE developer kit, two of whose five services (Agent Registration and Cart Context) are marked as in development, and announces Amex Agent Purchase Protection as an industry-first commitment: in the future it will protect eligible Card Members from charges related to errors by registered AI agents, with terms and conditions to apply. Read from a wire copy of the release (the newsroom page needs JavaScript)."

