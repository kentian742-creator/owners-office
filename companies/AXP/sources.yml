  - tag: DOJ-OPA-2025-01-16
    kind: press_release
    title: "U.S. Department of Justice, Office of Public Affairs, press release 25-69: American Express Agrees to Pay $108.7M to Settle Allegations of Deceptive Marketing and \"Dummy\" Account Information"
    date: 2025-01-16
    url: https://www.justice.gov/archives/opa/pr/american-express-agrees-pay-1087m-settle-allegations-deceptive-marketing-and-dummy-account
    primary: true
    note: "A $108.7 million FIRREA civil penalty over deceptive card marketing to small businesses in 2014–2017 (including overstated business income), \"dummy\" employer identification numbers on small-business cards in 2015 and the first half of 2016, and deceptive marketing of the Payroll Rewards and Premium Wire products in 2018–2021; a $30.35 million credit applies on full payment under the criminal resolution, which deals only with the wire products. Read in a browser (justice.gov refuses scripted requests)."

  - tag: USAO-EDNY-2025-01-16
    kind: press_release
    title: "U.S. Attorney's Office, Eastern District of New York, press release: American Express Agrees to Pay More Than $138 Million to Resolve Wire Fraud Investigation In Connection With The Sales And Marketing Of Wire Products"
    date: 2025-01-16
    url: https://www.justice.gov/usao-edny/pr/american-express-agrees-pay-more-138-million-resolve-wire-fraud-investigation
    primary: true
    note: "Non-prosecution agreement: a criminal fine of $77,696,000 and forfeiture of $60,700,000 over sales of the Payroll Rewards and Premium Wire wire products, launched in 2018 and discontinued in November 2021. Read in a browser (justice.gov refuses scripted requests)."

