# AXP two-way say-do ledger (thesis-ci spec §2; schema: spec/schemas/ledger.schema.json)
# The management side starts with the full-year 2026 guidance recorded in the 02 report, the reference for AXP-L1 when it judges a "cut";
# other commitments, and the system's and the owner's expectations, are recorded one by one from phase 1 onward as earnings events arrive.
company: AXP
entries:
  - id: AXP-M-2026-01
    side: management
    kind: numeric_target
    statement: "Fiscal 2026 revenue growth guidance raised to +10% and EPS guidance unchanged, with the stated reason of reinvesting the excess revenue [src:AXP-RPT1-2026-09-17#p9]."
    made_at: 2026-07-24
    due: "2026"
    source: AXP-RPT1-2026-09-17#p9
    status: pending
    note: "The report dates this to July 2026, on the same call as the second-quarter results; the Q2 earnings press release (2026-07-24) states that full-year revenue growth guidance was raised to 10% and that the part above expectations is reinvested in growth [src:AXP-8K-2026-07-24#EX-99.1], so made_at takes this date. Settled on the year-over-year change in total revenues net of interest expense in the FY2026 annual report."
  - id: AXP-M-2026-02
    side: management
    kind: numeric_target
    statement: "Fiscal 2026 EPS guidance range $17.30–$17.90 (midpoint $17.60), maintained in July 2026 [src:AXP-8K-2026-07-24#EX-99.1]."
    made_at: 2026-07-24
    due: "2026"
    source: AXP-8K-2026-07-24#EX-99.1
    status: pending
    note: "The report gives the midpoint $17.60 of the guidance range $17.30–$17.90 [src:AXP-RPT1-2026-09-17#p12] [src:AXP-8K-2026-07-24#EX-99.1] but not the date the range was first announced; it is recorded here as of the July 2026 announcement that maintained the guidance, with the same made_at as the previous entry [src:AXP-RPT1-2026-09-17#p9]. Settled on diluted EPS in the FY2026 annual report: at or above the bottom of the range, $17.30, is kept and below $17.30 is not_kept [src:AXP-8K-2026-07-24#EX-99.1]; settlement_source takes the source tag of the FY2026 10-K. If the company later changes the range, this entry is still settled against the original range recorded here, and the change is written into this note."
