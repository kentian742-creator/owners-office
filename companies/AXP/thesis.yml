# AXP thesis file (public; thesis-ci spec §4; schema: spec/schemas/thesis.schema.json)
# How it was built: first the Lynch stalwart template and the _common staleness tests, then, one by one, the
# thesis breakers (severity: breaker) and quarterly watch indicators (severity: watch) from section ten of the 02 report.
# Thresholds follow the report's text; where the report gives none, the test note states how this archive operationalizes it.
# Everything price-related (ranges, reference price, the rating of the price) is only in the private repository, owners-office-private/companies/AXP/valuation.yml.
# Revised 2026-09-24 after the fact audit and the design audit: wording and page numbers corrected, AXP-Q5 split, judgment windows written out, AXP-L6 to AXP-L8, AXP-Q15 and AXP-Q16 added.
# Revised 2026-09-27 after the first fact audit of the archive (16A → 04A), under HQ rulings A1–A14: facts re-cited to the primary documents,
#   baselines corrected where the audit found them wrong or on the wrong basis or period, and AXP-Q17 added to supersede AXP-Q8 from FY2026Q4 (ruling A5).
# Labels: "this archive's computation" = computed from a primary filing's figures (growth rates and shares to one decimal, per HQ ruling P4);
#   "as the company rounds it" = the rounded figure the company prints; "per the owner's report" = rests only on AXP-RPT1-2026-09-17;
#   "per secondary historical accounts" = rests on the secondary compilations the report itself lists, with no primary record on EDGAR.
# Locators: AXP-RPT1-2026-09-17#pN is the report's PDF page; for 10-K and 10-Q filings #pN is the filing's printed page number.
schema_version: "0.2"
company: AXP
name: American Express Company
exchange: NYSE
status: candidate
filer:
  cik: "0000004962"
  type: domestic
  fiscal_year_end: "12-31"
  earnings_form: 8-K
  annual_form: 10-K
category: stalwart
category_secondary: cyclical
# The secondary cyclical template's three tests: Q-cycle (provision growth YoY) is covered by AXP-Q12 and AXP-Q7, since the net direction of provisions and the reserve rate move earlier than provision growth and are not distorted by the base;
# Q-leverage (net debt ÷ EBITDA) does not apply, because a card issuer's new debt funds new card balances (see the AXP-Q2 note); L-cycle-capalloc is applied as AXP-L7.
category_rationale: "FY2025 total revenues net of interest expense were $72,229 million [src:AXP-10K-FY2025#p92], up 9.5% on FY2024 (this archive's computation, which the company rounds to 10%) [src:AXP-10K-FY2025#p43], and in July 2026 the company raised its 2026 revenue growth guidance to 10% [src:AXP-8K-2026-07-24#EX-99.1]: a large, steady stalwart growing at around ten percent. The secondary category is cyclical, because at bottom it is a spread lender with a subscription layer on top [src:AXP-RPT1-2026-09-17#p4], and since 1989 reported net income has fallen by 30% or more five times (1989–92, 2001, 2008–09, 2017 and 2020) [src:AXP-10K-FY1993#Ex13] [src:AXP-10K405-FY2001#Ex13] [src:AXP-10K-FY2009#Ex13] [src:AXP-10K-FY2017#Item7] [src:AXP-10K-FY2021#p92]. The 2017 fall came from a one-time $2.6 billion Tax Act charge [src:AXP-10K-FY2017#Item7], so the cyclical reading rests on the other four."
domain: payments_financial_data
depends_on:
  - industries/payments-card-networks
trust_level: 1
as_of: 2026-09-24

# Last review dates of the dossier's twelve parts and the Munger matrix = the 02 report date (the report has all twelve sections; section six places the company in the matrix)
reviewed:
  business: 2026-09-17
