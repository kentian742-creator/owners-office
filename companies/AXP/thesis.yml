tests:
  # ---------- Lynch stalwart template (two metrics that mean nothing for a card issuer replaced) and the secondary cyclical template ----------
  - id: AXP-Q1
    type: quantitative
    claim: Growth has not slipped out of the stalwart range
    origin: template:stalwart
    severity: watch
    covers: [growth]
    pillar: P1
    metric_def:
      id: revenue_net_of_interest_expense_yoy
      description: Year-on-year growth in total revenues net of interest expense (Amex's revenue basis)
      unit: "%"
      frequency: quarter
      data: xbrl
      xbrl: [us-gaap:RevenuesNetOfInterestExpense, us-gaap:Revenues]
      formula: revenue_t / revenue_{t-4q} - 1
    fail_if: Below 5% for 4 consecutive quarters
    rule: {op: "<", threshold: 5, unit: "%", consecutive: 4, period: quarter}
    warn_if: Below 8% for 2 consecutive quarters
    warn_rule: {op: "<", threshold: 8, unit: "%", consecutive: 2, period: quarter}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: 2026-10
    baseline: {value: 10, unit: "%", period: FY2025, as_of: 2025-12-31, source: AXP-RPT1-2026-09-17#p8}
    note: Corresponds to Q-growth in the stalwart template, with the template's default thresholds. Amex's revenue basis is total revenues net of interest expense; the candidate concepts for revenue_yoy in the registry might first pick up a basis with only revenue from contracts with customers and no net interest income, so the metric is defined in place with metric_def. The metric still means revenue growth, with only the revenue basis changed, so origin is template:stalwart; AXP-Q2 and AXP-Q4 switched to different metrics and are recorded as manual.

  - id: AXP-Q2
    type: quantitative
    claim: Returns on capital stay at the level of an excellent business
    origin: manual
    severity: watch
    covers: [returns_on_capital, moat]
    pillar: P1
    metric: roe
    fail_if: Below 12% for 2 consecutive years
    rule: {op: "<", threshold: 12, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: 2027-02
    note: "Replaces Q-returns (roic) in the stalwart template: for a card issuer, new debt funds new card balances and goes with the expansion of assets [src:AXP-RPT1-2026-09-17#p10], so counting interest-bearing debt as \"invested capital\" makes no sense, and return on equity is used instead. The threshold is borrowed from the template's default for return on invested capital and does not mean the same thing; the report gives no ROE reading, and the baseline is to be backfilled from the FY2025 annual report. After backfilling and before the FY2026 annual report is published, review whether this threshold suits return on equity, and write the conclusion and date into this note so that it stays registered in advance (see todo)."

  - id: AXP-Q3
    type: quantitative
    claim: Buybacks are really shrinking the share count, not just offsetting stock-based compensation
    origin: template:stalwart
    severity: watch
    covers: [capital_allocation]
    pillar: P6
    metric: diluted_shares_yoy
    fail_if: Above 0 for 2 consecutive years
    rule: {op: ">", threshold: 0, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: 2027-02
    baseline:
      value: -3
      unit: "%"
      period: 2026Q2
      as_of: 2026-06-30
      source: AXP-RPT1-2026-09-17#p6
      note: "Q2 average diluted shares, year on year; the share count fell from about 736 million in FY2023 to about 696 million in FY2025, a net reduction of 5.4% [src:AXP-RPT1-2026-09-17#p10]."

  - id: AXP-Q4
    type: quantitative
    claim: Profit turns into money actually paid out to shareholders
    origin: manual
    severity: watch
    covers: [capital_allocation, free_cash_flow]
    pillar: P6
    metric_def:
      id: capital_return_to_common_ni_3y
      description: Rolling three years of (common stock buybacks + common dividends) ÷ net income attributable to common shareholders
      unit: "%"
      frequency: year
      data: xbrl
      xbrl: [us-gaap:PaymentsForRepurchaseOfCommonStock, us-gaap:PaymentsOfDividendsCommonStock, us-gaap:NetIncomeLossAvailableToCommonStockholdersBasic]
      formula: sum_3y(buybacks + common_dividends) / sum_3y(net_income_to_common)
    fail_if: Below 70% for 2 consecutive years
    rule: {op: "<", threshold: 70, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: 2027-02
    baseline:
      value: 76
      unit: "%"
      period: Last three years (company-disclosed basis)
      as_of: 2026-06-30
      source: AXP-RPT1-2026-09-17#p6
    note: "Replaces Q-fcf (fcf_conversion) in the stalwart template: this is a bank holding company bound by capital requirements, so how much it can return is set by regulatory capital, and once the credit cycle turns and provisions swing from net releases to net builds, buybacks stop first [src:AXP-RPT1-2026-09-17#p6]. \"Operating cash flow less capital expenditure\" moves with card balances and other liabilities and does not represent money that can be paid out to shareholders, so the test uses what the report calls \"the share of common net income returned over the last three years\" instead. It mainly tests capital allocation: it measures the payout share, not whether distributable earnings are growing, which AXP-Q15 tracks. The threshold borrows the default of the template's Q-fcf, but this is a different quantity; it amounts to a buffer of six percentage points below the 76% three-year payout the report records [src:AXP-RPT1-2026-09-17#p6], a judgment criterion this archive wrote down in advance. A failure caused by buybacks paused in a credit downturn is expected and has to be read together with AXP-Q7 and AXP-Q12."

  - id: AXP-L1
    type: qualitative
    claim: Management has not cut its published financial targets
    origin: template:stalwart
    severity: watch
    covers: [management]
    pillar: P6
    question: In this period's filings, did management cut or withdraw previously published financial targets (full-year revenue and EPS guidance, and any medium-term targets; current targets are recorded item by item in ledger.yml)?
    fail_if: Yes, without giving new, testable targets at the same time
    judge: independent_model
    evidence: required
    where: Earnings 8-K Exhibit 99.1 press release, call materials, the MD&A of the 10-Q and 10-K
    lookback: 4
    judge_notes:
      - When judging a "cut", use the most recently published figures in the say-do ledger (AXP-M-2026-01, AXP-M-2026-02).
      - "Full-year EPS guidance is a range: it counts as a \"cut\" only if a full-year EPS range the company gives later (8-K, 10-Q or earnings call) has a midpoint below the midpoint of the most recently published range; narrowing the range around the same midpoint, or raising it, is not a cut."
    effective_from: FY2026Q3
    first_readable: 2026-10
    baseline:
      value: In July 2026, full-year revenue guidance raised to +10% and EPS guidance kept unchanged, with the stated reason of reinvesting the excess revenue
      as_of: 2026-09-17
      source: AXP-RPT1-2026-09-17#p9
      note: "Section one of the report describes it as putting the excess revenue back into technology and benefits [src:AXP-RPT1-2026-09-17#p3]; EPS guidance was kept unchanged, and the report uses the midpoint $17.60 of the guidance range $17.30–$17.90 [src:AXP-8K-2026-07-24#EX-99.1] [src:AXP-RPT1-2026-09-17#p12]."
    note: "Corresponds to L-guidance in the stalwart template. The report records no current medium-term financial targets for Amex, only the full-year 2026 guidance: revenue growth raised to +10% and EPS guidance unchanged [src:AXP-RPT1-2026-09-17#p9], with the report using the midpoint $17.60 of the guidance range $17.30–$17.90 [src:AXP-RPT1-2026-09-17#p12] [src:AXP-8K-2026-07-24#EX-99.1]. So the question also covers the full-year guidance, and both items are recorded in the say-do ledger (AXP-M-2026-01, AXP-M-2026-02). The rule of judging a \"cut\" in the EPS range by its midpoint (see judge_notes) and the 10-Q MD&A added to where were both written out during the migration to spec 0.2, before the first judgment under this test (FY2026Q3)."

  - id: AXP-L7
    type: qualitative
    claim: No expensive buybacks or acquisitions added at the cycle peak
    origin: template:cyclical
    severity: watch
    covers: [capital_allocation]
    pillar: P6
    question: In this period, while profits hit a record, were buybacks or capital expenditure (including acquisitions) raised sharply? "Sharply" means buybacks up by half or more on the same period a year earlier, or an announced acquisition that is not small or not close to the core payments and membership business.
    fail_if: Yes, and management did not state its assumption about the cycle
    judge: independent_model
    evidence: required
    where: Earnings 8-K Exhibits 99.1 and 99.2, the capital and shareholders' equity section of the 10-Q/10-K, acquisition announcements
    lookback: 4
    effective_from: FY2026Q3
    first_readable: 2026-10
    baseline:
      value: Buybacks run at about 3% of shares a year, at prices near intrinsic value; acquisitions are all small and close to the core business; there has been no large buyback that would prove an ability to time the market
      as_of: 2026-09-17
      source: AXP-RPT1-2026-09-17#p3
    note: "Applies L-cycle-capalloc from the secondary cyclical template; the definition of \"sharply\" is an operationalization this archive wrote down in advance. The report rates capital allocation B [src:AXP-RPT1-2026-09-17#p3]; current profits include net reserve releases: Q2 growth on the reported basis, +15%, includes reserve releases, and excluding the change in provisions it is only +4.0% [src:AXP-RPT1-2026-09-17#p15]; part of a \"record\" profit is the cycle's gift, and stepping up buybacks at the cycle peak is exactly the mistake this test guards against."

  # ---------- Section ten of the report: thesis breakers (if any one holds, this judgment has to be rewritten) ----------
  - id: AXP-Q5
    type: quantitative
    claim: Growth in co-brand remuneration will not persistently outrun Amex's own revenue
    origin: report:breaker
    severity: breaker
    covers: [customer_concentration, moat, unit_economics]
    pillar: P3
    metric_def:
      id: delta_remuneration_growth_minus_revenue_growth
      description: Year-on-year growth in the co-brand remuneration from American Express that Delta publicly discloses, minus year-on-year growth in Amex's total revenues net of interest expense
      unit: pp
      frequency: year
      data: filing_text
      where: The remuneration disclosure related to the American Express agreements in Delta's 10-K (each year from DAL-10K-FY2025); Amex's 10-K consolidated income statement
      formula: yoy(delta_amex_remuneration) - yoy(axp_revenue_net_of_interest_expense)
    fail_if: Disclosed remuneration growth above Amex's revenue growth for two consecutive years; the consecutive count starts from FY2026, with FY2025 only as the baseline; both year-on-year figures are computed from the disclosed amounts (not rounded percentages), the difference is kept to one decimal place, and a difference not above zero counts as a pass
    rule: {op: ">", threshold: 0, unit: pp, consecutive: 2, period: year, evaluate_from: FY2026}
    warn_if: Remuneration growth above Amex's revenue growth in a single year
    warn_rule: {op: ">", threshold: 0, unit: pp, consecutive: 1, period: year}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2027-02
    baseline:
      value: 1
      unit: pp
      period: FY2025
      as_of: 2025-12-31
      source: AXP-RPT1-2026-09-17#p8
      note: "Delta received $8.2 billion of co-brand remuneration from Amex in 2025, +11% year on year, while Amex's revenue grew 10% [src:AXP-RPT1-2026-09-17#p8]; the difference subtracts the two rounded readings, serves only as the baseline and does not count toward the two consecutive years. Forward readings: Delta's remuneration guidance for 2026 is $9 billion, about +9.8% on $8.2 billion (this archive's calculation) [src:AXP-RPT1-2026-09-17#p8], and Amex's 2026 revenue guidance was raised to +10% [src:AXP-RPT1-2026-09-17#p9]; the difference between the two guidance figures is about −0.2 percentage points, within rounding error [src:AXP-RPT1-2026-09-17#p8] [src:AXP-RPT1-2026-09-17#p9]."
    note: "The remuneration-growth leg of breaker #1 in section ten of the report; the other two event conditions (whether a renewal is announced before the end of 2028, and whether exclusivity is kept after renewal) are in the qualitative test AXP-L6; the two tests are joined by \"or\", and a failure of either means breaker #1 holds. The earliest readable point the report gives for this breaker is \"from the second half of 2027, decisive point end of 2028\" [src:AXP-RPT1-2026-09-17#p14], and it does not say that FY2025 counts toward \"two consecutive years\"; if FY2025 counted, a single FY2026 reading would trigger it in early 2027, earlier than the report's timing, so the consecutive count starts from FY2026, a choice written down before either company publishes its FY2026 figures. On both companies' 2026 guidance, the FY2026 difference falls near zero (see the baseline), so a single-year reading only records a warning; first_readable is 2027-02, when both companies publish their FY2026 annual reports, and the earliest possible failure is in early 2028, when both publish their FY2027 annual reports, still earlier than the report's decisive point. The current agreement was renewed in 2019 and expires at the end of 2029 [src:AXP-RPT1-2026-09-17#p8]."

  - id: AXP-L6
    type: qualitative
    claim: Delta will renew before the agreement expires at the end of 2029, and Amex stays the exclusive issuer
