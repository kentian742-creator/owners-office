tests:
  # ---------- 林奇 stalwart 模板（替换两条对发卡行无意义的指标）与次类 cyclical 模板 ----------
  - id: AXP-Q1
    type: quantitative
    claim: 增长没有滑出稳定增长型的区间
    origin: template:stalwart
    severity: watch
    covers: [growth]
    pillar: P1
    metric_def:
      id: revenue_net_of_interest_expense_yoy
      description: 扣除利息支出后的总收入同比增速（运通的收入口径）
      unit: "%"
      frequency: quarter
      data: xbrl
      xbrl: [us-gaap:RevenuesNetOfInterestExpense, us-gaap:Revenues]
      formula: revenue_t / revenue_{t-4q} - 1
    fail_if: 连续 4 个季度低于 5%
    rule: {op: "<", threshold: 5, unit: "%", consecutive: 4, period: quarter}
    warn_if: 连续 2 个季度低于 8%
    warn_rule: {op: "<", threshold: 8, unit: "%", consecutive: 2, period: quarter}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: 2026-10
    baseline: {value: 10, unit: "%", period: FY2025, as_of: 2025-12-31, source: AXP-RPT1-2026-09-17#p8}
    note: 对应模板 stalwart 的 Q-growth，门槛沿用模板默认值。运通的收入口径是扣除利息支出后的总收入，登记表 revenue_yoy 的候选概念可能先取到只含客户合同收入、不含净利息收入的口径，所以用 metric_def 就地定义。指标含义仍是收入增速，只换了收入口径，所以 origin 记 template:stalwart；AXP-Q2、AXP-Q4 换成了另一种指标，记 manual。

  - id: AXP-Q2
    type: quantitative
    claim: 资本回报守在优秀企业的水平
    origin: manual
    severity: watch
    covers: [returns_on_capital, moat]
    pillar: P1
    metric: roe
    fail_if: 连续 2 年低于 12%
    rule: {op: "<", threshold: 12, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: 2027-02
    note: "替代模板 stalwart 的 Q-returns（roic）：对发卡机构而言新增债务对应新增卡余额，是资产扩张的配套 [src:AXP-RPT1-2026-09-17#p10]，把有息负债算进“投入资本”没有意义，所以改用净资产收益率。门槛借自模板给投入资本回报的默认值，含义并不相同；报告没有给 ROE 读数，基线待从 FY2025 年报回填。回填后、FY2026 年报发布之前复核这个门槛是否适合净资产收益率，复核结论与日期写进本条 note，保持事先登记（见 todo）。"

  - id: AXP-Q3
    type: quantitative
    claim: 回购在真正缩减股本，而不是抵消股权激励
    origin: template:stalwart
    severity: watch
    covers: [capital_allocation]
    pillar: P6
    metric: diluted_shares_yoy
    fail_if: 连续 2 年大于 0
    rule: {op: ">", threshold: 0, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: 2027-02
    baseline:
      value: -3
      unit: "%"
      period: 2026Q2
      as_of: 2026-06-30
      source: AXP-RPT1-2026-09-17#p6
      note: "二季度平均摊薄股数同比；股数从 FY2023 约 7.36 亿股降到 FY2025 约 6.96 亿股，净减 5.4% [src:AXP-RPT1-2026-09-17#p10]。"

  - id: AXP-Q4
    type: quantitative
    claim: 利润能变成真正分给股东的钱
    origin: manual
    severity: watch
    covers: [capital_allocation, free_cash_flow]
    pillar: P6
    metric_def:
      id: capital_return_to_common_ni_3y
      description: 近三年滚动（普通股回购 + 普通股分红）÷ 归属普通股股东净利润
      unit: "%"
      frequency: year
      data: xbrl
      xbrl: [us-gaap:PaymentsForRepurchaseOfCommonStock, us-gaap:PaymentsOfDividendsCommonStock, us-gaap:NetIncomeLossAvailableToCommonStockholdersBasic]
      formula: sum_3y(buybacks + common_dividends) / sum_3y(net_income_to_common)
    fail_if: 连续 2 年低于 70%
    rule: {op: "<", threshold: 70, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: 2027-02
    baseline:
      value: 76
      unit: "%"
      period: 近三年（公司披露口径）
      as_of: 2026-06-30
      source: AXP-RPT1-2026-09-17#p6
    note: "替代模板 stalwart 的 Q-fcf（fcf_conversion）：这是受资本充足率约束的银行控股公司，能返还多少由监管资本决定，信贷周期一转向、拨备由净释放转为净计提，回购会先停 [src:AXP-RPT1-2026-09-17#p6]。“经营现金流减资本开支”随卡余额与其他负债波动，不代表能分给股东的钱，所以改用报告所说的“近三年返还的普通股净利润比例”。这条主要检验资本配置：它测返还比例，不测可分配盈利是否在增长，后者由 AXP-Q15 跟踪。门槛借用模板 Q-fcf 的默认值，但这里是另一个量，相当于报告所记近三年返还比例 76% 下方六个百分点的缓冲 [src:AXP-RPT1-2026-09-17#p6]，是本档案事先写下的判定标准。信贷下行期回购暂停造成的失败在预期之内，要与 AXP-Q7、AXP-Q12 一起读。"

  - id: AXP-L1
    type: qualitative
    claim: 管理层没有下调已公布的财务目标
    origin: template:stalwart
    severity: watch
    covers: [management]
    pillar: P6
    question: 本期文件中，管理层是否下调或撤回了此前公布的财务目标（全年收入与每股盈利指引，以及任何中期目标；现行目标逐条登记在 ledger.yml）？
    fail_if: 是，且没有同时给出可检验的新目标
    judge: independent_model
    evidence: required
    where: 业绩 8-K 附件 99.1 新闻稿、电话会材料、10-Q 与 10-K 的 MD&A
    lookback: 4
    judge_notes:
      - 判定“下调”时，以言行账本（AXP-M-2026-01、AXP-M-2026-02）中最近一次公布的数值为准。
      - 全年每股盈利指引是区间：公司此后的表态（8-K、10-Q 或业绩电话会）给出的全年每股盈利区间，中点低于最近一次公布区间的中点，才算“下调”；围绕同一中点收窄区间或上调，都不算下调。
    effective_from: FY2026Q3
    first_readable: 2026-10
    baseline:
      value: 2026 年 7 月上调全年收入指引至 +10%、维持每股盈利指引不变，理由是把超额收入再投资
      as_of: 2026-09-17
      source: AXP-RPT1-2026-09-17#p9
      note: "报告第一节写作把超额收入投回技术与权益 [src:AXP-RPT1-2026-09-17#p3]；每股盈利指引维持不变，报告所用的是指引区间 $17.30–$17.90 的中点 $17.60 [src:AXP-8K-2026-07-24#EX-99.1] [src:AXP-RPT1-2026-09-17#p12]。"
    note: "对应模板 stalwart 的 L-guidance。报告没有记载运通现行的中期财务目标，只记载了 2026 年的全年指引：收入增长上调到 +10%、每股盈利指引维持不变 [src:AXP-RPT1-2026-09-17#p9]，报告所用的是指引区间 $17.30–$17.90 的中点 $17.60 [src:AXP-RPT1-2026-09-17#p12] [src:AXP-8K-2026-07-24#EX-99.1]。所以问题把全年指引一并纳入，两项已登记在言行账本（AXP-M-2026-01、AXP-M-2026-02）。每股盈利区间按中点判定“下调”的规则（见 judge_notes）与 where 里补上的 10-Q MD&A，都是迁移到规范 0.2 时写明的，在本条第一次判定（FY2026Q3）之前。"

  - id: AXP-L7
    type: qualitative
    claim: 周期高点没有追加昂贵的回购或收购
    origin: template:cyclical
    severity: watch
    covers: [capital_allocation]
    pillar: P6
    question: 本期是否在利润创新高的同时大幅提高回购或资本开支（含收购）？“大幅”指回购金额比上年同期增加一半以上，或宣布一笔并非小型、或不贴近支付与会员主业的收购。
    fail_if: 是，且管理层没有说明周期假设
    judge: independent_model
    evidence: required
    where: 业绩 8-K 附件 99.1 与 99.2、10-Q/10-K 的资本与股东权益一节、收购公告
    lookback: 4
    effective_from: FY2026Q3
    first_readable: 2026-10
    baseline:
      value: 回购以每年约 3% 的股数进行、价格在内在价值附近；并购全部小型且贴近主业；没有一次可以证明择时能力的大额回购
      as_of: 2026-09-17
      source: AXP-RPT1-2026-09-17#p3
    note: "套用次类 cyclical 模板的 L-cycle-capalloc；“大幅”的界定是本档案事先写下的操作化。报告给资本配置评 B [src:AXP-RPT1-2026-09-17#p3]；当期利润里含准备金净释放，二季度报表口径的增速 +15% 含准备金释放，剔除拨备变动后只有 +4.0% [src:AXP-RPT1-2026-09-17#p15]，利润“创新高”里有周期给的一份，周期高点加码回购正是这里要防的错误。"

  # ---------- 报告第十节：论点破坏信号（任何一条成立，需要重新写这份判断） ----------
  - id: AXP-Q5
    type: quantitative
    claim: 联名酬金的增长不会持续跑赢运通自己的收入
    origin: report:breaker
    severity: breaker
    covers: [customer_concentration, moat, unit_economics]
    pillar: P3
    metric_def:
      id: delta_remuneration_growth_minus_revenue_growth
      description: 达美公开披露的来自美国运通的联名酬金同比增速，减去运通扣除利息支出后总收入的同比增速
      unit: pp
      frequency: year
      data: filing_text
      where: 达美 10-K 中与美国运通协议相关的酬金披露（DAL-10K-FY2025 起逐年）；运通 10-K 合并损益表
      formula: yoy(delta_amex_remuneration) - yoy(axp_revenue_net_of_interest_expense)
    fail_if: 公开的酬金增速连续两年高于运通收入增速；连续计数从 FY2026 起算，FY2025 只作基线；两项同比都用披露的金额计算（不用取整后的百分比），差值保留一位小数，不大于零记为通过
    rule: {op: ">", threshold: 0, unit: pp, consecutive: 2, period: year, evaluate_from: FY2026}
    warn_if: 单一年度的酬金增速高于运通收入增速
    warn_rule: {op: ">", threshold: 0, unit: pp, consecutive: 1, period: year}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2027-02
    baseline:
      value: 1
      unit: pp
      period: FY2025
      as_of: 2025-12-31
      source: AXP-RPT1-2026-09-17#p8
      note: "达美 2025 年从运通收到的联名酬金 82 亿美元、同比 +11%，同期运通收入增速 10% [src:AXP-RPT1-2026-09-17#p8]；差值由两项取整后的读数相减，只作基线，不计入连续两年。前瞻读数：达美给 2026 年的酬金指引是 90 亿美元，对 82 亿约 +9.8%（本档案计算）[src:AXP-RPT1-2026-09-17#p8]，运通 2026 年收入指引上调到 +10% [src:AXP-RPT1-2026-09-17#p9]，两项指引之差约 −0.2 个百分点，落在取整误差之内 [src:AXP-RPT1-2026-09-17#p8] [src:AXP-RPT1-2026-09-17#p9]。"
    note: "报告第十节破坏信号 #1 的酬金增速一支；另外两个事件条件（2028 年底前是否公布续约、续约后是否保住独家）在定性测试 AXP-L6，两条为“或”关系，任何一条失败即破坏信号 #1 成立。报告给这条破坏信号的最早可读时点是“2027 下半年起，决定性时点 2028 年底” [src:AXP-RPT1-2026-09-17#p14]，没有说 FY2025 计入“连续两年”；若把 FY2025 计入，单凭 FY2026 一年的读数就会在 2027 年初触发，早于报告的时点，所以连续计数从 FY2026 起算，这一选择在两家 FY2026 数字公布之前写下。按两家的 2026 年指引，FY2026 的差值落在零附近（见基线），单年读数只记警告；first_readable 取两家 FY2026 年报发布的 2027-02，最早能失败的是 2028 年初两家发布 FY2027 年报时，仍早于报告的决定性时点。现行协议 2019 年续签、2029 年底到期 [src:AXP-RPT1-2026-09-17#p8]。"

  - id: AXP-L6
    type: qualitative
    claim: 达美会在 2029 年底协议到期前续约，且运通保持独家发卡方
    origin: report:breaker
    severity: breaker
    covers: [customer_concentration, moat]
    pillar: P3
    question: 截至本期，是否出现以下任一情况：（a）日期已晚于 2028-12-31，而运通与达美仍未公布联名协议续约；（b）已公布的续约显示运通不再是达美联名卡的独家发卡方？
    fail_if: 是（(a) 或 (b) 任一成立）
    judge: independent_model
    evidence: required
    where: 运通与达美的新闻稿与 8-K；两家 10-K 中关于联名协议的披露；两家业绩电话会材料
    lookback: 4
    effective_from: FY2026Q3
    first_readable: 2027-07
    baseline:
      value: 现行协议 2019 年续签、2029 年底到期
      as_of: 2026-09-17
      source: AXP-RPT1-2026-09-17#p8
    note: "报告第十节破坏信号 #1 的两个事件条件；酬金增速一支在 AXP-Q5，两条为“或”关系，任何一条失败即破坏信号 #1 成立。报告给的最早可读时点是“2027 下半年起，决定性时点 2028 年底” [src:AXP-RPT1-2026-09-17#p14]，所以 first_readable 取 2027-07；(a) 要到 2029 年 1 月才可能成立，(b) 在续约公告发布时即可判定。这两个条件是文字事件，按定性测试由独立模型对照原文判定并附出处。"

  - id: AXP-Q6
    type: quantitative
    claim: 年费提价之后，权益成本最终会被费收追上，会员制的单位经济没有结构性恶化
    origin: report:breaker
    severity: breaker
    covers: [pricing_power, unit_economics, moat]
    pillar: P1
    metric: net_card_fees_yoy
    metric_def:
      description: 净卡费（Net card fees）同比增速，与同一季度的会员服务成本同比增速一起判定
      unit: "%"
      frequency: quarter
      data: filing_text
      where: 业绩 8-K 附件 99.2 统计表或 10-Q 合并损益表的 Net card fees 与 Card Member services 两行
      components:
        card_member_services_expense_yoy:
          description: 会员服务成本（Card Member services 费用，涵盖全部产品的权益支出）同比增速，即 cm_services_t / cm_services_{t-4q} - 1
          unit: "%"
          where: 业绩 8-K 附件 99.2 统计表或 10-Q 合并损益表的 Card Member services 一行
    fail_if: 提价周期走完后的第一个完整季度（2027 年二季度）里，净卡费增速掉到个位数，同时会员服务成本增速仍在 30% 以上
    rule:
      all_of:
        - {metric: net_card_fees_yoy, op: "<", threshold: 10, unit: "%", consecutive: 1, period: quarter}
        - {metric: net_card_fees_yoy.card_member_services_expense_yoy, op: ">=", threshold: 30, unit: "%", consecutive: 1, period: quarter}
      evaluate_on: [FY2027Q2]
      note: 两项须在同一季度同时成立；只在 evaluate_on 那一季（提价周期走完后的第一个完整季度）判定一次，其他季度不适用本规则，由 AXP-Q9 跟踪；判定之后本条退役，或按新的判定季重新登记。
    warn_if: 判定季里净卡费增速低于 10%，或会员服务成本增速不低于 15%（即反方论点没有被削弱）
    warn_rule:
      any_of:
        - {metric: net_card_fees_yoy, op: "<", threshold: 10, unit: "%", consecutive: 1, period: quarter}
        - {metric: net_card_fees_yoy.card_member_services_expense_yoy, op: ">=", threshold: 15, unit: "%", consecutive: 1, period: quarter}
      evaluate_on: [FY2027Q2]
      note: 同样只在 evaluate_on 那一季判定。
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2027-07
    baseline:
      value: 15.4
      unit: "%"
      period: 2026Q2
      as_of: 2026-06-30
      source: AXP-RPT1-2026-09-17#p4
      note: "净卡费同比；同季会员服务成本同比 +50%、上半年 +49% [src:AXP-RPT1-2026-09-17#p10]。"
    note: "报告第十节破坏信号 #2。提价周期走完后的第一个完整季度，报告正文定为 2027 年二季度 [src:AXP-RPT1-2026-09-17#p6]，监测表写作“2027 年 4–7 月”可读 [src:AXP-RPT1-2026-09-17#p14]；二季度业绩 8-K 在 7 月下旬发布（2026 年二季度为 2026-07-24 [src:AXP-RPT1-2026-09-17#p17]），所以 first_readable 取 2027-07，此前各季由 AXP-Q9 跟踪。warn_rule 取自报告第七节：届时净卡费增速仍在 10% 以上而会员服务成本增速回落到 15% 以下，反方论点才削弱 [src:AXP-RPT1-2026-09-17#p10]，介于两者之间记警告。"

  - id: AXP-Q7
    type: quantitative
    claim: 客群信用优势能扛过信贷周期，准备金释放期不会转成与行业恶化同步的持续计提
    origin: report:breaker
    severity: breaker
    covers: [balance_sheet]
    pillar: P5
    metric: reserve_build_release
    metric_def:
      description: 信用损失准备金的净计提（为正）或净释放（为负），即信用损失拨备减去净核销；与同一观察季度的行业卡类净核销率一起判定
      unit: USD
      frequency: quarter
      data: mixed
      where: 运通一侧为业绩 8-K 附件 99.2 统计表中的拨备构成（净核销与准备金计提/释放）；行业一侧为 FRED 序列 CORCCACBN（来源标签 FRED-CORCCACBN）
      components:
        industry_card_nco_rate:
          description: 行业卡类净核销率（商业银行信用卡贷款，非季调，季度）
          unit: "%"
          where: FRED 序列 CORCCACBN（来源标签 FRED-CORCCACBN），约在季末两个月后更新
    fail_if: 行业卡类净核销率回到 2024 年 4.73% 的峰值以上，同时运通连续两个季度净计提准备金
    rule:
      all_of:
        - {metric: reserve_build_release.industry_card_nco_rate, op: ">=", threshold: 4.73, unit: "%", consecutive: 1, period: quarter}
        - {metric: reserve_build_release, op: ">", threshold: 0, unit: USD, consecutive: 2, period: quarter}
      note: 两项须在同一观察季度同时成立；行业一支取同一季度的 FRED 读数，等该季读数发布后再判定，不用上一季的读数代替。
    data: mixed
    effective_from: FY2026Q3
    first_readable: 2027-03
    baseline:
      value: -191000000
      unit: USD
      period: 2026Q2
      as_of: 2026-06-30
      source: AXP-RPT1-2026-09-17#p11
      note: "负值表示净释放：二季度拨备含 1.91 亿美元净释放 [src:AXP-RPT1-2026-09-17#p11]。同季行业卡类净核销率 3.92%（非季调），2024 年二季度峰值 4.73% [src:AXP-RPT1-2026-09-17#p11]。"
    note: "报告第十节破坏信号 #3，报告写作“2027 年 1 月的四季度财报起”可读 [src:AXP-RPT1-2026-09-17#p14]。运通一支在 2027 年 1 月可读，但同季的行业读数约在季末两个月后才更新（报告所用的 2026 年二季度读数来自 2026-08-25 更新的序列 [src:AXP-RPT1-2026-09-17#p17]），所以两支同季判定最早在 2027 年 3 月，first_readable 取 2027-03。门槛按报告原文保留；但卡余额在增长（2026 年上半年同比 +8% [src:AXP-RPT1-2026-09-17#p5]），准备金率不变时准备金也要随贷款增加，运通一支在贷款增长期几乎自动成立，这条破坏信号实际主要由行业核销率一支决定（见 AXP-Q12 与 todo）。"

  - id: AXP-L2
    type: qualitative
    claim: 由人挑选支付工具的前提仍然成立，代理商务没有把选卡变成按总成本排序的默认值
    origin: report:breaker
    severity: breaker
    covers: [moat, competition, pricing_power]
    pillar: P4
    question: 截至本期，是否有任何一家主要 AI 平台公布了默认的代理支付规则，按总成本为用户选择支付卡，且不允许用户锁定指定卡？“主要 AI 平台”指面向消费者、以 AI 代理代为完成购买的通用平台的运营方，至少包括行业模块路标 PAY-SP6 所列代理人支付协议的平台运营方（如 Google、OpenAI）；只适用于单一商户或单一发卡行的试点不算。
    fail_if: 是（按总成本选卡与不允许锁定指定卡两个条件同时成立）
    judge: independent_model
    evidence: required
    where: 主要 AI 平台公布的代理支付规则与开发者文档（在 EDGAR 之外，判定时登记为 web 或 press_release 来源）；运通 10-K/10-Q 的风险因素与 MD&A；运通关于代理商务的公告
    lookback: 4
    effective_from: FY2026Q3
    baseline:
      value: 万事达 Agent Pay 于 2025 年 4 月发布，Visa Trusted Agent Protocol 于 2025 年 10 月发布，运通 2026-04-14 发布 ACE 开发者工具包并推出注册代理购买赔付保障；报告写作时尚无主要平台公布默认支付规则
      as_of: 2026-09-17
      source: AXP-RPT1-2026-09-17#p8
    note: "报告第十节破坏信号 #4，时间不定（2027–2029）。这条路径没有当期读数：第一个硬读数要么是运通披露注册代理交易的占比，要么是某个平台公布默认支付规则 [src:AXP-RPT1-2026-09-17#p8]。平台规则不在 EDGAR 申报文件里，EDGAR 触发的流水线看不到，所以每季更新时由公司经理检索一次平台公告；行业模块 payments-card-networks 的路标 PAY-SP6（代理人发起的购买与卡组织令牌）越线时，本条随之复核。“主要 AI 平台”的认定标准是本档案事先写下的操作化，报告没有列名。"

  - id: AXP-Q8
    type: quantitative
    claim: 商户费率的下滑仍是缓慢的、可由联名占比上升解释的结构变化，而不是商户议价力的断崖
    origin: report:breaker
    severity: breaker
    covers: [pricing_power, moat]
    pillar: P2
    metric: discount_revenue_to_billed_business
    metric_def:
      description: 商户费率代理值 = 折扣收入 ÷ 账单业务（报告口径，与公司披露的平均折扣率不同），按年度读数判定；与同期联名卡占账单业务的比例一起判定
      unit: "%"
      frequency: year
      data: filing_text
      where: 10-K 合并损益表的 Discount revenue 与 MD&A 的账单业务（billed business）；10-K MD&A 中联名伙伴的披露
      components:
        cobrand_share_of_billed_business:
          description: 联名卡占账单业务的比例（采信 2022 年起的年报口径）
          unit: "%"
          where: 10-K MD&A 中联名伙伴的披露
        merchant_rate_unexplained_decline_bp:
          description: 代理值下滑中联名占比上升解释不了的部分：代理值下降的基点数，减去同期联名占比上升的百分点数乘以每个百分点最多解释的基点数；系数 1.16 取自报告算式四的上限 [src:AXP-RPT1-2026-09-17#p7]；为正即联名占比没有相应上升。公式：-(discount_revenue_to_billed_business_t1 - discount_revenue_to_billed_business_t0) * 100 - 1.16 * (cobrand_share_of_billed_business_t1 - cobrand_share_of_billed_business_t0)
          unit: bp
          where: 由 discount_revenue_to_billed_business 与 cobrand_share_of_billed_business 两项计算
    fail_if: 商户费率代理值连续两个年度下降超过 5 个基点，或跌破 2.15%——且同期联名占账单业务的比例没有相应上升（否则下滑属于结构，见第四节的分解）
    rule:
      all_of:
        - any_of:
            - {metric: discount_revenue_to_billed_business, op: decrease, threshold: 0.05, unit: pp, consecutive: 2, period: year, note: 与上一年度相比的下降幅度超过这个值，即 fail_if 中的五个基点。}
            - {metric: discount_revenue_to_billed_business, op: "<", threshold: 2.15, unit: "%", consecutive: 1, period: year}
        - metric: discount_revenue_to_billed_business.merchant_rate_unexplained_decline_bp
          op: ">"
          threshold: 0
          unit: bp
          period: year
          note: 与第一支同一判定期：第一支为连续两个年度下降时，按这两个年度的累计变化计算；第一支为跌破门槛时，按 FY2025 基线到跌破当年的累计变化计算。
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2027-02
    baseline:
      value: 2.226
      unit: "%"
      period: 1H26
      as_of: 2026-06-30
      source: AXP-RPT1-2026-09-17#p7
      note: "FY2024 为 2.269%、FY2025 为 2.240% [src:AXP-RPT1-2026-09-17#p7]；联名占账单业务 2022 年 18%、2023 年 21%、2025 年 26% [src:AXP-RPT1-2026-09-17#p7]。"
    note: "报告第十节破坏信号 #5，按每年的年度报告判定。费率代理值是报告自己算的口径，公司披露的平均折扣率是另一个口径 [src:AXP-RPT1-2026-09-17#p17]。“相应”按第四节算式四判断：在下滑全部归因于结构的极端假设下，2.9 基点 ÷ 2.5 个百分点 = 1.16 个百分点是联名与自有净费率差的上限，即联名占比每上升 1 个百分点，结构最多解释约 1.16 个基点的代理值下滑 [src:AXP-RPT1-2026-09-17#p7]；超出这一上限的部分为正，才视为联名占比没有相应上升。报告说明结构的真实贡献只落在零到这个上限之间 [src:AXP-RPT1-2026-09-17#p7]，取上限等于把尽可能多的下滑归给结构，是最宽松的判法；本档案有意这样取，因为只有超出上限的下滑才能确定不是结构。"

  - id: AXP-L3
    type: qualitative
    claim: 监管没有拆掉三方网络的法律豁免与联邦先占保护
    origin: report:breaker
    severity: breaker
    covers: [regulation, pricing_power]
    pillar: P2
    question: 截至本期，是否出现以下任一情况：（a）《信用卡竞争法案》已签署成为法律，且最终文本删除了对三方支付网络的豁免；（b）第七巡回上诉法院推翻了联邦法对伊利诺伊州《互换费禁止法》的先占认定，且含伊利诺伊州在内已有五个以上（含本数）州的同类互换费立法成为法律？
    fail_if: 是（(a) 或 (b) 任一成立；(b) 中的两个条件须同时成立）
    judge: independent_model
    evidence: required
    where: 国会立法记录与法案最终文本；第七巡回上诉法院判决；各州立法记录；运通 10-K/10-Q 的法律与监管一节
    lookback: 4
    judge_notes: （a）是否删除三方网络豁免，以最终法律文本为准。
    effective_from: FY2026Q3
    first_readable: 2027-01
    baseline:
      value: 北伊利诺伊联邦地区法院 2026-06-01 对国民银行、联邦储蓄机构、外州州立银行与支付卡网络永久禁止执行伊利诺伊州的互换费限制，州法生效日推迟到 2027-07-01，案件在第七巡回上诉；运通的发卡主体是国民银行、本身又是支付卡网络，两个身份都在豁免范围内
      as_of: 2026-09-17
      source: AXP-RPT1-2026-09-17#p8
      note: "裁决日期与货币监理署 2026 年 4 月的先占认定见 [src:AXP-RPT1-2026-09-17#p7]；报告附录把这一裁决与货币监理署的先占规则列为一手来源 [src:AXP-RPT1-2026-09-17#p17]。"
    note: "报告第十节破坏信号 #6，2027 年起可读 [src:AXP-RPT1-2026-09-17#p14]。“通过”按签署成为法律判定，因为法案只有成为法律才改变运通的处境；“五个以上州”含伊利诺伊州、含本数，这是两种读法里较严的一种，会更早触发复核。这两处都是本档案事先写下的操作化。报告对法案适用范围条款的解读没有逐条核对全文 [src:AXP-RPT1-2026-09-17#p13]。法院判决与州立法记录不在 EDGAR 申报文件里，判定时登记为外部来源；行业模块 payments-card-networks 的路标 PAY-SP1（信用卡路由强制与 CCCA）越线时，本条随之复核。"

  - id: AXP-L4
    type: qualitative
    claim: "净利息收入线没有被联邦利率上限重新定价，这条线约占收入 24% [src:AXP-RPT1-2026-09-17#p3]"
    origin: report:breaker
    severity: breaker
    covers: [regulation]
    pillar: P2
    question: 截至本期，是否已有任何形式的联邦信用卡利率上限落地：签署成为法律、以最终规则发布、以行政命令或其他对发卡行有约束力的联邦措施实施，或运通在联邦政府要求下公开承诺并实际执行的利率上限？
    fail_if: 是
    judge: independent_model
    evidence: required
    where: 联邦法律、行政命令与监管机构的最终规则；运通 10-K/10-Q 的监管一节与风险因素；运通的新闻稿与 8-K
    lookback: 4
    judge_notes: 只停在提案、听证或法案审议阶段的不算落地。
    effective_from: FY2026Q3
    note: "报告第十节破坏信号 #7，时间不定。它打的是占收入约 24% 的利息线（第一节的口径是净利息收入），而非商户费率 [src:AXP-RPT1-2026-09-17#p14] [src:AXP-RPT1-2026-09-17#p3]。报告写作“任何形式”，所以问题不限于法律与最终规则。"

  - id: AXP-L5
    type: qualitative
    claim: 管理层的质量得以延续，接班不以外部空降或明显的战略转向发生
    origin: report:breaker
    severity: breaker
    covers: [management, governance, culture]
    pillar: P6
    question: 本期文件是否披露了 CEO 接班，且（a）新任 CEO 来自外部，即接任前不在运通任职、或在运通任职不满三年；或（b）接班伴随明显的战略转向，即出售或退出任一经营分部、宣布收购支付与发卡及会员服务以外的业务、撤回已公布的财务目标，或放弃发卡行、网络与收单一体的模式？
    fail_if: 是
    judge: independent_model
    evidence: required
    where: 委托书（DEF 14A）、8-K 第 5.02 项、公司新闻稿与投资者日材料
    lookback: 4
    effective_from: FY2026Q3
    first_readable: 2027-01
    baseline:
      value: CEO 斯蒂芬·斯奎里 2018-02-01 上任，1985 年入职、整个职业生涯在运通；CFO 1997 年入职；内部人管理的组织
      as_of: 2026-09-17
      source: AXP-RPT1-2026-09-17#p9
    note: "报告第十节破坏信号 #8，最早可读时点为 2027–2030 年的委托书 [src:AXP-RPT1-2026-09-17#p14]。报告第六节说明，“优秀管理层”的判定挂在具体的人和年份上，同一家公司在 1981–1993 年做错过决定 [src:AXP-RPT1-2026-09-17#p10]：那十二年把一家旅行支票和签账卡公司买成了金融超市，所以“支付与会员服务以外的收购”列为战略转向的标志之一。“外部”与“明显的战略转向”的判定标准是本档案事先写下的操作化，报告没有细化。"

  # ---------- 报告第十节：每季度看的前瞻指标 ----------
  - id: AXP-Q9
    type: quantitative
    claim: 会员制的单位经济在改善，续卡按新价滚动期间，净卡费的增量在追上会员服务成本的增量
    origin: report:watch
    severity: watch
    covers: [unit_economics, pricing_power]
    pillar: P1
    metric_def:
      id: net_card_fee_to_cm_services_increment
      description: 净卡费同比增量 ÷ 会员服务成本同比增量
      unit: x
      frequency: quarter
      data: filing_text
      where: 业绩 8-K 附件 99.2 统计表或 10-Q 合并损益表的 Net card fees 与 Card Member services 两行
      formula: (net_card_fees_t - net_card_fees_{t-4q}) / (cm_services_t - cm_services_{t-4q})
      components:
        qoq_change:
          description: 上面这个比值的环比变化（本季比值减上一季比值），即 net_card_fee_to_cm_services_increment_t - net_card_fee_to_cm_services_increment_{t-1q}
          unit: x
    fail_if: 比值连续两个季度环比下降（续卡按新价滚动期间，提价错配若在消化，比值应逐季回升）
    rule: {metric: net_card_fee_to_cm_services_increment.qoq_change, op: "<", threshold: 0, unit: x, consecutive: 2, period: quarter, note: 与上一季度的比值比较，不与上年同季比较，因为上年同季多在提价之前；会员服务成本增量不为正的季度记为通过。}
    warn_if: 比值低于 1.0×，即每多收一块年费要多花一块以上买权益（提价周期走完之前出现这一警告在预期之内，不单独构成信号）
    warn_rule: {op: "<", threshold: 1.0, unit: x, consecutive: 1, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-10
    baseline:
      value: 0.62
      unit: x
      period: 1H26
      as_of: 2026-06-30
      source: AXP-RPT1-2026-09-17#p15
      note: "按增速则为 17% ÷ 49% ≈ 0.35× [src:AXP-RPT1-2026-09-17#p15]。"
    note: "报告第十节前瞻指标 #1 只给读数、不给门槛 [src:AXP-RPT1-2026-09-17#p15]，判定标准是本档案在首次读数之前写下的。报告认为 2027 年二季度之前无法区分提价错配与结构性恶化：成本先发生，存量持卡人自 2026 年 1 月 2 日起才按各自的续卡日陆续付新价 [src:AXP-RPT1-2026-09-17#p10]。错配若在消化，续卡滚动期间比值应逐季回升，所以失败看连续两季的环比下降。警告线放在增量相等处（比值等于一），对应第三节“每多收一块年费要多花多少钱买权益”的分界，提价前后分别是八毛四和一块六 [src:AXP-RPT1-2026-09-17#p6]。报告所说反方论点削弱的情形是净卡费增速 10% 以上、会员服务成本增速低于 15% [src:AXP-RPT1-2026-09-17#p10]，而净卡费的基数大于会员服务成本（本档案由报告的增量与增速推算），这一情形下比值仍可能低于一，所以比值低于一只记警告，一次性的判定交给 AXP-Q6。"

  - id: AXP-Q10
    type: quantitative
    claim: 负债端没有承压，先收后付的资金成本随市价重定价，但不持续快于资产端收益
    origin: report:watch
    severity: watch
    covers: [balance_sheet, unit_economics]
    pillar: P5
    metric: interest_expense_minus_income_growth
    fail_if: 利息支出增速持续高于利息收入增速（按连续两个季度计）
    rule: {op: ">", threshold: 0, unit: pp, consecutive: 2, period: quarter}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: 2026-10
    baseline:
      value: -10
      unit: pp
      period: 1H26
      as_of: 2026-06-30
      source: AXP-RPT1-2026-09-17#p15
      note: "利息支出同比 −3%、利息收入同比 +7% [src:AXP-RPT1-2026-09-17#p15]；差值由两项读数相减。"
    note: "报告第十节前瞻指标 #2：两条同向上行是正常重定价，单看利息支出转正不构成警报，只有支出增速持续高于收入增速才说明负债端承压 [src:AXP-RPT1-2026-09-17#p15]。报告没有给“持续”的期数，这里按连续两个季度计，取前瞻指标 #5 “连续两到三个季度才构成趋势”的下限。"

  - id: AXP-Q11
    type: quantitative
    claim: 运通客群相对行业的信用优势没有被侵蚀
    origin: report:watch
    severity: watch
    covers: [moat, balance_sheet]
    pillar: P5
    metric_def:
      id: nco_spread_industry_minus_axp
      description: 行业卡类净核销率（非季调）减去运通卡贷款的主要净核销率（报告所称“主要净核销率”，对应公司哪一个口径待核，见 todo）
      unit: pp
      frequency: quarter
      data: mixed
      where: 行业一侧为 FRED 序列 CORCCACBN（来源标签 FRED-CORCCACBN）；运通一侧为业绩 8-K 附件 99.2 的卡贷款净核销率
      formula: industry_card_nco_rate - net_write_off_rate
      components:
        industry_card_nco_rate:
          description: 行业卡类净核销率（商业银行信用卡贷款，非季调，季度）
          unit: "%"
          where: FRED 序列 CORCCACBN（来源标签 FRED-CORCCACBN），约在季末两个月后更新
        nco_spread_yoy_change:
          description: 上面这个差相对上年同季的变化，即 nco_spread_industry_minus_axp_t - nco_spread_industry_minus_axp_{t-4q}；为负表示差在收窄
          unit: pp
    fail_if: 行业与运通净核销率之差连续两个季度同比收窄
    rule: {metric: nco_spread_industry_minus_axp.nco_spread_yoy_change, op: "<", threshold: 0, unit: pp, consecutive: 2, period: quarter, note: 只和上年同季比较，因为行业序列为非季调。}
    data: mixed
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline:
      value: 1.92
      unit: pp
      period: 2026Q2
      as_of: 2026-06-30
      source: AXP-RPT1-2026-09-17#p15
      note: "行业 3.92% 对运通 2.0% [src:AXP-RPT1-2026-09-17#p15]。"
    note: "报告第十节前瞻指标 #3：这个差收窄，比运通自己的核销率上升更早说明客群优势在被侵蚀 [src:AXP-RPT1-2026-09-17#p15]。报告没有给收窄的幅度与期数，这里按连续两个季度同比收窄计。行业序列约在季末两个月后更新，所以 first_readable 晚于运通财报。"

  - id: AXP-Q12
    type: quantitative
    claim: 当期盈利里周期给的那一份没有反转：准备金没有在准备金率上升的同时由释放转为计提
    origin: report:watch
    severity: watch
    covers: [balance_sheet]
    pillar: P5
    metric: reserve_build_release
    metric_def:
      description: 信用损失准备金的净计提（为正）或净释放（为负），即信用损失拨备减去净核销；与同一季度卡贷款准备金率的同比变化一起判定
      unit: USD
      frequency: quarter
      data: filing_text
      where: 业绩 8-K 附件 99.2 统计表中的拨备构成（净核销与准备金计提/释放）、信用损失准备金与卡贷款
      components:
        reserve_rate_yoy_change:
          description: 卡贷款信用损失准备金率（公司在业绩统计表中披露的准备金占卡贷款的比例）相对上年同季的变化，即 reserve_rate_t - reserve_rate_{t-4q}
          unit: pp
          where: 业绩 8-K 附件 99.2 统计表的信用损失准备金与卡贷款
    fail_if: 同一季度里准备金为净计提（单季净计提为正），且准备金率同比上升
    rule:
      all_of:
        - {metric: reserve_build_release, op: ">", threshold: 0, unit: USD}
        - {metric: reserve_build_release.reserve_rate_yoy_change, op: ">", threshold: 0, unit: pp}
      consecutive: 1
      period: quarter
      note: 两项须在同一季度同时成立。
    warn_if: 单季净计提为正，但准备金率同比没有上升
    warn_rule: {op: ">", threshold: 0, unit: USD, consecutive: 1, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-10
    baseline:
      value: -191000000
      unit: USD
      period: 2026Q2
      as_of: 2026-06-30
      source: AXP-RPT1-2026-09-17#p15
      note: "负值表示净释放：二季度含 1.91 亿美元净释放 [src:AXP-RPT1-2026-09-17#p15]。准备金率 2.7%，为三年低点，此前为 3.0% [src:AXP-RPT1-2026-09-17#p11]。"
    note: "报告第十节前瞻指标 #4 看的是“准备金率与拨备的净方向”：当期盈利里含着周期给的那一份，释放转计提是信贷路径的第一个信号 [src:AXP-RPT1-2026-09-17#p15]。卡余额在增长（2026 年上半年同比 +8% [src:AXP-RPT1-2026-09-17#p5]），准备金率不变时准备金也要随贷款增加，单看净计提为正会把增长误读为恶化；所以失败要求准备金率同比同时上升，单独的净计提只记警告。报告没有给这一指标的门槛，这是本档案在首次读数之前写下的判定标准。连续两个季度净计提、且行业核销率回到峰值以上，即触发破坏信号 AXP-Q7。"

  - id: AXP-Q13
    type: quantitative
    claim: 提价没有在获客端付出越来越高的代价
    origin: report:watch
    severity: watch
    covers: [unit_economics, growth]
    pillar: P1
    metric_def:
      id: proprietary_new_cards_yoy
      description: 自有新开卡数量（Proprietary new cards acquired）同比
      unit: "%"
      frequency: quarter
      data: filing_text
      where: 业绩 8-K 附件 99.1 新闻稿或 99.2 统计表的新开卡统计
      formula: new_cards_t / new_cards_{t-4q} - 1
      components:
        marketing_expense_yoy:
          description: 营销费用（Marketing）同比，即 marketing_t / marketing_{t-4q} - 1
          unit: "%"
          where: 业绩 8-K 附件 99.2 统计表或 10-Q 合并损益表的 Marketing 一行
    fail_if: 同一季度里自有新开卡同比下降、同时营销费用同比上升，连续 3 个季度
    rule:
      all_of:
        - {metric: proprietary_new_cards_yoy, op: "<", threshold: 0, unit: "%"}
        - {metric: proprietary_new_cards_yoy.marketing_expense_yoy, op: ">", threshold: 0, unit: "%"}
      consecutive: 3
      period: quarter
      note: 两项须在同一季度同时成立，并且连续三个季度。
    warn_if: 同样的组合连续 2 个季度
    warn_rule:
      all_of:
        - {metric: proprietary_new_cards_yoy, op: "<", threshold: 0, unit: "%"}
        - {metric: proprietary_new_cards_yoy.marketing_expense_yoy, op: ">", threshold: 0, unit: "%"}
      consecutive: 2
      period: quarter
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-10
    baseline:
      value: [-3, 6]
      unit: "%"
      period: 2026Q2
      as_of: 2026-06-30
      source: AXP-RPT1-2026-09-17#p15
      note: "依次为自有新开卡同比、营销费用同比；上半年为 −5% 对 +3% [src:AXP-RPT1-2026-09-17#p15]，二季度自有新开卡 300 万张 [src:AXP-RPT1-2026-09-17#p7]。"
    note: "报告第十节前瞻指标 #5：提价之后获客端的代价，连续两到三个季度同向才构成趋势 [src:AXP-RPT1-2026-09-17#p15]，据此连续两个季度记警告、连续三个季度记失败。2026 年二季度是提价之后第一个干净季度，方向不利但一个季度不构成趋势 [src:AXP-RPT1-2026-09-17#p7]；2026 年一季度的单季读数待回填，以确定连续计数从哪一季开始。"

  - id: AXP-Q14
    type: quantitative
    claim: 剔除准备金释放之后的经营性盈利增长，追得上报告基准情形的第一年增长假设
    origin: report:watch
    severity: watch
    covers: [growth, unit_economics]
    pillar: P1
    metric_def:
      id: pre_provision_pretax_income_yoy
      description: 拨备前税前利润（税前利润加回信用损失拨备）同比增速
      unit: "%"
      frequency: quarter
      data: xbrl
      xbrl: [us-gaap:IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest, us-gaap:ProvisionForLoanLeaseAndOtherLosses, us-gaap:ProvisionForLoanAndLeaseLosses]
      formula: (pretax_income + provisions)_t / (pretax_income + provisions)_{t-4q} - 1
    fail_if: 2027 年上半年拨备前税前利润同比仍低于 8.5%（与第一年增长假设没有收敛）
    rule: {op: "<", threshold: 8.5, unit: "%", consecutive: 1, period: half, evaluate_on: [FY2027Q2], note: 只对 evaluate_on 那一期（截至 FY2027Q2 的 2027 年上半年）判定一次，其他期间只记录读数。}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: 2027-07
    baseline:
      value: 7.9
      unit: "%"
      period: 1H26
      as_of: 2026-06-30
      source: AXP-RPT1-2026-09-17#p15
      note: "二季度单季 +4.0%，报表口径 +15% 含准备金释放 [src:AXP-RPT1-2026-09-17#p15]。"
    note: "报告第十节前瞻指标 #6：报告基准情形的第一年增长假设是 8.5%，而剔除拨备变动后的经营性增速只有 4.0% [src:AXP-RPT1-2026-09-17#p15]；两者之差要么在 2027 年上半年收敛，要么第一年假设需要重估 [src:AXP-RPT1-2026-09-17#p15]。“收敛”按 2027 年上半年同比不低于该假设判定；这个假设只属于第一年，所以本条只判定一次（rule.evaluate_on），之后退役，或按下一年的假设重新登记，季度读数照常记录。"

  # ---------- 本档案补充的 watch 测试（报告第十节没有列入，审计后补） ----------
  - id: AXP-Q15
    type: quantitative
    claim: 每股可分配盈利在增长，而不只是被高比例地分掉
    origin: manual
    severity: watch
    covers: [free_cash_flow, growth]
    pillar: P6
    metric_def:
      id: diluted_eps_yoy
      description: 摊薄每股收益（归属普通股股东）同比
      unit: "%"
      frequency: year
      data: xbrl
      xbrl: [us-gaap:EarningsPerShareDiluted]
      formula: eps_diluted_t / eps_diluted_{t-1y} - 1
    fail_if: 连续 2 年同比下降
    rule: {op: "<", threshold: 0, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: 2027-02
    note: "宪法第 2 条的试金石是不断增长的自由现金流。对受资本充足率约束的银行控股公司，经营现金流减资本开支不代表可分配的钱（见 AXP-Q4），这里用摊薄每股收益的增长代表每股可分配盈利的增长，与 AXP-Q4 的返还比例互补：返还比例守住了而盈利连续两年下降，试金石同样在变弱。门槛沿用模板一贯的两年窗口，是本档案事先写下的标准。信贷衰退里运通的每股收益历史上会跌一半 [src:AXP-RPT1-2026-09-17#p12]，一年的下降不单独构成信号。FY2025 的每股收益报告没有给，基线待回填；公司 2026 年每股盈利指引是区间，报告所用的是指引区间 $17.30–$17.90 的中点 $17.60 [src:AXP-8K-2026-07-24#EX-99.1] [src:AXP-RPT1-2026-09-17#p12]。"

  - id: AXP-Q16
    type: quantitative
    claim: 再投资跑道在兑现：国际卡分部的利润率没有离美国消费者分部越来越远
    origin: manual
    severity: watch
    covers: [growth]
    metric: segment_operating_margin
    params:
      segment: 国际卡服务（International Card Services）
      basis: 分部税前利润 ÷ 分部扣除利息支出后的总收入（公司的分部口径）
    fail_if: 国际卡分部税前利润率连续 2 个年度同比下降
    rule: {op: decrease, threshold: 0, unit: pp, consecutive: 2, period: year, note: 与上一年度的年度利润率比较。}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2027-02
    baseline:
      value: 13
      unit: "%"
      period: 2026Q2
      as_of: 2026-06-30
      source: AXP-RPT1-2026-09-17#p6
      note: "报告写作利润率约 13%，二季度税前利润 4.77 亿美元，美国消费者分部约 22% [src:AXP-RPT1-2026-09-17#p6]；这是单季读数，年度基线待从年报分部附注回填。"
    note: "报告第三节要求把再投资跑道单独写出来：国际卡分部是唯一同时有增速和利润率空间的跑道，利润率若向美国消费者分部靠拢，同样的收入能多出接近一倍的税前利润 [src:AXP-RPT1-2026-09-17#p6]。报告没有把它列进第十节，也没有给门槛；本条是本档案补的 watch 测试，“连续两个年度下降”是事先写下的标准，意思是跑道在朝反方向走。它不对应四条承重机制中的任何一条，所以不挂 pillar。"

  - id: AXP-L8
    type: qualitative
    claim: 获客端没有出现新的销售行为违规，信任没有在销售端被消耗
    origin: manual
    severity: watch
    covers: [culture, governance]
    pillar: P6
    question: 本期文件是否披露了新的、针对运通销售或营销行为（开户、获客、营销与披露）的监管处罚、和解或同意令？
    fail_if: 是
    judge: independent_model
    evidence: required
    where: 10-K/10-Q 的法律诉讼与或有事项附注、8-K、相关监管机构（司法部、消费者金融保护局、货币监理署等）的公告
    lookback: 4
    effective_from: FY2026Q3
    first_readable: 2026-10
    baseline:
      value: 最近一次为 2025 年 1 月与司法部约 2.3 亿美元和解（1.387 亿不起诉协议加 1.087 亿民事罚款），针对 2014–2017 年对小企业的欺骗性信用卡营销；此前有 1989 年萨夫拉事件与 2012 年消费者金融保护局约 8,500 万美元退款
      as_of: 2026-09-17
      source: AXP-RPT1-2026-09-17#p9
    note: "报告第五节：赔付端的文化与销售端的行为不是同一件事，运通的信任风险出在获客端，这也是反方论点的起点之一 [src:AXP-RPT1-2026-09-17#p9]；企业文化评 B+ 正因为销售端有一条方向相反的序列 [src:AXP-RPT1-2026-09-17#p3]。报告第十节没有把它列为破坏信号，这里按 watch 处理，是本档案补的测试。"

