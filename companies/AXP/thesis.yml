    note: "The two event conditions of breaker #1 in section ten of the report; the remuneration-growth leg is in AXP-Q5; the two tests are joined by \"or\", and a failure of either means breaker #1 holds. The earliest readable point the report gives is \"from the second half of 2027, decisive point end of 2028\" [src:AXP-RPT1-2026-09-17#p14], so first_readable is 2027-07; (a) cannot hold before January 2029, and (b) can be judged as soon as a renewal is announced. Both conditions are textual events, judged as a qualitative test by an independent model against the original text, with sources cited."

  - id: AXP-Q6
    type: quantitative
    claim: After the annual-fee increases, fee income eventually catches up with benefit costs, and membership unit economics have not deteriorated structurally
    origin: report:breaker
    severity: breaker
    covers: [pricing_power, unit_economics, moat]
    pillar: P1
    metric: net_card_fees_yoy
    metric_def:
      description: Year-on-year growth in Net card fees, judged together with year-on-year growth in Card Member services expense in the same quarter
      unit: "%"
      frequency: quarter
      data: filing_text
      where: The Net card fees and Card Member services lines of the statistical tables in earnings 8-K Exhibit 99.2 or of the 10-Q consolidated income statement
      components:
        card_member_services_expense_yoy:
          description: Year-on-year growth in Card Member services expense (benefit spending across all products), i.e. cm_services_t / cm_services_{t-4q} - 1
          unit: "%"
          where: The Card Member services line of the statistical tables in earnings 8-K Exhibit 99.2 or of the 10-Q consolidated income statement
    fail_if: In the first full quarter after the price-increase cycle is complete (Q2 2027), net card fee growth drops to single digits while Card Member services expense growth is still 30% or more
    rule:
      all_of:
        - {metric: net_card_fees_yoy, op: "<", threshold: 10, unit: "%", consecutive: 1, period: quarter}
        - {metric: net_card_fees_yoy.card_member_services_expense_yoy, op: ">=", threshold: 30, unit: "%", consecutive: 1, period: quarter}
      evaluate_on: [FY2027Q2]
      note: Both must hold in the same quarter; judged once, only in the evaluate_on quarter (the first full quarter after the price-increase cycle is complete); the rule does not apply in other quarters, which AXP-Q9 tracks; after the judgment this test is retired, or registered again for a new judgment quarter.
    warn_if: In the judgment quarter, net card fee growth below 10%, or Card Member services expense growth not below 15% (i.e. the bear case has not been weakened)
    warn_rule:
      any_of:
        - {metric: net_card_fees_yoy, op: "<", threshold: 10, unit: "%", consecutive: 1, period: quarter}
        - {metric: net_card_fees_yoy.card_member_services_expense_yoy, op: ">=", threshold: 15, unit: "%", consecutive: 1, period: quarter}
      evaluate_on: [FY2027Q2]
      note: Likewise judged only in the evaluate_on quarter.
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2027-07
    baseline:
      value: 15.4
      unit: "%"
      period: 2026Q2
      as_of: 2026-06-30
      source: AXP-10Q-FY2026Q2#p39
      note: "Net card fees year on year, $2,862 million against $2,480 million [src:AXP-10Q-FY2026Q2#p39]. In the same quarter Card Member services expense rose 49.8% ($1,949 million against $1,301 million, which the company rounds to 50%) [src:AXP-10Q-FY2026Q2#p39], and 49.3% in the first half ($3,924 million against $2,629 million) [src:AXP-10Q-FY2026Q2#p40]; all three rates are this archive's computation."
    note: "Breaker #2 in section ten of the report. The body of the report sets the first full quarter after the price-increase cycle is complete as Q2 2027 [src:AXP-RPT1-2026-09-17#p6], and the monitoring table says it is readable in \"April–July 2027\" [src:AXP-RPT1-2026-09-17#p14]; the Q2 earnings 8-K comes out in late July (2026-07-24 for Q2 2026 [src:AXP-8K-2026-07-24]), so first_readable is 2027-07, and AXP-Q9 tracks the quarters before that. warn_rule comes from section seven of the report: the bear case weakens only if by then net card fee growth is still 10% or more while Card Member services expense growth has fallen below 15% [src:AXP-RPT1-2026-09-17#p10]; anything in between records a warning."

  - id: AXP-Q7
    type: quantitative
    claim: "The customer base's credit advantage can get through a credit cycle: the period of reserve releases does not turn into sustained reserve builds in step with deterioration across the industry"
    origin: report:breaker
    severity: breaker
    covers: [balance_sheet]
    pillar: P5
    metric: reserve_build_release
    metric_def:
      description: Net build (positive) or net release (negative) of the reserve for credit losses, i.e. provisions for credit losses less net write-offs; judged together with the industry card net charge-off rate for the same observation quarter
      unit: USD
      frequency: quarter
      data: mixed
      where: "Amex side: the breakdown of provisions (net write-offs and reserve build/release) in the statistical tables of earnings 8-K Exhibit 99.2; industry side: FRED series CORCCACBN (source tag FRED-CORCCACBN)"
      components:
        industry_card_nco_rate:
          description: Industry card net charge-off rate (credit card loans at commercial banks, not seasonally adjusted, quarterly)
          unit: "%"
          where: FRED series CORCCACBN (source tag FRED-CORCCACBN), a copy of the Federal Reserve Board's charge-off release [src:FRB-CHGOFF-2026-08-25], updated about two months after quarter end [src:FRB-CHGOFF-2026-08-25]
    fail_if: The industry card net charge-off rate back at or above its 2024 peak of 4.73%, while Amex has made net reserve builds for two consecutive quarters
    rule:
      all_of:
        - {metric: reserve_build_release.industry_card_nco_rate, op: ">=", threshold: 4.73, unit: "%", consecutive: 1, period: quarter}
        - {metric: reserve_build_release, op: ">", threshold: 0, unit: USD, consecutive: 2, period: quarter}
      note: Both must hold in the same observation quarter; the industry leg takes the FRED reading for the same quarter, and the judgment waits until that quarter's reading is published instead of using the previous quarter's reading.
    data: mixed
    effective_from: FY2026Q3
    first_readable: 2027-03
    baseline:
      value: -191000000
      unit: USD
      period: 2026Q2
      as_of: 2026-06-30
      source: AXP-10Q-FY2026Q2#p5
      note: "A negative value is a net release: Q2 2026 provisions of $1,084 million less net write-offs of $1,275 million [src:AXP-10Q-FY2026Q2#p5]. The industry card net charge-off rate in the same quarter was 3.92% (not seasonally adjusted), against 4.73% in Q2 2024, the highest reading since Q3 2011 [src:FRB-CHGOFF-2026-08-25]."
    note: "Breaker #3 in section ten of the report, which says it is readable \"from the Q4 results in January 2027\" [src:AXP-RPT1-2026-09-17#p14]. The Amex leg is readable in January 2027, but the industry reading for the same quarter is updated only about two months after quarter end (the Q2 2026 reading was published on 2026-08-25 [src:FRB-CHGOFF-2026-08-25]), so the earliest same-quarter judgment of both legs is in March 2027, and first_readable is 2027-03. The threshold is kept as the report wrote it; the 4.73% in fail_if is the Q2 2024 reading of the industry series, the highest since Q3 2011 [src:FRB-CHGOFF-2026-08-25]. But Card balances are growing (8.0% higher at 2026-06-30 than a year earlier, $218,054 million against $201,873 million [src:AXP-10Q-FY2026Q2#p8]), and with an unchanged reserve rate the reserve must grow with balances, so the Amex leg holds almost automatically while balances grow, and in practice this breaker is decided mainly by the industry charge-off leg (see AXP-Q12 and todo)."

  - id: AXP-L2
    type: qualitative
    claim: "The premise that people choose their payment instrument still holds: agentic commerce has not turned card choice into a default ranked by total cost"
    origin: report:breaker
    severity: breaker
    covers: [moat, competition, pricing_power]
    pillar: P4
    question: As of this period, has any major AI platform published default agentic payment rules that choose the payment card for users by total cost and do not let users lock in a chosen card? A "major AI platform" means the operator of a general-purpose, consumer-facing platform on which AI agents complete purchases on users' behalf, including at least the platform operators of the agent payment protocols listed in industry-module signpost PAY-SP6 (such as Google and OpenAI); pilots limited to a single merchant or a single issuer do not count.
    fail_if: "Yes (both conditions hold: cards chosen by total cost, and no locking in of a chosen card)"
    judge: independent_model
    evidence: required
    where: Agentic payment rules and developer documentation published by major AI platforms (outside EDGAR; registered as web or press_release sources when judged); risk factors and MD&A in Amex's 10-K/10-Q; Amex's announcements on agentic commerce
    lookback: 4
    effective_from: FY2026Q3
    baseline:
      value: "Mastercard launched Agent Pay on 2025-04-29 [src:MA-WEB-2025-04-29-1] and Visa unveiled its Trusted Agent Protocol on 2025-10-14 [src:V-WEB-2025-10-14-1]. On 2026-04-14 Amex introduced its ACE developer kit, with two of its five services (Agent Registration and Cart Context) still in development, and announced Amex Agent Purchase Protection for purchases by registered agents as a commitment for the future, with terms and conditions to apply [src:AXP-WEB-2026-04-14-1]; no filing through the Q2 2026 10-Q reports the protection in effect. That no major platform had published default payment rules when the report was written (2026-09-17) is the owner's report's statement, not checked against the platforms' own documents [src:AXP-RPT1-2026-09-17#p8]"
      as_of: 2026-09-17
      source: AXP-WEB-2026-04-14-1
    note: "Breaker #4 in section ten of the report, timing uncertain (2027–2029). This path has no current reading: the first hard reading will be either Amex disclosing the share of transactions by registered agents, or some platform publishing default payment rules [src:AXP-RPT1-2026-09-17#p8]. Platform rules are not in EDGAR filings, and the EDGAR-triggered pipeline cannot see them, so at each quarterly update the company manager searches platform announcements once; when signpost PAY-SP6 (agent-initiated purchases and network tokens) in the payments-card-networks industry module crosses its line, this test is reviewed with it. The criterion for a \"major AI platform\" is an operationalization this archive wrote down in advance; the report names none."

  # AXP-Q8 is retired from FY2026Q4 and superseded by AXP-Q17 (HQ ruling A5, 2026-09-27). It never produced a reading;
  # the entry stays as written, as the record, and only its baseline (a fact) was corrected.
  - id: AXP-Q8
    type: quantitative
    claim: The decline in the merchant rate is still a slow structural change that the rising co-brand share can explain, not a cliff in merchant bargaining power
    origin: report:breaker
    severity: breaker
    covers: [pricing_power, moat]
    pillar: P2
    metric: discount_revenue_to_billed_business
    metric_def:
      description: Merchant rate proxy = discount revenue ÷ billed business (the report's basis, which differs from the average discount rate the company discloses), judged on annual readings; judged together with the co-brand share of billed business in the same period
      unit: "%"
      frequency: year
      data: filing_text
      where: Discount revenue in the 10-K consolidated income statement and billed business in the MD&A; the disclosure of co-brand partners in the 10-K MD&A
      components:
        cobrand_share_of_billed_business:
          description: Co-brand share of billed business (on the annual-report basis used from 2022)
          unit: "%"
          where: The disclosure of co-brand partners in the 10-K MD&A
        merchant_rate_unexplained_decline_bp:
          description: "The part of the proxy's decline that the rising co-brand share cannot explain: the decline of the proxy in basis points, minus the rise in the co-brand share over the same period in percentage points times the maximum number of basis points each percentage point can explain; the coefficient 1.16 is the upper bound from the report's formula four [src:AXP-RPT1-2026-09-17#p7]; a positive value means the co-brand share did not rise correspondingly. Formula: -(discount_revenue_to_billed_business_t1 - discount_revenue_to_billed_business_t0) * 100 - 1.16 * (cobrand_share_of_billed_business_t1 - cobrand_share_of_billed_business_t0)"
          unit: bp
          where: Computed from discount_revenue_to_billed_business and cobrand_share_of_billed_business
    fail_if: The merchant rate proxy falls by more than 5 basis points a year for two consecutive years, or drops below 2.15%, and the co-brand share of billed business did not rise correspondingly over the same period (otherwise the decline is structural; see the decomposition in section four)
    rule:
      all_of:
        - any_of:
            - {metric: discount_revenue_to_billed_business, op: decrease, threshold: 0.05, unit: pp, consecutive: 2, period: year, note: "The decline from the previous year exceeds this value, i.e. the five basis points in fail_if."}
            - {metric: discount_revenue_to_billed_business, op: "<", threshold: 2.15, unit: "%", consecutive: 1, period: year}
        - metric: discount_revenue_to_billed_business.merchant_rate_unexplained_decline_bp
          op: ">"
          threshold: 0
          unit: bp
          period: year
          note: "Same judgment period as the first leg: when the first leg is a decline in two consecutive years, compute the cumulative change over those two years; when the first leg is a drop below the threshold, compute the cumulative change from the FY2025 baseline to the year of the drop."
    data: filing_text
    effective_from: FY2026Q3
    retired_at: FY2026Q4
    first_readable: 2027-02
    baseline:
      value: 2.226
      unit: "%"
      period: 1H26
      as_of: 2026-06-30
      source: AXP-10Q-FY2026Q2#p2
      note: "First half of 2026: discount revenue of $19,675 million over billed business of $883.8 billion [src:AXP-10Q-FY2026Q2#p40] [src:AXP-10Q-FY2026Q2#p2]; FY2024 2.269% and FY2025 2.240% [src:AXP-10K-FY2025#p43] [src:AXP-10K-FY2025#p45]; all this archive's computation. The co-brand share was about 18% (2022) and 21% (2023) of worldwide network volumes [src:AXP-10K-FY2022#p24] [src:AXP-10K-FY2023#p24] and about 25% (2024) and 26% (2025) of worldwide billed business [src:AXP-10K-FY2024#p25] [src:AXP-10K-FY2025#p24]. The company changed the denominator in its FY2024 10-K; restated on billed business, 2022 and 2023 come to about 21% and 24% (this archive's computation) [src:AXP-10K-FY2023#p48]."
    note: "Breaker #5 in section ten of the report, judged on each year's annual report. The rate proxy is the report's own calculation; the average discount rate the company discloses is a different basis [src:AXP-RPT1-2026-09-17#p17]. \"Correspondingly\" is judged by formula four in section four: under the extreme assumption that the whole decline is structural, 2.9 basis points ÷ 2.5 percentage points = 1.16 percentage points is the upper bound on the net rate gap between co-brand and proprietary, i.e. each 1 percentage point rise in the co-brand share explains at most about 1.16 basis points of decline in the proxy [src:AXP-RPT1-2026-09-17#p7]; only when the part above this bound is positive is the co-brand share treated as not having risen correspondingly. The report explains that the true structural contribution lies somewhere between zero and this bound [src:AXP-RPT1-2026-09-17#p7]; taking the bound attributes as much of the decline as possible to structure and is the most lenient reading; this archive chooses it on purpose, because only a decline above the bound can be known not to be structural."

  - id: AXP-Q17
    type: quantitative
    claim: The decline in the merchant rate is still a slow structural change that the rising co-brand share can explain, not a cliff in merchant bargaining power
    origin: report:breaker
    severity: breaker
    covers: [pricing_power, moat]
    pillar: P2
    supersedes: AXP-Q8
    metric: discount_revenue_to_billed_business
    metric_def:
      description: "Merchant rate proxy = discount revenue ÷ billed business, judged on annual readings, together with the co-brand share of billed business in the same period. The company prints the same ratio, rounded to two decimals, as \"Discount revenue as a % of Billed business\" in 10-K Table 5. Its average discount rate, a share of network volumes and so a different basis, was last disclosed in the FY2022 10-K."
      unit: "%"
      frequency: year
      data: filing_text
      where: Discount revenue in the 10-K consolidated statements of income and billed business in MD&A Table 1 or Table 5; the co-brand share in the 10-K risk factor on business partners (Item 1A)
      components:
        cobrand_share_of_billed_business:
          description: Co-brand share of worldwide billed business (the company's basis from the FY2024 10-K), as the company rounds it to whole percent
          unit: "%"
          where: 'The 10-K risk factor on business partners (Item 1A): "All of our cobrand portfolios in the aggregate accounted for approximately N percent of our worldwide billed business"'
        merchant_rate_unexplained_decline_bp:
          description: "The part of the proxy's decline that the rising co-brand share cannot explain: the decline of the proxy in basis points, minus the rise in the co-brand share over the same period in percentage points times the maximum number of basis points each percentage point can explain. The coefficient is 2.8 basis points per percentage point of billed-business share, the midpoint of the two same-basis, full-attribution estimates (about 2.7 for FY2023 to FY2025 and 2.9 for FY2024 to FY2025); because the company rounds the share to whole percent, the coefficient is approximate. A positive value means the co-brand share did not rise correspondingly. Formula: -(discount_revenue_to_billed_business_t1 - discount_revenue_to_billed_business_t0) * 100 - 2.8 * (cobrand_share_of_billed_business_t1 - cobrand_share_of_billed_business_t0)"
          unit: bp
          where: Computed from discount_revenue_to_billed_business and cobrand_share_of_billed_business
    fail_if: The merchant rate proxy falls by more than 5 basis points a year for two consecutive years, or drops below 2.15%, and the co-brand share of billed business did not rise correspondingly over the same period (otherwise the decline is structural; see the decomposition in section four)
    rule:
      all_of:
        - any_of:
            - {metric: discount_revenue_to_billed_business, op: decrease, threshold: 0.05, unit: pp, consecutive: 2, period: year, note: "The decline from the previous year exceeds this value, i.e. the five basis points in fail_if."}
            - {metric: discount_revenue_to_billed_business, op: "<", threshold: 2.15, unit: "%", consecutive: 1, period: year}
        - metric: discount_revenue_to_billed_business.merchant_rate_unexplained_decline_bp
          op: ">"
          threshold: 0
          unit: bp
          period: year
          note: "Same judgment period as the first leg: when the first leg is a decline in two consecutive years, compute the cumulative change over those two years; when the first leg is a drop below the threshold, compute the cumulative change from the FY2025 baseline to the year of the drop."
    data: filing_text
    effective_from: FY2026Q4
    first_readable: 2027-02
    baseline:
      value: 2.226
      unit: "%"
      period: 1H26
      as_of: 2026-06-30
      source: AXP-10Q-FY2026Q2#p2
      note: "First half of 2026: discount revenue of $19,675 million over billed business of $883.8 billion [src:AXP-10Q-FY2026Q2#p40] [src:AXP-10Q-FY2026Q2#p2]; FY2024 2.269% and FY2025 2.240% [src:AXP-10K-FY2025#p43] [src:AXP-10K-FY2025#p45]; all this archive's computation. The co-brand share was about 18% (2022) and 21% (2023) of worldwide network volumes [src:AXP-10K-FY2022#p24] [src:AXP-10K-FY2023#p24] and about 25% (2024) and 26% (2025) of worldwide billed business [src:AXP-10K-FY2024#p25] [src:AXP-10K-FY2025#p24]. The company changed the denominator in its FY2024 10-K; restated on billed business, 2022 and 2023 come to about 21% and 24% (this archive's computation) [src:AXP-10K-FY2023#p48]."
    note: "Breaker #5 in section ten of the report, judged on each year's annual report. It supersedes AXP-Q8 from FY2026Q4 (HQ ruling A5, 2026-09-27). AXP-Q8 used a coefficient of 1.16 basis points per point, the report's formula four [src:AXP-RPT1-2026-09-17#p7], which divides a one-year fall in the proxy (2.9 basis points, FY2024 to FY2025) by an average two-year rise in the co-brand share (2.5 percentage points a year, from 21% in 2023 to 26% in 2025) that crosses the company's change of denominator from network volumes to billed business in its FY2024 10-K [src:AXP-10K-FY2023#p24] [src:AXP-10K-FY2025#p24]. On one basis and one window the full-attribution bound is about 2.7 basis points per point for FY2023 to FY2025 (proxy 2.289% to 2.240%, share about 24% to 26%) and 2.9 for FY2024 to FY2025 (2.269% to 2.240%, 25% to 26%), both this archive's computation [src:AXP-10K-FY2025#p43] [src:AXP-10K-FY2025#p45] [src:AXP-10K-FY2024#p25] [src:AXP-10K-FY2023#p48]. This test takes the midpoint, 2.8. The claim, severity, thresholds, direction and both legs of the rule are those of AXP-Q8; the co-brand share is read on the billed-business basis the company has used since its FY2024 10-K, and where points to Item 1A, where the company discloses it. AXP-Q8 produced no reading (its first annual reading was due with the FY2026 10-K, around 2027-02), so the change applies only from FY2026Q4 (§G7). The bound attributes as much of the decline as possible to structure, and the true structural contribution lies somewhere between zero and the bound [src:AXP-RPT1-2026-09-17#p7]; taking the bound is the most lenient reading, chosen on purpose, because only a decline above the bound can be known not to be structural. The company's former average discount rate, last disclosed for 2022, is a different basis [src:AXP-10K-FY2022#p47]."

  - id: AXP-L3
    type: qualitative
    claim: Regulation has not removed the three-party network's legal exemption or its federal preemption protection
    origin: report:breaker
    severity: breaker
    covers: [regulation, pricing_power]
    pillar: P2
    question: "As of this period, has either of the following occurred: (a) the Credit Card Competition Act has been signed into law, and the final text removes the exemption for three-party payment networks; (b) the Seventh Circuit Court of Appeals has reversed the finding that federal law preempts Illinois's Interchange Fee Prohibition Act, and similar interchange legislation has become law in five or more states (five included), Illinois among them?"
    fail_if: Yes ((a) or (b) holds; the two conditions in (b) must both hold)
    judge: independent_model
    evidence: required
    where: Congressional legislative records and the final text of the bill; Seventh Circuit decisions; state legislative records; the legal and regulatory section of Amex's 10-K/10-Q
    lookback: 4
    judge_notes: (a) Whether the three-party network exemption is removed is decided by the final text of the law.
    effective_from: FY2026Q3
    first_readable: 2027-01
    baseline:
      value: "On 2026-06-01 the U.S. District Court for the Northern District of Illinois permanently enjoined enforcement of Illinois's interchange fee limits against national banks, federal savings associations, banks chartered by other states and payment card networks [src:NDILL-2026-06-01]; a state law approved on 2026-06-26 pushed the Act's effective date back to 2027-07-01 [src:IL-PA-104-0532]; per the owner's report the case is on appeal in the Seventh Circuit, not checked against the appeals docket [src:AXP-RPT1-2026-09-17#p8]; Amex's issuing bank is a national bank and Amex is itself a payment card network, so both of its roles fall within the injunction [src:AXP-10K-FY2025#Item1]"
      as_of: 2026-09-17
      source: NDILL-2026-06-01
      note: "On 2026-04-24 the Office of the Comptroller of the Currency issued an interim final order confirming that federal law preempts the Illinois Interchange Fee Prohibition Act for national banks and federal savings associations [src:OCC-NR-2026-32], published on 2026-04-29 [src:FR-91-23150]. The June ruling was made on an interim remand from the Seventh Circuit, where the court's February 2026 ruling had been on cross-appeal; the court's later opinion of 2026-09-22, which extends the injunction to federal credit unions, says the parties had not yet re-instituted their appeal when the National Credit Union Administration issued its own preemption rule in June 2026 [src:NDILL-2026-09-22]."
    note: "Breaker #6 in section ten of the report, readable from 2027 [src:AXP-RPT1-2026-09-17#p14]. \"Passes\" is judged as signed into law, because the bill changes Amex's position only once it is law; \"five or more states\" includes Illinois and counts five itself, the stricter of the two readings, which triggers a review sooner. Both points are operationalizations this archive wrote down in advance. The report's reading of the bill's scope provisions was not checked clause by clause against the full text [src:AXP-RPT1-2026-09-17#p13]. Court decisions and state legislative records are not in EDGAR filings and are registered as external sources when judged; when signpost PAY-SP1 (credit card routing mandates and the CCCA) in the payments-card-networks industry module crosses its line, this test is reviewed with it."

