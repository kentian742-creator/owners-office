thesis:
  summary: "美国运通是一门把年费当订阅费收、用商户折扣和利息补贴权益、再用权益留住高消费客群的会员制生意：FY2025 的 722.29 亿美元收入里商户折扣占 51.8%、净卡费占 13.8% [src:AXP-RPT1-2026-09-17#p3]。定价权的证据是净卡费从 2019 年二季度约 10 亿美元/季长到 2026 年二季度的 28.6 亿美元/季，穿过了疫情停摆、零利率、加息与降息 [src:AXP-RPT1-2026-09-17#p3]。它不是吃免费浮存金的公司，而是带订阅叠加层的利差放贷机构：1,570 亿美元存款一年约付 52 亿美元利息，相当于 FY2025 税前利润的 38% [src:AXP-RPT1-2026-09-17#p4]，历史上两次把它推到生死线的（1991、2008）都是内部的资产负债表 [src:AXP-RPT1-2026-09-17#p10]。论点最怕两件事：代理替用户选卡让“人不再挑选”，以及 2029 年底到期的达美联名让“客群不属于自己” [src:AXP-RPT1-2026-09-17#p3] [src:AXP-RPT1-2026-09-17#p8]。"
  pillars:
    - id: P1
      claim: "年费订阅是经营杠杆所在，会员付费意愿在变强：二季度单卡年化平均费 131 美元（同比 +12%）、新开户中 75% 落在收费产品、净卡费同比 +15.4% [src:AXP-RPT1-2026-09-17#p4]，但这条线还要在 2027 年证明年费能追上提价后的权益成本 [src:AXP-RPT1-2026-09-17#p6]。"
      source: AXP-RPT1-2026-09-17#p7
    - id: P2
      claim: "商户费率与利息这两条补贴线不会被议价力或监管断崖式重新定价：费率代理值每年只下滑 2–3 个基点，且其中一部分来自联名占比上升 [src:AXP-RPT1-2026-09-17#p7]；2018 年最高法院判例仍保护反引导条款，伊利诺伊州的互换费限制对国民银行与支付卡网络已被永久禁止执行 [src:AXP-RPT1-2026-09-17#p8]。"
      source: AXP-RPT1-2026-09-17#p7
    - id: P3
      claim: "客群大体属于自己：联名伙伴达美（约占全球账单业务 13%、持卡人贷款 21%）会在 2029 年底协议到期前续约并保持独家，联名酬金的增长不会持续跑赢运通自己的收入 [src:AXP-RPT1-2026-09-17#p8]。"
      source: AXP-RPT1-2026-09-17#p8
    - id: P4
      claim: "由人挑选支付工具这个前提仍然成立：代理商务没有把选卡变成按总成本排序的默认值；运通已在 2026-04-14 发布 ACE 开发者工具包并推出代理购买赔付保障 [src:AXP-RPT1-2026-09-17#p8]。"
      source: AXP-RPT1-2026-09-17#p8
    - id: P5
      claim: "客群信用优势和资产负债表能扛过一次信贷周期：运通主要净核销率 2.0%，比行业 3.92% 低 1.92 个百分点 [src:AXP-RPT1-2026-09-17#p11]；先收后付的资金成本随市价重定价但没有失控，2026 年上半年利息支出同比 −3%、利息收入同比 +7% [src:AXP-RPT1-2026-09-17#p5]。"
      source: AXP-RPT1-2026-09-17#p11
    - id: P6
      claim: "管理层与资本纪律延续：报告给管理层的两条可计算标准都通过，三个经营分部 2023–2025 年每年都盈利，近三年返还 76% 的普通股净利润、股数三年净减 5.4% [src:AXP-RPT1-2026-09-17#p10]；资本配置本身只评 B，回购在内在价值附近进行，没有明显创造或毁灭价值 [src:AXP-RPT1-2026-09-17#p3]。这是一个内部人管理的组织 [src:AXP-RPT1-2026-09-17#p9]，“优秀管理层”的判定挂在具体的人和年份上 [src:AXP-RPT1-2026-09-17#p10]。"
      source: AXP-RPT1-2026-09-17#p10
  # 芒格反向清单：怎样会永久亏损（取自报告第五、七节与第十二节“最可能错在哪”）；每条末尾写明由哪些测试监测
  permanent_loss_paths:
    - "信贷周期叠加资产负债表失误：一次衰退里行业核销率回到峰值以上、准备金由释放转计提 [src:AXP-RPT1-2026-09-17#p14]，回购会先停 [src:AXP-RPT1-2026-09-17#p6]；三十五年里出现过四次 30% 以上的盈利回撤（口径不一，只看频率与量级）[src:AXP-RPT1-2026-09-17#p11]，若像 1991 年那样信贷失误、非主业失血与商户集体行动在同一个衰退里同时暴露，周期性回撤会变成永久性损失 [src:AXP-RPT1-2026-09-17#p10] [src:AXP-RPT1-2026-09-17#p13]。监测：AXP-Q7、AXP-Q11、AXP-Q12。"
    - "联名关系断裂或变贵：达美约占全球账单业务 13%、持卡人贷款 21%，现行协议 2029 年底到期 [src:AXP-RPT1-2026-09-17#p8]。可比先例是好市多：2015 年 2 月运通宣布不再与好市多续约时，好市多约占全球账单业务 8%、全球贷款约 20% [src:AXP-RPT1-2026-09-17#p8]；当年好市多组合的贷款/账单比是 2.5 倍，达美是 1.6 倍，达美组合对利息的依赖反而更低 [src:AXP-RPT1-2026-09-17#p8]。报告记载此后 2015 与 2016 两年收入连续下滑、2015 年被迫重置中期目标，但同期还流失了 JetBlue 联名，且这段注明未逐项核对原文 [src:AXP-RPT1-2026-09-17#p9]。监测：AXP-Q5、AXP-L6。"
    - "选卡权转移：AI 代理按总成本替用户选卡且不许锁卡，年费、积分与权益这套“让人选我”的机制失去对象 [src:AXP-RPT1-2026-09-17#p4]，商户费率溢价被按成本套利，而 2018 年的反引导判例约束的是商户对人的言行，约束不到对机器的排序参数 [src:AXP-RPT1-2026-09-17#p8]。监测：AXP-L2。"
    - "会员制单位经济恶化：权益竞赛让成本曲线持续跑赢费收曲线，每多收一块年费要多花的权益成本从 0.84 倍升到 1.62 倍 [src:AXP-RPT1-2026-09-17#p6]；公司不披露续卡率，如果“留下来的人付得更多”其实掩盖了“愿意付的人在变少”，年费定价权就是错觉 [src:AXP-RPT1-2026-09-17#p16]。监测：AXP-Q6、AXP-Q9、AXP-Q13。"
    - "监管重新定价：联邦信用卡利率上限打在约占收入 24% 的净利息收入上 [src:AXP-RPT1-2026-09-17#p3] [src:AXP-RPT1-2026-09-17#p14]，或《信用卡竞争法案》删除三方网络豁免、州级互换费立法扩散 [src:AXP-RPT1-2026-09-17#p14]。监测：AXP-L3、AXP-L4。"
    - "获客端的信任受损：运通把服务写成护城河的核心，最近一次被监管处罚的却是销售行为，2025 年 1 月与司法部约 2.3 亿美元和解，针对 2014–2017 年对小企业的欺骗性营销 [src:AXP-RPT1-2026-09-17#p9]；报告认为它的信任风险出在获客端而不是赔付端，并把这列为反方论点的起点之一 [src:AXP-RPT1-2026-09-17#p9]。监测：AXP-L8。"

