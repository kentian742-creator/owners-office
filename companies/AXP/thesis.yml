  - id: AXP-Q6
    type: quantitative
    claim: After the annual-fee increases, fee income eventually catches up with benefit costs, and membership unit economics have not deteriorated structurally
    origin: report:breaker
    severity: breaker
    covers: [pricing_power, unit_economics, moat]
    pillar: P1
    metric: net_card_fees_yoy
    metric_def:
      description: Year-on-year growth in Net card fees, judged together with year-on-year growth in Card Member services expense in the same quarter
      unit: "%"
      frequency: quarter
      data: filing_text
      where: The Net card fees and Card Member services lines of the statistical tables in earnings 8-K Exhibit 99.2 or of the 10-Q consolidated income statement
      components:
        card_member_services_expense_yoy:
          description: Year-on-year growth in Card Member services expense (benefit spending across all products), i.e. cm_services_t / cm_services_{t-4q} - 1
          unit: "%"
          where: The Card Member services line of the statistical tables in earnings 8-K Exhibit 99.2 or of the 10-Q consolidated income statement
    fail_if: In the first full quarter after the price-increase cycle is complete (Q2 2027), net card fee growth drops to single digits while Card Member services expense growth is still 30% or more
    rule:
      all_of:
        - {metric: net_card_fees_yoy, op: "<", threshold: 10, unit: "%", consecutive: 1, period: quarter}
        - {metric: net_card_fees_yoy.card_member_services_expense_yoy, op: ">=", threshold: 30, unit: "%", consecutive: 1, period: quarter}
      evaluate_on: [FY2027Q2]
      note: Both must hold in the same quarter; judged once, only in the evaluate_on quarter (the first full quarter after the price-increase cycle is complete); the rule does not apply in other quarters, which AXP-Q9 tracks; after the judgment this test is retired, or registered again for a new judgment quarter.
    warn_if: In the judgment quarter, net card fee growth below 10%, or Card Member services expense growth not below 15% (i.e. the bear case has not been weakened)
    warn_rule:
      any_of:
        - {metric: net_card_fees_yoy, op: "<", threshold: 10, unit: "%", consecutive: 1, period: quarter}
        - {metric: net_card_fees_yoy.card_member_services_expense_yoy, op: ">=", threshold: 15, unit: "%", consecutive: 1, period: quarter}
      evaluate_on: [FY2027Q2]
      note: Likewise judged only in the evaluate_on quarter.
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2027-07
    baseline:
      value: 15.4
      unit: "%"
      period: 2026Q2
      as_of: 2026-06-30
      source: AXP-RPT1-2026-09-17#p4
      note: "Net card fees year on year; in the same quarter Card Member services expense was +50% year on year, and +49% in the first half [src:AXP-RPT1-2026-09-17#p10]."
    note: "Breaker #2 in section ten of the report. The body of the report sets the first full quarter after the price-increase cycle is complete as Q2 2027 [src:AXP-RPT1-2026-09-17#p6], and the monitoring table says it is readable in \"April–July 2027\" [src:AXP-RPT1-2026-09-17#p14]; the Q2 earnings 8-K comes out in late July (2026-07-24 for Q2 2026 [src:AXP-RPT1-2026-09-17#p17]), so first_readable is 2027-07, and AXP-Q9 tracks the quarters before that. warn_rule comes from section seven of the report: the bear case weakens only if by then net card fee growth is still 10% or more while Card Member services expense growth has fallen below 15% [src:AXP-RPT1-2026-09-17#p10]; anything in between records a warning."

  - id: AXP-Q7
    type: quantitative
    claim: "The customer base's credit advantage can get through a credit cycle: the period of reserve releases does not turn into sustained reserve builds in step with deterioration across the industry"
    origin: report:breaker
    severity: breaker
    covers: [balance_sheet]
    pillar: P5
    metric: reserve_build_release
    metric_def:
      description: Net build (positive) or net release (negative) of the reserve for credit losses, i.e. provisions for credit losses less net write-offs; judged together with the industry card net charge-off rate for the same observation quarter
      unit: USD
      frequency: quarter
      data: mixed
      where: "Amex side: the breakdown of provisions (net write-offs and reserve build/release) in the statistical tables of earnings 8-K Exhibit 99.2; industry side: FRED series CORCCACBN (source tag FRED-CORCCACBN)"
      components:
        industry_card_nco_rate:
          description: Industry card net charge-off rate (credit card loans at commercial banks, not seasonally adjusted, quarterly)
          unit: "%"
          where: FRED series CORCCACBN (source tag FRED-CORCCACBN), updated about two months after quarter end
    fail_if: The industry card net charge-off rate back at or above its 2024 peak of 4.73%, while Amex has made net reserve builds for two consecutive quarters
    rule:
      all_of:
        - {metric: reserve_build_release.industry_card_nco_rate, op: ">=", threshold: 4.73, unit: "%", consecutive: 1, period: quarter}
        - {metric: reserve_build_release, op: ">", threshold: 0, unit: USD, consecutive: 2, period: quarter}
      note: Both must hold in the same observation quarter; the industry leg takes the FRED reading for the same quarter, and the judgment waits until that quarter's reading is published instead of using the previous quarter's reading.
    data: mixed
    effective_from: FY2026Q3
    first_readable: 2027-03
    baseline:
      value: -191000000
      unit: USD
      period: 2026Q2
      as_of: 2026-06-30
      source: AXP-RPT1-2026-09-17#p11
      note: "A negative value is a net release: Q2 provisions include a net release of $191 million [src:AXP-RPT1-2026-09-17#p11]. The industry card net charge-off rate in the same quarter was 3.92% (not seasonally adjusted), against a peak of 4.73% in Q2 2024 [src:AXP-RPT1-2026-09-17#p11]."
    note: "Breaker #3 in section ten of the report, which says it is readable \"from the Q4 results in January 2027\" [src:AXP-RPT1-2026-09-17#p14]. The Amex leg is readable in January 2027, but the industry reading for the same quarter is updated only about two months after quarter end (the Q2 2026 reading the report uses comes from the series as updated on 2026-08-25 [src:AXP-RPT1-2026-09-17#p17]), so the earliest same-quarter judgment of both legs is in March 2027, and first_readable is 2027-03. The threshold is kept as the report wrote it; but card balances are growing (+8% year on year in the first half of 2026 [src:AXP-RPT1-2026-09-17#p5]), and with an unchanged reserve rate the reserve must grow with loans, so the Amex leg holds almost automatically while loans grow, and in practice this breaker is decided mainly by the industry charge-off leg (see AXP-Q12 and todo)."

  - id: AXP-L2
    type: qualitative
    claim: "The premise that people choose their payment instrument still holds: agentic commerce has not turned card choice into a default ranked by total cost"
    origin: report:breaker
    severity: breaker
    covers: [moat, competition, pricing_power]
    pillar: P4
    question: As of this period, has any major AI platform published default agentic payment rules that choose the payment card for users by total cost and do not let users lock in a chosen card? A "major AI platform" means the operator of a general-purpose, consumer-facing platform on which AI agents complete purchases on users' behalf, including at least the platform operators of the agent payment protocols listed in industry-module signpost PAY-SP6 (such as Google and OpenAI); pilots limited to a single merchant or a single issuer do not count.
    fail_if: "Yes (both conditions hold: cards chosen by total cost, and no locking in of a chosen card)"
    judge: independent_model
    evidence: required
    where: Agentic payment rules and developer documentation published by major AI platforms (outside EDGAR; registered as web or press_release sources when judged); risk factors and MD&A in Amex's 10-K/10-Q; Amex's announcements on agentic commerce
    lookback: 4
    effective_from: FY2026Q3
    baseline:
      value: Mastercard Agent Pay launched in April 2025 and the Visa Trusted Agent Protocol in October 2025; on 2026-04-14 Amex released the ACE developer kit and launched purchase protection for purchases by registered agents; when the report was written, no major platform had published default payment rules
      as_of: 2026-09-17
      source: AXP-RPT1-2026-09-17#p8
    note: "Breaker #4 in section ten of the report, timing uncertain (2027–2029). This path has no current reading: the first hard reading will be either Amex disclosing the share of transactions by registered agents, or some platform publishing default payment rules [src:AXP-RPT1-2026-09-17#p8]. Platform rules are not in EDGAR filings, and the EDGAR-triggered pipeline cannot see them, so at each quarterly update the company manager searches platform announcements once; when signpost PAY-SP6 (agent-initiated purchases and network tokens) in the payments-card-networks industry module crosses its line, this test is reviewed with it. The criterion for a \"major AI platform\" is an operationalization this archive wrote down in advance; the report names none."

  - id: AXP-Q8
    type: quantitative
    claim: The decline in the merchant rate is still a slow structural change that the rising co-brand share can explain, not a cliff in merchant bargaining power
    origin: report:breaker
    severity: breaker
    covers: [pricing_power, moat]
    pillar: P2
    metric: discount_revenue_to_billed_business
    metric_def:
      description: Merchant rate proxy = discount revenue ÷ billed business (the report's basis, which differs from the average discount rate the company discloses), judged on annual readings; judged together with the co-brand share of billed business in the same period
      unit: "%"
      frequency: year
      data: filing_text
      where: Discount revenue in the 10-K consolidated income statement and billed business in the MD&A; the disclosure of co-brand partners in the 10-K MD&A
      components:
        cobrand_share_of_billed_business:
          description: Co-brand share of billed business (on the annual-report basis used from 2022)
          unit: "%"
          where: The disclosure of co-brand partners in the 10-K MD&A
        merchant_rate_unexplained_decline_bp:
          description: "The part of the proxy's decline that the rising co-brand share cannot explain: the decline of the proxy in basis points, minus the rise in the co-brand share over the same period in percentage points times the maximum number of basis points each percentage point can explain; the coefficient 1.16 is the upper bound from the report's formula four [src:AXP-RPT1-2026-09-17#p7]; a positive value means the co-brand share did not rise correspondingly. Formula: -(discount_revenue_to_billed_business_t1 - discount_revenue_to_billed_business_t0) * 100 - 1.16 * (cobrand_share_of_billed_business_t1 - cobrand_share_of_billed_business_t0)"
          unit: bp
          where: Computed from discount_revenue_to_billed_business and cobrand_share_of_billed_business
    fail_if: The merchant rate proxy falls by more than 5 basis points a year for two consecutive years, or drops below 2.15%, and the co-brand share of billed business did not rise correspondingly over the same period (otherwise the decline is structural; see the decomposition in section four)
    rule:
      all_of:
        - any_of:
            - {metric: discount_revenue_to_billed_business, op: decrease, threshold: 0.05, unit: pp, consecutive: 2, period: year, note: "The decline from the previous year exceeds this value, i.e. the five basis points in fail_if."}
            - {metric: discount_revenue_to_billed_business, op: "<", threshold: 2.15, unit: "%", consecutive: 1, period: year}
        - metric: discount_revenue_to_billed_business.merchant_rate_unexplained_decline_bp
          op: ">"
          threshold: 0
          unit: bp
          period: year
          note: "Same judgment period as the first leg: when the first leg is a decline in two consecutive years, compute the cumulative change over those two years; when the first leg is a drop below the threshold, compute the cumulative change from the FY2025 baseline to the year of the drop."
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2027-02
    baseline:
      value: 2.226
      unit: "%"
      period: 1H26
      as_of: 2026-06-30
      source: AXP-RPT1-2026-09-17#p7
      note: "FY2024 was 2.269% and FY2025 2.240% [src:AXP-RPT1-2026-09-17#p7]; the co-brand share of billed business was 18% in 2022, 21% in 2023 and 26% in 2025 [src:AXP-RPT1-2026-09-17#p7]."
    note: "Breaker #5 in section ten of the report, judged on each year's annual report. The rate proxy is the report's own calculation; the average discount rate the company discloses is a different basis [src:AXP-RPT1-2026-09-17#p17]. \"Correspondingly\" is judged by formula four in section four: under the extreme assumption that the whole decline is structural, 2.9 basis points ÷ 2.5 percentage points = 1.16 percentage points is the upper bound on the net rate gap between co-brand and proprietary, i.e. each 1 percentage point rise in the co-brand share explains at most about 1.16 basis points of decline in the proxy [src:AXP-RPT1-2026-09-17#p7]; only when the part above this bound is positive is the co-brand share treated as not having risen correspondingly. The report explains that the true structural contribution lies somewhere between zero and this bound [src:AXP-RPT1-2026-09-17#p7]; taking the bound attributes as much of the decline as possible to structure and is the most lenient reading; this archive chooses it on purpose, because only a decline above the bound can be known not to be structural."

  - id: AXP-L3
    type: qualitative
    claim: Regulation has not removed the three-party network's legal exemption or its federal preemption protection
    origin: report:breaker
    severity: breaker
    covers: [regulation, pricing_power]
    pillar: P2
    question: "As of this period, has either of the following occurred: (a) the Credit Card Competition Act has been signed into law, and the final text removes the exemption for three-party payment networks; (b) the Seventh Circuit Court of Appeals has reversed the finding that federal law preempts Illinois's Interchange Fee Prohibition Act, and similar interchange legislation has become law in five or more states (five included), Illinois among them?"
    fail_if: Yes ((a) or (b) holds; the two conditions in (b) must both hold)
    judge: independent_model
    evidence: required
    where: Congressional legislative records and the final text of the bill; Seventh Circuit decisions; state legislative records; the legal and regulatory section of Amex's 10-K/10-Q
    lookback: 4
    judge_notes: (a) Whether the three-party network exemption is removed is decided by the final text of the law.
    effective_from: FY2026Q3
    first_readable: 2027-01
    baseline:
      value: On 2026-06-01 the U.S. District Court for the Northern District of Illinois permanently enjoined enforcement of Illinois's interchange fee limits against national banks, federal savings associations, out-of-state state banks and payment card networks; the state law's effective date was pushed back to 2027-07-01, and the case is on appeal in the Seventh Circuit; Amex's issuing entity is a national bank and Amex is itself a payment card network, so both of its roles fall within the exemption
      as_of: 2026-09-17
      source: AXP-RPT1-2026-09-17#p8
      note: "For the ruling date and the April 2026 preemption determination of the Office of the Comptroller of the Currency (OCC) see [src:AXP-RPT1-2026-09-17#p7]; the report's appendix lists this ruling and the OCC's preemption rule as primary sources [src:AXP-RPT1-2026-09-17#p17]."
    note: "Breaker #6 in section ten of the report, readable from 2027 [src:AXP-RPT1-2026-09-17#p14]. \"Passes\" is judged as signed into law, because the bill changes Amex's position only once it is law; \"five or more states\" includes Illinois and counts five itself, the stricter of the two readings, which triggers a review sooner. Both points are operationalizations this archive wrote down in advance. The report's reading of the bill's scope provisions was not checked clause by clause against the full text [src:AXP-RPT1-2026-09-17#p13]. Court decisions and state legislative records are not in EDGAR filings and are registered as external sources when judged; when signpost PAY-SP1 (credit card routing mandates and the CCCA) in the payments-card-networks industry module crosses its line, this test is reviewed with it."

  - id: AXP-L4
    type: qualitative
    claim: "The net interest income line, about 24% of revenue, has not been repriced by a federal rate cap [src:AXP-RPT1-2026-09-17#p3]"
    origin: report:breaker
