    question: "As of this period, has either of the following occurred: (a) the date is later than 2028-12-31 and Amex and Delta have still not announced a renewal of the co-brand agreement; (b) an announced renewal shows that Amex is no longer the exclusive issuer of Delta co-brand cards?"
    fail_if: Yes ((a) or (b) holds)
