      as_of: 2026-09-17
      source: AXP-10K-FY2025#p139
    note: "Applies L-cycle-capalloc from the secondary cyclical template; the definition of \"sharply\" is an operationalization this archive wrote down in advance. The report rates capital allocation B [src:AXP-RPT1-2026-09-17#p3]; current profits include net reserve releases: Q2 2026 pretax income grew 14.7% on the reported basis ($4,071 million against $3,550 million), which includes a reserve release, and 4.0% before provisions ($5,155 million against $4,955 million), both this archive's computation [src:AXP-10Q-FY2026Q2#p2] [src:AXP-10Q-FY2026Q2#p39]. Part of a \"record\" profit is the cycle's gift, and stepping up buybacks at the cycle peak is exactly the mistake this test guards against."

  # ---------- Section ten of the report: thesis breakers (if any one holds, this judgment has to be rewritten) ----------
  - id: AXP-Q5
    type: quantitative
    claim: Growth in co-brand remuneration will not persistently outrun Amex's own revenue
    origin: report:breaker
    severity: breaker
    covers: [customer_concentration, moat, unit_economics]
    pillar: P3
    metric_def:
      id: delta_remuneration_growth_minus_revenue_growth
      description: Year-on-year growth in the co-brand remuneration from American Express that Delta publicly discloses, minus year-on-year growth in Amex's total revenues net of interest expense
      unit: pp
      frequency: year
      data: filing_text
      where: The remuneration disclosure related to the American Express agreements in Delta's 10-K (each year from DAL-10K-FY2025); Amex's 10-K consolidated income statement
      formula: yoy(delta_amex_remuneration) - yoy(axp_revenue_net_of_interest_expense)
    fail_if: Disclosed remuneration growth above Amex's revenue growth for two consecutive years; the consecutive count starts from FY2026, with FY2025 only as the baseline; both year-on-year figures are computed from the disclosed amounts (not rounded percentages), the difference is kept to one decimal place, and a difference not above zero counts as a pass
    rule: {op: ">", threshold: 0, unit: pp, consecutive: 2, period: year, evaluate_from: FY2026}
    warn_if: Remuneration growth above Amex's revenue growth in a single year
    warn_rule: {op: ">", threshold: 0, unit: pp, consecutive: 1, period: year}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2027-02
    baseline:
      value: 1.5
      unit: pp
      period: FY2025
      as_of: 2025-12-31
      source: DAL-10K-FY2025#Item7
      note: "Delta received $8.2 billion of remuneration from American Express in 2025, 11% more than in 2024 as Delta rounds it [src:DAL-10K-FY2025#Item1] [src:DAL-10K-FY2025#Item7], while Amex's total revenues net of interest expense grew 9.5% (this archive's computation, which the company rounds to 10%) [src:AXP-10K-FY2025#p43]. Delta gives no unrounded rate, so the difference is uncertain by about half a point either way; it serves only as the baseline and does not count toward the two consecutive years. Forward readings: Delta's remuneration was $4.5 billion in the first half of 2026, up 13% as Delta rounds it [src:DAL-10Q-FY2026Q2#Item2], while Amex's revenue grew 10.7% in the same half ($38,544 million against $34,823 million, this archive's computation) [src:AXP-10Q-FY2026Q2#p40]. For the full year, Delta's expectation of $9 billion, about 9.8% above 2025, is an earnings-call remark as reported by third parties and in the owner's report, not in Delta's filings [src:DAL-CALL-FY2026Q2] [src:AXP-RPT1-2026-09-17#p8], and Amex has raised its revenue growth guidance to 10% [src:AXP-8K-2026-07-24#EX-99.1]."
    note: "The remuneration-growth leg of breaker #1 in section ten of the report; the other two event conditions (whether a renewal is announced before the end of 2028, and whether exclusivity is kept after renewal) are in the qualitative test AXP-L6; the two tests are joined by \"or\", and a failure of either means breaker #1 holds. The earliest readable point the report gives for this breaker is \"from the second half of 2027, decisive point end of 2028\" [src:AXP-RPT1-2026-09-17#p14], and it does not say that FY2025 counts toward \"two consecutive years\"; if FY2025 counted, a single FY2026 reading would trigger it in early 2027, earlier than the report's timing, so the consecutive count starts from FY2026, a choice written down before either company publishes its FY2026 figures. Delta's call remark and Amex's guidance put the FY2026 difference near zero, although the first half of 2026 ran above it (see the baseline); a single-year reading only records a warning, and first_readable is 2027-02, when both companies publish their FY2026 annual reports, and the earliest possible failure is in early 2028, when both publish their FY2027 annual reports, still earlier than the report's decisive point. The current agreement was renewed in 2019 [src:AXP-10K-FY2019#p3] and runs through the end of 2029 [src:AXP-10K-FY2025#p4]."

  - id: AXP-L6
    type: qualitative
    claim: Delta will renew before the agreement expires at the end of 2029, and Amex stays the exclusive issuer
    origin: report:breaker
    severity: breaker
    covers: [customer_concentration, moat]
