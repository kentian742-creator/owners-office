# AXP thesis file (public; thesis-ci spec §4; schema: spec/schemas/thesis.schema.json)
# How it was built: first the Lynch stalwart template and the _common staleness tests, then, one by one, the
# thesis breakers (severity: breaker) and quarterly watch indicators (severity: watch) from section ten of the 02 report.
# Thresholds follow the report's text; where the report gives none, the test note states how this archive operationalizes it.
# Everything price-related (ranges, reference price, the rating of the price) is only in the private repository, owners-office-private/companies/AXP/valuation.yml.
# Revised 2026-09-24 after the fact audit and the design audit: wording and page numbers corrected, AXP-Q5 split, judgment windows written out, AXP-L6 to AXP-L8, AXP-Q15 and AXP-Q16 added.
schema_version: "0.2"
company: AXP
name: American Express Company
exchange: NYSE
status: candidate
filer:
  cik: "0000004962"
  type: domestic
  fiscal_year_end: "12-31"
  earnings_form: 8-K
  annual_form: 10-K
category: stalwart
category_secondary: cyclical
# The secondary cyclical template's three tests: Q-cycle (provision growth YoY) is covered by AXP-Q12 and AXP-Q7, since the net direction of provisions and the reserve rate move earlier than provision growth and are not distorted by the base;
# Q-leverage (net debt ÷ EBITDA) does not apply, because a card issuer's new debt funds new card balances (see the AXP-Q2 note); L-cycle-capalloc is applied as AXP-L7.
category_rationale: "FY2025 revenue of $72.229 billion [src:AXP-RPT1-2026-09-17#p3], up 10% year on year [src:AXP-RPT1-2026-09-17#p8], with 2026 revenue guidance raised to +10% [src:AXP-RPT1-2026-09-17#p9]: a large, steady stalwart growing at around ten percent. The secondary category is cyclical, because at bottom it is a spread lender with a subscription layer on top [src:AXP-RPT1-2026-09-17#p4], and in thirty-five years it has had four earnings drawdowns of 30% or more (the four are measured on different bases and serve only to gauge frequency and size) [src:AXP-RPT1-2026-09-17#p11]."
domain: payments_financial_data
depends_on:
  - industries/payments-card-networks
trust_level: 1
as_of: 2026-09-24

# Last review dates of the dossier's twelve parts and the Munger matrix = the 02 report date (the report has all twelve sections; section six places the company in the matrix)
reviewed:
  business: 2026-09-17
  economics: 2026-09-17
  moat: 2026-09-17
  capital_allocation: 2026-09-17
  management: 2026-09-17
  culture: 2026-09-17
  runway: 2026-09-17
  valuation: 2026-09-17
  bear_case: 2026-09-17
  monitoring: 2026-09-17
  thesis: 2026-09-17
  breakers: 2026-09-17
  munger: 2026-09-17

# Ratings from section one of the report; the separate "internal promotion and talent retention" dimension in the rating table is left blank by the report and not scored
ratings:
  business: A−
  management: A−
  capital_allocation: B
  culture: B+
  source: AXP-RPT1-2026-09-17#p3

thesis:
  summary: "American Express is a membership business that collects the annual fee as a subscription, uses merchant discount and interest to subsidize benefits, and uses the benefits to keep a high-spending customer base: of FY2025 revenue of $72.229 billion, merchant discount was 51.8% and net card fees 13.8% [src:AXP-RPT1-2026-09-17#p3]. The evidence of pricing power is that net card fees grew from about $1 billion a quarter in Q2 2019 to $2.86 billion a quarter in Q2 2026, through pandemic shutdowns, zero rates, rate hikes and rate cuts [src:AXP-RPT1-2026-09-17#p3]. It is not a company living on free float but a spread lender with a subscription layer on top: $157 billion of deposits cost about $5.2 billion a year in interest, equal to 38% of FY2025 pretax income [src:AXP-RPT1-2026-09-17#p4], and both times history pushed it to the brink (1991, 2008) the cause was its own balance sheet [src:AXP-RPT1-2026-09-17#p10]. The thesis fears two things most: agents choosing cards for users, so that \"people no longer choose\", and the Delta co-brand expiring at the end of 2029, so that \"the customer base is not its own\" [src:AXP-RPT1-2026-09-17#p3] [src:AXP-RPT1-2026-09-17#p8]."
  pillars:
    - id: P1
      claim: "The annual-fee subscription is where the operating leverage is, and members' willingness to pay is getting stronger: in Q2 the annualized average fee per card was $131 (+12% year on year), 75% of new accounts were in fee-paying products, and net card fees were up 15.4% year on year [src:AXP-RPT1-2026-09-17#p4]; but in 2027 this line still has to prove that fees can catch up with the benefit costs that followed the price increases [src:AXP-RPT1-2026-09-17#p6]."
      source: AXP-RPT1-2026-09-17#p7
    - id: P2
      claim: "The two subsidy lines, merchant rates and interest, will not be repriced off a cliff by bargaining power or regulation: the rate proxy slips only 2–3 basis points a year, and part of that comes from the rising co-brand share [src:AXP-RPT1-2026-09-17#p7]; the 2018 Supreme Court precedent still protects anti-steering provisions, and Illinois's interchange fee limits have been permanently enjoined as to national banks and payment card networks [src:AXP-RPT1-2026-09-17#p8]."
      source: AXP-RPT1-2026-09-17#p7
    - id: P3
      claim: "The customer base is largely its own: co-brand partner Delta (about 13% of worldwide billed business and 21% of Card Member loans) will renew and stay exclusive before the agreement expires at the end of 2029, and growth in co-brand remuneration will not persistently outrun Amex's own revenue [src:AXP-RPT1-2026-09-17#p8]."
      source: AXP-RPT1-2026-09-17#p8
    - id: P4
      claim: "The premise that people choose their payment instrument still holds: agentic commerce has not turned card choice into a default ranked by total cost; on 2026-04-14 Amex released the ACE developer kit and launched purchase protection for purchases made by agents [src:AXP-RPT1-2026-09-17#p8]."
      source: AXP-RPT1-2026-09-17#p8
    - id: P5
      claim: "The customer base's credit advantage and the balance sheet can get through a credit cycle: Amex's main net write-off rate is 2.0%, 1.92 percentage points below the industry's 3.92% [src:AXP-RPT1-2026-09-17#p11]; the cost of its collect-first, pay-later funding reprices with the market but is not out of control, with interest expense −3% and interest income +7% year on year in the first half of 2026 [src:AXP-RPT1-2026-09-17#p5]."
      source: AXP-RPT1-2026-09-17#p11
    - id: P6
      claim: "Management quality and capital discipline continue: management passes both of the report's calculable tests, all three operating segments were profitable in every year of 2023–2025, and 76% of net income to common was returned over the last three years, with the share count down a net 5.4% in three years [src:AXP-RPT1-2026-09-17#p10]; capital allocation itself rates only B: buybacks are made near intrinsic value and neither clearly create nor destroy value [src:AXP-RPT1-2026-09-17#p3]. This is an organization run by insiders [src:AXP-RPT1-2026-09-17#p9], and the \"excellent management\" verdict is tied to specific people and years [src:AXP-RPT1-2026-09-17#p10]."
      source: AXP-RPT1-2026-09-17#p10
  # Munger inversion list: how a permanent loss could happen (from sections five and seven of the report and the "where am I most likely wrong" part of section twelve); each item ends with the tests that monitor it
  permanent_loss_paths:
    - "A credit cycle on top of a balance-sheet mistake: in a recession the industry charge-off rate goes back above its peak and reserves swing from releases to builds [src:AXP-RPT1-2026-09-17#p14], and buybacks stop first [src:AXP-RPT1-2026-09-17#p6]; in thirty-five years there have been four earnings drawdowns of 30% or more (on different bases, so only frequency and size matter) [src:AXP-RPT1-2026-09-17#p11], and if, as in 1991, credit mistakes, bleeding non-core businesses and collective action by merchants are exposed in the same recession, a cyclical drawdown becomes a permanent loss [src:AXP-RPT1-2026-09-17#p10] [src:AXP-RPT1-2026-09-17#p13]. Monitored by: AXP-Q7, AXP-Q11, AXP-Q12."
    - "The co-brand relationship breaks or gets expensive: Delta is about 13% of worldwide billed business and 21% of Card Member loans, and the current agreement expires at the end of 2029 [src:AXP-RPT1-2026-09-17#p8]. The comparable precedent is Costco: when Amex announced in February 2015 that it would not renew with Costco, Costco was about 8% of worldwide billed business and about 20% of worldwide loans [src:AXP-RPT1-2026-09-17#p8]; that year the Costco portfolio's loans-to-billings ratio was 2.5x against Delta's 1.6x, so the Delta portfolio actually depends less on interest [src:AXP-RPT1-2026-09-17#p8]. The report records that revenue then fell in both 2015 and 2016 and that the medium-term targets had to be reset in 2015, but the JetBlue co-brand was also lost in the same period, and the passage is marked as not checked item by item against the original [src:AXP-RPT1-2026-09-17#p9]. Monitored by: AXP-Q5, AXP-L6."
    - "The choice of card moves away from people: AI agents choose cards for users by total cost and do not allow a card to be locked in, so the \"choose me\" machinery of annual fees, points and benefits loses its audience [src:AXP-RPT1-2026-09-17#p4], the merchant-rate premium is arbitraged away on cost, and the 2018 anti-steering precedent constrains what merchants say and do to people, not the ranking parameters given to machines [src:AXP-RPT1-2026-09-17#p8]. Monitored by: AXP-L2."
    - "Membership unit economics deteriorate: the benefits race keeps the cost curve outrunning the fee curve, and the benefit cost of each extra dollar of annual fees has risen from 0.84x to 1.62x [src:AXP-RPT1-2026-09-17#p6]; the company does not disclose renewal rates, and if \"those who stay pay more\" actually hides \"fewer people are willing to pay\", the pricing power of the annual fee is an illusion [src:AXP-RPT1-2026-09-17#p16]. Monitored by: AXP-Q6, AXP-Q9, AXP-Q13."
    - "Regulatory repricing: a federal credit card interest rate cap hits net interest income, about 24% of revenue [src:AXP-RPT1-2026-09-17#p3] [src:AXP-RPT1-2026-09-17#p14], or the Credit Card Competition Act removes the three-party network exemption and state interchange legislation spreads [src:AXP-RPT1-2026-09-17#p14]. Monitored by: AXP-L3, AXP-L4."
    - "Trust damaged at the acquisition end: Amex describes service as the core of its moat, yet its most recent regulatory penalty was over sales practices, a settlement of about $230 million with the Department of Justice in January 2025 over deceptive marketing to small businesses in 2014–2017 [src:AXP-RPT1-2026-09-17#p9]; the report holds that its trust risk lies at the acquisition end rather than the servicing end, and lists this as one of the starting points of the bear case [src:AXP-RPT1-2026-09-17#p9]. Monitored by: AXP-L8."

