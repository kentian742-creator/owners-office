  management: 2026-09-17
  culture: 2026-09-17
  runway: 2026-09-17
  valuation: 2026-09-17
  bear_case: 2026-09-17
  monitoring: 2026-09-17
  thesis: 2026-09-17
  breakers: 2026-09-17
  munger: 2026-09-17

# Ratings from section one of the report; the separate "internal promotion and talent retention" dimension in the rating table is left blank by the report and not scored
ratings:
  business: A−
  management: A−
  capital_allocation: B
  culture: B+
  source: AXP-RPT1-2026-09-17#p3

thesis:
  summary: "American Express is a membership business that collects the annual fee as a subscription, uses merchant discount and interest to subsidize benefits, and uses the benefits to keep a high-spending customer base: of FY2025 total revenues net of interest expense of $72,229 million, discount revenue was 51.8% and net card fees 13.8% (this archive's computation) [src:AXP-10K-FY2025#p92]. The evidence of pricing power is that net card fees grew from $988 million in Q2 2019 to $2,862 million in Q2 2026 [src:AXP-10Q-FY2019Q2#p1] [src:AXP-10Q-FY2026Q2#p39], through pandemic shutdowns, zero rates, rate hikes and rate cuts. It is not a company living on free float but a spread lender with a subscription layer on top: its $157 billion of customer deposits at 2026-06-30 [src:AXP-10Q-FY2026Q2#p42] cost about $5.1 billion a year in interest (the first half of 2026 annualized, $2,563 million × 2) [src:AXP-10Q-FY2026Q2#p40], equal to 37.2% of FY2025 pretax income of $13,795 million (this archive's computation) [src:AXP-10K-FY2025#p92]. In the owner's report's reading, both times the company came close to the brink, around 1991 and in 2008, the cause was its own balance sheet [src:AXP-RPT1-2026-09-17#p10]. The 1991 episode is known only from secondary historical accounts; the 2008 one is on the record: in January 2009 the company sold $3.39 billion of preferred shares to the U.S. Treasury under the Capital Purchase Program [src:AXP-8K-2009-01-09]. The thesis fears two things most: agents choosing cards for users, so that \"people no longer choose\", and the loss of the Delta co-brand, whose agreement runs through the end of 2029 [src:AXP-10K-FY2025#p4], so that \"the customer base is not its own\" [src:AXP-RPT1-2026-09-17#p3] [src:AXP-RPT1-2026-09-17#p8]."
  pillars:
    - id: P1
      claim: "The annual-fee subscription is where the operating leverage is, and members' willingness to pay is getting stronger: in Q2 2026 the annualized average fee per card was $131, up from $117 a year earlier [src:AXP-8K-2026-07-24#EX-99.2], net card fees rose 15.4% year on year to $2,862 million (this archive's computation) [src:AXP-10Q-FY2026Q2#p39], and 75% of global new accounts (excluding Corporate) were acquired on fee-paying products [src:AXP-CALL-FY2026Q2#p9]. In 2027 this line still has to prove that fees can catch up with the benefit costs that followed the price increases [src:AXP-RPT1-2026-09-17#p6]."
      source: AXP-RPT1-2026-09-17#p7
    - id: P2
      claim: "The two subsidy lines, merchant rates and interest, will not be repriced off a cliff by bargaining power or regulation: the rate proxy (discount revenue ÷ billed business) went from 2.289% in FY2023 to 2.269% in FY2024 and 2.240% in FY2025, a fall of 2.0 and 2.9 basis points a year (this archive's computation) [src:AXP-10K-FY2025#p43] [src:AXP-10K-FY2025#p45], and in the owner's report's reading part of that comes from the rising co-brand share [src:AXP-RPT1-2026-09-17#p7]. The Supreme Court upheld Amex's anti-steering provisions in 2018 [src:SCOTUS-2018-06-25], and on 2026-06-01 a federal court permanently enjoined Illinois's interchange fee limits as to national banks and payment card networks [src:NDILL-2026-06-01]."
      source: AXP-RPT1-2026-09-17#p7
    - id: P3
      claim: "The customer base is largely its own: co-brand partner Delta (about 13% of worldwide billed business and about 21% of worldwide Card Member loans at 2025-12-31 [src:AXP-10K-FY2025#p4]) will renew and stay exclusive before the agreement expires at the end of 2029 [src:AXP-10K-FY2025#p4], and growth in co-brand remuneration will not persistently outrun Amex's own revenue [src:AXP-RPT1-2026-09-17#p8]."
      source: AXP-RPT1-2026-09-17#p8
    - id: P4
      claim: "The premise that people choose their payment instrument still holds: agentic commerce has not turned card choice into a default ranked by total cost [src:AXP-RPT1-2026-09-17#p8]. On 2026-04-14 Amex introduced its Agentic Commerce Experiences (ACE) developer kit and announced Amex Agent Purchase Protection for purchases made by registered agents, as a commitment for the future [src:AXP-WEB-2026-04-14-1] [src:AXP-10Q-FY2026Q1#p34]."
      source: AXP-RPT1-2026-09-17#p8
    - id: P5
      claim: "The customer base's credit advantage and the balance sheet can get through a credit cycle: in Q2 2026 Amex's net write-off rate (principal only, consumer and small business Card balances, as the company defines it) was 2.0% [src:AXP-10Q-FY2026Q2#p8], 1.92 percentage points below the 3.92% net charge-off rate on credit card loans at all commercial banks in the same quarter (not seasonally adjusted) [src:FRB-CHGOFF-2026-08-25]. The two rates are defined differently, so the gap is a proxy, and a June 2026 sale of written-off balances lowered June's U.S. Consumer write-off rate by about 0.3 points [src:AXP-8K-2026-09-15]. The cost of its collect-first, pay-later funding reprices with the market but is not out of control: in the first half of 2026 interest expense fell 2.8% and interest income rose 7.0% year on year (this archive's computation) [src:AXP-10Q-FY2026Q2#p40]."
      source: AXP-RPT1-2026-09-17#p11
    - id: P6
      claim: "Management quality and capital discipline continue: management passes both of the report's calculable tests [src:AXP-RPT1-2026-09-17#p10], and all four reportable operating segments (U.S. Consumer Services, Commercial Services, International Card Services, and Global Merchant and Network Services) were profitable in every year of 2023–2025 [src:AXP-10K-FY2025#p150] [src:AXP-10K-FY2025#p151]. Buybacks and common dividends came to 71.3% of net income available to common shareholders over FY2023–FY2025 ($20.8 billion against $29.16 billion, this archive's computation) [src:AXP-10K-FY2023#p64] [src:AXP-10K-FY2024#p66] [src:AXP-10K-FY2025#p63] [src:AXP-10K-FY2025#p146], and average diluted shares fell a net 5.4% from FY2023 to FY2025, from 736 million to 696 million [src:AXP-10K-FY2025#p43]. Capital allocation itself rates only B: buybacks are made near intrinsic value and neither clearly create nor destroy value [src:AXP-RPT1-2026-09-17#p3]. This is an organization run by insiders [src:AXP-RPT1-2026-09-17#p9], and the \"excellent management\" verdict is tied to specific people and years [src:AXP-RPT1-2026-09-17#p10]."
      source: AXP-RPT1-2026-09-17#p10
  # Munger inversion list: how a permanent loss could happen (from sections five and seven of the report and the "where am I most likely wrong" part of section twelve); each item ends with the tests that monitor it
  permanent_loss_paths:
    - "A credit cycle on top of a balance-sheet mistake: in a recession the industry charge-off rate goes back above its peak and reserves swing from releases to builds [src:AXP-RPT1-2026-09-17#p14], and buybacks stop first [src:AXP-RPT1-2026-09-17#p6]. Since 1989 reported net income has fallen by 30% or more five times: four times in credit cycles or recessions (the 1989–92 episode, which bottomed in 1990, and 2001, 2008–09 and 2020) and once, in 2017, because of a one-time $2.6 billion Tax Act charge [src:AXP-10K-FY1993#Ex13] [src:AXP-10K405-FY2001#Ex13] [src:AXP-10K-FY2009#Ex13] [src:AXP-10K-FY2017#Item7] [src:AXP-10K-FY2021#p92]. This path concerns the four. If, as around 1991, credit mistakes, bleeding non-core businesses and collective action by merchants are exposed in the same recession, a cyclical drawdown becomes a permanent loss [src:AXP-RPT1-2026-09-17#p10] [src:AXP-RPT1-2026-09-17#p13]. The Optima card losses and the merchant revolt of that episode rest on secondary historical accounts; the filings show the Lehman brokerage and investment-banking business, later reported as discontinued operations, losing $967 million after tax in 1990 and $149 million in 1992 [src:AXP-10K-FY1993#Ex11]. Monitored by: AXP-Q7, AXP-Q11, AXP-Q12."
    - "The co-brand relationship breaks or gets expensive: Delta was about 13% of worldwide billed business and about 21% of worldwide Card Member loans at 2025-12-31, and the current agreement runs through the end of 2029 [src:AXP-10K-FY2025#p4]. The comparable precedent is Costco: in February 2015 Amex announced that its U.S. co-brand and acceptance agreements with Costco would end in March 2016 [src:AXP-8K-2015-02-12#EX-99.1]. The Costco co-brand accounts had generated about 8% of worldwide billed business in 2014 and held about 20% of worldwide Card Member loans at 2014-12-31 [src:AXP-10K-FY2014#Ex13-p21]. Measured as share of loans over share of billed business, the Costco portfolio stood at 2.5 times (FY2014) against 1.6 times for Delta (2025-12-31), so the Delta portfolio depends less on interest (this archive's computation) [src:AXP-10K-FY2014#Ex13-p21] [src:AXP-10K-FY2025#p4]. Total revenues net of interest expense then fell in both 2015 and 2016 as reported, from $34,188 million in 2014 to $32,818 million and $32,119 million [src:AXP-10K-FY2016#Item6] (2016 was later restated under the new revenue standard and 2015 was not [src:AXP-10K-FY2019#p36]). Through 2015 the company kept its 12–15% EPS growth target and expected to be back within it in 2017 [src:AXP-8K-2015-10-21#EX-99.1], and on 2016-01-21 it replaced that with a 2017 target of EPS of at least $5.60 [src:AXP-8K-2016-01-21#EX-99.1]. The JetBlue co-brand was not renewed either [src:AXP-10K-FY2014#p73]. Monitored by: AXP-Q5, AXP-L6."
    - "The choice of card moves away from people: AI agents choose cards for users by total cost and do not allow a card to be locked in, so the \"choose me\" machinery of annual fees, points and benefits loses its audience [src:AXP-RPT1-2026-09-17#p4], and the merchant-rate premium is arbitraged away on cost. Amex's anti-steering provisions, contract terms the Supreme Court upheld in 2018, bar merchants from implying a preference for other cards, dissuading customers from using Amex cards, persuading them to use other cards, imposing special restrictions, conditions, disadvantages or fees on Amex cards, or promoting other cards more than Amex [src:SCOTUS-2018-06-25]. In the owner's report's reading they govern what merchants do toward people, not the ranking parameters that platforms give to machines [src:AXP-RPT1-2026-09-17#p8]. Monitored by: AXP-L2."
    - "Membership unit economics deteriorate: the benefits race keeps the cost curve outrunning the fee curve. Each extra dollar of net card fees came with $0.83 of extra Card Member services expense from FY2024 to FY2025 ($1,275 million against $1,544 million) [src:AXP-10K-FY2025#p45] [src:AXP-10K-FY2025#p47] and with $1.62 from the first half of 2025 to the first half of 2026 ($1,295 million against $801 million), both this archive's computation [src:AXP-10Q-FY2026Q2#p40]. The company does not disclose renewal rates, and if \"those who stay pay more\" actually hides \"fewer people are willing to pay\", the pricing power of the annual fee is an illusion [src:AXP-RPT1-2026-09-17#p16]. Monitored by: AXP-Q6, AXP-Q9, AXP-Q13."
    - "Regulatory repricing: a federal credit card interest rate cap hits net interest income, 24.0% of total revenues net of interest expense in FY2025 and 24.2% in the first half of 2026 (this archive's computation) [src:AXP-10K-FY2025#p45] [src:AXP-10Q-FY2026Q2#p40], or the Credit Card Competition Act removes the three-party network exemption and state interchange legislation spreads [src:AXP-RPT1-2026-09-17#p14]. Monitored by: AXP-L3, AXP-L4."
    - "Trust damaged at the acquisition end: Amex says its brand is built on trust, security and service [src:AXP-8K-2026-07-24#EX-99.1] [src:AXP-10K-FY2025#p4], and the owner's report reads service as the core of its moat [src:AXP-RPT1-2026-09-17#p9], yet its most recent regulatory penalty was over sales practices. In January 2025 it agreed to pay about $230 million in total, after crediting, to resolve Department of Justice investigations and, in principle, a Federal Reserve matter over sales practices toward small businesses [src:AXP-8K-2025-01-16#Item8.01]. The pieces were a non-prosecution agreement with the U.S. Attorney's Office for the Eastern District of New York ($77.7 million fine plus $60.7 million forfeiture), which covers only the Payroll Rewards and Premium Wire products sold in 2018–2021 [src:USAO-EDNY-2025-01-16], and a $108.7 million civil penalty over card marketing in 2014–2017, \"dummy\" employer identification numbers in 2015–2016 and the same wire products [src:DOJ-OPA-2025-01-16]; these gross amounts do not add up to the company's net total. The report holds that its trust risk lies at the acquisition end rather than the servicing end, and lists this as one of the starting points of the bear case [src:AXP-RPT1-2026-09-17#p9]. Dated note (2026-09-27): the Q2 2026 10-Q says Amex expects to be subject to an enforcement action over its anti-money-laundering programs, which could include civil money penalties [src:AXP-10Q-FY2026Q2#p29]; until such a penalty is imposed, the most recent one remains the sales-practice resolution. Monitored by: AXP-L8."

