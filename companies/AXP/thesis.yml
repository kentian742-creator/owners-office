    rule: {op: "<", threshold: 12, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: 2027-02
    note: "Replaces Q-returns (roic) in the stalwart template: for a card issuer, new debt funds new card balances and goes with the expansion of assets [src:AXP-10K-FY2025#p64], so counting interest-bearing debt as \"invested capital\" makes no sense, and return on equity is used instead. The threshold is borrowed from the template's default for return on invested capital and does not mean the same thing; the report gives no ROE reading, and the baseline is to be backfilled from the FY2025 annual report. After backfilling and before the FY2026 annual report is published, review whether this threshold suits return on equity, and write the conclusion and date into this note so that it stays registered in advance (see todo)."

