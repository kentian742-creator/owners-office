  - id: AXP-Q4
    type: quantitative
    claim: Profit turns into money actually paid out to shareholders
    origin: manual
    severity: watch
    covers: [capital_allocation, free_cash_flow]
    pillar: P6
    metric_def:
      id: capital_return_to_common_ni_3y
      description: Rolling three years of (common stock buybacks + common dividends) ÷ net income attributable to common shareholders
      unit: "%"
      frequency: year
      data: xbrl
      xbrl: [us-gaap:PaymentsForRepurchaseOfCommonStock, us-gaap:PaymentsOfDividendsCommonStock, us-gaap:NetIncomeLossAvailableToCommonStockholdersBasic]
      formula: sum_3y(buybacks + common_dividends) / sum_3y(net_income_to_common)
    fail_if: Below 70% for 2 consecutive years
    rule: {op: "<", threshold: 70, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: 2027-02
    baseline:
      value: 71.3
      unit: "%"
      period: FY2023–FY2025
      as_of: 2025-12-31
      source: AXP-10K-FY2025#p63
      note: "This archive's computation: buybacks plus common dividends of $5.3 billion (2023), $7.9 billion (2024) and $7.6 billion (2025), $20.8 billion in all [src:AXP-10K-FY2023#p64] [src:AXP-10K-FY2024#p66] [src:AXP-10K-FY2025#p63], against net income available to common shareholders of $8,316 million, $10,071 million and $10,775 million, $29,162 million in all [src:AXP-10K-FY2025#p146]. The company discloses no three-year ratio, and its annual ratios use two different bases: about 62% (2023) and 76% (2024) of \"total capital generated\", and about 71% (2025) of net income available to common shareholders [src:AXP-10K-FY2023#p64] [src:AXP-10K-FY2024#p66] [src:AXP-10K-FY2025#p63]."
    note: "Replaces Q-fcf (fcf_conversion) in the stalwart template: this is a bank holding company bound by capital requirements, so how much it can return is set by regulatory capital [src:AXP-10K-FY2025#Item1], and once the credit cycle turns and provisions swing from net releases to net builds, buybacks stop first [src:AXP-RPT1-2026-09-17#p6]. \"Operating cash flow less capital expenditure\" moves with card balances and other liabilities and does not represent money that can be paid out to shareholders, so the test uses the share of net income available to common shareholders returned through buybacks and common dividends over three fiscal years instead. It mainly tests capital allocation: it measures the payout share, not whether distributable earnings are growing, which AXP-Q15 tracks. The threshold is the default of the template's Q-fcf, borrowed for a different quantity and written down in advance; it was not derived from any payout reading. Against the FY2023–FY2025 baseline of 71.3% it leaves a buffer of about one percentage point (this archive's computation) [src:AXP-10K-FY2025#p63], so a fail when buybacks pause in a credit downturn is expected and has to be read together with AXP-Q7 and AXP-Q12. On the cash-flow lines the XBRL metric reads (repurchases of common shares \"and other\", and dividends paid including preferred), the same three years give 73.8% ($21,534 million against $29,162 million, this archive's computation) [src:AXP-10K-FY2025#p95] [src:AXP-10K-FY2025#p146]; the basis is to be settled before the first reading (see todo)."

  - id: AXP-L1
    type: qualitative
    claim: Management has not cut its published financial targets
    origin: template:stalwart
    severity: watch
    covers: [management]
    pillar: P6
    question: In this period's filings, did management cut or withdraw previously published financial targets (full-year revenue and EPS guidance, and any medium-term targets; current targets are recorded item by item in ledger.yml)?
    fail_if: Yes, without giving new, testable targets at the same time
    judge: independent_model
    evidence: required
    where: Earnings 8-K Exhibit 99.1 press release, call materials, the MD&A of the 10-Q and 10-K
    lookback: 4
    judge_notes:
      - When judging a "cut", use the most recently published figures in the say-do ledger (AXP-M-2026-01, AXP-M-2026-02).
      - "Full-year EPS guidance is a range: it counts as a \"cut\" only if a full-year EPS range the company gives later (8-K, 10-Q or earnings call) has a midpoint below the midpoint of the most recently published range; narrowing the range around the same midpoint, or raising it, is not a cut."
    effective_from: FY2026Q3
    first_readable: 2026-10
    baseline:
      value: In July 2026, full-year revenue growth guidance raised to 10% (from 9% to 10%) and EPS guidance of $17.30 to $17.90 kept unchanged; management plans to reinvest the outperformance in growth initiatives
      as_of: 2026-09-17
      source: AXP-8K-2026-07-24#EX-99.1
      note: "The EPS range was first given on 2026-01-30 [src:AXP-8K-2026-01-30#EX-99.1] and reaffirmed on 2026-04-23 [src:AXP-8K-2026-04-23#EX-99.1]; its midpoint is $17.60 [src:AXP-8K-2026-07-24#EX-99.1]. That the excess revenue goes back into technology and benefits is the owner's report's account of the Q2 2026 call [src:AXP-RPT1-2026-09-17#p3]; the release says only \"growth initiatives\" [src:AXP-8K-2026-07-24#EX-99.1], and the call slides do not say where the money goes [src:AXP-CALL-FY2026Q2#p2]."
    note: "Corresponds to L-guidance in the stalwart template. The report records no current medium-term financial targets for Amex, only the full-year 2026 guidance [src:AXP-RPT1-2026-09-17#p9]: revenue growth raised to 10% and EPS guidance of $17.30 to $17.90, midpoint $17.60, unchanged [src:AXP-8K-2026-07-24#EX-99.1]. So the question also covers the full-year guidance, and both items are recorded in the say-do ledger (AXP-M-2026-01, AXP-M-2026-02). The rule of judging a \"cut\" in the EPS range by its midpoint (see judge_notes) and the 10-Q MD&A added to where were both written out during the migration to spec 0.2, before the first judgment under this test (FY2026Q3)."

  - id: AXP-L7
    type: qualitative
