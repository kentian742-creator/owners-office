  # ---------- Section ten of the report: quarterly watch indicators ----------
  - id: AXP-Q9
    type: quantitative
    claim: "Membership unit economics are improving: while renewals roll onto the new prices, the increase in net card fees is catching up with the increase in Card Member services expense"
    origin: report:watch
    severity: watch
    covers: [unit_economics, pricing_power]
    pillar: P1
    metric_def:
      id: net_card_fee_to_cm_services_increment
      description: Year-on-year increase in net card fees ÷ year-on-year increase in Card Member services expense
      unit: x
      frequency: quarter
      data: filing_text
      where: The Net card fees and Card Member services lines of the statistical tables in earnings 8-K Exhibit 99.2 or of the 10-Q consolidated income statement
      formula: (net_card_fees_t - net_card_fees_{t-4q}) / (cm_services_t - cm_services_{t-4q})
      components:
        qoq_change:
          description: Quarter-on-quarter change in the ratio above (this quarter's ratio minus last quarter's), i.e. net_card_fee_to_cm_services_increment_t - net_card_fee_to_cm_services_increment_{t-1q}
          unit: x
    fail_if: The ratio falls quarter on quarter for two consecutive quarters (while renewals roll onto the new prices, the ratio should recover quarter by quarter if the pricing mismatch is being absorbed)
    rule: {metric: net_card_fee_to_cm_services_increment.qoq_change, op: "<", threshold: 0, unit: x, consecutive: 2, period: quarter, note: "Compared with the previous quarter's ratio, not the same quarter a year earlier, because the year-earlier quarters mostly predate the price increases; a quarter in which the increase in Card Member services expense is not positive counts as a pass."}
    warn_if: The ratio below 1.0×, i.e. each extra dollar of annual fees costs more than a dollar in benefits (this warning is expected before the price-increase cycle is complete and is not a signal on its own)
    warn_rule: {op: "<", threshold: 1.0, unit: x, consecutive: 1, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-10
    baseline:
      value: 0.62
      unit: x
      period: 1H26
      as_of: 2026-06-30
      source: AXP-10Q-FY2026Q2#p40
      note: "From the first half of 2025 to the first half of 2026 net card fees rose $801 million and Card Member services expense $1,295 million [src:AXP-10Q-FY2026Q2#p40]. On growth rates the ratio is 16.6% ÷ 49.3% = 0.34× (this archive's computation, or 17% ÷ 49% ≈ 0.35× on the company's rounding) [src:AXP-10Q-FY2026Q2#p40]. Q2 2026 alone, the starting point of the first quarter-on-quarter comparison: +$382 million against +$648 million, 0.59× (this archive's computation) [src:AXP-10Q-FY2026Q2#p39]."
    note: "Watch indicator #1 in section ten of the report gives only a reading, no threshold [src:AXP-RPT1-2026-09-17#p15]; the criteria were written by this archive before the first reading. The report holds that a pricing mismatch cannot be told apart from structural deterioration before Q2 2027: the costs come first [src:AXP-RPT1-2026-09-17#p10], and existing U.S. Consumer Platinum Card Members (accounts opened before 2025-09-18) pay the new $895 fee from their first renewal on or after 2026-01-02, U.S. Business Platinum Card Members from their first renewal on or after 2025-12-02 [src:AXP-WEB-2025-09-18-1]. If the mismatch is being absorbed, the ratio should recover quarter by quarter while renewals roll over, so failure looks at quarter-on-quarter declines in two consecutive quarters. The warning line is set where the two increases are equal (a ratio of one), the dividing line of section three's \"how much more is spent on benefits for each extra dollar of annual fees\", which was $0.83 from FY2024 to FY2025 ($1,275 million ÷ $1,544 million) and $1.62 from the first half of 2025 to the first half of 2026 ($1,295 million ÷ $801 million), both this archive's computation [src:AXP-10K-FY2025#p45] [src:AXP-10K-FY2025#p47] [src:AXP-10Q-FY2026Q2#p40]. The case in which the report says the bear case weakens is net card fee growth of 10% or more with Card Member services expense growth below 15% [src:AXP-RPT1-2026-09-17#p10]; since the net card fee base is larger than Card Member services expense ($5,614 million against $3,924 million in the first half of 2026) [src:AXP-10Q-FY2026Q2#p40], the ratio can still be below one in that case, so a ratio below one only records a warning, and the one-off judgment is left to AXP-Q6."

  - id: AXP-Q10
    type: quantitative
    claim: "The liability side is not under strain: the cost of collect-first, pay-later funding reprices with the market but does not persistently outpace asset-side yields"
    origin: report:watch
    severity: watch
    covers: [balance_sheet, unit_economics]
    pillar: P5
    metric: interest_expense_minus_income_growth
    fail_if: Interest expense growth persistently above interest income growth (counted as two consecutive quarters)
    rule: {op: ">", threshold: 0, unit: pp, consecutive: 2, period: quarter}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: 2026-10
    baseline:
      value: -11.2
      unit: pp
      period: 2026Q2
      as_of: 2026-06-30
      source: AXP-10Q-FY2026Q2#p39
      note: "The metric is quarterly, so the baseline is the Q2 2026 quarter: interest expense −5.7% ($1,958 million against $2,077 million) and interest income +5.5% ($6,607 million against $6,264 million), this archive's computation [src:AXP-10Q-FY2026Q2#p39]. For the first half of 2026 the difference is −9.8 percentage points (−2.8% and +7.0%, or −10 on the company's rounding of −3% and +7%) [src:AXP-10Q-FY2026Q2#p40]. The first reading under the test comes with the Q3 2026 results in October 2026."
    note: "Watch indicator #2 in section ten of the report: both lines rising together is normal repricing, and interest expense turning to growth is not an alarm on its own; only expense growth persistently above income growth shows strain on the liability side [src:AXP-RPT1-2026-09-17#p15]. The report gives no number of periods for \"persistently\"; this test counts two consecutive quarters, the lower end of watch indicator #5's \"two to three consecutive quarters make a trend\"."

  - id: AXP-Q11
    type: quantitative
    claim: The credit advantage of Amex's customer base over the industry has not been eroded
    origin: report:watch
    severity: watch
    covers: [moat, balance_sheet]
    pillar: P5
    metric_def:
      id: nco_spread_industry_minus_axp
      description: Industry card net charge-off rate (not seasonally adjusted) minus Amex's net write-off rate, principal only, consumer and small business Card balances (the company's definition; the report's "main net write-off rate" was checked against the Q2 2026 filings and is this rate, see the baseline)
      unit: pp
      frequency: quarter
      data: mixed
      where: "Industry side: FRED series CORCCACBN (source tag FRED-CORCCACBN), a copy of the Federal Reserve Board's charge-off release; Amex side: \"Net write-off rate (principal only) — consumer and small business\" in earnings 8-K Exhibit 99.2"
      formula: industry_card_nco_rate - net_write_off_rate
      components:
        industry_card_nco_rate:
          description: Industry card net charge-off rate (credit card loans at commercial banks, not seasonally adjusted, quarterly)
          unit: "%"
          where: FRED series CORCCACBN (source tag FRED-CORCCACBN), a copy of the Federal Reserve Board's charge-off release [src:FRB-CHGOFF-2026-08-25], updated about two months after quarter end [src:FRB-CHGOFF-2026-08-25]
        nco_spread_yoy_change:
          description: Change in the spread above against the same quarter a year earlier, i.e. nco_spread_industry_minus_axp_t - nco_spread_industry_minus_axp_{t-4q}; negative means the spread is narrowing
          unit: pp
    fail_if: The spread between the industry's and Amex's net write-off rates narrows year on year for two consecutive quarters
    rule: {metric: nco_spread_industry_minus_axp.nco_spread_yoy_change, op: "<", threshold: 0, unit: pp, consecutive: 2, period: quarter, note: "Compared only with the same quarter a year earlier, because the industry series is not seasonally adjusted."}
    data: mixed
    effective_from: FY2026Q3
    first_readable: 2026-11
    baseline:
      value: 1.92
      unit: pp
      period: 2026Q2
      as_of: 2026-06-30
      source: AXP-8K-2026-07-24#EX-99.2
      note: "Industry 3.92% in Q2 2026 (annualized, net of recoveries, not seasonally adjusted) [src:FRB-CHGOFF-2026-08-25] against Amex's 2.0% in the same quarter (principal only, consumer and small business Card balances, as the company defines it) [src:AXP-8K-2026-07-24#EX-99.2]. The two series are defined differently (Amex's covers pay-in-full charge balances and excludes corporate cards, while the industry series covers credit card loans only), so the spread is a proxy. A June 2026 sale of previously written-off Card balances lowered June's U.S. Consumer net write-off rate by about 0.3 points, and the quarterly 2.0% includes those proceeds [src:AXP-8K-2026-09-15]."
    note: "Watch indicator #3 in section ten of the report: a narrowing of this spread shows the erosion of the customer advantage earlier than a rise in Amex's own write-off rate [src:AXP-RPT1-2026-09-17#p15]. The report gives neither the size nor the number of periods of narrowing; this test counts two consecutive quarters of year-on-year narrowing. The industry series is updated about two months after quarter end, so first_readable is later than Amex's earnings release."

  - id: AXP-Q12
    type: quantitative
    claim: "The cycle's share of current earnings has not reversed: reserves have not swung from releases to builds while the reserve rate rises"
    origin: report:watch
    severity: watch
    covers: [balance_sheet]
    pillar: P5
    metric: reserve_build_release
    metric_def:
      description: Net build (positive) or net release (negative) of the reserve for credit losses, i.e. provisions for credit losses less net write-offs; judged together with the year-on-year change in the reserve rate on card loans in the same quarter
      unit: USD
      frequency: quarter
      data: filing_text
      where: The breakdown of provisions (net write-offs and reserve build/release), the reserve for credit losses and card loans in the statistical tables of earnings 8-K Exhibit 99.2
      components:
        reserve_rate_yoy_change:
          description: Change in the reserve rate for credit losses on card loans (the reserve as a share of card loans, as disclosed in the company's earnings statistics) against the same quarter a year earlier, i.e. reserve_rate_t - reserve_rate_{t-4q}
          unit: pp
          where: The reserve for credit losses and card loans in the statistical tables of earnings 8-K Exhibit 99.2
    fail_if: In the same quarter, reserves are a net build (quarterly net build positive) and the reserve rate is up year on year
    rule:
      all_of:
        - {metric: reserve_build_release, op: ">", threshold: 0, unit: USD}
        - {metric: reserve_build_release.reserve_rate_yoy_change, op: ">", threshold: 0, unit: pp}
      consecutive: 1
      period: quarter
      note: Both must hold in the same quarter.
    warn_if: Quarterly net build positive, but the reserve rate not up year on year
    warn_rule: {op: ">", threshold: 0, unit: USD, consecutive: 1, period: quarter}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-10
    baseline:
      value: -191000000
      unit: USD
      period: 2026Q2
      as_of: 2026-06-30
      source: AXP-10Q-FY2026Q2#p5
      note: "A negative value is a net release: Q2 2026 provisions of $1,084 million less net write-offs of $1,275 million [src:AXP-10Q-FY2026Q2#p5]. The reserve rate (reserve as a % of Card balances, the company's definition since Q1 2026, with prior periods reclassified) was 2.7% at 2026-06-30, down from 3.0% at 2025-06-30 [src:AXP-10Q-FY2026Q2#p8], the lowest quarter-end reading since 2023-06-30, when it was 2.66% on the same combined basis (this archive's computation) [src:AXP-8K-2024-07-19#EX-99.2]. It is not comparable with the earlier \"reserve as a % of Card Member loans\" (4.1% at 2024-06-30) [src:AXP-8K-2024-07-19#EX-99.2]."
    note: "Watch indicator #4 in section ten of the report looks at \"the reserve rate and the net direction of provisions\": current earnings include the cycle's share, and a swing from releases to builds is the first signal on the credit path [src:AXP-RPT1-2026-09-17#p15]. Card balances are growing (8.0% higher at 2026-06-30 than a year earlier [src:AXP-10Q-FY2026Q2#p8]), and with an unchanged reserve rate the reserve must grow with balances, so a positive net build on its own would misread growth as deterioration; failure therefore also requires the reserve rate to be up year on year, and a net build alone records only a warning. The report gives no threshold for this indicator; this is a criterion this archive wrote down before the first reading. Net builds in two consecutive quarters with the industry charge-off rate back at or above its peak trigger breaker AXP-Q7. Since Q1 2026 the company discloses the reserve rate as a share of Card balances and restates the prior periods on that basis, so the year-on-year leg compares like with like."

  - id: AXP-Q13
    type: quantitative
    claim: The price increases are not costing more and more at the acquisition end
    origin: report:watch
    severity: watch
    covers: [unit_economics, growth]
    pillar: P1
    metric_def:
      id: proprietary_new_cards_yoy
      description: Proprietary new cards acquired, year on year
      unit: "%"
      frequency: quarter
      data: filing_text
      where: New card statistics in the earnings 8-K Exhibit 99.1 press release or the Exhibit 99.2 statistical tables
      formula: new_cards_t / new_cards_{t-4q} - 1
      components:
        marketing_expense_yoy:
          description: Marketing expense (Marketing) year on year, i.e. marketing_t / marketing_{t-4q} - 1
          unit: "%"
          where: The Marketing line of the statistical tables in earnings 8-K Exhibit 99.2 or of the 10-Q consolidated income statement
    fail_if: Proprietary new cards down year on year while marketing expense is up year on year in the same quarter, for 3 consecutive quarters
    rule:
      all_of:
        - {metric: proprietary_new_cards_yoy, op: "<", threshold: 0, unit: "%"}
        - {metric: proprietary_new_cards_yoy.marketing_expense_yoy, op: ">", threshold: 0, unit: "%"}
      consecutive: 3
      period: quarter
      note: Both must hold in the same quarter, for three consecutive quarters.
    warn_if: The same combination for 2 consecutive quarters
    warn_rule:
      all_of:
        - {metric: proprietary_new_cards_yoy, op: "<", threshold: 0, unit: "%"}
        - {metric: proprietary_new_cards_yoy.marketing_expense_yoy, op: ">", threshold: 0, unit: "%"}
      consecutive: 2
      period: quarter
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2026-10
    baseline:
      value: [-3.2, 6.1]
      unit: "%"
      period: 2026Q2
      as_of: 2026-06-30
      source: AXP-8K-2026-07-24#EX-99.2
      note: "In order: proprietary new cards acquired, year on year (3.0 million against 3.1 million, a line for which the company prints no growth rate) [src:AXP-8K-2026-07-24#EX-99.2], and marketing expense, year on year ($1,650 million against $1,555 million, which the company rounds to 6%) [src:AXP-10Q-FY2026Q2#p39], both this archive's computation from the printed figures. In the first half of 2026: new cards −4.7% (6.1 million against 6.4 million) [src:AXP-8K-2026-07-24#EX-99.2] and marketing +2.9% ($3,130 million against $3,041 million, which the company rounds to 3%) [src:AXP-10Q-FY2026Q2#p40]."
    note: "Watch indicator #5 in section ten of the report: the cost of the price increases at the acquisition end, where two to three consecutive quarters in the same direction make a trend [src:AXP-RPT1-2026-09-17#p15]; accordingly two consecutive quarters record a warning and three consecutive quarters a failure. Q2 2026 is the first clean quarter after the price increases; the direction is unfavorable, but one quarter is not a trend [src:AXP-RPT1-2026-09-17#p7]; the single-quarter reading for Q1 2026 is still to be backfilled, to settle from which quarter the consecutive count starts."

  - id: AXP-Q14
    type: quantitative
    claim: Operating earnings growth excluding reserve releases keeps up with the first-year growth assumption of the report's base case
    origin: report:watch
    severity: watch
    covers: [growth, unit_economics]
    pillar: P1
    metric_def:
      id: pre_provision_pretax_income_yoy
      description: Year-on-year growth in pre-provision pretax income (pretax income plus provisions for credit losses)
      unit: "%"
      frequency: quarter
      data: xbrl
      xbrl: [us-gaap:IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest, us-gaap:ProvisionForLoanLeaseAndOtherLosses, us-gaap:ProvisionForLoanAndLeaseLosses]
      formula: (pretax_income + provisions)_t / (pretax_income + provisions)_{t-4q} - 1
    fail_if: Pre-provision pretax income growth in the first half of 2027 still below 8.5% year on year (not converged with the first-year growth assumption)
    rule: {op: "<", threshold: 8.5, unit: "%", consecutive: 1, period: half, evaluate_on: [FY2027Q2], note: "Judged once, only for the evaluate_on period (the first half of 2027, ending FY2027Q2); other periods only record the reading."}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: 2027-07
    baseline:
      value: 7.9
      unit: "%"
      period: 1H26
      as_of: 2026-06-30
      source: AXP-10Q-FY2026Q2#p40
      note: "Pretax income plus provisions of $10,185 million against $9,435 million in the first half (this archive's computation) [src:AXP-10Q-FY2026Q2#p40]. Q2 2026 alone: +4.0% ($5,155 million against $4,955 million), against +14.7% for pretax income on the reported basis, which includes a reserve release [src:AXP-10Q-FY2026Q2#p39]."
    note: "Watch indicator #6 in section ten of the report: the first-year growth assumption of the report's base case is 8.5%, while operating growth excluding provisions was only 4.0% in Q2 2026 and 7.9% in the first half of 2026 (this archive's computation) [src:AXP-10Q-FY2026Q2#p39] [src:AXP-10Q-FY2026Q2#p40]; either the gap closes in the first half of 2027 or the first-year assumption has to be re-estimated [src:AXP-RPT1-2026-09-17#p15]. \"Converged\" is judged as first-half 2027 growth year on year not below that assumption; the assumption belongs to the first year only, so this test is judged only once (rule.evaluate_on) and then retired, or registered again with the next year's assumption; quarterly readings are recorded as usual."

  # ---------- Watch tests added by this archive (not in section ten of the report; added after the audit) ----------
  - id: AXP-Q15
    type: quantitative
    claim: Distributable earnings per share are growing, not just being paid out at a high rate
    origin: manual
    severity: watch
    covers: [free_cash_flow, growth]
    pillar: P6
    metric_def:
      id: diluted_eps_yoy
      description: Diluted earnings per share (attributable to common shareholders), year on year
      unit: "%"
      frequency: year
      data: xbrl
      xbrl: [us-gaap:EarningsPerShareDiluted]
      formula: eps_diluted_t / eps_diluted_{t-1y} - 1
    fail_if: Down year on year for 2 consecutive years
    rule: {op: "<", threshold: 0, unit: "%", consecutive: 2, period: year}
    data: xbrl
    effective_from: FY2026Q3
    first_readable: 2027-02
    note: "The touchstone in constitution rule 2 is growing free cash flow. For a bank holding company bound by capital requirements, operating cash flow less capital expenditure does not represent money that can be distributed (see AXP-Q4), so growth in diluted EPS stands in here for growth in distributable earnings per share; it complements the payout share in AXP-Q4: if the payout share holds while earnings fall for two consecutive years, the touchstone is weakening all the same. The threshold keeps the templates' usual two-year window and is a standard this archive wrote down in advance. In credit recessions Amex's diluted EPS has fallen by about half: from $3.34 in 2007 to $1.54 in 2009, −53.9% [src:AXP-10K-FY2009#Ex13], and from $7.99 in 2019 to $3.77 in 2020, −52.8% [src:AXP-10K-FY2021#p92], both this archive's computation; a one-year decline is not a signal on its own. The report does not give FY2025 EPS, and the baseline is to be backfilled; the company's 2026 EPS guidance is a range, and the report uses the midpoint $17.60 of the guidance range $17.30–$17.90 [src:AXP-8K-2026-07-24#EX-99.1] [src:AXP-RPT1-2026-09-17#p12]."

  - id: AXP-Q16
    type: quantitative
    claim: "The reinvestment runway is paying off: the International Card Services margin is not drifting ever further from that of U.S. Consumer Services"
    origin: manual
    severity: watch
    covers: [growth]
    metric: segment_operating_margin
    params:
      segment: International Card Services
      basis: Segment pretax income ÷ segment total revenues net of interest expense (the company's segment basis)
    fail_if: The International Card Services pretax margin down year on year for 2 consecutive years
    rule: {op: decrease, threshold: 0, unit: pp, consecutive: 2, period: year, note: "Compared with the previous year's annual margin."}
    data: filing_text
    effective_from: FY2026Q3
    first_readable: 2027-02
    baseline:
      value: 13.2
      unit: "%"
      period: 2026Q2
      as_of: 2026-06-30
      source: AXP-8K-2026-07-24#EX-99.2
      note: "Q2 2026 pretax segment income of $477 million over total revenues net of interest expense of $3,619 million, against 21.7% for U.S. Consumer Services ($2,065 million over $9,524 million), both this archive's computation [src:AXP-8K-2026-07-24#EX-99.2]. This is a single-quarter reading; the annual baseline is to be backfilled from the segment note of the annual report."
    note: "Section three of the report asks for the reinvestment runway to be written out separately: International Card Services is the only runway with room for both growth and margin, and if its margin moved toward that of U.S. Consumer Services, the same revenue would yield nearly twice the pretax income [src:AXP-RPT1-2026-09-17#p6]. The report does not list it in section ten and gives no threshold; this is a watch test added by this archive, and \"down in two consecutive years\" is a standard written down in advance, meaning the runway is heading the wrong way. It does not correspond to any of the four load-bearing mechanisms, so it has no pillar."

  - id: AXP-L8
    type: qualitative
    claim: No new sales-practice violations at the acquisition end; trust is not being used up on the sales side
    origin: manual
    severity: watch
    covers: [culture, governance]
    pillar: P6
    question: Do this period's filings disclose a new regulatory penalty, settlement or consent order concerning Amex's sales or marketing practices (account opening, customer acquisition, marketing and disclosure)?
    fail_if: "Yes"
    judge: independent_model
    evidence: required
    where: The legal proceedings and contingencies notes of the 10-K/10-Q, 8-Ks, and announcements by the relevant regulators (the Department of Justice, the Consumer Financial Protection Bureau, the Office of the Comptroller of the Currency, and others)
    lookback: 4
    effective_from: FY2026Q3
    first_readable: 2026-10
    baseline:
      value: "The most recent was the January 2025 resolution of Department of Justice investigations and, in principle, a Federal Reserve matter over sales practices toward U.S. small businesses in 2014–2021, for about $230 million in total after crediting (the company's figure) [src:AXP-8K-2025-01-16#Item8.01]. Its parts were a non-prosecution agreement with the U.S. Attorney's Office for the Eastern District of New York, $138.4 million ($77.7 million criminal fine plus $60.7 million forfeiture), covering only the Payroll Rewards and Premium Wire wire products sold in 2018–2021 [src:USAO-EDNY-2025-01-16], and a $108.7 million civil penalty over deceptive card marketing and falsified applicant income in 2014–2017, \"dummy\" employer identification numbers in 2015 and the first half of 2016, and the same wire products [src:DOJ-OPA-2025-01-16]; these gross amounts do not add up to the company's net total. The company says it ended the practices in 2021 or earlier, so time since the last sales-conduct episode is counted from 2021 [src:AXP-8K-2025-01-16#Item8.01]. Earlier: in 1989 Amex publicly apologized to Edmond Safra for its efforts to injure his reputation and announced an $8 million donation to charities of his choosing [src:SDNY-1993-12-22], and in 2012 the Consumer Financial Protection Bureau ordered three Amex subsidiaries to refund an estimated $85 million to customers [src:CFPB-2012-10-01]"
      as_of: 2026-09-17
      source: AXP-8K-2025-01-16#Item8.01
    note: "Section five of the report: culture at the servicing end and conduct at the sales end are not the same thing; Amex's trust risk lies at the acquisition end, which is also one of the starting points of the bear case [src:AXP-RPT1-2026-09-17#p9]; culture is rated B+ precisely because the sales side has a record pointing the other way [src:AXP-RPT1-2026-09-17#p3]. Section ten of the report does not list this as a breaker; it is handled here as a watch test added by this archive. The Q2 2026 10-Q says Amex expects an enforcement action over its anti-money-laundering programs, which could include civil money penalties [src:AXP-10Q-FY2026Q2#p29]; that matter is not about sales or marketing practices, so on its own it would not decide this question, and the quarterly update watches it."

