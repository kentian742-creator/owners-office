# Three decision levels, trust levels and the release gate
# schema: thesis-ci/spec/schemas/decision-rights.schema.json (spec 0.2)
# Basis: constitution/owner.md (R1–R14, H1–H5); §G of series rules 00 (private repository, cited by number);
#        DESIGN.md: decentralized governance, the pipeline for one earnings event, and the defaults in the start instructions.
# Which changes are amendments: see owner.md, "Amendment procedure". memo, portfolio and ranking.rule directly express
# owner clauses, and levels and trust set each role's own authority; changing any of them is decision level L3. The rest
# are operating parameters: changes are recorded in docs/decisions/ and reported in the letter to the owner.
# Note: the decision levels L1/L2/L3 here are not the same thing as the evidence grades L1 and L2 (00 §G1).

levels:
  L1:  # Autonomous: each role decides and acts on its own, without disturbing the owner
    who: each role decides and acts on its own
    actions:
      - fetch                    # fetching (the pipeline's deterministic code)
      - parse                    # parsing and extraction: XBRL, fact extraction 16A, metric extraction 16B
      - draft                    # drafting: archives, reports, updates, question lists, divergence maps, letters, memo drafts, typesetting
      - test                     # tests: quantitative tests computed by the pipeline; qualitative tests by the judge 14T; the settler 15B settles against criteria written in advance
      - audit                    # audits: the parts of 04, 09 and 12
      - blind_read               # blind read 14A
      - routine_merge            # routine merges, routed by trust.routing
      - fact_revision            # archive fact revisions
      - signpost_check           # industry signpost checks
    report: summarized in the monthly letter
  L2:  # Act and report: after acting, one line each in the monthly letter
    who: each role decides and acts, and reports afterwards
    actions:
      - prereg_content           # pre-registration content (15A)
      - scenario_probability     # scenario probability adjustments (08)
      - test_warning_disposition # dispositions of test warnings and watch failures (03)
      - candidate_rotation       # candidate list rotation (17C)
      - model_selection          # the model each role uses (HQ)
      - valuation_update         # a recalculated valuation takes effect: the proposed version is approved by the model review 04C
      - prompt_change            # process and format changes to 00 §F, §G and to the non-owner clauses of the prompts
      - publish                  # publishing, only with a clean audit; routed by trust.routing
    report: one line each in the monthly letter
  L3:  # The owner (chairman) decides: money matters and amendments to the constitution are at this level only
    who: owner (chairman)
    actions: [buy, add, trim, sell, amend_constitution]
    report: a one-page memo with the default option "maintain the status quo"; no reply within 14 days means the default applies

trust:
  # Roles managed by trust level: those with trust_managed: true in agents/*.yml (company manager, industry researcher).
  # Levels are computed and written only by the pipeline (00 §G8): recorded in trust/levels.yml, and copied into
  # trust_level in each company's thesis.yml for company managers and into trust_level in industry.yml for industry
  # researchers; the two places must agree (C-TRUST-WRITE).
  levels:
    "0": autonomy suspended
    "1": item-by-item review (where a new role starts)
    "2": review before publishing
    "3": full autonomy
  initial: 1                                              # a new role starts at level 1
  window: 8                                               # looks at the last 8 scored outputs
  downgrade: {"on": factual_error, by: 1}                 # one factual error (fact_error in 00 §F3) lowers the level by one; "on" is quoted, or YAML 1.1 reads it as a boolean
  upgrade: {after_consecutive_clean_updates: 4, by: 1}    # 4 consecutive updates with zero factual errors raise the level by one
  routing:                                                # 00 §G9, 17A; pre-registrations are exempt and only need to pass the format and timing checks
    "3": merged and published automatically once all checks pass
    "2": merged automatically; HQ reviews before publishing
    "1": held in the private repository; published after HQ reviews each item
    "0": autonomy suspended; goes into the letter under "for your attention"
  scoring:
    factual_error: down one level                              # includes factual errors found by HQ's monthly random re-audit (17D)
    adverse_divergence_ruling: no upgrade within the window    # the divergence map (14B) rules that the company manager's side misread
    counted_outputs: quarterly updates, archive builds and rebuilds, research reports

memo:
  default_option: maintain       # the default option for money matters is always to maintain the status quo (design principle 3)
  timeout_days: 14               # no reply within 14 days means the default applies
  monthly_target_max: 2          # if exceeded, memos are not held back: HQ explains why in the letter and raises the escalation threshold
  sell_reasons:                  # R6; must match the sell_reason enum of memo.schema.json
    - moat_permanent_impairment    # a permanently damaged moat
    - business_model_change        # a fundamentally changed business model
    - management_deterioration     # declining management quality
    - capital_allocation_failure   # seriously bad capital allocation
    - better_opportunity           # a clearly better long-term opportunity: a cross-company judgment, raised only by HQ (00 §G3)
  forbidden_sell_reasons:        # R6: never sell for these
    - price_decline                # price declines
    - recession                    # a recession
    - panic                        # market panic
    - single_quarter_miss          # a single-quarter miss

portfolio:
  max_holdings: 5                # R4: a concentrated portfolio of about 4–5 core businesses; more holdings than this makes C-CONCENTRATION warn, not fail
  entry_band: [0.10, 0.20]       # R4: an entry bar, not a target; a target weight below 10% is an error, above 20% needs a stated reason
  benchmarks: [BRK, VOO]         # R7: the hurdle is Berkshire or VOO; the order follows the engineering default of 00 §V6: Berkshire is the first hurdle, the index the second reference
  single_order_entry: true       # R8: a position is built in one order

ranking:
  rule: "§V13"                   # the series ranking follows 00 §V13: carried in full; return and certainty judged together, not sorted mechanically by a single metric or a fixed order
  candidates: 3                  # the three top-ranked companies outside the holdings are candidates (17C, decision level L2); the rest are archived and refreshed once a year with the annual report
  rotation: quarterly            # ranked once a quarter

budget:
  monthly_usd: 50                # raised from the design document's 20 by the owner on 2026-09-25 (decisions/0021); API calls only
  degrade_order: [pause_candidates, downgrade_drafting_model]   # first pause the candidate companies, then lower the drafting roles' effort from high to medium (decisions/0025); oversight roles are not downgraded

gate:                            # the release gate (17A's gate_rules): if any of these holds, nothing is released; other issues are reviewed after merging and do not block it
  blocking:
    - lint_errors                  # the format check (thesis-ci lint) has errors
    - open_04A_must_fix            # a must-fix from the fact audit 04A was not dealt with in 03R
    - breaker_without_disposition  # a breaker failure has no disposition
    - unresolved_pillar_divergence # a divergence touching a thesis pillar was neither resolved nor flagged in the letter
    - insufficient_trust           # the trust level is too low for automatic release: take the review path in trust.routing

phase_gate:
  auto_advance: true             # passing the acceptance script moves the project to the next phase, with no sign-off from the owner
  on_fail: report_in_letter      # only a failure goes into the letter
  acceptance_script: scripts/accept.py

escalation:                      # 00 §G3: dispositions of test results, and escalation requests. A failed test is not a sell
  test_failure:
    applies_to: breaker                        # a fail result on a test with severity breaker
    responsible: company_manager
    disposition_within_days: 7
    disposition_options: [false_trigger, confirmed_trigger]
    # false_trigger: what the thesis breaker describes did not actually happen (a change of basis, a one-off accounting item, etc.); attach primary evidence and correct the test, effective only going forward
    # confirmed_trigger: that part of the investment case is void; write how the whole thesis changes, and judge against R6 whether to submit an escalation request
    not_allowed: maintaining the thesis        # a breaker failure cannot be disposed of by "maintaining the thesis"
    pending_check: if a reading is in doubt, it may first be recorded as "to be checked" and written into questions; within 7 days it must still be closed with one of the two options above
  test_warning:
    applies_to: [warn, watch_fail]             # a warn on any test, and a failure of a test with severity watch
    responsible: company_manager
    disposition_within_days: 7
    disposition_options: [maintain, revise_thesis, pending]
    # maintain: keep the thesis (explain why the load-bearing parts are not affected); revise_thesis: revise the thesis (say which pillar and how); pending: conclusion pending (give the deadline and the filing being waited for)
    handled_as: test_warning_disposition       # decision level L2, reported in the monthly letter
  escalation_request:
    from: company_manager                      # the company manager only submits escalation requests and does not draft memos
    to: hq_capital_allocator                   # HQ (17B) checks the facts and judges whether revising the thesis is all that is needed
    only_for:                                  # R6's four causes inside the business; the reason enum of escalation.schema.json
      - moat_permanent_impairment
      - business_model_change
      - management_deterioration
      - capital_allocation_failure
    not_a_reason: [hurdle_alarm]               # an R7 hurdle alarm by itself is not a reason to escalate
  memo:
    drafted_by: hq_capital_allocator           # L3 memos are drafted only by HQ (drafted_by in memo.schema.json)
    hq_only: [better_opportunity, r9_add_after_decline]   # cross-company money matters are raised only by HQ, based on the 17C ranking
    on_alert: a price alert by itself is not a reason; first ask whether the thesis and the ranking support action, then decide whether to write a memo
  divergence:                                  # item-by-item comparison of the company manager's and the blind read's answers: agree, diverge, cannot tell
    first_to: hq_capital_allocator             # the divergence map goes to HQ first, not to the owner
    then_to: letter_for_owner                  # the "for your attention" section of the letter
    then_only_if: [unresolved_after_hq_review, touches_thesis]
  step_failure:                                # any step of the pipeline fails
    action: open_issue                         # open an issue that explains why; never skip silently
    to_letter_after_consecutive: 2             # the same step failing twice in a row goes into the letter
    if_pipeline_down: semi_auto_phase1         # if the pipeline breaks, fall back to the semi-automatic process of phase 1; updates cannot stop
  memo_overflow:
    when: monthly_memos_exceed_target          # the month's memos exceed memo.monthly_target_max
    actions: [explain_in_letter, raise_escalation_threshold]
