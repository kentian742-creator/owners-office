# Constitution rules and their checks
# schema: thesis-ci/spec/schemas/constitution-rules.schema.json
# The rules are defined in constitution/owner.md; this file is its machine-readable index. Numbers, titles and rule
# text must match between the two.
# R1–R14 match series rules 00 §C word for word in number, title and text. H1–H5 follow 00 §H, except that in H2 and
# H4 a few terms that are themselves on the banned list are replaced by descriptions with the same meaning (public
# files may not contain them; see owner.md, "II. Hard rules").
# Every rule cites at least one check registered in thesis-ci (C-CONSTITUTION-MAP). Many rules are judgments, and a
# machine can check only the record they leave; how_checked states plainly how far each check actually reaches, and
# says so where it does not reach.
rules:
  # ---------- Investment constitution (kind: constitution) ----------
  - id: R1
    kind: constitution
    title: Order and price
    text: >-
      Business quality first, management quality second, valuation third. Prefers "fair price for an excellent
      business" over "cheap price for an ordinary business". Fair price does not mean any price: still requires a
      meaningful margin of safety relative to business quality, future return expectations, and uncertainty. Prefers
      buying excellent businesses at fair prices rather than requiring extreme undervaluation — the cost of missing a
      great business's long-term compounding while waiting for a perfect price outweighs the value of further price
      optimization.
    checks: [C-RATING-ORDER]
    how_checked: >-
      Each company's thesis.yml must have a business grade and a management grade; every row of the series ranking in
      the private repository (hq/ranking.yml) must give the reason for its place; the order itself is a combined
      judgment under 00 §V13 and is not checked. The check covers only whether the separate grades and the reasons
      are written. The weight of "business quality first, management quality second, valuation third" and "still
      requires a meaningful margin of safety" are judgments, carried out by the model review (04C) and HQ's ranking
      (17C); the machine does not judge the order.

  - id: R2
    kind: constitution
    title: The quality touchstone
    text: >-
      "If the stock market closed for 10 years, would I still want to own this business?" — looks for a durable
      competitive advantage/moat, pricing power, high capital returns, and growing free cash flow.
    checks: [C-TESTS-COVERAGE, C-STALENESS]
    how_checked: >-
      Taken together, the covers fields of each company's thesis tests must include moat, pricing_power,
      returns_on_capital and free_cash_flow; staleness tests warn, by the reviewed date, about parts overdue for review
      (C-STALENESS only warns and does not block merging). The checks make sure that all four aspects are guarded by
      tests and that the judgments are reviewed on schedule; whether the tests themselves are well written is reviewed
      by the red team (04B) and HQ.

  - id: R3
    kind: constitution
    title: Management
    text: >-
      Management quality test: whether management allocates capital rationally, thinks like owners, prioritizes
      long-term shareholder value, and uses buybacks/dividends/reinvestment sensibly.
    checks: [C-TESTS-CAPALLOC]
    how_checked: >-
      For each company, the covers of at least one test include capital_allocation, and of at least one include
      management. Only the existence of the tests is checked; the two readings for the management half of the Munger
      matrix (00 §V14) are recomputed by the fact audit (12A) and the model review (04C). The machine does not assess
      management.

  - id: R4
    kind: constitution
    title: Concentration and position size
    text: >-
      Prefers a concentrated portfolio of a small number of high-conviction businesses, typically around 4–5 core
      holdings, rather than broad diversification; if a business isn't worth a meaningful position, it isn't worth
      owning at all. Position-sizing rule: 10–20% is a qualification threshold for buying at all, not a mandatory
      allocation target. Position size should NOT come from historical volatility, max-drawdown math, or generic risk
      models — it should come from depth of understanding, business quality, management quality, long-term certainty,
      and valuation margin of safety. These position-sizing principles are a framework for capital allocation, not
      rigid rules to be applied mechanically. The owner decides position size.
    checks: [C-CONCENTRATION, C-DECISION-RIGHTS]
    how_checked: >-
      In decision-rights.yml, portfolio.max_holdings is a positive integer (a value above 5 warns: the rule says
      "around 4–5") and entry_band equals [0.10, 0.20]. More companies with status holding than the limit warns; it is
      not an error. In the private repository, a buy or add memo whose target weight is below the bottom of the entry
      bar (10%) is an error; above the top (20%) is allowed (a higher-conviction business can get a larger position),
      but weight_note must give the reason, and a missing reason warns. buy, add, trim and sell are decision level L3
      only, decided by the owner. "Position size should NOT come from historical volatility, max-drawdown math, or
      generic risk models" is a requirement on method with no machine check.

  - id: R5
    kind: constitution
    title: The place of valuation
    text: >-
      Distrusts P/E-based valuation, while still wanting an explicit approximate value, since without one the owner feels
      lost. DCF is just an approximation/replication of value, not a precise instrument, and shouldn't be pushed to
      make a business look too over- or under-valued. DCF is a supporting framework, not a decision-making engine —
      valuation should inform an investment decision but should not override business quality. Details of the
      discount rate are in §V1.
    checks: [C-DISCOUNT-RATE]
    how_checked: >-
      In the private repository, every valuation.yml has discount_rate.total equal to risk_free plus premium; once a
      discount rate is filled in, discount_rate.note states what the premium is based on and method_note is not
      empty; a missing date for the Treasury yield (risk_free_date) warns; premiums are not compared across companies
      (decisions/0012). Only the arithmetic and the record of the discount rate are checked. "DCF is a supporting
      framework" that "should not override business quality" is checked item by item by the model review (04C)
      (double discounting, a single discount rate, ranges only); the machine does not judge it.

  - id: R6
    kind: constitution
    title: Holding and selling
    text: >-
      Ideal holding period is indefinite — holds as long as a company's fundamentals, moat, and management haven't
      permanently deteriorated; treats 1–3 years only as a minimum observation window, not the real target. Sells only
      for permanent deterioration: a permanently damaged moat, a fundamentally changed business model, declining
      management quality, seriously bad capital allocation, or finding a clearly better long-term opportunity. Will
      not sell because of price declines, a recession, market panic, or a short-term earnings miss on an
      otherwise-sound business.
    checks: [C-SELL-REASONS, C-DEFAULT-HOLD, C-SCHEMA]
    how_checked: >-
      memo.sell_reasons matches the sell_reason enum of memo.schema.json, and forbidden_sell_reasons includes price
      decline, recession, panic and a single-quarter miss; trim and sell memos in the private repository must cite an
      allowed reason; the default option is maintain, and no reply within 14 days means the default; the
      escalation-request schema accepts only the four causes inside the business, and only the company manager can
      draft a request, while only HQ can draft a memo. The check looks only at which reason is filled in; whether the
      deterioration is really permanent is judged by HQ (17B) after checking the facts, and decided by the owner.
      "Ideal holding period is indefinite" and "1–3 years only as a minimum observation window" have no machine check.

  - id: R7
    kind: constitution
    title: Opportunity cost
    text: >-
      Won't buy or hold a position unless its expected long-term return/quality clears Berkshire or VOO as the
      comparison bar (when a holding falls below the comparison bar, HQ judges in 17C whether this constitutes R6's
      "clearly better long-term opportunity"). Investment ideas are compared against existing holdings and
      high-quality alternatives; only replaces or adds a name if it's higher-or-similar quality, better long-term
      return, and reasonably valued. Prefers owning a small number of excellent businesses for the long run over
      continuously hunting new names. Won't add capital purely to hit a target position weight, and won't invest
      simply because cash is sitting idle — treats un-deployed cash as optionality/dry powder rather than a gap that
      must be filled.
    checks: [C-HURDLE]
    how_checked: >-
      Every valuation.yml in the private repository records two references, Berkshire and VOO (hurdles). The order of
      the hurdles follows the engineering default of 00 §V6: Berkshire's long-term return estimate at its current
      price is the first hurdle, and the index's forward return is the second reference; the higher of the two is not
      taken. A buy or add memo's expected long-term return must be above the first hurdle, and the memo may not set
      itself a lower hurdle; otherwise it is an error. Clearing the first hurdle but not the VOO reference warns, and
      the memo gives the reason; a holding below either line warns and goes to HQ for judgment (the warning by itself
      is not a reason to escalate). The quality half and "treats un-deployed cash as optionality" have no machine
      check: when no company clears the hurdle, HQ writes no buy memo.

  - id: R8
    kind: constitution
    title: Trade rarely
    text: >-
      Prefers building a position in one order rather than several small tranches (per-trade minimum commission is
      material at the owner's portfolio size); dislikes frequent trading generally. Avoid chasing the "perfect" entry point.
    checks: [C-SINGLE-ORDER]
    how_checked: >-
      portfolio.single_order_entry is true; a buy or add memo has order.type single, and a staged plan in its summary
      or note is an error; several live buy or add memos for the same company within 31 days warn; more memos in a
      month than memo.monthly_target_max warns. Only the way memos are written is checked; the original says
      "prefers", so the owner is not bound by this when deciding personally, and orders are placed by the owner
      personally.

  - id: R9
    kind: constitution
    title: A decline is not a thesis
    text: >-
      A market-wide decline is not, by itself, a reason to change the thesis; if the broad market or the core
      businesses fall meaningfully and long-term expected returns rise, the owner would consider adding fresh capital to increase
      core positions rather than treating the decline as risk (proposed by HQ, decided by the owner; decision level
      L3).
    checks: [C-DECISION-RIGHTS, C-SCHEMA]
    how_checked: >-
      add is decision level L3 only, decided by the owner; the memo schema allows only HQ as the drafter, and the
      escalation-request schema accepts as reasons only R6's four causes inside the business, so a company manager has
      no way to propose adding capital. "A market-wide decline is not, by itself, a reason to change the thesis" is a
      judgment and is not machine-checked; price silence (H2) keeps daily share prices from the drafters.

  - id: R10
    kind: constitution
    title: Five steps before a decision
    text: >-
      Understand the business → evaluate moat and management → estimate long-term value creation → compare expected
      return against existing holdings → decide whether the current price offers a reasonable margin of safety.
    checks: [C-SCHEMA]
    how_checked: >-
      The memo schema requires at least two options, one of them maintain, the clauses cited (R or H numbers) and the
      drafter; the escalation-request schema requires the tests triggered (test_ids), at least one fact with a source
      tag, the cause and the conclusion. Only the record is checked: whether the five steps were really taken is set
      out by HQ when drafting the memo and judged by the owner. The memo's evidence field is optional for now; the
      format of its source tags is checked only when it is filled in.

  - id: R11
    kind: constitution
    title: Record the process; don't grade by results
    text: >-
      The journal records decisions rather than grading them by results — the aim is to train the reasoning process,
      since good decisions can produce bad results and bad decisions good results.
    checks: [C-SCHEMA, C-PREREG-TIMING, C-PREREG-IMMUTABLE, C-TEST-FROZEN]
    how_checked: >-
      The decision-log schema requires nine fields (date, decision, company, original thesis, assumptions, expected
      outcome, risks, review date, outcome). A pre-registration's deadline falls before the release date, its merge
      time is earlier than the deadline, and the owner's override has the same deadline as the system's file
      (C-PREREG-TIMING); after the deadline every items file must have an OpenTimestamps proof next to it, and where
      the ots client is installed the proof must verify (C-PREREG-IMMUTABLE); when a PR check is given a base version
      and the current period, test thresholds in force for that period may not be changed or deleted (C-TEST-FROZEN;
      without these two parameters it passes without checking). The machine can only ensure that judgments are written
      down before the results are out and are not changed afterwards; "rather than grading them by results" relies on
      the settler recording only whether an expectation came true, without judging the decision made at the time
      (15B), and the machine does not check it.

  - id: R12
    kind: constitution
    title: Circle of competence
    text: >-
      Maintains general humility about investing outside the owner's circle of competence; interest does not equal an
      investment decision without sufficient understanding. By the owner's own account: strongest understanding in cloud and
      enterprise software; semiconductors are an area where the owner continues learning, given their cyclicality and how
      hard it is to predict long-term winners.
    checks: [C-SCHEMA]
    how_checked: >-
      thesis.yml must declare a calibration domain, domain (one of the enum values); pre-registration items and
      forecast records carry domain too, and calibration is counted by domain. Only whether the domain is declared is
      checked. "Interest does not equal an investment decision without sufficient understanding" can be tested with
      data only once enough settled forecasts have accumulated and calibration scores are computed by domain (phase
      4); until then HQ's ranking (17C) looks at the trend.

  - id: R13
    kind: constitution
    title: Temperament
    text: >-
      Avoid over-trading, avoid changing long-term judgment because of price moves, avoid chasing the "perfect" entry
      point, keep price volatility separate from permanent business impairment, and stay patient.
    checks: [C-SINGLE-ORDER, C-NO-TRADING, C-NO-PRICE-FEED, C-DEFAULT-HOLD]
    how_checked: >-
      What is checked are the mechanisms that turn these reminders into defaults: buy and add memos describe a single
      order, and memos stay within the monthly target (C-SINGLE-ORDER); the system has no broker or order interface of
      any kind (C-NO-TRADING); no daily market data is connected (C-NO-PRICE-FEED); money matters default to
      maintaining the status quo (C-DEFAULT-HOLD). Temperament itself cannot be checked.

  - id: R14
    kind: constitution
    title: Long-term objective and drawdowns
    text: >-
      Seeks approximately 8–10%+ annualized compounding over time, while recognizing that actual returns depend on
      business performance, valuation, capital allocation, and market conditions. Willing to accept severe drawdowns
      (50%+) as long as intrinsic value, fundamentals, and management haven't been permanently impaired.
    checks: [C-DISCOUNT-RATE, C-HURDLE, C-SELL-REASONS, C-DEFAULT-HOLD]
    how_checked: >-
      What is checked is that the objective stays out of valuations and sell decisions: the discount rate is the
      Treasury yield plus the company's premium with its basis written down (C-DISCOUNT-RATE); buy and add memos clear
      R7's bar, not a personal target (C-HURDLE); a price decline or drawdown is not an allowed sell reason
      (C-SELL-REASONS); money matters default to no action (C-DEFAULT-HOLD). Whether the portfolio compounds at the
      objective is not checked: the system computes no portfolio returns (H2).

  # ---------- Hard rules (kind: hard_rule) ----------
  - id: H1
    kind: hard_rule
    title: Sources
    text: >-
      Every factual number in archives, reports and updates carries a source tag (§E1). A number without a source
      goes into no deliverable.
    checks: [C-SRC-TAG, C-SRC-FACT, C-SRC-ACCESSION]
    how_checked: >-
      In the Markdown of archive content (companies/, industries/, letters/ and mistakes.md), every sentence with a
      factual number has a parseable [src:] tag; YAML source fields and factual numbers in free text resolve to
      sources.yml; a periodic-report source without an EDGAR accession number warns. The checks see whether tags are
      present and resolvable; whether the numbers match the source is checked one by one by the fact audit (04A, 09A,
      12A).

  - id: H2
    kind: hard_rule
    title: Price silence
    text: >-
      Do not fetch or display daily share prices, and do not write any price from memory. Only four kinds of price
      may appear, each with a date and a source: (1) the "price reference" in private files (valuations, research
      reports, complete company reports), used for the grade given to the price, for price ÷ central value, and for
      return estimates derived from the price; (2) the unadjusted year-end closing prices of past years that the
      five-year backtest needs, kept only in the private valuation files; (3) historical average buyback prices
      disclosed in company filings — these are facts about the company and may go into the public `ledger.yml`; (4) a
      one-time alert when a value range written in advance is crossed. (1) and (2) are supplied by the pipeline as the
      `price_reference` and `year_end_closes` inputs; if they are not supplied, nothing is written and the gap goes
      into the unknowns register. The reason for silence: daily share prices anchor judgment to the price, and this
      system judges the business.
    checks: [C-NO-PRICE-FEED]
    how_checked: >-
      Code and workflows reference no market-data source (except the private repository's modules for backtest prices
      and price alerts); public data files have no price keys; public archive content states no share prices. "Do not
      write any price from memory" and the date and source on each of the four kinds of price are checked by the fact
      audit; there is no dedicated check.

  - id: H3
    kind: hard_rule
    title: No buy or sell advice, no trading
    text: >-
      No output contains an order instruction.
    checks: [C-PUBLIC-NO-ADVICE, C-NO-TRADING]
    how_checked: >-
      Public archive content (companies/, industries/, forecasts/, letters/, mistakes.md) and every README contain no
      buy or sell advice wording; no code, notebook or workflow references a broker or order interface.

  - id: H4
    kind: hard_rule
    title: Public/private separation
    text: >-
      Value ranges, the central value, the discount rate, return estimates derived from the price, the grade given to
      the price, the price reference, L3 memos, escalation requests and decision records with amounts are kept only
      in the private repository. Public files (including negative sentences, comments, YAML notes, PR bodies, PR
      attachments and issues) may not contain these numbers, nor any term on the list of banned terms. Public files
      also state no multiples or ratios that take the current share price as an input (P/E, market capitalization,
      free-cash-flow yield, etc.). Where private content must be referred to, write only "valuation: see private
      files". Operating numbers such as returns on capital, margins, growth rates and test thresholds are written as
      usual.
    checks: [C-PUBLIC-NO-VALUATION, C-PUBLIC-NO-AMOUNTS]
    how_checked: >-
      The public repository has no valuation files and no memos/, escalations/ or decision-log/; no YAML file has keys
      for valuations, price references, returns derived from the price or grades given to the price, nor keys for
      position amounts or accounts; archive content (companies/, industries/, forecasts/, letters/, mistakes.md)
      contains no banned terms, no price ranges with numbers and no position figures, and a multiple or ratio that
      takes the share price as an input, in the same sentence as a number, is an error. The wording scan does not
      cover constitution/, agents/ (except the README) or docs/; those files rely on self-checking when they are
      written. PR bodies and issues are not scanned yet.

  - id: H5
    kind: hard_rule
    title: Reproducibility
    text: >-
      Model calls go only through `pipeline/llm.py`, which records the model name, the version of 00, the prompt
      version (git hash) and the input hash. Prompts do not specify models. Content not produced through `llm.py`
      (including the output of manual conversations) cannot be merged directly; it serves only as a lead and can be
      merged only after the pipeline has rerun it.
    checks: [C-LLM-ENTRY]
    how_checked: >-
      Apart from pipeline/llm.py, no code, notebook or workflow imports a model SDK or calls a model API directly. Only
      the single entry point is checked; the log fields are covered by owners-office's tests/test_llm.py (recording the
      version of 00 separately waits for an llm.py upgrade); "cannot be merged directly" for manual output is enforced
      by HQ's release gate (17A); there is no dedicated check.
