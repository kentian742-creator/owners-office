# Industry module: Non-alcoholic Ready-to-Drink Beverages
# Format: thesis-ci/spec/SPEC.md section 6; schema: thesis-ci/spec/schemas/industry.schema.json.
# This module describes the industry only; it does not assess any company's stock and gives no advice; the link between companies and industry modules is recorded only on the company side.
# All numbers are taken from the study IND-RTDBEV-2026-09; #pN is the page number of the study PDF.
# Signpost thresholds are criteria written down in advance: those marked “study's own threshold” are taken from the study itself; those marked “set by this module” are values, scopes or bases this module supplied where the study gave only a direction or wording that was not specific enough.
# On 2026-09-24 the numbers, periods and page numbers were checked one by one against the study; numbers that contradict each other within the study, and which this module therefore does not cite, are recorded in todo.

id: non-alcoholic-rtd-beverages
name: Non-alcoholic Ready-to-Drink Beverages
name_en: Non-alcoholic Ready-to-Drink Beverages
as_of: 2026-09-19
reviewed: 2026-09-24
source: IND-RTDBEV-2026-09#p3

summary: "This module covers branded non-alcoholic ready-to-drink beverages (carbonated soft drinks, bottled water, energy drinks, sports drinks, juice, ready-to-drink tea and ready-to-drink coffee), where the price the consumer pays is split among four layers: brands and concentrate, bottling and distribution, packaging and ingredients, and the retail and foodservice channels that control the shelf [src:IND-RTDBEV-2026-09#p3]. In fiscal 2025, in the manufacturing chain the study can measure, the brand and concentrate layer took 54% of operating profit on 32% of revenue, an operating margin of 28.4%, against 10.9% for the bottling layer and about 12% for packaging and ingredients [src:IND-RTDBEV-2026-09#p3][src:IND-RTDBEV-2026-09#p4][src:IND-RTDBEV-2026-09#p8]. The study holds that this split comes from contract, not brand: under the incidence pricing used in most markets, the brand owner takes a share of the bottler's realised net revenue, sharing in every price increase by the bottler while bearing none of the cost increases in aluminium, resin, freight and labour [src:IND-RTDBEV-2026-09#p3][src:IND-RTDBEV-2026-09#p9]. The industry's most durable asset is the physical availability that the chilled direct-store-delivery network provides; it protects chilled, single-serve, impulse consumption, not supermarket multipacks, and most bottled water also moves through retailers' warehouses [src:IND-RTDBEV-2026-09#p11]. Challenger brands rent this system at close to the marginal cost of delivering one more case, the incumbents collect equity and the challengers' dependence on their channel, and successful new categories are later bought by the incumbents at modest prices [src:IND-RTDBEV-2026-09#p3][src:IND-RTDBEV-2026-09#p12][src:IND-RTDBEV-2026-09#p13]. The main changes the study expects are volume shifting to emerging markets, where revenue per case is about half that of established markets, sweetener-agnostic excise taxes closing the reformulation escape (from 2026 Mexico levies 1.50 pesos per litre on drinks containing non-caloric sweeteners), packaging becoming a regulated cost, B2B ordering platforms separating ordering from direct delivery, and consolidation among challengers [src:IND-RTDBEV-2026-09#p19][src:IND-RTDBEV-2026-09#p24][src:IND-RTDBEV-2026-09#p25]."

structure:
  - "Brand and concentrate layer: in most markets the Coca-Cola Company does not sell concentrate at cost plus a margin but takes a share of the bottler's realised net revenue (gross revenue less customer promotions, cooperative marketing and customer-specific coupon spending), which is incidence pricing [src:IND-RTDBEV-2026-09#p9]. The incidence agreement between the Coca-Cola Company and Coca-Cola Consolidated that the study cites lets the brand owner set the rate at its own discretion and change it at 90 days' notice, provided it applies proportionally to all participating bottlers, so the brand owner automatically shares in the bottler's price increases and mix improvements while bearing none of the increases in aluminium, resin, freight and labour [src:IND-RTDBEV-2026-09#p9]. The brand layer also includes brand companies such as Monster and Celsius that own no bottling system and rent the incumbents' channels [src:IND-RTDBEV-2026-09#p12][src:IND-RTDBEV-2026-09#p16]."
  - "Bottling and distribution layer: it runs the production lines, delivery vehicles and cold-drink equipment and carries almost all the physical assets, and in 2025 it earned 33% of operating profit on about half of the revenue [src:IND-RTDBEV-2026-09#p8][src:IND-RTDBEV-2026-09#p11]. The study cautions that each layer's revenue includes its purchases from the layer above, so revenue shares are not shares of one pool, whereas profit shares are [src:IND-RTDBEV-2026-09#p8]. Take Coca-Cola Consolidated: in 2025 its purchases of concentrate, syrup, sweeteners, finished goods and related items from the Coca-Cola Company were 31.3% of its net revenue, other cost of sales, mostly packaging, 29.0%, and selling, delivery and administrative expenses 26.6%, leaving 13.2% as operating profit, and after deducting the $382 million of marketing funding returned by the Coca-Cola Company, net concentrate cost was about 26.0% of revenue [src:IND-RTDBEV-2026-09#p7]."
  - "Bottlers trade price for tenure: the Coca-Cola Company's Comprehensive Beverage Agreement in the US runs for ten years, renewable indefinitely at the bottler's option, with territorial exclusivity, which has been protected by law in the US since the Soft Drink Interbrand Competition Act of 1980; the price is that the bottler has no pricing power upstream [src:IND-RTDBEV-2026-09#p6][src:IND-RTDBEV-2026-09#p9][src:IND-RTDBEV-2026-09#p11]. Bottlers that took over refranchised territories also pay the Coca-Cola Company a sub-bottling fee every quarter in perpetuity, on top of the concentrate fee, so the refranchising of 2016–17 transferred assets and the capital burden but not all of the economic benefit [src:IND-RTDBEV-2026-09#p9]."
  - "Retail and foodservice channels: the retailer's cut is set by the channel, not the product: in 2024 packaged beverages were 17.9% of in-store sales and 21.2% of in-store gross profit at US convenience stores, grocery stores have a store-wide gross margin of about 23% and often use soft drinks as a promotional traffic driver, with thinner margins, and fountain drinks in foodservice depend on multi-year exclusive contracts negotiated around equipment, funding and rebates rather than the price of syrup [src:IND-RTDBEV-2026-09#p7]. Retailer concentration in turn constrains the bottlers: in 2024 Walmart accounted for 17% of Coca-Cola Consolidated's net sales and Kroger for 12%, and territorial exclusivity keeps out other bottlers but not customers that span every territory and negotiate once [src:IND-RTDBEV-2026-09#p11]."
  - "Challengers and incumbents: challenger brands rent the incumbents' direct-store-delivery systems, the incumbents price access at close to the marginal cost of delivering one more case and earn their return through equity and the challengers' dependence on their channel; for example, the Coca-Cola Company bought 16.7% of Monster for $2.15 billion in 2015, and 43.2% of Celsius's net revenue comes through PepsiCo [src:IND-RTDBEV-2026-09#p12]. New categories start in channels the incumbents' systems do not serve and, once successful, are bought by the incumbents: the disclosed consideration the Coca-Cola Company and PepsiCo paid for glacéau, BodyArmor and poppi totals $11.7 billion, less than the Coca-Cola Company's operating profit for the single year 2025, and this count includes only deals whose consideration was disclosed [src:IND-RTDBEV-2026-09#p3][src:IND-RTDBEV-2026-09#p13]."
  - "Packaging and ingredients: in fiscal 2025 the operating margins of the packaging and ingredients layers were 12.2% and 12.0% [src:IND-RTDBEV-2026-09#p4], and the study classes packaging as a competitive commodity business with an operating margin of about 12–13% [src:IND-RTDBEV-2026-09#p21]. Input-cost cycles are pushed onto the bottlers by the incidence contracts, while retailers' promotional calendars push part of them back upstream, so the bottling layer in the middle absorbs the shock: in 2025 Coca-Cola Consolidated's gross margin fell by about 40 basis points, which the company attributed to higher tariffs on aluminium imports, while the Coca-Cola Company's gross margin did not fall in the same year [src:IND-RTDBEV-2026-09#p9][src:IND-RTDBEV-2026-09#p17][src:IND-RTDBEV-2026-09#p18]."

signposts:
  - id: RTDBEV-SP1
    title: "Mexican bottler margin: whether the sweetener-agnostic excise tax hurts profits"
    observable: "The quarterly operating margin of Coca-Cola FEMSA's Mexico and Central America segment (the segment operating margin shown in the company's quarterly report or, if it is not shown directly, segment operating income divided by total segment revenue), and the year-on-year change in the segment's volume (unit cases) in the same quarter. The study lists the Mexican bottler margin as the signpost with the highest information value [src:IND-RTDBEV-2026-09#p25], and says the reading comes from the company's quarterly Form 6-K [src:IND-RTDBEV-2026-09#p19]."
    threshold: "Study's own threshold: an operating margin below 14% for two consecutive quarters within 2027 or 2028, with volume declines of less than 5% in both quarters [src:IND-RTDBEV-2026-09#p3][src:IND-RTDBEV-2026-09#p19]. This module's reading: the two consecutive quarters may span a year-end (for example Q4 2027 and Q1 2028), and a year-on-year volume increase also counts as a decline of less than 5%. A falling margin without much fall in volume shows that the new tax hurts margins, not just the product mix [src:IND-RTDBEV-2026-09#p19]."
    rule:
      all_of:
        - metric: segment_operating_margin
          op: "<"
          threshold: 14
          unit: "%"
          consecutive: 2
          period: quarter
          note: "Subject: Coca-Cola FEMSA's Mexico and Central America segment"
        - metric: segment_volume_yoy
          op: ">"
          threshold: -5
          unit: "%"
          consecutive: 2
          period: quarter
          note: "Year-on-year volume change of the same segment in the same two quarters; above the negative threshold means a decline smaller than the threshold"
      note: "Judged only on quarterly data for 2027 and 2028, and the two consecutive quarters may span a year-end; if the company changes its segment definitions, judge on the comparable basis it discloses"
    check_frequency: quarterly
    data_source: "The revenue, operating income and volume tables for the Mexico and Central America segment in Coca-Cola FEMSA's quarterly results reports (furnished to SEC EDGAR on Form 6-K and published on the company's investor relations website); checked every year against the segment disclosures in Form 20-F."
    current_reading:
      value: 16.0
      unit: "%"
      period: 2025Q3
      source: IND-RTDBEV-2026-09#p19
      note: "Volume fell 2.7% in the same quarter, before Mexico's new tax rates took effect in 2026 [src:IND-RTDBEV-2026-09#p19]."
    implication: "If triggered, the sweetener-agnostic excise tax has moved from changing the product mix to depressing margins, and the escape of avoiding the tax by reformulation is closed. On the study's analysis, the loss from such taxes falls first on the bottlers, which set shelf prices, and then passes through incidence to the concentrate layer as a smaller revenue base; no one in the industry benefits [src:IND-RTDBEV-2026-09#p24]. If margins hold through the threshold period, that is consistent with the study's base case: second-generation taxes modestly depress volume and raise the price per litre, margins are broadly unchanged for the first two years, and the real test comes only when several large markets adopt this design at the same time (see RTDBEV-SP2) [src:IND-RTDBEV-2026-09#p19]. The study's confidence in this base case is only uncertain (40–60%) [src:IND-RTDBEV-2026-09#p3][src:IND-RTDBEV-2026-09#p19]."
    tests_to_rerun: [regulation, pricing_power, returns_on_capital]

  - id: RTDBEV-SP2
    title: "Sweetener-agnostic beverage excise taxes spreading beyond Mexico"
    observable: "Whether countries outside Mexico (or a supranational level such as the EU) legislate an excise tax on drinks containing non-caloric sweeteners (zero-sugar, sugar substitutes), that is, a design that no longer uses sugar content as the threshold for the tax. The study lists whether any jurisdiction outside Mexico adopts this design as a signpost [src:IND-RTDBEV-2026-09#p19][src:IND-RTDBEV-2026-09#p25]."
    threshold: "Study's own signpost: any jurisdiction outside Mexico adopting a sweetener-agnostic excise tax [src:IND-RTDBEV-2026-09#p19]. Basis set by this module: national or supranational (such as EU) legislation formally passed or promulgated after 2026-09-19 counts, while proposals, consultations and budget statements do not; state, provincial and municipal legislation is written into the review record but does not trigger on its own, because the study holds that the real test for margins is several large markets adopting at the same time [src:IND-RTDBEV-2026-09#p19]. Merely tightening a sugar threshold does not count, for example the UK lowering its lower-band threshold from 5 grams to 4.5 grams per hundred millilitres from January 2028, which the study regards as still a first-generation design [src:IND-RTDBEV-2026-09#p19]; nor does this module count measures that widen the scope of a sugar tax, such as the UK bringing milk-based drinks into the tax [src:IND-RTDBEV-2026-09#p24]."
    rule:
      op: event
      threshold: "National or supranational legislation outside Mexico that starts levying an excise tax on sugar-free drinks containing non-caloric sweeteners"
      period: event
      note: "Counts on legislation passed after 2026-09-19, not on proposals or consultations; merely tightening a sugar threshold or widening the scope of a sugar tax does not count; taxes of the same kind that existed before 2026-09-19 are not a spread; the baseline list is in todo"
    check_frequency: quarterly
    data_source: "Official gazettes and fiscal and tax legislation of each country (reference text: Article 2 of Mexico's Ley del Impuesto Especial sobre Producción y Servicios, as amended by the reform published in the DOF on 7 November 2025); the World Health Organization's Global report on the use of sugar-sweetened beverage taxes (the study cites the December 2023 edition and the 2025 edition published in January 2026); HMRC policy papers on the UK Soft Drinks Industry Levy."
    current_reading:
      value: "From 2026 Mexico levies 1.50 pesos per litre on drinks containing non-caloric sweeteners"
      period: "2026"
      source: IND-RTDBEV-2026-09#p19
      note: "This is the reference design the study records; in the same year Mexico's existing beverage excise tax rose from 1.64 pesos to 3.0818 pesos per litre [src:IND-RTDBEV-2026-09#p19]. The study lists no jurisdiction outside Mexico that has adopted this design [src:IND-RTDBEV-2026-09#p19]."
    implication: "If it spreads, health taxes turn from an input tax the industry can engineer around by reformulation into an excise tax that can only be passed on in prices or absorbed [src:IND-RTDBEV-2026-09#p24]. The zero-sugar products that have carried growth would themselves be taxed: in 2025 all of the Coca-Cola Company's sparkling growth came from zero-sugar products, with zero-sugar sparkling volume up 14% [src:IND-RTDBEV-2026-09#p19]. The study expects 2026–2030 to be the adoption period, with effects quantifiable from 2028, and the real test for margins only when several large markets adopt at the same time [src:IND-RTDBEV-2026-09#p19][src:IND-RTDBEV-2026-09#p24]."
    tests_to_rerun: [regulation, pricing_power, growth]

  - id: RTDBEV-SP3
    title: "Bottling-layer margins converging on the concentrate layer"
    observable: "The full-year operating margin of each bottler in scope, computed company by company on the reported basis (not the comparable or adjusted basis). Scope (set by this module): the bottlers in the study's table of returns by layer (Exhibit 12), namely Coca-Cola FEMSA, Arca Continental, Coca-Cola Europacific Partners, Coca-Cola HBC and Coca-Cola Consolidated, plus Varun Beverages, PepsiCo's main franchise bottler in India, which the study mentions on the same page as an example of owning the channel without owning the brand [src:IND-RTDBEV-2026-09#p16]."
    threshold: "Study's own threshold: any large listed bottler with a full-year operating margin above 20%, which would mean the profit split has started to reverse [src:IND-RTDBEV-2026-09#p3]. The study also lists bottler margins converging on the concentrate layer anywhere as a case that would prove its contract explanation wrong [src:IND-RTDBEV-2026-09#p25]. Scope and basis are in observable; additions to or removals from the list must be committed separately, with the reason stated, before the relevant annual reports are read."
    rule:
      metric: operating_margin
      op: ">"
      threshold: 20
      unit: "%"
      consecutive: 1
      period: year
      note: "Judged company by company, and any one crossing the line triggers; if Varun Beverages does not report operating profit separately, compute it as profit before tax plus finance costs minus other income, record the basis used in the review record at the first reading, and keep it unchanged"
    check_frequency: annual
    data_source: "Each bottler's annual report and full-year results: Coca-Cola Consolidated's Form 10-K and earnings press release, the Form 20-F and Form 6-K of Coca-Cola Europacific Partners and of Coca-Cola FEMSA, the full-year results reports of Coca-Cola HBC and Arca Continental, and Varun Beverages' annual report. Operating margin is computed as reported operating profit divided by revenue."
    current_reading:
      value: 15.9
      unit: "%"
      period: FY2025
      source: IND-RTDBEV-2026-09#p16
      note: "Of the five bottlers in Exhibit 12, the highest is Arca Continental at 15.9%, and the others are Coca-Cola FEMSA 14.7%, Coca-Cola Europacific Partners 13.4%, Coca-Cola Consolidated 13.2% and Coca-Cola HBC 11.3% [src:IND-RTDBEV-2026-09#p16]. The study gives only Varun Beverages' EBITDA margin of 23.3%, not its operating margin, and the two are not comparable, so the operating margin is to be added at the first check [src:IND-RTDBEV-2026-09#p16]. The overall margin of the bottling layer as computed by the study is 10.9%, depressed by the 2025 impairment at PepsiCo's North American beverage business, and about 12% at that business's 2024 margin [src:IND-RTDBEV-2026-09#p4][src:IND-RTDBEV-2026-09#p8]."
    implication: "If triggered, the profit split has started to reverse [src:IND-RTDBEV-2026-09#p3], which would also mean that the study's contract explanation of the split is wrong [src:IND-RTDBEV-2026-09#p25]. The brand layer's pricing power, the bottling layer's return on capital and the value of territorial franchises would all have to be re-tested. The study's base view is the opposite: bottling scale can be bought and earns only a 12–16% operating margin anywhere, the return of a competitive asset [src:IND-RTDBEV-2026-09#p12]."
    tests_to_rerun: [pricing_power, moat, returns_on_capital, unit_economics]

  - id: RTDBEV-SP4
    title: "A challenger brand growing through channels the incumbents do not control"
    observable: "A single carbonated soft drink or energy brand outside the three big US beverage companies and not distributed through their systems: its share of total US all-channel ready-to-drink volume, and the gross margin its owner reports. This module reads the study's “the three US majors” as the Coca-Cola Company, PepsiCo and Keurig Dr Pepper (the study does not name them one by one), and all-channel volume as total US all-channel ready-to-drink volume as compiled by Beverage Digest, the organisation the study's all-channel data come from [src:IND-RTDBEV-2026-09#p20]."
    threshold: "Study's own threshold: any such brand with an all-channel volume share above 2%, an owner-reported gross margin above 40%, and a distribution route not controlled by any of the three majors [src:IND-RTDBEV-2026-09#p3]. Basis set by this module: the share's denominator is total US all-channel ready-to-drink volume; not controlled means that the brand's main US distribution route goes neither through the bottling and distribution systems owned or franchised by the three majors nor through distribution agreements with them; a brand whose owner does not publish its gross margin cannot meet the second condition and does not trigger, but is written into the review record."
    rule:
      all_of:
        - metric: brand_us_all_channel_volume_share
          op: ">"
          threshold: 2
          unit: "%"
          period: year
          note: "A single brand's share of total US all-channel ready-to-drink volume as compiled by Beverage Digest"
        - metric: gross_margin
          op: ">"
          threshold: 40
          unit: "%"
          period: year
          note: "Gross margin reported by the brand's owner for its latest full fiscal year"
      note: "The three majors are the Coca-Cola Company, PepsiCo and Keurig Dr Pepper; whether the brand is outside the three majors and its distribution route free of their control is judged manually"
    check_frequency: annual
    data_source: "Beverage Digest's annual US all-channel results (the study cites its public results and reports of them in media such as The Wall Street Journal; full brand data require a subscription); Beverage Marketing Corporation's press releases on the US ready-to-drink market, to check total volume; gross margin, distribution agreement and major-customer disclosures in the annual reports of candidate brand owners."
    current_reading: null
    implication: "If triggered, a challenger brand has reached scale and high gross margins without renting the incumbents' systems. The study holds that the moat of the chilled direct-store-delivery network works by preventing a rival system from emerging, not by charging challengers rent, and that what the incumbents collect from challengers is equity and dependence [src:IND-RTDBEV-2026-09#p3][src:IND-RTDBEV-2026-09#p12]. A trigger means both points have to be reassessed, and the incumbents' bargaining power over channel access and the brand layer's share have to be re-tested. The study's base judgement is that challengers growing large through routes the incumbents do not control will not happen on a large scale, with a probability of unlikely (15–40%) [src:IND-RTDBEV-2026-09#p3][src:IND-RTDBEV-2026-09#p21]."
    tests_to_rerun: [moat, competition, pricing_power]

  - id: RTDBEV-SP5
    title: "Delivery or quick-commerce platforms becoming major customers of large bottlers"
    observable: "In the customer-concentration disclosures of large bottlers' annual reports, the share of the bottler's revenue that a third-party delivery or quick-commerce platform accounts for as a single customer. The scope is the same six bottlers as in RTDBEV-SP3, plus the customer-concentration disclosure in the Form 10-K of PepsiCo, which owns North American bottling operations [src:IND-RTDBEV-2026-09#p8] and whose disclosure of Walmart's share the study has cited [src:IND-RTDBEV-2026-09#p11]. The study lists whether delivery platforms appear in bottlers' customer-concentration disclosures as a signpost [src:IND-RTDBEV-2026-09#p20]."
    threshold: "Study's own threshold: any large bottler disclosing that a quick-commerce or delivery platform accounts for a tenth or more of its revenue [src:IND-RTDBEV-2026-09#p25]. Basis set by this module: the customer must be a third-party delivery or quick-commerce platform; retailers' own online businesses, traditional wholesalers and bottlers' own B2B ordering platforms do not count; if a disclosure does not name the customer and it cannot be confirmed to be a platform, it is recorded as undeterminable and verified manually, and does not trigger."
    rule:
      metric: customer_concentration
      op: ">="
      threshold: 10
      unit: "%"
      period: year
      note: "The single customer must be a third-party delivery or quick-commerce platform; the basis is its share of the bottler's revenue"
    check_frequency: annual
    data_source: "Major-customer disclosures in the annual reports of the large bottlers: Coca-Cola Consolidated's Form 10-K (the same disclosure from which the study cites the shares of Walmart and Kroger), the Form 20-F of Coca-Cola Europacific Partners and of Coca-Cola FEMSA, and the annual reports of Coca-Cola HBC, Arca Continental and Varun Beverages; the customer-concentration disclosure in PepsiCo's Form 10-K."
    current_reading: null
    implication: "If triggered, impulse consumption has for the first time a route the incumbents do not control, and the study's judgement on the channel moat must be reassessed [src:IND-RTDBEV-2026-09#p25]. The study expects a different change: B2B ordering platforms take only the ordering step of direct delivery, while the most expensive step, delivery, stays with the bottlers, which is a cost opportunity for the incumbents rather than a threat [src:IND-RTDBEV-2026-09#p19][src:IND-RTDBEV-2026-09#p20]. The study lists quick commerce taking a sizeable share of impulse consumption as a precondition for challengers to bypass the incumbents, and judges that this will not happen on a large scale, with a probability of unlikely [src:IND-RTDBEV-2026-09#p21]."
    tests_to_rerun: [moat, customer_concentration, competition]

  - id: RTDBEV-SP6
    title: "Emerging-market revenue per case: whether volume growth stays high-volume, low-price"
    observable: "The ratio of emerging to established markets in Coca-Cola HBC's full-year revenue per unit case disclosed by market maturity, supported by the emerging markets' shares of volume and revenue; Coca-Cola FEMSA's revenue per unit case for the whole company and each segment is a supporting reading, with no threshold. The study lists the emerging-market revenue per case of Coca-Cola HBC and Coca-Cola FEMSA as signposts [src:IND-RTDBEV-2026-09#p20][src:IND-RTDBEV-2026-09#p25]."
    threshold: "Set by this module (the study gives only a direction, not a numeric threshold): the ratio below 0.45 for two consecutive full years (clearly less than half, the gap widening), or above 0.60 for two consecutive full years (clearly more than half, starting to converge). Two consecutive years are required to filter out currency noise such as a sharp one-year devaluation of emerging-market currencies. If changes in Coca-Cola HBC's market groupings or scope of consolidation make years incomparable, the comparable basis the company discloses is used; a year with no comparable basis is recorded as undeterminable, does not trigger, and prompts a review of this signpost."
    rule:
      metric: em_to_established_revenue_per_case_ratio
      op: outside
      threshold: [0.45, 0.60]
      unit: ratio
      consecutive: 2
      period: year
      note: "Subject: Coca-Cola HBC; emerging-market revenue per unit case divided by established-market revenue per unit case, in its reporting currency (euro); the two consecutive years must fall on the same side of the band"
    check_frequency: annual
    data_source: "Revenue per unit case, volume and revenue by market maturity (established, developing, emerging) in Coca-Cola HBC's full-year results reports and half-year factsheets; volume and revenue by segment in Coca-Cola FEMSA's Form 20-F and quarterly 6-Ks."
    current_reading:
      value: [2.90, 5.70]
      unit: "EUR per unit case"
      period: FY2025
      source: IND-RTDBEV-2026-09#p24
      note: "Revenue per unit case in emerging and in established markets, in that order; the ratio is about 0.51 (computed by this module from these two numbers) [src:IND-RTDBEV-2026-09#p24]. In the same year developing markets were at €5.25, and emerging markets accounted for 63% of volume and 47% of revenue [src:IND-RTDBEV-2026-09#p24]."
    implication: "The study's base judgement is that geographic growth brings much volume but thin profit: volume flows to markets with about half the revenue per case and lower asset utilisation [src:IND-RTDBEV-2026-09#p5][src:IND-RTDBEV-2026-09#p24], and volume growth will run ahead of profit growth [src:IND-RTDBEV-2026-09#p21]. A ratio staying below the lower bound means the same volume growth brings less revenue, and the industry's revenue and profit growth will lag volume growth even further. A ratio staying above the upper bound means per-capita catch-up has begun to bring revenue, and the study's judgement that per-capita catch-up arrives without revenue keeping pace needs revising [src:IND-RTDBEV-2026-09#p20]."
    tests_to_rerun: [growth, unit_economics, returns_on_capital]

