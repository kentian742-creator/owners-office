    若计入信用卡，卡信用向 A2A 轨道的迁移不会表现为信用卡笔数下降，(a) 分支需改用或补充 NPCI 公布的 UPI 信用类数据。
  - >-
    PAY-SP4：研究没有说明巴西 2025 年下半年信用卡支付的同比增速按笔数还是按金额计算 [src:IND-PAYMENTS-2026-09#p14]，需用巴西央行零售支付统计原表核对，并回填印度的半年同比读数。
  - >-
    PAY-SP5：研究没有给出美国名义居民消费增速，(c) 分支需用 BEA 个人消费支出与 Visa、Mastercard 美国支付额（或 Nilson Report）建立基线；
    wero 的线下份额在其线下支付上线后开始读取，并确认 EPI 是否单独公布线下交易笔数。
  - >-
    PAY-SP6：研究没有给出代理人结账使用卡组织令牌的比例和美国线下非卡钱包或稳定币的份额；
    跨境收益率需先用国际交易收入增速与跨境交易额增速建立 FY2025 基线；
    Mastercard 是否仍单独披露跨境相关收入需在其 10-K 中确认。
  - >-
    来源：本模块的事实都经由行业研究转引并注明页码，研究中标注“推算”的数字依据作者另行保存的数字底稿，底稿未随研究提供。
    若将来直接引用研究所列的一手资料（Nilson Report、美联储、Visa 与 Mastercard 10-K 等），需在 sources.yml 中补登；
    研究 p23 的链接已含 Visa 与 Mastercard 年报的 EDGAR 路径，可据此补登登记号。
