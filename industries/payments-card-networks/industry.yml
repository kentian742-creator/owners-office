# Industry module: Payments & Card Networks
# schema: thesis-ci/spec/schemas/industry.schema.json; specification: thesis-ci/spec/SPEC.md section 6.
# This module describes the industry only: it contains no investment view on any company and does not list the companies that reference it (references are recorded only on the company side).
# Every fact number is quoted from source tag IND-PAYMENTS-2026-09, with the PDF page in the same sentence (the study's printed page numbers are the same as its PDF page numbers).
# Numbers marked “derived” are the study authors' arithmetic on published figures (the study's own label); sentences marked “this module's inference” are inferences by this module, not the study's words.
# Probability terms follow the study's definitions on p3: very likely, likely, uncertain, unlikely, very unlikely; the numeric ranges are in the README.
# threshold and rule are criteria written down in advance, not facts. Long texts have one sentence per line, so that changes can be compared line by line.
id: payments-card-networks
name: Payments & Card Networks
name_en: Payments & Card Networks
as_of: "2026-09-16"
reviewed: "2026-09-24"
source: IND-PAYMENTS-2026-09#p3

summary: >-
  A card payment is a fee split: the merchant pays, the issuer takes most of the fee and returns much of it to cardholders as rewards, acquirers compete on price, and the network in the middle keeps only a small share, yet it holds the most valuable position in the chain because it controls the rules and the acceptance network that connect banks and merchants and bears no cardholder credit risk [src:IND-PAYMENTS-2026-09#p3].
  In 2024 US merchants paid $187.2 billion to accept cards, 1.57% of $11.9 trillion of spending, while Visa's fiscal 2025 net revenue of $40 billion equalled only 0.28% of its payments volume (derived) [src:IND-PAYMENTS-2026-09#p6], yet the networks' operating margins are between 58% and 66% (Mastercard 58% on a GAAP basis in 2025, Visa 66% in fiscal 2025 excluding the litigation provision) [src:IND-PAYMENTS-2026-09#p4].
  Interchange caps have so far mainly moved profit among issuers, merchants, acquirers and consumers without taking it away from the networks [src:IND-PAYMENTS-2026-09#p3]: after the Durbin Amendment the networks' share of the US debit fee pool rose from 18% in 2011 to 28% in 2023 [src:IND-PAYMENTS-2026-09#p9], and after the EU cap, measured by the annual net effect over 2015 to 2017, the networks gained €550 million a year while issuers lost €2.95 billion a year [src:IND-PAYMENTS-2026-09#p10].
  Cards have lost their lead only in markets shaped by the state, and what was displaced first was cash, transfers and debit cards, not credit cards [src:IND-PAYMENTS-2026-09#p3]: in the second half of 2025 Pix had 54.7% of retail payment transactions in Brazil while Brazilian credit card payments still grew 9.4% [src:IND-PAYMENTS-2026-09#p14], and in India the number of debit card payments fell 67% between 2021 and 2025 while the number of credit card payments grew 2.6-fold [src:IND-PAYMENTS-2026-09#p18][src:IND-PAYMENTS-2026-09#p17].
  The study's base case: near-term pressure falls on price and is absorbed mainly by issuers and cardholders; in the medium term, account-to-account (A2A) payments will take debit-like payments wherever a state or a bank consortium pushes them; and the long-term question is whether the networks remain the payment credential used by AI agents and tokenised money [src:IND-PAYMENTS-2026-09#p19].

structure:
  - >-
    Who pays whom: in the four-party model the issuer (the cardholder's bank) and the acquirer (the merchant's bank) never negotiate directly; the network sets the rules and the default price between them, and the discount fee the merchant pays the acquirer has three parts: the interchange fee, set by the network and passed through the acquirer to the issuer; the network (scheme) fees charged to both the acquiring and the issuing side; and the acquirer's own margin [src:IND-PAYMENTS-2026-09#p6].
    In the three-party model (American Express, and Discover's own cards) one company issues cards, acquires merchants and runs the network, and keeps the whole discount fee: in 2025, for example, American Express earned $37.4 billion of discount revenue on $1.67 trillion of billed business and spent about half of it ($18.4 billion) on cardholder rewards [src:IND-PAYMENTS-2026-09#p6].
  - >-
    Where each $100 goes (US rewards credit card, the study's illustrative estimate): the merchant pays about $2.30, the issuer collects about $1.80 of interchange, of which about $1.50 goes back to the cardholder as rewards and related costs, the issuer keeps about $0.25 before servicing, fraud and funding costs, the network keeps about $0.15 to $0.25 from the two sides combined (the illustration uses about $0.20), and acquirers and processors keep about $0.35 (the remainder) [src:IND-PAYMENTS-2026-09#p6].
  - >-
    Profit is kept in the middle: value is created at the two ends (the issuer bears credit and fraud risk, the merchant gets the sale) but kept by the middle layer, which is the hardest to replace [src:IND-PAYMENTS-2026-09#p8].
    The networks get less than a tenth of the fee but have the steadiest profits, with operating margins of 58% to 66% and capital expenditure including capitalised software of about 3.7% of net revenue [src:IND-PAYMENTS-2026-09#p4].
  - >-
    Issuers use interchange to buy spending and balances, and make their money by lending: at the end of 2021 the net transaction revenue of large banks' card businesses before rewards was about 1.3 cents per dollar of spending, rewards cost about 1.5 cents, and the credit function contributed about 80% of card profits [src:IND-PAYMENTS-2026-09#p8].
    Issuers are also the networks' strongest counterparties, because they decide which brand goes on the card [src:IND-PAYMENTS-2026-09#p8]; Visa's client incentives in fiscal 2025 were $15.8 billion, 28.3% of gross revenue (derived), against 16.2% in fiscal 2010 [src:IND-PAYMENTS-2026-09#p10].
  - >-
    Acquirers and payment service providers offer standardised services that merchants can switch, and their rates keep falling [src:IND-PAYMENTS-2026-09#p9]; scale looks like a moat but is not, and lasting advantage comes from owning the merchant's systems integration (software, a single global platform) [src:IND-PAYMENTS-2026-09#p3].
    FIS bought Worldpay in 2019 for about $43 billion (enterprise value) and wrote down $24.4 billion of goodwill in 2022 and 2023 [src:IND-PAYMENTS-2026-09#p12];
    Adyen's take rate fell from about 31 basis points in 2015 to about 17 basis points in 2025 (derived), while its EBITDA margin stayed at 53% [src:IND-PAYMENTS-2026-09#p16][src:IND-PAYMENTS-2026-09#p3].
  - >-
    Structures differ by country: the same business is a private toll road in the US, a regulated toll road in Europe and Australia, and a state-built road in Brazil, India and China; wherever the state has built the rails, the international networks are minor players in domestic payments [src:IND-PAYMENTS-2026-09#p7].
    In the second half of 2025, Pix had 54.7% of retail payment transactions in Brazil, and UPI had 85.5% of digital payment volume in India (the study's word is “volume”) [src:IND-PAYMENTS-2026-09#p7].

signposts:
  - id: PAY-SP1
    title: "United States: honour-all-cards and single-network routing rules weakened"
    observable: >-
      Whether the two rules on which US network pricing rests are broken (the study's horizon of 1 to 5 years): honour-all-cards (a merchant that accepts one category of a brand's cards must accept all cards in that category) and single-network routing [src:IND-PAYMENTS-2026-09#p16][src:IND-PAYMENTS-2026-09#p3][src:IND-PAYMENTS-2026-09#p6].
      Specifically, four things: whether the amended injunctive-relief settlement of the MDL 1720 merchant class action wins final approval and takes effect, after which merchants could decide separately whether to accept debit, commercial, premium credit and standard credit cards [src:IND-PAYMENTS-2026-09#p16][src:IND-PAYMENTS-2026-09#p23];
      whether a credit card routing mandate like the Credit Card Competition Act (CCCA) becomes law [src:IND-PAYMENTS-2026-09#p16];
      whether the US debit monopolisation case against Visa (No. 1:24-cv-07214, S.D.N.Y.) produces a remedy [src:IND-PAYMENTS-2026-09#p23];
      and Visa's share of US debit card transactions.
      The first three are early signposts listed by the study [src:IND-PAYMENTS-2026-09#p18]; the fourth corresponds to what the study calls “the share of US debit on unaffiliated networks after the DOJ case” [src:IND-PAYMENTS-2026-09#p22], which this module measures by Visa's share instead, because the study gives a baseline for it [src:IND-PAYMENTS-2026-09#p8].
    threshold: >-
      Crossed if any of the following occurs: (a) the settlement's terms on acceptance by category win final approval and take effect, and are not overturned or stayed on appeal;
      (b) a credit card routing mandate becomes law, for example the CCCA's requirement that issuers with assets above $100 billion enable at least one network other than Visa and Mastercard on their credit cards [src:IND-PAYMENTS-2026-09#p16];
      (c) the US v. Visa case produces a remedy, by judgment or settlement, that restricts exclusivity arrangements or volume-based incentives, or mandates routing competition;
      (d) the Federal Reserve's Regulation II data by payment card network show the combined share of Visa's networks (Visa and Interlink) in all US debit card transactions falling below 50%, meaning Visa no longer carries the majority of US debit transactions.
    rule:
      any_of:
        - {op: event, metric: us_mdl1720_category_acceptance_effective, period: event}
        - {op: event, metric: us_credit_card_routing_mandate_enacted, period: event}
        - {op: event, metric: us_v_visa_debit_remedy_ordered, period: event}
        - {op: "<", threshold: 50, unit: "%", metric: visa_share_of_us_debit_transactions, period: year, note: "Sum of all Visa message types and Interlink, as a share of all transactions of regulated and exempt issuers combined"}
    check_frequency: monthly
    data_source: >-
      (a) the MDL 1720 docket, and the legal proceedings section of Visa's 8-K, 10-Q and 10-K filings on EDGAR (CIK 0001403161);
      (b) the legislative status of the CCCA on congress.gov;
      (c) the filings in United States v. Visa Inc. (No. 1:24-cv-07214, S.D.N.Y.) published by the DOJ Antitrust Division, and the court docket;
      (d) the Federal Reserve's Regulation II debit card data by payment card network (federalreserve.gov/paymentsystems/regii-average-interchange-fee.htm, source [45] listed on p24 of the study), which give each named network's share of transactions by year, separately for regulated and exempt issuers and in total.
    current_reading:
      value: >-
        Not crossed: the settlement won preliminary approval on 2026-06-09, and the final approval hearing is set for 2026-11-16;
        the CCCA was reintroduced on 2026-01-13 and has not passed;
        fact discovery in US v. Visa has been extended to 2027-01-29, and there is no trial date yet.
      as_of: "2026-09-16"
      source: IND-PAYMENTS-2026-09#p17
      note: >-
        When it sued in 2024, the DOJ alleged that Visa still carries more than 60% of US debit transactions and earns more than $7 billion a year in debit network fees [src:IND-PAYMENTS-2026-09#p8].
        In June 2025 the court denied the motion to dismiss the case [src:IND-PAYMENTS-2026-09#p16].
        The objection period for the settlement closed on 2026-09-14, with more than 900 objectors, plus Walmart [src:IND-PAYMENTS-2026-09#p17].
        Attempts to attach the CCCA to other bills failed in 2025 and in March 2026, but the President voiced support twice, in January 2026 and in August to September [src:IND-PAYMENTS-2026-09#p17].
    implication: >-
      The strongest counter-argument the study gives is that the networks' returns rest on legally permitted collective pricing and restrictive rules, and that once honour-all-cards and single-network routing are removed, the moat shrinks to an ordinary switch [src:IND-PAYMENTS-2026-09#p3].
      The study holds that the mechanisms that really hurt the networks, and not only the issuers, are routing competition on credit cards or limits on volume-based incentives, which plain price caps have not achieved to date [src:IND-PAYMENTS-2026-09#p17].
      The study lists a US credit card routing mandate or a DOJ remedy, combined with a sustained fall in revenue per dollar of US volume, as the condition that would overturn its first core judgement (thin slice, thick margins) [src:IND-PAYMENTS-2026-09#p3];
      this signpost captures only the first half, and PAY-SP3 watches the second half (this module's inference).
      Acceptance by category would make premium credit cards optional for merchants, and the losers would be the issuers of premium rewards cards; the study judges this “uncertain”, depending on whether the court approves [src:IND-PAYMENTS-2026-09#p21].
      The study judges a US credit card routing mandate within five years “uncertain” (40% to 60%), and notes that even with legislation, the debit precedent shows that the incumbents would keep most of the volume [src:IND-PAYMENTS-2026-09#p17][src:IND-PAYMENTS-2026-09#p3].
    tests_to_rerun: [moat, pricing_power, competition, regulation, unit_economics]

  - id: PAY-SP2
    title: Binding price controls on the networks' own fees in major markets
    observable: >-
      Whether regulation in the major markets the study covers (the US, the EU and the euro area, the UK, Australia, Brazil, India, China) extends from interchange to the scheme and processing fees the networks themselves charge [src:IND-PAYMENTS-2026-09#p7]; the study places regulation of scheme fees outside the US on the horizon of 1 to 5 years [src:IND-PAYMENTS-2026-09#p18].
      The study points out that regulators in the UK, the EU and Australia have begun to target scheme fees directly [src:IND-PAYMENTS-2026-09#p3].
    threshold: >-
      A regulator or legislature in any of the markets above formally adopts, after 2026-09-16, a binding price control on scheme or processing fees that applies to Visa or Mastercard (a rate cap, a price freeze or pricing that requires approval).
      Measures that only require transparency, pricing governance or disclosure do not count as crossing; nor do measures aimed only at interchange or at merchant surcharges.
    rule: {op: event, metric: binding_scheme_fee_price_control_adopted, period: event, note: "Only measures adopted after 2026-09-16 that apply to Visa or Mastercard count; measures that only require transparency or pricing governance do not"}
    check_frequency: monthly
    data_source: >-
      the UK Payment Systems Regulator (PSR, psr.org.uk): its market review of card scheme and processing fees and the decisions that follow (the study cites PS26/1 of July 2026);
      the European Commission's Directorate-General for Competition: its inquiries and investigations into Visa's and Mastercard's scheme fees, and the evaluation of the Interchange Fee Regulation (Regulation (EU) 2015/751);
      the Reserve Bank of Australia (RBA): the conclusions paper of its review of retail payments regulation (which has separate conclusions on scheme fees);
      the Federal Reserve's rulemaking to revise Regulation II (only the parts that concern network fees);
      fee notices from the Central Bank of Brazil, the Government of India and NPCI, and the fee rules of the People's Bank of China;
      the regulation sections of the 10-K and 10-Q filings of Visa (EDGAR CIK 0001403161) and Mastercard (EDGAR CIK 0001141391).
    current_reading:
      value: >-
        Not crossed: what the UK PSR adopted in July 2026 were transparency and pricing-governance remedies, not a price cap;
        the European Commission has been sending market questionnaires on Visa's and Mastercard's scheme fees since 2024;
        what Australia is doing from October 2026 is lowering the interchange cap on consumer credit cards and banning surcharges.
      as_of: "2026-09-16"
      source: IND-PAYMENTS-2026-09#p10
      note: >-
        The UK remedies were adopted on 2026-07-30, and Australia's new rules take effect on 2026-10-01 [src:IND-PAYMENTS-2026-09#p17].
        The UK PSR found that core scheme and processing fees rose by at least 25% in real terms from 2017 to 2023, costing UK businesses at least £170 million a year more [src:IND-PAYMENTS-2026-09#p10].
        In Australia in 2024/25, acquirers paid A$992 million in scheme fees (10.5 basis points of transaction value) and issuers A$311 million (3.3 basis points) [src:IND-PAYMENTS-2026-09#p10].
    implication: >-
      The study's second core judgement is that interchange caps only move profit around the networks: after the EU cap the networks gained €550 million a year and issuers lost €2.95 billion a year [src:IND-PAYMENTS-2026-09#p3].
      The counter-argument the study gives is that regulators have learned to target scheme fees directly, and it lists binding price controls on scheme and processing fees in a major market as one of the conditions that would overturn this judgement [src:IND-PAYMENTS-2026-09#p3].
      Crossing would mean that price controls have begun to reach the networks' own fees, rather than only shifting profit among issuers, merchants, acquirers and consumers (this module's inference).
      The study judges a shift of regulatory focus from interchange to scheme fees and routing “likely” (60% to 80%), with the networks' yields and issuers' rewards budgets as the losers [src:IND-PAYMENTS-2026-09#p21][src:IND-PAYMENTS-2026-09#p3].
    tests_to_rerun: [pricing_power, regulation, returns_on_capital, unit_economics]

  - id: PAY-SP3
    title: "The networks' pricing power: net revenue per dollar and issuer incentives"
    observable: >-
      Two annual metrics: first, the networks' net revenue per dollar of volume, that is, Visa's net revenue divided by payments volume and Mastercard's net revenue divided by gross dollar volume (GDV), on a global basis and, where disclosure allows, on a US basis;
      second, Visa's client incentives as a share of gross revenue (net revenue plus client incentives), which measures the share that large issuers claw back from the network.
      The study lists Visa's incentive share as an early signpost on the horizon of 1 to 5 years [src:IND-PAYMENTS-2026-09#p18], and a one-fifth fall in revenue per dollar as a case that would prove its central judgement wrong [src:IND-PAYMENTS-2026-09#p22].
    threshold: >-
      Crossed if either occurs: (a) the net revenue per dollar of either major network (global basis, or US basis where disclosure allows) falls cumulatively by 20% or more from the fiscal 2025 baseline, the study's “fall by a fifth”, mainly because of competition rather than regulation;
      (b) from a fiscal 2025 baseline, Visa's client incentives as a share of gross revenue rise for 3 consecutive fiscal years, which is equivalent to incentives growing faster than net revenue for 3 years in a row.
    rule:
      any_of:
        - {op: decrease, threshold: 20, unit: "%", metric: network_net_revenue_per_dollar_of_volume, period: year, note: "Cumulative fall from the FY2025 baseline, computed separately for Visa and Mastercard; the reader judges whether competition or regulation is the cause"}
        - {op: increase, threshold: 0, unit: pp, metric: visa_client_incentives_share_of_gross_revenue, consecutive: 3, period: year, note: "Year-by-year comparison, counted from FY2026"}
    check_frequency: annual
    data_source: >-
      Visa's annual report on Form 10-K (EDGAR CIK 0001403161, fiscal year ending 30 September): revenue composition (service, data processing, international transaction and other revenue, less client incentives) and net revenue, and payments volume in the operational data;
      Mastercard's annual report on Form 10-K (EDGAR CIK 0001141391, calendar year): net revenue and GDV;
      for the US basis, revenue and volume by region from the two 10-Ks (where disclosed).
    current_reading:
      value: 0.28
      unit: "%"
      period: FY2025
      as_of: "2025-09-30"
      source: IND-PAYMENTS-2026-09#p6
      note: >-
        The value is Visa's net revenue per dollar of payments volume: fiscal 2025 net revenue of $40 billion equalled 0.28% of $14.2 trillion of payments volume, Mastercard's corresponding ratio for 2025 was 0.31%, and the ratio for its core payment network revenue 0.18%, all derived [src:IND-PAYMENTS-2026-09#p6].
        Visa's client incentives in fiscal 2025 were $15.8 billion, 28.3% of gross revenue (derived), against 16.2% in fiscal 2010 [src:IND-PAYMENTS-2026-09#p10].
        In the years shown in the study's chart, this share rose at every step from 16.2% in fiscal 2010 to 28.3% in fiscal 2025 [src:IND-PAYMENTS-2026-09#p12], so crossing (b) may merely continue a long-term trend, and a review should look at whether the increases are accelerating (this module's inference).
    implication: >-
      The study lists a one-fifth fall in revenue per dollar in a major market, caused by competition rather than regulation, as one of the cases that would prove its central judgement wrong [src:IND-PAYMENTS-2026-09#p22];
      net revenue per dollar is also the most direct reading of the networks' pricing power (this module's inference).
      The study also lists a sustained fall in revenue per dollar of US volume after a US credit card routing mandate or a DOJ remedy as a condition that would overturn the “thin slice, thick margins” judgement [src:IND-PAYMENTS-2026-09#p3], so this signpost should be read together with PAY-SP1 (this module's inference).
      Client incentives are another channel: the study sees rising incentives as an indirect transfer from the networks to large issuers, and lists incentive costs growing faster than network revenue for several years in a row as a condition that would overturn the judgement that “caps only move profit around the networks” [src:IND-PAYMENTS-2026-09#p3].
      The study classes issuer loyalty as a contractual advantage that is eroding [src:IND-PAYMENTS-2026-09#p12].
      The largest issuers can also build their own networks: after acquiring Discover, Capital One is moving its debit cards onto its own network, aiming for $1.2 billion of network synergies by 2027 [src:IND-PAYMENTS-2026-09#p10].
    tests_to_rerun: [pricing_power, moat, returns_on_capital, customer_concentration, competition]

  - id: PAY-SP4
    title: Whether state-built A2A rails begin to displace credit cards (India, Brazil)
    observable: >-
      The year-on-year change in the number of credit card payments in India and Brazil, and the development of credit products on UPI and Pix (UPI credit lines, RuPay credit cards used through UPI, Pix instalments), on the study's horizon of 5 to 10 years [src:IND-PAYMENTS-2026-09#p18][src:IND-PAYMENTS-2026-09#p3].
      The study finds that state-built A2A rails displace cash, transfers and debit cards first, and that credit cards are still growing [src:IND-PAYMENTS-2026-09#p3][src:IND-PAYMENTS-2026-09#p14].
    threshold: >-
      Crossed if either occurs: (a) the number of credit card payments in India falls year on year for two consecutive half-years;
      (b) the number of credit card payments in Brazil falls year on year for two consecutive half-years.
      In both cases it must also be confirmed that credit payments on UPI or Pix are growing, to rule out other causes such as a recession or tighter credit.
    rule:
      any_of:
        - {op: "<", threshold: 0, unit: "%", metric: india_credit_card_payments_count_yoy, consecutive: 2, period: half}
        - {op: "<", threshold: 0, unit: "%", metric: brazil_credit_card_payments_count_yoy, consecutive: 2, period: half}
      note: "The machine rule looks only at the number of credit card payments; the reader verifies the growth of credit payments on A2A rails and the attribution"
    check_frequency: semiannual
    data_source: >-
      India: credit and debit card transaction counts in the Reserve Bank of India (RBI) Payment System Report and monthly payment system indicators, UPI and RuPay data published by NPCI (including RuPay credit card transactions through UPI), and related releases from the Press Information Bureau (PIB);
      Brazil: the Central Bank of Brazil (BCB) half-yearly retail payment statistics (Estatísticas de Pagamentos de Varejo) and the Pix management report (Relatório de Gestão do Pix).
    current_reading:
      value: 9.4
      unit: "%"
      period: 2025H2
      as_of: "2025-12-31"
      source: IND-PAYMENTS-2026-09#p14
      note: >-
        The value is the year-on-year growth of credit card payments in Brazil in the second half of 2025; debit card payments were −0.2% over the same period [src:IND-PAYMENTS-2026-09#p14].
        The study does not say whether the 9.4% is by count or by value, while this signpost's rule is judged by count, so it must be checked against the Central Bank of Brazil's original statistics [src:IND-PAYMENTS-2026-09#p14].
        In India the number of debit card payments fell 67% from 2021 to 2025 while the number of credit card payments grew 2.6-fold [src:IND-PAYMENTS-2026-09#p18][src:IND-PAYMENTS-2026-09#p17]; the study gives no half-yearly year-on-year readings for India.
        By early 2025 about 16% of India's card spending went over RuPay, half of it credit through UPI [src:IND-PAYMENTS-2026-09#p18].
    implication: >-
      The study's third core judgement is that only state-shaped markets have displaced cards, and that debit went first [src:IND-PAYMENTS-2026-09#p3].
      Credit cards are still growing thanks to instalments, interest-free periods and rewards [src:IND-PAYMENTS-2026-09#p14], while the counter-argument the study lists is that UPI already carries RuPay credit cards and that credit may be next [src:IND-PAYMENTS-2026-09#p3].
      The study lists credit on A2A rails in India or Brazil taking share from card credit as the condition that would overturn this judgement [src:IND-PAYMENTS-2026-09#p3].
      Crossing would show that the “debit first, credit later” pattern has broken in India or Brazil, and that the networks' remaining credit card business in these markets has started to leak away too (this module's inference).
    tests_to_rerun: [moat, growth, competition]

  - id: PAY-SP5
    title: "The checkout in mature card markets: A2A in Europe and non-card payments in the US"
    observable: >-
      Whether A2A payments can reach the physical checkout in mature card markets without being pushed by price controls (the study's horizon of 5 to 10 years) [src:IND-PAYMENTS-2026-09#p17][src:IND-PAYMENTS-2026-09#p18].
      In the euro area, in-store use of the wero wallet and digital euro legislation; in the US, card spending growth relative to nominal household consumption growth and the share of pay-by-bank at merchants; all are signposts the study lists [src:IND-PAYMENTS-2026-09#p18][src:IND-PAYMENTS-2026-09#p22].
    threshold: >-
      Crossed if any of the following occurs: (a) wero or the digital euro reaches 10% or more of in-store payments in the euro area by count, and not because of new price controls on card fees;
      (b) the EU formally adopts digital euro legislation;
      (c) US card spending growth is below nominal household consumption growth for 3 consecutive years, while A2A's share at the checkout rises over the same period.
      The threshold in (a) borrows the “one-tenth” standard the study uses on p22 for US in-store spending (the original standard is for private wallets or stablecoins);
      “3 consecutive years” in (c) is this module's concrete version of the study's “several years”.
    rule:
      any_of:
        - {op: ">=", threshold: 10, unit: "%", metric: euro_area_instore_share_wero_or_digital_euro, period: half, note: "The reader judges whether it is driven by new price controls on card fees"}
        - {op: event, metric: digital_euro_regulation_adopted, period: event}
        - {op: "<", threshold: 0, unit: pp, metric: us_card_spending_growth_minus_nominal_pce_growth, consecutive: 3, period: year, note: "The machine rule looks only at the growth gap; the reader verifies whether A2A's share at the checkout is rising"}
    check_frequency: semiannual
    data_source: >-
      Euro area: the mix of in-store payment instruments in the ECB's SPACE study of consumer payment behaviour (every few years; the study cites the 2024 edition);
      between surveys, wero's in-store transaction count published by the European Payments Initiative (EPI), divided by the sum of wero's in-store count and the euro area's card payment count from the ECB's half-yearly payment statistics (in-store only where it can be separated), as an upper-bound approximation (the denominator excludes cash, so the share is overstated); when the approximation passes 10%, it counts as crossed only after confirmation with SPACE or other full-coverage data;
      EPI's data on wero users and merchant acceptance, and the legislative progress of the digital euro regulation in the Council of the EU and the European Parliament.
      US: US payments volume growth in the Visa and Mastercard 10-Ks (or the Nilson Report's annual US card spending), nominal personal consumption expenditures from the Bureau of Economic Analysis (BEA), the Federal Reserve Payments Study (every three years), and transaction statistics published by RTP and FedNow.
    current_reading:
      value: "Not crossed: wero's in-store payments are planned to launch in 2026, so there is no in-store share reading yet; the digital euro legislation is not yet complete; the US branch has no baseline yet"
      period: "2026-09"
      as_of: "2026-09-16"
      source: IND-PAYMENTS-2026-09#p17
      note: >-
        By September 2026 wero had 57 million users and had been usable for online shopping in Germany since the end of 2025, and the Netherlands' iDEAL will migrate to it by 2027 [src:IND-PAYMENTS-2026-09#p17].
        Digital euro: the ECB plans to start a pilot in the middle of 2027, and if the legislation is completed in 2026, it could be issued in 2029 [src:IND-PAYMENTS-2026-09#p17].
        In the euro area, cash still accounted for 52% of in-store payments in 2024, and cards for 57% of non-cash payment transactions in the second half of 2025 [src:IND-PAYMENTS-2026-09#p7].
        In the US, instant payments are expanding in business payments and transfers between accounts: in 2025 RTP handled $1.45 trillion, FedNow $853 billion (summing the quarterly data) and Zelle $1.2 trillion, but none of them has reached the checkout yet [src:IND-PAYMENTS-2026-09#p17].
        The study gives no nominal US household consumption growth, so the baseline for (c) is still to be backfilled.
    implication: >-
      The study holds that for A2A to reach the checkout in mature card markets it needs a price gap that merchants can pass on, buyer protection comparable to chargebacks, near-universal reach, and a sponsor willing to bear the build-out cost [src:IND-PAYMENTS-2026-09#p18].
      Large US issuers spend about 1.5 cents per dollar on rewards and chargeback rules protect cardholders, while bank transfers offer neither, which is why A2A has not reached the US checkout so far [src:IND-PAYMENTS-2026-09#p18].
      The study judges it “likely” (60% to 80%) that state or bank-consortium A2A rails modelled on Pix and UPI reach the checkout in Europe and emerging markets, and “unlikely” in the US [src:IND-PAYMENTS-2026-09#p21][src:IND-PAYMENTS-2026-09#p3].
      The study lists wero or the digital euro gaining in-store share without price controls, and US card spending lagging household consumption for several years while A2A rises at the checkout, as conditions that would overturn its judgement [src:IND-PAYMENTS-2026-09#p3][src:IND-PAYMENTS-2026-09#p22].
      Crossing would show that the volume base of cards in the richest markets has started to loosen (this module's inference).
    tests_to_rerun: [moat, growth, competition, pricing_power]

  - id: PAY-SP6
    title: "Control of the payment credential: AI agents, stablecoins and cross-border yield"
    observable: >-
      Three quantities, all signposts the study lists on its horizon of 10 to 20 years [src:IND-PAYMENTS-2026-09#p18][src:IND-PAYMENTS-2026-09#p22]: first, the share of purchases initiated by AI agents that use network tokens;
      second, the scale of payments in tokenised money such as stablecoins relative to card payments, in particular the share of US in-store spending taken by private wallets or stablecoins that bypass the network rails, not counting wallets built on network tokens (such as Apple Pay) [src:IND-PAYMENTS-2026-09#p19];
      third, cross-border yield, the ratio of a network's cross-border revenue to its cross-border volume.
    threshold: >-
      Crossed if any of the following occurs: (a) data published by Visa, Mastercard or the operators of major agent payment protocols such as Google (AP2) or OpenAI and Stripe (Agentic Commerce Protocol) show that less than 50% of agent-initiated purchases use network tokens;
      (b) private wallets or stablecoins that bypass the network rails take more than 10% of US in-store spending without a government mandate;
      (c) Visa's or Mastercard's cross-border yield falls cumulatively by 20% or more from the fiscal 2025 baseline, mainly because of competition (stablecoins, interlinked instant payment systems and the like) rather than regulation.
      (b) is the study's “one-tenth”; the numeric thresholds of (a) and (c) are set by this module, and (c) borrows the “one-fifth” the study uses for revenue per dollar.
    rule:
      any_of:
        - {op: "<", threshold: 50, unit: "%", metric: agent_checkouts_on_network_tokens_share, period: year, note: "Counts if the share published by any network or major agent payment protocol is below the threshold"}
        - {op: ">", threshold: 10, unit: "%", metric: us_instore_share_noncard_wallet_or_stablecoin, period: year}
        - {op: decrease, threshold: 20, unit: "%", metric: cross_border_yield_proxy_vs_fy2025, period: year, note: "Estimated year by year from the growth of cross-border revenue and of cross-border volume, and chained"}
    check_frequency: semiannual
    data_source: >-
      (a) usage data published for Visa Intelligent Commerce, Mastercard Agent Pay, Google's AP2 protocol, OpenAI and Stripe's Agentic Commerce Protocol and the like, and token disclosures in the Visa and Mastercard 10-Ks and earnings materials;
      (b) the Federal Reserve's Diary of Consumer Payment Choice (frbservices.org, annual, which gives the mix of in-store payments by instrument), the Federal Reserve Payments Study, the Nilson Report, and public data from payment stablecoin issuers under the US GENIUS Act framework;
      (c) international transaction revenue in Visa's 10-K and cross-border volume growth in its earnings releases; cross-border volume growth in Mastercard's 10-K, and its cross-border revenue where disclosed separately.
    current_reading:
      value: "No reading yet: the study gives none of the three rule metrics; a related background figure is that Visa's annualised stablecoin settlement had passed $20 billion by September 2026, which is the network itself settling in stablecoins, not payments that bypass the network"
      period: "2026-09"
      as_of: "2026-09-16"
      source: IND-PAYMENTS-2026-09#p18
      note: >-
        The study puts Visa's annualised stablecoin settlement of more than $20 billion in its “counter-evidence” column, to show that the networks already settle in stablecoins and issue agent tokens [src:IND-PAYMENTS-2026-09#p18].
        Visa's international transaction revenue in fiscal 2025 was $14.2 billion, a quarter of gross revenue [src:IND-PAYMENTS-2026-09#p18], and can serve as the numerator for (c); the study gives no matching cross-border volume.
        The study gives neither the share of agent checkouts that use network tokens nor the share of US in-store spending on non-card wallets or stablecoins.
    implication: >-
      The study holds that the most credible long-term threat is a rail that removes merchant fees entirely, and the evidence shows that this needs a push from the state and starts with debit [src:IND-PAYMENTS-2026-09#p16].
      Stablecoins and tokenised deposits make cross-border settlement programmable and nearly instant, threatening the networks' highest-yielding business, cross-border, while AI shopping agents change who issues and verifies the payment credential [src:IND-PAYMENTS-2026-09#p18].
      The incumbents have moved early: Visa launched USDC settlement in the US in December 2025, and Visa Intelligent Commerce and Mastercard Agent Pay extend network tokens to agents, but Google's AP2 and OpenAI and Stripe's Agentic Commerce Protocol are not tied to a single network, so the contest is still open [src:IND-PAYMENTS-2026-09#p18].
      The study lists tokenised money or AI shopping agents moving control of the payment credential away from network tokens, and private wallets or stablecoins taking more than a tenth of US in-store spending without a mandate, as cases that would change its judgement; they correspond to (a) and (b) respectively [src:IND-PAYMENTS-2026-09#p3][src:IND-PAYMENTS-2026-09#p22].
      Cross-border yield is different: the study's base case already includes a lower cross-border yield, and it judges compression of cross-border yield “likely” (after 2030) [src:IND-PAYMENTS-2026-09#p18][src:IND-PAYMENTS-2026-09#p22];
      so crossing (c) does not mean the study's judgement has been overturned, but that the speed at which the networks' highest-yielding business comes under pressure needs to be reassessed (this module's inference).
    tests_to_rerun: [moat, pricing_power, competition, growth]

