# Industry module: Semiconductor Foundry (thesis-ci SPEC section 6; schema: industry.schema.json)
# This module describes the industry only: it records no reference between any company thesis and this module, and contains no view on buying or selling.
# All fact numbers come from IND-FOUNDRY-2026-09 (see sources.yml in the same directory); #pN is the PDF page number (the same as the printed page number).
# Thresholds (threshold / rule) are criteria written down in advance and need no source; readings (current_reading) are facts and must carry a source.
# Numbers marked “the study's calculation” are the study authors' arithmetic on published figures; sentences marked “this module's inference” are inferences by this module, not the study's words.
# Probability terms follow the study's definitions: very likely, likely, uncertain, unlikely, very unlikely (numeric ranges in the README).
id: semiconductor-foundry
name: Semiconductor Foundry
name_en: Semiconductor Foundry
as_of: 2026-09-16
reviewed: 2026-09-24
source: IND-FOUNDRY-2026-09#p3

summary: >-
  Semiconductor foundry is the industry that manufactures logic, analogue and specialty wafers under contract for other companies; foundries now also sell advanced packaging together with the wafers, and the top-10 foundries' wafer revenue was about $170 billion in 2025 [src:IND-FOUNDRY-2026-09#p3].
  It is a learning-curve business: the fixed cost of each process generation grows faster than the market, so fewer and fewer firms can afford a new node, and by a 2020 count 94 chipmakers produced at 180nm but only 3 at 5nm (the count covers all chipmakers, not only foundries) [src:IND-FOUNDRY-2026-09#p9][src:IND-FOUNDRY-2026-09#p10].
  The firm with the most volume on the newest node learns fastest, earns most and funds the next node, and together with its commitment not to compete with its customers, this lifted TSMC's share of top-10 foundry revenue from 55% in Q1 2021 to 72.5% in Q2 2026, and in 2025 its operating profit exceeded that of the rest of the foundry layer combined (the study's calculation) [src:IND-FOUNDRY-2026-09#p3].
  Profit follows scarcity: in fiscal 2025 TSMC's operating margin was 50.8%, mature-node foundries' 12–19%, and independent packaging and test houses' only 7–8% [src:IND-FOUNDRY-2026-09#p8].
  The study holds that subsidies change where fabs are built more easily than who wins, and that mature nodes are a separate, cyclical business whose prices will increasingly be set by China's capacity expansion [src:IND-FOUNDRY-2026-09#p3].

structure:
  - >-
    How foundries charge: they rent out manufacturing capacity by the wafer and, increasingly, by the package; the price is set by the process node and by how scarce capacity at that node is, and costs are largely fixed, so profit depends on the process mix, capacity utilisation, and whether the foundry has capacity that customers cannot buy elsewhere [src:IND-FOUNDRY-2026-09#p6].
  - >-
    From end buyer to foundry: end buyers pay chip design companies, which in turn pay the few scarce manufacturing steps [src:IND-FOUNDRY-2026-09#p6].
    By Epoch AI's cost model of the Nvidia B200 (the study's calculation), TSMC's logic dies plus CoWoS packaging cost about $1,850, only around 5–6% of the selling price, and a 10% wafer price rise adds only about $85 to a chip that sells for more than $30,000 [src:IND-FOUNDRY-2026-09#p7].
  - >-
    Who keeps the value: design creates the most value, but profit is allocated by scarcity [src:IND-FOUNDRY-2026-09#p8]: operating margins in fiscal 2025 were 50.8% at TSMC, 18.5% at UMC and 11.7% at GlobalFoundries [src:IND-FOUNDRY-2026-09#p4], and only 7–8% at the independent packaging and test houses ASE and Amkor, because CoWoS, the scarcest form of packaging, is done inside the foundry [src:IND-FOUNDRY-2026-09#p8].
  - >-
    A moat that moves: the durable asset is not the fab itself (fabs can be bought) but process learning that can only be accumulated by producing in volume on the newest node, guarded by ever-rising fixed costs and customers' trust that the foundry will not compete with them, and it has to be won again at every node [src:IND-FOUNDRY-2026-09#p9].
    The scale of reinvestment is itself a barrier: TSMC's capital expenditure of $40.9 billion in 2025 exceeded the combined revenue of UMC, GlobalFoundries and SMIC, $23.7 billion (the study's calculation) [src:IND-FOUNDRY-2026-09#p10].
  - >-
    Returns diverge: the leader earns high returns despite a heavy reinvestment burden, with TSMC's ROE between 18.4% and 39.8% and averaging about 26% over 2006–2025 (the study's calculation) [src:IND-FOUNDRY-2026-09#p14], while its capital expenditure averaged about 37% of revenue over the same period (the study's calculation) [src:IND-FOUNDRY-2026-09#p11].
    The other firms' returns swing with the cycle and capacity utilisation; UMC's gross margin, for example, has ranged between 14% and 45% since 2019 [src:IND-FOUNDRY-2026-09#p11].
  - >-
    States become owners and gatekeepers: states step in through equity stakes (Intel), industry funds (China), export controls and localisation rules, and subsidies, tariffs and customers' demand for supply outside Taiwan are spreading capacity geographically [src:IND-FOUNDRY-2026-09#p19].
    China supports SMIC with protected demand and state money; SMIC's revenue grew from $3.9 billion in 2020 to $9.3 billion in 2025, but its gross margin in 2025 was only 21%, against 59.9% at TSMC in the same year [src:IND-FOUNDRY-2026-09#p13].

signposts:
  - id: FOUNDRY-SP1
    title: A challenger producing in volume for a named external customer on a 2nm-class process
    observable: >-
      Whether Intel Foundry, Samsung Foundry or another non-TSMC foundry has a named external customer's product shipping in volume on its 2nm-class process; external customers exclude the challenger's own products.
      This signpost counts Intel 18A and later processes, Samsung 2nm and later processes, and Rapidus 2nm as 2nm-class; the ones the study names to watch are Intel 14A and Samsung 2nm [src:IND-FOUNDRY-2026-09#p3].
      The study's overturning condition also requires a flagship customer, a high-volume product and competitive yields [src:IND-FOUNDRY-2026-09#p3]; yields are rarely published, so shipping in volume as confirmed by the company serves here as the observable proxy, and yields and customer size are recorded at review.
      A supporting reading is TSMC's share of top-10 foundry revenue in TrendForce's quarterly ranking, whose rise the study uses as evidence for its first core thesis [src:IND-FOUNDRY-2026-09#p3]; the ranking does not include Intel Foundry [src:IND-FOUNDRY-2026-09#p11].
    threshold: >-
      Triggered if any condition is met:
      (1) the challenger or its customer confirms, in a company announcement, a periodic report or an earnings call, that a named external customer's product has entered volume production and is shipping on the challenger's 2nm-class process; merely announcing an intent to cooperate, completing a tape-out, sampling, or a reported plan to adopt does not count.
      (2) TSMC's share of top-10 foundry revenue is below the same quarter a year earlier for 4 consecutive quarters (TrendForce's quarterly ranking, taking for both quarters the latest published values, including restatements), meaning the rising share the study uses as evidence has reversed.
      The stronger case the study gives, one that would prove its view wrong, is a challenger winning more than half of the leading-edge volume of one of the top five customers [src:IND-FOUNDRY-2026-09#p19]; there are no regular public data for this level, so it is judged only at review and is not written into the machine rule.
    rule:
      any_of:
        - op: event
          period: event
          metric: challenger_2nm_class_named_external_customer_in_volume
          threshold: A named external customer's product shipping in volume on a challenger's 2nm-class process, formally disclosed by the challenger or the customer
          note: Media reports are only leads; intents to cooperate, tape-outs, sampling and planned adoption do not count
        - op: "<"
          threshold: 0
          unit: pp
          consecutive: 4
          period: quarter
          metric: tsmc_top10_foundry_revenue_share_yoy_change
          note: TSMC's share in TrendForce's quarterly ranking minus its share in the same quarter a year earlier
    check_frequency: quarterly
    data_source: >-
      disclosures on Intel Foundry's external customers, 18A and 14A in Intel's quarterly earnings releases and 10-Q/10-K filings (EDGAR, CIK 0000050863);
      disclosures on 2nm customers and volume production at the Taylor, Texas fab in Samsung Electronics' quarterly earnings calls and press releases (news.samsung.com);
      Rapidus press releases (rapidus.inc);
      TrendForce's quarterly press releases ranking the global top-10 foundries by revenue (trendforce.com/presscenter).
    current_reading:
      value: >-
        Not triggered: the items the study lists to watch are still a named customer for Intel 14A entering volume production, and whether Samsung's 2nm Tesla project, reportedly ramping in Texas in the second half of 2027, stays on schedule; the study records no challenger already shipping in volume for a named external customer on a 2nm-class process
      period: "2026-09"
      as_of: 2026-09-16
      source: IND-FOUNDRY-2026-09#p16
      note: >-
        Intel's first 18A products have been on the market since the end of 2025, but they are Intel's own products and do not count as an external customer [src:IND-FOUNDRY-2026-09#p13].
        Tesla reportedly plans to adopt Intel 14A, while Intel's 10-K warns that it may pause 14A without a significant external customer [src:IND-FOUNDRY-2026-09#p13].
        Second condition: TSMC's share of top-10 foundry revenue was 72.5% in Q2 2026, and Samsung's 5.9% [src:IND-FOUNDRY-2026-09#p4]; the study's chart shows TSMC's share rising quarter by quarter in the quarters shown, but gives no exact value for the same quarter a year earlier [src:IND-FOUNDRY-2026-09#p11].
    implication: >-
      A trigger means the study's first core thesis (scale plus learning is a real but movable moat: the firm with the most volume on the leading process wins each node, and the gap is widening) is starting to be tested directly [src:IND-FOUNDRY-2026-09#p3].
      Chips are designed for a particular foundry's process, and customers rarely switch foundries within a product generation, but they can choose again for every new generation, so the leader has to win every node [src:IND-FOUNDRY-2026-09#p8].
      Buyers, although concentrated, lack an equivalent second source, so they respond with long-term commitments rather than bargaining [src:IND-FOUNDRY-2026-09#p8]; an external customer shipping in volume would show that a second source is taking shape and that this pattern may loosen (this module's inference).
      The study's base judgement on the 5–10 year horizon is that a substantial shift of more than 10 percentage points of leading-edge revenue share is “unlikely”, with medium confidence [src:IND-FOUNDRY-2026-09#p16].
      When the second condition triggers, first separate the causes: a falling share may also come from the demand cycle or changes in mature-node prices rather than from a second source (this module's inference).
    tests_to_rerun: [moat, competition, pricing_power, customer_concentration]

  - id: FOUNDRY-SP2
    title: The leading foundry's gross margin floor and AI demand
    observable: >-
      TSMC's quarterly gross margin against the company's through-the-cycle gross margin target of “56% and higher” [src:IND-FOUNDRY-2026-09#p14], a floor the study asks to be watched while the new overseas fabs ramp up [src:IND-FOUNDRY-2026-09#p19].
      Also watch the early signals of AI demand the study lists: a stalling share of HPC (high-performance computing) in TSMC's revenue, cuts to capital expenditure guidance, and shrinking customer purchase commitments [src:IND-FOUNDRY-2026-09#p16].
    threshold: >-
      Triggered if any condition is met:
      (1) TSMC's quarterly gross margin below 56% for 3 consecutive quarters, judged on the gross margin the company reports, without adding back the dilution from new overseas fabs; the study says “several quarters” [src:IND-FOUNDRY-2026-09#p3], set here in advance as 3 quarters.
      (2) TSMC cuts its capital expenditure guidance for the year within the same year, that is, the midpoint of the new guidance range is below the midpoint of the previous guidance range.
      (3) HPC's share of TSMC's quarterly revenue is no higher than in the same quarter a year earlier for 2 consecutive quarters (the year-on-year basis avoids seasonality).
      When reading a trigger, separate cycle from structure: only (1) triggering without a collapse in demand over the same period corresponds to the study's condition for overturning its second core thesis [src:IND-FOUNDRY-2026-09#p3].
      “A collapse in demand” is defined here in advance as the top-10 foundries' combined quarterly revenue on TrendForce's basis falling more than 20% from its previous quarterly peak; for reference, the fall from Q3 2022 to Q1 2023 was 22% [src:IND-FOUNDRY-2026-09#p15].
    rule:
      any_of:
        - op: "<"
          threshold: 56
          unit: "%"
          consecutive: 3
          period: quarter
          metric: tsmc_gross_margin
          note: Gross margin as reported in TSMC's quarterly Management Report, without adjustment
        - op: "<"
          threshold: 0
          unit: USD
          period: quarter
          metric: tsmc_capex_guidance_midpoint_change
          note: Midpoint of the new capital expenditure guidance range minus the midpoint of the previous guidance range within the same year
        - op: "<="
          threshold: 0
          unit: pp
          consecutive: 2
          period: quarter
          metric: tsmc_hpc_revenue_share_yoy_change
          note: HPC's share of quarterly revenue minus its share in the same quarter a year earlier
    check_frequency: quarterly
    data_source: >-
      TSMC's quarterly Management Report and earnings call transcripts (the Quarterly Results page on investor.tsmc.com): gross margin, revenue share by platform (HPC) and capital expenditure guidance for the year;
      TSMC also files 6-Ks and 20-Fs on EDGAR (CIK 0001046179);
      TrendForce's quarterly press releases ranking the global top-10 foundries by revenue (trendforce.com/presscenter), to judge whether demand has collapsed.
    current_reading:
      value: 67.7
      unit: "%"
      period: 2Q26
      as_of: 2026-06-30
      source: IND-FOUNDRY-2026-09#p16
      note: >-
        This is TSMC's gross margin in Q2 2026 [src:IND-FOUNDRY-2026-09#p16]; for full-year 2025 it was 59.9% [src:IND-FOUNDRY-2026-09#p9].
        HPC's share of TSMC's revenue was 58% for full-year 2025 and 66% in Q2 2026 [src:IND-FOUNDRY-2026-09#p6]; the study gives no share for the same quarter a year earlier.
        With its second-quarter results, TSMC raised its 2026 capital expenditure guidance to $60–64 billion [src:IND-FOUNDRY-2026-09#p16].
        Annualised ROE in Q2 2026 was 45.9%, which the study regards as a cyclical high rather than a new baseline [src:IND-FOUNDRY-2026-09#p14].
    implication: >-
      If a demand signal triggers first, it is mainly a cyclical test: hyperscalers slow their capital spending, utilisation of the leading processes and CoWoS falls, and fixed costs squeeze margins [src:IND-FOUNDRY-2026-09#p16], which tests how much of today's margin is scarcity rent [src:IND-FOUNDRY-2026-09#p3].
      The study's judgement on the 1–5 year horizon is that a cyclical downturn at some point is “likely” and permanent damage “unlikely”, with medium confidence [src:IND-FOUNDRY-2026-09#p16].
      A gross margin below the floor without a collapse in demand corresponds to the study's condition for overturning its second core thesis (foundry has become a toll gate that earns design-level margins) [src:IND-FOUNDRY-2026-09#p3]; the study's other overturning condition is TSMC's ROE falling below the high teens for several years in a row without a collapse in demand [src:IND-FOUNDRY-2026-09#p19].
      High fixed costs make profit very sensitive to utilisation: depreciation was 42% of TSMC's cost of revenue in 2025 (the study's calculation) [src:IND-FOUNDRY-2026-09#p14], and in the 2023 downturn TSMC's gross margin fell from 59.6% to 54.4% [src:IND-FOUNDRY-2026-09#p15].
      New overseas fabs are expected to dilute gross margin by 2–3 percentage points at first, widening later to 3–4 percentage points [src:IND-FOUNDRY-2026-09#p16]; the study lists this dilution as the cost of relocating capacity [src:IND-FOUNDRY-2026-09#p19], and the threshold is judged on the reported value because the dilution itself is one of the things this signpost tests.
    tests_to_rerun: [pricing_power, returns_on_capital, growth, free_cash_flow, moat]

  - id: FOUNDRY-SP3
    title: Advanced packaging's share of foundry revenue
    observable: >-
      Advanced packaging revenue as a share of TSMC's total revenue, read from the full-year figure management gives on the fourth-quarter earnings call;
      also watch the other early signal the study lists, whether customers co-design packaging with the foundry [src:IND-FOUNDRY-2026-09#p16], and who develops and who manufactures the integrated logic-and-HBM packaging used by data-centre AI accelerators in volume production.
    threshold: >-
      Triggered if any condition is met:
      (1) the full-year advanced packaging share of revenue disclosed by TSMC's management reaches or exceeds 15%; when only an approximate figure is given, the literal lower bound is recorded (for example, “slightly over 10%” is recorded as 10%). 15% is a threshold set in advance, a clear rise from slightly over 10% in 2025 [src:IND-FOUNDRY-2026-09#p8].
      (2) a design company's current latest-generation data-centre AI accelerator, in volume shipments, has its integrated logic-and-HBM packaging done by a company other than the logic foundry, using that company's own packaging architecture (memory makers, integrated device makers and independent packaging and test houses all count), as disclosed by the design company or the packaging supplier or confirmed by an independent teardown; a foundry licensing or outsourcing its own packaging architecture to others does not count.
    rule:
      any_of:
        - op: ">="
          threshold: 15
          unit: "%"
          period: year
          metric: tsmc_advanced_packaging_revenue_share
          note: Full-year share disclosed by management; when only an approximate figure is given, the literal lower bound is recorded
        - op: event
          period: event
          metric: ai_accelerator_packaging_architecture_outside_logic_foundry
          threshold: The current latest-generation data-centre AI accelerator using, in volume production, an integrated packaging architecture of a company other than the logic foundry
          note: Corresponds to the failure condition the study lists for integrated advanced packaging, and to the overturning case of a new packaging architecture led from the start by a company other than the incumbents
    check_frequency: quarterly
    data_source: >-
      statements on the advanced packaging share of revenue in TSMC's fourth-quarter earnings call transcripts and Management Report (investor.tsmc.com);
      TrendForce reports on CoWoS capacity, supply and demand;
      descriptions of packaging solutions and packaging suppliers in the product launches and annual reports of the main data-centre AI accelerator design companies, and analyses by independent teardown firms such as TechInsights.
    current_reading:
      value: 10
      unit: "%"
      period: FY2025
      as_of: 2025-12-31
      source: IND-FOUNDRY-2026-09#p8
      note: >-
        Management's words were that advanced packaging was “slightly over 10%” of revenue in 2025, recorded here at the literal lower bound, 10% [src:IND-FOUNDRY-2026-09#p8].
        TSMC's CoWoS capacity in 2026 is reportedly estimated at 120,000–140,000 wafers a month [src:IND-FOUNDRY-2026-09#p10].
    implication: >-
      A steadily rising share is consistent with the change the study describes on the 10–20 year horizon: the fall in unit cost from transistor scaling keeps weakening and value moves to packaging and system design, and the study judges a shift in where value sits “very likely” and value moving away from the leader “uncertain”, with low confidence [src:IND-FOUNDRY-2026-09#p16].
      If the quantitative condition triggers, value concentrates in foundries with advanced packaging capability: the study lists such foundries as likely winners and independent packaging and test houses and sub-scale foundries as likely losers [src:IND-FOUNDRY-2026-09#p19], because owning both wafers and packaging lets the leader sell the bottleneck as one product [src:IND-FOUNDRY-2026-09#p10].
      If the event condition triggers, the bottleneck may move out of the foundry: the study lists a new packaging solution from a memory maker or an integrated device maker as a failure condition for the advantage of integrated advanced packaging [src:IND-FOUNDRY-2026-09#p11], and a new packaging architecture led from the start by a company other than the incumbents as one of the cases that could prove its view wrong [src:IND-FOUNDRY-2026-09#p19].
    tests_to_rerun: [moat, competition, growth, capital_allocation]

  - id: FOUNDRY-SP4
    title: Leading-edge output and margins of China's foundry system
    observable: >-
      The leading-edge progress of mainland Chinese foundries (SMIC, Hua Hong and others), that is, whether they achieve volume production at 5nm class, and SMIC's quarterly gross margin, supported by TrendForce's estimate of mainland China's share of global mature-node foundry capacity [src:IND-FOUNDRY-2026-09#p16].
      The path the study envisages is domestic equipment plus state demand reaching 5nm-class output [src:IND-FOUNDRY-2026-09#p16].
    threshold: >-
      Triggered if any condition is met:
      (1) a mainland Chinese foundry produces logic chips in volume on a 5nm-class process: the foundry discloses that its 5nm-class process is in volume production, or an independent teardown firm finds, in a product on public sale, a logic chip made by a mainland Chinese foundry on a 5nm-class process.
      (2) SMIC's quarterly gross margin at or above 45% for 4 consecutive quarters. 45% is the top of the followers' gross margin range recorded by the study (from negative to 45%) [src:IND-FOUNDRY-2026-09#p4], and close to the leader's level in its weakest recent year (TSMC's 46.0% in 2019) [src:IND-FOUNDRY-2026-09#p9]; the study points out that the leader's weakest recent year is roughly the followers' best year [src:IND-FOUNDRY-2026-09#p16].
      (3) TrendForce's estimate of mainland China's share of mature-node foundry capacity for the current or a past year exceeds 39%, forward projections not being used, that is, above the top of the 2027 projected range the study cites (33–39%) [src:IND-FOUNDRY-2026-09#p17].
    rule:
      any_of:
        - op: event
          period: event
          metric: china_foundry_5nm_class_volume_production
          threshold: A mainland Chinese foundry producing logic chips in volume on a 5nm-class process, confirmed by company disclosure or an independent teardown
        - op: ">="
          threshold: 45
          unit: "%"
          consecutive: 4
          period: quarter
          metric: smic_gross_margin
          note: Gross margin in SMIC's quarterly results announcements
        - op: ">"
          threshold: 39
          unit: "%"
          period: year
          metric: china_share_of_global_mature_node_foundry_capacity
          note: TrendForce's estimate for the current or a past year; forward projections are not used
    check_frequency: quarterly
    data_source: >-
      SMIC's quarterly results announcements (HKEXnews at hkexnews.hk, and smics.com): gross margin, capacity utilisation and revenue mix;
      Hua Hong's quarterly results announcements (hkexnews.hk);
      analyses of Chinese-made advanced chips by independent teardown firms such as TechInsights;
      TrendForce reports on foundry capacity shares by region.
    current_reading:
      value: 25.3
      unit: "%"
      period: 2Q26
      as_of: 2026-06-30
      source: IND-FOUNDRY-2026-09#p16
      note: >-
        This is SMIC's gross margin in Q2 2026; its capacity utilisation in the same quarter was 93.7% [src:IND-FOUNDRY-2026-09#p16].
        SMIC's gross margin for full-year 2025 was 21%, against 59.9% at TSMC in the same year, and by 2023 SMIC had made 7nm-class chips without EUV equipment [src:IND-FOUNDRY-2026-09#p13]; the most advanced output the study records is still 7nm class [src:IND-FOUNDRY-2026-09#p17].
        Mainland China's share of mature-node foundry capacity was 29% in 2023 [src:IND-FOUNDRY-2026-09#p17].
    implication: >-
      Volume production at 5nm class by a mainland Chinese foundry, or an SMIC gross margin close to the leader's, would mean that protected demand plus state money has produced more than just a viable second ecosystem.
      The study's third core thesis (without volume, money cannot buy the leading process) is currently supported commercially, with Intel Foundry losing $30.6 billion in 2023–25, and the counter-case prevails only on China's sovereign capability [src:IND-FOUNDRY-2026-09#p3]; a trigger would show the counter-evidence starting to extend from sovereign capability to commercial returns (this module's inference).
      The study's judgement on the 5–10 year horizon is that pressure on mature-node prices is “likely” and the leader losing leading-edge customers outside China “unlikely”, with low confidence [src:IND-FOUNDRY-2026-09#p16].
      The study holds that mature-node prices will increasingly be set by China's capacity expansion [src:IND-FOUNDRY-2026-09#p3]; a Chinese share above the top of the projection would show expansion outpacing the projection the study cites [src:IND-FOUNDRY-2026-09#p17], and utilisation and prices at mature-node foundries outside China would come under pressure sooner (this module's inference).
    tests_to_rerun: [competition, pricing_power, moat, regulation]

  - id: FOUNDRY-SP5
    title: Tariffs, relocation of capacity and production in Taiwan
    observable: >-
      Since January 2026 the US has levied a 25% tariff on certain advanced computing chips, with relief for companies building fabs in the US [src:IND-FOUNDRY-2026-09#p19]; this signpost watches whether the US formally imposes a second phase of chip tariffs, and its coverage, rates and relief conditions tied to US production [src:IND-FOUNDRY-2026-09#p16].
      Also watch TSMC's guidance on margin dilution from new overseas fabs and the overseas share of capacity [src:IND-FOUNDRY-2026-09#p16], whether Taiwan amends its N-2 rule requiring overseas fabs to be at least two process generations behind [src:IND-FOUNDRY-2026-09#p19], and whether wafer production in Taiwan is interrupted by conflict, blockade or sanctions [src:IND-FOUNDRY-2026-09#p17].
    threshold: >-
      Triggered if any condition is met:
      (1) the US formally imposes new semiconductor import tariffs by presidential proclamation (or a document published in the Federal Register on that basis), that is, it widens the product scope or raises the rate beyond the measure levying a 25% tariff on certain advanced computing chips from January 2026; coverage, rates and relief conditions are recorded at review. Statements by officials or media reports alone do not count.
      (2) TSMC raises its guidance for margin dilution from new overseas fabs so that the upper end exceeds 4 percentage points; the current guidance is 2–3 percentage points at first and 3–4 percentage points later [src:IND-FOUNDRY-2026-09#p16].
      (3) Taiwan formally relaxes or tightens the N-2 rule, as shown by an announcement of the competent authority.
      (4) wafer production or shipments in Taiwan are interrupted by conflict, blockade or sanctions, as shown by a TSMC material information announcement or an announcement of a Taiwanese authority; stoppages caused by natural disasters such as earthquakes do not count.
    rule:
      any_of:
        - op: event
          period: event
          metric: us_phase2_semiconductor_tariff_in_force
          threshold: The US formally imposing semiconductor import tariffs beyond the scope or rates of the January 2026 measures
        - op: ">"
          threshold: 4
          unit: pp
          period: quarter
          metric: tsmc_overseas_fab_margin_dilution_guidance_upper
          note: The upper end of TSMC's guidance range
        - op: event
          period: event
          metric: taiwan_n2_rule_amended
          threshold: Taiwan formally relaxing or tightening the rule that overseas fabs must be at least two process generations behind
        - op: event
          period: event
          metric: taiwan_wafer_production_disrupted
          threshold: Wafer production or shipments in Taiwan interrupted by conflict, blockade or sanctions
    check_frequency: monthly
    data_source: >-
      adjustments to semiconductor imports in White House presidential proclamations (whitehouse.gov/presidential-actions) and the Federal Register (federalregister.gov), with the presidential proclamation of 14 January 2026 cited by the study as the baseline, plus the Department of Commerce's press releases and fact sheets;
      statements on margin dilution from new overseas fabs and on overseas capacity in TSMC's quarterly earnings call transcripts;
      announcements by Taiwan's Ministry of Economic Affairs and other competent authorities on process restrictions for outbound investment (the N-2 rule);
      material information announcements TSMC publishes on the Taiwan Stock Exchange's Market Observation Post System (mops.twse.com.tw).
    current_reading:
      value: "Not triggered: when the study was written, a second phase of chip tariffs was still under consideration (September 2026)"
      period: "2026-09"
      as_of: 2026-09-16
      source: IND-FOUNDRY-2026-09#p16
      note: >-
        The reports the study cites were published on 27 August 2026 and 3 September; the first said the US was considering a new round of semiconductor tariffs, the second that chip tariffs would come, with relief tied to US manufacturing [src:IND-FOUNDRY-2026-09#p23].
        The N-2 rule was reaffirmed in December 2025 [src:IND-FOUNDRY-2026-09#p19].
        TSMC's US investment plan grew from the $165 billion announced in March 2025 to $265 billion [src:IND-FOUNDRY-2026-09#p17].
    implication: >-
      The study holds that this risk works within 1–5 years through tariff relief tied to local production and customers insisting on capacity outside Taiwan, and that the costs of new fabs in the US, Japan and Europe will dilute gross margins [src:IND-FOUNDRY-2026-09#p16].
      The study judges dilution of 2–4 percentage points as guided “likely” and a loss of share “unlikely”, with medium confidence, and the counter-argument is that costs can be passed on to customers, as reports of price rises suggest [src:IND-FOUNDRY-2026-09#p16].
      The study holds that relocation mainly changes where the leader produces, not who leads, because most of the new leading-edge capacity in the US belongs to TSMC itself, while the N-2 rule keeps the newest node in Taiwan [src:IND-FOUNDRY-2026-09#p19].
      If the N-2 rule is amended, where the newest node is produced may change with it, and the judgement above would need re-testing (this module's inference).
      If production in Taiwan is interrupted, what suffers is the economics of the whole industry chain, not the split of share among firms [src:IND-FOUNDRY-2026-09#p3]; the study holds that this tail risk cannot responsibly be forecast and is not part of any base case [src:IND-FOUNDRY-2026-09#p17].
    tests_to_rerun: [regulation, returns_on_capital, capital_allocation, free_cash_flow, pricing_power]

  - id: FOUNDRY-SP6
    title: Mature-node capacity utilisation outside China
    observable: >-
      The quarterly capacity utilisation of mature-node foundries outside mainland China, with UMC's quarterly published utilisation as the main proxy, supported by TrendForce reports on mature-node utilisation and pricing;
      also confirm whether mainland China's mature-node capacity is still growing, based on the capacity disclosures of SMIC and Hua Hong and TrendForce's estimates.
      For reference: the study quotes TrendForce that mature-node prices rose 5–15% in the first half of 2026 because AI-related demand absorbed capacity [src:IND-FOUNDRY-2026-09#p16].
    threshold: >-
      Two directions; either triggers:
      Upside: UMC's quarterly capacity utilisation above 90% for 4 consecutive quarters while mainland China's mature-node capacity is still growing over the same period. The study lists mature-node utilisation outside China staying above 90% through 2028 while China keeps expanding as the condition that would overturn its mature-node thesis [src:IND-FOUNDRY-2026-09#p3]; 4 consecutive quarters is a threshold for an early review, and the full overturning condition can only be judged at the end of 2028.
      Downside: UMC's quarterly capacity utilisation below 80% for 2 consecutive quarters, that is, back in the 70–80% range of 2023–24 recorded by the study [src:IND-FOUNDRY-2026-09#p3]; UMC was at 71% in Q2 2023 [src:IND-FOUNDRY-2026-09#p15].
    rule:
      any_of:
        - all_of:
            - op: ">"
              threshold: 90
              unit: "%"
              consecutive: 4
              period: quarter
              metric: umc_capacity_utilization
              note: Capacity utilisation in UMC's quarterly earnings press releases
            - op: increase
              period: year
              metric: china_mature_node_foundry_capacity
              note: Mainland China's mature-node capacity up from the previous year, based on the capacity disclosures of SMIC and Hua Hong and TrendForce's estimates
        - op: "<"
          threshold: 80
          unit: "%"
          consecutive: 2
          period: quarter
          metric: umc_capacity_utilization
          note: Capacity utilisation in UMC's quarterly earnings press releases
    check_frequency: quarterly
    data_source: >-
      capacity utilisation in UMC's quarterly earnings press releases (UMC's investor relations website or businesswire; UMC's EDGAR CIK is 0001033767);
      capacity data in the quarterly results announcements of SMIC and Hua Hong (hkexnews.hk);
      TrendForce reports on mature-node utilisation, pricing and China's share of mature-node capacity.
    current_reading: null
    implication: >-
      An upside trigger would mean that mature-node pricing is not being set by China's expansion as the study expects.
      The counter-arguments the study lists are that mature-node chips are sticky (long qualification cycles), demand for power and analogue chips is rising, and prices have already risen in 2026 [src:IND-FOUNDRY-2026-09#p3]; a trigger would show these forces are strong enough to keep mature-node capacity outside China tight, and the pricing and returns of the foundries concerned may be better than the study judges (this module's inference).
      A downside trigger would mean mature nodes are back at the bottom of the cycle: in the 2023 downturn the study records, UMC's revenue fell 20% and its gross margin 10.2 percentage points, SMIC's gross margin fell from 38.0% to 19.3%, while TSMC's gross margin fell only 5.2 percentage points [src:IND-FOUNDRY-2026-09#p15].
    tests_to_rerun: [pricing_power, returns_on_capital, competition, unit_economics]

